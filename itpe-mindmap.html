O 표준 공통 구조(HLS) + <b>PDCA(Plan-Do-Check-Act)<\/b> 사이클 기반 지속 개선<\/li><li><b>핵심 요구사항 4축<\/b>:<ul class=\"kw\"><li><b>AI 위험 평가 (Risk Assessment)<\/b>: 편향·환각·프라이버시·보안 위험 식별 및 통제<\/li><li><b>AI 영향 평가 (Impact Assessment)<\/b>: 개인·사회·기본권에 미치는 영향 사전 분석<\/li><li><b>투명성 &amp; 설명가능성<\/b>: AI 사용 고지, 데이터 출처·한계 문서화<\/li><li><b>책임성 &amp; 인간 감독<\/b>: 조직 내 AI 책임자 지정 및 Human-in-the-Loop 통제<\/li><\/ul><\/li><li><b>국내 연계<\/b>: <b>AI 기본법(고영향 AI 책무)<\/b> 및 <b>AI TRiSM<\/b>을 조직 차원에서 인증·이행하는 표준 수단<\/li><\/ul>", "pp": "<div class=\"tblwrap\"><table class=\"cmp\"><colgroup><col style=\"width:24%\"><col style=\"width:28%\"><col style=\"width:48%\"><\/colgroup><thead><tr><th>관점(측면)<\/th><th>특징<\/th><th>설명<\/th><\/tr><\/thead><tbody><tr><td class=\"k\">프로세스 관점<\/td><td>PDCA + 2대 평가<\/td><td>계획(위험·영향평가)→실행(운영통제)→점검(감사)→개선(시정조치) 순환<\/td><\/tr><tr><td class=\"k\">조직 관점<\/td><td>R&amp;R · 인간 감독<\/td><td>최고경영진 리더십, AI 윤리·거버넌스 위원회, Human-in-the-Loop<\/td><\/tr><tr><td class=\"k\">리소스·기술 관점<\/td><td>데이터 계보 · XAI<\/td><td>학습 데이터 품질·출처 관리, 모델 카드, 편향·보안 탐지 도구 구축<\/td><\/tr><tr><td class=\"k\">제도·인증 관점<\/td><td>AI 기본법 대응 표준<\/td><td>글로벌 규제(EU AI Act·국내 AI 기본법) 준수를 대외 입증하는 인증 체계<\/td><\/tr><\/tbody><\/table><\/div>", "rv": "<div class=\"q\"><b>두음: 피·디·씨·에이 / 위·영·투·책<\/b> — PDCA(경영시스템 순환) 기반 위(위험평가)·영(영향평가)·투(투명성)·책(책임성)<\/div>\n<div class=\"q\"><b>AI 기본법 + AI TRiSM + ISO/IEC 42001<\/b>은 AI 거버넌스 삼총사로 묶어서 기억!<\/div>", "img": "itpe-diagrams/44-iso42001.webp", "txt": null, "search": "iso/iec 42001 (ai 경영시스템, aims) iso/iec 42001 (aims) ai 경영시스템 · pdca·위·영·투·책 정보전략·거버넌스 ai 법·거버넌스 ⭐⭐ 기출빈출 기출 빈출 중요 조직이 ai 시스템을 책임감 있게 개발·제공·활용할 수 있도록 ai 거버넌스, 위험 관리, 윤리·투명성 요구사항 을 규정한 세계 최초의 ai 경영시스템(aims) 국제표준 구조 : iso 표준 공통 구조(hls) + pdca(plan-do-check-act) 사이클 기반 지속 개선 핵심 요구사항 4축 : ai 위험 평가 (risk assessment) : 편향·환각·프라이버시·보안 위험 식별 및 통제 ai 영향 평가 (impact assessment) : 개인·사회·기본권에 미치는 영향 사전 분석 투명성 &amp; 설명가능성 : ai 사용 고지, 데이터 출처·한계 문서화 책임성 &amp; 인간 감독 : 조직 내 ai 책임자 지정 및 human-in-the-loop 통제 국내 연계 : ai 기본법(고영향 ai 책무) 및 ai trism 을 조직 차원에서 인증·이행하는 표준 수단 관점(측면) 특징 설명 프로세스 관점 pdca + 2대 평가 계획(위험·영향평가)→실행(운영통제)→점검(감사)→개선(시정조치) 순환 조직 관점 r&amp;r · 인간 감독 최고경영진 리더십, ai 윤리·거버넌스 위원회, human-in-the-loop 리소스·기술 관점 데이터 계보 · xai 학습 데이터 품질·출처 관리, 모델 카드, 편향·보안 탐지 도구 구축 제도·인증 관점 ai 기본법 대응 표준 글로벌 규제(eu ai act·국내 ai 기본법) 준수를 대외 입증하는 인증 체계 두음: 피·디·씨·에이 / 위·영·투·책 — pdca(경영시스템 순환) 기반 위(위험평가)·영(영향평가)·투(투명성)·책(책임성) ai 기본법 + ai trism + iso/iec 42001 은 ai 거버넌스 삼총사로 묶어서 기억!"}, {"id": "frontier-pacing", "cat": "gov", "sub": "gov-ai", "parent": null, "t": "프론티어 페이싱 (Frontier Pacing)", "s": "재·죄 / 상·공·국 / 투·독", "stars": 2, "redStar": false, "full": "프론티어 페이싱 (Frontier Pacing)", "catLabel": "정보전략·거버넌스", "st": "📌 복습 필요", "d": "2026-11-22", "def": "<p>프런티어 AI 개발을 전면 중단(Pause·Moratorium)하지 않으면서도, <b>안전성·정렬(Alignment) 검증과 감독 체계가 역량 발전을 따라잡을 수 있도록 개발·배포 속도를 의도적으로 조절(Pacing)<\/b>하는 AI 거버넌스 프레임워크<\/p>", "kw": "<ul class=\"kw\"><li><b>등장 배경 (재·죄)<\/b>: AI 연구 자동화(<b>재귀적 자기개선, RSI<\/b>)에 따른 통제 이탈 위험 + 기업·국가 간 무한 경쟁(<b>죄수의 딜레마<\/b>)으로 일방적 감속 불가<\/li><li><b>3단계 해법 (상·공·국)<\/b>:<ul class=\"kw\"><li><b>1단계 상주 평가<\/b>: <b>METR<\/b> 등 제3자 평가자에게 직원 수준 내부 접근권 및 편집권 없는 공개 권한 부여<\/li><li><b>2단계 공통 기준<\/b>: 민주주의 국가 프런티어 기업 간 공통 안전 기준·역량 속도 제한 합의·입법<\/li><li><b>3단계 국제 협력<\/b>: 중국 등 경쟁국 포함 고위험 용도(생물무기 등) 제한 및 글로벌 <b>컴퓨팅(GPU) 검증<\/b> 협상<\/li><\/ul><\/li><\/ul>", "pp": "<div class=\"tblwrap\"><table class=\"cmp\"><colgroup><col style=\"width:24%\"><col style=\"width:28%\"><col style=\"width:48%\"><\/colgroup><thead><tr><th>관점(측면)<\/th><th>특징<\/th><th>설명<\/th><\/tr><\/thead><tbody><tr><td class=\"k\">프로세스 관점<\/td><td>3단계 점진적 속도 조절<\/td><td>상주 평가(자율) → 동맹국 공통 기준(입법) → 글로벌 컴퓨팅 검증 협상(조약)<\/td><\/tr><tr><td class=\"k\">조직·검증 관점<\/td><td>독립 제3자 상주 평가<\/td><td>기업 내부 감사와 달리 편집권 없는 외부 공개 권한으로 투명성·신뢰성 확보<\/td><\/tr><tr><td class=\"k\">리소스·기술 관점<\/td><td>컴퓨팅(GPU)·평가 인프라<\/td><td>대규모 학습 클러스터(GPU·데이터센터) 추적 및 학습 파이프라인 상시 점검<\/td><\/tr><tr><td class=\"k\">쟁점·리스크 관점<\/td><td>안전 투명성 vs 규제 독점<\/td><td>추진론(RSI 통제 필수) vs 신중론(출시 전 검증 우선, 규제가 선발 빅테크 해자로 악용 우려)<\/td><\/tr><\/tbody><\/table><\/div>", "rv": "<div class=\"q\"><b>두음: 재·죄 / 상·공·국 / 투·독<\/b> — 재귀개선·죄수딜레마 / 상주평가·공통기준·국제협력 / 투명성·독점우려<\/div>\n<div class=\"q\"><b>개발 중단(Pause)이 아니라 안전 검증을 위한 속도 조절(Pacing)<\/b>임을 첫 줄 정의에 명확히 구분!<\/div>", "img": "itpe-diagrams/77-frontier-pacing.webp", "txt": null, "search": "프론티어 페이싱 (frontier pacing) 프론티어 페이싱 (frontier pacing) 재·죄 / 상·공·국 / 투·독 정보전략·거버넌스 ai 법·거버넌스 ⭐⭐ 기출빈출 기출 빈출 중요 프런티어 ai 개발을 전면 중단(pause·moratorium)하지 않으면서도, 안전성·정렬(alignment) 검증과 감독 체계가 역량 발전을 따라잡을 수 있도록 개발·배포 속도를 의도적으로 조절(pacing) 하는 ai 거버넌스 프레임워크 등장 배경 (재·죄) : ai 연구 자동화( 재귀적 자기개선, rsi )에 따른 통제 이탈 위험 + 기업·국가 간 무한 경쟁( 죄수의 딜레마 )으로 일방적 감속 불가 3단계 해법 (상·공·국) : 1단계 상주 평가 : metr 등 제3자 평가자에게 직원 수준 내부 접근권 및 편집권 없는 공개 권한 부여 2단계 공통 기준 : 민주주의 국가 프런티어 기업 간 공통 안전 기준·역량 속도 제한 합의·입법 3단계 국제 협력 : 중국 등 경쟁국 포함 고위험 용도(생물무기 등) 제한 및 글로벌 컴퓨팅(gpu) 검증 협상 관점(측면) 특징 설명 프로세스 관점 3단계 점진적 속도 조절 상주 평가(자율) → 동맹국 공통 기준(입법) → 글로벌 컴퓨팅 검증 협상(조약) 조직·검증 관점 독립 제3자 상주 평가 기업 내부 감사와 달리 편집권 없는 외부 공개 권한으로 투명성·신뢰성 확보 리소스·기술 관점 컴퓨팅(gpu)·평가 인프라 대규모 학습 클러스터(gpu·데이터센터) 추적 및 학습 파이프라인 상시 점검 쟁점·리스크 관점 안전 투명성 vs 규제 독점 추진론(rsi 통제 필수) vs 신중론(출시 전 검증 우선, 규제가 선발 빅테크 해자로 악용 우려) 두음: 재·죄 / 상·공·국 / 투·독 — 재귀개선·죄수딜레마 / 상주평가·공통기준·국제협력 / 투명성·독점우려 개발 중단(pause)이 아니라 안전 검증을 위한 속도 조절(pacing) 임을 첫 줄 정의에 명확히 구분!"}, {"id": "disposable-apps", "cat": "gov", "sub": "gov-ai", "parent": null, "t": "일회용 애플리케이션", "s": "바이브 코딩 · 섀도우 IT", "stars": 1, "redStar": false, "full": "일회용 애플리케이션 (Disposable App) · 바이브 코딩", "catLabel": "정보전략·거버넌스", "st": "📌 복습 필요", "d": "2026-11-25", "def": "<p><b>일회용 애플리케이션(Disposable/Ephemeral App)<\/b>은 바이브 코딩(<b>Vibe Coding<\/b>)과 AI 코드 생성을 활용해 특정 업무 목적에 맞춰 <b>단기간 제작·사용 후 즉시 폐기<\/b>하는 <b>초단기 목적성 소프트웨어<\/b><\/p>", "kw": "<ul class=\"kw\"><li><b>바이브 코딩<\/b>: 자연어 프롬프트로 코드를 생성·수정하고 결과(동작)만 확인하는 개발 방식 — 생성 속도↑, 검증·유지보수 책임은 사람에게 남음<\/li><li><b>Ephemeral · Disposable<\/b>: 단일 목적·짧은 수명이 전제 — 사용 후 데이터·권한·인프라를 <b>회수<\/b>해야 완결<\/li><li><b>섀도우 IT<\/b>: IT 승인 없이 현업이 만든 그림자 시스템 — 자산·데이터 흐름 파악 불가, 감사 대응 곤란<\/li><li><b>시민 개발자(Citizen Developer)<\/b>: Low-code/No-code와 AI 생성으로 개발 주체가 현업으로 확대<\/li><li><b>거버넌스 장치<\/b>: 앱 카탈로그·등록, 승인 게이트, 최소 권한·만료(TTL), 코드·데이터 감사, AI 생성 코드 검증<\/li><li><b>주요 리스크<\/b>: 프롬프트에 입력된 개인정보·기밀 유출, 취약 코드·하드코딩 자격증명, 폐기 후 잔존 데이터<\/li><\/ul>", "pp": "<h4>1) 전통 애플리케이션 vs 일회용 애플리케이션<\/h4>\n<div class=\"tblwrap\"><table class=\"cmp\"><colgroup><col style=\"width:24%\"><col style=\"width:28%\"><col style=\"width:48%\"><\/colgroup><thead><tr><th>구분<\/th><th>전통 애플리케이션<\/th><th>일회용 애플리케이션<\/th><\/tr><\/thead><tbody><tr><td class=\"k\">개발 주체<\/td><td>IT 조직·전문 개발자<\/td><td>현업·개인 + AI(바이브 코딩)<\/td><\/tr><tr><td class=\"k\">개발 기간<\/td><td>수주~수개월<\/td><td>수분~수일<\/td><\/tr><tr><td class=\"k\">수명·목적<\/td><td>장기 운영·다수 사용자<\/td><td>단일 목적·1회성<\/td><\/tr><tr><td class=\"k\">관리 체계<\/td><td>형상·변경·배포 표준 적용<\/td><td>표준 밖(섀도우 IT) 위험<\/td><\/tr><tr><td class=\"k\">데이터<\/td><td>중앙 관리·통제<\/td><td>개인 단말·클라우드에 분산<\/td><\/tr><tr><td class=\"k\">통제 수단<\/td><td>SDLC·감리·접근통제<\/td><td>카탈로그·권한 만료·자동 폐기<\/td><\/tr><\/tbody><\/table><\/div>\n<h4>2) 거버넌스 대응 체계<\/h4>\n<div class=\"tblwrap\"><table class=\"cmp\"><colgroup><col style=\"width:24%\"><col style=\"width:28%\"><col style=\"width:48%\"><\/colgroup><thead><tr><th>구분<\/th><th>특징<\/th><th>설명<\/th><\/tr><\/thead><tbody><tr><td class=\"k\">관리적<\/td><td>정책·등록·승인<\/td><td>일회용 앱 정의·사용 기준, 앱 카탈로그 등록과 부서장 승인 게이트 운영<\/td><\/tr><tr><td class=\"k\">기술적<\/td><td>최소 권한·샌드박스<\/td><td>업무별 최소 권한, 기업 계정 분리, 실행 격리·데이터 마스킹<\/td><\/tr><tr><td class=\"k\">운영적<\/td><td>만료·폐기 자동화<\/td><td>TTL·자동 회수, 폐기 시 데이터 삭제·권한 반납 증적 확인<\/td><\/tr><tr><td class=\"k\">감사·보안<\/td><td>코드·접근 감사<\/td><td>AI 생성 코드 취약점 점검, 접근·반출 로그, 프롬프트 기밀 유출 차단<\/td><\/tr><tr><td class=\"k\">성과<\/td><td>생산성·혁신<\/td><td>현업 자동화 성과를 측정해 정식 과제로 승격(Promotion)하는 통로 마련<\/td><\/tr><\/tbody><\/table><\/div>\n<h4>3) 도입 시 고려사항<\/h4>\n<div class=\"tblwrap\"><table class=\"cmp\"><colgroup><col style=\"width:24%\"><col style=\"width:28%\"><col style=\"width:48%\"><\/colgroup><thead><tr><th>구분<\/th><th>키워드<\/th><th>설명<\/th><\/tr><\/thead><tbody><tr><td class=\"k\">그림자 IT<\/td><td>가시성 확보<\/td><td>SSO·CASB·클라우드 자산 스캔으로 미등록 앱 발견<\/td><\/tr><tr><td class=\"k\">데이터<\/td><td>반출 통제<\/td><td>개인정보·기밀 입력 금지, DLP·프롬프트 필터 적용<\/td><\/tr><tr><td class=\"k\">책임<\/td><td>소유자 지정<\/td><td>앱별 업무 책임자·데이터 주관 부서를 지정해 책임 소재 명확화<\/td><\/tr><tr><td class=\"k\">지속성<\/td><td>승격 기준<\/td><td>반복 사용·다수 사용자 앱은 정식 개발·운영 체계로 이관<\/td><\/tr><\/tbody><\/table><\/div>", "rv": "<div class=\"q\"><b>두음: 생·사·폐 / 등·권·감<\/b> — 생성·사용·폐기 / 등록·권한·감사<\/div>\n<div class=\"q\"><b>\"만들기는 쉬워졌지만, 등록·권한·폐기가 없으면 그것은 그림자 IT다\"<\/b><\/div>", "img": "itpe-diagrams/121-disposable-apps.webp", "txt": null, "search": "일회용 애플리케이션 (disposable app) · 바이브 코딩 일회용 애플리케이션 바이브 코딩 · 섀도우 it 정보전략·거버넌스 ai 법·거버넌스 ⭐ 기출빈출 기출 빈출 중요 일회용 애플리케이션(disposable/ephemeral app) 은 바이브 코딩( vibe coding )과 ai 코드 생성을 활용해 특정 업무 목적에 맞춰 단기간 제작·사용 후 즉시 폐기 하는 초단기 목적성 소프트웨어 바이브 코딩 : 자연어 프롬프트로 코드를 생성·수정하고 결과(동작)만 확인하는 개발 방식 — 생성 속도↑, 검증·유지보수 책임은 사람에게 남음 ephemeral · disposable : 단일 목적·짧은 수명이 전제 — 사용 후 데이터·권한·인프라를 회수 해야 완결 섀도우 it : it 승인 없이 현업이 만든 그림자 시스템 — 자산·데이터 흐름 파악 불가, 감사 대응 곤란 시민 개발자(citizen developer) : low-code/no-code와 ai 생성으로 개발 주체가 현업으로 확대 거버넌스 장치 : 앱 카탈로그·등록, 승인 게이트, 최소 권한·만료(ttl), 코드·데이터 감사, ai 생성 코드 검증 주요 리스크 : 프롬프트에 입력된 개인정보·기밀 유출, 취약 코드·하드코딩 자격증명, 폐기 후 잔존 데이터 1) 전통 애플리케이션 vs 일회용 애플리케이션 구분 전통 애플리케이션 일회용 애플리케이션 개발 주체 it 조직·전문 개발자 현업·개인 + ai(바이브 코딩) 개발 기간 수주~수개월 수분~수일 수명·목적 장기 운영·다수 사용자 단일 목적·1회성 관리 체계 형상·변경·배포 표준 적용 표준 밖(섀도우 it) 위험 데이터 중앙 관리·통제 개인 단말·클라우드에 분산 통제 수단 sdlc·감리·접근통제 카탈로그·권한 만료·자동 폐기 2) 거버넌스 대응 체계 구분 특징 설명 관리적 정책·등록·승인 일회용 앱 정의·사용 기준, 앱 카탈로그 등록과 부서장 승인 게이트 운영 기술적 최소 권한·샌드박스 업무별 최소 권한, 기업 계정 분리, 실행 격리·데이터 마스킹 운영적 만료·폐기 자동화 ttl·자동 회수, 폐기 시 데이터 삭제·권한 반납 증적 확인 감사·보안 코드·접근 감사 ai 생성 코드 취약점 점검, 접근·반출 로그, 프롬프트 기밀 유출 차단 성과 생산성·혁신 현업 자동화 성과를 측정해 정식 과제로 승격(promotion)하는 통로 마련 3) 도입 시 고려사항 구분 키워드 설명 그림자 it 가시성 확보 sso·casb·클라우드 자산 스캔으로 미등록 앱 발견 데이터 반출 통제 개인정보·기밀 입력 금지, dlp·프롬프트 필터 적용 책임 소유자 지정 앱별 업무 책임자·데이터 주관 부서를 지정해 책임 소재 명확화 지속성 승격 기준 반복 사용·다수 사용자 앱은 정식 개발·운영 체계로 이관 두음: 생·사·폐 / 등·권·감 — 생성·사용·폐기 / 등록·권한·감사 \"만들기는 쉬워졌지만, 등록·권한·폐기가 없으면 그것은 그림자 it다\""}, {"id": "gartner-2027", "cat": "gov", "sub": "gov-strategy", "parent": null, "t": "가트너 2027 10대 전략 기술", "s": "대·음·월 / 컨·하·신·자 / 소·일·웻", "stars": 3, "redStar": false, "full": "가트너 2027년 10대 전략 기술 트렌드", "catLabel": "정보전략·거버넌스", "st": "📌 복습 필요", "d": "2026-11-22", "def": "<p>가트너(Gartner IT Symposium/Xpo, 2026.10 발표)가 제시한 2027년 핵심 IT 전략 방향으로, 단순 AI 도입을 넘어 <b>\"자율화(Autonomy) 시대의 기계 통제·거버넌스·지속 가능한 민첩성\"<\/b>을 구현하기 위한 3대 테마 · 10대 전략 기술<\/p>", "kw": "<h4>1. 비텍스트 AI 프론티어 (대·음·월)<\/h4>\n<ul class=\"kw\"><li><b>① 대규모 정량 모델 (LQM, Large Quantitative Models)<\/b>: 언어(LLM) 대신 수치·물리 법칙·시계열 데이터를 처리하는 하이브리드 신경망 모델 (<code>정량 예측<\/code>, <code>시뮬레이션<\/code>, <code>금융·제조 의사결정<\/code>)<\/li><li><b>② 음성 추론 모델 (Speech Reasoning Models)<\/b>: STT 변환 없이 오디오 억양·감정·맥락을 직접 분석해 다음 행동까지 자율 판단하는 음성 AI (<code>실시간 의도 파악<\/code>, <code>고객 응대 자동화<\/code>, <code>음성 프라이버시<\/code>)<\/li><li><b>③ 월드 모델 (World Models)<\/b>: 물리 법칙·시공간·인과관계를 학습해 행동 전 미래 상태를 3D 시뮬레이션·예측하는 모델 (<code>피지컬 AI<\/code>, <code>로보틱스·자율주행<\/code>, <code>공간 컴퓨팅<\/code>)<\/li><\/ul>\n<h4>2. 자율 에이전트 거버넌스 (컨·하·신·자)<\/h4>\n<ul class=\"kw\"><li><b>④ AI 컨텍스트 플랫폼 (AI Context Platforms)<\/b>: 정형·비정형 기업 데이터, 업무 규칙, 시맨틱 관계를 통합해 에이전트에게 맥락을 공급하는 계층 (<code>시맨틱 데이터<\/code>, <code>정확도 80%↑·비용 60%↓<\/code>, <code>상호운용성<\/code>)<\/li><li><b>⑤ AI 코딩 에이전트 하네스 (AI Coding Agent Harness)<\/b>: AI가 생성한 코드와 SDLC 전 주기를 감싸 규칙 준수·품질·보안을 자동 검증하는 폐쇄형 제어 체계 (<code>거버넌스 역전 방지<\/code>, <code>SDLC 제어 평면<\/code>, <code>자동 검증<\/code>)<\/li><li><b>⑥ AI 에이전트 신원 (AI Agent Identity)<\/b>: 사람 대신 작동하는 AI 에이전트·머신의 신원을 식별하고 최소·동적 권한을 부여하는 인증 체계 (<code>JIT 동적 접근 제어<\/code>, <code>정적 키 제거<\/code>, <code>행위 감사 추적<\/code>)<\/li><li><b>⑦ 자율형 노출 개선 (AER, Autonomous Exposure Remediation)<\/b>: 보안 취약점을 AI로 자동 탐지·우선순위화하고 가상 패치·운영 배포까지 자동화하는 방어 체계 (<code>취약점 자동 패치<\/code>, <code>지속적 노출 관리<\/code>, <code>DevSecOps 연계<\/code>)<\/li><\/ul>\n<h4>3. 지속 가능한 민첩성 (소·일·웻)<\/h4>\n<ul class=\"kw\"><li><b>⑧ 소버린 테크 (SovereignTech, SovTech)<\/b>: 특정 빅테크·국가 종속을 피하고 기술·법적 탈출 전략(Exit Strategy)을 보장하는 주권형 인프라·모델 (<code>탈종속(No Lock-in)<\/code>, <code>데이터·AI 주권<\/code>, <code>지정학 리스크 대응<\/code>)<\/li><li><b>⑨ 일회성 애플리케이션 (Disposable Applications)<\/b>: 단기 비즈니스 목적을 위해 빠르게 만들고, 목적 달성·가치 소멸 시 폐기(Decommission)를 전제한 동적 SW (<code>레거시 축소<\/code>, <code>초단기 수명주기<\/code>, <code>유지보수 비용 절감<\/code>)<\/li><li><b>⑩ 서비스형 웻웨어 (WaaS, Wetware as a Service)<\/b>: 실리콘 반도체 전력·냉각 한계를 넘기 위해 생체·합성 신경망(유기 프로세서)을 클라우드로 제공하는 차세대 컴퓨팅 (<code>생체 뉴런 컴퓨팅<\/code>, <code>초저전력(뇌 20W 수준)<\/code>, <code>생명윤리·재현성<\/code>)<\/li><\/ul>", "pp": "<div class=\"tblwrap\"><table class=\"cmp\"><colgroup><col style=\"width:24%\"><col style=\"width:28%\"><col style=\"width:48%\"><\/colgroup><thead><tr><th>관점(측면)<\/th><th>특징<\/th><th>설명<\/th><\/tr><\/thead><tbody><tr><td class=\"k\">AI 모델 확장 관점<\/td><td>비텍스트(수치·음성·물리)<\/td><td>LQM(정량 예측)·음성 추론·월드 모델(시공간/물리 시뮬레이션)로 텍스트 중심 LLM 한계 극복<\/td><\/tr><tr><td class=\"k\">거버넌스·통제 관점<\/td><td>에이전트 제어 평면 구축<\/td><td>컨텍스트 플랫폼(시맨틱)·코딩 하네스(SDLC 검증)·동적 JIT 에이전트 신원·AER(자동 패치)<\/td><\/tr><tr><td class=\"k\">아키텍처·주권 관점<\/td><td>탈종속·유연한 수명주기<\/td><td>소버린 테크(벤더·지정학 탈출 전략)와 목적 달성 후 폐기를 전제한 일회성 앱(Disposable)<\/td><\/tr><tr><td class=\"k\">차세대 컴퓨팅 관점<\/td><td>에너지 한계 돌파(WaaS)<\/td><td>실리콘 전력·냉각 한계를 극복하기 위한 생체·합성 뉴런 기반 서비스형 웻웨어(Wetware) 탐색<\/td><\/tr><\/tbody><\/table><\/div>", "rv": "<div class=\"q\"><b>두음: 대·음·월 / 컨·하·신·자 / 소·일·웻<\/b> — 3대 테마별 10개 기술 암기!<\/div>\n<div class=\"q\"><b>2027년 시험 대비 필수 시사 토픽<\/b>: 특히 <b>AI 에이전트 신원·컨텍스트 플랫폼·소버린 테크·월드 모델<\/b>은 단독 1교시 출제 1순위!<\/div>", "img": "itpe-diagrams/82-gartner-2027-trends.webp", "txt": null, "search": "가트너 2027년 10대 전략 기술 트렌드 가트너 2027 10대 전략 기술 대·음·월 / 컨·하·신·자 / 소·일·웻 정보전략·거버넌스 전략·ea ⭐⭐⭐ 기출빈출 기출 빈출 중요 가트너(gartner it symposium/xpo, 2026.10 발표)가 제시한 2027년 핵심 it 전략 방향으로, 단순 ai 도입을 넘어 \"자율화(autonomy) 시대의 기계 통제·거버넌스·지속 가능한 민첩성\" 을 구현하기 위한 3대 테마 · 10대 전략 기술 1. 비텍스트 ai 프론티어 (대·음·월) ① 대규모 정량 모델 (lqm, large quantitative models) : 언어(llm) 대신 수치·물리 법칙·시계열 데이터를 처리하는 하이브리드 신경망 모델 ( 정량 예측 , 시뮬레이션 , 금융·제조 의사결정 ) ② 음성 추론 모델 (speech reasoning models) : stt 변환 없이 오디오 억양·감정·맥락을 직접 분석해 다음 행동까지 자율 판단하는 음성 ai ( 실시간 의도 파악 , 고객 응대 자동화 , 음성 프라이버시 ) ③ 월드 모델 (world models) : 물리 법칙·시공간·인과관계를 학습해 행동 전 미래 상태를 3d 시뮬레이션·예측하는 모델 ( 피지컬 ai , 로보틱스·자율주행 , 공간 컴퓨팅 ) 2. 자율 에이전트 거버넌스 (컨·하·신·자) ④ ai 컨텍스트 플랫폼 (ai context platforms) : 정형·비정형 기업 데이터, 업무 규칙, 시맨틱 관계를 통합해 에이전트에게 맥락을 공급하는 계층 ( 시맨틱 데이터 , 정확도 80%↑·비용 60%↓ , 상호운용성 ) ⑤ ai 코딩 에이전트 하네스 (ai coding agent harness) : ai가 생성한 코드와 sdlc 전 주기를 감싸 규칙 준수·품질·보안을 자동 검증하는 폐쇄형 제어 체계 ( 거버넌스 역전 방지 , sdlc 제어 평면 , 자동 검증 ) ⑥ ai 에이전트 신원 (ai agent identity) : 사람 대신 작동하는 ai 에이전트·머신의 신원을 식별하고 최소·동적 권한을 부여하는 인증 체계 ( jit 동적 접근 제어 , 정적 키 제거 , 행위 감사 추적 ) ⑦ 자율형 노출 개선 (aer, autonomous exposure remediation) : 보안 취약점을 ai로 자동 탐지·우선순위화하고 가상 패치·운영 배포까지 자동화하는 방어 체계 ( 취약점 자동 패치 , 지속적 노출 관리 , devsecops 연계 ) 3. 지속 가능한 민첩성 (소·일·웻) ⑧ 소버린 테크 (sovereigntech, sovtech) : 특정 빅테크·국가 종속을 피하고 기술·법적 탈출 전략(exit strategy)을 보장하는 주권형 인프라·모델 ( 탈종속(no lock-in) , 데이터·ai 주권 , 지정학 리스크 대응 ) ⑨ 일회성 애플리케이션 (disposable applications) : 단기 비즈니스 목적을 위해 빠르게 만들고, 목적 달성·가치 소멸 시 폐기(decommission)를 전제한 동적 sw ( 레거시 축소 , 초단기 수명주기 , 유지보수 비용 절감 ) ⑩ 서비스형 웻웨어 (waas, wetware as a service) : 실리콘 반도체 전력·냉각 한계를 넘기 위해 생체·합성 신경망(유기 프로세서)을 클라우드로 제공하는 차세대 컴퓨팅 ( 생체 뉴런 컴퓨팅 , 초저전력(뇌 20w 수준) , 생명윤리·재현성 ) 관점(측면) 특징 설명 ai 모델 확장 관점 비텍스트(수치·음성·물리) lqm(정량 예측)·음성 추론·월드 모델(시공간/물리 시뮬레이션)로 텍스트 중심 llm 한계 극복 거버넌스·통제 관점 에이전트 제어 평면 구축 컨텍스트 플랫폼(시맨틱)·코딩 하네스(sdlc 검증)·동적 jit 에이전트 신원·aer(자동 패치) 아키텍처·주권 관점 탈종속·유연한 수명주기 소버린 테크(벤더·지정학 탈출 전략)와 목적 달성 후 폐기를 전제한 일회성 앱(disposable) 차세대 컴퓨팅 관점 에너지 한계 돌파(waas) 실리콘 전력·냉각 한계를 극복하기 위한 생체·합성 뉴런 기반 서비스형 웻웨어(wetware) 탐색 두음: 대·음·월 / 컨·하·신·자 / 소·일·웻 — 3대 테마별 10개 기술 암기! 2027년 시험 대비 필수 시사 토픽 : 특히 ai 에이전트 신원·컨텍스트 플랫폼·소버린 테크·월드 모델 은 단독 1교시 출제 1순위!"}, {"id": "sovereign-ai", "cat": "gov", "sub": "gov-ai", "parent": null, "t": "소버린 AI · 소버린 클라우드", "s": "인·데·모 (주권) / 국·비·생", "stars": 3, "redStar": false, "full": "소버린 AI · 소버린 클라우드", "catLabel": "정보전략·거버넌스", "st": "📌 복습 필요", "d": "2026-11-23", "def": "<p>국가·기업이 외산 빅테크·특정 국가에 종속되지 않고, <b>자국(자사)의 인프라·데이터·제도적 통제 하에 독자적인 AI 모델과 클라우드 역량을 구축·운영<\/b>하는 디지털 주권 전략<\/p>", "kw": "<ul class=\"kw\"><li><b>3대 주권 요소 (인·데·모)<\/b>:<ul class=\"kw\"><li><b>인프라 주권<\/b>: 자국 내 데이터센터·GPU 클러스터 확보, 특정 벤더 탈종속(No Lock-in) 및 Exit 전략<\/li><li><b>데이터 주권<\/b>: 학습·추론 데이터의 자국 내 저장·처리(Data Residency), 역외 유출 및 타국 법령(CLOUD Act 등) 배제<\/li><li><b>모델 주권<\/b>: 자국어·문화·법규를 반영한 독자 파운데이션 모델 및 자체 AI 거버넌스 통제<\/li><\/ul><\/li><li><b>연계 개념<\/b>: 가트너 2027 전략 기술 <b>소버린 테크(SovTech)<\/b> — 2030년 비미국 기업의 75% 이상 디지털 주권 전략 채택 전망<\/li><\/ul>", "pp": "<h4>1) 구성요소별 정리<\/h4>\n<div class=\"tblwrap\"><table class=\"cmp\"><colgroup><col style=\"width:24%\"><col style=\"width:28%\"><col style=\"width:48%\"><\/colgroup><thead><tr><th>관점(측면)<\/th><th>특징<\/th><th>설명<\/th><\/tr><\/thead><tbody><tr><td class=\"k\">인프라 주권<\/td><td>GPU·국산 클라우드<\/td><td>국내 데이터센터 및 NPU/GPU 자립으로 지정학적 공급 중단 리스크 차단<\/td><\/tr><tr><td class=\"k\">데이터 주권<\/td><td>역내 저장·주권 통제<\/td><td>민감·공공 데이터의 국외 반출을 막고 국내 개인정보·보안 규제(N2SF) 준수<\/td><\/tr><tr><td class=\"k\">모델 주권<\/td><td>독자 LLM·문화 반영<\/td><td>한국어·산업 특화 모델 확보로 기술 종속 및 편향성 방지<\/td><\/tr><tr><td class=\"k\">도입 과제<\/td><td>비용·생태계 균형<\/td><td>막대한 초기 GPU·전력 투자 부담 및 글로벌 오픈소스 생태계와의 호환성 확보 필수<\/td><\/tr><\/tbody><\/table><\/div>", "rv": "<div class=\"q\"><b>두음: 인·데·모 (주권) / 국·비·생 (도입과제: 국산NPU·비용·생태계)<\/b><\/div>\n<div class=\"q\"><b>기술 주권(SovTech)<\/b>과 <b>N2SF·AI 기본법<\/b>을 연계해 국가/공공 전략 관점으로 서술하면 고득점!<\/div>", "img": "itpe-diagrams/87-sovereign-ai-cloud.webp", "txt": null, "search": "소버린 ai · 소버린 클라우드 소버린 ai · 소버린 클라우드 인·데·모 (주권) / 국·비·생 정보전략·거버넌스 ai 법·거버넌스 ⭐⭐⭐ 기출빈출 기출 빈출 중요 국가·기업이 외산 빅테크·특정 국가에 종속되지 않고, 자국(자사)의 인프라·데이터·제도적 통제 하에 독자적인 ai 모델과 클라우드 역량을 구축·운영 하는 디지털 주권 전략 3대 주권 요소 (인·데·모) : 인프라 주권 : 자국 내 데이터센터·gpu 클러스터 확보, 특정 벤더 탈종속(no lock-in) 및 exit 전략 데이터 주권 : 학습·추론 데이터의 자국 내 저장·처리(data residency), 역외 유출 및 타국 법령(cloud act 등) 배제 모델 주권 : 자국어·문화·법규를 반영한 독자 파운데이션 모델 및 자체 ai 거버넌스 통제 연계 개념 : 가트너 2027 전략 기술 소버린 테크(sovtech) — 2030년 비미국 기업의 75% 이상 디지털 주권 전략 채택 전망 1) 구성요소별 정리 관점(측면) 특징 설명 인프라 주권 gpu·국산 클라우드 국내 데이터센터 및 npu/gpu 자립으로 지정학적 공급 중단 리스크 차단 데이터 주권 역내 저장·주권 통제 민감·공공 데이터의 국외 반출을 막고 국내 개인정보·보안 규제(n2sf) 준수 모델 주권 독자 llm·문화 반영 한국어·산업 특화 모델 확보로 기술 종속 및 편향성 방지 도입 과제 비용·생태계 균형 막대한 초기 gpu·전력 투자 부담 및 글로벌 오픈소스 생태계와의 호환성 확보 필수 두음: 인·데·모 (주권) / 국·비·생 (도입과제: 국산npu·비용·생태계) 기술 주권(sovtech) 과 n2sf·ai 기본법 을 연계해 국가/공공 전략 관점으로 서술하면 고득점!"}, {"id": "lineage", "cat": "gov", "sub": "gov-data", "parent": null, "t": "데이터 리니지 · 카탈로그", "s": "생·이·변·소 / 영·근·규", "stars": 2, "redStar": false, "full": "데이터 리니지(Data Lineage)와 카탈로그", "catLabel": "정보전략·거버넌스", "st": "📌 복습 필요", "d": "2026-11-21", "def": "<p>데이터가 최초 생성되어 이동·변환·집계·소비되기까지의 <b>전체 생애주기와 계보(출생·이동 경로)<\/b>를 시각화·추적하는 기술이며, <b>데이터 카탈로그<\/b>는 메타데이터를 검색·관리하는 통합 목록 체계<\/p>", "kw": "<ul class=\"kw\"><li><b>생애주기 추적 (생·이·변·소)<\/b>: 원천(Source) 생성 → ETL/ELT 이동 → 정제·가공 변환 → BI·AI 모델 소비<\/li><li><b>3대 핵심 활용 (영·근·규)<\/b>:<ul class=\"kw\"><li><b>영향도 분석 (Impact Analysis)<\/b>: 원천 DB 스키마 변경 시 영향을 받는 하위 파이프라인·리포트·AI 모델 사전 파악<\/li><li><b>근본 원인 추적 (Root Cause)<\/b>: 대시보드·AI 오류 발생 시 어느 변환 단계에서 오염됐는지 역추적<\/li><li><b>규제·AI 거버넌스<\/b>: AI 학습 데이터 출처·합법성 입증 (<b>AI 기본법 · ISO 42001 · Data Fabric<\/b> 핵심 기반)<\/li><\/ul><\/li><\/ul>", "pp": "<div class=\"tblwrap\"><table class=\"cmp\"><colgroup><col style=\"width:24%\"><col style=\"width:28%\"><col style=\"width:48%\"><\/colgroup><thead><tr><th>관점(측면)<\/th><th>특징<\/th><th>설명<\/th><\/tr><\/thead><tbody><tr><td class=\"k\">프로세스 관점<\/td><td>생·이·변·소 End-to-End<\/td><td>수작업 문서화가 아닌 SQL·ETL 로그 파싱 기반 자동 계보 수집<\/td><\/tr><tr><td class=\"k\">조직·협업 관점<\/td><td>데이터 카탈로그 연계<\/td><td>현업·엔지니어·분석가가 메타데이터 카탈로그에서 신뢰도·소유자 즉시 확인<\/td><\/tr><tr><td class=\"k\">리소스·기술 관점<\/td><td>OpenLineage · 그래프 DB<\/td><td>표준 계보 포맷과 그래프 저장소로 테이블·컬럼 단위(Column-level) 추적<\/td><\/tr><tr><td class=\"k\">거버넌스·신뢰<\/td><td>AI 학습 데이터 출처<\/td><td>규제 감사 대응 및 Data Fabric·Mesh 환경의 데이터 품질 보증<\/td><\/tr><\/tbody><\/table><\/div>", "rv": "<div class=\"q\"><b>두음: 생·이·변·소 / 영·근·규<\/b> — 생(생성)·이(이동)·변(변환)·소(소비) / 영(영향도)·근(근본원인)·규(규제·AI거버넌스)<\/div>\n<div class=\"q\"><b>데이터 계보 추적 + 카탈로그 연계 + AI 거버넌스/Data Fabric 핵심 기반<\/b>!<\/div>", "img": "itpe-diagrams/62-data-lineage.webp", "txt": null, "search": "데이터 리니지(data lineage)와 카탈로그 데이터 리니지 · 카탈로그 생·이·변·소 / 영·근·규 정보전략·거버넌스 데이터·재무 거버넌스 ⭐⭐ 기출빈출 기출 빈출 중요 데이터가 최초 생성되어 이동·변환·집계·소비되기까지의 전체 생애주기와 계보(출생·이동 경로) 를 시각화·추적하는 기술이며, 데이터 카탈로그 는 메타데이터를 검색·관리하는 통합 목록 체계 생애주기 추적 (생·이·변·소) : 원천(source) 생성 → etl/elt 이동 → 정제·가공 변환 → bi·ai 모델 소비 3대 핵심 활용 (영·근·규) : 영향도 분석 (impact analysis) : 원천 db 스키마 변경 시 영향을 받는 하위 파이프라인·리포트·ai 모델 사전 파악 근본 원인 추적 (root cause) : 대시보드·ai 오류 발생 시 어느 변환 단계에서 오염됐는지 역추적 규제·ai 거버넌스 : ai 학습 데이터 출처·합법성 입증 ( ai 기본법 · iso 42001 · data fabric 핵심 기반) 관점(측면) 특징 설명 프로세스 관점 생·이·변·소 end-to-end 수작업 문서화가 아닌 sql·etl 로그 파싱 기반 자동 계보 수집 조직·협업 관점 데이터 카탈로그 연계 현업·엔지니어·분석가가 메타데이터 카탈로그에서 신뢰도·소유자 즉시 확인 리소스·기술 관점 openlineage · 그래프 db 표준 계보 포맷과 그래프 저장소로 테이블·컬럼 단위(column-level) 추적 거버넌스·신뢰 ai 학습 데이터 출처 규제 감사 대응 및 data fabric·mesh 환경의 데이터 품질 보증 두음: 생·이·변·소 / 영·근·규 — 생(생성)·이(이동)·변(변환)·소(소비) / 영(영향도)·근(근본원인)·규(규제·ai거버넌스) 데이터 계보 추적 + 카탈로그 연계 + ai 거버넌스/data fabric 핵심 기반 !"}, {"id": "dq-guideline-2026", "cat": "gov", "sub": "gov-data", "parent": null, "t": "DQ인증 가이드라인", "s": "데이터 품질인증 2026.02", "stars": 1, "redStar": false, "full": "DQ인증 가이드라인 (2026.02) · 데이터 품질인증", "catLabel": "정보전략·거버넌스", "st": "📌 복습 필요", "d": "2026-11-25", "def": "<p><b>DQ인증(데이터 품질인증)<\/b>은 「데이터 산업진흥 및 이용촉진에 관한 기본법」 제20조에 근거해 과기정통부가 지정한 인증기관이 <b>데이터 내용<\/b>과 <b>데이터 관리체계<\/b>를 진단·평가하는 국가 인증 제도. 한국데이터산업진흥원(K-DATA)이 2026.02 개정한 <b>DQ인증 가이드라인 3권<\/b>(① 제도 소개 ② 데이터 내용 인증 ③ 데이터 관리체계 인증)이 심사 기준·절차·판정 방법을 제시하며, 데이터 내용은 <b>Class A~C<\/b>, 관리체계는 <b>Level 2~5<\/b>로 등급을 부여하는 <b>국가 데이터 품질인증 체계<\/b>.<\/p>", "kw": "<ul class=\"kw\"><li><b>법·주체<\/b>: 데이터산업법 제20조(제20조의3~5) — 과기정통부 지정 인증기관 <b>씨에이에스·와이즈스톤·TTA<\/b> 3곳<\/li><li><b>가이드라인 3권<\/b>: ① DQ인증 제도 소개 ② 데이터 내용 인증 ③ 데이터 관리체계 인증 (2026.02 개정판)<\/li><li><b>데이터 내용 인증<\/b>: 정형·비정형 데이터 자체의 <b>내재적(Inherent) 품질<\/b> 심사 — Class A(0.99↑)·B(0.97↑)·C(0.95↑), 개별 항목 0.95 이상<\/li><li><b>데이터 유형<\/b>: 구성 복잡도에 따라 <b>Complex·Normal·Simple-Type<\/b>(필수 항목 + 선택 항목 적용 수)<\/li><li><b>정형 심사항목<\/b>: 14개(필수 7 · 선택 7) — 완전성·유효성(구문·의미·범위·관계)·일관성(참조무결) 등, ISO/IEC 25024 참조<\/li><li><b>비정형 심사항목<\/b>: 24개(필수 9 · 선택 15) — 완전성·유효성·정확성·유일성(어노테이션 정확성 포함), ISO/IEC 5259-2·TTAK.KO-10.1344-Part2 참조<\/li><li><b>관리체계 인증<\/b>: 사업·시스템·관리조직 대상, <b>ISO/IEC 33020 프로세스 속성(PA)<\/b> 기반 Level 2~5(실무적·체계적·정량적·최적화)<\/li><li><b>유효기간<\/b>: 데이터 내용 <b>1년<\/b> / 관리체계 <b>3년<\/b>(1년 주기 사후심사), 변경 시 신규 신청<\/li><\/ul>", "pp": "<h4>1) 데이터 내용 인증 vs 데이터 관리체계 인증 (비교모듈: 범·주·목·표·산·거)<\/h4>\n<div class=\"tblwrap\"><table class=\"cmp\"><colgroup><col style=\"width:24%\"><col style=\"width:28%\"><col style=\"width:48%\"><\/colgroup><thead><tr><th>구분<\/th><th>데이터 내용 인증<\/th><th>데이터 관리체계 인증<\/th><\/tr><\/thead><tbody><tr><td class=\"k\">대상범위<\/td><td>정형·비정형 데이터 값 자체의 품질<\/td><td>데이터 기반 사업·시스템·관리조직의 프로세스<\/td><\/tr><tr><td class=\"k\">추진주체<\/td><td>신청기업 + 지정 인증기관 3곳 + 인증심의위원회<\/td><td>동일(조직·프로세스 심사 인력 투입)<\/td><\/tr><tr><td class=\"k\">수립목적<\/td><td>데이터 값의 품질 수준을 객관적으로 입증<\/td><td>조직의 품질관리 역량·성숙도를 입증<\/td><\/tr><tr><td class=\"k\">근거표준·법<\/td><td>데이터산업법 제20조, ISO/IEC 25024·5259-2, TTAK.KO-10.1344-Part2<\/td><td>데이터산업법 제20조, ISO/IEC 33020(PA)<\/td><\/tr><tr><td class=\"k\">핵심산출물<\/td><td>등급(Class A~C)·품질 점수·인증서<\/td><td>등급(Level 2~5)·심사보고서·인증서<\/td><\/tr><tr><td class=\"k\">거버넌스·환류<\/td><td>1년 유효 → 재인증<\/td><td>3년 유효, 1년 주기 사후심사<\/td><\/tr><\/tbody><\/table><\/div>\n<h4>2) 등급·심사 체계<\/h4>\n<div class=\"tblwrap\"><table class=\"cmp\"><colgroup><col style=\"width:24%\"><col style=\"width:28%\"><col style=\"width:48%\"><\/colgroup><thead><tr><th>구분<\/th><th>등급 기준<\/th><th>비고<\/th><\/tr><\/thead><tbody><tr><td class=\"k\">데이터 내용<\/td><td>Class A 0.99 이상 / B 0.97 이상 / C 0.95 이상<\/td><td>모든 개별 심사항목 0.95 이상 필수<\/td><\/tr><tr><td class=\"k\">데이터 유형<\/td><td>Complex(필수 전체+선택 3개 이상) / Normal(선택 3개 미만) / Simple(필수 일부)<\/td><td>구성 복잡도 기준<\/td><\/tr><tr><td class=\"k\">관리체계<\/td><td>Level 2 실무적 → 3 체계적(QP·QC·QA·QI) → 4 정량적 → 5 최적화<\/td><td>Level 1은 인증하지 않음<\/td><\/tr><tr><td class=\"k\">심사항목(PA)<\/td><td>PA1.1 수행 · PA2.1/2.2 관리 · PA3.1/3.2 정의·전개 · PA4.1/4.2 정량 · PA5.1/5.2 혁신<\/td><td>등급별 심사 범위 차등<\/td><\/tr><\/tbody><\/table><\/div>\n<h4>3) 인증 절차·준비 고려사항<\/h4>\n<div class=\"tblwrap\"><table class=\"cmp\"><colgroup><col style=\"width:24%\"><col style=\"width:28%\"><col style=\"width:48%\"><\/colgroup><thead><tr><th>구분<\/th><th>키워드<\/th><th>설명<\/th><\/tr><\/thead><tbody><tr><td class=\"k\">절차<\/td><td>신청→상담·계약→심사→심의위원회→발급<\/td><td>심사 전 데이터 명세서·메타데이터 준비가 핵심<\/td><\/tr><tr><td class=\"k\">사전점검<\/td><td>품질진단<\/td><td>자체 진단으로 항목별 점수 산출, 0.95 미만 항목 우선 개선<\/td><\/tr><tr><td class=\"k\">증빙<\/td><td>프로세스 산출물<\/td><td>관리체계는 매뉴얼·기록·측정 리포트 등 증빙이 판정을 좌우<\/td><\/tr><tr><td class=\"k\">지원사업<\/td><td>정부 지원<\/td><td>2026년 데이터 품질인증 지원사업(총 17개사, 인증비 최대 1,150만원) 활용 가능<\/td><\/tr><tr><td class=\"k\">활용<\/td><td>신뢰·거래<\/td><td>데이터 거래·AI 학습데이터 공급 시 품질 신뢰 근거로 제시<\/td><\/tr><\/tbody><\/table><\/div>", "rv": "<div class=\"q\"><b>두음: 내·관 — 데이터 내용·관리체계 / 에·비·씨 — Class A·B·C / 엘·이·사·오 — Level 2·3·4·5<\/b><\/div>\n<div class=\"q\"><b>\"값의 품질은 Class(A·B·C), 관리의 성숙도는 Level(2~5) — 개별 항목 0.95 미만이면 등급 없음\"<\/b><\/div>", "img": "itpe-diagrams/134-dq-guideline-2026.webp", "txt": null, "search": "dq인증 가이드라인 (2026.02) · 데이터 품질인증 dq인증 가이드라인 데이터 품질인증 2026.02 정보전략·거버넌스 데이터·재무 거버넌스 ⭐ 기출빈출 기출 빈출 중요 dq인증(데이터 품질인증) 은 「데이터 산업진흥 및 이용촉진에 관한 기본법」 제20조에 근거해 과기정통부가 지정한 인증기관이 데이터 내용 과 데이터 관리체계 를 진단·평가하는 국가 인증 제도. 한국데이터산업진흥원(k-data)이 2026.02 개정한 dq인증 가이드라인 3권 (① 제도 소개 ② 데이터 내용 인증 ③ 데이터 관리체계 인증)이 심사 기준·절차·판정 방법을 제시하며, 데이터 내용은 class a~c , 관리체계는 level 2~5 로 등급을 부여하는 국가 데이터 품질인증 체계 . 법·주체 : 데이터산업법 제20조(제20조의3~5) — 과기정통부 지정 인증기관 씨에이에스·와이즈스톤·tta 3곳 가이드라인 3권 : ① dq인증 제도 소개 ② 데이터 내용 인증 ③ 데이터 관리체계 인증 (2026.02 개정판) 데이터 내용 인증 : 정형·비정형 데이터 자체의 내재적(inherent) 품질 심사 — class a(0.99↑)·b(0.97↑)·c(0.95↑), 개별 항목 0.95 이상 데이터 유형 : 구성 복잡도에 따라 complex·normal·simple-type (필수 항목 + 선택 항목 적용 수) 정형 심사항목 : 14개(필수 7 · 선택 7) — 완전성·유효성(구문·의미·범위·관계)·일관성(참조무결) 등, iso/iec 25024 참조 비정형 심사항목 : 24개  기준<\/b>.<\/p>", "kw": "<ul class=\"kw\"><li><b>AI-Ready Data<\/b>: 별도 정제·가공 없이 AI 모델에 투입 가능하고, 그 상태를 <b>문서·기록으로 증명<\/b>할 수 있는 데이터<\/li><li><b>3층 구조<\/b>: 기관 = 관리원칙 <b>15개<\/b>(FAIR 매핑) / 데이터셋 = 품질지표 <b>6개<\/b> / 개별 데이터셋 = <b>데이터 카드 38개<\/b> 항목<\/li><li><b>품질 6지표<\/b>: 완전성·일관성·정확성·적시성·유효성·유일성 — 각 지표를 <b>기존 정의 → 확장 정의<\/b> 2단으로 제시<\/li><li><b>데이터 카드 6분류 38항목<\/b>: 개요 8 · 구조 7 · 생성 6 · 사용 시 고려사항 6 · 라이선스 5 · 기술적 사양 6<\/li><li><b>포맷<\/b>: Parquet·JSON·GeoJSON 등 <b>오픈 포맷<\/b> 권장, HWP·XLSX 등 벤더 종속 포맷은 비권장<\/li><li><b>생애주기<\/b>: 7단계(계획·설계~폐기·보존) 확장, 전 주기 <b>비식별화 공통보호조치<\/b><\/li><li><b>등급·활용<\/b>: 1등급 공개공유·2등급 제한공유·3등급 내부전용 / 열람·분석·결합·AI학습 4유형<\/li><li><b>v1.1 신설<\/b>: <b>MCP 연계 시 접근권한·호출이력·데이터 반출 관리 기준<\/b>, 주제영역별 AI 친화 분류체계(BRM 한계 보완)<\/li><li><b>라이선스<\/b>: 공공누리 <b>AI유형<\/b>(인공지능학습용) — 출처표시 없이 상업적·2차 이용 허용<\/li><\/ul>", "pp": "<h4>1) 기존 공공데이터 개방 vs AI-Ready 공공데이터 (비교모듈: 범·주·목·표·산·거)<\/h4>\n<div class=\"tblwrap\"><table class=\"cmp\"><colgroup><col style=\"width:24%\"><col style=\"width:28%\"><col style=\"width:48%\"><\/colgroup><thead><tr><th>구분<\/th><th>기존 공공데이터 개방<\/th><th>AI-Ready 공공데이터<\/th><\/tr><\/thead><tbody><tr><td class=\"k\">대상범위<\/td><td>공개·이용 활성화를 위한 데이터 개방<\/td><td>AI 학습·추론에 즉시 투입 가능한 데이터<\/td><\/tr><tr><td class=\"k\">추진주체<\/td><td>행안부·공공데이터포털·제공기관<\/td><td>+ NIA, AI 활용 부서, MCP 연계 운영 주체<\/td><\/tr><tr><td class=\"k\">수립목적<\/td><td>국민 이용·투명성·기계 판독<\/td><td>AI 활용 가능성 — <b>의미적 완결성<\/b> 확보<\/td><\/tr><tr><td class=\"k\">근거표준·법<\/td><td>공공데이터법, 공공누리<\/td><td>+ AI-Ready 15원칙(FAIR)·품질 6지표·데이터 카드 38항목<\/td><\/tr><tr><td class=\"k\">핵심산출물<\/td><td>개방 파일(CSV·JSON)·Open API<\/td><td>오픈 포맷(Parquet)·명시적 스키마·메타데이터·데이터 카드<\/td><\/tr><tr><td class=\"k\">거버넌스·환류<\/td><td>품질점검·이용 신청·활용도 측정<\/td><td>책임주체 지정·품질 게이트·생애주기 이력·접근권한 관리<\/td><\/tr><\/tbody><\/table><\/div>\n<h4>2) 3층 관리 체계<\/h4>\n<div class=\"tblwrap\"><table class=\"cmp\"><colgroup><col style=\"width:24%\"><col style=\"width:28%\"><col style=\"width:48%\"><\/colgroup><thead><tr><th>대상<\/th><th>항목<\/th><th>주요 내용<\ /li><li><b>Optimize<\/b> — RI/Savings Plan, Right-sizing, 유휴 자원 제거<\/li><li><b>Operate<\/b> — 예산 알림·CI/CD 비용 게이트·지속적 거버넌스<\/li><\/ul><\/li><li><b>핵심 원칙<\/b><ul class=\"kw\"><li>팀 간 협업<\/li><li>비즈니스 가치 기반 의사결정<\/li><li>중앙 집중식 거버넌스와 분산된 실행 책임<\/li><\/ul><\/li><\/ul>", "pp": "<div class=\"tblwrap\"><table class=\"cmp\"><colgroup><col style=\"width:24%\"><col style=\"width:28%\"><col style=\"width:48%\"><\/colgroup><thead><tr><th>관점(측면)<\/th><th>특징<\/th><th>설명<\/th><\/tr><\/thead><tbody><tr><td class=\"k\">프로세스<\/td><td>Inform·Optimize·Operate<\/td><td>가시화 → 최적화 → 지속 운영의 3단계를 반복 수행<\/td><\/tr><tr><td class=\"k\">조직<\/td><td>팀 간 협업·책임<\/td><td>재무·엔지니어링·비즈니스가 같은 지표로 의사결정하고 비용 소유자를 지정<\/td><\/tr><tr><td class=\"k\">리소스(기술·자원)<\/td><td>태깅·RI·Right-sizing<\/td><td>비용 태깅·예산 알림, 예약 인스턴스·절감 플랜, 유휴 자원 제거<\/td><\/tr><tr><td class=\"k\">성과 측정<\/td><td>Showback·단위 비용<\/td><td>부서별 청구·환류(Chargeback)와 단위 비용 KPI로 절감 성과를 측정<\/td><\/tr><\/tbody><\/table><\/div>", "rv": "<div class=\"q\"><b>두음: 인·옵·오<\/b> — 인(Inform 가시화)·옵(Optimize 최적화)·오(Operate 거버넌스)<\/div>\n<div class=\"q\"><b>Fintech(금융 서비스)가 아니라 Finance(클라우드 비용/재무)<\/b>! 3단계 <b>Inform → Optimize → Operate<\/b> 키워드를 반드시 함께 쓰기!<\/div>", "img": "itpe-diagrams/07-finops.webp", "txt": null, "search": "finops (클라우드 재무·운영) finops 클라우드 재무 거버넌스 정보전략·거버넌스 데이터·재무 거버넌스 finance(재무) + devops(개발·운영) 의 합성어로, 클라우드 환경에서 엔지니어링·재무·비즈니스 팀이 협업해 클라우드 비용을 가시화하고 최적화하는 운영 문화 및 거버넌스 체계 등장 배경 클라우드 전환 후 pay-as-you-go(종량제)로 인한 비용 폭증(bill shock) 부서별 책임 불명확 해소 3단계 생명주기 (finops foundation) inform — 비용 가시화·태깅·showback/chargeback optimize — ri/savings plan, right-sizing, 유휴 자원 제거 operate — 예산 알림·ci/cd 비용 게이트·지속적 거버넌스 핵심 원칙 팀 간 협업 비즈니스 가치 기반 의사결정 중앙 집중식 거버넌스와 분산된 실행 책임 관점(측면) 특징 설명 프로세스 inform·optimize·operate 가시화 → 최적화 → 지속 운영의 3단계를 반복 수행 조직 팀 간 협업·책임 재무·엔지니어링·비즈니스가 같은 지표로 의사결정하고 비용 소유자를 지정 리소스(기술·자원) 태깅·ri·right-sizing 비용 태깅·예산 알림, 예약 인스턴스·절감 플랜, 유휴 자원 제거 성과 측정 showback·단위 비용 부서별 청구·환류(chargeback)와 단위 비용 kpi로 절감 성과를 측정 두음: 인·옵·오 — 인(inform 가시화)·옵(optimize 최적화)·오(operate 거버넌스) fintech(금융 서비스)가 아니라 finance(클라우드 비용/재무) ! 3단계 inform → optimize → operate 키워드를 반드시 함께 쓰기!"}, {"id": "oss-license", "cat": "gov", "sub": "gov-ip", "parent": null, "t": "오픈소스 라이선스", "s": "MIT·GPL·SSPL / Open-weight", "stars": 0, "redStar": true, "full": "오픈소스 라이선스 · Open-weight · OSPO", "catLabel": "정보전략·거버넌스", "st": "📌 복습 필요", "d": "2026-11-23", "def": "<p>저작권자가 소스코드를 공개하고 일정 조건 아래 사용·수정·재배포를 허용하는 <b>법적 계약<\/b>으로, <b>카피레프트 전파 범위<\/b>에 따라 허용형(Permissive)·조건부(Weak/Strong Copyleft)·비허용(Source-available)으로 구분됨<\/p>", "kw": "<ul class=\"kw\"><li><b>허용형(Permissive)<\/b>: MIT·BSD·Apache 2.0 — 소스 공개 의무 없음, <b>저작권 고지·라이선스 사본 유지<\/b> (Apache 2.0은 특허 그랜트·상표 조항 포함)<\/li><li><b>강한 카피레프트<\/b>: GPL — 2차 저작물(링크·파생)도 동일 라이선스로 공개(전염성), <b>AGPL<\/b>은 네트워크 서비스(SaaS) 제공 시에도 소스 공개<\/li><li><b>약한 카피레프트<\/b>: LGPL — 라이브러리 <b>동적 링크<\/b> 시 전파 회피, MPL — <b>파일 단위<\/b>로만 전파<\/li><li><b>비허용(Source-available)<\/b>: SSPL(관리형 서비스로 제공 시 전체 스택 공개, MongoDB), BSL(일정 기간 후 오픈, 시간차 오픈소스)<\/li><li><b>Open-weight 모델<\/b>: <b>학습 데이터·학습 코드는 비공개<\/b>이고 <b>가중치(Weights)만 공개<\/b> — 상업 이용·규모 제한(MAU 등) <b>자체 라이선스<\/b> 적용(Llama License 등) / 참고: OSI의 <b>오픈소스 AI 정의(OSAID)<\/b>는 데이터·코드·가중치·학습절차까지 공개를 요구<\/li><li><b>컴플라이언스<\/b>: SBOM·라이선스 스캔(FOSSA·SCANOSS)·CI/CD 정책 게이트·<b>OSPO(Open Source Program Office)<\/b> 거버넌스<\/li><\/ul>", "pp": "<h4>1) 개념 비교 (라이선스 3계열)<\/h4>\n<div class=\"tblwrap\"><table class=\"cmp\"><thead><tr><th>비교<\/th><th>허용형 (MIT·BSD)<\/th><th>카피레프트 (GPL)<\/th><th>비허용 (SSPL·BSL)<\/th><\/tr><\/thead><tbody><tr><td class=\"k\">소스 공개 의무<\/td><td>없음 (고지만)<\/td><td>2차 저작물 공개<\/td><td>특정 조건(서비스화) 시 공개<\/td><\/tr><tr><td class=\"k\">전파 범위<\/td><td>없음<\/td><td>파생·링크 전체<\/td><td>서비스 제공 전체 스택<\/td><\/tr><tr><td class=\"k\">대표 사례<\/td><td>React(MIT)·Kubernetes(Apache)<\/td><td>Linux·MySQL(GPL)<\/td><td>MongoDB(SSPL)·Redis(BSL)<\/td><\/tr><\/tbody><\/table><\/div>\n<h4>2) 상세 비교 (AI·컴플라이언스 관점)<\/h4>\n<div class=\"tblwrap\"><table class=\"cmp\"><colgroup><col style=\"width:24%\"><col style=\"width:28%\"><col style=\"width:48%\"><\/colgroup><thead><tr><th>구분<\/th><th>특징<\/th><th>설명<\/th><\/tr><\/thead><tbody><tr><td class=\"k\">AI 모델<\/td><td>Open-weight vs 오픈소스 AI<\/td><td>Open-weight는 데이터·코드 비공개 + 가중치만 공개(상업·규모 제한 자체 약관) / 오픈소스 AI(OSAID)는 데이터·코드·가중치·절차 모두 공개<\/td><\/tr><tr><td class=\"k\">위험<\/td><td>라이선스 전염<\/td><td>GPL/AGPL 코드를 제품에 포함하면 전체 소스 공개 위험 → 아키텍처 분리(프로세스·API 경계)<\/td><\/tr><tr><td class=\"k\">관리<\/td><td>OSPO·SBOM<\/td><td>도입 심사·SBOM 기반 스캔·정책 게이트로 라이선스 위반 사전 차단<\/td><\/tr><\/tbody><\/table><\/div>", "rv": "<div class=\"q\"><b>두음: 허·카·비<\/b> — 허용형(고지만) · 카피레프트(전염) · 비허용(조건부 공개)<\/div>\n<div class=\"q\"><b>\"MIT·Apache = 고지, GPL = 전염, AGPL = SaaS까지, SSPL = 서비스화하면 전체 공개\"<\/b><\/div>\n<div class=\"q\"><b>오픈웨이트 = 데이터·코드 비공개 + 가중치만 공개 + 자체 약관(상업·규모 제한)<\/b> / <b>오픈소스 = 허·카·비<\/b>(허용형 고지만 · 카피레프트 전염 · 비허용 조건부)<\/div>", "img": "itpe-diagrams/94-oss-license.webp", "txt": null, "search": "오픈소스 라이선스 · open-weight · ospo 오픈소스 라이선스 mit·gpl·sspl / open-weight 정보전략·거버넌스 지식재산·라이선스 빨간별 빨간 별 빨간색 별 ★ 레드별 심화반 심화 선택 저작권자가 소스코드를 공개하고 일정 조건 아래 사용·수정·재배포를 허용하는 법적 계약 으로, 카피레프트 전파 범위 에 따라 허용형(permissive)·조건부(weak/strong copyleft)·비허용(source-available)으로 구분됨 허용형(permissive) : mit·bsd·apache 2.0 — 소스 공개 의무 없음, 저작권 고지·라이선스 사본 유지 (apache 2.0은 특허 그랜트·상표 조항 포함) 강한 카피레프트 : gpl — 2차 저작물(링크·파생)도 동일 라이선스로 공개(전염성), agpl 은 네트워크 서비스(saas) 제공 시에도 소스 공개 약한 카피레프트 : lgpl — 라이브러리 동적 링크 시 전파 회피, mpl — 파일 단위 로만 전파 비허용(source-available) : sspl(관리형 서비스로 제공 시 전체 스택 공개, mongodb), bsl(일정 기간 후 오픈, 시간차 오픈소스) open-weight 모델 : 학습 데이터·학습 코드는 비공개 이고 가중치(weights)만 공개 — 상업 이용·규모 제한(mau 등) 자체 라이선스 적용(llama license 등) / 참고: osi의 오픈소스 ai 정의(osaid) 는 데이터·코드·가중치·학습절차까지 공개를 요구 컴플라이언스 : sbom·라이선스 스캔(fossa·scanoss)·ci/cd 정책 게이트· ospo(open source program office) 거버넌스 1) 개념 비교 (라이선스 3계열) 비교 허용형 (mit·bsd) 카피레프트 (gpl) 비허용 (sspl·bsl) 소스 공개 의무 없음 (고지만) 2차 저작물 공개 특정 조건(서비스화) 시 공개 전파 범위 없음 파생·링크 전체 서비스 제공 전체 스택 대표 사례 react(mit)·kubernetes(apache) linux·mysql(gpl) mongodb(sspl)·redis(bsl) 2) 상세 비교 (ai·컴플라이언스 관점) 구분 특징 설명 ai 모델 open-weight vs 오픈소스 ai open-weight는 데이터·코드 비공개 + 가중치만 공개(상업·규모 제한 자체 약관) / 오픈소스 ai(osaid)는 데이터·코드·가중치·절차 모두 공개 위험 라이선스 전염 gpl/agpl 코드를 제품에 포함하면 전체 소스 공개 위험 → 아키텍처 분리(프로세스·api 경계) 관리 ospo·sbom 도입 심사·sbom 기반 스캔·정책 게이트로 라이선스 위반 사전 차단 두음: 허·카·비 — 허용형(고지만) · 카피레프트(전염) · 비허용(조건부 공개) \"mit·apache = 고지, gpl = 전염, agpl = saas까지, sspl = 서비스화하면 전체 공개\" 오픈웨이트 = 데이터·코드 비공개 + 가중치만 공개 + 자체 약관(상업·규모 제한) / 오픈소스 = 허·카·비 (허용형 고지만 · 카피레프트 전염 · 비허용 조건부)"}, {"id": "dtx", "cat": "gov", "sub": "gov-public", "parent": null, "t": "디지털 치료기기 (DTx)", "s": "SaMD · 임상·허가·수가", "stars": 0, "redStar": true, "full": "디지털 치료기기 (DTx)", "catLabel": "정보전략·거버넌스", "st": "📌 복습 필요", "d": "2026-11-23", "def": "<p>질병의 예방·치료·관리를 위해 <b>임상적 근거를 갖는 소프트웨어(SaMD)<\/b>로 구현된 비약물 치료 의료기기로, 식약처 허가와 임상시험을 거쳐 처방·보험 적용되는 디지털 헬스케어 제품<\/p>", "kw": "<ul class=\"kw\"><li><b>특징<\/b>: 소프트웨어가 치료 수단(SaMD), <b>근거 기반(RCT 무작위 대조 임상)<\/b>, 사용 데이터 기반 개인화·행동 변화 유도<\/li><li><b>적용 질환<\/b>: 불면증·우울·불안(인지행동치료 CBT), ADHD, 당뇨·금연·재활 등 만성질환 관리<\/li><li><b>규제·인증<\/b>: 식약처 의료기기 허가(2·3등급), 임상시험계획 승인, <b>IEC 62304<\/b>(의료용 SW 생명주기)·ISO 13485(품질경영)·IEC 82304<\/li><li><b>사업·보상<\/b>: 요양급여·수가 협상, 처방-사용-청구 연계, 병의원·보험자 협력 모델<\/li><li><b>과제<\/b>: 임상 근거 확보 비용, 수가·보험 등재 지연, 사용자 순응도(Adherence), 이중 규제(개인정보보호법·의료법)<\/li><\/ul>", "pp": "<h4>1) 관점별 구성<\/h4>\n<div class=\"tblwrap\"><table class=\"cmp\"><colgroup><col style=\"width:24%\"><col style=\"width:28%\"><col style=\"width:48%\"><\/colgroup><thead><tr><th>관점(측면)<\/th><th>특징<\/th><th>설명<\/th><\/tr><\/thead><tbody><tr><td class=\"k\">임상<\/td><td>근거 기반 치료<\/td><td>RCT로 효능·안전성 입증, 적응증·용량(사용시간) 명시<\/td><\/tr><tr><td class=\"k\">기술<\/td><td>앱·웨어러블 연동<\/td><td>행동 데이터 수집·알고리즘 피드백, 클라우드-앱 연계<\/td><\/tr><tr><td class=\"k\">규제<\/td><td>의료기기 허가<\/td><td>IEC 62304·ISO 13485 기반 품질·생명주기 관리<\/td><\/tr><tr><td class=\"k\">사업<\/td><td>처방·수가<\/td><td>요양급여·수가 확보가 상용화의 관문<\/td><\/tr><tr><td class=\"k\">과제<\/td><td>순응도·보호<\/td><td>지속 사용 유도, 민감 의료정보 보호<\/td><\/tr><\/tbody><\/table><\/div>", "rv": "<div class=\"q\"><b>두음: 임·개·규·보<\/b> — 임상근거 · 개인화 · 규제허가 · 보험급여<\/div>\n<div class=\"q\"><b>\"DTx = 약 대신 앱\"<\/b>, 따라서 일반 헬스앱과 달리 임상시험·의료기기 허가가 필수!<\/div>", "img": "itpe-diagrams/97-dtx.webp", "txt": null, "search": "디지털 치료기기 (dtx) 디지털 치료기기 (dtx) samd · 임상·허가·수가 정보전략·거버넌스 산업·공공 거버넌스 빨간별 빨간 별 빨간색 별 ★ 레드별 심화반 심화 선택 질병의 예방·치료·관리를 위해 임상적 근거를 갖는 소프트웨어(samd) 로 구현된 비약물 치료 의료기기로, 식약처 허가와 임상시험을 거쳐 처방·보험 적용되는 디지털 헬스케어 제품 특징 : 소프트웨어가 치료 수단(samd), 근거 기반(rct 무작위 대조 임상) , 사용 데이터 기반 개인화·행동 변화 유도 적용 질환 : 불면증·우울·불안(인지행동치료 cbt), adhd, 당뇨·금연·재활 등 만성질환 관리 규제·인증 : 식약처 의료기기 허가(2·3등급), 임상시험계획 승인, iec 62304 (의료용 sw 생명주기)·iso 13485(품질경영)·iec 82304 사업·보상 : 요양급여·수가 협상, 처방-사용-청구 연계, 병의원·보험자 협력 모델 과제 : 임상 근거 확보 비용, 수가·보험 등재 지연, 사용자 순응도(adherence), 이중 규제(개인정보보호법·의료법) 1) 관점별 구성 관점(측면) 특징 설명 임상 근거 기반 치료 rct로 효능·안전성 입증, 적응증·용량(사용시간) 명시 기술 앱·웨어러블 연동 행동 데이터 수집·알고리즘 피드백, 클라우드-앱 연계 규제 의료기기 허가 iec 62304·iso 13485 기반 품질·생명주기 관리 사업 처방·수가 요양급여·수가 확보가 상용화의 관문 과제 순응도·보호 지속 사용 유도, 민감 의료정보 보호 두음: 임·개·규·보 — 임상근거 · 개인화 · 규제허가 · 보험급여 \"dtx = 약 대신 앱\" , 따라서 일반 헬스앱과 달리 임상시험·의료기기 허가가 필수!"}, {"id": "smart-city-gov", "cat": "gov", "sub": "gov-public", "parent": null, "t": "스마트시티 · 데이터 거버넌스", "s": "프·조·리 / 지속가능성", "stars": 0, "redStar": true, "full": "지속가능한 스마트시티 · 데이터 거버넌스", "catLabel": "정보전략·거버넌스", "st": "📌 복습 필요", "d": "2026-11-23", "def": "<p>도시 인프라·서비스를 <b>데이터 기반으로 최적화<\/b>하되, 시민 참여·개인정보 보호·데이터 품질·투명성을 <b>거버넌스 체계<\/b>로 담보해 환경·사회·경제적 <b>지속가능성<\/b>을 확보하는 도시 모델<\/p>", "kw": "<ul class=\"kw\"><li><b>스마트시티<\/b>: 교통·환경·안전·에너지 등 도시문제를 IoT·빅데이터·AI로 해결, <b>도시 데이터 허브<\/b> 구축<\/li><li><b>데이터 거버넌스<\/b>: 데이터 표준·품질·생애주기·소유권·접근통제, 카탈로그·리니지로 <b>신뢰 가능한 데이터<\/b> 확보<\/li><li><b>지속가능성<\/b>: ESG·탄소중립·포용적 서비스, 리빙랩·시민 참여, 서비스 운영 지속모델(수익·거버넌스)<\/li><li><b>보호·개방<\/b>: 개인정보 가명처리·목적제한, 공공데이터 개방(Open Data), 데이터 3법, 클라우드·망 보안<\/li><li><b>위험<\/b>: 감시사회 우려, 알고리즘 편향·불투명, 특정 벤더 종속, 데이터 사일로<\/li><\/ul>", "pp": "<h4>1) 데이터 거버넌스 3축 관점<\/h4>\n<div class=\"tblwrap\"><table class=\"cmp\"><colgroup><col style=\"width:24%\"><col style=\"width:28%\"><col style=\"width:48%\"><\/colgroup><thead  시스템 등급(A1~A4)별 요청·변경·장애·백업 등 <b>13대 운영 절차의 표준 기준<\/b>을 제시하는 <b>공공 정보시스템 운영 지침<\/b><\/p>", "kw": "<ul class=\"kw\"><li><b>근거<\/b>: 전자정부법 제56조의2~5, 안정성 고시 제10조(표준운영절차)·제11조(서비스수준협약)·제12조(예방점검)<\/li><li><b>등급<\/b>: A1(국가 핵심)·A2(대국민 필수)·A3(행정 중요)·A4(일반) — A1~A3는 필수, A4는 권고<\/li><li><b>공통 절차<\/b>: 요청·변경·장애·문제 관리<\/li><li><b>기반SW 절차<\/b>: 서비스수준·구성(CMDB)·이벤트·백업 관리<\/li><li><b>응용 절차<\/b>: 운영상태·배포·테스트·연계·형상 관리<\/li><li><b>운영 체계<\/b>: SOP 관리시스템(이력·단계 승인), 운영·예방점검 매뉴얼, 사후관리(재발방지·개선)<\/li><\/ul>", "pp": "<h4>1) SOP 13개 절차 영역<\/h4>\n<div class=\"tblwrap\"><table class=\"cmp\"><colgroup><col style=\"width:24%\"><col style=\"width:28%\"><col style=\"width:48%\"><\/colgroup><thead><tr><th>구분<\/th><th>키워드<\/th><th>설명<\/th><\/tr><\/thead><tbody><tr><td class=\"k\">공통<\/td><td>요청·변경·장애·문제<\/td><td>요청 접수·분류·승인, 변경 계획·원복, 장애 식별·복구, 문제 근본원인 분석<\/td><\/tr><tr><td class=\"k\">기반SW<\/td><td>서비스수준·구성·이벤트·백업<\/td><td>SLA 정의·평가, CMDB 구성통제·감사, 이벤트 처리, 백업정책·이행 증적<\/td><\/tr><tr><td class=\"k\">응용<\/td><td>운영상태·배포·테스트·연계·형상<\/td><td>운영 모니터링, 배포 계획·검증, 테스트 기준, 연계 협의, 형상 통제·감사<\/td><\/tr><\/tbody><\/table><\/div>\n<h4>2) 수립·운영 체계<\/h4>\n<div class=\"tblwrap\"><table class=\"cmp\"><colgroup><col style=\"width:24%\"><col style=\"width:28%\"><col style=\"width:48%\"><\/colgroup><thead><tr><th>구분<\/th><th>특징<\/th><th>설명<\/th><\/tr><\/thead><tbody><tr><td class=\"k\">표준<\/td><td>기준점 제시<\/td><td>전 기관 공통 기준을 제시하되 그대로 복제하지 않고 테일러링 전제<\/td><\/tr><tr><td class=\"k\">테일러링<\/td><td>기관 특성 반영<\/td><td>시스템 등급·조직·승인 체계에 맞게 절차·승인 단계 조정<\/td><\/tr><tr><td class=\"k\">시스템화<\/td><td>ITSM·관리시스템<\/td><td>모든 단계가 시스템으로 처리되고 이력이 남도록 워크플로 구현<\/td><\/tr><tr><td class=\"k\">증적<\/td><td>기록·감사<\/td><td>요청·승인·변경·장애 처리 이력을 증적으로 보관, 내·외부 감사 대응<\/td><\/tr><tr><td class=\"k\">연계<\/td><td>SLA·예방점검<\/td><td>서비스수준협약·예방점검·장애 사후관리와 연결해 운영 성과 측정<\/td><\/tr><\/tbody><\/table><\/div>\n<h4>3) 도입 고려사항<\/h4>\n<div class=\"tblwrap\"><table class=\"cmp\"><colgroup><col style=\"width:24%\"><col style=\"width:28%\"><col style=\"width:48%\"><\/colgroup><thead><tr><th>구분<\/th><th>키워드<\/th><th>설명<\/th><\/tr><\/thead><tbody><tr><td class=\"k\">등급<\/td><td>차등 적용<\/td><td>A1은 변경관리위원회·2단계 승인 등 강화, A4는 간소화 허용<\/td><\/tr><tr><td class=\"k\">문서<\/td><td>매뉴얼 정합성<\/td><td>운영매뉴얼·구성도·비상연락망을 SOP와 일치시켜 현행화<\/td><\/tr><tr><td class=\"k\">자동화<\/td><td>모니터링·점검<\/td><td>임계치 관리·자동 점검 도구로 수작업 누락·오류 방지<\/td><\/tr><tr><td class=\"k\">성과<\/td><td>SLA·제재<\/td><td>서비스수준 미달·장시간 장애에 대한 제재 기준 마련·적용<\/td><\/tr><tr><td class=\"k\">개선<\/td><td>PDCA<\/td><td>장애·문제 관리 결과를 SOP 개정에 환류하는 개선 절차 수립<\/td><\/tr><\/tbody><\/table><\/div>", "rv": "<div class=\"q\"><b>두음: 요·변·장·문 / 서·구·이·백 / 운·배·테·연·형<\/b> — 공통 4 / 기반SW 4 / 응용 5 = 13개 절차<\/div>\n<div class=\"q\"><b>\"표준은 기준점, 적용은 테일러링 — 그리고 모든 단계는 기록으로 증명한다\"<\/b><\/div>", "img": "itpe-diagrams/125-public-is-sop.webp", "txt": null, "search": "행정·공공기관 정보시스템 표준운영절차(sop) 가이드 공공 정보시스템 sop 표준운영절차 가이드 정보전략·거버넌스 산업·공공 거버넌스 ⭐⭐ 기출빈출 기출 빈출 중요 행정·공공기관 정보시스템 표준운영절차(sop) 가이드 는 「전자정부법」 및 「정보시스템 안정성 고시」 에 근거하여 시스템 등급(a1~a4)별 요청·변경·장애·백업 등 13대 운영 절차의 표준 기준 을 제시하는 공공 정보시스템 운영 지침 근거 : 전자정부법 제56조의2~5, 안정성 고시 제10조(표준운영절차)·제11조(서비스수준협약)·제12조(예방점검) 등급 : a1(국가 핵심)·a2(대국민 필수)·a3(행정 중요)·a4(일반) — a1~a3는 필수, a4는 권고 공통 절차 : 요청·변경·장애·문제 관리 기반sw 절차 : 서비스수준·구성(cmdb)·이벤트·백업 관리 응용 절차 : 운영상태·배포·테스트·연계·형상 관리 운영 체계 : sop 관리시스템(이력·단계 승인), 운영·예방점검 매뉴얼, 사후관리(재발방지·개선) 1) sop 13개 절차 영역 구분 키워드 설명 공통 요청·변경·장애·문제 요청 접수·분류·승인, 변경 계획·원복, 장애 식별·복구, 문제 근본원인 분석 기반sw 서비스수준·구성·이벤트·백업 sla 정의·평가, cmdb 구성통제·감사, 이벤트 처리, 백업정책·이행 증적 응용 운영상태·배포·테스트·연계·형상 운영 모니터링, 배포 계획·검증, 테스트 기준, 연계 협의, 형상 통제·감사 2) 수립·운영 체계 구분 특징 설명 표준 기준점 제시 전 기관 공통 기준을 제시하되 그대로 복제하지 않고 테일러링 전제 테일러링 기관 특성 반영 시스템 등급·조직·승인 체계에 맞게 절차·승인 단계 조정 시스템화 itsm·관리시스템 모든 단계가 시스템으로 처리되고 이력이 남도록 워크플로 구현 증적 기록·감사 요청·승인·변경·장애 처리 이력을 증적으로 보관, 내·외부 감사 대응 연계 sla·예방점검 서비스수준협약·예방점검·장애 사후관리와 연결해 운영 성과 측정 3) 도입 고려사항 구분 키워드 설명 등급 차등 적용 a1은 변경관리위원회·2단계 승인 등 강화, a4는 간소화 허용 문서 매뉴얼 정합성 운영매뉴얼·구성도·비상연락망을 sop와 일치시켜 현행화 자동화 모니터링·점검 임계치 관리·자동 점검 도구로 수작업 누락·오류 방지 성과 sla·제재 서비스수준 미달·장시간 장애에 대한 제재 기준 마련·적용 개선 pdca 장애·문제 관리 결과 <td>SW진흥법·중소SW지침(타 사업 하한 미적용)·분담이행<\/td><\/tr><tr><td class=\"k\">핵심산출물<\/td><td>단일 계약·통합 설계·총괄 시험<\/td><td>사업별 RFP·인터페이스 정의서·통합관리계획<\/td><\/tr><tr><td class=\"k\">거버넌스·환류<\/td><td>과업심의·PMO 총괄<\/td><td>사업 간 인터페이스·통합 리스크 관리<\/td><\/tr><\/tbody><\/table><\/div>\n<h4>2) 대기업 참여제한과 예외<\/h4>\n<div class=\"tblwrap\"><table class=\"cmp\"><colgroup><col style=\"width:24%\"><col style=\"width:28%\"><col style=\"width:48%\"><\/colgroup><thead><tr><th>구분<\/th><th>기준<\/th><th>절차·비고<\/th><\/tr><\/thead><tbody><tr><td class=\"k\">사업금액 하한<\/td><td>매출 8천억 이상 대기업 80억원, 미만 40억원<\/td><td>공고문·RFP에 적용 여부·근거 명시<\/td><\/tr><tr><td class=\"k\">예외사업<\/td><td>국방·외교·치안·전력·국가안보, 불가피한 사유<\/td><td>전년도 12월 말까지 인정요청, 수시심의는 공고 45일 전<\/td><\/tr><tr><td class=\"k\">심의 결과<\/td><td>인정·부분인정·불인정<\/td><td>주계약자가 아닌 구성원 참여는 총사업비 20% 이내 조건<\/td><\/tr><tr><td class=\"k\">불가피 사유<\/td><td>신기술 적용, 장애 긴급 대응 하도급(10% 이내)<\/td><td>과기정통부 통지·적절성 평가<\/td><\/tr><tr><td class=\"k\">사후 관리<\/td><td>사전규격·RFP 일치 확인<\/td><td>불일치 시 시정 요구·개선조치 결과 통보(1개월)<\/td><\/tr><\/tbody><\/table><\/div>\n<h4>3) 과업심의·PMO 운영<\/h4>\n<div class=\"tblwrap\"><table class=\"cmp\"><colgroup><col style=\"width:24%\"><col style=\"width:28%\"><col style=\"width:48%\"><\/colgroup><thead><tr><th>구분<\/th><th>키워드<\/th><th>설명<\/th><\/tr><\/thead><tbody><tr><td class=\"k\">시점<\/td><td>분석·설계 완료<\/td><td>과업 내용이 구체화된 시점에 변경 가능성·추가 업무 심의<\/td><\/tr><tr><td class=\"k\">사전 확인<\/td><td>사업자 의견<\/td><td>발주기관이 계약금액·기간 조정사항을 사업자에게 사전 확인<\/td><\/tr><tr><td class=\"k\">계약 연계<\/td><td>국가계약법<\/td><td>과업 변경에 따른 계약금액 조정 근거 정비 필요<\/td><\/tr><tr><td class=\"k\">PMO<\/td><td>사업관리 지원<\/td><td>요구·일정·품질·리스크 관리, 감리와 역할 분리<\/td><\/tr><tr><td class=\"k\">리스크<\/td><td>요구 변동<\/td><td>초기 요구 확정·변경관리 기준선·과업심의로 대응<\/td><\/tr><\/tbody><\/table><\/div>", "rv": "<div class=\"q\"><b>두음: 대·예·분·과·피 — 대기업 제한·예외심의·분할발주·과업심의·PMO<\/b><\/div>\n<div class=\"q\"><b>\"하한(80·40억)으로 대기업을 거르고, 과업심의로 변경을 관리하고, PMO로 발주역량을 보강한다\"<\/b><\/div>", "img": "itpe-diagrams/142-large-scale-is-project.webp", "txt": nul ": "정보전략·거버넌스", "st": "📌 복습 필요", "d": "2026-11-23", "def": "<p>AI를 활용해 학습자 수준을 진단하고 맞춤 콘텐츠를 처방하는 <b>AI 디지털교과서(AIDT)<\/b>의 개념·플랫폼 구조와, 콘텐츠·학습데이터·AI 생성물에 걸친 <b>지식재산권 쟁점<\/b><\/p>", "kw": "<ul class=\"kw\"><li><b>개념·특징<\/b>: AI 기반 <b>개인 맞춤 학습(진단-처방)<\/b>, 학습이력·메타데이터 수집, 교사 대시보드, 2025년 도입<\/li><li><b>플랫폼 구조<\/b>: 학습 콘텐츠 저장소 · <b>LMS(학습관리시스템)<\/b> · 추천 엔진 · 평가·분석 · 대시보드, 표준(xAPI·IMS·KERIS)<\/li><li><b>핵심 기능·서비스<\/b>: 적응형 학습, AI 튜터·조교, 자동 채점·피드백, 학습분석(Learning Analytics), 특수교육 지원<\/li><li><b>지식재산권<\/b>: 콘텐츠 저작권(2차적 이용·라이선스), 학습데이터 권리(개인정보·DB 제작자 권리), <b>AI 생성물 저작권(인간 창작성 요건)<\/b>, 특허(학습 알고리즘)·상표<\/li><li><b>쟁점<\/b>: TDM(텍스트·데이터 마이닝) 예외·공정이용, 데이터 주권·플랫폼 종속, 학생 개인정보·민감정보 보호<\/li><\/ul>", "pp": "<h4>1) 관점별 구성<\/h4>\n<div class=\"tblwrap\"><table class=\"cmp\"><colgroup><col style=\"width:24%\"><col style=\"width:28%\"><col style=\"width:48%\"><\/colgroup><thead><tr><th>관점(측면)<\/th><th>특징<\/th><th>설명<\/th><\/tr><\/thead><tbody><tr><td class=\"k\">교육 서비스<\/td><td>개인 맞춤<\/td><td>진단-처방-피드백, 학습격차 완화·특수교육 지원<\/td><\/tr><tr><td class=\"k\">기술 구조<\/td><td>플랫폼·표준<\/td><td>LMS·추천엔진·학습분석, xAPI 등 표준 연동<\/td><\/tr><tr><td class=\"k\">데이터<\/td><td>학습데이터<\/td><td>학습이력·메타데이터 수집, 품질·편향 관리<\/td><\/tr><tr><td class=\"k\">지재권<\/td><td>권리 귀속<\/td><td>콘텐츠·데이터·생성물별 권리자·이용조건 정리<\/td><\/tr><tr><td class=\"k\">보호·쟁점<\/td><td>개인정보·TDM<\/td><td>학생 민감정보 보호, 학습목적 TDM 예외 범위<\/td><\/tr><\/tbody><\/table><\/div>", "rv": "<div class=\"q\"><b>두음: 개·학·지·보<\/b> — 개인맞춤 · 학습데이터 · 지식재산권 · 개인정보 보호<\/div>\n<div class=\"q\"><b>\"AI 생성물은 인간의 창작적 기여가 있어야 보호\"<\/b> — 데이터는 개인정보·DB권, 콘텐츠는 저작권으로 나눠 판단!<\/div>", "img": "itpe-diagrams/108-ai-textbook-ip.webp", "txt": null, "search": "ai 디지털교과서 · 지식재산권 ai 디지털교과서 · 지재권 개·학·지·보 / tdm 정보전략·거버넌스 지식재산·라이선스 빨간별 빨간 별 빨간색 별 ★ 레드별 심화반 심화 선택 ai를 활용해 학습자 수준을 진단하고 맞춤 콘텐츠를 처방하는 ai 디지털교과서(aidt) 의 개념·플랫폼 구조와, 콘텐츠·학습데이터·ai 생성물에 걸친 지식재산권 쟁점 개념·특징 : ai 기반 개인 맞춤 학습(진단-처방) , 학습이력·메타데이터 수집, 교사 대시보드, 2025년 도입 플랫폼 구조 : 학습 콘텐츠 저장소 · lms(학습관리시스템) · 추천 엔진 · 평가·분석 · 대시보드, 표준(xapi·ims·keris) 핵심 기능·서비스 : 적응형 학습, ai 튜터·조교, 자동 채점·피드백, 학습분석(learning analytics), 특수교육 지원 지식재산권 : 콘텐츠 저작권(2차적 이용·라이선스), 학습데이터 권리(개인정보·db 제작자 권리), ai 생성물 저작권(인간 창작성 요건) , 특허(학습 알고리즘)·상표 쟁점 : tdm(텍스트·데이터 마이닝) 예외·공정이용, 데이터 주권·플랫폼 종속, 학생 개인정보·민감정보 보호 1) 관점별 구성 관점(측면) 특징 설명 교육 서비스 개인 맞춤 진단-처방-피드백, 학습격차 완화·특수교육 지원 기술 구조 플랫폼·표준 lms·추천엔진·학습분석, xapi 등 표준 연동 데이터 학습데이터 학습이력·메타데이터 수집, 품질·편향 관리 지재권 권리 귀속 콘텐츠·데이터·생성물별 권리자·이용조건 정리 보호·쟁점 개인정보·tdm 학생 민감정보 보호, 학습목적 tdm 예외 범위 두음: 개·학·지·보 — 개인맞춤 · 학습데이터 · 지식재산권 · 개인정보 보호 \"ai 생성물은 인간의 창작적 기여가 있어야 보호\" — 데이터는 개인정보·db권, 콘텐츠는 저작권으로 나눠 판단!"}, {"id": "intellectual-property", "cat": "gov", "sub": "gov-ip", "parent": null, "t": "지식재산권 (IP)", "s": "산·저·신 / 특·실·상·디", "stars": 0, "redStar": true, "full": "지식재산권 (Intellectual Property, IP)", "catLabel": "정보전략·거버넌스", "st": "📌 복습 필요", "d": "2026-11-23", "def": "<p>인간의 지적 창작물과 산업상 영업 표지 등에 대해 법이 부여하는 배타적 재산권으로, 크게 <b>산업재산권 · 저작권 · 신지식재산권(산·저·신)<\/b>의 3대 체계로 구분됨<\/p>", "kw": "<ul class=\"kw\"><li><b>① 산업재산권 (특·실·상·디)<\/b>: 특허청 출원·심사 <b>등록주의<\/b>, 산업발전 목적<ul class=\"kw\"><li><b>특허권(Patent)<\/b>: 고도한 기술적 사상의 창작(대발명), 출원일로부터 <b>20년<\/b><\/li><li><b>실용신안권(Utility Model)<\/b>: 물품의 형상·구조·조합 고안(소발명), 출원일로부터 <b>10년<\/b><\/li><li><b>상표권(Trademark)<\/b>: 상품·서비스 식별 표지, 등록일로부터 <b>10년(10년마다 무한 갱신 가능)<\/b><\/li><li><b>디자인권(Design)<\/b>: 물품 외관(형상·모양·색채의 시각적 미감), 설정등록일로부터 <b>20년<\/b><\/li><\/ul><\/li><li><b>② 저작권 (인·재·접)<\/b>: 창작과 동시에 권리 발생하는 <b>무방식주의<\/b>, 문화·관련 산업 발전 목적<ul class=\"kw\"><li><b>저작인격권 (공·성·동)<\/b>: 공표권 · 성명표시권 · 동일성유지권 (<b>일신전속권<\/b>: 양도·상속 불가)<\/li><li><b>저작재산권 (복·공·공·전·배·대·2)<\/b>: 복제·공연·공중송신(방송·전송)·전시·배포·대여·2차적저작물작성권 (원칙: 생존 + <b>사후 70년<\/b>)<\/li><li><b>저작인접권 (실·음·방)<\/b>: 실연자 · 음반제작자 · 방송사업자 권리 (실연·음반 70년, 방송 50년)<\/li><\/ul><\/li><li><b>③ 신지식재산권 (첨·산·정)<\/b>: IT·과학기술 발전에 따라 전통 체계로 포섭하기 어려운 새로운 권리군<ul class=\"kw\"><li><b>첨단산업재산권<\/b>: 반도체집적회로 배치설계권(10년), 컴퓨터프로그램 저작물, AI 생성물·학습데이터, 생명공학(유전자·식물신품종)<\/li><li><b>산업저작권<\/b>: <b>영업비밀(비·경·비: 비공지성·경제적 유용성·비밀관리성)<\/b>, 데이터베이스(DB) 제작자 권리(5년)<\/li><li><b>정보재산권<\/b>: 도메인이름, 캐릭터·퍼블리시티권(초상·성명), 디지털 콘텐츠·NFT<\/li><\/ul><\/li><li><b>IT·AI 최신 쟁점<\/b>: AI 학습용 데이터 <b>TDM(텍스트·데이터 마이닝) 면책<\/b> 및 공정이용, AI 단독 생성물의 인간 창작성 결여(저작권 불인정 원칙)<\/li><\/ul>", "pp": "<h4>1) 3대 지재권 비교 (산·저·신)<\/h4>\n<div class=\"tblwrap\"><table class=\"cmp\"><colgroup><col style=\"width:24%\"><col style=\"width:28%\"><col style=\"width:48%\"><\/colgroup><thead><tr><th>구분<\/th><th>주요 권리<\/th><th>발생 요건 · 보호 기간<\/th><\/tr><\/thead><tbody><tr><td class=\"k\">산업재산권<\/td><td>특허 · 실용신안 · 상표 · 디자인<\/td><td>출원·심사 <b>등록주의<\/b> · 10~20년(상표 갱신)<\/td><\/tr><tr><td class=\"k\">저작권<\/td><td>저작인격권 · 저작재산권 · 저작인접권<\/td><td>창작 시 자동 발생(<b>무방식주의<\/b>) · 사후 70년<\/td><\/tr><tr><td class=\"k\">신지식재산권<\/td><td>첨단산업 · 산업저작권 · 정보재산권<\/td><td>개별 특별법 보호 · 반도체 10년, DB권 5년 등<\/td><\/tr><\/tbody><\/table><\/div>\n<h4>2) 하위 권리별 상세 비교<\/h4>\n<div class=\"tblwrap\"><table class=\"cmp\"><colgroup><col style=\"width:24%\"><col style=\"width:28%\"><col style=\"width:48%\"><\/colgroup><thead><tr><th>권리명<\/th><th>보호 대상 · 핵심 요건<\/th><th>보호 기간 · 실무 포인트<\/th><\/tr><\/thead><tbody><tr><td class=\"k\">특허 / 실용신안<\/td><td>자연법칙 이용한 기술적 창작(신규·진보·산업이용)<\/td><td>특허 출원 후 <b>20년<\/b> / 실용신안 출원 후 <b>10년<\/b><\/td><\/tr><tr><td class=\"k\">상표 / 디자인<\/td><td>자타 상품 식별 표지 / 물품 외관 심미감<\/td><td>상표 <b>10년(갱신)<\/b> / 디자인 등록 후 <b>20년<\/b><\/td><\/tr><tr><td class=\"k\">저작인격 / 재산권<\/td><td>사상·감정 표현 창작물 (아이디어가 아닌 표현)<\/td><td>인격권(양도불가) / 재산권(사후 <b>70년<\/b>)<\/td><\/tr><tr><td class=\"k\">영업비밀 (Trade Secret)<\/td><td>비공지성 · 경제적 유용성 · 비밀관리성(<b>비·경·비<\/b>)<\/td><td>비밀 유지 기간 중 계속 보호 (부정경쟁방지법)<\/td><\/tr><tr><td class=\"k\">SW · DB · AI<\/td><td>컴퓨터프로그램(저작권), DB 제작자(투자 보호)<\/td><td>DB권 <b>5년<\/b>, AI 학습 <b>TDM<\/b>·생성물 창작성 쟁점<\/td><\/tr><\/tbody><\/table><\/div>", "rv": "<div class=\"q\"><b>두음: 산·저·신 / 특·실·상·디 / 인(공·성·동)·재·접(실·음·방) / 첨·산·정<\/b><\/div>\n<div class=\"q\"><b>\"아이디어는 특허, 표현은 저작권, 숨길 기술은 영업비밀(비·경·비)!\"<\/b> — 보호 기간 숫자(특20·실10·상10갱신·디20 / 저작 사후70·DB5)까지 같이 짚으면 고득점!<\/div>", "img": "itpe-diagrams/112-intellectual-property.webp", "txt": null, "search": "지식재산권 (intellectual property, ip) 지식재산권 (ip) 산·저·신 / 특·실·상·디 정보전략·거버넌스 지식재산·라이선스 빨간별 빨간 별 빨간색 별 ★ 레드별 심화반 심화 선택 인간의 지적 창작물과 산업상 영업 표지 등에 대해 법이 부여하는 배타적 재산권으로, 크게 산업재산권 · 저작권 · 신지식재산권(산·저·신) 의 3대 체계로 구분됨 ① 산업재산권 (특·실·상·디) : 특허청 출원·심사 등록주의 , 산업발전 목적 특허권(patent) : 고도한 기술적 사상의 창작(대발명), 출원일로부터 20년 실용신안권(utility model) : 물품의 형상·구조·조합 고안(소발명), 출원일로부터 10년 상표권(trademark) : 상품·서비스 식별 표지, 등록일로부터 10년(10년마다 무한 갱신 가능) 디자인권(design) : 물품 외관(형상·모양·색채의 시각적 미감), 설정등록일로부터 20년 ② 저작권 (인·재·접) : 창작과 동시에 권리 발생하는 무방식주의 , 문화·관련 산업 발전 목적 저작인격권 (공·성·동) : 공표권 · 성명표시권 · 동일성유지권 ( 일신전속권 : 양도·상속 불가) 저작재산권 (복·공·공·전·배·대·2) : 복제·공연·공중송신(방송·전송)·전시·배포·대여·2차적저작물작성권 (원칙: 생존 + 사후 70년 ) 저작인접권 (실·음·방) : 실연자 · 음반제작자 · 방송사업자 권리 (실연·음반 70년, 방송 50년) ③ 신지식재산권 (첨·산·정) : it·과학기술 발전에 따라 전통 체계로 포섭하기 어려운 새로운 권리군 첨단산업재산권 : 반도체집적회로 배치설계권(10년), 컴퓨터프로그램 저작물, ai 생성물·학습데이터, 생명공학(유전자·식물신품종) 산업저작권 : 영업비밀(비·경·비: 비공지성·경제적 유용성·비밀관리성) , 데이터베이스(db) 제작자 권리(5년) 정보재산권 : 도메인이름, 캐릭터·퍼블리시티권(초상·성명), 디지털 콘텐츠·nft it·ai 최신 쟁점 : ai 학습용 데이터 tdm(텍스트·데이터 마이닝) 면책 및 공정이용, ai 단독 생성물의 인간 창작성 결여(저작권 불인정 원칙) 1) 3대 지재권 비교 (산·저·신) 구분 주요 권리 발생 요건 · 보호 기간 산업재산권 특허 · 실용신안 · 상표 · 디자인 출원·심사 등록주의 · 10~20년(상표 갱신) 저작권 저작인격권 · 저작재산권 · 저작인접권 창작 시 자동 발생( 무방식주의 ) · 사후 70년 신지식재산권 첨단산업 · 산업저작권 · 정보재산권 개별 특별법 보호 · 반도체 10년, db권 5년 등 2) 하위 권리별 상세 비교 권리명 보호 대상 · 핵심 요건 보호 기간 · 실무 포인트 특허 / 실용신안 자연법칙 이용한 기술적 창작(신규·진보·산업이용) 특허 출원 후 20년 / 실용신안 출원 후 10년 상표 / 디자인 자타 상품 식별 표지 / 물품 외관 심미감 상표 10년(갱신) / 디자인 등록 후 20년 저작인격 / 재산권 사상·감정 표현 창작물 (아이디어가 아닌 표현) 인격권(양도불가) / 재산권(사후 70년 ) 영업비밀 (trade secret) 비공지성 · 경제적 유용성 · 비밀관리성( 비·경·비 ) 비밀 유지 기간 중 계속 보호 (부정경쟁방지법) sw · db · ai 컴퓨터프로그램(저작권), db 제작자(투자 보호) db권 5년 , ai 학습 tdm ·생성물 창작성 쟁점 두음: 산·저·신 / 특·실·상·디 / 인(공·성·동)·재·접(실·음·방) / 첨·산·정 \"아이디어는 특허, 표현은 저작권, 숨길 기술은 영업비밀(비·경·비)!\" — 보호 기간 숫자(특20·실10·상10갱신·디20 / 저작 사후70·db5)까지 같이 짚으면 고득점!"}, {"id": "scrum", "cat": "pm", "sub": "pm-agile", "parent": null, "t": "애자일 스크럼 3·5·3", "s": "피에개·스플데리회·제스증", "stars": 3, "redStar": false, "full": "애자일 스크럼(Scrum) 3·5·3 체계", "catLabel": "프로젝트 관리", "st": "📌 복습 필요", "d": "2026-11-21", "def": "<p>경험적 프로세스 제어(<b>투명성·점검·적응<\/b>)를 기반으로 1~4주의 짧은 반복 주기(<b>Sprint<\/b>)마다 동작 가능한 제품 증분을 전달하는 대표적인 <b>애자일 프로젝트 관리 프레임워크<\/b><\/p>", "kw": "<ul class=\"kw\"><li><b>3대 역할 (피·에·개)<\/b>: <b>PO<\/b>(제품 책임자·백로그 우선순위) · <b>SM<\/b>(스크럼 마스터·장애물 제거/코칭) · <b>Developers<\/b>(자율적 개발 실행)<\/li><li><b>5대 이벤트 (스·플·데·리·회)<\/b>: <b>Sprint<\/b>(1~4주) · <b>Sprint Planning<\/b>(목표·계획) · <b>Daily Scrum<\/b>(15분 일일 동기화) · <b>Sprint Review<\/b>(이해관계자 시연·피드백) · <b>Sprint Retrospective<\/b>(팀 프로세스 회고·개선)<\/li><li><b>3대 산출물 (제·스·증)<\/b>: <b>Product Backlog<\/b> · <b>Sprint Backlog<\/b> · <b>Increment<\/b>(완료 정의 DoD 충족)<\/li><\/ul>", "pp": "<div class=\"tblwrap\"><table class=\"cmp\"><colgroup><col style=\"width:24%\"><col style=\"width:28%\"><col style=\"width:48%\"><\/colgroup><thead><tr><th>관점(측면)<\/th><th>특징<\/th><th>설명<\/th><\/tr><\/thead><tbody><tr><td class=\"k\">조직·역할 관점<\/td><td>피·에·개 (3역할)<\/td><td>비즈니스 가치(PO)·프로세스 촉진(SM)·기술 구현(개발팀)의 명확한 견제와 균형<\/td><\/tr><tr><td class=\"k\">프로세스·리듬 관점<\/td><td>스·플·데·리·회 (5이벤트)<\/td><td>짧은 피드백 루프로 요구사항 변경 수용(Review=제품 점검, Retro=방식 점검)<\/td><\/tr><tr><td class=\"k\">산출물·품질 관점<\/td><td>제·스·증 + DoD<\/td><td>완료의 정의(Definition of Done)를 통과한 잠재적 출시 가능 증분 산출<\/td><\/tr><tr><td class=\"k\">지표·추적 관점<\/td><td>번다운/번업 · 속도(Velocity)<\/td><td>일일 잔여량(번다운)·범위 변화(번업)로 스프린트 진행률 가시화<\/td><\/tr><\/tbody><\/table><\/div>", "rv": "<div class=\"q\"><b>두음: 피·에·개 / 스·플·데·리·회 / 제·스·증<\/b> — 3역할·5이벤트·3산출물 3·5·3 세트 완벽 암기!<\/div>\n<div class=\"q\"><b>Review(제품 증분 점검) vs Retrospective(팀 작업 방식 개선)<\/b> 구분 단골!<\/div>", "img": "itpe-diagrams/64-scrum-353.webp", "txt": null, "search": "애자일 스크럼(scrum) 3·5·3 체계 애자일 스크럼 3·5·3 피에개·스플데리회·제스증 프로젝트 관리 애자일·스크럼 ⭐⭐⭐ 기출빈출 기출 빈출 중요 경험적 프로세스 제어( 투명성·점검·적응 )를 기반으로 1~4주의 짧은 반복 주기( sprint )마다 동작 가능한 제품 증분을 전달하는 대표적인 애자일 프로젝트 관리 프레임워크 3대 역할 (피·에·개) : po (제품 책임자·백로그 우선순위) · sm (스크럼 마스터·장애물 제거/코칭) · developers (자율적 개발 실행) 5대 이벤트 (스·플·데·리·회) : sprint (1~4주) · sprint planning (목표·계획) · daily scrum (15분 일일 동기화) · sprint review (이해관계자 시연·피드백) · sprint retrospective (팀 프로세스 회고·개선) 3대 산출물 (제·스·증) : product backlog · sprint backlog · increment (완료 정의 dod 충족) 관점(측면) 특징 설명 조직·역할 관점 피·에·개 (3역할) 비즈니스 가치(po)·프로세스 촉진(sm)·기술 구현(개발팀)의 명확한 견제와 균형 프로세스·리듬 관점 스·플·데·리·회 (5이벤트) 짧은 피드백 루프로 요구사항 변경 수용(review=제품 점검, retro=방식 점검) 산출물·품질 관점 제·스·증 + dod 완료의 정의(definition of done)를 통과한 잠재적 출시 가능 증분 산출 지표·추적 관점 번다운/번업 · 속도(velocity) 일일 잔여량(번다운)·범위 변화(번업)로 스프린트 진행률 가시화 두음: 피·에·개 / 스·플·데·리·회 / 제·스·증 — 3역할·5이벤트·3산출물 3·5·3 세트 완벽 암기! review(제품 증분 점검) vs retrospective(팀 작업 방식 개선) 구분 단골!"}, {"id": "cpm-pert", "cat": "pm", "sub": "pm-plan", "parent": null, "t": "CPM · PERT (주공정법)", "s": "(O+4M+P)/6 / 크래싱·패스트", "stars": 3, "redStar": false, "full": "CPM(주공정법)과 PERT", "catLabel": "프로젝트 관리", "st": "📌 복습 필요", "d": "2026-11-21", "def": "<p>프로젝트 활동 간 선후행 의존관계를 네트워크 공정도로 모델링하여, <b>여유시간(Float/Slack)이 0인 최장 경로(주공정, Critical Path)<\/b>를 도출해 최단 완료일정과 리스크를 관리하는 기법<\/p>", "kw": "<ul class=\"kw\"><li><b>핵심 계산<\/b>: 전진계산(<b>ES·EF<\/b>) → 후진계산(<b>LS·LF<\/b>) → <b>Float = LS - ES = LF - EF = 0<\/b>인 경로가 <b>Critical Path<\/b><\/li><li><b>PERT 3점 추정 공식<\/b>: 불확실한 R&amp;D/신규 개발 시 <b>Te = (O + 4M + P) / 6<\/b> (낙관치 O·최빈치 M·비관치 P)<\/li><li><b>일정 단축 2대 기법 (크·패)<\/b>:<ul class=\"kw\"><li><b>Crashing (자원 추가)<\/b>: 주공정 작업에 인력·비용 추가 투입(비용↑·의사소통 오버헤드 주의)<\/li><li><b>Fast Tracking (병행 수행)<\/b>: 순차 작업을 겹쳐 동시 진행(비용 추가↓·재작업 리스크↑)<\/li><\/ul><\/li><\/ul>", "pp": "<p><b>1) 개념 비교 (CPM vs PERT)<\/b><\/p>\n<div class=\"tblwrap\"><table class=\"cmp\"><colgroup><col style=\"width:24%\"><col style=\"width:28%\"><col style=\"width:48%\"><\/colgroup><thead><tr><th>구분<\/th><th>CPM (주공정법)<\/th><th>PERT (프로그램 평가·검토 기법)<\/th><\/tr><\/thead><tbody><tr><td class=\"k\">기간 추정 방식<\/td><td>확정적(Deterministic) 단일 추정<\/td><td>확률적(Probabilistic) 3점 추정 (O+4M+P)/6<\/td><\/tr><tr><td class=\"k\">주요 초점 · 적용<\/td><td>비용-기간 트레이드오프 · 경험 있는 구축<\/td><td>일정 불확실성(표준편차) 관리 · R&amp;D·신규<\/td><\/tr><\/tbody><\/table><\/div>\n<p><b>2) 실무·일정 관리 관점 구성표<\/b><\/p>\n<div class=\"tblwrap\"><table class=\"cmp\"><colgroup><col style=\"width:24%\"><col style=\"width:28%\"><col style=\"width:48%\"><\/colgroup><thead><tr><th>관점(측면)<\/th><th>특징<\/th><th>설명<\/th><\/tr><\/thead><tbody><tr><td class=\"k\">주공정 통제 관점<\/td><td>Float = 0 집중 관리<\/td><td>주공정 작업이 1일 지연되면 전체 프로젝트 완료일이 1일 지연됨<\/td><\/tr><tr><td class=\"k\">일정 단축 관점<\/td><td>Crashing vs Fast Tracking<\/td><td>먼저 비용 적은 Fast Tracking 검토 후, 주공정 단위비용 낮은 작업부터 Crashing<\/td><\/tr><tr><td class=\"k\">애자일·현대 PM 연계<\/td><td>EVM(SPI) · WBS 기반<\/td><td>WBS 작업 패키지를 네트워크로 연결하고 EVM으로 일정 성과지수(SPI) 추적<\/td><\/tr><\/tbody><\/table><\/div>", "rv": "<div class=\"q\"><b>두음: 오·사·피·육 / 크·패<\/b> — (O+4M+P)/6 / Crashing(자원투입)·Fast Tracking(병행)<\/div>\n<div class=\"q\"><b>Float=0 주공정 + PERT 3점 추정 공식 + Crashing vs Fast Tracking<\/b>!<\/div>", "img": "itpe-diagrams/73-cpm-pert.webp", "txt": null, "search": "cpm(주공정법)과 pert cpm · pert (주공정법) (o+4m+p)/6 / 크래싱·패스트 프로젝트 관리 일정·원가 관리 ⭐⭐⭐ 기출빈출 기출 빈출 중요 프로젝트 활동 간 선후행 의존관계를 네트워크 공정도로 모델링하여, 여유시간(float/slack)이 0인 최장 경로(주공정, critical path) 를 도출해 최단 완료일정과 리스크를 관리하는 기법 핵심 계산 : 전진계산( es·ef ) → 후진계산( ls·lf ) → float = ls - es = lf - ef = 0 인 경로가 critical path pert 3점 추정 공식 : 불확실한 r&amp;d/신규 개발 시 te = (o + 4m + p) / 6 (낙관치 o·최빈치 m·비관치 p) 일정 단축 2대 기법 (크·패) : crashing (자원 추가) : 주공정 작업에 인력·비용 추가 투입(비용↑·의사소통 오버헤드 주의) fast tracking (병행 수행) : 순차 작업을 겹쳐 동시 진행(비용 추가↓·재작업 리스크↑) 1) 개념 비교 (cpm vs pert) 구분 cpm (주공정법) pert (프로그램 평가·검토 기법) 기간 추정 방식 확정적(deterministic) 단일 추정 확률적(probabilistic) 3점 추정 (o+4m+p)/6 주요 초점 · 적용 비용-기간 트레이드오프 · 경험 있는 구축 일정 불확실성(표준편차) 관리 · r&amp;d·신규 2) 실무·일정 관리 관점 구성표 관점(측면) 특징 설명 주공정 통제 관점 float = 0 집중 관리 주공정 작업이 1일 지연되면 전체 프로젝트 완료일이 1일 지연됨 일정 단축 관점 crashing vs fast tracking 먼저 비용 적은 fast tracking 검토 후, 주공정 단위비용 낮은 작업부터 crashing 애자일·현대 pm 연계 evm(spi) · wbs 기반 wbs 작업 패키지를 네트워크로 연결하고 evm으로 일정 성과지수(spi) 추적 두음: 오·사·피·육 / 크·패 — (o+4m+p)/6 / crashing(자원투입)·fast tracking(병행) float=0 주공정 + pert 3점 추정 공식 + crashing vs fast tracking !"}, {"id": "burn", "cat": "pm", "sub": "pm-agile", "parent": null, "t": "번다운 vs 번업 차트", "s": "애자일 진행 관리", "stars": 0, "redStar": false, "full": "번다운 차트 vs 번업 차트", "catLabel": "프로젝트 관리", "st": "📌 복습 필요", "d": "2026-11-19", "def": "<p>애자일(스크럼)에서 시간 경과에 따른 작업 진행률을 추적하는 시각화 도구로, <b>번다운은 '남은 작업량'의 감소<\/b>를, <b>번업은 '완료 작업량'의 증가와 '전체 범위(Scope)'<\/b>를 함께 표시하는 차트.<\/p>", "kw": "<ul class=\"kw\"><li><b>번다운 차트 (Burndown Chart)<\/b>: Y축이 <b>남은 작업량(Remaining Work)<\/b>, 0을 향해 우하향. 직관적이지만 작업이 추가(Scope Creep)되어도 완료가 늦어진 건지 범위가 늘어난 건지 구분하기 어려움<\/li><li><b>번업 차트 (Burnup Chart)<\/b>: Y축이 <b>누적 완료량(Completed Work)<\/b>으로 우상향하며, 상단에 <b>전체 범위선(Total Scope Line)<\/b>을 별도 표시<\/li><li><b>결정적 차이<\/b>: <b>요구사항(범위) 변경 가시성<\/b> — 번업 차트는 완료량과 범위 변경을 분리해 보여주므로 릴리즈·대규모 프로젝트 관리에 유리<\/li><li>관련 지표: <b>스토리 포인트(Story Point)<\/b>, <b>속도(Velocity)<\/b>, 이상적 진행선(Ideal Line) vs 실제 진행선(Actual Line)<\/li><\/ul>", "pp": "<div class=\"tblwrap\"><table class=\"cmp\"><colgroup><col style=\"width:24%\"><col style=\"width:28%\"><col style=\"width:48%\"><\/colgroup><thead><tr><th>관점(측면)<\/th><th>특징<\/th><th>설명<\/th><\/tr><\/thead><tbody><tr><td class=\"k\">측정 대상<\/td><td>남은 일 vs 완료량<\/td><td>번다운은 남은 작업량의 감소, 번업은 누적 완료량의 증가를 Y축으로 표시<\/td><\/tr><tr><td class=\"k\">범위 변경<\/td><td>전체 범위선 분리<\/td><td>번업은 Scope Line을 따로 그려 작업 추가(Scope Creep)와 진행 지연을 구분<\/td><\/tr><tr><td class=\"k\">활용 상황<\/td><td>스프린트 vs 릴리즈<\/td><td>번다운은 단기 스프린트 일일 추적, 번업은 범위가 변하는 대규모·릴리즈 관리에 적합<\/td><\/tr><tr><td class=\"k\">보조 지표<\/td><td>속도·이상선<\/td><td>이상 진행선과 실제선의 괴리로 지연을 조기 감지하고 속도(Velocity)로 잔여 일정 예측<\/td><\/tr><\/tbody><\/table><\/div>", "rv": "<div class=\"q\"><b>두음: 남·완·범<\/b> — 남(번다운=남은 작업량)·완(번업=누적 완료량)·범(전체 범위선 분리)<\/div>\n<div class=\"q\">\"번다운=남은 일 감소(우하향), 번업=완료량 증가(우상향) + <b>전체 범위선(Scope Line) 분리 표시로 범위 변경 파악<\/b>\" 이 한 줄이 핵심 채점 포인트!<\/div>", "img": "itpe-diagrams/09-%EB%B2%88%EB%8B%A4%EC%9A%B4-%EB%B2%88%EC%97%85%EC%B0%A8%ED%8A%B8.webp", "txt": null, "search": "번다운 차트 vs 번업 차트 번다운 vs 번업 차트 애자일 진행 관리 프로젝트 관리 애자일·스크럼 애자일(스크럼)에서 시간 경과에 따른 작업 진행률을 추적하는 시각화 도구로, 번다운은 '남은 작업량'의 감소 를, 번업은 '완료 작업량'의 증가와 '전체 범위(scope)' 를 함께 표시하는 차트. 번다운 차트 (burndown chart) : y축이 남은 작업량(remaining work) , 0을 향해 우하향. 직관적이지만 작업이 추가(scope creep)되어도 완료가 늦어진 건지 범위가 늘어난 건지 구분하기 어려움 번업 차트 (burnup chart) : y축이 누적 완료량(completed work) 으로 우상향하며, 상단에 전체 범위선(total scope line) 을 별도 표시 결정적 차이 : 요구사항(범위) 변경 가시성 — 번업 차트는 완료량과 범위 변경을 분리해 보여주므로 릴리즈·대규모 프로젝트 관리에 유리 관련 지표: 스토리 포인트(story point) , 속도(velocity) , 이상적 진행선(ideal line) vs 실제 진행선(actual line) 관점(측면) 특징 설명 측정 대상 남은 일 vs 완료량 번다운은 남은 작업량의 감소, 번업은 누적 완료량의 증가를 y축으로 표시 범위 변경 전체 범위선 분리 번업은 scope line을 따로 그려 작업 추가(scope creep)와 진행 지연을 구분 활용 상황 스프린트 vs 릴리즈 번다운은 단기 스프린트 일일 추적, 번업은 범위가 변하는 대규모·릴리즈 관리에 적합 보조 지표 속도·이상선 이상 진행선과 실제선의 괴리로 지연을 조기 감지하고 속도(velocity)로 잔여 일정 예측 두음: 남·완·범 — 남(번다운=남은 작업량)·완(번업=누적 완료량)·범(전체 범위선 분리) \"번다운=남은 일 감소(우하향), 번업=완료량 증가(우상향) + 전체 범위선(scope line) 분리 표시로 범위 변경 파악 \" 이 한 줄이 핵심 채점 포인트!"}, {"id": "fp", "cat": "pm", "sub": "pm-plan", "parent": null, "t": "기능 점수법 (FP)", "s": "ILF·EIF·EI·EO·EQ / 정규·간이", "stars": 3, "redStar": false, "full": "기능 점수법 (FP, Function Point)", "catLabel": "프로젝트 관리", "st": "📌 복습 필요", "d": "2026-11-20", "def": "<p>코드 라인 수(LOC)가 아닌 <b>사용자 관점의 기능 수와 복잡도<\/b>를 기준으로 소프트웨어 개발 규모와 대가를 산정하는 표준 기법 (ISO/IEC 20926, 국내 공공 SW 사업 대가산정 기준)<\/p>", "kw": "<ul class=\"kw\"><li><b>5가지 기능 유형 (데이터 2 + 트랜잭션 3)<\/b>:<ul class=\"kw\"><li><b>ILF<\/b> (Internal Logical File, 내부논리파일): 시스템 내부에서 유지·관리하는 논리 데이터<\/li><li><b>EIF<\/b> (External Interface File, 외부연계파일): 타 시스템에서 참조만 하는 외부 데이터<\/li><li><b>EI<\/b> (External Input, 외부입력): 데이터 추가·변경·삭제(등록/수정/삭제) 기능<\/li><li><b>EO<\/b> (External Output, 외부출력): <b>계산·가공·파생<\/b> 로직이 포함된 출력(통계·리포트)<\/li><li><b>EQ<\/b> (External Inquiry, 외부조회): 별도 가공 없이 단순 검색·조회 출력<\/li><\/ul><\/li><li><b>정규법 vs 간이법<\/b>:<ul class=\"kw\"><li><b>정규법<\/b>: DET(데이터 요소)·RET(레코드 요소)·FTR(참조 파일)로 복잡도(하/중/상)를 정밀 측정하고 <b>VAF(가치조정인자)<\/b> 적용 — 상세 설계·종료 정산 시 활용<\/li><li><b>간이법<\/b>: 기능 유형별 <b>평균 복잡도 가중치<\/b>를 일괄 적용(미조정 FP 중심) — 사업 초기·예산 편성·발주 단계에서 신속 산정<\/li><\/ul><\/li><\/ul>", "pp": "<div class=\"tblwrap\"><table class=\"cmp\"><colgroup><col style=\"width:24%\"><col style=\"width:28%\"><col style=\"width:48%\"><\/colgroup><thead><tr><th>관점(측면)<\/th><th>특징<\/th><th>설명<\/th><\/tr><\/thead><tbody><tr><td class=\"k\">기능 유형<\/td><td>데이터 2 + 트랜잭션 3<\/td><td>ILF·EIF와 EI·EO·EQ 5유형으로 사용자 관점의 기능 규모를 산정<\/td><\/tr><tr><td class=\"k\">산정 방식<\/td><td>정규법 vs 간이법<\/td><td>DET·RET·FTR 복잡도와 VAF를 반영한 정규법, 평균 가중치를 쓰는 간이법<\/td><\/tr><tr><td class=\"k\">활용 시점<\/td><td>설계·정산 vs 발주<\/td><td>정규법은 상세설계·종료 정산, 간이법은 사업 초기 예산·발주 단계에 사용<\/td><\/tr><tr><td class=\"k\">관리<\/td><td>변경·재산정<\/td><td>요구사항 변경 시 기능 점수를 재산정하고 생산성 데이터로 개발 원가·대가를 산정<\/td><\/tr><\/tbody><\/table><\/div>", "rv": "<div class=\"q\"><b>두음: 내·외·입·출·조<\/b> — 내(ILF)·외(EIF)·입(EI)·출(EO)·조(EQ) — 정규법(DET·RET·FTR+VAF) vs 간이법<\/div>\n<div class=\"q\">\"<b>데이터(ILF·EIF) + 트랜잭션(EI·EO·EQ) 5유형<\/b>\"과 \"<b>정규법(DET·RET·FTR+VAF, 정밀) vs 간이법(평균가중치, 초기발주)<\/b>\" 표로 비교해 쓰기!<\/div>", "img": "itpe-diagrams/26-function-point.webp", "txt": null, "search": "기능 점수법 (fp, function point) 기능 점수법 (fp) ilf·eif·ei·eo·eq / 정규·간이 프로젝트 관리 일정·원가 관리 ⭐⭐⭐ 기출빈출 기출 빈출 중요 코드 라인 수(loc)가 아닌 사용자 관점의 기능 수와 복잡도 를 기준으로 소프트웨어 개발 규모와 대가를 산정하는 표준 기법 (iso/iec 20926, 국내 공공 sw 사업 대가산정 기준) 5가지 기능 유형 (데이터 2 + 트랜잭션 3) : ilf (internal logical file, 내부논리파일): 시스템 내부에서 유지·관리하는 논리 데이터 eif (external interface file, 외부연계파일): 타 시스템에서 참조만 하는 외부 데이터 ei (external input, 외부입력): 데이터 추가·변경·삭제(등록/수정/삭제) 기능 eo (external output, 외부출력): 계산·가공·파생 로직이 포함된 출력(통계·리포트) eq (external inquiry, 외부조회): 별도 가공 없이 단순 검색·조회 출력 정규법 vs 간이법 : 정규법 : det(데이터 요소)·ret(레코드 요소)·ftr(참조 파일)로 복잡도(하/중/상)를 정밀 측정하고 vaf(가치조정인자) 적용 — 상세 설계·종료 정산 시 활용 간이법 : 기능 유형별 평균 복잡도 가중치 를 일괄 적용(미조정 fp 중심) — 사업 초기·예산 편성·발주 단계에서 신속 산정 관점(측면) 특징 설명 기능 유형 데이터 2 + 트랜잭션 3 ilf·eif와 ei·eo·eq 5유형으로 사용자 관점의 기능 규모를 산정 산정 방식 정규법 vs 간이법 det·ret·ftr 복잡도와 vaf를 반영한 정규법, 평균 가중치를 쓰는 간이법 활용 시점 설계·정산 vs 발주 정규법은 상세설계·종료 정산, 간이법은 사업 초기 예산·발주 단계에 사용 관리 변경·재산정 요구사항 변경 시 기능 점수를 재산정하고 생산성 데이터로 개발 원가·대가를 산정 두음: 내·외·입·출·조 — 내(ilf)·외(eif)·입(ei)·출(eo)·조(eq) — 정규법(det·ret·ftr+vaf) vs 간이법 \" 데이터(ilf·eif) + 트랜잭션(ei·eo·eq) 5유형 \"과 \" 정규법(det·ret·ftr+vaf, 정밀) vs 간이법(평균가중치, 초기발주) \" 표로 비교해 쓰기!"}], "links": [["saga", "cqrs"], ["saga", "circuit"], ["saga", "deploy"], ["mvcc", "isolation"], ["mvcc", "btree"], ["mvcc", "cap"], ["zt", "oauth"], ["zt", "fido2"], ["zt", "devsecops"], ["devsecops", "sbom"], ["devsecops", "deploy"], ["rag", "mcp"], ["rag", "trism"], ["rag", "quant"], ["a2a", "mcp"], ["a2a", "rag"], ["pqc", "http3"], ["ai-basic-act", "trism"], ["ai-basic-act", "sbom"], ["cc-tee", "zt"], ["cc-tee", "pqc"], ["fp", "burn"], ["graphrag", "mcp"], ["graphrag", "a2a"], ["zkp", "fido2"], ["zkp", "pqc"], ["zkp", "cc-tee"], ["sli-slo", "circuit"], ["sli-slo", "deploy"], ["sre", "sli-slo"], ["sre", "deploy"], ["sre", "circuit"], ["rig", "rag"], ["rig", "graphrag"], ["moe", "quant"], ["covering", "btree"], ["covering", "mvcc"], ["lora", "quant"], ["lora", "moe"], ["lora", "rag"], ["n2sf", "zt"], ["n2sf", "ai-basic-act"], ["n2sf", "cc-tee"], ["atam", "sli-slo"], ["atam", "saga"], ["atam", "circuit"], ["llmops", "rag"], ["llmops", "lora"], ["llmops", "trism"], ["llmops", "finops"], ["finetuning", "rag"], ["finetuning", "llmops"], ["finetuning", "quant"], ["agentic-ai", "rag"], ["agentic-ai", "llmops"], ["agentic-ai", "trism"], ["soar", "zt"], ["soar", "devsecops"], ["norm", "covering"], ["norm", "btree"], ["dt", "agentic-ai"], ["dt", "rag"], ["iso42001", "ai-basic-act"], ["iso42001", "trism"], ["v-model", "atam"], ["v-model", "devsecops"], ["v-model", "deploy"], ["observability", "sli-slo"], ["observability", "circuit"], ["fhe", "pqc"], ["fhe", "cc-tee"], ["fhe", "zkp"], ["tcp-ctrl", "http3"], ["cncf", "saga"], ["cncf", "deploy"], ["cncf", "observability"], ["cncf", "devsecops"], ["cncf", "finops"], ["fabric-mesh", "rag"], ["fabric-mesh", "llmops"], ["xai", "trism"], ["xai", "iso42001"], ["xai", "ai-basic-act"], ["solid", "atam"], ["solid", "cqrs"], ["solid", "saga"], ["cnapp", "cncf"], ["cnapp", "devsecops"], ["cnapp", "zt"], ["cnapp", "soar"], ["hallucinat
