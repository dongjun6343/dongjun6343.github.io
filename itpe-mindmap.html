, ["public-ai-ready-data", "pia"], ["public-ai-ready-data", "knowledge-graph"], ["autonomous-pentest", "ctem-asm"], ["autonomous-pentest", "xdr-siem-soar"], ["autonomous-pentest", "agentic-ai"], ["autonomous-pentest", "prompt-inj"]], "guide": {"intro": "<p>처음 보는 토픽이 나와도 <b>관점(측면)만 잡으면 답안의 뼈대가 먼저 서고<\/b>, 각 관점에 2~3줄씩만 채워도 볼륨이 확보된다. 3~4개 관점으로 쪼개는 것이 핵심이며, 5개 이상은 나열로 보여 오히려 손해다. 아래 프레임 중 문제 성격에 맞는 하나를 골라 빈칸을 채우면 된다.<\/p>", "secs": [{"h": "0. 3단표 만능 공통 구분자 10선 (비교 · 특징 나열 공용)", "html": "<p>두 개념을 비교(<code>구분 | A | B<\/code>)하거나, 한 토픽의 특징을 나열(<code>구분 | 특징 | 설명<\/code>)할 때 앞 열(<code>구분<\/code>)에 바로 꺼내 쓸 수 있는 10가지 공통 축이다. 시험지에서는 이 중 <b>4~5개를 골라<\/b> 채우면 된다. (<b>두음: 개·목·핵·구 / 장·단·기·보 / 적·고<\/b>)<\/p>\n<div class=\"tblwrap\"><table class=\"cmp\"><colgroup><col style=\"width:24%\"><col style=\"width:28%\"><col style=\"width:48%\"><\/colgroup><thead><tr><th>구분 (공통 10종)<\/th><th>비교표(A vs B) 쓸 때<\/th><th>단일 특징 나열할 때<\/th><\/tr><\/thead><tbody><tr><td class=\"k\">1. 개념 · 정의<\/td><td>두 기술의 본질적 정의 차이<\/td><td>토픽의 한 줄 핵심 정의<\/td><\/tr><tr><td class=\"k\">2. 목적 · 배경<\/td><td>각각 어떤 문제를 풀려고 나왔나<\/td><td>등장 배경과 해결하려는 과제<\/td><\/tr><tr><td class=\"k\">3. 핵심 원리<\/td><td>동작 방식·메커니즘 차이<\/td><td>내부 처리 흐름·알고리즘 요약<\/td><\/tr><tr><td class=\"k\">4. 주요 구성요소<\/td><td>계층·컴포넌트·역할 구성 차이<\/td><td>핵심 모듈·구성 요소 나열<\/td><\/tr><tr><td class=\"k\">5. 장점 · 기대효과<\/td><td>A가 유리한 강점 vs B의 강점<\/td><td>도입 시 성능·비용·품질 이점<\/td><\/tr><tr><td class=\"k\">6. 단점 · 한계점<\/td><td>각각의 약점과 트레이드오프<\/td><td>제약사항·오버헤드·주의할 리스크<\/td><\/tr><tr><td class=\"k\">7. 기술적 특징<\/td><td>프로토콜·표준·구현 방식 차이<\/td><td>대표 표준·구현 기술·수치/지표<\/td><\/tr><tr><td class=\"k\">8. 보안 · 안정성<\/td><td>인증·암호화·장애 대응 수준<\/td><td>보안 위협 방어 및 정합성·가용성<\/td><\/tr><tr><td class=\"k\">9. 적용 대상 · 사례<\/td><td>언제 A를 쓰고 언제 B를 쓰나<\/td><td>적합한 도메인·실무 활용 사례<\/td><\/tr><tr><td class=\"k\">10. 고려사항 · 전망<\/td><td>함께 쓰는 결합 패턴·전환 방향<\/td><td>도입 시 전제조건 및 향후 발전 방향<\/td><\/tr><\/tbody><\/table><\/div>"}, {"h": "1. 만능 기본값 — 어디에나 통하는 3단", "html": "<div class=\"tblwrap\"><table class=\"cmp\"><colgroup><col style=\"width:24%\"><col style=\"width:28%\"><col style=\"width:48%\"><\/colgroup><thead><tr><th>관점(측면)<\/th><th>특징<\/th><th>설명<\/th><\/tr><\/thead><tbody><tr><td class=\"k\">사람·프로세스·기술<\/td><td>PPT<\/td><td>조직·절차·도구로 나누는 가장 범용적인 틀. 거버넌스·보안·품질 문제에 그대로 적용<\/td><\/tr><tr><td class=\"k\">계획·구축·운영<\/td><td>생명주기<\/td><td>도입 전·중·후, 설계·구현·운영처럼 시간축으로 자르는 틀. 절차형 문제에 강함<\/td><\/tr><tr><td class=\"k\">구조·기능·운영<\/td><td>시스템<\/td><td>무엇으로 구성되고(구조) 무엇을 하며(기능) 어떻게 돌아가는가(운영)로 분해<\/td><\/tr><tr><td class=\"k\">개념·차이·적용<\/td><td>비교<\/td><td>A vs B 문제에서 공통 개념, 차이 축, 적용 상황 순으로 정리하는 최소 틀<\/td><\/tr><\/tbody><\/table><\/div>"}, {"h": "2. 거버넌스·전략 — 프로세스 · 조직 · 리소스가 기반", "html": "<p>거버넌스 문제는 <b>프로세스 · 조직 · 리소스(기술·자원)<\/b> 세 축을 먼저 세우고, 여기에 성과·규제를 얹으면 답안이 선다. ITG(IT Governance) 5대 영역은 이 세 축을 평가 관점으로 다시 자른 프레임이다.<\/p>\n<div class=\"tblwrap\"><table class=\"cmp\"><colgroup><col style=\"width:24%\"><col style=\"width:28%\"><col style=\"width:48%\"><\/colgroup><thead><tr><th>관점(측면)<\/th><th>특징<\/th><th>설명<\/th><\/tr><\/thead><tbody><tr><td class=\"k\">프로세스<\/td><td>정책→실행→점검<\/td><td>전략 수립, 표준·절차 정의, 이행 점검과 개선(환류)의 흐름<\/td><\/tr><tr><td class=\"k\">조직<\/td><td>역할·책임·위원회<\/td><td>거버넌스 위원회와 책임자(CxO) 지정, RACI로 의사결정 구조를 명확히<\/td><\/tr><tr><td class=\"k\">리소스(기술·자원)<\/td><td>예산·인력·도구<\/td><td>비용·인력·시스템·데이터를 자원으로 보고 배분·통제<\/td><\/tr><tr><td class=\"k\">성과·규제<\/td><td>KPI·컴플라이언스<\/td><td>성과지표와 법·규제 준수 여부를 함께 측정<\/td><\/tr><\/tbody><\/table><\/div>\n<div class=\"tblwrap\"><table class=\"cmp\"><colgroup><col style=\"width:24%\"><col style=\"width:28%\"><col style=\"width:48%\"><\/colgroup><thead><tr><th>ITG 5대 영역<\/th><th>특징<\/th><th>설명<\/th><\/tr><\/thead><tbody><tr><td class=\"k\">전략 연계<\/td><td>Strategy Alignment<\/td><td>IT 투자·과제가 비즈니스 전략과 정렬되는가<\/td><\/tr><tr><td class=\"k\">가치 전달<\/td><td>Value Delivery<\/td><td>투자 대비 편익(ROI)과 서비스 가치를 전달하는가<\/td><\/tr><tr><td class=\"k\">위험 관리<\/td><td>Risk Management<\/td><td>IT 리스크 식별·통제와 컴플라이언스 확보<\/td><\/tr><tr><td class=\"k\">자원 관리<\/td><td>Resource Management<\/td><td>인력·예산·인프라의 최적 배분<\/td><\/tr><tr><td class=\"k\">성과 측정<\/td><td>Performance Measurement<\/td><td>KPI·모니터링으로 성과를 확인하고 개선<\/td><\/tr><\/tbody><\/table><\/div>"}, {"h": "3. 보안 — 세 가지 자르는 법", "html": "<div class=\"tblwrap\"><table class=\"cmp\"><colgroup><col style=\"width:24%\"><col style=\"width:28%\"><col style=\"width:48%\"><\/colgroup><thead><tr><th>관점(측면)<\/th><th>특징<\/th><th>설명<\/th><\/tr><\/thead><tbody><tr><td class=\"k\">관리적<\/td><td>정책·교육·감사<\/td><td>보안 정책·지침, 인식 교육, 내부 감사와 책임 체계<\/td><\/tr><tr><td class=\"k\">기술적<\/td><td>암호화·인증·필터<\/td><td>암호화, 접근제어·인증, 방화벽·IDS·가드레일 등 시스템 통제<\/td><\/tr><tr><td class=\"k\">물리적<\/td><td>출입·환경·매체<\/td><td>전산실 출입통제, 환경 보호, 매체·단말 관리<\/td><\/tr><\/tbody><\/table><\/div>\n<div class=\"tblwrap\"><table class=\"cmp\"><colgroup><col style=\"width:24%\"><col style=\"width:28%\"><col style=\"width:48%\"><\/colgroup><thead><tr><th>관점(측면)<\/th><th>특징<\/th><th>설명<\/th><\/tr><\/thead><tbody><tr><td class=\"k\">예방<\/td><td>사전 차단<\/td><td>취약점 제거, 접근통제, 암호화로 사고 자체를 막음<\/td><\/tr><tr><td class=\"k\">탐지<\/td><td>조기 발견<\/td><td>로그·모니터링·IDS·이상행위 분석으로 침해를 빨리 인지<\/td><\/tr><tr><td class=\"k\">대응<\/td><td>확산 차단<\/td><td>격리·차단·포렌식으로 피해 확산을 멈춤<\/td><\/tr><tr><td class=\"k\">복구<\/td><td>정상화<\/td><td>백업·대체 시스템으로 복구하고 재발 방지 대책 수립<\/td><\/tr><\/tbody><\/table><\/div>\n<div class=\"tblwrap\"><table class=\"cmp\"><colgroup><col style=\"width:24%\"><col style=\"width:28%\"><col style=\"width:48%\"><\/colgroup><thead><tr><th>관점(측면)<\/th><th>특징<\/th><th>설명<\/th><\/tr><\/thead><tbody><tr><td class=\"k\">기밀성<\/td><td>Confidentiality<\/td><td>인가된 주체만 열람. 암호화·접근통제·마스킹<\/td><\/tr><tr><td class=\"k\">무결성<\/td><td>Integrity<\/td><td>데이터가 변조되지 않음. 해시·서명·감사로그<\/td><\/tr><tr><td class=\"k\">가용성<\/td><td>Availability<\/td><td>필요할 때 사용 가능. 이중화·백업·DDoS 대응<\/td><\/tr><\/tbody><\/table><\/div>"}, {"h": "4. 아키텍처·SW — 구성·품질·생명주기", "html": "<div class=\"tblwrap\"><table class=\"cmp\"><colgroup><col style=\"width:24%\"><col style=\"width:28%\"><col style=\"width:48%\"><\/colgroup><thead><tr><th>관점(측면)<\/th><th>특징<\/th><th>설명<\/th><\/tr><\/thead><tbody><tr><td class=\"k\">애플리케이션<\/td><td>서비스·모듈<\/td><td>업무 로직·서비스 분해, API·인터페이스 설계<\/td><\/tr><tr><td class=\"k\">데이터<\/td><td>저장·흐름<\/td><td>데이터 모델, 저장소 선택, 정합성·동기화<\/td><\/tr><tr><td class=\"k\">인프라(기술)<\/td><td>실행 환경<\/td><td>서버·네트워크·클라우드, 배포·확장·가용성 구성<\/td><\/tr><\/tbody><\/table><\/div>\n<div class=\"tblwrap\"><table class=\"cmp\"><colgroup><col style=\"width:24%\"><col style=\"width:28%\"><col style=\"width:48%\"><\/colgroup><thead><tr><th>관점(측면)<\/th><th>특징<\/th><th>설명<\/th><\/tr><\/thead><tbody><tr><td class=\"k\">기능 요구<\/td><td>무엇을 하는가<\/td><td>업무 기능·유스케이스 충족 여부<\/td><\/tr><tr><td class=\"k\">비기능(품질)<\/td><td>성능·보안·가용성<\/td><td>성능·확장성·보안·가용성·유지보수성 등 품질속성<\/td><\/tr><\/tbody><\/table><\/div>\n<div class=\"tblwrap\"><table class=\"cmp\"><colgroup><col style=\"width:24%\"><col style=\"width:28%\"><col style=\"width:48%\"><\/colgroup><thead><tr><th>관점(측면)<\/th><th>특징<\/th><th>설명<\/th><\/tr><\/thead><tbody><tr><td class=\"k\">설계<\/td><td>구조 결정<\/td><td>아키텍처 패턴 선택, 품질속성 시나리오와 트레이드오프 검토<\/td><\/tr><tr><td class=\"k\">구축<\/td><td>구현·통합<\/td><td>표준·프레임워크 적용, CI/CD와 품질 게이트<\/td><\/tr><tr><td class=\"k\">운영<\/td><td>배포·개선<\/td><td>무중단 배포, 모니터링, 장애 대응과 리팩터링<\/td><\/tr><\/tbody><\/table><\/div>"}, {"h": "5. AI·데이터 — 구성요소와 파이프라인", "html": "<div class=\"tblwrap\"><table class=\"cmp\"><colgroup><col style=\"width:24%\"><col style=\"width:28%\"><col style=\"width:48%\"><\/colgroup><thead><tr><th>관점(측면)<\/th><th>특징<\/th><th>설명<\/th><\/tr><\/thead><tbody><tr><td class=\"k\">데이터<\/td><td>수집·품질<\/td><td>학습·검색용 데이터의 수집, 정제, 품질·저작권 관리<\/td><\/tr><tr><td class=\"k\">모델(알고리즘)<\/td><td>학습·추론<\/td><td>모델 선택·학습·경량화, 정확도와 편향 관리<\/td><\/tr><tr><td class=\"k\">운영·인프라<\/td><td>서빙·모니터링<\/td><td>추론 서빙, 지연·비용·드리프트 모니터링(LLMOps)<\/td><\/tr><tr><td class=\"k\">거버넌스<\/td><td>윤리·법제도<\/td><td>설명가능성, 개인정보, AI 기본법·EU AI Act 준수<\/td><\/tr><\/tbody><\/table><\/div>\n<div class=\"tblwrap\"><table class=\"cmp\"><colgroup><col style=\"width:24%\"><col style=\"width:28%\"><col style=\"width:48%\"><\/colgroup><thead><tr><th>관점(측면)<\/th><th>특징<\/th><th>설명<\/th><\/tr><\/thead><tbody><tr><td class=\"k\">수집<\/td><td>원천 확보<\/td><td>내·외부 데이터, 크롤링·API, 동의·라이선스 확인<\/td><\/tr><tr><td class=\"k\">정제<\/td><td>품질 확보<\/td><td>결측·중복·이상치 처리, 정규화·비식별화<\/td><\/tr><tr><td class=\"k\">저장<\/td><td>구조화<\/td><td>데이터 레이크·웨어하우스·벡터 DB 선택<\/td><\/tr><tr><td class=\"k\">분석<\/td><td>모델링<\/td><td>통계·ML 학습, 평가 지표 검증<\/td><\/tr><tr><td class=\"k\">활용<\/td><td>서비스화<\/td><td>대시보드·API·RAG로 업무에 연결, 환류<\/td><\/tr><\/tbody><\/table><\/div>"}, {"h": "6. DB·성능 — 구조·연산·일관성·운영", "html": "<div class=\"tblwrap\"><table class=\"cmp\"><colgroup><col style=\"width:24%\"><col style=\"width:28%\"><col style=\"width:48%\"><\/colgroup><thead><tr><th>관점(측면)<\/th><th>특징<\/th><th>설명<\/th><\/tr><\/thead><tbody><tr><td class=\"k\">구조(저장)<\/td><td>인덱스·저장구조<\/td><td>B-Tree·LSM, 파티셔닝, 커버링 인덱스 등 저장 방식<\/td><\/tr><tr><td class=\"k\">연산(쿼리)<\/td><td>실행계획·조인<\/td><td>옵티마이저, 조인 순서, 손익분기점 기반 스캔 선택<\/td><\/tr><tr><td class=\"k\">동시성·일관성<\/td><td>격리·MVCC<\/td><td>격리 수준, MVCC, CAP/PACELC 트레이드오프<\/td><\/tr><tr><td class=\"k\">운영·튜닝<\/td><td>모니터링·백업<\/td><td>슬로우 쿼리, 락·대기 분석, 백업·복구·확장<\/td><\/tr><\/tbody><\/table><\/div>"}, {"h": "7. PM·관리 — 5대 관리영역과 PDCA", "html": "<div class=\"tblwrap\"><table class=\"cmp\"><colgroup><col style=\"width:24%\"><col style=\"width:28%\"><col style=\"width:48%\"><\/colgroup><thead><tr><th>관점(측면)<\/th><th>특징<\/th><th>설명<\/th><\/tr><\/thead><tbody><tr><td class=\"k\">범위<\/td><td>WBS·요구사항<\/td><td>요구사항 정의, 범위 기준선, 변경통제<\/td><\/tr><tr><td class=\"k\">일정<\/td><td>활동·일정표<\/td><td>활동 순서·기간 산정, 크리티컬 패스<\/td><\/tr><tr><td class=\"k\">원가<\/td><td>예산·대가<\/td><td>원가 산정(FP 등), 예산 배정, 대가 산정<\/td><\/tr><tr><td class=\"k\">품질<\/td><td>표준·검토<\/td><td>품질 기준, 리뷰·테스트, 지표 관리<\/td><\/tr><tr><td class=\"k\">위험<\/td><td>식별·대응<\/td><td>위험 식별·분석, 대응 전략과 모니터링<\/td><\/tr><\/tbody><\/table><\/div>\n<div class=\"tblwrap\"><table class=\"cmp\"><colgroup><col style=\"width:24%\"><col style=\"width:28%\"><col style=\"width:48%\"><\/colgroup><thead><tr><th>관점(측면)<\/th><th>특징<\/th><th>설명<\/th><\/tr><\/thead><tbody><tr><td class=\"k\">Plan<\/td><td>계획<\/td><td>목표·범위·자원 계획 수립<\/td><\/tr><tr><td class=\"k\">Do<\/td><td>실행<\/td><td>계획에 따른 수행과 산출물 생성<\/td><\/tr><tr><td class=\"k\">Check<\/td><td>감시·통제<\/td><td>진척·품질·비용 점검, 성과 측정<\/td><\/tr><tr><td class=\"k\">Act<\/td><td>개선<\/td><td>시정조치와 표준화로 다음 주기에 반영<\/td><\/tr><\/tbody><\/table><\/div>"}, {"h": "8. 도입·의사결정·비교 — 4개 축", "html": "<div class=\"tblwrap\"><table class=\"cmp\"><colgroup><col style=\"width:24%\"><col style=\"width:28%\"><col style=\"width:48%\"><\/colgroup><thead><tr><th>관점(측면)<\/th><th>특징<\/th><th>설명<\/th><\/tr><\/thead><tbody><tr><td class=\"k\">비즈니스(전략)<\/td><td>목적·효과<\/td><td>어떤 업무 문제를 푸는가, 전략·고객 가치와 정렬되는가<\/td><\/tr><tr><td class=\"k\">기술<\/td><td>실현 가능성<\/td><td>기술 성숙도, 기존 시스템 연계, 인력·역량<\/td><\/tr><tr><td class=\"k\">법·제도<\/td><td>컴플라이언스<\/td><td>개인정보·규제·표준 준수, 계약·책임 소재<\/td><\/tr><tr><td class=\"k\">경제성<\/td><td>비용·ROI<\/td><td>TCO, 편익, 투자회수기간, 대안 대비 손익<\/td><\/tr><\/tbody><\/table><\/div>"}, {"h": "9. 네트워크·운영 — 계층과 신뢰성", "html": "<div class=\"tblwrap\"><table class=\"cmp\"><colgroup><col style=\"width:24%\"><col style=\"width:28%\"><col style=\"width:48%\"><\/colgroup><thead><tr><th>관점(측면)<\/th><th>특징<\/th><th>설명<\/th><\/tr><\/thead><tbody><tr><td class=\"k\">전송<\/td><td>프로토콜·계층<\/td><td>TCP/UDP·QUIC, 계층별 헤더와 전송 방식<\/td><\/tr><tr><td class=\"k\">연결<\/td><td>경로·이동성<\/td><td>라우팅·로드밸런싱, 연결 ID 기반 세션 유지<\/td><\/tr><tr><td class=\"k\">보안<\/td><td>암호화·인증<\/td><td>TLS, 구간 암호화, 인증서·키 관리<\/td><\/tr><\/tbody><\/table><\/div>\n<div class=\"tblwrap\"><table class=\"cmp\"><colgroup><col style=\"width:24%\"><col style=\"width:28%\"><col style=\"width:48%\"><\/colgroup><thead><tr><th>관점(측면)<\/th><th>특징<\/th><th>설명<\/th><\/tr><\/thead><tbody><tr><td class=\"k\">측정<\/td><td>SLI<\/td><td>실제 관측 지표(성공률·지연)<\/td><\/tr><tr><td class=\"k\">목표<\/td><td>SLO·에러 버짓<\/td><td>내부 목표와 허용 장애 한도<\/td><\/tr><tr><td class=\"k\">계약<\/td><td>SLA<\/td><td>고객과의 공식 약속과 보상 기준<\/td><\/tr><\/tbody><\/table><\/div>"}, {"h": "10. 문제 유형별로 고르는 법", "html": "<div class=\"tblwrap\"><table class=\"cmp\"><colgroup><col style=\"width:24%\"><col style=\"width:28%\"><col style=\"width:48%\"><\/colgroup><thead><tr><th>문제 유형<\/th><th>권장 관점<\/th><th>이유<\/th><\/tr><\/thead><tbody><tr><td class=\"k\">비교형 (A vs B)<\/td><td>정의 → 차이 3축 → 적용 상황<\/td><td>차이 축을 관점으로 세우면 표가 그대로 답안이 됨<\/td><\/tr><tr><td class=\"k\">절차·프로세스형<\/td><td>계획·실행·검증<\/td><td>단계 누락을 막고 순서 채점에 강함<\/td><\/tr><tr><td class=\"k\">아키텍처·기술형<\/td><td>구성요소·동작 흐름·운영 고려<\/td><td>구조와 흐름, 운영을 분리하면 설명이 자연스러움<\/td><\/tr><tr><td class=\"k\">법·제도형<\/td><td>목적·대상·의무·이행 체계<\/td><td>진흥과 규제의 양축, 적용 대상, 의무, 집행 순으로<\/td><\/tr><tr><td class=\"k\">거버넌스·전략형<\/td><td>프로세스·조직·리소스<\/td><td>정책·절차, 책임 구조, 자원 배분을 빠짐없이 채움<\/td><\/tr><tr><td class=\"k\">문제해결형<\/td><td>원인·대응·예방<\/td><td>현상 → 기술적 대응 → 제도·운영 보완으로 마무리<\/td><\/tr><\/tbody><\/table><\/div>"}, {"h": "11. 표를 쓰는 요령", "html": "<ul class=\"kw\"><li>관점 이름은 2~6자 명사로 통일한다. 예: 관리적 측면, 성능 측면, 거버넌스 측면<\/li><li>특징 칸은 채점관이 찾는 키워드 1~2개만. 설명 칸은 \"무엇을, 왜\"를 1~2문장으로<\/li><li>각 관점은 서로 겹치지 않게 자른다. 기술과 운영이 겹치면 감점 요인이 된다<\/li><li>표 아래에 결론 한 줄을 붙여 마무리한다. 예: \"결국 A는 정합성, B는 가용성으로 트레이드오프가 갈린다\"<\/li><\/ul>"}, {"h": "12. 시간이 없을 때 최소 세트", "html": "<ul class=\"kw\"><li>정의 1줄 + 3단 관점 표(관점 3개 × 1줄) + 결론 1줄이면 기본 배점은 확보된다<\/li><li>그림이 떠오르면 개념도를 먼저 그리고, 표의 관점 이름을 그림의 블록 이름과 맞춘다<\/li><\/ul>"}]}};</script>
<script>
(function(){
'use strict';

/* ================================================================ data */
var CATS = DATA.cats, TOPICS = DATA.topics, LINKS = DATA.links;
var BY = {}, SUB = {}, SUBS = [], EL = {}, G = {}, NODELIST = [], assoc = [];
var NS = 'http://www.w3.org/2000/svg';
var state = {cats:{}, subs:{}, sel:null, filter:null, query:'', view:'map'};

TOPICS.forEach(function(t){
  BY[t.id] = t;
  for (var i=0;i<CATS.length;i++){ if (CATS[i].id === t.cat) t.catObj = CATS[i]; }
});
CATS.forEach(function(c){
  c.subs.forEach(function(s){
    var o = {sid:s.sid, n:s.n, cat:c, topics:[]};
    SUB[s.sid] = o; SUBS.push(o); s.o = o;
    state.cats[c.id] = true;
  });
});
TOPICS.forEach(function(t){ if (SUB[t.sub]) SUB[t.sub].topics.push(t); });

function $(id){ return document.getElementById(id); }
var stage = $('stage'), world = $('world'), svg = $('edges'), nodesEl = $('nodes');
var treeEl = $('tree'), qEl = $('q'), qClear = $('qclear'), resultsEl = $('results');
var chipsEl = $('chips'), countEl = $('cnt'), sheet = $('sheet'), panel = $('panel');
var mBody = $('mBody'), mTitle = $('mTitle'), mCat = $('mCat'), mStatus = $('mStatus');
var lb = $('lightbox'), lbImg = $('lbImg');

function esc(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function rgba(hex, a){
  var n = parseInt(hex.slice(1), 16);
  return 'rgba('+((n>>16)&255)+','+((n>>8)&255)+','+(n&255)+','+a+')';
}
function clamp(v,a,b){ return v < a ? a : (v > b ? b : v); }

/* ================================================================ filter helpers */
function qnorm(){ return state.query.trim().toLowerCase(); }
function matchTopic(t){
  if (state.filter && t.cat !== state.filter) return false;
  var q = qnorm();
  return !q || t.search.indexOf(q) >= 0;
}
function subHasMatch(s){
  for (var i=0;i<s.topics.length;i++){ if (matchTopic(s.topics[i])) return true; }
  return false;
}
function catHasMatch(c){
  for (var i=0;i<c.subs.length;i++){ if (subHasMatch(c.subs[i].o)) return true; }
  return false;
}
function openCat(c){
  if (qnorm()) return catHasMatch(c);
  if (state.filter) return c.id === state.filter && state.cats[c.id] !== false;
  return state.cats[c.id] !== false;
}
function openSub(s){
  if (qnorm()) return subHasMatch(s);
  if (state.filter && s.cat.id !== state.filter) return false;
  return !!state.subs[s.sid];
}
function visParent(t){
  if (!t.parent) return null;
  var p = BY[t.parent];
  if (!p || p.sub !== t.sub || !matchTopic(p)) return null;
  return p;
}
function leafRoots(s){
  return s.topics.filter(function(t){ return matchTopic(t) && !visParent(t); });
}
function leafKids(t){
  return TOPICS.filter(function(c){ return c.parent === t.id && matchTopic(c); });
}

/* ================================================================ layout */
var PAD = 80;
var ROOT_W = 176, ROOT_H = 70, ROOT_HALF = 88;
var CAT_W = 152, CAT_H = 56;
var SUB_W = 168, SUB_H = 56;
var LEAF_W = 198, LEAF_H = 50;
var G_ROOT = 52, G_CAT = 40, G_SUB = 32, G_CHILD = 28;
var CAT_GAP = 46, SUB_GAP = 14, LEAF_GAP = 10;
var X_CAT = ROOT_HALF + G_ROOT;
var X_SUB = X_CAT + CAT_W + G_CAT;
var X_LEAF = X_SUB + SUB_W + G_SUB;
var X_CHILD = X_LEAF + LEAF_W + G_CHILD;

var W = 0, H = 0, ox = 0, oy = 0;

function blockH(t){
  var n = leafKids(t).length;
  if (n < 1) n = 1;
  return n*LEAF_H + (n-1)*LEAF_GAP;
}
function subH(s){
  if (!openSub(s)) return SUB_H;
  var roots = leafRoots(s);
  if (!roots.length) return SUB_H;
  var h = 0;
  roots.forEach(function(t,i){ h += (i?LEAF_GAP:0) + blockH(t); });
  return Math.max(h, SUB_H);
}
function catH(c){
  if (!openCat(c)) return CAT_H;
  var h = 0;
  c.subs.forEach(function(s,i){ h += (i?SUB_GAP:0) + subH(s.o); });
  return Math.max(h, CAT_H);
}
function leftX(sign, x, w){ return sign > 0 ? x : -(x + w); }

function computeLayout(){
  G = {}; NODELIST = [];
  var x1 = 1e9, y1 = 1e9, x2 = -1e9, y2 = -1e9;

  function add(key, kind, left, top, w, h, meta){
    var g = {x:left, y:top, w:w, h:h, cx:left+w/2, cy:top+h/2};
    G[key] = g;
    NODELIST.push({key:key, kind:kind, g:g, meta:meta});
    if (left < x1) x1 = left;
    if (top < y1) y1 = top;
    if (left+w > x2) x2 = left+w;
    if (top+h > y2) y2 = top+h;
  }

  add('root','root', -ROOT_W/2, -ROOT_H/2, ROOT_W, ROOT_H, {parent:null});

  var sides = [{side:'L', cats:CATS.slice(0,4)}, {side:'R', cats:CATS.slice(4)}];
  sides.forEach(function(S){
    var sign = S.side === 'L' ? -1 : 1;
    var hs = 0;
    S.cats.forEach(function(c,i){ hs += (i?CAT_GAP:0) + catH(c); });
    var y = -hs/2;
    S.cats.forEach(function(c, ci){
      if (ci) y += CAT_GAP;
      var ch = catH(c), top = y;
      add('cat:'+c.id, 'cat', leftX(sign, X_CAT, CAT_W), top + ch/2 - CAT_H/2, CAT_W, CAT_H,
          {parent:'root', cat:c, side:S.side, open:openCat(c)});
      if (openCat(c)){
        var sy = top;
        c.subs.forEach(function(s, si){
          if (si) sy += SUB_GAP;
          var sh = subH(s.o);
          add('sub:'+s.sid, 'sub', leftX(sign, X_SUB, SUB_W), sy + sh/2 - SUB_H/2, SUB_W, SUB_H,
              {parent:'cat:'+c.id, cat:c, sub:s.o, side:S.side, open:openSub(s.o)});
          if (openSub(s.o)){
            var ty = sy;
            leafRoots(s.o).forEach(function(t, ti){
              if (ti) ty += LEAF_GAP;
              var bh = blockH(t);
              add(t.id, 'leaf', leftX(sign, X_LEAF, LEAF_W), ty + (bh - LEAF_H)/2, LEAF_W, LEAF_H,
                  {parent:'sub:'+s.sid, t:t, cat:c, side:S.side});
              leafKids(t).forEach(function(k, ki){
                add(k.id, 'leaf', leftX(sign, X_CHILD, LEAF_W), ty + ki*(LEAF_H+LEAF_GAP), LEAF_W, LEAF_H,
                    {parent:t.id, t:k, cat:c, side:S.side});
              });
              ty += bh;
            });
          }
          sy += sh;
        });
      }
      y += ch;
    });
  });

  if (x2 < x1){ x2 = x1 + 1; }
  if (y2 < y1){ y2 = y1 + 1; }
  W = (x2-x1) + PAD*2;
  H = (y2-y1) + PAD*2;
  ox = -x1 + PAD;
  oy = -y1 + PAD;

  world.style.width = W+'px';
  world.style.height = H+'px';
  svg.setAttribute('width', W);
  svg.setAttribute('height', H);
  svg.setAttribute('viewBox', '0 0 '+W+' '+H);
}

function pxx(g){ return g.x + ox; }
function pyy(g){ return g.y + oy; }

/* ================================================================ render (map) */
function starHTML(t){
  if (t.redStar) return '<span class="st red">★</span> ';
  if (t.stars){
    var s = '';
    for (var i=0;i<t.stars;i++) s += '⭐';
    return '<span class="st gold">'+s+'</span> ';
  }
  return '';
}

function labelHTML(n){
  var m = n.meta;
  if (n.kind === 'root'){
    return '<span class="n-title">ITPE</span><span class="n-sub">'+TOPICS.length+'개 토픽 · '+SUBS.length+'개 중분류</span>';
  }
  if (n.kind === 'cat'){
    return '<span class="nm">'+esc(m.cat.name)+'</span>'
         + '<span class="n-n">'+m.cat.count+'</span>'
         + '<span class="tg">'+(m.open ? '−' : '+')+'</span>';
  }
  if (n.kind === 'sub'){
    return '<span class="nm">'+esc(m.sub.n)+'</span>'
         + '<span class="n-n">'+m.sub.topics.length+'</span>'
         + '<span class="tg">'+(m.open ? '−' : '+')+'</span>';
  }
  var t = m.t;
  return '<span class="n-title">'+starHTML(t)+esc(t.t)+'</span><span class="n-sub">'+esc(t.s)+'</span>';
}

function isDim(n){
  if (state.filter && n.meta.cat && n.meta.cat.id !== state.filter) return true;
  if (!qnorm()) return false;
  if (n.kind === 'cat') return !catHasMatch(n.meta.cat);
  if (n.kind === 'sub') return !subHasMatch(n.meta.sub);
  return false;
}

function renderMap(){
  var seen = {};
  NODELIST.forEach(function(n){
    var g = n.g, m = n.meta;
    var el = EL[n.key], fresh = false;
    if (!el){
      el = document.createElement('div');
      el.setAttribute('data-node', n.key);
      nodesEl.appendChild(el);
      EL[n.key] = el; fresh = true;
    }
    var cls = 'node ' + n.kind + (m.side === 'L' ? ' left' : '');
    if (m.open) cls += ' open';
    if (isDim(n)) cls += ' dim';
    if (fresh) cls += ' nnew';
    el.className = cls;
    el.setAttribute('data-kind', n.kind);
    if (n.kind === 'cat') el.setAttribute('data-cat', m.cat.id);
    else if (n.kind === 'sub') el.setAttribute('data-sub', m.sub.sid);
    else if (n.kind === 'leaf') el.setAttribute('data-id', m.t.id);
    el.style.left = pxx(g)+'px';
    el.style.top = pyy(g)+'px';
    el.style.width = g.w+'px';
    el.style.height = g.h+'px';
    if (m.cat){
      el.style.setProperty('--c', m.cat.c);
      el.style.setProperty('--cbg', m.cat.bg);
      el.style.setProperty('--cbd', m.cat.bd);
    }
    var h = labelHTML(n);
    if (el.innerHTML !== h) el.innerHTML = h;
    seen[n.key] = 1;
  });
  Object.keys(EL).forEach(function(k){
    if (!seen[k]){ if (EL[k].parentNode) EL[k].parentNode.removeChild(EL[k]); delete EL[k]; }
  });
  drawEdges();
  applySel();
}

function drawEdges(){
  while (svg.firstChild) svg.removeChild(svg.firstChild);
  assoc = [];
  NODELIST.forEach(function(n){
    var pk = n.meta.parent;
    if (!pk) return;
    var a = G[pk], b = n.g;
    if (!a) return;
    var isL = n.meta.side === 'L';
    var ax = pxx(a), bx = pxx(b);
    var x1 = isL ? ax : ax + a.w;
    var y1 = pyy(a) + a.h/2;
    var x2 = isL ? bx + b.w : bx;
    var y2 = pyy(b) + b.h/2;
    var mx = (x1+x2)/2;
    var p = document.createElementNS(NS, 'path');
    p.setAttribute('d', 'M'+x1+','+y1+' C'+mx+','+y1+' '+mx+','+y2+' '+x2+','+y2);
    p.setAttribute('class', 'edge' + (n.kind === 'cat' ? ' root' : ''));
    var col = n.meta.cat ? n.meta.cat.c : '#94a3b8';
    p.setAttribute('stroke', rgba(col, n.kind === 'cat' ? .55 : (n.kind === 'sub' ? .46 : .36)));
    svg.appendChild(p);
  });
  LINKS.forEach(function(l){
    var a = G[l[0]], b = G[l[1]];
    if (!a || !b) return;
    var x1 = pxx(a)+a.w/2, y1 = pyy(a)+a.h/2;
    var x2 = pxx(b)+b.w/2, y2 = pyy(b)+b.h/2;
    var dx = x2-x1, dy = y2-y1;
    var len = Math.sqrt(dx*dx+dy*dy) || 1;
    var nx = -dy/len, ny = dx/len;
    var off = Math.min(70, len*0.14);
    var mx = (x1+x2)/2 + nx*off, my = (y1+y2)/2 + ny*off;
    var p = document.createElementNS(NS, 'path');
    p.setAttribute('d', 'M'+x1+','+y1+' Q'+mx+','+my+' '+x2+','+y2);
    p.setAttribute('class', 'aedge');
    p.setAttribute('data-a', l[0]);
    p.setAttribute('data-b', l[1]);
    svg.appendChild(p);
    assoc.push(p);
  });
}

var selRel = {};
function applySel(){
  var id = state.sel;
  selRel = {};
  if (id){
    LINKS.forEach(function(l){
      if (l[0] === id) selRel[l[1]] = 1;
      if (l[1] === id) selRel[l[0]] = 1;
    });
    document.body.classList.add('has-sel');
  } else {
    document.body.classList.remove('has-sel');
  }
  TOPICS.forEach(function(t){
    var el = EL[t.id];
    if (!el) return;
    el.classList.toggle('sel', t.id === id);
    el.classList.toggle('rel', !!selRel[t.id]);
  });
  for (var i=0;i<assoc.length;i++){
    var p = assoc[i];
    var on = p.getAttribute('data-a') === id || p.getAttribute('data-b') === id;
    p.classList.toggle('on', !!on);
  }
  var bar = $('selbar');
  if (id && BY[id]){
    $('selDot').style.background = BY[id].catObj.c;
    $('selTitle').textContent = BY[id].t;
    bar.hidden = false;
  } else {
    bar.hidden = true;
  }
  Object.keys(treeLeafEl).forEach(function(tid){
    treeLeafEl[tid].classList.toggle('on', tid === id);
  });
}

function select(id){
  state.sel = id;
  applySel();
}
function clearSel(){
  state.sel = null;
  applySel();
}

/* ================================================================ view transform */
var tx = 0, ty = 0, scale = 1;
var MIN_S = 0.12, MAX_S = 2.8, INIT_MIN = 0.3;

function apply(){
  world.style.transform = 'translate3d('+tx+'px,'+ty+'px,0) scale('+scale+')';
}
function animateTo(s, ntx, nty){
  world.classList.add('anim');
  scale = s; tx = ntx; ty = nty;
  apply();
  setTimeout(function(){ world.classList.remove('anim'); }, 360);
}
function fitScale(){
  return Math.min((stage.clientWidth-16)/W, (stage.clientHeight-16)/H);
}
function viewAll(animate){
  var s = clamp(fitScale(), MIN_S, 1.5);
  var ntx = (stage.clientWidth - W*s)/2;
  var nty = (stage.clientHeight - H*s)/2;
  if (animate) animateTo(s, ntx, nty); else { scale = s; tx = ntx; ty = nty; apply(); }
}
function resetView(animate){
  var s = clamp(Math.max(fitScale(), INIT_MIN), INIT_MIN, 1);
  var ntx = stage.clientWidth/2 - ox*s;
  var nty = stage.clientHeight/2 - oy*s;
  if (animate) animateTo(s, ntx, nty); else { scale = s; tx = ntx; ty = nty; apply(); }
}
function zoomAt(clientX, clientY, f){
  var r = stage.getBoundingClientRect();
  var x = clientX - r.left, y = clientY - r.top;
  var ns = clamp(scale*f, MIN_S, MAX_S);
  var k = ns/scale;
  tx = x - (x-tx)*k;
  ty = y - (y-ty)*k;
  scale = ns;
  apply();
}
function focusNode(id, s){
  var g = G[id];
  if (!g) return;
  var ns = s || Math.max(scale, 0.72);
  var cx = pxx(g)+g.w/2, cy = pyy(g)+g.h/2;
  animateTo(ns, stage.clientWidth/2 - cx*ns, stage.clientHeight*0.42 - cy*ns);
}
function fitTo(keys){
  var x1 = 1e9, y1 = 1e9, x2 = -1e9, y2 = -1e9;
  keys.forEach(function(id){
    var g = G[id];
    if (!g) return;
    x1 = Math.min(x1, pxx(g)); y1 = Math.min(y1, pyy(g));
    x2 = Math.max(x2, pxx(g)+g.w); y2 = Math.max(y2, pyy(g)+g.h);
  });
  if (x1 > x2) return;
  var w = x2-x1, h = y2-y1;
  var s = clamp(Math.min((stage.clientWidth-40)/w, (stage.clientHeight-40)/h), MIN_S, 1.15);
  animateTo(s, stage.clientWidth/2-(x1+w/2)*s, stage.clientHeight/2-(y1+h/2)*s);
}

/* ================================================================ expand / collapse */
function relayout(){
  computeLayout();
  renderMap();
  updateCount();
}

function toggleSub(sid){
  var s = SUB[sid];
  if (!s) return;
  if (state.subs[sid]) delete state.subs[sid]; else state.subs[sid] = true;
  if (qnorm()){ state.query = ''; qEl.value = ''; qClear.hidden = true; resultsEl.hidden = true; }
  state.cats[s.cat.id] = true;
  relayout();
  if (state.subs[sid]){
    fitTo(['sub:'+sid].concat(s.topics.map(function(t){ return t.id; })));
  } else {
    fitTo(branchKeys(s.cat, true));
  }
}

function branchKeys(c, withTopics){
  var keys = ['root', 'cat:'+c.id];
  c.subs.forEach(function(x){
    keys.push('sub:'+x.sid);
    if (withTopics) x.o.topics.forEach(function(t){ keys.push(t.id); });
  });
  return keys;
}

function toggleCat(cid){
  var c = null;
  for (var i=0;i<CATS.length;i++) if (CATS[i].id === cid) c = CATS[i];
  if (!c) return;
  if (state.filter){ setFilter(state.filter === cid ? null : cid); return; }
  if (state.cats[cid] === false) state.cats[cid] = true; else state.cats[cid] = false;
  relayout();
  if (state.cats[cid]) fitTo(branchKeys(c, true));
  else fitTo(['cat:'+cid]);
}

function expandAll(){
  CATS.forEach(function(c){ state.cats[c.id] = true; });
  SUBS.forEach(function(s){ state.subs[s.sid] = true; });
  if (state.view === 'tree'){ openAllTree(true); return; }
  relayout();
  viewAll(true);
}
function collapseAll(){
  if (state.view === 'tree'){ openAllTree(false); return; }
  SUBS.forEach(function(s){ delete state.subs[s.sid]; });
  CATS.forEach(function(c){ state.cats[c.id] = true; });
  relayout();
  resetView(true);
}

/* ================================================================ gestures */
var pointers = {}, pcount = 0, gesture = null, moved = 0, downTime = 0, downTarget = null;

stage.addEventListener('pointerdown', function(e){
  if (e.pointerType === 'mouse' && e.button !== 0) return;
  pointers[e.pointerId] = {x:e.clientX, y:e.clientY};
  pcount++;
  try { stage.setPointerCapture(e.pointerId); } catch (err) {}
  world.classList.remove('anim');
  if (pcount === 1){
    gesture = {mode:'pan', tx0:tx, ty0:ty, sx:e.clientX, sy:e.clientY};
    moved = 0; downTime = Date.now(); downTarget = e.target;
  } else if (pcount === 2){
    var ids = Object.keys(pointers);
    var a = pointers[ids[0]], b = pointers[ids[1]];
    var d0 = Math.sqrt(Math.pow(a.x-b.x,2)+Math.pow(a.y-b.y,2)) || 1;
    gesture = {mode:'pinch', d0:d0, s0:scale, tx0:tx, ty0:ty,
      mx0:(a.x+b.x)/2, my0:(a.y+b.y)/2};
  }
  hideHint();
});

stage.addEventListener('pointermove', function(e){
  if (!(e.pointerId in pointers)) return;
  var prev = pointers[e.pointerId];
  moved += Math.sqrt(Math.pow(e.clientX-prev.x,2)+Math.pow(e.clientY-prev.y,2));
  pointers[e.pointerId] = {x:e.clientX, y:e.clientY};
  if (!gesture) return;
  if (gesture.mode === 'pan' && pcount === 1){
    if (moved > 10){
      tx = gesture.tx0 + (e.clientX - gesture.sx);
      ty = gesture.ty0 + (e.clientY - gesture.sy);
      apply();
    }
  } else if (gesture.mode === 'pinch' && pcount >= 2){
    var ids = Object.keys(pointers);
    var a = pointers[ids[0]], b = pointers[ids[1]];
    var d = Math.sqrt(Math.pow(a.x-b.x,2)+Math.pow(a.y-b.y,2)) || 1;
    var mx = (a.x+b.x)/2, my = (a.y+b.y)/2;
    var ns = clamp(gesture.s0 * (d/gesture.d0), MIN_S, MAX_S);
    var k = ns/gesture.s0;
    tx = mx - (gesture.mx0 - gesture.tx0)*k;
    ty = my - (gesture.my0 - gesture.ty0)*k;
    scale = ns;
    apply();
  }
  if (moved > 8) hideHint();
});

function pointerEnd(e){
  if (!(e.pointerId in pointers)) return;
  delete pointers[e.pointerId];
  pcount = Object.keys(pointers).length;
  if (pcount === 0){
    if (gesture && gesture.mode === 'pan' && moved < 24 && (Date.now()-downTime) < 700){
      handleTap(downTarget);
    }
    gesture = null;
    downTarget = null;
  } else if (pcount === 1){
    var ids = Object.keys(pointers);
    var p = pointers[ids[0]];
    gesture = {mode:'pan', tx0:tx, ty0:ty, sx:p.x, sy:p.y};
    moved = 999;
    downTarget = null;
  }
}
stage.addEventListener('pointerup', pointerEnd);
stage.addEventListener('pointercancel', function(e){
  if (e.pointerId in pointers){ delete pointers[e.pointerId]; pcount = Object.keys(pointers).length; }
  if (pcount === 0) gesture = null;
});
stage.addEventListener('wheel', function(e){
  e.preventDefault();
  zoomAt(e.clientX, e.clientY, Math.exp(-e.deltaY * 0.0016));
}, {passive:false});

function handleTap(el){
  if (!el || !el.closest) { clearSel(); return; }
  var n = el.closest('[data-node]');
  if (!n){ clearSel(); return; }
  var kind = n.getAttribute('data-kind');
  if (kind === 'root'){
    clearSel(); setFilter(null); resetView(true);
  } else if (kind === 'cat'){
    toggleCat(n.getAttribute('data-cat'));
  } else if (kind === 'sub'){
    toggleSub(n.getAttribute('data-sub'));
  } else {
    var id = n.getAttribute('data-id');
    if (state.sel === id) openModal(id);
    else select(id);
  }
}

/* ================================================================ filter + search */
function setFilter(cat){
  state.filter = cat;
  clearSel();
  var chips = chipsEl.children;
  for (var i=0;i<chips.length;i++){
    var b = chips[i];
    var c = b.getAttribute('data-cat');
    var on = cat ? c === cat : c === 'all';
    b.classList.toggle('on', !!on);
    if (on && b.scrollIntoView) b.scrollIntoView({block:'nearest', inline:'center'});
  }
  if (state.view === 'tree'){
    if (qnorm()){ state.query = ''; qEl.value = ''; qClear.hidden = true; }
    updateTree();
    updateCount();
    return;
  }
  relayout();
  if (cat){
    var c0 = null;
    for (var k=0;k<CATS.length;k++) if (CATS[k].id === cat) c0 = CATS[k];
    if (c0) fitTo(branchKeys(c0, true));
  } else {
    viewAll(true);
  }
}

function updateCount(){
  var q = qnorm(), n = 0;
  TOPICS.forEach(function(t){ if (matchTopic(t)) n++; });
  if (q) countEl.innerHTML = '<b>'+n+'</b>개 검색됨';
  else if (state.filter){
    var nm = state.filter;
    for (var i=0;i<CATS.length;i++) if (CATS[i].id === state.filter) nm = CATS[i].name;
    countEl.innerHTML = '<b>'+n+'</b>개 토픽 · '+nm;
  }
  else countEl.innerHTML = '<b>'+TOPICS.length+'</b>개 토픽 · '+CATS.length+'개 분야 · '+SUBS.length+'개 중분류';
  document.title = 'ITPE 마인드맵 · ' + TOPICS.length + '개 토픽';
}

function renderResults(){
  var q = qnorm();
  if (!q){ resultsEl.hidden = true; resultsEl.innerHTML = ''; return; }
  var hits = TOPICS.filter(matchTopic).slice(0, 8);
  if (!hits.length){
    resultsEl.innerHTML = '<div class="empty">일치하는 토픽이 없어요</div>';
    resultsEl.hidden = false;
    return;
  }
  var html = '';
  hits.forEach(function(t){
    html += '<button data-go="'+t.id+'"><span class="dot" style="background:'+t.catObj.c+'"></span>'
          + '<span>'+esc(t.t)+'</span><span class="rsub">'+t.catObj.short+'</span></button>';
  });
  resultsEl.innerHTML = html;
  resultsEl.hidden = false;
}

qEl.addEventListener('input', function(){
  state.query = qEl.value;
  qClear.hidden = !state.query;
  if (state.query) clearSel();
  if (state.view === 'map'){ relayout(); if (qnorm()) viewAll(false); }
  else updateTree();
  renderResults();
  updateCount();
});
qEl.addEventListener('keydown', function(e){
  if (e.key === 'Enter'){
    var first = resultsEl.querySelector('button');
    if (first) goTo(first.getAttribute('data-go'));
  }
});
qClear.addEventListener('click', function(){
  qEl.value = ''; state.query = '';
  qClear.hidden = true;
  resultsEl.hidden = true;
  if (state.view === 'map'){ relayout(); viewAll(true); } else updateTree();
  updateCount();
  qEl.focus();
});
resultsEl.addEventListener('click', function(e){
  var b = e.target.closest('button[data-go]');
  if (b) goTo(b.getAttribute('data-go'));
});
document.addEventListener('pointerdown', function(e){
  if (!resultsEl.hidden && !resultsEl.contains(e.target) && e.target !== qEl) resultsEl.hidden = true;
}, true);

function goTo(id){
  resultsEl.hidden = true;
  qEl.blur();
  var t = BY[id];
  if (!t) return;
  state.cats[t.cat] = true;
  state.subs[t.sub] = true;
  if (state.view === 'map'){
    relayout();
    select(id);
    focusNode(id, Math.max(scale, 0.8));
  } else {
    openTreePath(id);
    select(id);
  }
  openModal(id);
}

/* ================================================================ chips */
function buildChips(){
  function mk(cat, name, color, active){
    var b = document.createElement('button');
    b.className = 'chip' + (active ? ' on' : '');
    b.setAttribute('data-cat', cat);
    b.style.setProperty('--c', color);
    b.innerHTML = '<i></i>'+name;
    b.addEventListener('click', function(){ setFilter(cat === 'all' ? null : cat); });
    return b;
  }
  chipsEl.appendChild(mk('all','전체','#0f172a', true));
  CATS.forEach(function(c){ chipsEl.appendChild(mk(c.id, c.name, c.c, false)); });
}

/* ================================================================ tree view */
var treeCatEl = {}, treeSubEl = {}, treeLeafEl = {};

function buildTree(){
  treeEl.innerHTML = '';
  CATS.forEach(function(c){
    var box = document.createElement('div');
    box.className = 'tnode open';
    var row = document.createElement('button');
    row.className = 'trow catrow';
    row.innerHTML = '<span class="chev">▸</span><span class="dot" style="background:'+c.c+'"></span>'
                  + '<span class="nm">'+esc(c.name)+'</span><span class="cnt">'+c.count+'</span>';
    row.addEventListener('click', function(){ box.classList.toggle('open'); });
    var kids = document.createElement('div');
    kids.className = 'kids';
    c.subs.forEach(function(s){
      var sbox = document.createElement('div');
      sbox.className = 'tnode';
      var srow = document.createElement('button');
      srow.className = 'trow subrow';
      srow.innerHTML = '<span class="chev">▸</span><span class="nm">'+esc(s.n)+'</span>'
                     + '<span class="cnt">'+s.o.topics.length+'</span>';
      srow.addEventListener('click', function(){ sbox.classList.toggle('open'); });
      var skids = document.createElement('div');
      skids.className = 'kids';
      s.o.topics.forEach(function(t){
        var lrow = document.createElement('button');
        lrow.className = 'trow leafrow';
        lrow.setAttribute('data-go', t.id);
        lrow.innerHTML = '<span class="st '+(t.redStar ? 'red' : 'gold')+'">'
                       + (t.redStar ? '★' : (t.stars ? new Array(t.stars+1).join('⭐') : '·'))+'</span>'
                       + '<span class="nm">'+esc(t.t)+'</span>'
                       + '<span class="ts">'+esc(t.s)+'</span>';
        lrow.addEventListener('click', function(){ select(t.id); openModal(t.id); });
        skids.appendChild(lrow);
        treeLeafEl[t.id] = lrow;
      });
      sbox.appendChild(srow);
      sbox.appendChild(skids);
      kids.appendChild(sbox);
      treeSubEl[s.sid] = sbox;
    });
    box.appendChild(row);
    box.appendChild(kids);
    treeEl.appendChild(box);
    treeCatEl[c.id] = box;
  });
}

function updateTree(){
  var all = !qnorm() && !state.filter;
  CATS.forEach(function(c){
    var catVis = 0;
    c.subs.forEach(function(s){
      var vis = 0;
      s.o.topics.forEach(function(t){
        var ok = matchTopic(t);
        if (ok) vis++;
        treeLeafEl[t.id].classList.toggle('hide', !ok);
      });
      var sbox = treeSubEl[s.sid];
      sbox.classList.toggle('hide', vis === 0);
      if (!all && vis > 0) sbox.classList.add('open');
      var cnt = sbox.querySelector('.cnt');
      if (cnt) cnt.textContent = (all ? s.o.topics.length : vis);
      catVis += vis;
    });
    var cbox = treeCatEl[c.id];
    cbox.classList.toggle('hide', catVis === 0);
    if (!all && catVis > 0) cbox.classList.add('open');
    var ccnt = cbox.querySelector('.cnt');
    if (ccnt) ccnt.textContent = (all ? c.count : catVis);
  });
}

function openAllTree(open){
  CATS.forEach(function(c){
    treeCatEl[c.id].classList.toggle('open', open);
    c.subs.forEach(function(s){ treeSubEl[s.sid].classList.toggle('open', open); });
  });
  if (!open) treeEl.scrollTop = 0;
}

function openTreePath(id){
  var t = BY[id];
  if (!t) return;
  treeCatEl[t.cat].classList.add('open');
  var sbox = treeSubEl[t.sub];
  sbox.classList.add('open');
  setTimeout(function(){
    if (treeLeafEl[id] && treeLeafEl[id].scrollIntoView) treeLeafEl[id].scrollIntoView({block:'center'});
  }, 40);
}

/* ================================================================ view switch */
function setView(v){
  state.view = v;
  stage.hidden = (v !== 'map');
  treeEl.hidden = (v !== 'tree');
  document.body.classList.toggle('view-map', v === 'map');
  var btns = $('seg').children;
  for (var i=0;i<btns.length;i++){
    btns[i].classList.toggle('on', btns[i].getAttribute('data-view') === v);
  }
  $('expandAll').textContent = '＋ 전체 펼치기';
  $('collapseAll').textContent = '− 전체 접기';
  if (v === 'map'){
    requestAnimationFrame(function(){
      relayout();
      if (qnorm() || state.filter) viewAll(false); else resetView(false);
    });
  } else {
    updateTree();
    updateCount();
  }
  hideHint();
}

/* ================================================================ modal */
var lastFocus = null;

function relatedHTML(id){
  var html = '';
  for (var i=0;i<LINKS.length;i++){
    var other = null;
    if (LINKS[i][0] === id) other = LINKS[i][1];
    else if (LINKS[i][1] === id) other = LINKS[i][0];
    if (!other || !BY[other]) continue;
    var t = BY[other];
    html += '<button class="relbtn" data-go="'+t.id+'"><span class="dot" style="background:'+t.catObj.c+'"></span>'
          + esc(t.t)+'<span class="arw">↗</span></button>';
  }
  if (!html) html = '<div class="cap">연관 토픽이 없어요</div>';
  return html;
}

function openModal(id){
  var t = BY[id];
  if (!t) return;
  var c = t.catObj;
  panel.style.setProperty('--c', c.c);
  panel.style.setProperty('--cbg', c.bg);
  panel.style.setProperty('--cbd', c.bd);

  mCat.textContent = c.name + ' · ' + (SUB[t.sub] ? SUB[t.sub].n : '');
  mCat.style.background = c.bg;
  mCat.style.color = c.c;
  mCat.style.border = '1px solid '+rgba(c.c, .25);
  mStatus.textContent = (t.st || '📌 복습 필요');
  mStatus.style.background = '#f4f7fb';
  mTitle.textContent = t.full;

  var html = '';
  html += '<section><h3>정의</h3><div class="prose">' + t.def + '</div></section>';
  html += '<section><h3>핵심 키워드</h3>' + t.kw + '</section>';
  if (t.pp) html += '<section><h3>관점별 구성표</h3>' + t.pp + '</section>';

  html += '<section><h3>개념도</h3>';
  if (t.img){
    html += '<figure class="fig"><img data-src="'+t.img+'" alt="'+esc(t.t)+' 개념도" loading="lazy">'
          + '<figcaption>그림을 탭하면 크게 볼 수 있어요</figcaption></figure>';
  } else {

function closeModal(){
  document.body.classList.remove('sheet-open');
  sheet.classList.remove('open');
  setTimeout(function(){
    if (!sheet.classList.contains('open')) sheet.hidden = true;
  }, 300);
}

mBody.addEventListener('click', function(e){
  var img = e.target.closest('img[data-src]');
  if (img){ openLB(img.src); return; }
  var b = e.target.closest('button[data-go]');
  if (b){
    var id = b.getAttribute('data-go');
    select(id);
    openModal(id);
    if (state.view === 'map'){
      var t = BY[id];
      state.cats[t.cat] = true; state.subs[t.sub] = true;

  }
});

/* ================================================================ lightbox */
var lbBox = $('lbBox'), lbScaleEl = $('lbScale');
var lbS = 1, lbTx = 0, lbTy = 0;
var lbPtrs = new Map(), lbGest = null, lbLastTap = 0;

function applyLB(){
  lbImg.style.transform = 'translate('+lbTx+'px,'+lbTy+'px) scale('+lbS+')';
  lbScaleEl.textContent = Math.round(lbS * 100) + '%';
}
function clampLB(s){ return Math.max(1, Math.min(5, s)); }
function resetLB(){ lbS = 1; lbTx = 0; lbTy = 0; applyLB(); }
function zoomLBAt(cx, cy, factor){
  var rect = lbBox.getBoundingClientRect();
  var mx = cx - (rect.left + rect.width/2);
  var my = cy - (rect.top + rect.height/2);
  var ns = clampLB(lbS * factor);
  var k = ns / lbS;
  lbTx = mx - (mx - lbTx) * k;
  lbTy = my - (my - lbTy) * k;
  lbS = ns;
  if (lbS <= 1.01){ lbS = 1; lbTx = 0; lbTy = 0; }
  applyLB();
}
function openLB(src){
  lbImg.src = src;
  resetLB();
  lb.hidden = false;
}
function closeLB(){ lb.hidden = true; lbImg.removeAttribute('src'); lbPtrs.clear(); lbGest = null; }
$('lbClose').addEventListener('click', closeLB);
$('lbZoom').addEventListener('click', resetLB);
$('lbIn').addEventListener('click', function(){
  var r = lbBox.getBoundingClientRect();
  zoomLBAt(r.left + r.width/2, r.top + r.height/2, 1.4);
});
$('lbOut').addEventListener('click', function(){
  var r = lbBox.getBoundingClientRect();
  zoomLBAt(r.left + r.width/2, r.top + r.height/2, 1/1.4);
});
lbBox.addEventListener('wheel', function(e){
  if (lb.hidden) return;
  e.preventDefault();
  zoomLBAt(e.clientX, e.clientY, e.deltaY < 0 ? 1.18 : 1/1.18);
}, {passive:false});

lbBox.addEventListener('pointerdown', function(e){
  if (lb.hidden) return;
  lbBox.setPointerCapture(e.pointerId);
  lbPtrs.set(e.pointerId, {x:e.clientX, y:e.clientY});
  if (lbPtrs.size === 1){
    lbGest = {mode:'pan', sx:e.clientX, sy:e.clientY, tx0:lbTx, ty0:lbTy, moved:false};
  } else if (lbPtrs.size >= 2){
    var pts = Array.from(lbPtrs.values());
    var d0 = Math.hypot(pts[1].x - pts[0].x, pts[1].y - pts[0].y) || 1;
    var r = lbBox.getBoundingClientRect();
    lbGest = {mode:'pinch', d0:d0, s0:lbS, tx0:lbTx, ty0:lbTy,
      cx:(pts[0].x+pts[1].x)/2 - (r.left + r.width/2),
      cy:(pts[0].y+pts[1].y)/2 - (r.top + r.height/2)};
  }
});
lbBox.addEventListener('pointermove', function(e){
  if (!lbPtrs.has(e.pointerId) || !lbGest) return;
  lbPtrs.set(e.pointerId, {x:e.clientX, y:e.clientY});
  if (lbGest.mode === 'pan' && lbPtrs.size === 1){
    var dx = e.clientX - lbGest.sx, dy = e.clientY - lbGest.sy;
    if (Math.hypot(dx, dy) > 6) lbGest.moved = true;
    if (lbS > 1){
      lbTx = lbGest.tx0 + dx;
      lbTy = lbGest.ty0 + dy;
      applyLB();
    }
  } else if (lbGest.mode === 'pinch' && lbPtrs.size >= 2){
    var pts = Array.from(lbPtrs.values());
    var d = Math.hypot(pts[1].x - pts[0].x, pts[1].y - pts[0].y) || 1;
    var r = lbBox.getBoundingClientRect();
    var mcx = (pts[0].x+pts[1].x)/2 - (r.left + r.width/2);
    var mcy = (pts[0].y+pts[1].y)/2 - (r.top + r.height/2);
    var ns = clampLB(lbGest.s0 * (d / lbGest.d0));
    var k = ns / lbGest.s0;
    lbS = ns;
    lbTx = mcx - (lbGest.cx - lbGest.tx0) * k;
    lbTy = mcy - (lbGest.cy - lbGest.ty0) * k;
    if (lbS <= 1.01){ lbS = 1; lbTx = 0; lbTy = 0; }
    applyLB();
  }
});
function endLBPtr(e){
  var wasTap = lbGest && lbGest.mode === 'pan' && !lbGest.moved && lbPtrs.size === 1;
  lbPtrs.delete(e.pointerId);
  if (lbPtrs.size === 0){
    if (wasTap){
      var now = Date.now();
      if (now - lbLastTap < 300){
        if (lbS > 1.05) resetLB();
        else zoomLBAt(e.clientX, e.clientY, 2.4);
        lbLastTap = 0;
      } else {
        lbLastTap = now;
        if (e.target === lbBox) closeLB();
      }
    }
    lbGest = null;
  } else if (lbPtrs.size === 1){
    var rem = Array.from(lbPtrs.values())[0];
    lbGest = {mode:'pan', sx:rem.x, sy:rem.y, tx0:lbTx, ty0:lbTy, moved:true};
  }
}
lbBox.addEventListener('pointerup', endLBPtr);
lbBox.addEventListener('pointercancel', endLBPtr);
