자원 풀(Pool)<\/b>로 통합·추상화하는 기술<\/p>", "kw": "<ul class=\"kw\"><li><b>블록 스토리지<\/b>: 고정 크기 블록·볼륨 단위, 저지연 — VM 부팅 디스크·DB, iSCSI/NVMe-oF (AWS EBS)<\/li><li><b>파일 스토리지<\/b>: 계층형 디렉터리·POSIX·공유 마운트 — NFS/SMB, 다수 서버 동시 접근 (AWS EFS)<\/li><li><b>오브젝트 스토리지<\/b>: 키-값 + 메타데이터·HTTP(S) REST API — 무한 확장·저비용·불변성(버저닝) (AWS S3)<\/li><li><b>스토리지 가상화<\/b>: 물리 자원을 논리 풀로 통합해 <b>이기종 티어링·무중단 마이그레이션·용량 증설<\/b>을 지원 (SDS: Software Defined Storage)<\/li><li><b>선택 기준<\/b>: 지연·IOPS가 중요하면 블록, 다수 노드 공유는 파일, 대용량·비정형·확장성은 오브젝트<\/li><\/ul>", "pp": "<h4>1) 개념 비교 (3종 스토리지)<\/h4>\n<div class=\"tblwrap\"><table class=\"cmp\"><thead><tr><th>비교<\/th><th>블록(Block)<\/th><th>파일(File)<\/th><th>오브젝트(Object)<\/th><\/tr><\/thead><tbody><tr><td class=\"k\">접근 단위<\/td><td>고정 크기 블록·볼륨<\/td><td>디렉터리·파일 경로<\/td><td>객체(키-값) + 메타데이터<\/td><\/tr><tr><td class=\"k\">프로토콜<\/td><td>iSCSI · NVMe-oF<\/td><td>NFS · SMB/CIFS<\/td><td>HTTP(S) REST API<\/td><\/tr><tr><td class=\"k\">대표 서비스<\/td><td>AWS EBS<\/td><td>AWS EFS · FSx<\/td><td>AWS S3 · Azure Blob<\/td><\/tr><\/tbody><\/table><\/div>\n<h4>2) 상세 비교 (적용 관점)<\/h4>\n<div class=\"tblwrap\"><table class=\"cmp\"><thead><tr><th>구분<\/th><th>블록(Block)<\/th><th>파일(File)<\/th><th>오브젝트(Object)<\/th><\/tr><\/thead><tbody><tr><td class=\"k\">성능·지연<\/td><td>최저 지연·고 IOPS<\/td><td>중간<\/td><td>상대적 높은 지연<\/td><\/tr><tr><td class=\"k\">확장성<\/td><td>볼륨 단위 확장<\/td><td>공유 용량 확장<\/td><td>사실상 무한<\/td><\/tr><tr><td class=\"k\">적합 워크로드<\/td><td>VM 부팅·DB·ERP<\/td><td>파일 공유·콘텐츠 협업<\/td><td>백업·미디어·빅데이터·AI 학습데이터<\/td><\/tr><\/tbody><\/table><\/div>", "rv": "<div class=\"q\"><b>두음: 블·파·오<\/b> — 블록(볼륨·DB) · 파일(공유·POSIX) · 오브젝트(키값·무한확장)<\/div>\n<div class=\"q\"><b>스토리지 가상화 = 서버 가상화의 저장장치판<\/b>: 물리 스토리지를 논리 풀로 묶어 이기종·티어링·무중단 이전을 실현!<\/div>", "img": "itpe-diagrams/92-cloud-storage.webp", "txt": null, "search": "클라우드 스토리지 3종 · 스토리지 가상화 클라우드 스토리지 3종 block·file·object / 가상화 ca/os 인프라·스토리지 빨간별 빨간 별 빨간색 별 ★ 레드별 심화반 심화 선택 클라우드 환경에서 데이터 특성·접근 패턴에 따라 블록(block)·파일(file)·오브젝트(object) 스토리지 를 선택 적용하고, 이기종 물리 스토리지를 논리적 자원 풀(pool) 로 통합·추상화하는 기술 블록 스토리지 : 고정 크기 블록·볼륨 단위, 저지연 — vm 부팅 디스크·db, iscsi/nvme-of (aws ebs) 파일 스토리지 : 계층형 디렉터리·posix·공유 마운트 — nfs/smb, 다수 서버 동시 접근 (aws efs) 오브젝트 스토리지 : 키-값 + 메타데이터·http(s) rest api — 무한 확장·저비용·불변성(버저닝) (aws s3) 스토리지 가상화 : 물리 자원을 논리 풀로 통합해 이기종 티어링·무중단 마이그레이션·용량 증설 을 지원 (sds: software defined storage) 선택 기준 : 지연·iops가 중요하면 블록, 다수 노드 공유는 파일, 대용량·비정형·확장성은 오브젝트 1) 개념 비교 (3종 스토리지) 비교 블록(block) 파일(file) 오브젝트(object) 접근 단위 고정 크기 블록·볼륨 디렉터리·파일 경로 객체(키-값) + 메타데이터 프로토콜 iscsi · nvme-of nfs · smb/cifs http(s) rest api 대표 서비스 aws ebs aws efs · fsx aws s3 · azure blob 2) 상세 비교 (적용 관점) 구분 블록(block) 파일(file) 오브젝트(object) 성능·지연 최저 지연·고 iops 중간 상대적 높은 지연 확장성 볼륨 단위 확장 공유 용량 확장 사실상 무한 적합 워크로드 vm 부팅·db·erp 파일 공유·콘텐츠 협업 백업·미디어·빅데이터·ai 학습데이터 두음: 블·파·오 — 블록(볼륨·db) · 파일(공유·posix) · 오브젝트(키값·무한확장) 스토리지 가상화 = 서버 가상화의 저장장치판 : 물리 스토리지를 논리 풀로 묶어 이기종·티어링·무중단 이전을 실현!"}, {"id": "saga", "cat": "sw", "sub": "sw-dist", "parent": null, "t": "MSA Saga & Outbox", "s": "분산 트랜잭션", "stars": 2, "redStar": false, "full": "MSA 분산 트랜잭션 (Saga 패턴 & Outbox)", "catLabel": "SW공학·아키텍처", "st": "📌 복습 필요", "d": "2026-11-19", "def": "<p>서비스별 독립 DB를 쓰는 MSA 환경에서 강한 일관성(2PC) 대신 <b>최종적 일관성(Eventual Consistency)<\/b> 으로 분산 트랜잭션을 처리하는 패턴<\/p>", "kw": "<ul class=\"kw\"><li><b>2PC의 한계<\/b>: <code>동기식 락 점유(가용성 저하)<\/code>, <code>코디네이터 SPOF<\/code>, <code>Non-XA(NoSQL/외부 API) 불가<\/code>, 확장성 저하<\/li><li><b>Saga 패턴<\/b>: 로컬 트랜잭션 연속 실행 + 실패 시 <code>보상 트랜잭션(Compensating Transaction)<\/code><ul class=\"kw\"><li><code>Choreography<\/code> — 중앙 제어자 없이 메시지 브로커(Pub/Sub) 기반으로 각 서비스가 이벤트에 반응해 자율 처리<\/li><li><code>Orchestration<\/code> — 중앙 <code>Saga Orchestrator<\/code>가 전체 순서를 지휘·통제<\/li><\/ul><\/li><li><b>보완 기법<\/b><ul class=\"kw\"><li><code>Transactional Outbox<\/code> — 비즈니스 데이터 변경과 이벤트 발행을 <b>같은 로컬 DB 트랜잭션<\/b>에 저장해 이중 쓰기(Dual Write) 문제 방지<\/li><li><code>멱등성(Idempotency) 키<\/code> — 중복 메시지 재처리 방지<\/li><li><code>CDC(Change Data Capture)<\/code> — Outbox 테이블 변경을 브로커로 전달<\/li><\/ul><\/li><\/ul>", "pp": "<div class=\"tblwrap\"><table class=\"cmp\"><colgroup><col style=\"width:24%\"><col style=\"width:28%\"><col style=\"width:48%\"><\/colgroup><thead><tr><th>관점(측면)<\/th><th>특징<\/th><th>설명<\/th><\/tr><\/thead><tbody><tr><td class=\"k\">일관성 모델<\/td><td>최종적 일관성<\/td><td>2PC의 동기 락·SPOF를 피하고 로컬 트랜잭션 연속과 보상으로 수렴<\/td><\/tr><tr><td class=\"k\">제어 방식<\/td><td>Choreography vs Orchestration<\/td><td>이벤트 기반 자율 반응과 중앙 오케스트레이터 지휘를 복잡도·가시성으로 선택<\/td><\/tr><tr><td class=\"k\">메시지 신뢰<\/td><td>Outbox + CDC<\/td><td>비즈니스 변경과 이벤트를 같은 로컬 트랜잭션에 저장하고 CDC로 발행해 이중 쓰기 문제 해결<\/td><\/tr><tr><td class=\"k\">중복·실패 처리<\/td><td>멱등성·보상 트랜잭션<\/td><td>멱등키로 재처리를 방지하고 실패 시 역순 보상으로 부분 반영을 되돌림<\/td><\/tr><\/tbody><\/table><\/div>", "rv": "<div class=\"q\"><b>두음: 보·코·오·아<\/b> — 보(보상 트랜잭션)·코(Choreography)·오(Orchestration)·아(Outbox+CDC)<\/div>\n<div class=\"q\"><b>Choreography vs Orchestration<\/b> 차이 + <b>Outbox 패턴<\/b> 개념 꼭 암기! \"Saga는 보상으로 되돌리고, Outbox는 이벤트 유실 없이 내보낸다.\"<\/div>", "img": "itpe-diagrams/01-msa-saga-outbox.webp", "txt": null, "search": "msa 분산 트랜잭션 (saga 패턴 & outbox) msa saga & outbox 분산 트랜잭션 sw공학·아키텍처 클라우드·msa·분산 ⭐⭐ 기출빈출 기출 빈출 중요 서비스별 독립 db를 쓰는 msa 환경에서 강한 일관성(2pc) 대신 최종적 일관성(eventual consistency) 으로 분산 트랜잭션을 처리하는 패턴 2pc의 한계 : 동기식 락 점유(가용성 저하) , 코디네이터 spof , non-xa(nosql/외부 api) 불가 , 확장성 저하 saga 패턴 : 로컬 트랜잭션 연속 실행 + 실패 시 보상 트랜잭션(compensating transaction) choreography — 중앙 제어자 없이 메시지 브로커(pub/sub) 기반으로 각 서비스가 이벤트에 반응해 자율 처리 orchestration — 중앙 saga orchestrator 가 전체 순서를 지휘·통제 보완 기법 transactional outbox — 비즈니스 데이터 변경과 이벤트 발행을 같은 로컬 db 트랜잭션 에 저장해 이중 쓰기(dual write) 문제 방지 멱등성(idempotency) 키 — 중복 메시지 재처리 방지 cdc(change data capture) — outbox 테이블 변경을 브로커로 전달 관점(측면) 특징 설명 일관성 모델 최종적 일관성 2pc의 동기 락·spof를 피하고 로컬 트랜잭션 연속과 보상으로 수렴 제어 방식 choreography vs orchestration 이벤트 기반 자율 반응과 중앙 오케스트레이터 지휘를 복잡도·가시성으로 선택 메시지 신뢰 outbox + cdc 비즈니스 변경과 이벤트를 같은 로컬 트랜잭션에 저장하고 cdc로 발행해 이중 쓰기 문제 해결 중복·실패 처리 멱등성·보상 트랜잭션 멱등키로 재처리를 방지하고 실패 시 역순 보상으로 부분 반영을 되돌림 두음: 보·코·오·아 — 보(보상 트랜잭션)·코(choreography)·오(orchestration)·아(outbox+cdc) choreography vs orchestration 차이 + outbox 패턴 개념 꼭 암기! \"saga는 보상으로 되돌리고, outbox는 이벤트 유실 없이 내보낸다.\""}, {"id": "cqrs", "cat": "sw", "sub": "sw-dist", "parent": null, "t": "CQRS", "s": "명령·조회 책임 분리", "stars": 0, "redStar": false, "full": "CQRS (명령·조회 책임 분리)", "catLabel": "SW공학·아키텍처", "st": "🔄 확인 중", "d": "2026-11-19", "def": "<p>상태를 변경하는 <b>명령(Command: CUD)<\/b> 모델과 데이터를 읽는 <b>조회(Query: R)<\/b> 모델을 <b>아키텍처 및 데이터 저장소 수준에서 분리<\/b>해 독립적인 확장성과 성능을 확보하는 패턴<\/p>", "kw": "<ul class=\"kw\"><li><b>도입 배경<\/b><ul class=\"kw\"><li>읽기/쓰기 트래픽 비대칭 해소<\/li><li>복잡 도메인 모델과 조회용 DTO 모델 분리<\/li><li>MSA 환경의 독립적 스케일링<\/li><\/ul><\/li><li><b>연계 패턴<\/b><ul class=\"kw\"><li><b>Event Sourcing<\/b> — 상태 변경을 이벤트로 저장<\/li><li><b>메시지 브로커(Kafka 등)<\/b> 를 통한 비동기 Read DB 동기화<\/li><\/ul><\/li><li><b>저장소 구성<\/b><ul class=\"kw\"><li>Write DB — 정규화 RDBMS<\/li><li>Read DB — 비정규화 NoSQL, Elasticsearch, Redis 등 조회 최적화<\/li><\/ul><\/li><li><b>주의점<\/b><ul class=\"kw\"><li>비동기 동기화로 인한 <b>결과적 일관성(Eventual Consistency)<\/b> 및 동기화 지연(Lag)<\/li><li>시스템 복잡도 증가<\/li><\/ul><\/li><\/ul>", "pp": "<div class=\"tblwrap\"><table class=\"cmp\"><colgroup><col style=\"width:24%\"><col style=\"width:28%\"><col style=\"width:48%\"><\/colgroup><thead><tr><th>관점(측면)<\/th><th>특징<\/th><th>설명<\/th><\/tr><\/thead><tbody><tr><td class=\"k\">모델 분리<\/td><td>Command vs Query<\/td><td>CUD 명령 모델과 R 조회 모델을 코드·아키텍처 수준에서 분리해 각각 최적화<\/td><\/tr><tr><td class=\"k\">저장소 구성<\/td><td>Write RDB / Read NoSQL<\/td><td>쓰기는 정규화 RDBMS, 읽기는 비정규화 NoSQL·검색엔진·캐시로 조회 성능 확보<\/td><\/tr><tr><td class=\"k\">일관성<\/td><td>결과적 일관성<\/td><td>비동기 동기화로 지연(Lag)이 발생하므로 사용자에게 반영 시점을 보정해 안내<\/td><\/tr><tr><td class=\"k\">연계 패턴<\/td><td>Event Sourcing<\/td><td>상태 변경을 이벤트로 저장해 조회 모델 재구축과 감사·이력 추적을 가능하게 함<\/td><\/tr><\/tbody><\/table><\/div>", "rv": "<div class=\"q\"><b>두음: 쓰·읽·이<\/b> — 쓰(Write 모델)·읽(Read 모델)·이(Event Sourcing·결과적 일관성)<\/div>\n<div class=\"q\">단순 Read Replica(DB 복제)가 아니라 <b>모델 자체를 분리<\/b>하는 점과, 주의점으로 <b>결과적 일관성(동기화 지연) + Event Sourcing 연계<\/b>를 꼭 함께 쓰기!<\/div>", "img": "itpe-diagrams/06-cqrs.webp", "txt": null, "search": "cqrs (명령·조회 책임 분리) cqrs 명령·조회 책임 분리 sw공학·아키텍처 클라우드·msa·분산 상태를 변경하는 명령(command: cud) 모델과 데이터를 읽는 조회(query: r) 모델을 아키텍처 및 데이터 저장소 수준에서 분리 해 독립적인 확장성과 성능을 확보하는 패턴 도입 배경 읽기/쓰기 트래픽 비대칭 해소 복잡 도메인 모델과 조회용 dto 모델 분리 msa 환경의 독립적 스케일링 연계 패턴 event sourcing — 상태 변경을 이벤트로 저장 메시지 브로커(kafka 등) 를 통한 비동기 read db 동기화 저장소 구성 write db — 정규화 rdbms read db — 비정규화 nosql, elasticsearch, redis 등 조회 최적화 주의점 비동기 동기화로 인한 결과적 일관성(eventual consistency) 및 동기화 지연(lag) 시스템 복잡도 증가 관점(측면) 특징 설명 모델 분리 command vs query cud 명령 모델과 r 조회 모델을 코드·아키텍처 수준에서 분리해 각각 최적화 저장소 구성 write rdb / read nosql 쓰기는 정규화 rdbms, 읽기는 비정규화 nosql·검색엔진·캐시로 조회 성능 확보 일관성 결과적 일관성 비동기 동기화로 지연(lag)이 발생하므로 사용자에게 반영 시점을 보정해 안내 연계 패턴 event sourcing 상태 변경을 이벤트로 저장해 조회 모델 재구축과 감사·이력 추적을 가능하게 함 두음: 쓰·읽·이 — 쓰(write 모델)·읽(read 모델)·이(event sourcing·결과적 일관성) 단순 read replica(db 복제)가 아니라 모델 자체를 분리 하는 점과, 주의점으로 결과적 일관성(동기화 지연) + event sourcing 연계 를 꼭 함께 쓰기!"}, {"id": "circuit", "cat": "sw", "sub": "sw-dist", "parent": null, "t": "서킷 브레이커", "s": "Circuit Breaker", "stars": 0, "redStar": false, "full": "서킷 브레이커 패턴 (Circuit Breaker)", "catLabel": "SW공학·아키텍처", "st": "📌 복습 필요", "d": "2026-11-19", "def": "<p>MSA 등 분산 환경에서 특정 서비스 장애 시 호출을 조기에 차단하고 <b>Fallback(대체 응답)<\/b>을 반환해 <b>장애 전파(Cascading Failure)를 방지<\/b>하는 회복탄력성(Resilience) 패턴.<\/p>", "kw": "<ul class=\"kw\"><li><b>3가지 상태 전이<\/b><ul class=\"kw\"><li><b>Closed (정상)<\/b>: 회로가 닫혀 요청이 정상 통과, 실패율/응답지연 모니터링 → 임계치 초과 시 <code>Open<\/code> 전이<\/li><li><b>Open (차단)<\/b>: 회로가 열려 외부 호출 즉시 차단(Fail-Fast) 및 <b>Fallback<\/b> 응답 반환 → 대기 시간(Timeout) 경과 시 <code>Half-Open<\/code> 전이<\/li><li><b>Half-Open (반열림)<\/b>: 소수 시험 요청만 통과시켜 복구 여부 확인 → 성공 시 <code>Closed<\/code>, 실패 시 다시 <code>Open<\/code><\/li><\/ul><\/li><li><b>상태 전이도<\/b><\/li><li><b>연계 패턴<\/b>: <b>Retry<\/b>(재시도), <b>Timeout<\/b>, <b>Bulkhead<\/b>(격벽 격리)<\/li><\/ul>", "pp": "<div class=\"tblwrap\"><table class=\"cmp\"><colgroup><col style=\"width:24%\"><col style=\"width:28%\"><col style=\"width:48%\"><\/colgroup><thead><tr><th>관점(측면)<\/th><th>특징<\/th><th>설명<\/th><\/tr><\/thead><tbody><tr><td class=\"k\">상태 전이<\/td><td>Closed·Open·Half-Open<\/td><td>임계치 초과 시 Open으로 차단, Timeout 경과 후 Half-Open에서 시험 호출로 복귀 판단<\/td><\/tr><tr><td class=\"k\">개방 기준<\/td><td>실패율·지연·호출 수<\/td><td>실패율·응답지연·느린 호출 비율과 최소 요청 수를 함께 보아 오탐을 줄임<\/td><\/tr><tr><td class=\"k\">장애 확산 차단<\/td><td>Fail-Fast + Fallback<\/td><td>즉시 차단 후 대체 응답으로 스레드·커넥션 고갈과 연쇄 장애(Cascading Failure)를 막음<\/td><\/tr><tr><td class=\"k\">연계 패턴<\/td><td>Retry·Timeout·Bulkhead<\/td><td>재시도·타임아웃·격벽과 조합해 회복탄력성을 완성하고, 무분별한 재시도는 차단<\/td><\/tr><\/tbody><\/table><\/div>", "rv": "<div class=\"q\"><b>두음: 클·오·하<\/b> — 클(Closed 정상 통과)·오(Open 즉시 차단+Fallback)·하(Half-Open 시험 호출)<\/div>\n<div class=\"q\">전기 차단기처럼 <b>Closed=정상 통과, Open=즉시 차단+Fallback, Half-Open=일부 시험 호출<\/b> 3단계 상태 전이도를 꼭 그려 넣기!<\/div>", "img": "itpe-diagrams/16-%EC%84%9C%ED%82%B7%EB%B8%8C%EB%A0%88%EC%9D%B4%EC%BB%A4.webp", "txt": null, "search": "서킷 브레이커 패턴 (circuit breaker) 서킷 브레이커 circuit breaker sw공학·아키텍처 클라우드·msa·분산 msa 등 분산 환경에서 특정 서비스 장애 시 호출을 조기에 차단하고 fallback(대체 응답) 을 반환해 장애 전파(cascading failure)를 방지 하는 회복탄력성(resilience) 패턴. 3가지 상태 전이 closed (정상) : 회로가 닫혀 요청이 정상 통과, 실패율/응답지연 모니터링 → 임계치 초과 시 open 전이 open (차단) : 회로가 열려 외부 호출 즉시 차단(fail-fast) 및 fallback 응답 반환 → 대기 시간(timeout) 경과 시 half-open 전이 half-open (반열림) : 소수 시험 요청만 통과시켜 복구 여부 확인 → 성공 시 closed , 실패 시 다시 open 상태 전이도 연계 패턴 : retry (재시도), timeout , bulkhead (격벽 격리) 관점(측면) 특징 설명 상태 전이 closed·open·half-open 임계치 초과 시 open으로 차단, timeout 경과 후 half-open에서 시험 호출로 복귀 판단 개방 기준 실패율·지연·호출 수 실패율·응답지연·느린 호출 비율과 최소 요청 수를 함께 보아 오탐을 줄임 장애 확산 차단 fail-fast + fallback 즉시 차단 후 대체 응답으로 스레드·커넥션 고갈과 연쇄 장애(cascading failure)를 막음 연계 패턴 retry·timeout·bulkhead 재시도·타임아웃·격벽과 조합해 회복탄력성을 완성하고, 무분별한 재시도는 차단 두음: 클·오·하 — 클(closed 정상 통과)·오(open 즉시 차단+fallback)·하(half-open 시험 호출) 전기 차단기처럼 closed=정상 통과, open=즉시 차단+fallback, half-open=일부 시험 호출 3단계 상태 전이도를 꼭 그려 넣기!"}, {"id": "deploy", "cat": "sw", "sub": "sw-dist", "parent": null, "t": "무중단 배포", "s": "Blue-Green·Canary·Rolling", "stars": 2, "redStar": false, "full": "무중단 배포 전략 (Blue-Green / Canary / Rolling)", "catLabel": "SW공학·아키텍처", "st": "📌 복습 필요", "d": "2026-11-19", "def": "<p>서비스 중단 없이 신버전을 배포·전환하는 배포 전략<\/p>", "kw": "<ul class=\"kw\"><li><b>블루-그린(Blue-Green)<\/b><ul class=\"kw\"><li>구(Blue)·신(Green) <b>동일 규모 환경 2벌<\/b> 구성 후 <b>트래픽 100% 일괄 전환<\/b><\/li><li>장점: 즉시 롤백 가능, 배포 중 서비스 영향 없음<\/li><li>단점: 자원 2배 필요, 전환 시 세션·DB 마이그레이션 고려<\/li><\/ul><\/li><li><b>카나리(Canary)<\/b><ul class=\"kw\"><li>신버전을 소수 서버에 배포하고 <b>극소수 트래픽(예: 5% → 20% → 100%) 점진 확대<\/b> + 모니터링<\/li><li>장점: 위험 최소화, A/B 테스트·실사용자 피드백에 유리<\/li><li>단점: 모니터링·자동화 인프라 필요<\/li><\/ul><\/li><li><b>롤링(Rolling)<\/b><ul class=\"kw\"><li>기존 서버를 <b>한 대씩 순차적으로<\/b> 신버전으로 교체<\/li><li>장점: 추가 자원 최소, 무중단<\/li><li>단점: 롤백이 느리고 구·신 버전이 동시에 서비스되는 구간 존재<\/li><\/ul><\/li><\/ul>", "pp": "<div class=\"tblwrap\"><table class=\"cmp\"><colgroup><col style=\"width:24%\"><col style=\"width:28%\"><col style=\"width:48%\"><\/colgroup><thead><tr><th>관점(측면)<\/th><th>특징<\/th><th>설명<\/th><\/tr><\/thead><tbody><tr><td class=\"k\">전환 방식<\/td><td>일괄·점진·순차<\/td><td>Blue-Green은 100% 일괄 전환, Canary는 소수 트래픽 점진 확대, Rolling은 한 대씩 교체<\/td><\/tr><tr><td class=\"k\">자원 비용<\/td><td>2배 vs 최소<\/td><td>Blue-Green은 동일 규모 환경 2벌이 필요하고, Rolling은 추가 자원이 가장 적게 듦<\/td><\/tr><tr><td class=\"k\">위험·롤백<\/td><td>즉시 vs 지연<\/td><td>Blue-Green은 전환만 되돌리면 즉시 롤백, Rolling은 구·신 버전 혼재로 롤백이 느림<\/td><\/tr><tr><td class=\"k\">검증·운영<\/td><td>모니터링·세션 정합성<\/td><td>카나리는 지표 기반으로 단계 확대, 세션 공유와 DB 스키마 호환성을 함께 설계<\/td><\/tr><\/tbody><\/table><\/div>", "rv": "<div class=\"q\"><b>두음: 블·카·롤<\/b> — 블(2벌 환경 100% 전환)·카(소수 트래픽 점진)·롤(한 대씩 순차 교체)<\/div>\n<div class=\"q\">\"한 대씩 순차 교체 = <b>롤링<\/b>\", \"2벌 환경 100% 전환 = <b>블루-그린<\/b>\", \"소수 트래픽 점진 검증 = <b>카나리<\/b>\" 3가지 정확히 분리!<\/div>", "img": "itpe-diagrams/02-%EB%AC%B4%EC%A4%91%EB%8B%A8-%EB%B0%B0%ED%8F%AC.webp", "txt": null, "search": "무중단 배포 전략 (blue-green / canary / rolling) 무중단 배포 blue-green·canary·rolling sw공학·아키텍처 클라우드·msa·분산 ⭐⭐ 기출빈출 기출 빈출 중요 서비스 중단 없이 신버전을 배포·전환하는 배포 전략 블루-그린(blue-green) 구(blue)·신(green) 동일 규모 환경 2벌 구성 후 트래픽 100% 일괄 전환 장점: 즉시 롤백 가능, 배포 중 서비스 영향 없음 단점: 자원 2배 필요, 전환 시 세션·db 마이그레이션 고려 카나리(canary) 신버전을 소수 서버에 배포하고 극소수 트래픽(예: 5% → 20% → 100%) 점진 확대 + 모니터링 장점: 위험 최소화, a/b 테스트·실사용자 피드백에 유리 단점: 모니터링·자동화 인프라 필요 롤링(rolling) 기존 서버를 한 대씩 순차적으로 신버전으로 교체 장점: 추가 자원 최소, 무중단 단점: 롤백이 느리고 구·신 버전이 동시에 서비스되는 구간 존재 관점(측면) 특징 설명 전환 방식 일괄·점진·순차 blue-green은 100% 일괄 전환, canary는 소수 트래픽 점진 확대, rolling은 한 대씩 교체 자원 비용 2배 vs 최소 blue-green은 동일 규모 환경 2벌이 필요하고, rolling은 추가 자원이 가장 적게 듦 위험·롤백 즉시 vs 지연 blue-green은 전환만 되돌리면 즉시 롤백, rolling은 구·신 버전 혼재로 롤백이 느림 검증·운영 모니터링·세션 정합성 카나리는 지표 기반으로 단계 확대, 세션 공유와 db 스키마 호환성을 함께 설계 두음: 블·카·롤 — 블(2벌 환경 100% 전환)·카(소수 트래픽 점진)·롤(한 대씩 순차 교체) \"한 대씩 순차 교체 = 롤링 \", \"2벌 환경 100% 전환 = 블루-그린 \", \"소수 트래픽 점진 검증 = 카나리 \" 3가지 정확히 분리!"}, {"id": "dr-cloud", "cat": "sw", "sub": "sw-dist", "parent": null, "t": "온프레미스 DR vs 클라우드 DR", "s": "백·파·웜·멀 / RTO·RPO", "stars": 3, "redStar": false, "full": "온프레미스 DR vs 클라우드 DR", "catLabel": "아키텍처", "st": "📌 복습 필요", "d": "2026-11-22", "def": "<p>재해·장애 발생 시 핵심 IT 시스템을 복구하여 업무 연속성(BCP)을 보장하는 재해복구 체계로, <b>자체 IDC 기반 온프레미스 DR<\/b>과 <b>퍼블릭 클라우드의 탄력성·자동화(IaC)를 활용한 클라우드 DR<\/b>로 구분됨<\/p>", "kw": "<ul class=\"kw\"><li><b>핵심 지표 (알·알)<\/b>: <b>RTO<\/b>(목표복구시간, 허용 중단 시간) · <b>RPO<\/b>(목표복구시점, 허용 데이터 손실 시점)<\/li><li><b>전통 DR 4대 유형 (미·핫·웜·콜)<\/b>:<ul class=\"kw\"><li><b>Mirror Site<\/b>(실시간 동기, RTO≈0, 고비용) · <b>Hot Site<\/b>(상시 대기, 수 시간) · <b>Warm Site<\/b>(핵심 설비만, 수일) · <b>Cold Site<\/b>(공간·전력만, 수 주)<\/li><\/ul><\/li><li><b>클라우드 DR 4단계 전략 (백·파·웜·멀)<\/b>:<ul class=\"kw\"><li><b>Backup &amp; Restore<\/b>(백업·복구, 수 시간) → <b>Pilot Light<\/b>(핵심 DB만 가동, 수십 분) → <b>Warm Standby<\/b>(축소 시스템 상시 가동, 수 분) → <b>Multi-Site Active-Active<\/b>(실시간 이중 가동, RTO/RPO ≈ 0)<\/li><\/ul><\/li><\/ul>", "pp": "<h4>1) 개념 비교<\/h4>\n<div class=\"tblwrap\"><table class=\"cmp\"><colgroup><col style=\"width:24%\"><col style=\"width:28%\"><col style=\"width:48%\"><\/colgroup><thead><tr><th>비교<\/th><th>온프레미스 DR<\/th><th>클라우드 DR<\/th><\/tr><\/thead><tbody><tr><td class=\"k\">구축 기반<\/td><td>자체 보조 IDC · 전용 하드웨어 이중화<\/td><td>퍼블릭 클라우드 멀티 리전(Multi-Region) · IaC<\/td><\/tr><tr><td class=\"k\">비용 구조<\/td><td>초기 투자(CAPEX) 큼 · 평시 유휴 자원 낭비<\/td><td>사용량 기반(OPEX) · 평시 최소 유지 후 장애 시 확장<\/td><\/tr><tr><td class=\"k\">복구 탄력성<\/td><td>증설 수주 소요 · 물리적 거리 한계<\/td><td>글로벌 리전 자동 확장 · RTO/RPO 단계별 선택<\/td><\/tr><\/tbody><\/table><\/div>\n<h4>2) 상세 비교 (운영 · 보안 · 고려사항)<\/h4>\n<div class=\"tblwrap\"><table class=\"cmp\"><colgroup><col style=\"width:24%\"><col style=\"width:28%\"><col style=\"width:48%\"><\/colgroup><thead><tr><th>구분<\/th><th>온프레미스 DR<\/th><th>클라우드 DR<\/th><\/tr><\/thead><tbody><tr><td class=\"k\">운영·테스트<\/td><td>수동 절체 비중 높음 · 모의훈련 부담 큼<\/td><td>IaC(Terraform 등)로 정기 DR 모의훈련 자동화<\/td><\/tr><tr><td class=\"k\">보안·규제<\/td><td>물리적 통제·금융 망분리 규제 대응 유리<\/td><td>공동책임 모델 · 데이터 주권 및 전송 암호화 검토 필수<\/td><\/tr><tr><td class=\"k\">설계 고려사항<\/td><td>BIA 기반 업무 등급별 RTO·RPO 차등 적용<\/td><td>불변 백업(Immutable)·에어갭으로 랜섬웨어 전파 차단<\/td><\/tr><\/tbody><\/table><\/div>", "rv": "<div class=\"q\"><b>두음: 미·핫·웜·콜 / 백·파·웜·멀 / 알·알<\/b> — 전통 4유형 / 클라우드 4단계 / RTO·RPO<\/div>\n<div class=\"q\"><b>비용-RTO 트레이드오프<\/b>에 따라 <b>백·파·웜·멀 4단계<\/b>를 그림으로 그리면 고득점!<\/div>", "img": "itpe-diagrams/81-onprem-vs-cloud-dr.webp", "txt": null, "search": "온프레미스 dr vs 클라우드 dr 온프레미스 dr vs 클라우드 dr 백·파·웜·멀 / rto·rpo 아키텍처 클라우드·msa·분산 ⭐⭐⭐ 기출빈출 기출 빈출 중요 재해·장애 발생 시 핵심 it 시스템을 복구하여 업무 연속성(bcp)을 보장하는 재해복구 체계로, 자체 idc 기반 온프레미스 dr 과 퍼블릭 클라우드의 탄력성·자동화(iac)를 활용한 클라우드 dr 로 구분됨 핵심 지표 (알·알) : rto (목표복구시간, 허용 중단 시간) · rpo (목표복구시점, 허용 데이터 손실 시점) 전통 dr 4대 유형 (미·핫·웜·콜) : mirror site (실시간 동기, rto≈0, 고비용) · hot site (상시 대기, 수 시간) · warm site (핵심 설비만, 수일) · cold site (공간·전력만, 수 주) 클라우드 dr 4단계 전략 (백·파·웜·멀) : backup &amp; restore (백업·복구, 수 시간) → pilot light (핵심 db만 가동, 수십 분) → warm standby (축소 시스템 상시 가동, 수 분) → multi-site active-active (실시간 이중 가동, rto/rpo ≈ 0) 1) 개념 비교 비교 온프레미스 dr 클라우드 dr 구축 기반 자체 보조 idc · 전용 하드웨어 이중화 퍼블릭 클라우드 멀티 리전(multi-region) · iac 비용 구조 초기 투자(capex) 큼 · 평시 유휴 자원 낭비 사용량 기반(opex) · 평시 최소 유지 후 장애 시 확장 복구 탄력성 증설 수주 소요 · 물리적 거리 한계 글로벌 리전 자동 확장 · rto/rpo 단계별 선택 2) 상세 비교 (운영 · 보안 · 고려사항) 구분 온프레미스 dr 클라우드 dr 운영·테스트 수동 절체 비중 높음 · 모의훈련 부담 큼 iac(terraform 등)로 정기 dr 모의훈련 자동화 보안·규제 물리적 통제·금융 망분리 규제 대응 유리 공동책임 모델 · 데이터 주권 및 전송 암호화 검토 필수 설계 고려사항 bia 기반 업무 등급별 rto·rpo 차등 적용 불변 백업(immutable)·에어갭으로 랜섬웨어 전파 차단 두음: 미·핫·웜·콜 / 백·파·웜·멀 / 알·알 — 전통 4유형 / 클라우드 4단계 / rto·rpo 비용-rto 트레이드오프 에 따라 백·파·웜·멀 4단계 를 그림으로 그리면 고득점!"}, {"id": "gw-mesh", "cat": "sw", "sub": "sw-native", "parent": null, "t": "API Gateway · Service Mesh", "s": "North-South vs East-West", "stars": 3, "redStar": false, "full": "API Gateway와 Service Mesh (Sidecar)", "catLabel": "SW공학·아키텍처", "st": "📌 복습 필요", "d": "2026-11-21", "def": "<ul class=\"kw\"><li><b>API Gateway<\/b>: 클라이언트와 마이크로서비스 경계에서 <b>외부→내부(North-South) 트래픽<\/b>의 단일 진입점(인증·라우팅·Rate Limit)을 담당하는 계층<\/li><li><b>Service Mesh<\/b>: 마이크로서비스 <b>내부 서비스 간(East-West) 통신<\/b>을 비즈니스 코드와 분리해 <b>Sidecar 프록시(Envoy)<\/b>와 Control Plane(Istio)으로 제어·관찰하는 인프라 계층<\/li><\/ul>", "kw": "<ul class=\"kw\"><li><b>트래픽 구분<\/b>: <b>North-South<\/b>(API Gateway: 인증·인가·BFF·캐싱·트래픽 제한) vs <b>East-West<\/b>(Service Mesh: mTLS·Circuit Breaker·카나리 라우팅·분산 추적)<\/li><li><b>Sidecar 패턴<\/b>: 각 Pod 내 앱 컨테이너 옆에 프록시(<b>Envoy<\/b>)를 1:1 배치해 언어 독립적으로 네트워크·보안 기능 주입<\/li><\/ul>", "pp": "<p><b>1) 개념 비교 (API Gateway vs Service Mesh)<\/b><\/p>\n<div class=\"tblwrap\"><table class=\"cmp\"><colgroup><col style=\"width:24%\"><col style=\"width:28%\"><col style=\"width:48%\"><\/colgroup><thead><tr><th>구분<\/th><th>API Gateway<\/th><th>Service Mesh (Istio·Envoy)<\/th><\/tr><\/thead><tbody><tr><td class=\"k\">관할 트래픽<\/td><td>North-South (외부 ↔ 내부)<\/td><td>East-West (내부 서비스 ↔ 서비스)<\/td><\/tr><tr><td class=\"k\">주요 기능<\/td><td>OAuth/JWT 인증 · Rate Limit · BFF 집계<\/td><td>mTLS 상호인증 · 재시도/서킷브레이커 · 분산추적<\/td><\/tr><\/tbody><\/table><\/div>\n<p><b>2) 아키텍처·운영 관점 구성표<\/b><\/p>\n<div class=\"tblwrap\"><table class=\"cmp\"><colgroup><col style=\"width:24%\"><col style=\"width:28%\"><col style=\"width:48%\"><\/colgroup><thead><tr><th>관점(측면)<\/th><th>특징<\/th><th>설명<\/th><\/tr><\/thead><tbody><tr><td class=\"k\">관심사 분리 관점<\/td><td>비즈니스 vs 인프라<\/td><td>개발자는 비즈니스 로직만 짜고, 통신·보안·관찰성은 Sidecar가 전담<\/td><\/tr><tr><td class=\"k\">트레이드오프 관점<\/td><td>홉(Hop) 지연 · 리소스<\/td><td>Pod마다 Sidecar가 떠서 메모리/지연 증가 → 최근 Ambient Mesh(Sidecarless) 등장<\/td><\/tr><tr><td class=\"k\">보안·관찰성 연계<\/td><td>mTLS + OTel 자동 수집<\/td><td>Zero Trust 내부 구간 암호화 및 OpenTelemetry 분산 추적 자동화<\/td><\/tr><\/tbody><\/table><\/div>", "rv": "<div class=\"q\"><b>두음: 노·게 / 이·메·사<\/b> — North-South(Gateway) / East-West(Mesh · Sidecar)<\/div>\n<div class=\"q\"><b>단일 진입점(API Gateway) + 내부 통신/mTLS(Service Mesh)<\/b> 상보적 결합!<\/div>", "img": "itpe-diagrams/72-api-gateway-service-mesh.webp", "txt": null, "search": "api gateway와 service mesh (sidecar) api gateway · service mesh north-south vs east-west sw공학·아키텍처 클라우드 네이티브·api ⭐⭐⭐ 기출빈출 기출 빈출 중요 api gateway : 클라이언트와 마이크로서비스 경계에서 외부→내부(north-south) 트래픽 의 단일 진입점(인증·라우팅·rate limit)을 담당하는 계층 service mesh : 마이크로서비스 내부 서비스 간(east-west) 통신 을 비즈니스 코드와 분리해 sidecar 프록시(envoy) 와 control plane(istio)으로 제어·관찰하는 인프라 계층 트래픽 구분 : north-south (api gateway: 인증·인가·bff·캐싱·트래픽 제한) vs east-west (service mesh: mtls·circuit breaker·카나리 라우팅·분산 추적) sidecar 패턴 : 각 pod 내 앱 컨테이너 옆에 프록시( envoy )를 1:1 배치해 언어 독립적으로 네트워크·보안 기능 주입 1) 개념 비교 (api gateway vs service mesh) 구분 api gateway service mesh (istio·envoy) 관할 트래픽 north-south (외부 ↔ 내부) east-west (내부 서비스 ↔ 서비스) 주요 기능 oauth/jwt 인증 · rate limit · bff 집계 mtls 상호인증 · 재시도/서킷브레이커 · 분산추적 2) 아키텍처·운영 관점 구성표 관점(측면) 특징 설명 관심사 분리 관점 비즈니스 vs 인프라 개발자는 비즈니스 로직만 짜고, 통신·보안·관찰성은 sidecar가 전담 트레이드오프 관점 홉(hop) 지연 · 리소스 pod마다 sidecar가 떠서 메모리/지연 증가 → 최근 ambient mesh(sidecarless) 등장 보안·관찰성 연계 mtls + otel 자동 수집 zero trust 내부 구간 암호화 및 opentelemetry 분산 추적 자동화 두음: 노·게 / 이·메·사 — north-south(gateway) / east-west(mesh · sidecar) 단일 진입점(api gateway) + 내부 통신/mtls(service mesh) 상보적 결합!"}, {"id": "modular-monolith-msa-eda", "cat": "sw", "sub": "sw-dist", "parent": null, "t": "모듈러 모놀리스 vs MSA vs EDA", "s": "통·데·장·배·복·결", "stars": 2, "redStar": false, "full": "모듈러 모놀리스 vs MSA vs EDA", "catLabel": "SW공학·아키텍처", "st": "📌 복습 필요", "d": "2026-11-25", "def": "<p><b>모듈러 모놀리스(Modular Monolith)<\/b>는 <b>단일 배포 단위<\/b>를 유지하면서 모듈 간 경계를 명확히 나눈 스타일이고, <b>MSA<\/b>는 서비스별 <b>독립 배포·독립 데이터<\/b>로 분리하는 스타일이며, <b>EDA(Event-Driven Architecture)<\/b>는 <b>이벤트 발행·구독<\/b>으로 컴포넌트를 비동기로 연결하는 스타일이다. 셋은 대체재라기보다 <b>결합도·일관성·운영 복잡도의 트레이드오프<\/b>이며, 모듈러 모놀리스에서 시작해 필요할 때 MSA·EDA로 확장하는 <b>점진적 아키텍처 진화 원칙<\/b>.<\/p>", "kw": "<ul class=\"kw\"><li><b>모듈러 모놀리스<\/b>: 단일 프로세스·단일 DB, 모듈 간 <b>인터페이스·내부 이벤트<\/b>로 경계 유지, 트랜잭션 단순·디버깅 쉬움<\/li><li><b>MSA<\/b>: DB per Service·서비스별 CI/CD, 동기(REST·gRPC)와 비동기 메시징, <b>Saga·CQRS·API Gateway<\/b><\/li><li><b>EDA<\/b>: 브로커(Kafka) 중심 <b>생산자-소비자 분리<\/b>, 최종 일관성, 이벤트 스키마·<b>멱등 소비<\/b>·DLQ<\/li><li><b>경계 설정<\/b>: DDD <b>바운디드 컨텍스트<\/b>·콘웨이 법칙 — 조직 구조가 아키텍처 경계를 결정<\/li><li><b>전환<\/b>: <b>Strangler Fig<\/b> 패턴으로 기능 단위 점진 분리(한 번에 재작성 금지)<\/li><li><b>분산 과제<\/b>: 분산 트랜잭션(Outbox·Saga), 관찰성(분산 추적), 장애 전파(Circuit Breaker·Bulkhead)<\/li><li><b>선택 기준<\/b>: 팀 규모·배포 독립성 요구·데이터 일관성 요구·운영 성숙도<\/li><\/ul>", "pp": "<h4>1) 모듈러 모놀리스 vs MSA vs EDA (비교모듈: 통·데·장·배·복·결)<\/h4>\n<div class=\"tblwrap\"><table class=\"cmp\"><thead><tr><th>구분<\/th><th>모듈러 모놀리스<\/th><th>MSA<\/th><th>EDA<\/th><\/tr><\/thead><tbody><tr><td class=\"k\">통신방식<\/td><td>인프로세스 호출 + 내부 이벤트<\/td><td>REST·gRPC 동기 + 메시징<\/td><td>브로커 기반 비동기 이벤트<\/td><\/tr><tr><td class=\"k\">데이터정합성<\/td><td>단일 DB ACID 트랜잭션<\/td><td>DB per Service, <b>Saga·Outbox<\/b> 결과적 일관성<\/td><td>최종 일관성, 이벤트 소싱·재처리<\/td><\/tr><tr><td class=\"k\">장애격리<\/td><td>프로세스 단위(전체 영향)<\/td><td>Circuit Breaker·Bulkhead로 격리<\/td><td>소비자 격리·DLQ로 재처리<\/td><\/tr><tr><td class=\"k\">배포전략<\/td><td>단일 배포(모듈 경계 규율 필요)<\/td><td>서비스별 독립 CI/CD·카나리<\/td><td>토픽·스키마 버전 관리<\/td><\/tr><tr><td class=\"k\">복잡도·운영<\/td><td>낮음(단일 추적) → 규율 없으면 Big Ball of Mud<\/td><td>높음(분산 추적·서비스 메시·플랫폼)<\/td><td>중간(브로커·스키마 거버넌스)<\/td><\/tr><tr><td class=\"k\">결합도·경계<\/td><td>모듈 경계(컴파일 타임 강제)<\/td><td>서비스 경계(API 계약)<\/td><td>이벤트 계약(가장 느슨한 결합)<\/td><\/tr><\/tbody><\/table><\/div>\n<h4>2) 선택 기준<\/h4>\n<div class=\"tblwrap\"><table class=\"cmp\"><colgroup><col style=\"width:24%\"><col style=\"width:28%\"><col style=\"width:48%\"><\/colgroup><thead><tr><th>구분<\/th><th>판단 질문<\/th><th>권고<\/th><\/tr><\/thead><tbody><tr><td class=\"k\">팀 규모<\/td><td>팀이 하나인가, 여러 개인가<\/td><td>소수 팀이면 모듈러 모놀리스<\/td><\/tr><tr><td class=\"k\">배포 독립성<\/td><td>기능별 배포 주기가 다른가<\/td><td>다르면 MSA<\/td><\/tr><tr><td class=\"k\">데이터 일관성<\/td><td>강한 트랜잭션이 필수인가<\/td><td>필수면 모놀리스, 아니면 Saga·EDA<\/td><\/tr><tr><td class=\"k\">확장 단위<\/td><td>특정 기능만 트래픽이 큰가<\/td><td>해당 모듈만 분리·수평 확장<\/td><\/tr><tr><td class=\"k\">운영 성숙도<\/td><td>관찰성·자동화가 갖춰졌나<\/td><td>미비하면 MSA 도입 보류<\/td><\/tr><\/tbody><\/table><\/div>\n<h4>3) 전환·운영 고려사항<\/h4>\n<div class=\"tblwrap\"><table class=\"cmp\"><colgroup><col style=\"width:24%\"><col style=\"width:28%\"><col style=\"width:48%\"><\/colgroup><thead><tr><th>구분<\/th><th>키워드<\/th><th>설명<\/th><\/tr><\/thead><tbody><tr><td class=\"k\">전환<\/td><td>Strangler Fig<\/td><td>라우팅으로 신·구 경로 분리, 기능 단위 이관<\/td><\/tr><tr><td class=\"k\">데이터<\/td><td>경계 분리<\/td><td>공유 테이블 제거, 서비스별 스키마 소유권 이전<\/td><\/tr><tr><td class=\"k\">트랜잭션<\/td><td>Outbox·Saga<\/td><td>로컬 트랜잭션 + 이벤트 발행으로 원자성 확보<\/td><\/tr><tr><td class=\"k\">관찰성<\/td><td>추적·상관ID<\/td><td>요청·이벤트 전 구간 추적, SLO 기반 알림<\/td><\/tr><tr><td class=\"k\">이벤트<\/td><td>스키마 거버넌스<\/td><td>스키마 레지스트리·호환성 규칙·멱등 소비자<\/td><\/tr><\/tbody><\/table><\/div>", "rv": "<div class=\"q\"><b>두음: 통·데·장·배·복·결 — 통신·데이터정합성·장애격리·배포·복잡도·결합도<\/b><\/div>\n<div class=\"q\"><b>\"모놀리스로 시작해 경계를 지키고, 필요할 때 분리한다 — 분산은 공짜가 아니다\"<\/b><\/div>", "img": "itpe-diagrams/144-modular-monolith-msa-eda.webp", "txt": null, "search": "모듈러 모놀리스 vs msa vs eda 모듈러 모놀리스 vs msa vs eda 통·데·장·배·복·결 sw공학·아키텍처 클라우드·msa·분산 ⭐⭐ 기출빈출 기출 빈출 중요 모듈러 모놀리스(modular monolith) 는 단일 배포 단위 를 유지하면서 모듈 간 경계를 명확히 나눈 스타일이고, msa 는 서비스별 독립 배포·독립 데이터 로 분리하는 스타일이며, eda(event-driven architecture) 는 이벤트 발행·구독 으로 컴포넌트를 비동기로 연결하는 스타일이다. 셋은 대체재라기보다 결합도·일관성·운영 복잡도의 트레이드오프 이며, 모듈러 모놀리스에서 시작해 필요할 때 msa·eda로 확장하는 점진적 아키텍처 진화 원칙 . 모듈러 모놀리스 : 단일 프로세스·단일 db, 모듈 간 인터페이스·내부 이벤트 로 경계 유지, 트랜잭션 단순·디버깅 쉬움 msa : db per service·서비스별 ci/cd, 동기(rest·grpc)와 비동기 메시징, saga·cqrs·api gateway eda : 브로커(kafka) 중심 생산자-소비자 분리 , 최종 일관성, 이벤트 스키마· 멱등 소비 ·dlq 경계 설정 : ddd 바운디드 컨텍스트 ·콘웨이 법칙 — 조직 구조가 아키텍처 경계를 결정 전환 : strangler fig 패턴으로 기능 단위 점진 분리(한 번에 재작성 금지) 분산 과제 : 분산 트랜잭션(outbox·saga), 관찰성(분산 추적), 장애 전파(circuit breaker·bulkhead) 선택 기준 : 팀 규모·배포 독립성 요구·데이터 일관성 요구·운영 성숙도 1) 모듈러 모놀리스 vs msa vs eda (비교모듈: 통·데·장·배·복·결) 구분 모듈러 모놀리스 msa eda 통신방식 인프로세스 호출 + 내부 이벤트 rest·grpc 동기 + 메시징 브로커 기반 비동기 이벤트 데이터정합성 단일 db acid 트랜잭션 db per service, saga·outbox 결과적 일관성 최종 일관성, 이벤트 소싱·재처리 장애격리 프로세스 단위(전체 영향) circuit breaker·bulkhead로 격리 소비자 격리·dlq로 재처리 배포전략 단일 배포(모듈 경계 규율 필요) 서비스별 독립 ci/cd·카나리 토픽·스키마 버전 관리 복잡도·운영 낮음(단일 추적) → 규율 없으면 big ball of mud 높음(분산 추적·서비스 메시·플랫폼) 중간(브로커·스키마 거버넌스) 결합도·경계 모듈 경계(컴파일 타임 강제) 서비스 경계(api 계약) 이벤트 계약(가장 느슨한 결합) 2) 선택 기준 구분 판단 질문 권고 팀 규모 팀이 하나인가, 여러 개인가 소수 팀이면 모듈러 모놀리스 배포 독립성 기능별 배포 주기가 다른가 다르면 msa 데이터 일관성 강한 트랜잭션이 필수인가 필수면 모놀리스, 아니면 saga·eda 확장 단위 특정 기능만 트래픽이 큰가 해당 모듈만 분리·수평 확장 운영 성숙도 관찰성·자동화가 갖춰졌나 미비하면 msa 도입 보류 3) 전환·운영 고려사항 구분 키워드 설명 전환 strangler fig 라우팅으로 신·구 경로 분리, 기능 단위 이관 데이터 경계 분리 공유 테이블 제거, 서비스별 스키마 소유권 이전 트랜잭션 outbox·saga 로컬 트랜잭션 + 이벤트 발행으로 원자성 확보 관찰성 추적·상관id 요청·이벤트 전 구간 추적, slo 기반 알림 이벤트 스키마 거버넌스 스키마 레지스트리·호환성 규칙·멱등 소비자 두음: 통·데·장·배·복·결 — 통신·데이터정합성·장애격리·배포·복잡도·결합도 \"모놀리스로 시작해 경계를 지키고, 필요할 때 분리한다 — 분산은 공짜가 아니다\""}, {"id": "sre", "cat": "sw", "sub": "sw-quality", "parent": null, "t": "SRE", "s": "신뢰성 공학 · Toil·에러 버짓", "stars": 2, "redStar": false, "full": "SRE (Site Reliability Engineering)", "catLabel": "SW공학·아키텍처", "st": "📌 복습 필요", "d": "2026-11-20", "def": "<p>IT 인프라와 운영(Operations) 문제를 <b>소프트웨어 엔지니어링 기법(자동화·코드)<\/b>으로 해결하여, 대규모 시스템의 <b>신뢰성과 가용성<\/b>을 정량적으로 보장하는 구글발 운영 방법론<\/p>", "kw": "<ul class=\"kw\"><li><b>핵심 4대 원칙<\/b>:<ul class=\"kw\"><li><b>SLI·SLO·Error Budget<\/b>: 감이 아닌 수치(에러 버짓)로 개발 속도와 안정성 균형 조절<\/li><li><b>Toil(단순 반복 작업) 감소<\/b>: 수동 운영 업무 비중을 50% 이하로 낮추고 자동화<\/li><li><b>Observability (관측 가능성)<\/b>: Metrics·Logs·Traces 기반 장애 조기 탐지·대응<\/li><li><b>Blameless Postmortem<\/b>: 사람 탓이 아닌 시스템·프로세스 구조 개선 중심의 사후 분석<\/li><\/ul><\/li><li><b>DevOps vs SRE<\/b>: DevOps가 협업 문화·철학(What)이라면, SRE는 이를 실현하는 구체적 실천 공학(How)<\/li><\/ul>", "pp": "<div class=\"tblwrap\"><table class=\"cmp\"><colgroup><col style=\"width:24%\"><col style=\"width:28%\"><col style=\"width:48%\"><\/colgroup><thead><tr><th>관점(측면)<\/th><th>특징<\/th><th>설명<\/th><\/tr><\/thead><tbody><tr><td class=\"k\">신뢰성 지표<\/td><td>SLI·SLO·Error Budget<\/td><td>감이 아닌 수치로 목표를 정하고 버짓으로 속도와 안정성을 조율<\/td><\/tr><tr><td class=\"k\">업무 방식<\/td><td>Toil 50% 이하<\/td><td>단순 반복 수작업을 측정·자동화해 엔지니어링에 쓸 시간을 확보<\/td><\/tr><tr><td class=\"k\">관측<\/td><td>Metrics·Logs·Traces<\/td><td>3대 신호로 장애를 조기 탐지하고 원인을 좁혀 대응 시간을 단축<\/td><\/tr><tr><td class=\"k\">문화<\/td><td>Blameless Postmortem<\/td><td>사람이 아닌 시스템·프로세스 구조를 개선하는 사후 분석으로 재발을 방지<\/td><\/tr><\/tbody><\/table><\/div>", "rv": "<div class=\"q\"><b>두음: 수·토·관·블<\/b> — 수(SLI·SLO·버짓)·토(Toil 감소)·관(Observability)·블(Blameless Postmortem)<\/div>\n<div class=\"q\"><b>SLI·SLO·Error Budget + Toil 자동화 + Blameless Postmortem<\/b> 3종 세트가 핵심!<\/div>", "img": "itpe-diagrams/32-sre.webp", "txt": null, "search": "sre (site reliability engineering) sre 신뢰성 공학 · toil·에러 버짓 sw공학·아키텍처 품질·테스트·devops ⭐⭐ 기출빈출 기출 빈출 중요 it 인프라와 운영(operations) 문제를 소프트웨어 엔지니어링 기법(자동화·코드) 으로 해결하여, 대규모 시스템의 신뢰성과 가용성 을 정량적으로 보장하는 구글발 운영 방법론 핵심 4대 원칙 : sli·slo·error budget : 감이 아닌 수치(에러 버짓)로 개발 속도와 안정성 균형 조절 toil(단순 반복 작업) 감소 : 수동 운영 업무 비중을 50% 이하로 낮추고 자동화 observability (관측 가능성) : metrics·logs·traces 기반 장애 조기 탐지·대응 blameless postmortem : 사람 탓이 아닌 시스템·프로세스 구조 개선 중심의 사후 분석 devops vs sre : devops가 협업 문화·철학(what)이라면, sre는 이를 실현하는 구체적 실천 공학(how) 관점(측면) 특징 설명 신뢰성 지표 sli·slo·error budget 감이 아닌 수치로 목표를 정하고 버짓으로 속도와 안정성을 조율 업무 방식 toil 50% 이하 단순 반복 수작업을 측정·자동화해 엔지니어링에 쓸 시간을 확보 관측 metrics·logs·traces 3대 신호로 장애를 조기 탐지하고 원인을 좁혀 대응 시간을 단축 문화 blameless postmortem 사람이 아닌 시스템·프로세스 구조를 개선하는 사후 분석으로 재발을 방지 두음: 수·토·관·블 — 수(sli·slo·버짓)·토(toil 감소)·관(observability)·블(blameless postmortem) sli·slo·error budget + toil 자동화 + blameless postmortem 3종 세트가 핵심!"}, {"id": "sli-slo", "cat": "sw", "sub": "sw-quality", "parent": "sre", "t": "SLI·SLO·SLA & 버짓", "s": "지표·목표·계약 / 에러 버짓", "stars": 3, "redStar": false, "full": "SLI · SLO · SLA와 에러 버짓 (Error Budget)", "catLabel": "SW공학·아키텍처", "st": "📌 복습 필요", "d": "2026-11-20", "def": "<p>SRE(Site Reliability Engineering)에서 서비스 신뢰성을 정량적으로 측정(<b>SLI<\/b>)·목표 설정(<b>SLO<\/b>)·대외 계약(<b>SLA<\/b>)하고, 허용 가능한 장애 한도인 <b>에러 버짓(Error Budget)<\/b>으로 개발 속도와 안정성의 균형을 맞추는 운영 체계<\/p>", "kw": "<ul class=\"kw\"><li><b>3대 지표 관계<\/b>:<ul class=\"kw\"><li><b>SLI (Indicator)<\/b>: 실제 측정된 정량 지표 (예: 요청 성공률 99.95%, p99 지연 180ms)<\/li><li><b>SLO (Objective)<\/b>: 내부적으로 달성하려는 목표 수준 (예: 월 가용성 99.9% 이상)<\/li><li><b>SLA (Agreement)<\/b>: 고객과 맺은 공식 계약·약속 (미달 시 보상/페널티 발생, 보통 SLO보다 완화된 기준)<\/li><\/ul><\/li><li><b>에러 버짓 (Error Budget)<\/b>:<ul class=\"kw\"><li>산식: <b>100% − SLO<\/b> (예: SLO 99.9% → 허용 장애 한도 0.1%, 월 약 43분)<\/li><li><b>버짓 잔여 시<\/b>: 신규 기능 배포·실험 가속 (비즈니스 속도 우선)<\/li><li><b>버짓 소진 시<\/b>: 신규 배포 동결(Freeze) 및 안정화·장애 원인 제거(Postmortem)에 집중<\/li><\/ul><\/li><\/ul>", "pp": "<div class=\"tblwrap\"><table class=\"cmp\"><colgroup><col style=\"width:24%\"><col style=\"width:28%\"><col style=\"width:48%\"><\/colgroup><thead><tr><th>관점(측면)<\/th><th>특징<\/th><th>설명<\/th><\/tr><\/thead><tbody><tr><td class=\"k\">측정·목표·계약<\/td><td>SLI → SLO → SLA<\/td><td>실제 측정 지표, 내부 목표, 대외 계약의 계층 관계와 완화된 기준 차이<\/td><\/tr><tr><td class=\"k\">에러 버짓<\/td><td>100% − SLO<\/td><td>허용 가능한 장애 한도를 수치화해 개발 속도와 안정성의 균형을 맞춤<\/td><\/tr><tr><td class=\"k\">의사결정<\/td><td>배포 가속 vs 동결<\/td><td>버짓 잔여 시 실험·배포를 가속하고 소진 시 동결 후 안정화에 집중<\/td><\/tr><tr><td class=\"k\">조직 운영<\/td><td>SRE·개발 합의<\/td><td>측정 구간·분모 정의와 보고 체계를 팀 간 합의로 정해 지표 신뢰성을 확보<\/td><\/tr><\/tbody><\/table><\/div>", "rv": "<div class=\"q\"><b>두음: 측·목·계<\/b> — 측(SLI)·목(SLO)·계(SLA) — 버짓 = 100% − SLO<\/div>\n<div class=\"q\"><b>SLI(측정) → SLO(내부 목표) → SLA(대외 계약)<\/b> 계층과 <b>Error Budget = 100% − SLO<\/b>(배포 가속 vs 동결 기준)를 꼭 함께 작성!<\/div>", "img": "itpe-diagrams/29-sli-slo-sla-error-budget.webp", "txt": null, "search": "sli · slo · sla와 에러 버짓 (error budget) sli·slo·sla & 버짓 지표·목표·계약 / 에러 버짓 sw공학·아키텍처 품질·테스트·devops ⭐⭐⭐ 기출빈출 기출 빈출 중요 sre(site reliability engineering)에서 서비스 신뢰성을 정량적으로 측정( sli )·목표 설정( slo )·대외 계약( sla )하고, 허용 가능한 장애 한도인 에러 버짓(error budget) 으로 개발 속도와 안정성의 균형을 맞추는 운영 체계 3대 지표 관계 : sli (indicator) : 실제 측정된 정량 지표 (예: 요청 성공률 99.95%, p99 지연 180ms) slo (objective) : 내부적으로 달성하려는 목표 수준 (예: 월 가용성 99.9% 이상) sla (agreement) : 고객과 맺은 공식 계약·약속 (미달 시 보상/페널티 발생, 보통 slo보다 완화된 기준) 에러 버짓 (error budget) : 산식: 100% − slo (예: slo 99.9% → 허용 장애 한도 0.1%, 월 약 43분) 버짓 잔여 시 : 신규 기능 배포·실험 가속 (비즈니스 속도 우선) 버짓 소진 시 : 신규 배포 동결(freeze) 및 안정화·장애 원인 제거(postmortem)에 집중 관점(측면) 특징 설명 측정·목표·계약 sli → slo → sla 실제 측정 지표, 내부 목표, 대외 계약의 계층 관계와 완화된 기준 차이 에러 버짓 100% − slo 허용 가능한 장애 한도를 수치화해 개발 속도와 안정성의 균형을 맞춤 의사결정 배포 가속 vs 동결 버짓 잔여 시 실험·배포를 가속하고 소진 시 동결 후 안정화에 집중 조직 운영 sre·개발 합의 측정 구간·분모 정의와 보고 체계를 팀 간 합의로 정해 지표 신뢰성을 확보 두음: 측·목·계 — 측(sli)·목(slo)·계(sla) — 버짓 = 100% − slo sli(측정) → slo(내부 목표) → sla(대외 계약) 계층과 error budget = 100% − slo (배포 가속 vs 동결 기준)를 꼭 함께 작성!"}, {"id": "observability", "cat": "sw", "sub": "sw-quality", "parent": "sre", "t": "Observability · OTel", "s": "메·로·트 / Known vs Unknown", "stars": 2, "redStar": false, "full": "관찰 가능성(Observability)과 OpenTelemetry", "catLabel": "SW공학·아키텍처", "st": "📌 복습 필요", "d": "2026-11-21", "def": "<p>시스템이 외부로 방출하는 텔레메트리 데이터를 바탕으로 <b>내부 상태와 미지의 장애 원인(Unknown Unknowns)까지 추론·진단<\/b>할 수 있는 능력이며, <b>OpenTelemetry(OTel)<\/b>는 이를 벤더 중립적으로 수집·전송하는 CNCF 표준 프레임워크<\/p>", "kw": "<ul class=\"kw\"><li><b>3대 핵심 텔레메트리 (메·로·트)<\/b>:<ul class=\"kw\"><li><b>Metrics<\/b>: 시계열 수치 지표 (CPU, 메모리, 응답지연, 에러율)<\/li><li><b>Logs<\/b>: 특정 시점의 이산적 이벤트·오류 상세 기록<\/li><li><b>Traces<\/b>: MSA 환경에서 분산 요청의 End-to-End 호출 경로·병목(Span) 추적<\/li><\/ul><\/li><li><b>OpenTelemetry (OTel)<\/b>: 벤더 종속(Lock-in)을 없애고 단일 SDK·Collector로 3대 데이터를 표준화해 Prometheus·Grafana·Jaeger 등으로 전달<\/li><\/ul>", "pp": "<p><b>1) 개념 비교 (모니터링 vs 관찰 가능성)<\/b><\/p>\n<div class=\"tblwrap\"><table class=\"cmp\"><colgroup><col style=\"width:24%\"><col style=\"width:28%\"><col style=\"width:48%\"><\/colgroup><thead><tr><th>구분<\/th><th>모니터링 (Monitoring)<\/th><th>관찰 가능성 (Observability)<\/th><\/tr><\/thead><tbody><tr><td class=\"k\">목적·대상<\/td><td>사전 정의된 임계치·알려진 장애(Known Unknowns) 탐지<\/td><td>사전에 예측 못 한 미지의 원인(Unknown Unknowns) 추론<\/td><\/tr><tr><td class=\"k\">데이터 방식<\/td><td>단일 지표·대시보드 중심 확인<\/td><td>Metrics·Logs·Traces 상호 연계(Correlation) 분석<\/td><\/tr><tr><td class=\"k\">장애 대응<\/td><td>'장애 발생 여부' 알림에 강점<\/td><td>'왜 어디서 느려졌는지' 근본 원인(RCA) 추적<\/td><\/tr><\/tbody><\/table><\/div>\n<p><b>2) 운영·구현 관점 구성표<\/b><\/p>\n<div class=\"tblwrap\"><table class=\"cmp\"><colgroup><col style=\"width:24%\"><col style=\"width:28%\"><col style=\"width:48%\"><\/colgroup><thead><tr><th>관점(측면)<\/th><th>특징<\/th><th>설명<\/th><\/tr><\/thead><tbody><tr><td class=\"k\">수집 표준 관점<\/td><td>OpenTelemetry (OTel)<\/td><td>언어별 통합 SDK·OTLP 프로토콜로 벤더 종속성 제거<\/td><\/tr><tr><td class=\"k\">데이터 연계 관점<\/td><td>Trace ID 상관관계<\/td><td>로그·메트릭·트레이스를 동일 Trace ID로 묶어 즉시 드릴다운<\/td><\/tr><tr><td class=\"k\">비용·성능 관점<\/td><td>샘플링 (Head / Tail)<\/td><td>전수 수집 부하를 줄이기 위해 정상 트래픽은 샘플링, 에러는 전수 보관<\/td><\/tr><tr><td class=\"k\">SRE 연계 관점<\/td><td>SLI·SLO 검증 기반<\/td><td>SRE의 SLI 측정·에러 버짓 소진 추적의 실질적 데이터 소스<\/td><\/tr><\/tbody><\/table><\/div>", "rv": "<div class=\"q\"><b>두음: 메·로·트 / 오·텔<\/b> — 메(Metrics)·로(Logs)·트(Traces) 3대 신호 + 오텔(OpenTelemetry 표준 수집)<\/div>\n<div class=\"q\"><b>Monitoring(Known) vs Observability(Unknown) + 메·로·트 + OTel<\/b> 세트!<\/div>", "img": "itpe-diagrams/46-observability.webp", "txt": null, "search": "관찰 가능성(observability)과 opentelemetry observability · otel 메·로·트 / known vs unknown sw공학·아키텍처 품질·테스트·devops ⭐⭐ 기출빈출 기출 빈출 중요 시스템이 외부로 방출하는 텔레메트리 데이터를 바탕으로 내부 상태와 미지의 장애 원인(unknown unknowns)까지 추론·진단 할 수 있는 능력이며, opentelemetry(otel) 는 이를 벤더 중립적으로 수집·전송하는 cncf 표준 프레임워크 3대 핵심 텔레메트리 (메·로·트) : metrics : 시계열 수치 지표 (cpu, 메모리, 응답지연, 에러율) logs : 특정 시점의 이산적 이벤트·오류 상세 기록 traces : msa 환경에서 분산 요청의 end-to-end 호출 경로·병목(span) 추적 opentelemetry (otel) : 벤더 종속(lock-in)을 없애고 단일 sdk·collector로 3대 데이터를 표준화해 prometheus·grafana·jaeger 등으로 전달 1) 개념 비교 (모니터링 vs 관찰 가능성) 구분 모니터링 (monitoring) 관찰 가능성 (observability) 목적·대상 사전 정의된 임계치·알려진 장애(known unknowns) 탐지 사전에 예측 못 한 미지의 원인(unknown unknowns) 추론 데이터 방식 단일 지표·대시보드 중심 확인 metrics·logs·traces 상호 연계(correlation) 분석 장애 대응 '장애 발생 여부' 알림에 강점 '왜 어디서 느려졌는지' 근본 원인(rca) 추적 2) 운영·구현 관점 구성표 관점(측면) 특징 설명 수집 표준 관점 opentelemetry (otel) 언어별 통합 sdk·otlp 프로토콜로 벤더 종속성 제거 데이터 연계 관점 trace id 상관관계 로그·메트릭·트레이스를 동일 trace id로 묶어 즉시 드릴다운 비용·성능 관점 샘플링 (head / tail) 전수 수집 부하를 줄이기 위해 정상 트래픽은 샘플링, 에러는 전수 보관 sre 연계 관점 sli·slo 검증 기반 sre의 sli 측정·에러 버짓 소진 추적의 실질적 데이터 소스 두음: 메·로·트 / 오·텔 — 메(metrics)·로(logs)·트(traces) 3대 신호 + 오텔(opentelemetry 표준 수집) monitoring(known) vs observability(unknown) + 메·로·트 + otel 세트!"}, {"id": "cncf", "cat": "sw", "sub": "sw-native", "parent": null, "t": "클라우드 네이티브 & CNCF", "s": "마·컨·데·시 / K8s·OTel·Istio", "stars": 3, "redStar": false, "full": "클라우드 네이티브 & CNCF", "catLabel": "SW공학·아키텍처", "st": "📌 복습 필요", "d": "2026-11-21", "def": "<p>퍼블릭·프라이빗·하이브리드 클라우드 환경에서 <b>확장성·탄력성·복원력<\/b>을 극대화하도록 <b>MSA·컨테이너·DevOps·CI/CD<\/b>를 결합해 애플리케이션을 구축·실행하는 아키텍처이며, <b>CNCF<\/b>는 이를 주도하는 리눅스 재단 산하 오픈소스 표준 재단<\/p>", "kw": "<ul class=\"kw\"><li><b>클라우드 네이티브 4대 핵심 요소 (마·컨·데·시)<\/b>:<ul class=\"kw\"><li><b>MSA<\/b>: 서비스 단위 독립 개발·배포 및 장애 격리 (Saga·Circuit Breaker)<\/li><li><b>Container &amp; Kubernetes<\/b>: 불변 인프라(Immutable Infrastructure)·선언적 API·자동 스케일링<\/li><li><b>DevOps<\/b>: 개발·운영 협업 문화 및 IaC(Infrastructure as Code)<\/li><li><b>CI/CD<\/b>: 빌드·테스트·무중단 배포(Blue-Green·Canary·GitOps) 자동화<\/li><\/ul><\/li><li><b>CNCF 프로젝트 성숙도 3단계<\/b>: <b>Sandbox<\/b>(초기 실험) → <b>Incubating<\/b>(검증·확산) → <b>Graduated<\/b>(실무 표준: K8s, Prometheus, OpenTelemetry, Istio, Envoy, ArgoCD)<\/li><\/ul>", "pp": "<div class=\"t ) 방지 및 12-factor app·cncf landscape 표준 준수 두음: 마·컨·데·시 / 샌·인·그 — 마(msa)·컨(container)·데(devops)·시(ci/cd) / 샌(sandbox)·인(incubating)·그(graduated) 클라우드 네이티브 4대 요소(마·컨·데·시) + cncf graduated 대표 프로젝트(k8s·otel·istio) !"}, {"id": "atam", "cat": "sw", "sub": "sw-arch", "parent": null, "t": "ATAM & SAAM", "s": "아키텍처 평가 · 트레이드오프점", "stars": 3, "redStar": false, "full": "ATAM & SAAM (아키텍처 평가)", "catLabel": "SW공학·아키텍처", "st": "📌 복습 필요", "d": "2026-11-20", "def": "<p>소프트웨어 구현 전에 <b>시나리오 기반<\/b>으로 아키텍처의 품질속성 충족 여부와 위험 요소를 사전 검증하는 평가 방법론 (CMU SEI)<\/p>", "kw": "<ul class=\"kw\"><li><b>SAAM vs ATAM<\/b>:<ul class=\"kw\"><li><b>SAAM<\/b>: 초기 모델, <b>단일 품질속성(주로 변경 가능성)<\/b> 중심 평가, 품질 간 상충(Trade-off) 분석 미흡<\/li><li><b>ATAM<\/b>: SAAM 확장, <b>다중 품질속성<\/b> 동시 평가 및 품질 간 <b>트레이드오프 분석<\/b> 중점<\/li><\/ul><\/li><li><b>ATAM 핵심 산출물 4종<\/b>:<ul class=\"kw\"><li><b>Utility Tree (품질속성 유틸리티 트리)<\/b>: 품질속성을 시나리오로 구체화하고 중요도·난이도 우선순위화<\/li><li><b>Sensitivity Point (민감도점)<\/b>: 아키텍처 결정이 특정 품질속성에 큰 영향을 미치는 지점<\/li><li><b>Trade-off Point (트레이드오프점)<\/b>: 하나의 결정으로 두 개 이상 품질속성이 상충하는 지점<\/li><li><b>Risk / Non-Risk<\/b>: 위험 요소 및 비위험 요소 도출<\/li><\/ul><\/li><\/ul>", "pp": "<div class=\"tblwrap\"><table class=\"cmp\"><colgroup><col style=\"width:24%\"><col style=\"width:28%\"><col style=\"width:48%\"><\/colgroup><thead><tr><th>관점(측면)<\/th><th>특징<\/th><th>설명<\/th><\/tr><\/thead><tbody><tr><td class=\"k\">평가 범위<\/td><td>단일 vs 다중 품질<\/td><td>SAAM은 변경 가능성 등 단일 품질 중심, ATAM은 다중 품질과 상충 관계까지 평가<\/td><\/tr><tr><td class=\"k\">산출물<\/td><td>유틸리티 트리<\/td><td>품질속성을 시나리오로 구체화하고 중요도·난이도로 우선순위를 매김<\/td><\/tr><tr><td class=\"k\">분석 포인트<\/td><td>민감도·트레이드오프점<\/td><td>결정이 특정 품질에 미치는 지점과 두 품질이 상충하는 지점을 식별<\/td><\/tr><tr><td class=\"k\">위험 관리<\/td><td>Risk / Non-Risk<\/td><td>위험 요소를 도출해 구현 전에 아키텍처 개선과 의사결정 근거를 제공<\/td><\/tr><\/tbody><\/table><\/div>", "rv": "<div class=\"q\"><b>두음: 아·시·민·트<\/b> — 아(다중 품질·트레이드오프)·시(유틸리티 트리=시나리오)·민(민감도점)·트(트레이드오프점)<\/div>\n<div class=\"q\"><b>SAAM(단일 품질) vs ATAM(다중·트레이드오프)<\/b> + <b>유틸리티 트리·민감도점·트레이드오프점<\/b>!<\/div>", "img": "itpe-diagrams/36-atam-saam.webp", "txt": null, "search": "atam & saam (아키텍처 평가) atam & saam 아키텍처 평가 · 트레이드오프점 sw공학·아키텍처 아키텍처·설계 패턴 ⭐⭐⭐ 기출빈출 기출 빈출 중요 소프트웨어 구현 전에 시나리오 기반 으로 아키텍처의 품질속성 충족 여부와 위험 요소를 사전 검증하는 평가 방법론 (cmu sei) saam vs atam : saam : 초기 모델, 단일 품질속성(주로 변경 가능성) 중심 평가, 품질 간 상충(trade-off) 분석 미흡 atam : saam 확장, 다중 품질속성 동시 평가 및 품질 간 트레이드오프 분석 중점 atam 핵심 산출물 4종 : utility tree (품질속성 유틸리티 트리) : 품질속성을 시나리오로 구체화하고 중요도·난이도 우선순위화 sensitivity point (민감도점) : 아키텍처 결정이 특정 품질속성에 큰 영향을 미치는 지점 trade-off point (트레이드오프점) : 하나의 결정으로 두 개 이상 품질속성이 상충하는 지점 risk / non-risk : 위험 요소 및 비위험 요소 도출 관점(측면) 특징 설명 평가 범위 단일 vs 다중 품질 saam은 변경 가능성 등 단일 품질 중심, atam은 다중 품질과 상충 관계까지 평가 산출물 유틸리티 트리 품질속성을 시나리오로 구체화하고 중요도·난이도로 우선순위를 매김 분석 포인트 민감도·트레이드오프점 결정이 특정 품질에 미치는 지점과 두 품질이 상충하는 지점을 식별 위험 관리 risk / non-risk 위험 요소를 도출해 구현 전에 아키텍처 개선과 의사결정 근거를 제공 두음: 아·시·민·트 — 아(다중 품질·트레이드오프)·시(유틸리티 트리=시나리오)·민(민감도점)·트(트레이드오프점) saam(단일 품질) vs atam(다중·트레이드오프) + 유틸리티 트리·민감도점·트레이드오프점 !"}, {"id": "v-model", "cat": "sw", "sub": "sw-quality", "parent": null, "t": "V-모델 · 테스트 4단계", "s": "단·통·시·인 / Stub·Driver", "stars": 3, "redStar": false, "full": "V-모델과 소프트웨어 테스트 4단계", "catLabel": "SW공학·아키텍처", "st": "📌 복습 필요", "d": "2026-11-21", "def": "<p>폭포수 모델의 각 개발 단계(좌측)에 대응하는 테스트 단계(우측)를 <b>1:1 V자형으로 매핑<\/b>하여 조기 검증(Verification)과 확인(Validation)을 수행하는 개발·테스트 모델<\/p>", "kw": "<ul class=\"kw\"><li><b>개발 ↔ 테스트 1:1 매핑 (단·통·시·인)<\/b>:<ul class=\"kw\"><li><b>구현(Coding) ↔ 단위 테스트(Unit)<\/b>: 개별 모듈·함수 검증 (화이트박스·xUnit)<\/li><li><b>상세 설계 ↔ 통합 테스트(Integration)<\/b>: 모듈 간 인터페이스 검증 (빅뱅·하향식 Stub·상향식 Driver)<\/li><li><b>시스템 설계(아키텍처) ↔ 시스템 테스트(System)<\/b>: 기능·비기능(성능·보안·부하) 전체 검증<\/li><li><b>요구사항 분석 ↔ 인수 테스트(Acceptance)<\/b>: 고객 요구 충족 확인 (알파·베타 테스트)<\/li><\/ul><\/li><\/ul>", "pp": "<div class=\"tblwrap\"><table class=\"cmp\"><colgroup><col style=\"width:24%\"><col style=\"width:28%\"><col style=\"width:48%\"><\/colgroup><thead><tr><th>관점(측면)<\/th><th>특징<\/th><th>설명<\/th><\/tr><\/thead><tbody><tr><td class=\"k\">개발·테스트 매핑<\/td><td>좌(개발) ↔ 우(테스트)<\/td><td>요구↔인수, 아키텍처↔시스템, 상세설계↔통합, 코딩↔단위로 추적성 확보<\/td><\/tr><tr><td class=\"k\">테스트 기법 관점<\/td><td>화이트박스 vs 블랙박스<\/td><td>단위는 내부 로직(화이트박스), 시스템·인수는 명세 기반(블랙박스) 중심<\/td><\/tr><tr><td class=\"k\">통합 전략 관점<\/td><td>하향식(Stub) vs 상향식(Driver)<\/td><td>상위 모듈 우선 시 가짜 하위(Stub), 하위 우선 시 호출기(Driver) 사용<\/td><\/tr><tr><td class=\"k\">품질·시점 관점<\/td><td>Verification vs Validation<\/td><td>올바르게 만들었는가(개발·정적) vs 올바른 제품을 만들었는가(인수·동적)<\/td><\/tr><\/tbody><\/table><\/div>", "rv": "<div class=\"q\"><b>두음: 단·통·시·인 / 스·드<\/b> — 단(단위)·통(통합)·시(시스템)·인(인수) / 스(하향식 Stub)·드(상향식 Driver)<\/div>\n<div class=\"q\"><b>V자 좌우 1:1 매핑 + Stub/Driver + Verification vs Validation<\/b> 필수!<\/div>", "img": "itpe-diagrams/45-v-model.webp", "txt": null, "search": "v-모델과 소프트웨어 테스트 4단계 v-모델 · 테스트 4단계 단·통·시·인 / stub·driver sw공학·아키텍처 품질·테스트·devops ⭐⭐⭐ 기출빈출 기출 빈출 중요 폭포수 모델의 각 개발 단계(좌측)에 대응하는 테스트 단계(우측)를 1:1 v자형으로 매핑 하여 조기 검증(verification)과 확인(validation)을 수행하는 개발·테스트 모델 개발 ↔ 테스트 1:1 매핑 (단·통·시·인) : 구현(coding) ↔ 단위 테스트(unit) : 개별 모듈·함수 검증 (화이트박스·xunit) 상세 설계 ↔ 통합 테스트(integration) : 모듈 간 인터페이스 검증 (빅뱅·하향식 stub·상향식 driver) 시스템 설계(아키텍처) ↔ 시스템 테스트(system) : 기능·비기능(성능·보안·부하) 전체 검증 요구사항 분석 ↔ 인수 테스트(acceptance) : 고객 요구 충족 확인 (알파·베타 테스트) 관점(측면) 특징 설명 개발·테스트 매핑 좌(개발) ↔ 우(테스트) 요구↔인수, 아키텍처↔시스템, 상세설계↔통합, 코딩↔단위로 추적성 확보 테스트 기법 관점 화이트박스 vs 블랙박스 단위는 내부 로직(화이트박스), 시스템·인수는 명세 기반(블랙박스) 중심 통합 전략 관점 하향식(stub) vs 상향식(driver) 상위 모듈 우선 시 가짜 하위(stub), 하위 우선 시 호출기(driver) 사용 품질·시점 관점 verification vs validation 올바르게 만들었는가(개발·정적) vs 올바른 제품을 만들었는가(인수·동적) 두음: 단·통·시·인 / 스·드 — 단(단위)·통(통합)·시(시스템)·인(인수) / 스(하향식 stub)·드(상향식 driver) v자 좌우 1:1 매핑 + stub/driver + verification vs validation 필수!"}, {"id": "fuzz-testing", "cat": "sw", "sub": "sw-quality", "parent": null, "t": "퍼징 테스트", "s": "Black·Grey·White-box", "stars": 2, "redStar": false, "full": "퍼징 테스트 (Fuzzing)", "catLabel": "SW공학·아키텍처", "st": "📌 복습 필요", "d": "2026-11-25", "def": "<p><b>퍼징(Fuzzing)<\/b>은 비정상·무작위 입력을 대량으로 주입해 <b>크래시·예외·메모리 오류<\/b> 등 취약점을 자동으로 발견하는 <b>동적 테스트<\/b> 기법. 입력을 어떻게 만들고(변이·생성) 어떤 피드백을 쓰는가(블랙박스·커버리지 기반·화이트박스)에 따라 나뉘며, <b>AFL++·libFuzzer·OSS-Fuzz<\/b>가 대표 도구로 쓰이는 <b>동적 취약점 탐색 기법<\/b>.<\/p>", "kw": "<ul class=\"kw\"><li><b>Black-box Fuzzing<\/b>: 입력 형식만 알고 무작위·변형 입력 주입 — 구현 정보 없이 적용, 도달률 낮음<\/li><li><b>Grey-box (Coverage-guided)<\/b>: <b>커버리지 피드백<\/b>으로 새로운 경로를 만든 입력을 코퍼스에 축적 — AFL++·libFuzzer·Honggfuzz<\/li><li><b>White-box Fuzzing<\/b>: 기호 실행(Symbolic)·Concolic 실행으로 경로 조건을 풀어 입력 생성 — KLEE·Angr·SAGE<\/li><li><b>Mutation vs Generation<\/b>: 시드 변이(bit flip·havoc·splice) vs 문법·모델 기반 생성(Grammar·Protobuf) — 구조가 엄격한 입력은 생성 방식<\/li><li><b>Sanitizer<\/b>: ASan·UBSan·MSan으로 메모리 오류·정의되지 않은 동작을 즉시 탐지(탐지 감도 향상)<\/li><li><b>Corpus·Seed·Dictionary<\/b>: 좋은 시드·토큰 사전이 커버리지 확장 속도를 결정<\/li><li><b>지속 퍼징<\/b>: <b>OSS-Fuzz<\/b>·ClusterFuzz — 오픈소스 상시 퍼징, CI 통합으로 회귀 취약점 조기 발견<\/li><li><b>지표<\/b>: 커버리지·초당 실행 수(exec/s)·고유 크래시 수·발견 소요시간(TTF)<\/li><\/ul>", "pp": "<h4>1) Black-box vs Grey-box vs White-box (비교모듈: 목·대·기·산·검·장·단)<\/h4>\n<div class=\"tblwrap\"><table class=\"cmp\"><thead><tr><th>구분<\/th><th>Black-box<\/th><th>Grey-box (Coverage-guided)<\/th><th>White-box<\/th><\/tr><\/thead><tbody><tr><td class=\"k\">적용목적<\/td><td>형식·프로토콜 입력 오류 탐색<\/td><td>코드 경로 도달률 극대화<\/td><td>특정 경로 조건을 만족하는 입력 생성<\/td><\/tr><tr><td class=\"k\">대상·범위<\/td><td>공개 인터페이스·파일 형식<\/td><td>바이너리·소스(계측 가능 대상)<\/td><td>소스·바이너리 + 제약식 해석<\/td><\/tr><tr><td class=\"k\">핵심기법<\/td><td>무작위·변이(휴리스틱 없음)<\/td><td>커버리지 계측 + 변이 + 코퍼스 진화<\/td><td>기호 실행·Concolic·SMT 해법<\/td><\/tr><tr><td class=\"k\">주요산출물<\/td><td>크래시·예외 로그<\/td><td>크래시 + 커버리지 리포트·코퍼스<\/td><td>경로별 입력·제약식·크래시<\/td><\/tr><tr><td class=\"k\">검증·품질<\/td><td>도달 범위 좁아 심층 결함 미탐<\/td><td>실무 표준 — 깊은 경로 결함 탐지<\/td><td>경로 조건 정밀, 상태 폭발로 확장 한계<\/td><\/tr><tr><td class=\"k\">장점<\/td><td>구축 쉬움·블랙박스 대상 적용<\/td><td>비용 대비 탐지 효율 최고<\/td><td>논리적으로 도달 어려운 경로 공략<\/td><\/tr><tr><td class=\"k\">단점<\/td><td>커버리지 낮음·실행 수 낭비<\/td><td>계측 오버헤드·시드 품질 의존<\/td><td>모델링 난이도·경로 폭발(Path Explosion)<\/td><\/tr><\/tbody><\/table><\/div>\n<h4>2) 변이 vs 생성 · 대표 도구<\/h4>\n<div class=\"tblwrap\"><table class=\"cmp\"><colgroup><col style=\"width:24%\"><col style=\"width:28%\"><col style=\"width:48%\"><\/colgroup><thead><tr><th>구분<\/th><th>Mutation-based<\/th><th>Generation-based<\/th><\/tr><\/thead><tbody><tr><td class=\"k\">입력 생성<\/td><td>시드 파일을 변이(bit flip·havoc)<\/td><td>문법·스키마·모델로 새 입력 생성<\/td><\/tr><tr><td class=\"k\">장점<\/td><td>구축 빠름·형식 지식 불필요<\/td><td>구조적으로 유효한 입력을 깊게 탐색<\/td><\/tr><tr><td class=\"k\">단점<\/td><td>구조 위반 입력에 실행 낭비<\/td><td>문법·모델 작성 비용<\/td><\/tr><tr><td class=\"k\">도구<\/td><td>AFL++·libFuzzer·Honggfuzz<\/td><td>Grammar Fuzzer·Protobuf·RESTler<\/td><\/tr><\/tbody><\/table><\/div>\n<h4>3) CI·운영 고려사항<\/h4>\n<div class=\"tblwrap\"><table class=\"cmp\"><colgroup><col style=\"width:24%\"><col style=\"width:28%\"><col style=\"width:48%\"><\/colgroup><thead><tr><th>구분<\/th><th>키워드<\/th><th>설명<\/th><\/tr><\/thead><tbody><tr><td class=\"k\">목표<\/td><td>오라클 정의<\/td><td>크래시뿐 아니라 계약 위반(Assert·Invariant)도 오라클로 설정<\/td><\/tr><tr><td class=\"k\">자동화<\/td><td>CI 상시 퍼징<\/td><td>PR마다 짧게, 야간에 길게 — 발견 즉시 이슈 자동 생성<\/td><\/tr><tr><td class=\"k\">회귀<\/td><td>코퍼스 고정<\/td><td>발견 입력을 회귀 테스트로 승격해 재발 방지<\/td><\/tr><tr><td class=\"k\">비용<\/td><td>자원 격리<\/td><td>컨테이너·샌드박스에서 실행, 타임아웃·메모리 상한 설정<\/td><\/tr><tr><td class=\"k\">한계<\/td><td>로직 결함<\/td><td>기능 오류·권한 결함은 오라클이 없어 탐지 어려움 → 다른 테스트와 병행<\/td><\/tr><\/tbody><\/table><\/div>", "rv": "<div class=\"q\"><b>두음: 블·그·화 — Black·Grey·White / 변·생 — Mutation·Generation / 에프·엘·오 — AFL++·libFuzzer·OSS-Fuzz<\/b><\/div>\n<div class=\"q\"><b>\"커버리지를 피드백으로 쓰는 Grey-box가 실무 표준 — 시드와 사전이 성능을 가른다\"<\/b><\/div>", "img": "itpe-diagrams/140-fuzz-testing.webp", "txt": null, "search": "퍼징 테스트 (fuzzing) 퍼징 테스트 black·grey·white-box sw공학·아키텍처 품질·테스트·devops ⭐⭐ 기출빈출 기출 빈출 중요 퍼징(fuzzing) 은 비정상·무작위 입력을 대량으로 주입해 크래시·예외·메모리 오류 등 취약점을 자동으로 발견하는 동적 테스트 기법. 입력을 어떻게 만들고(변이·생성) 어떤 피드백을 쓰는가(블랙박스·커버리지 기반·화이트박스)에 따라 나뉘며, afl++·libfuzzer·oss-fuzz 가 대표 도구로 쓰이는 동적 취약점 탐색 기법 . black-box fuzzing : 입력 형식만 알고 무작위·변형 입력 주입 — 구현 정보 없이 적용, 도달률 낮음 grey-box (coverage-guided) : 커버리지 피드백 으로 새로운 경로를 만든 입력을 코퍼스에 축적 — afl++·libfuzzer·honggfuzz white-box fuzzing : 기호 실행(symbolic)·concolic 실행으로 경로 조건을 풀어 입력 생성 — klee·angr·sage mutation vs generation : 시드 변이(bit flip·havoc·splice) vs 문법·모델 기반 생성(grammar·protobuf) — 구조가 엄격한 입력은 생성 방식 sanitizer : asan·ubsan·msan으로 메모리 오류·정의되지 않은 동작을 즉시 탐지(탐지 감도 향상) corpus·seed·dictionary : 좋은 시드·토큰 사전이 커버리지 확장 속도를 결정 지속 퍼징 : oss-fuzz ·clusterfuzz — 오픈소스 상시 퍼징, ci 통합으로 회귀 취약점 조기 발견 지표 : 커버리지·초당 실행 수(exec/s)·고유 크래시 수·발견 소요시간(ttf) 1) black-box vs grey-box vs white-box (비교모듈: 목·대·기·산·검·장·단) 구분 black-box grey-box (coverage-guided) white-box 적용목적 형식·프로토콜 입력 오류 탐색 코드 경로 도달률 극대화 특정 경로 조건을 만족하는 입력 생성 대상·범위 공개 인터페이스·파일 형식 바이너리·소스(계측 가능 대상) 소스·바이너리 + 제약식 해석 핵심기법 무작위·변이(휴리스틱 없음) 커버리지 계측 + 변이 + 코퍼스 진화 기호 실행·concolic·smt 해법 주요산출물 크래시·예외 로그 크래시 + 커버리지 리포트·코퍼스 경로별 입력·제약식·크래시 검증·품질 도달 범위 좁아 심층 결함 미탐 실무 표준 — 깊은 경로 결함 탐지 경로 조건 정밀, 상태 폭발로 확장 한계 장점 구축 쉬움·블랙박스 대상 적용 비용 대비 탐지 효율 최고 논리적으로 도달 어려운 경로 공략 단점 커버리지 낮음·실행 수 낭비 계측 오버헤드·시드 품질 의존 모델링 난이도·경로 폭발(path explosion) 2) 변이 vs 생성 · 대표 도구 구분 mutation-based generation-based 입력 생성 시드 파일을 변이(bit flip·havoc) 문법·스키마·모델로 새 입력 생성 장점 구축 빠름·형식 지식 불필요 구조적으로 유효한 입력을 깊게 탐색 단점 구조 위반 입력에 실행 낭비 문법·모델 작성 비용 도구 afl++·libfuzzer·honggfuzz grammar fuzzer·protobuf·restler 3) ci·운영 고려사항 구분 키워드 설명 목표 오라클 정의 크래시뿐 아니라 계약 위반(assert·invariant)도 오라클로 설정 자동화 ci 상시 퍼징 pr마다 짧게, 야간에 길게 — 발견 즉시 이슈 자동 생성 회귀 코퍼스 고정 발견 입력을 회귀 테스트로 승격해 재발 방지 비용 자원 격리 컨테이너·샌드박스에서 실행, 타임아웃·메모리 상한 설정 한계 로직 결함 기능 오류·권한 결함은 오라클이 없어 탐지 어려움 → 다른 테스트와 병행 두음: 블·그·화 — black·grey·white / 변·생 — mutation·generation / 에프·엘·오 — afl++·libfuzzer·oss-fuzz \"커버리지를 피드백으로 쓰는 grey-box가 실무 표준 — 시드와 사전이 성능을 가른다\""}, {"id": "sdd", "cat": "sw", "sub": "sw-quality", "parent": null, "t": "SDD (명세 주도 개발)", "s": "spec→plan→tasks→converge", "stars": 1, "redStar": false, "full": "SDD (Spec-Driven Development · 명세 주도 개발)", "catLabel": "SW공학·아키텍처", "st": "📌 복습 필요", "d": "2026-11-25", "def": "<p><b>SDD(Spec-Driven Development, 명세 주도 개발)<\/b>는 <b>명세(Specification)를 1차 산출물<\/b>로 삼아 계획·작업·코드를 <b>명세에서 파생<\/b>시키는 개발 방법론이다. \"코드가 진실\"이던 관계를 뒤집어(<b>Power Inversion<\/b>) 코드가 명세를 따르게 하며, AI 코딩 에이전트가 <b>실행 가능한 수준의 명세<\/b>를 읽고 구현하도록 만드는 <b>명세 주도 개발 방법론<\/b>(대표 구현: GitHub <b>Spec Kit<\/b>).<\/p>", "kw": "<ul class=\"kw\"><li><b>Power Inversion<\/b>: 명세가 코드를 생성 — 코드는 명세의 한 구현(언어·프레임워크별 표현)<\/li><li><b>Spec Kit 워크플로<\/b>: constitution(프로젝트 원칙) → <b>specify<\/b> → clarify → <b>plan<\/b> → checklist → <b>tasks<\/b> → analyze → <b>implement<\/b> → <b>converge<\/b><\/li><li><b>산출물<\/b>: <b>spec.md<\/b>(무엇을·왜), <b>plan.md<\/b>(기술 스택·설계), <b>tasks.md<\/b>(의존성 순 작업 목록)<\/li><li><b>품질 게이트<\/b>: clarify(모호성 해소)·checklist(요구 품질 검토)·analyze(정합성)·converge(명세 대비 완결성)<\/li><li><b>기존 SDD와 구분<\/b>: IEEE 1016 <b>Software Design Description<\/b>(설계 문서)과 동명이의 — SDD는 AI가 실행하는 명세<\/li><li><b>TDD·BDD와 관계<\/b>: TDD는 테스트가 명세(Red-Green-Refactor), BDD는 행위 시나리오(Given-When-Then), SDD는 자연어 명세가 출발점이고 테스트·코드는 파생<\/li><li><b>도구<\/b>: GitHub Spec Kit(specify-cli), Claude Code·Copilot·Gemini 등 에이전트 스킬로 실행<\/li><li><b>리스크<\/b>: 단계 오버헤드, 명세-코드 <b>드리프트<\/b>, converge는 코드 리뷰·테스트를 대체하지 못함<\/li><\/ul>", "pp": "<h4>1) SDD vs TDD vs BDD (비교모듈: 목·대·기·산·검·장·단)<\/h4>\n<div class=\"tblwrap\"><table class=\"cmp\"><thead><tr><th>구분<\/th><th>SDD (명세 주도)<\/th><th>TDD (테스트 주도)<\/th><th>BDD (행위 주도)<\/th><\/tr><\/thead><tbody><tr><td class=\"k\">적용목적<\/td><td>AI가 구현할 실행 명세 확보<\/td><td>설계 품질·회귀 안전망<\/td><td>이해관계자 간 행위 합의<\/td><\/tr><tr><td class=\"k\">대상·범위<\/td><td>요구→계획→작업→구현 전 단계<\/td><td>단위 테스트·리팩토링<\/td><td>인수 조건·사용자 시나리오<\/td><\/tr><tr><td class=\"k\">핵심기법<\/td><td>specify·clarify·plan·tasks·converge<\/td><td>Red-Green-Refactor<\/td><td>Given-When-Then<\/td><\/tr><tr><td class=\"k\">주요산출물<\/td><td>spec.md·plan.md·tasks.md<\/td><td>테스트 코드·리팩토링 결과<\/td><td>feature 파일·시나리오<\/td><\/tr><tr><td class=\"k\">검증·품질<\/td><td>analyze·converge 정합성(코드 품질은 별도)<\/td><td>커버리지·회귀 통과<\/td><td>인수 테스트 통과<\/td><\/tr><tr><td class=\"k\">장점<\/td><td>AI 협업 일관성·재현성·문서화<\/td><td>설계 개선·결함 조기 발견<\/td><td>비개발자 소통·요구 명확화<\/td><\/tr><tr><td class=\"k\">단점<\/td><td>단계 오버헤드·명세 드리프트<\/td><td>테스트 작성 비용·설계 왜곡 위험<\/td><td>시나리오 관리 부담·실행 비용<\/td><\/tr><\/tbody><\/table><\/div>\n<h4>2) Spec Kit 단계와 산출물<\/h4>\n<div class=\"tblwrap\"><table class=\"cmp\"><colgroup><col style=\"width:24%\"><col style=\"width:28%\"><col style=\"width:48%\"><\/colgroup><thead><tr><th>단계<\/th><th>스킬<\/th><th>산출물·역할<\/th><\/tr><\/thead><tbody><tr><td class=\"k\">헌법<\/td><td>/speckit-constitution<\/td><td>프로젝트 원칙(품질·테스트·유지보수) — 이후 모든 단계의 판단 기준<\/td><\/tr><tr><td class=\"k\">명세<\/td><td>/speckit-specify<\/td><td>spec.md — 무엇을·왜(기술 스택은 배제)<\/td><\/tr><tr><td class=\"k\">명료화<\/td><td>/speckit-clarify<\/td><td>모호점 질문·답을 spec에 반영<\/td><\/tr><tr><td class=\"k\">계획<\/td><td>/speckit-plan<\/td><td>plan.md — 아키텍처·기술 스택·설계 결정<\/td><\/tr><tr><td class=\"k\">작업<\/td><td>/speckit-tasks<\/td><td>tasks.md — 의존성 순 실행 목록<\/td><\/tr><tr><td class=\"k\">구현<\/td><td>/speckit-implement<\/td><td>tasks 순 구현, 체크리스트 미충족 시 확인<\/td><\/tr><tr><td class=\"k\">수렴<\/td><td>/speckit-converge<\/td><td>명세 대비 갭 점검, 필요 시 tasks 추가 후 재구현<\/td><\/tr><\/tbody><\/table><\/div>\n<h4>3) 도입 고려사항<\/h4>\n<div class=\"tblwrap\"><table class=\"cmp\"><colgroup><col style=\"width:24%\"><col style=\"width:28%\"><col style=\"width:48%\"><\/colgroup><thead><tr><th>구분<\/th><th>키워드<\/th><th>설명<\/th><\/tr><\/thead><tbody><tr><td class=\"k\">규모<\/td><td>적용 판단<\/td><td>신규·중대 변경은 전체 경로, 소규모 수정은 축약 경로<\/td><\/tr><tr><td class=\"k\">품질<\/td><td>게이트 운영<\/td><td>clarify·analyze를 생략하지 않아야 명세가 실행 가능 수준 유지<\/td><\/tr><tr><td class=\"k\">드리프트<\/td><td>명세 동기화<\/td><td>코드 변경 시 명세를 함께 갱신, PR에서 정합성 확인<\/td><\/tr><tr><td class=\"k\">검증<\/td><td>테스트 병행<\/td><td>converge는 \"명세와 맞는가\"만 확인 — 단위·통합 테스트는 별도<\/td><\/tr><tr><td class=\"k\">문화<\/td><td>리뷰 대상 전환<\/td><td>코드 리뷰 + <b>명세 리뷰<\/b>를 함께 운영<\/td><\/tr><\/tbody><\/table><\/div>", "rv": "<div class=\"q\"><b>두음: 헌·명·계·작·구·수 — 헌법·명세·계획·작업·구현·수렴 / 스·플·태 — spec·plan·tasks<\/b><\/div>\n<div class=\"q\"><b>\"코드가 아니라 명세가 진실 — AI 시대의 SDD는 실행 가능한 명세로 구현을 파생시킨다\"<\/b><\/div>", "img": "itpe-diagrams/141-sdd.webp", "txt": null, "search": "sdd (spec-driven development · 명세 주도 개발) sdd (명세 주도 개발) spec→plan→tasks→converge sw공학·아키텍처 품질·테스트·devops ⭐ 기출빈출 기출 빈출 중요 sdd(spec-driven development, 명세 주도 개발) 는 명세(specification)를 1차 산출물 로 삼아 계획·작업·코드를 명세에서 파생 시키는 개발 방법론이다. \"코드가 진실\"이던 관계를 뒤집어( power inversion ) 코드가 명세를 따르게 하며, ai 코딩 에이전트가 실행 가능한 수준의 명세 를 읽고 구현하도록 만드는 명세 주도 개발 방법론 (대표 구현: github spec kit ). power inversion : 명세가 코드를 생성 — 코드는 명세의 한 구현(언어·프레임워크별 표현) spec kit 워크플로 : constitution(프로젝트 원칙) → specify → clarify → plan → checklist → tasks → analyze → implement → converge 산출물 : spec.md (무엇을·왜), plan.md (기술 스택·설계), tasks.md (의존성 순 작업 목록) 품질 게이트 : clarify(모호성 해소)·checklist(요구 품질 검토)·analyze(정합성)·converge(명세 대비 완결성) 기존 sdd와 구분 : ieee 1016 software design description (설계 문서)과 동명이의 — sdd는 ai가 실행하는 명세 tdd·bdd와 관계 : tdd는 테스트가 명세(red-green-refactor), bdd는 행위 시나리오(given-when-then), sdd는 자연어 명세가 출발점이고 테스트·코드는 파생 도구 : github spec kit(specify-cli), claude code·copilot·gemini 등 에이전트 스킬로 실행 리스크 : 단계 오버헤드, 명세-코드 드리프트 , converge는 코드 리뷰·테스트를 대체하지 못함 1) sdd vs tdd vs bdd (비교모듈: 목·대·기·산·검·장·단) 구분 sdd (명세 주도) tdd (테스트 주도) bdd (행위 주도) 적용목적 ai가 구현할 실행 명세 확보 설계 품질·회귀 안전망 이해관계자 간 행위 합의 대상·범위 요구→계획→작업→구현 전 단계 단위 테스트·리팩토링 인수 조건·사용자 시나리오 핵심기법 specify·clarify·plan·tasks·converge red-green-refactor given-when-then 주요산출물 spec.md·plan.md·tasks.md 테스트 코드·리팩토링 결과 feature 파일·시나리오 검증·품질 analyze·converge 정합성(코드 품질은 별도) 커버리지·회귀 통과 인수 테스트 통과 장점 ai 협업 일관성·재현성·문서화 설계 개선·결함 조기 발견 비개발자 소통·요구 명확화 단점 단계 오버헤드·명세 드리프트 테스트 작성 비용·설계 왜곡 위험 시나리오 관리 부담·실행 비용 2) spec kit 단계와 산출물 단계 스킬 산출물·역할 헌법 /speckit-constitution 프로젝트 원칙(품질·테스트·유지보수) — 이후 모든 단계의 판단 기준 명세 /speckit-specify spec.md — 무엇을·왜(기술 스택은 배제) 명료화 /speckit-clarify 모호점 질문·답을 spec에 반영 계획 /speckit-plan plan.md — 아키텍처·기술 스택·설계 결정 작업 /speckit-tasks tasks.md — 의존성 순 실행 목록 구현 /speckit-implement tasks 순 구현, 체크리스트 미충족 시 확인 수렴 /speckit-converge 명세 대비 갭 점검, 필요 시 tasks 추가 후 재구현 3) 도입 고려사항 구분 키워드 설명 규모 적용 판단 신규·중대 변경은 전체 경로, 소규모 수정은 축약 경로 품질 게이트 운영 clarify·analyze를 생략하지 않아야 명세가 실행 가능 수준 유지 드리프트 명세 동기화 코드 변경 시 명세를 함께 갱신, pr에서 정합성 확인 검증 테스트 병행 converge는 \"명세와 맞는가\"만 확인 — 단위·통합 테스트는 별도 문화 리뷰 대상 전환 코드 리뷰 + 명세 리뷰 를 함께 운영 두음: 헌·명·계·작·구·수 — 헌법·명세·계획·작업·구현·수렴 / 스·플·태 — spec·plan·tasks \"코드가 아니라 명세가 진실 — ai 시대의 sdd는 실행 가능한 명세로 구현을 파생시킨다\""}, {"id": "solid", "cat": "sw", "sub": "sw-arch", "parent": null, "t": "객체지향 5대 원칙(SOLID)", "s": "단·개·리·인·의 / 응집↑·결합↓", "stars": 3, "redStar": false, "full": "객체지향 설계 5대 원칙 (SOLID)", "catLabel": "SW공학·아키텍처", "st": "📌 복습 필요", "d": "2026-11-21", "def": "<p>소프트웨어의 변경에 유연하게 대응하고 <b>높은 응집도(High Cohesion)와 낮은 결합도(Low Coupling)<\/b>를 달성하기 위한 로버트 마틴(Robert C. Martin)의 객체지향 설계 5대 원칙<\/p>", "kw": "<ul class=\"kw\"><li><b>SOLID 5대 원칙 (단·개·리·인·의)<\/b>:<ul class=\"kw\"><li><b>S (SRP, 단일 책임)<\/b>: 클래스는 단 하나의 변경 이유(책임)만 가져야 함<\/li><li><b>O (OCP, 개방-폐쇄)<\/b>: 확장에는 열려 있고(Open), 기존 코드 변경에는 닫혀(Closed) 있음<\/li><li><b>L (LSP, 리스코프 치환)<\/b>: 자식 클래스는 부모 클래스를 대체해도 정상 동작해야 함<\/li><li><b>I (ISP, 인터페이스 분리)<\/b>: 범용 인터페이스보다 클라이언트 특화 인터페이스로 분리<\/li><li><b>D (DIP, 의존성 역전)<\/b>: 구체 클래스가 아닌 추상(인터페이스)에 의존 (Spring DI 기반)<\/li><\/ul><\/li><\/ul>", "pp": "<div class=\"tblwrap\"><table class=\"cmp\"><colgroup><col style=\"width:24%\"><col style=\"width:28%\"><col style=\"width:48%\"><\/colgroup><thead><tr><th>관점(측면)<\/th><th>특징<\/th><th>설명<\/th><\/tr><\/thead><tbody><tr><td class=\"k\">책임·응집도 관점<\/td><td>SRP · ISP<\/td><td>클래스 책임(SRP)과 인터페이스 역할(ISP)을 쪼개 응집도 극대화<\/td><\/tr><tr><td class=\"k\">확장·다형성 관점<\/td><td>OCP · LSP<\/td><td>부모 규약(LSP)을 지키는 하위 구현 추가만으로 기존 코드 수정 없이 확장(OCP)<\/td><\/tr><tr><td class=\"k\">결합도·아키텍처<\/td><td>DIP (추상화 의존)<\/td><td>상위 정책이 하위 구현에 끌려가지 않도록 인터페이스 역전 (클린·헥사고날 기반)<\/td><\/tr><tr><td class=\"k\">유지보수·테스트<\/td><td>변경 파급 최소화<\/td><td>단위 테스트 용이(Mocking), 장애/수정 영향 범위를 단일 모듈로 국한<\/td><\/tr><\/tbody><\/table><\/div>", "rv": "<div class=\"q\"><b>두음: 단·개·리·인·의<\/b> — 단(단일책임 SRP)·개(개방폐쇄 OCP)·리(리스코프 LSP)·인(인터페이스분리 ISP)·의(의존성역전 DIP)<\/div>\n<div class=\"q\"><b>5원칙 정의 + 높은 응집도·낮은 결합도 + Spring DI(DIP/OCP)<\/b>!<\/div>", "img": "itpe-diagrams/52-solid.webp", "txt": null, "search": "객체지향 설계 5대 원칙 (solid) 객체지향 5대 원칙(solid) 단·개·리·인·의 / 응집↑·결합↓ sw공학·아키텍처 아키텍처·설계 패턴 ⭐⭐⭐ 기출빈출 기출 빈출 중요 소프트웨어의 변경에 유연하게 대응하고 높은 응집도(high cohesion)와 낮은 결합도(low coupling) 를 달성하기 위한 로버트 마틴(robert c. martin)의 객체지향 설계 5대 원칙 solid 5대 원칙 (단·개·리·인·의) : s (srp, 단일 책임) : 클래스는 단 하나의 변경 이유(책임)만 가져야 함 o (ocp, 개방-폐쇄) : 확장에는 열려 있고(open), 기존 코드 변경에는 닫혀(closed) 있음 l (lsp, 리스코프 치환) : 자식 클래스는 부모 클래스를 대체해도 정상 동작해야 함 i (isp, 인터페이스 분리) : 범용 인터페이스보다 클라이언트 특화 인터페이스로 분리 d (dip, 의존성 역전) : 구체 클래스가 아닌 추상(인터페이스)에 의존 (spring di 기반) 관점(측면) 특징 설명 책임·응집도 관점 srp · isp 클래스 책임(srp)과 인터페이스 역할(isp)을 쪼개 응집도 극대화 확장·다형성 관점 ocp · lsp 부모 규약(lsp)을 지키는 하위 구현 추가만으로 기존 코드 수정 없이 확장(ocp) 결합도·아키텍처 dip (추상화 의존) 상위 정책이 하위 구현에 끌려가지 않도록 인터페이스 역전 (클린·헥사고날 기반) 유지보수·테스트 변경 파급 최소화 단위 테스트 용이(mocking), 장애/수정 영향 범위를 단일 모듈로 국한 두음: 단·개·리·인·의 — 단(단일책임 srp)·개(개방폐쇄 ocp)·리(리스코프 lsp)·인(인터페이스분리 isp)·의(의존성역전 dip) 5원칙 정의 + 높은 응집도·낮은 결합도 + spring di(dip/ocp) !"}, {"id": "gof", "cat": "sw", "sub": "sw-arch", "parent": null, "t": "GoF 디자인 패턴", "s": "생(싱팩빌)·구(어데프)·행(스옵템)", "stars": 3, "redStar": false, "full": "GoF 디자인 패턴 3대 분류", "catLabel": "SW공학·아키텍처", "st": "📌 복습 필요", "d": "2026-11-21", "def": "<p>객체지향 소프트웨어 설계에서 자주 발생하는 문제에 대한 <b>재사용 가능한 표준 설계 해법(23종)<\/b>을 목적에 따라 <b>생성·구조·행위<\/b> 3가지로 분류한 패턴 체계<\/p>", "kw": "<ul class=\"kw\"><li><b>3대 분류와 대표 패턴 (생·구·행)<\/b>:<ul class=\"kw\"><li><b>생성 (Creational · 5종)<\/b>: 객체 생성 캡슐화 — <b>Singleton<\/b>(단일 인스턴스), <b>Factory Method<\/b>(생성 위임), <b>Builder<\/b>(복합 객체 단계 생성)<\/li><li><b>구조 (Structural · 7종)<\/b>: 클래스·객체 조합 — <b>Adapter<\/b>(인터페이스 변환), <b>Decorator<\/b>(동적 기능 확장), <b>Proxy<\/b>(접근·지연 제어)<\/li><li><b>행위 (Behavioral · 11종)<\/b>: 객체 간 책임·통신 — <b>Strategy<\/b>(알고리즘 런타임 교체), <b>Observer<\/b>(상태 변화 통지), <b>Template Method<\/b>(뼈대 정의·세부 위임)<\/li><\/ul><\/li><\/ul>", "pp": "<div class=\"tblwrap\"><table class=\"cmp\"><colgroup><col style=\"width:24%\"><col style=\"width:28%\"><col style=\"width:48%\"><\/colgroup><thead><tr><th>관점(측면)<\/th><th>특징<\/th><th>설명<\/th><\/tr><\/thead><tbody><tr><td class=\"k\">생성 관점 (Creational)<\/td><td>싱·팩·빌 (생성 분리)<\/td><td>new 직접 호출을 숨겨 구체 클래스 결합도 제거 (Spring Bean=Singleton)<\/td><\/tr><tr><td class=\"k\">구조 관점 (Structural)<\/td><td>어·데·프 (조합·래핑)<\/td><td>기존 코드 수정 없이 호환(Adapter)·기능덧붙이기(Decorator)·대리(Proxy)<\/td><\/tr><tr><td class=\"k\">행위 관점 (Behavioral)<\/td><td>스·옵·템 (행동 위임)<\/td><td>조건문 분기를 Strategy 다형성으로 대체하고 Observer로 느슨한 이벤트 연동<\/td><\/tr><tr><td class=\"k\">설계 원칙 연계<\/td><td>SOLID의 실전 적용<\/td><td>OCP·DIP를 구현하는 구체적 코드 설계 도구 (단, 과도한 적용 시 복잡도 증가)<\/td><\/tr><\/tbody><\/table><\/div>", "rv": "<div class=\"q\"><b>두음: 생(싱·팩·빌) / 구(어·데·프) / 행(스·옵·템)<\/b> — 생성 3종·구조 3종·행위 3종 대표 패턴 암기!<\/div>\n<div class=\"q\"><b>3대 분류 + 각 3개 대표 패턴 + SOLID(OCP·DIP) 연계<\/b>!<\/div>", "img": "itpe-diagrams/61-gof-design-patterns.webp", "txt": null, "search": "gof 디자인 패턴 3대 분류 gof 디자인 패턴 생(싱팩빌)·구(어데프)·행(스옵템) sw공학·아키텍처 아키텍처·설계 패턴 ⭐⭐⭐ 기출빈출 기출 빈출 중요 객체지향 소프트웨어 설계에서 자주 발생하는 문제에 대한 재사용 가능한 표준 설계 해법(23종) 을 목적에 따라 생성·구조·행위 3가지로 분류한 패턴 체계 3대 분류와 대표 패턴 (생·구·행) : 생성 (creational · 5종) : 객체 생성 캡슐화 — singleton (단일 인스턴스), factory method (생성 위임), builder (복합 객체 단계 생성) 구조 (structural · 7종) : 클래스·객체 조합 — adapter (인터페이스 변환), decorator (동적 기능 확장), proxy (접근·지연 제어) 행위 (behavioral · 11종) : 객체 간 책임·통신 — strategy (알고리즘 런타임 교체), observer (상태 변화 통지), template method (뼈대 정의·세부 위임) 관점(측면) 특징 설명 생성 관점 (creational) 싱·팩·빌 (생성 분리) new 직접 호출을 숨겨 구체 클래스 결합도 제거 (spring bean=singleton) 구조 관점 (structural) 어·데·프 (조합·래핑) 기존 코드 수정 없이 호환(adapter)·기능덧붙이기(decorator)·대리(proxy) 행위 관점 (behavioral) 스·옵·템 (행동 위임) 조건문 분기를 strategy 다형성으로 대체하고 observer로 느슨한 이벤트 연동 설계 원칙 연계 solid의 실전 적용 ocp·dip를 구현하는 구체적 코드 설계 도구 (단, 과도한 적용 시 복잡도 증가) 두음: 생(싱·팩·빌) / 구(어·데·프) / 행(스·옵·템) — 생성 3종·구조 3종·행위 3종 대표 패턴 암기! 3대 분류 + 각 3개 대표 패턴 + solid(ocp·dip) 연계 !"}, {"id": "coupling", "cat": "sw", "sub": "sw-arch", "parent": null, "t": "결합도 · 응집도 (모듈화)", "s": "내·공·외·제·스·자 / 우·논·시·절·통·순·기", "stars": 3, "redStar": false, "full": "모듈화 결합도(Coupling)와 응집도(Cohesion)", "catLabel": "SW공학", "st": "📌 복습 필요", "d": "2026-11-22", "def": "<p>소프트웨어 모듈화의 품질을 측정하는 두 핵심 척도로, 모듈 간 상호 의존도를 뜻하는 <b>결합도(Coupling)는 낮추고(Low)<\/b>, 모듈 내부 요소 간 기능적 관련성을 뜻하는 <b>응집도(Cohesion)는 높이는(High)<\/b> 설계 원칙<\/p>", "kw": "<ul class=\"kw\"><li><b>결합도 6단계 (나쁨 → 좋음: 내·공·외·제·스·자)<\/b>:<ul class=\"kw\"><li><b>내용(Content)<\/b> > <b>공통(Common)<\/b> > <b>외부(External)<\/b> > <b>제어(Control)<\/b> > <b>스탬프(Stamp)<\/b> > <b>자료(Data)<\/b><\/li><\/ul><\/li><li><b>응집도 7단계 (나쁨 → 좋음: 우·논·시·절·통·순·기)<\/b>:<ul class=\"kw\"><li><b>우연적(Coincidental)<\/b> &lt; <b&gt;논리적(Logical)<\/b> &lt; <b&gt;시간적(Temporal)<\/b> &lt; <b&gt;절차적(Procedural)<\/b> &lt; <b&gt;통신적(Communication)<\/b> &lt; <b&gt;순차적(Sequential)<\/b> &lt; <b&gt;기능적(Functional)<\/b><\/li><\/ul><\/li><\/ul>", "pp": "<h4>1) 개념 비교<\/h4>\n<div class=\"tblwrap\"><table class=\"cmp\"><colgroup><col style=\"width:24%\"><col style=\"width:28%\"><col style=\"width:48%\"><\/colgroup><thead><tr><th>비교<\/th><th>결합도 (Coupling)<\/th><th>응집도 (Cohesion)<\/th><\/tr><\/thead><tbody><tr><td class=\"k\">측정 대상<\/td><td>모듈 <b>간(Inter)<\/b>의 상호 의존성<\/td><td>모듈 <b>내부(Intra)<\/b> 요소 간 관련성<\/td><\/tr><tr><td class=\"k\">설계 목표<\/td><td><b>낮을수록 좋음 (Low Coupling)<\/b><\/td><td><b>높을수록 좋음 (High Cohesion)<\/b><\/td><\/tr><tr><td class=\"k\">최악 vs 최선<\/td><td>내용(최악) → 자료(최선)<\/td><td>우연적(최악) → 기능적(최선)<\/td><\/tr><\/tbody><\/table><\/div>\n<h4>2) 상세 비교 (설계 · 유지보수 관점)<\/h4>\n<div class=\"tblwrap\"><table class=\"cmp\"><colgroup><col style=\"width:24%\"><col style=\"width:28%\"><col style=\"width:48%\"><\/colgroup><thead><tr><th>구분<\/th><th>결합도 (Coupling)<\/th><th>응집도 (Cohesion)<\/th><\/tr><\/thead><tbody><tr><td class=\"k\">낮음/높음의 의미<\/td><td>변경 파급효과 최소화·독립성 확보<\/td><td>단일 책임(SRP) 수행·재사용성 극대화<\/td><\/tr><tr><td class=\"k\">개선 기법<\/td><td>인터페이스 추상화, DI(의존성 주입), DTO 전달<\/td><td>기능별 모듈 분리, 리팩토링, 도메인 경계(DDD)<\/td><\/tr><\/tbody><\/table><\/div>", "rv": "<div class=\"q\"><b>두음: 내·공·외·제·스·자 / 우·논·시·절·통·순·기<\/b> — 결합도(나쁨→좋음) / 응집도(나쁨→좋음)<\/div>\n<div class=\"q\"><b>1교시 단답형 부동의 기본기<\/b>: 단계 순서 절대 틀리지 말고 <b>Low Coupling, High Cohesion<\/b> 명시!<\/div>", "img": "itpe-diagrams/80-coupling-cohesion.webp", "txt": null, "search": "모듈화 결합도(coupling)와 응집도(cohesion) 결합도 · 응집도 (모듈화) 내·공·외·제·스·자 / 우·논·시·절·통·순·기 sw공학 아키텍처·설계 패턴 ⭐⭐⭐ 기출빈출 기출 빈출 중요 소프트웨어 모듈화의 품질을 측정하는 두 핵심 척도로, 모듈 간 상호 의존도를 뜻하는 결합도(coupling)는 낮추고(low) , 모듈 내부 요소 간 기능적 관련성을 뜻하는 응집도(cohesion)는 높이는(high) 설계 원칙 결합도 6단계 (나쁨 → 좋음: 내·공·외·제·스·자) : 내용(content) > 공통(common) > 외부(external) > 제어(control) > 스탬프(stamp) > 자료(data) 응집도 7단계 (나쁨 → 좋음: 우·논·시·절·통·순·기) : 우연적(coincidental) &lt; &lt; &lt; &lt; &lt; &lt; 1) 개념 비교 비교 결합도 (coupling) 응집도 (cohesion) 측정 대상 모듈 간(inter) 의 상호 의존성 모듈 내부(intra) 요소 간 관련성 설계 목표 낮을수록 좋음 (low coupling) 높을수록 좋음 (high cohesion) 최악 vs 최선 내용(최악) → 자료(최선) 우연적(최악) → 기능적(최선) 2) 상세 비교 (설계 · 유지보수 관점) 구분 결합도 (coupling) 응집도 (cohesion) 낮음/높음의 의미 변경 파급효과 최소화·독립성 확보 단일 책임(srp) 수행·재사용성 극대화 개선 기법 인터페이스 추상화, di(의존성 주입), dto 전달 기능별 모듈 분리, 리팩토링, 도메인 경계(ddd) 두음: 내·공·외·제·스·자 / 우·논·시·절·통·순·기 — 결합도(나쁨→좋음) / 응집도(나쁨→좋음) 1교시 단답형 부동의 기본기 : 단계 순서 절대 틀리지 말고 low coupling, high cohesion 명시!"}, {"id": "clean-code", "cat": "sw", "sub": "sw-arch", "parent": null, "t": "클린코드", "s": "보이스카웃·네이밍·결합도", "stars": 3, "redStar": false, "full": "클린코드 (Clean Code) · 보이스카웃 원칙", "catLabel": "SW공학·아키텍처", "st": "📌 복습 필요", "d": "2026-11-25", "def": "<p><b>클린코드(Clean Code)<\/b>는 읽고 이해하기 쉬우며 <b>변경 비용이 낮은<\/b> 코드를 만드는 원칙과 관행의 집합. 좋은 이름·작은 함수·정직한 주석·낮은 결합도·테스트 가능성이 핵심이며, <b>보이스카웃 원칙(Boy Scout Rule)<\/b>처럼 작은 개선을 지속적으로 축적해 <b>기술 부채<\/b>가 쌓이지 않게 하는 <b>코드 품질 원칙<\/b>.<\/p>", "kw": "<ul class=\"kw\"><li><b>보이스카웃 원칙<\/b>: \"들어갈 때보다 깨끗하게 나온다\" — 코드를 만질 때 작은 개선(이름·중복·매직 넘버)을 함께 수행<\/li><li><b>의미 있는 네이밍<\/b>: 의도 노출·발음 가능·검색 가능, 인코딩 접두어·축약 금지, 길이는 <b>스코프에 비례<\/b><\/li><li><b>함수<\/b>: 한 가지 일만(SRP)·작게(20줄 이내 권장)·인자 3개 이하·부수효과 명시·<b>CQS<\/b>(조회와 변경 분리)<\/li><li><b>주석<\/b>: 코드로 표현 못 하는 <b>이유(Why)<\/b>만, 낡은 주석은 삭제 — \"주석은 실패를 기록한 것\"(좋은 코드는 주석이 필요 없다)<\/li><li><b>결합도·응집도<\/b>: 디미터 법칙·Tell Don't Ask·불변성·순수 함수로 의존 최소화(<b>내·공·외·제·스·자<\/b>)<\/li><li><b>오류 처리<\/b>: 예외를 삼키지 않기, null 회피(Optional), 실패를 숨기지 않는 명시적 처리<\/li><li><b>테스트<\/b>: 단위 테스트가 리팩토링 안전망 — 테스트 없는 클린코드는 유지될 수 없다<\/li><li><b>코드 냄새(Code Smell)<\/b>: 중복·긴 함수·큰 클래스·긴 매개변수·추측성 일반화·매직 넘버<\/li><\/ul>", "pp": "<h4>1) 클린코드 vs 부채(레거시) 코드 (비교모듈: 목·대·기·산·검·장·단)<\/h4>\n<div class=\"tblwrap\"><table class=\"cmp\"><colgroup><col style=\"width:24%\"><col style=\"width:28%\"><col style=\"width:48%\"><\/colgroup><thead><tr><th>구분<\/th><th>클린코드<\/th><th>기술 부채 코드<\/th><\/tr><\/thead><tbody><tr><td class=\"k\">적용목적<\/td><td>변경 비용 최소화·의도 전달<\/td><td>단기 기능 추가 속도(부채 누적)<\/td><\/tr><tr><td class=\"k\">대상·범위<\/td><td>네이밍·함수·주석·결합도·테스트<\/td><td>중복·긴 함수·매직 넘버·전역 상태<\/td><\/tr><tr><td class=\"k\">핵심기법<\/td><td>리팩토링·보이스카웃·단위 테스트·정적 분석<\/td><td>임시 패치·복사-붙여넣기·주석 처리<\/td><\/tr><tr><td class=\"k\">주요산출물<\/td><td>읽히는 코드·테스트·의사결정 기록<\/td><td>동작하는 코드(문서·테스트 부재)<\/td><\/tr><tr><td class=\"k\">검증·품질<\/td><td>순환 복잡도·중복률·커버리지·결함 밀도<\/td><td>결함률·변경 리드타임 악화<\/td><\/tr><tr><td class=\"k\">장점<\/td><td>유지보수성·온보딩·결함 감소<\/td><td>초기 속도(단기)<\/td><\/tr><tr><td class=\"k\">단점<\/td><td>초기 작성 시간·과도한 추상화 위험<\/td><td>변경 비용 급증·회귀 결함<\/td><\/tr><\/tbody><\/table><\/div>\n<h4>2) 클린코드 5대 실천<\/h4>\n<div class=\"tblwrap\"><table class=\"cmp\"><colgroup><col style=\"width:24%\"><col style=\"width:28%\"><col style=\"width:48%\"><\/colgroup><thead><tr><th>구분<\/th><th>원칙<\/th><th>실천 예<\/th><\/tr><\/thead><tbody><tr><td class=\"k\">이름<\/td><td>의도가 드러나는 이름<\/td><td><code>d<\/code> → <code>elapsedDays<\/code>, <code>getUserList()<\/code> → <code>findActiveUsers()<\/code><\/td><\/tr><tr><td class=\"k\">함수<\/td><td>작게, 한 가지 일<\/td><td>조건 분기·검증 로직을 별도 함수로 추출, 인자 객체화<\/td><\/tr><tr><td class=\"k\">주석<\/td><td>왜만, 코드로 말하기<\/td><td><code>// 30일 후 만료(정책 2026-03 개정)<\/code> 같은 이유 기록<\/td><\/tr><tr><td class=\"k\">중복<\/td><td>3번째에 추출<\/td><td>Rule of Three, 중복 제거 후 테스트로 회귀 확인<\/td><\/tr><tr><td class=\"k\">경계<\/td><td>결합도 낮추기<\/td><td>인터페이스 의존·디미터 법칙·Tell Don't Ask<\/td><\/tr><\/tbody><\/table><\/div>\n<h4>3) 적용·측정<\/h4>\n<div class=\"tblwrap\"><table class=\"cmp\"><colgroup><col style=\"width:24%\"><col style=\"width:28%\"><col style=\"width:48%\"><\/colgroup><thead><tr><th>구분<\/th><th>키워드<\/th><th>설명<\/th><\/tr><\/thead><tbody><tr><td class=\"k\">도입<\/td><td>작은 단위<\/td><td>전면 재작성 대신 보이스카웃·캠프그라운드 규칙으로 점진 개선<\/td><\/tr><tr><td class=\"k\">리뷰<\/td><td>체크리스트<\/td><td>네이밍·함수 길이·중복·예외 처리·테스트 유무를 리뷰 항목화<\/td><\/tr><tr><td class=\"k\">측정<\/td><td>정적 분석<\/td><td>순환 복잡도·중복률·정적 경고를 지표로 추세 관리<\/td><\/tr><tr><td class=\"k\">안전망<\/td><td>테스트 우선<\/td><td>리팩토링 전 특성 테스트(Characterization Test)로 현재 동작 고정<\/td><\/tr><tr><td class=\"k\">균형<\/td><td>과잉 추상화 경고<\/td><td>추측성 일반화·불필요한 패턴 도입은 또 다른 부채<\/td><\/tr><\/tbody><\/table><\/div>", "rv": "<div class=\"q\"><b>두음: 이·함·주·결·테 — 이름·함수·주석·결합도·테스트 / 보 — 보이스카웃 원칙<\/b><\/div>\n<div class=\"q\"><b>\"읽기 쉬운 코드가 변경에 강하다 — 보이스카웃처럼 조금씩 깨끗하게\"<\/b><\/div>", "img": "itpe-diagrams/138-clean-code.webp", "txt": null, "search": "클린코드 (clean code) · 보이스카웃 원칙 클린코드 보이스카웃·네이밍·결합도 sw공학·아키텍처 아키텍처·설계 패턴 ⭐⭐⭐ 기출빈출 기출 빈출 중요 클린코드(clean code) 는 읽고 이해하기 쉬우며 변경 비용이 낮은 코드를 만드는 원칙과 관행의 집합. 좋은 이름·작은 함수·정직한 주석·낮은 결합도·테스트 가능성이 핵심이며, 보이스카웃 원칙(boy scout rule) 처럼 작은 개선을 지속적으로 축적해 기술 부채 가 쌓이지 않게 하는 코드 품질 원칙 . 보이스카웃 원칙 : \"들어갈 때보다 깨끗하게 나온다\" — 코드를 만질 때 작은 개선(이름·중복·매직 넘버)을 함께 수행 의미 있는 네이밍 : 의도 노출·발음 가능·검색 가능, 인코딩 접두어·축약 금지, 길이는 스코프에 비례 함수 : 한 가지 일만(srp)·작게(20줄 이내 권장)·인자 3개 이하·부수효과 명시· cqs (조회와 변경 분리) 주석 : 코드로 표현 못 하는 이유(why) 만, 낡은 주석은 삭제 — \"주석은 실패를 기록한 것\"(좋은 코드는 주석이 필요 없다) 결합도·응집도 : 디미터 법칙·tell don't ask·불변성·순수 함수로 의존 최소화( 내·공·외·제·스·자 ) 오류 처리 : 예외를 삼키지 않기, null 회피(optional), 실패를 숨기지 않는 명시적 처리 테스트 : 단위 테스트가 리팩토링 안전망 — 테스트 없는 클린코드는 유지될 수 없다 코드 냄새(code smell) : 중복·긴 함수·큰 클래스·긴 매개변수·추측성 일반화·매직 넘버 1) 클린코드 vs 부채(레거시) 코드 (비교모듈: 목·대·기·산·검·장·단) 구분 클린코드 기술 부채 코드 적용목적 변경 비용 최소화·의도 전달 단기 기능 추가 속도(부채 누적) 대상·범위 네이밍·함수·주석·결합도·테스트 중복·긴 함수·매직 넘버·전역 상태 핵심기법 리팩토링·보이스카웃·단위 테스트·정적 분석 임시 패치·복사-붙여넣기·주석 처리 주요산출물 읽히는 코드·테스트·의사결정 기록 동작하는 코드(문서·테스트 부재) 검증·품질 순환 복잡도·중복률·커버리지·결함 밀도 결함률·변경 리드타임 악화 장점 유지보수성·온보딩·결함 감소 초기 속도(단기) 단점 초기 작성 시간·과도한 추상화 위험 변경 비용 급증·회귀 결함 2) 클린코드 5대 실천 구분 원칙 실천 예 이름 의도가 드러나는 이름 d → elapseddays , getuserlist() → findactiveusers() 함수 작게, 한 가지 일 조건 분기·검증 로직을 별도 함수로 추출, 인자 객체화 주석 왜만, 코드로 말하기 // 30일 후 만료(정책 2026-03 개정) 같은 이유 기록 중복 3번째에 추출 rule of three, 중복 제거 후 테스트로 회귀 확인 경계 결합도 낮추기 인터페이스 의존·디미터 법칙·tell don't ask 3) 적용·측정 구분 키워드 설명 도입 작은 단위 전면 재작성 대신 보이스카웃·캠프그라운드 규칙으로 점진 개선 리뷰 체크리스트 네이밍·함수 길이·중복·예외 처리·테스트 유무를 리뷰 항목화 측정 정적 분석 순환 복잡도·중복률·정적 경고를 지표로 추세 관리 안전망 테스트 우선 리팩토링 전 특성 테스트(characterization test)로 현재 동작 고정 균형 과잉 추상화 경고 추측성 일반화·불필요한 패턴 도입은 또 다른 부채 두음: 이·함·주·결·테 — 이름·함수·주석·결합도·테스트 / 보 — 보이스카웃 원칙 \"읽기 쉬운 코드가 변경에 강하다 — 보이스카웃처럼 조금씩 깨끗하게\""}, {"id": "maint", "cat": "sw", "sub": "sw-arch", "parent": null, "t": "SW 유지보수·리팩토링", "s": "수·적·완·예 / 리팩 vs 리엔지", "stars": 3, "redStar": false, "full": "SW 유지보수 4유형과 리팩토링·리엔지니어링", "catLabel": "SW공학·아키텍처", "st": "📌 복습 필요", "d": "2026-11-21", "def": "<p><b>SW 유지보수<\/b>는 시스템 인도 후 결함 수정·환경 적응·기능 개선을 수행하는 활동이며, <b>리팩토링<\/b>은 외부 동작을 유지한 채 내부 코드 구조를 개선하는 기법, <b>리엔지니어링<\/b>은 기존 시스템을 역공학으로 분석해 재설계·재구축하는 기법<\/p>", "kw": "<ul class=\"kw\"><li><b>SW 유지보수 4대 유형 (수·적·완·예)<\/b>:<ul class=\"kw\"><li><b>수정 (Corrective)<\/b>: 운영 중 발견된 버그·오류 수정<\/li><li><b>적응 (Adaptive)<\/b>: OS·HW·법규 등 외부 환경 변화 대응<\/li><li><b>완전 (Perfective)<\/b>: 신규 기능 추가·성능 개선 (실무 비중 최대)<\/li><li><b>예방 (Preventive)<\/b>: 미래의 잠재 결함 예방·유지보수성 향상(리팩토링)<\/li><\/ul><\/li><li><b>레거시 현대화 3단계<\/b>: <b>역공학(Reverse)<\/b>[코드→설계 추출] → <b>재구성(Restructuring/Refactoring)<\/b> → <b>재공학(Reengineering)<\/b>[역공학+재설계+순공학]<\/li><\/ul>", "pp": "<p><b>1) 개념 비교 (리팩토링 vs 리엔지니어링)<\/b><\/p>\n<div class=\"tblwrap\"><table class=\"cmp\"><colgroup><col style=\"width:24%\"><col style=\"width:28%\"><col style=\"width:48%\"><\/colgroup><thead><tr><th>구분<\/th><th>리팩토링 (Refactoring)<\/th><th>리엔지니어링 (Reengineering)<\/th><\/tr><\/thead><tbody><tr><td class=\"k\">목적·범위<\/td><td>외부 기능 유지 + 내부 코드 가독성·구조 개선<\/td><td>역공학 분석 후 아키텍처·기술스택까지 재설계·재구현<\/td><\/tr><tr><td class=\"k\">변경 수준<\/td><td>코드·모듈 수준 (점진적·상시 수행)<\/td><td>시스템·아키텍처 수준 (프로젝트 단위 현대화)<\/td><\/tr><tr><td class=\"k\">관계<\/td><td>예방 유지보수의 핵심 수단<\/td><td>역공학 + 재구성 + 순공학(Forward)의 결합<\/td><\/tr><\/tbody><\/table><\/div>\n<p><b>2) 관리·공학 관점 구성표<\/b><\/p>\n<div class=\"tblwrap\"><table class=\"cmp\"><colgroup><col style=\"width:24%\"><col style=\"width:28%\"><col style=\"width:48%\"><\/colgroup><thead><tr><th>관점(측면)<\/th><th>특징<\/th><th>설명<\/th><\/tr><\/thead><tbody><tr><td class=\"k\">비용·생애주기<\/td><td>전체 TCO의 60~80%<\/td><td>개발보다 운영·유지보수 비용이 압도적 → 예방 유지보수 투자 필수<\/td><\/tr><tr><td class=\"k\">품질·부채 관점<\/td><td>기술부채(Technical Debt) 해소<\/td><td>테스트 코드(회귀 테스트) 기반 상시 리팩토링으로 코드 부패 방지<\/td><\/tr><tr><td class=\"k\">아키텍처 전환<\/td><td>스트랭글러 피그(Strangler Fig)<\/td><td>모놀리식 레거시를 리엔지니어링으로 점진적 MSA 전환<\/td><\/tr><\/tbody><\/table><\/div>", "rv": "<div class=\"q\"><b>두음: 수·적·완·예 / 역·재·순<\/b> — 수(수정)·적(적응)·완(완전)·예(예방) / 역(역공학)·재(재구성)·순(순공학=리엔지니어링)<\/div>\n<div class=\"q\"><b>유지보수 4유형(완전이 비중 최대!) + 리팩토링(외부동일·내부개선) vs 리엔지니어링(역공학+재설계)<\/b>!<\/div>", "img": "itpe-diagrams/58-sw-maintenance.webp", "txt": null, "search": "sw 유지보수 4유형과 리팩토링·리엔지니어링 sw 유지보수·리팩토링 수·적·완·예 / 리팩 vs 리엔지 sw공학·아키텍처 아키텍처·설계 패턴 ⭐⭐⭐ 기출빈출 기출 빈출 중요 sw 유지보수 는 시스템 인도 후 결함 수정·환경 적응·기능 개선을 수행하는 활동이며, 리팩토링 은 외부 동작을 유지한 채 내부 코드 구조를 개선하는 기법, 리엔지니어링 은 기존 시스템을 역공학으로 분석해 재설계·재구축하는 기법 sw 유지보수 4대 유형 (수·적·완·예) : 수정 (corrective) : 운영 중 발견된 버그·오류 수정 적응 (adaptive) : os·hw·법규 등 외부 환경 변화 대응 완전 (perfective) : 신규 기능 추가·성능 개선 (실무 비중 최대) 예방 (preventive) : 미래의 잠재 결함 예방·유지보수성 향상(리팩토링) 레거시 현대화 3단계 : 역공학(reverse) [코드→설계 추출] → 재구성(restructuring/refactoring) → 재공학(reengineering) [역공학+재설계+순공학] 1) 개념 비교 (리팩토링 vs 리엔지니어링) 구분 리팩토링 (refactoring) 리엔지니어링 (reengineering) 목적·범위 외부 기능 유지 + 내부 코드 가독성·구조 개선 역공학 분석 후 아키텍처·기술스택까지 재설계·재구현 변경 수준 코드·모듈 수준 (점진적·상시 수행) 시스템·아키텍처 수준 (프로젝트 단위 현대화) 관계 예방 유지보수의 핵심 수단 역공학 + 재구성 + 순공학(forward)의 결합 2) 관리·공학 관점 구성표 관점(측면) 특징 설명 비용·생애주기 전체 tco의 60~80% 개발보다 운영·유지보수 비용이 압도적 → 예방 유지보수 투자 필수 품질·부채 관점 기술부채(technical debt) 해소 테스트 코드(회귀 테스트) 기반 상시 리팩토링으로 코드 부패 방지 아키텍처 전환 스트랭글러 피그(strangler fig) 모놀리식 레거시를 리엔지니어링으로 점진적 msa 전환 두음: 수·적·완·예 / 역·재·순 — 수(수정)·적(적응)·완(완전)·예(예방) / 역(역공학)·재(재구성)·순(순공학=리엔지니어링) 유지보수 4유형(완전이 비중 최대!) + 리팩토링(외부동일·내부개선) vs 리엔지니어링(역공학+재설계) !"}, {"id": "serverless", "cat": "sw", "sub": "sw-native", "parent": null, "t": "서버리스 컴퓨팅 · FaaS", "s": "FaaS·BaaS / 콜드스타트·종량", "stars": 0, "redStar": true, "full": "서버리스 컴퓨팅 · FaaS", "catLabel": "SW공학·아키텍처", "st": "📌 복습 필요", "d": "2026-11-23", "def": "<p>서버 프로비저닝·확장·패치 등 인프라 관리를 클라우드 사업자가 전담하고, 개발자는 <b>이벤트 기반 함수(Function) 단위의 코드<\/b>만 배포하며 <b>실행한 만큼만(요청 수 × 실행시간 × 메모리)<\/b> 과금되는 클라우드 실행 모델<\/p>", "kw": "<ul class=\"kw\"><li><b>FaaS (Function as a Service)<\/b>: HTTP·큐·스케줄·스토리지 변경 등 <b>이벤트 트리거<\/b>로 단명 함수를 실행 — AWS Lambda, Azure Functions, Google Cloud Functions<\/li><li><b>BaaS (Backend as a Service)<\/b>: 인증·DB·스토리지·푸시 등 백엔드 기능을 <b>관리형 API<\/b>로 제공 — Firebase, Supabase<\/li><li><b>Cold Start<\/b>: 유휴 후 첫 호출 시 컨테이너 생성·런타임 초기화로 지연 발생 → <b>Provisioned Concurrency(예열)<\/b>, SnapStart, 런타임·의존성 최소화로 완화<\/li><li><b>Scale-to-Zero · 자동 확장<\/b>: 요청량에 따라 0~수천 동시 실행으로 확장, 유휴 시 자원·비용 0<\/li><li><b>무상태(Stateless) 설계<\/b>: 함수는 상태를 보유하지 않으며 상태는 외부 저장소(S3·DB·캐시)로 외부화<\/li><li><b>제약<\/b>: 최대 실행시간(Lambda 15분)·메모리·페이로드 제한, 벤더 종속(Lock-in), 로컬 테스트·분산 트레이싱 난이도<\/li><\/ul>", "pp": "<h4>1) 관점별 구성<\/h4>\n<div class=\"tblwrap\"><table class=\"cmp\"><colgroup><col style=\"width:24%\"><col style=\"width:28%\"><col style=\"width:48%\"><\/colgroup><thead><tr><th>관점(측면)<\/th><th>특징<\/th><th>설명<\/th><\/tr><\/thead><tbody><tr><td class=\"k\">실행 단위<\/td><td>함수(이벤트) 단위<\/td><td>서버·OS 관리 없이 코드 조각을 등록하고 호출 시에만 기동<\/td><\/tr><tr><td class=\"k\">확장·가용성<\/td><td>완전 자동·Scale-to-Zero<\/td><td>트래픽 급증에도 자동 확장, 유휴 시 자원·비용 0<\/td><\/tr><tr><td class=\"k\">과금<\/td><td>종량 과금<\/td><td>요청 수 + 실행시간(ms)×메모리(GB) 기준, 고정 비용 없음<\/td><\/tr><tr><td class=\"k\">운영 책임<\/td><td>사업자 위임<\/td><td>런타임 패치·보안·이중화는 사업자, 사용자는 코드·IAM·설정 책임<\/td><\/tr><tr><td class=\"k\">한계<\/td><td>콜드스타트·종속<\/td><td>실행시간 제한, 벤더 API 종속, 장기 실행·상태 보유 작업 부적합<\/td><\/tr><\/tbody><\/table><\/div>", "rv": "<div class=\"q\"><b>두음: 서·함·무·종<\/b> — 서버추상화 · 함수(FaaS) 단위 · 무상태(Stateless) · 종량 과금<\/div>\n<div class=\"q\"><b>제약 두음: 콜·시·벤<\/b> — 콜드스타트 · 시간제한(15분) · 벤더 종속<\/div>\n<div class=\"q\"><b>\"BaaS는 백엔드 기능 제공, FaaS는 실행 단위\"<\/b> — 서버리스는 두 개념을 아우르는 상위 실행 모델!<\/div>", "img": "itpe-diagrams/90-serverless.webp", "txt": null, "search": "서버리스 컴퓨팅 · faas 서버리스 컴퓨팅 · faas faas·baas / 콜드스타트·종량 sw공학·아키텍처 클라우드 네이티브·api 빨간별 빨간 별 빨간색 별 ★ 레드별 심화반 심화 선택 서버 프로비저닝·확장·패치 등 인프라 관리를 클라우드 사업자가 전담하고, 개발자는 이벤트 기반 함수(function) 단위의 코드 만 배포하며 실행한 만큼만(요청 수 × 실행시간 × 메모리) 과금되는 클라우드 실행 모델 faas (function as a service) : http·큐·스케줄·스토리지 변경 등 이벤트 트리거 로 단명 함수를 실행 — aws lambda, azure functions, google cloud functions baas (backend as a service) : 인증·db·스토리지·푸시 등 백엔드 기능을 관리형 api 로 제공 — firebase, supabase cold start : 유휴 후 첫 호출 시 컨테이너 생성·런타임 초기화로 지연 발생 → provisioned concurrency(예열) , snapstart, 런타임·의존성 최소화로 완화 scale-to-zero · 자동 확장 : 요청량에 따라 0~수천 동시 실행으로 확장, 유휴 시 자원·비용 0 무상태(stateless) 설계 : 함수는 상태를 보유하지 않으며 상태는 외부 저장소(s3·db·캐시)로 외부화 제약 : 최대 실행시간(lambda 15분)·메모리·페이로드 제한, 벤더 종속(lock-in), 로컬 테스트·분산 트레이싱 난이도 1) 관점별 구성 관점(측면) 특징 설명 실행 단위 함수(이벤트) 단위 서버·os 관리 없이 코드 조각을 등록하고 호출 시에만 기동 확장·가용성 완전 자동·scale-to-zero 트래픽 급증에도 자동 확장, 유휴 시 자원·비용 0 과금 종량 과금 요청 수 + 실행시간(ms)×메모리(gb) 기준, 고정 비용 없음 운영 책임 사업자 위임 런타임 패치·보안·이중화는 사업자, 사용자는 코드·iam·설정 책임 한계 콜드스타트·종속 실행시간 제한, 벤더 api 종속, 장기 실행·상태 보유 작업 부적합 두음: 서·함·무·종 — 서버추상화 · 함수(faas) 단위 · 무상태(stateless) · 종량 과금 제약 두음: 콜·시·벤 — 콜드스타트 · 시간제한(15분) · 벤더 종속 \"baas는 백엔드 기능 제공, faas는 실행 단위\" — 서버리스는 두 개념을 아우르는 상위 실행 모델!"}, {"id": "kubernetes", "cat": "sw", "sub": "sw-native", "parent": "cncf", "t": "쿠버네티스", "s": "아키텍처 · HPA·VPA·CA", "stars": 0, "redStar": true, "full": "쿠버네티스 아키텍처 · 오토스케일링", "catLabel": "SW공학·아키텍처", "st": "📌 복습 필요", "d": "2026-11-23", "def": "<p>컨테이너화된 애플리케이션을 <b>클러스터 단위로 배포·확장·자동복구·관리<\/b>하는 컨테이너 오케스트레이션 플랫폼으로, 선언적(Declarative) 상태 관리로 <b>Desired State = Current State<\/b>를 지속 유지함<\/p>", "kw": "<ul class=\"kw\"><li><b>컨트롤 플레인<\/b>: <b>API Server<\/b>(모든 요청의 단일 진입점) · <b>etcd<\/b>(클러스터 상태 저장) · <b>Scheduler<\/b>(Pod→Node 배치) · <b>Controller Manager<\/b>(Desired State 유지)<\/li><li><b>워커 노드<\/b>: <b>Kubelet<\/b>(Pod 생명주기) · <b>Kube-proxy<\/b>(Service·네트워크 규칙) · 컨테이너 런타임(containerd)<\/li><li><b>핵심 오브젝트<\/b>: Pod(최소 배포 단위) · Deployment(ReplicaSet 기반 무중단 롤링) · Service/Ingress(노출·L4/L7) · ConfigMap/Secret · PVC<\/li><li><b>설계 특징<\/b>: 선언적 관리, 자가치유(Self-healing), 느슨한 결합·수평 확장, 오퍼레이터 패턴<\/li><li><b>오토스케일링<\/b>:<ul class=\"kw\"><li><b>HPA<\/b>: Pod <b>개수<\/b>(Replica) 조정 — CPU·메모리·커스텀 메트릭<\/li><li><b>VPA<\/b>: Pod <b>크기<\/b>(request/limit) 조정<\/li><li><b>CA/Cluster Autoscaler·Karpenter<\/b>: <b>노드<\/b>(인프라) 수 조정<\/li><li><b>KEDA<\/b>: 이벤트·큐 길이 기반 확장(HPA 지표 어댑터)<\/li><\/ul><\/li><\/ul>", "pp": "<h4>1) 아키텍처 관점별 구성<\/h4>\n<div class=\"tblwrap\"><table class=\"cmp\"><colgroup><col style=\"width:24%\"><col style=\"width:28%\"><col style=\"width:48%\"><\/colgroup><thead><tr><th>관점(측면)<\/th><th>특징<\/th><th>설명<\/th><\/tr><\/thead><tbody><tr><td class=\"k\">컨트롤 플레인<\/td><td>두뇌·상태 관리<\/td><td>API Server·etcd·Scheduler·Controller Manager가 클러스터 상태 유지<\/td><\/tr><tr><td class=\"k\">워커 노드<\/td><td>실행 계층<\/td><td>Kubelet·Kube-proxy·런타임이 Pod를 실제 구동<\/td><\/tr><tr><td class=\"k\">오브젝트<\/td><td>선언적 배포 단위<\/td><td>Pod·Deployment·Service·Ingress로 배포·노출·설정 관리<\/td><\/tr><tr><td class=\"k\">운영 특성<\/td><td>자가치유·확장<\/td><td>장애 Pod 자동 재생성, 수평 확장·롤링 업데이트<\/td><\/tr><\/tbody><\/table><\/div>\n<h4>2) 오토스케일링 비교 (HPA vs VPA vs CA)<\/h4>\n<div class=\"tblwrap\"><table class=\"cmp\"><thead><tr><th>비교<\/th><th>HPA<\/th><th>VPA<\/th><th>CA (Cluster Autoscaler)<\/th><\/tr><\/thead><tbody><tr><td class=\"k\">조정 대상<\/td><td>Pod 개수(Replica)<\/td><td>Pod 자원(CPU·메모리)<\/td><td>노드(인스턴스) 수<\/td><\/tr><tr><td class=\"k\">기준 지표<\/td><td>CPU·메모리·커스텀·이벤트<\/td><td>사용량 이력<\/td><td>Pending Pod·노드 여유<\/td><\/tr><tr><td class=\"k\">특징<\/td><td>수평 확장·무중단<\/td><td>수직 확장(재시작 동반)<\/td><td>클러스터 용량 확장<\/td><\/tr><\/tbody>
