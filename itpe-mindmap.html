<\/table><\/div>", "rv": "<div class=\"q\"><b>두음: 컨·노·오<\/b> — 컨트롤 플레인(API·etcd·스케줄러·컨트롤러) · 노드(Kubelet·Proxy) · 오브젝트(Pod·Deployment·Service)<\/div>\n<div class=\"q\"><b>HPA=개수, VPA=크기, CA=노드<\/b> — 지표·대상이 다르므로 함께 조합해 사용!<\/div>", "img": "itpe-diagrams/98-kubernetes.webp", "txt": null, "search": "쿠버네티스 아키텍처 · 오토스케일링 쿠버네티스 아키텍처 · hpa·vpa·ca sw공학·아키텍처 클라우드 네이티브·api 빨간별 빨간 별 빨간색 별 ★ 레드별 심화반 심화 선택 컨테이너화된 애플리케이션을 클러스터 단위로 배포·확장·자동복구·관리 하는 컨테이너 오케스트레이션 플랫폼으로, 선언적(declarative) 상태 관리로 desired state = current state 를 지속 유지함 컨트롤 플레인 : api server (모든 요청의 단일 진입점) · etcd (클러스터 상태 저장) · scheduler (pod→node 배치) · controller manager (desired state 유지) 워커 노드 : kubelet (pod 생명주기) · kube-proxy (service·네트워크 규칙) · 컨테이너 런타임(containerd) 핵심 오브젝트 : pod(최소 배포 단위) · deployment(replicaset 기반 무중단 롤링) · service/ingress(노출·l4/l7) · configmap/secret · pvc 설계 특징 : 선언적 관리, 자가치유(self-healing), 느슨한 결합·수평 확장, 오퍼레이터 패턴 오토스케일링 : hpa : pod 개수 (replica) 조정 — cpu·메모리·커스텀 메트릭 vpa : pod 크기 (request/limit) 조정 ca/cluster autoscaler·karpenter : 노드 (인프라) 수 조정 keda : 이벤트·큐 길이 기반 확장(hpa 지표 어댑터) 1) 아키텍처 관점별 구성 관점(측면) 특징 설명 컨트롤 플레인 두뇌·상태 관리 api server·etcd·scheduler·controller manager가 클러스터 상태 유지 워커 노드 실행 계층 kubelet·kube-proxy·런타임이 pod를 실제 구동 오브젝트 선언적 배포 단위 pod·deployment·service·ingress로 배포·노출·설정 관리 운영 특성 자가치유·확장 장애 pod 자동 재생성, 수평 확장·롤링 업데이트 2) 오토스케일링 비교 (hpa vs vpa vs ca) 비교 hpa vpa ca (cluster autoscaler) 조정 대상 pod 개수(replica) pod 자원(cpu·메모리) 노드(인스턴스) 수 기준 지표 cpu·메모리·커스텀·이벤트 사용량 이력 pending pod·노드 여유 특징 수평 확장·무중단 수직 확장(재시작 동반) 클러스터 용량 확장 두음: 컨·노·오 — 컨트롤 플레인(api·etcd·스케줄러·컨트롤러) · 노드(kubelet·proxy) · 오브젝트(pod·deployment·service) hpa=개수, vpa=크기, ca=노드 — 지표·대상이 다르므로 함께 조합해 사용!"}, {"id": "cloud-service-types", "cat": "sw", "sub": "sw-dist", "parent": null, "t": "클라우드 서비스 유형", "s": "IaaS·PaaS·SaaS·FaaS·AIaaS", "stars": 0, "redStar": true, "full": "클라우드 서비스 유형 (IaaS·PaaS·SaaS·FaaS·AIaaS)", "catLabel": "SW공학·아키텍처", "st": "📌 복습 필요", "d": "2026-11-23", "def": "<p>클라우드 사업자가 <b>관리·제공하는 자원의 추상화 수준<\/b>에 따라 IaaS·PaaS·SaaS·FaaS·AIaaS로 구분되는 서비스 모델로, 위로 갈수록 사용자 관리 범위가 줄고 통제력은 낮아짐<\/p>", "kw": "<ul class=\"kw\"><li><b>IaaS<\/b>: 가상화된 서버·스토리지·네트워크 제공 — 사용자가 OS·미들웨어·앱 관리 (AWS EC2, GCE)<\/li><li><b>PaaS<\/b>: 런타임·미들웨어·DB를 관리형으로 제공 — 개발자는 앱·데이터에 집중 (Heroku, Cloud Foundry, App Engine)<\/li><li><b>SaaS<\/b>: 완성된 애플리케이션을 구독 사용 (MS 365, Salesforce, Google Workspace)<\/li><li><b>FaaS<\/b>: 이벤트 기반 함수 실행 — 서버·런타임 관리 불필요, 종량 과금 (AWS Lambda)<\/li><li><b>AIaaS<\/b>: 학습·추론 API와 ML 플랫폼·모델을 서비스로 제공 (SageMaker, Bedrock, OpenAI API)<\/li><li><b>책임 분할<\/b>: On-Prem → IaaS → PaaS → FaaS → SaaS 순으로 사용자 책임 축소, <b>통제력↓·편의성↑·벤더 종속↑<\/b><\/li><\/ul>", "pp": "<h4>1) 서비스 모델별 정리<\/h4>\n<div class=\"tblwrap\"><table class=\"cmp\"><colgroup><col style=\"width:24%\"><col style=\"width:28%\"><col style=\"width:48%\"><\/colgroup><thead><tr><th>서비스 모델<\/th><th>제공 범위(특징)<\/th><th>사용자 관리 범위 · 대표 예<\/th><\/tr><\/thead><tbody><tr><td class=\"k\">IaaS<\/td><td>가상 서버·스토리지·네트워크<\/td><td>OS·미들웨어·앱 — EC2, GCE<\/td><\/tr><tr><td class=\"k\">PaaS<\/td><td>런타임·미들웨어·DB<\/td><td>앱·데이터 — Heroku, App Engine<\/td><\/tr><tr><td class=\"k\">SaaS<\/td><td>완성 애플리케이션<\/td><td>사용·설정만 — MS365, Salesforce<\/td><\/tr><tr><td class=\"k\">FaaS<\/td><td>함수 실행 환경·이벤트 연동<\/td><td>함수 코드 — AWS Lambda<\/td><\/tr><tr><td class=\"k\">AIaaS<\/td><td>모델 API·ML 플랫폼<\/td><td>프롬프트·데이터·모델 선택 — Bedrock, SageMaker<\/td><\/tr><\/tbody><\/table><\/div>\n<h4>2) 책임 분할 비교<\/h4>\n<div class=\"tblwrap\"><table class=\"cmp\"><thead><tr><th>비교<\/th><th>IaaS<\/th><th>PaaS<\/th><th>SaaS<\/th><\/tr><\/thead><tbody><tr><td class=\"k\">사용자 책임<\/td><td>OS~앱<\/td><td>앱~데이터<\/td><td>데이터·계정<\/td><\/tr><tr><td class=\"k\">사업자 책임<\/td><td>가상화·물리<\/td><td>런타임·미들웨어<\/td><td>앱·인프라 전반<\/td><\/tr><tr><td class=\"k\">통제력·종속<\/td><td>통제↑ 종속↓<\/td><td>중간<\/td><td>통제↓ 종속↑<\/td><\/tr><\/tbody><\/table><\/div>", "rv": "<div class=\"q\"><b>두음: 아·파·사·함·에이<\/b> — IaaS·PaaS·SaaS·FaaS·AIaaS (인프라→플랫폼→소프트웨어→함수→AI)<\/div>\n<div class=\"q\"><b>\"위로 갈수록 편하다, 대신 묶인다\"<\/b> — 책임 축소 = 통제력 축소 = Lock-in 위험 증가!<\/div>", "img": "itpe-diagrams/99-cloud-service-types.webp", "txt": null, "search": "클라우드 서비스 유형 (iaas·paas·saas·faas·aiaas) 클라우드 서비스 유형 iaas·paas·saas·faas·aiaas sw공학·아키텍처 클라우드·msa·분산 빨간별 빨간 별 빨간색 별 ★ 레드별 심화반 심화 선택 클라우드 사업자가 관리·제공하는 자원의 추상화 수준 에 따라 iaas·paas·saas·faas·aiaas로 구분되는 서비스 모델로, 위로 갈수록 사용자 관리 범위가 줄고 통제력은 낮아짐 iaas : 가상화된 서버·스토리지·네트워크 제공 — 사용자가 os·미들웨어·앱 관리 (aws ec2, gce) paas : 런타임·미들웨어·db를 관리형으로 제공 — 개발자는 앱·데이터에 집중 (heroku, cloud foundry, app engine) saas : 완성된 애플리케이션을 구독 사용 (ms 365, salesforce, google workspace) faas : 이벤트 기반 함수 실행 — 서버·런타임 관리 불필요, 종량 과금 (aws lambda) aiaas : 학습·추론 api와 ml 플랫폼·모델을 서비스로 제공 (sagemaker, bedrock, openai api) 책임 분할 : on-prem → iaas → paas → faas → saas 순으로 사용자 책임 축소, 통제력↓·편의성↑·벤더 종속↑ 1) 서비스 모델별 정리 서비스 모델 제공 범위(특징) 사용자 관리 범위 · 대표 예 iaas 가상 서버·스토리지·네트워크 os·미들웨어·앱 — ec2, gce paas 런타임·미들웨어·db 앱·데이터 — heroku, app engine saas 완성 애플리케이션 사용·설정만 — ms365, salesforce faas 함수 실행 환경·이벤트 연동 함수 코드 — aws lambda aiaas 모델 api·ml 플랫폼 프롬프트·데이터·모델 선택 — bedrock, sagemaker 2) 책임 분할 비교 비교 iaas paas saas 사용자 책임 os~앱 앱~데이터 데이터·계정 사업자 책임 가상화·물리 런타임·미들웨어 앱·인프라 전반 통제력·종속 통제↑ 종속↓ 중간 통제↓ 종속↑ 두음: 아·파·사·함·에이 — iaas·paas·saas·faas·aiaas (인프라→플랫폼→소프트웨어→함수→ai) \"위로 갈수록 편하다, 대신 묶인다\" — 책임 축소 = 통제력 축소 = lock-in 위험 증가!"}, {"id": "multicloud", "cat": "sw", "sub": "sw-dist", "parent": null, "t": "멀티클라우드", "s": "Multi vs Hybrid · 이식성", "stars": 0, "redStar": true, "full": "멀티클라우드 (Multi-Cloud)", "catLabel": "SW공학·아키텍처", "st": "📌 복습 필요", "d": "2026-11-23", "def": "<p><b>2개 이상의 서로 다른 클라우드 사업자(CSP)<\/b>의 서비스를 목적에 따라 조합·통합 운영하는 전략으로, 단일 벤더 종속을 피하고 워크로드별 최적 배치·비용 절감·규제 대응을 달성하려는 아키텍처<\/p>", "kw": "<ul class=\"kw\"><li><b>도입 목적<\/b>: 벤더 종속(Lock-in) 회피, 워크로드별 최적 비용·성능, 데이터 레지던시 등 규제 대응, 재해 대책<\/li><li><b>멀티 vs 하이브리드<\/b>: 멀티클라우드 = <b>2개 이상 CSP<\/b>, 하이브리드 = <b>온프레미스 + 클라우드<\/b> (혼용 형태 존재)<\/li><li><b>운영 유형<\/b>: 사일로형(개별 운영) → 분산형(워크로드 분산) → 통합형(추상화 계층으로 단일 관리)<\/li><li><b>핵심 기술<\/b>: 통합 관리 플랫폼(CMP), <b>IaC(Infrastructure as Code)<\/b>, 컨테이너·K8s 이식성(Anthos·Azure Arc), ID 연합(SSO·Federation), 통합 관측성<\/li><li><b>IaC (코드형 인프라) 심화<\/b>:<ul class=\"kw\"><li><b>개념<\/b>: 서버·네트워크·스토리지 등 인프라 구성을 수작업 콘솔 대신 <b>선언적 코드<\/b>로 정의해 버전 관리(Git)·자동 프로비저닝하는 기법<\/li><li><b>핵심 4원리 (선·멱·불·상)<\/b>: <b>선언적<\/b>(최종 목표 상태 기술) · <b>멱등성<\/b>(반복 실행해도 동일 결과) · <b>불변 인프라<\/b>(수정 대신 교체) · <b>상태 관리<\/b>(State 파일 기반 변경 추적·Drift 탐지)<\/li><li><b>멀티클라우드 대표 도구<\/b>: <b>Terraform / OpenTofu<\/b>(HCL 기반 멀티 CSP Provider 지원), <b>Crossplane<\/b>(K8s 컨트롤러 기반 선언형 클라우드 리소스 관리), <b>Pulumi<\/b>(범용 언어 기반)<\/li><li><b>한계·보완<\/b>: 단일 IaC 도구를 써도 <b>CSP별 Provider 리소스 스키마는 달라<\/b> 완전한 무수정 이식은 어렵기 때문에 공통 모듈 추상화 + <b>Policy as Code(OPA)<\/b>로 보안·규정 준수 자동 검증 필수<\/li><\/ul><\/li><li><b>과제<\/b>: 이기종 API·비용 가시성, <b>데이터 전송 비용(Egress)<\/b>, 일관된 보안정책, 구간 지연, 운영 복잡도·전문인력<\/li><\/ul>", "pp": "<h4>1) 개념 비교 (멀티 vs 하이브리드 vs 단일)<\/h4>\n<div class=\"tblwrap\"><table class=\"cmp\"><thead><tr><th>비교<\/th><th>단일 클라우드<\/th><th>하이브리드 클라우드<\/th><th>멀티클라우드<\/th><\/tr><\/thead><tbody><tr><td class=\"k\">구성<\/td><td>1개 CSP<\/td><td>온프레미스 + 1개 CSP<\/td><td>2개 이상 CSP<\/td><\/tr><tr><td class=\"k\">장점<\/td><td>단순·통합 관리<\/td><td>기존 자산 활용·보안 통제<\/td><td>종속 회피·최적 배치<\/td><\/tr><tr><td class=\"k\">부담<\/td><td>종속·협상력 약화<\/td><td>연계 복잡·이중 운영<\/td><td>관리 복잡·전송 비용<\/td><\/tr><\/tbody><\/table><\/div>\n<h4>2) 상세 비교 (운영 관점)<\/h4>\n<div class=\"tblwrap\"><table class=\"cmp\"><colgroup><col style=\"width:24%\"><col style=\"width:28%\"><col style=\"width:48%\"><\/colgroup><thead><tr><th>구분<\/th><th>특징<\/th><th>설명<\/th><\/tr><\/thead><tbody><tr><td class=\"k\">비용<\/td><td>Egress 비용<\/td><td>CSP 간 데이터 이동료가 숨은 비용, 배치 설계로 최소화<\/td><\/tr><tr><td class=\"k\">이식성<\/td><td>추상화·컨테이너<\/td><td>K8s·IaC로 워크로드 이식성 확보, 관리형 서비스 의존 최소화<\/td><\/tr><tr><td class=\"k\">보안·거버넌스<\/td><td>일관 정책<\/td><td>IAM 연합·정책 표준화·통합 로그로 사각지대 제거<\/td><\/tr><\/tbody><\/table><\/div>\n<h4>3) 멀티클라우드 IaC 핵심 원리 (선·멱·불·상)<\/h4>\n<div class=\"tblwrap\"><table class=\"cmp\"><colgroup><col style=\"width:24%\"><col style=\"width:28%\"><col style=\"width:48%\"><\/colgroup><thead><tr><th>구분<\/th><th>핵심 내용<\/th><th>멀티클라우드 적용 포인트<\/th><\/tr><\/thead><tbody><tr><td class=\"k\">선언적 (Declarative)<\/td><td>절차(How)가 아닌 최종 상태(What) 기술<\/td><td>이기종 CSP API 차이를 코드 계층에서 일원화<\/td><\/tr><tr><td class=\"k\">멱등성 (Idempotency)<\/td><td>여러 번 실행해도 동일한 인프라 상태 유지<\/td><td>다중 리전·다중 CSP 환경 재배포 시 오류 방지<\/td><\/tr><tr><td class=\"k\">불변성 (Immutable)<\/td><td>운영 중 수동 변경 금지, 새 이미지·코드로 교체<\/td><td>구성 편차(Configuration Drift) 원천 차단<\/td><\/tr><tr><td class=\"k\">상태·정책 (State·PaC)<\/td><td>State 잠금·드리프트 탐지 + OPA 정책 검증<\/td><td>State 민감정보 암호화 및 CSP별 보안 컴플라이언스 통제<\/td><\/tr><\/tbody><\/table><\/div>", "rv": "<div class=\"q\"><b>두음: 종·최·규 (목적) / 선·멱·불·상 (IaC 4원리)<\/b> — 종속 회피·최적 배치·규제 대응 / 선언·멱등·불변·상태관리<\/div>\n<div class=\"q\"><b>\"멀티 = CSP 2개 이상, 하이브리드 = 온프레미스 + 클라우드\"<\/b> — 정의 구분이 1교시 포인트!<\/div>", "img": "itpe-diagrams/100-multicloud.webp", "txt": null, "search": "멀티클라우드 (multi-cloud) 멀티클라우드 multi vs hybrid · 이식성 sw공학·아키텍처 클라우드·msa·분산 빨간별 빨간 별 빨간색 별 ★ 레드별 심화반 심화 선택 2개 이상의 서로 다른 클라우드 사업자(csp) 의 서비스를 목적에 따라 조합·통합 운영하는 전략으로, 단일 벤더 종속을 피하고 워크로드별 최적 배치·비용 절감·규제 대응을 달성하려는 아키텍처 도입 목적 : 벤더 종속(lock-in) 회피, 워크로드별 최적 비용·성능, 데이터 레지던시 등 규제 대응, 재해 대책 멀티 vs 하이브리드 : 멀티클라우드 = 2개 이상 csp , 하이브리드 = 온프레미스 + 클라우드 (혼용 형태 존재) 운영 유형 : 사일로형(개별 운영) → 분산형(워크로드 분산) → 통합형(추상화 계층으로 단일 관리) 핵심 기술 : 통합 관리 플랫폼(cmp), iac(infrastructure as code) , 컨테이너·k8s 이식성(anthos·azure arc), id 연합(sso·federation), 통합 관측성 iac (코드형 인프라) 심화 : 개념 : 서버·네트워크·스토리지 등 인프라 구성을 수작업 콘솔 대신 선언적 코드 로 정의해 버전 관리(git)·자동 프로비저닝하는 기법 핵심 4원리 (선·멱·불·상) : 선언적 (최종 목표 상태 기술) · 멱등성 (반복 실행해도 동일 결과) · 불변 인프라 (수정 대신 교체) · 상태 관리 (state 파일 기반 변경 추적·drift 탐지) 멀티클라우드 대표 도구 : terraform / opentofu (hcl 기반 멀티 csp provider 지원), crossplane (k8s 컨트롤러 기반 선언형 클라우드 리소스 관리), pulumi (범용 언어 기반) 한계·보완 : 단일 iac 도구를 써도 csp별 provider 리소스 스키마는 달라 완전한 무수정 이식은 어렵기 때문에 공통 모듈 추상화 + policy as code(opa) 로 보안·규정 준수 자동 검증 필수 과제 : 이기종 api·비용 가시성, 데이터 전송 비용(egress) , 일관된 보안정책, 구간 지연, 운영 복잡도·전문인력 1) 개념 비교 (멀티 vs 하이브리드 vs 단일) 비교 단일 클라우드 하이브리드 클라우드 멀티클라우드 구성 1개 csp 온프레미스 + 1개 csp 2개 이상 csp 장점 단순·통합 관리 기존 자산 활용·보안 통제 종속 회피·최적 배치 부담 종속·협상력 약화 연계 복잡·이중 운영 관리 복잡·전송 비용 2) 상세 비교 (운영 관점) 구분 특징 설명 비용 egress 비용 csp 간 데이터 이동료가 숨은 비용, 배치 설계로 최소화 이식성 추상화·컨테이너 k8s·iac로 워크로드 이식성 확보, 관리형 서비스 의존 최소화 보안·거버넌스 일관 정책 iam 연합·정책 표준화·통합 로그로 사각지대 제거 3) 멀티클라우드 iac 핵심 원리 (선·멱·불·상) 구분 핵심 내용 멀티클라우드 적용 포인트 선언적 (declarative) 절차(how)가 아닌 최종 상태(what) 기술 이기종 csp api 차이를 코드 계층에서 일원화 멱등성 (idempotency) 여러 번 실행해도 동일한 인프라 상태 유지 다중 리전·다중 csp 환경 재배포 시 오류 방지 불변성 (immutable) 운영 중 수동 변경 금지, 새 이미지·코드로 교체 구성 편차(configuration drift) 원천 차단 상태·정책 (state·pac) state 잠금·드리프트 탐지 + opa 정책 검증 state 민감정보 암호화 및 csp별 보안 컴플라이언스 통제 두음: 종·최·규 (목적) / 선·멱·불·상 (iac 4원리) — 종속 회피·최적 배치·규제 대응 / 선언·멱등·불변·상태관리 \"멀티 = csp 2개 이상, 하이브리드 = 온프레미스 + 클라우드\" — 정의 구분이 1교시 포인트!"}, {"id": "soap-rest-openapi", "cat": "sw", "sub": "sw-native", "parent": null, "t": "SOAP vs REST · Open API", "s": "WSDL vs 자원URI · API 보안", "stars": 0, "redStar": true, "full": "SOAP vs REST · Open API 보안", "catLabel": "SW공학·아키텍처", "st": "📌 복습 필요", "d": "2026-11-23", "def": "<p>네트워크 상에서 서비스 기능을 호출·교환하는 대표 방식인 <b>SOAP(엄격한 XML 메시지 프로토콜)<\/b>과 <b>REST(HTTP 자원 중심 아키텍처 스타일)<\/b>의 차이와, 외부에 개방하는 <b>Open API의 보안 체계<\/b><\/p>", "kw": "<ul class=\"kw\"><li><b>SOAP<\/b>: XML <b>Envelope<\/b>·<b>WSDL<\/b> 계약·<b>WS-Security<\/b>, WS-* 표준(신뢰성·트랜잭션·주소지정), 엄격한 형식·높은 상호운용성, 무겁고 복잡 — 금융·공공 연계<\/li><li><b>REST<\/b>: <b>자원(URI) + HTTP 메서드(GET·POST·PUT·DELETE) + 표현(JSON)<\/b>, 무상태성·캐시 가능성·계층화·일관된 인터페이스, 경량·확장성 — 웹·모바일<\/li><li><b>Open API<\/b>: 외부에 공개한 API — <b>OAS(OpenAPI Specification)<\/b>로 계약 문서화, API Gateway로 게시·정책 적용<\/li><li><b>API 보안<\/b>: OAuth 2.0/OIDC 인가·인증, API Key + <b>Rate Limit<\/b>·Quota, mTLS, JWT 서명검증, 입력 검증<\/li><li><b>OWASP API Top 10<\/b>: <b>BOLA(객체 수준 인가 결함)<\/b>·BFLA·과도한 데이터 노출·자원 소진 등 API 고유 취약점<\/li><\/ul>", "pp": "<h4>1) 개념 비교 (SOAP vs REST)<\/h4>\n<div class=\"tblwrap\"><table class=\"cmp\"><colgroup><col style=\"width:24%\"><col style=\"width:28%\"><col style=\"width:48%\"><\/colgroup><thead><tr><th>비교<\/th><th>SOAP<\/th><th>REST<\/th><\/tr><\/thead><tbody><tr><td class=\"k\">프로토콜·형식<\/td><td>XML 메시지·WSDL 계약<\/td><td>HTTP + URI·JSON<\/td><\/tr><tr><td class=\"k\">상태·결합<\/td><td>상태 유지 가능·강결합<\/td><td>무상태·느슨한 결합<\/td><\/tr><tr><td class=\"k\">보안<\/td><td>WS-Security (메시지 레벨)<\/td><td>TLS·OAuth 2.0 (전송·토큰 레벨)<\/td><\/tr><\/tbody><\/table><\/div>\n<h4>2) 상세 비교 (적용·운영 관점)<\/h4>\n<div class=\"tblwrap\"><table class=\"cmp\"><colgroup><col style=\"width:24%\"><col style=\"width:28%\"><col style=\"width:48%\"><\/colgroup><thead><tr><th>구분<\/th><th>SOAP<\/th><th>REST<\/th><\/tr><\/thead><tbody><tr><td class=\"k\">성능·무게<\/td><td>XML 파싱 부담·무거움<\/td><td>경량·캐시 활용<\/td><\/tr><tr><td class=\"k\">적합 영역<\/td><td>트랜잭션·보안 요구가 높은 기간계 연계<\/td><td>웹·모바일·MSA·공개 API<\/td><\/tr><tr><td class=\"k\">Open API<\/td><td>WS-* 표준 기반<\/td><td>OAS 문서 + API Gateway<\/td><\/tr><\/tbody><\/table><\/div>", "rv": "<div class=\"q\"><b>두음: 엄·계·무<\/b>(SOAP) — 엄격XML · 계약WSDL · 무거움 &nbsp;|&nbsp; <b>경·자·무<\/b>(REST) — 경량 · 자원URI · 무상태<\/div>\n<div class=\"q\"><b>Open API 보안 3종<\/b>: 인증(OAuth2/OIDC) + 인가(BOLA 방지) + 가용성(Rate Limit)!<\/div>", "img": "itpe-diagrams/102-soap-rest-openapi.webp", "txt": null, "search": "soap vs rest · open api 보안 soap vs rest · open api wsdl vs 자원uri · api 보안 sw공학·아키텍처 클라우드 네이티브·api 빨간별 빨간 별 빨간색 별 ★ 레드별 심화반 심화 선택 네트워크 상에서 서비스 기능을 호출·교환하는 대표 방식인 soap(엄격한 xml 메시지 프로토콜) 과 rest(http 자원 중심 아키텍처 스타일) 의 차이와, 외부에 개방하는 open api의 보안 체계 soap : xml envelope · wsdl 계약· ws-security , ws-* 표준(신뢰성·트랜잭션·주소지정), 엄격한 형식·높은 상호운용성, 무겁고 복잡 — 금융·공공 연계 rest : 자원(uri) + http 메서드(get·post·put·delete) + 표현(json) , 무상태성·캐시 가능성·계층화·일관된 인터페이스, 경량·확장성 — 웹·모바일 open api : 외부에 공개한 api — oas(openapi specification) 로 계약 문서화, api gateway로 게시·정책 적용 api 보안 : oauth 2.0/oidc 인가·인증, api key + rate limit ·quota, mtls, jwt 서명검증, 입력 검증 owasp api top 10 : bola(객체 수준 인가 결함) ·bfla·과도한 데이터 노출·자원 소진 등 api 고유 취약점 1) 개념 비교 (soap vs rest) 비교 soap rest 프로토콜·형식 xml 메시지·wsdl 계약 http + uri·json 상태·결합 상태 유지 가능·강결합 무상태·느슨한 결합 보안 ws-security (메시지 레벨) tls·oauth 2.0 (전송·토큰 레벨) 2) 상세 비교 (적용·운영 관점) 구분 soap rest 성능·무게 xml 파싱 부담·무거움 경량·캐시 활용 적합 영역 트랜잭션·보안 요구가 높은 기간계 연계 웹·모바일·msa·공개 api open api ws-* 표준 기반 oas 문서 + api gateway 두음: 엄·계·무 (soap) — 엄격xml · 계약wsdl · 무거움 &nbsp;|&nbsp; 경·자·무 (rest) — 경량 · 자원uri · 무상태 open api 보안 3종 : 인증(oauth2/oidc) + 인가(bola 방지) + 가용성(rate limit)!"}, {"id": "rag", "cat": "ai", "sub": "ai-llm", "parent": null, "t": "RAG", "s": "검색 증강 생성", "stars": 2, "redStar": false, "full": "RAG (Retrieval-Augmented Generation)", "catLabel": "AI·데이터", "st": "🔄 확인 중", "d": "2026-11-19", "def": "<p>LLM의 한계를 보완하기 위해 <b>외부 지식 저장소에서 관련 문서를 검색(Retrieval)<\/b> 해 프롬프트를 <b>증강(Augmentation)<\/b> 한 뒤 답변을 <b>생성(Generation)<\/b> 하는 아키텍처<\/p>", "kw": "<ul class=\"kw\"><li><b>등장 배경(LLM 한계)<\/b>: <code>환각(Hallucination)<\/code>, <code>최신성 부족(Knowledge Cutoff)<\/code>, <code>기업 비공개 데이터 미반영<\/code>, 파인튜닝 비용<\/li><li><b>동작 순서<\/b><ul class=\"kw\"><li>1. 인덱싱: <code>Chunking<\/code> → <code>임베딩(Embedding)<\/code> → <code>Vector DB<\/code> 저장<\/li><li>2. 질의: 질문 임베딩 → <code>Vector DB<\/code> 유사도 검색 → 검색 결과로 프롬프트 증강 → <code>LLM<\/code> 답변 생성<\/li><\/ul><\/li><li><b>고도화 기법<\/b>: <code>Hybrid Search<\/code>(키워드 + 시맨틱), <code>Reranking<\/code>, <code>Query Rewriting / HyDE<\/code>, <code>GraphRAG<\/code>, 출처 인용(Citation)<\/li><\/ul>", "pp": "<div class=\"tblwrap\"><table class=\"cmp\"><colgroup><col style=\"width:24%\"><col style=\"width:28%\"><col style=\"width:48%\"><\/colgroup><thead><tr><th>관점(측면)<\/th><th>특징<\/th><th>설명<\/th><\/tr><\/thead><tbody><tr><td class=\"k\">지식 소스<\/td><td>외부 검색 저장소<\/td><td>벡터 DB·문서 저장소로 최신·비공개 지식을 보완해 지식 컷오프와 환각을 줄임<\/td><\/tr><tr><td class=\"k\">파이프라인<\/td><td>인덱싱·질의<\/td><td>Chunking→임베딩→Vector DB 저장, 질의 임베딩→유사도 검색→프롬프트 증강→생성<\/td><\/tr><tr><td class=\"k\">품질 향상<\/td><td>Hybrid·Rerank<\/td><td>키워드+시맨틱 혼합 검색과 재순위화, Query Rewriting·HyDE로 검색 정확도를 끌어올림<\/td><\/tr><tr><td class=\"k\">한계·보완<\/td><td>검색 품질 의존<\/td><td>청킹·검색 실패가 답변 품질을 좌우하므로 출처 인용·GraphRAG로 신뢰성을 보강<\/td><\/tr><\/tbody><\/table><\/div>", "rv": "<div class=\"q\"><b>두음: 청·임·벡 / 검·증·생<\/b> — 청(Chunking)·임(임베딩)·벡(Vector DB) / 검(검색)·증(증강)·생(생성)<\/div>\n<div class=\"q\">질의가 <b>벡터 DB 검색을 먼저 거친 뒤<\/b> 증강된 프롬프트가 LLM에 들어가는 순서를 기억하기. \"검색 → 증강 → 생성\".<\/div>", "img": "itpe-diagrams/20-rag.webp", "txt": null, "search": "rag (retrieval-augmented generation) rag 검색 증강 생성 ai·데이터 llm·rag·에이전트 ⭐⭐ 기출빈출 기출 빈출 중요 llm의 한계를 보완하기 위해 외부 지식 저장소에서 관련 문서를 검색(retrieval) 해 프롬프트를 증강(augmentation) 한 뒤 답변을 생성(generation) 하는 아키텍처 등장 배경(llm 한계) : 환각(hallucination) , 최신성 부족(knowledge cutoff) , 기업 비공개 데이터 미반영 , 파인튜닝 비용 동작 순서 1. 인덱싱: chunking → 임베딩(embedding) → vector db 저장 2. 질의: 질문 임베딩 → vector db 유사도 검색 → 검색 결과로 프롬프트 증강 → llm 답변 생성 고도화 기법 : hybrid search (키워드 + 시맨틱), reranking , query rewriting / hyde , graphrag , 출처 인용(citation) 관점(측면) 특징 설명 지식 소스 외부 검색 저장소 벡터 db·문서 저장소로 최신·비공개 지식을 보완해 지식 컷오프와 환각을 줄임 파이프라인 인덱싱·질의 chunking→임베딩→vector db 저장, 질의 임베딩→유사도 검색→프롬프트 증강→생성 품질 향상 hybrid·rerank 키워드+시맨틱 혼합 검색과 재순위화, query rewriting·hyde로 검색 정확도를 끌어올림 한계·보완 검색 품질 의존 청킹·검색 실패가 답변 품질을 좌우하므로 출처 인용·graphrag로 신뢰성을 보강 두음: 청·임·벡 / 검·증·생 — 청(chunking)·임(임베딩)·벡(vector db) / 검(검색)·증(증강)·생(생성) 질의가 벡터 db 검색을 먼저 거친 뒤 증강된 프롬프트가 llm에 들어가는 순서를 기억하기. \"검색 → 증강 → 생성\"."}, {"id": "rag-reranker", "cat": "ai", "sub": "ai-llm", "parent": "rag", "t": "RAG 리랭커", "s": "2-Stage Retrieval · Bi vs Cross", "stars": 2, "redStar": false, "full": "RAG 리랭커 (Re-ranker) · 2-Stage Retrieval", "catLabel": "AI·데이터", "st": "📌 복습 필요", "d": "2026-11-25", "def": "<p><b>리랭커(Re-ranker)<\/b>는 RAG 파이프라인에서 1차 벡터 검색(<b>Bi-Encoder<\/b>, 재현율)이 추출한 후보 문서를 <b>질의-문서 쌍(Pair) 단위로 재평가<\/b>(<b>Cross-Encoder<\/b>, 정밀도)하여 최종 순위를 정밀화하는 <b>2단계 검색(2-Stage Retrieval) 핵심 모듈<\/b><\/p>", "kw": "<ul class=\"kw\"><li><b>Bi-Encoder (1단계)<\/b>: 질의·문서를 각각 독립 인코딩해 벡터 유사도(ANN)로 검색 — 문서 벡터 사전 계산 가능, 속도 우선, <b>Recall<\/b> 담당<\/li><li><b>Cross-Encoder (2단계)<\/b>: 질의와 문서를 하나의 입력으로 넣고 <b>Cross-Attention<\/b>으로 상호작용을 계산 — 정확도 우선, <b>Precision<\/b> 담당, 전체 문서 대상 실시간 적용 불가<\/li><li><b>2-Stage Retrieval<\/b>: ① 후보 수집 Top-K(100~1,000건) → ② 리랭킹 Top-N(3~10건) → ③ 프롬프트 컨텍스트 주입<\/li><li><b>RRF (Reciprocal Rank Fusion)<\/b>: BM25·벡터 등 여러 검색기의 순위를 <b>1/(k+rank)<\/b>로 합산해 단일 순위로 융합 (하이브리드 검색)<\/li><li><b>MMR (Maximal Marginal Relevance)<\/b>: 관련성과 후보 간 <b>다양성<\/b>을 함께 고려해 중복 문서를 제거<\/li><li><b>LLM Reranker · ColBERT(Late Interaction)<\/b>: LLM 점수화·토큰 단위 상호작용으로 품질과 비용을 절충<\/li><\/ul>", "pp": "<h4>1) Bi-Encoder vs Cross-Encoder 비교<\/h4>\n<div class=\"tblwrap\"><table class=\"cmp\"><colgroup><col style=\"width:24%\"><col style=\"width:28%\"><col style=\"width:48%\"><\/colgroup><thead><tr><th>구분<\/th><th>Bi-Encoder (1단계)<\/th><th>Cross-Encoder (2단계)<\/th><\/tr><\/thead><tbody><tr><td class=\"k\">구조<\/td><td>질의·문서 독립 인코딩(이중 타워)<\/td><td>질의·문서 동시 입력(단일 트랜스포머)<\/td><\/tr><tr><td class=\"k\">유사도 산출<\/td><td>벡터 내적·코사인 유사도(ANN)<\/td><td>문장 쌍 분류 점수(Relevance Score)<\/td><\/tr><tr><td class=\"k\">속도<\/td><td>문서 사전 인덱싱, 밀리초·대량 처리<\/td><td>쌍마다 추론, 후보 수에 비례(수십~수백 ms)<\/td><\/tr><tr><td class=\"k\">정확도<\/td><td>의미 유사도 중심, 어휘 불일치에 강함<\/td><td>질의-문서 상호작용 반영, 정밀 판단 우수<\/td><\/tr><tr><td class=\"k\">역할<\/td><td>후보 폭 확보(Recall 극대화)<\/td><td>최종 순위 확정(Precision 극대화)<\/td><\/tr><tr><td class=\"k\">제약<\/td><td>문맥 상호작용 미반영<\/td><td>전체 문서 대상 재계산 불가<\/td><\/tr><\/tbody><\/table><\/div>\n<h4>2) 설계·운영 고려사항<\/h4>\n<div class=\"tblwrap\"><table class=\"cmp\"><colgroup><col style=\"width:24%\"><col style=\"width:28%\"><col style=\"width:48%\"><\/colgroup><thead><tr><th>구분<\/th><th>키워드<\/th><th>설명<\/th><\/tr><\/thead><tbody><tr><td class=\"k\">후보 폭<\/td><td>Top-K 튜닝<\/td><td>K가 작으면 정답 누락(Recall↓), 크면 리랭킹 지연·비용 증가 — 평가로 최적 K 결정<\/td><\/tr><tr><td class=\"k\">지연<\/td><td>캐시·배치·경량화<\/td><td>P95 지연 예산 안에서 배치 추론·ONNX·양자화·GPU 사용, 리랭킹 구간 분리 측정<\/td><\/tr><tr><td class=\"k\">비용<\/td><td>모델 계층화<\/td><td>LLM 리랭커는 품질↑ 비용↑ → 경량 Cross-Encoder 1차 + LLM 2차의 계층 결합<\/td><\/tr><tr><td class=\"k\">평가<\/td><td>Recall@K·nDCG·MRR<\/td><td>검색 단계와 리랭킹 단계를 분리 측정해 병목 지점 판별<\/td><\/tr><tr><td class=\"k\">품질<\/td><td>중복·다양성<\/td><td>MMR·중복 제거로 같은 출처 문서가 컨텍스트를 잠식하지 않게 관리<\/td><\/tr><tr><td class=\"k\">운영<\/td><td>모델 드리프트<\/td><td>도메인 변화 시 재학습·프롬프트 버전 관리, A/B로 리랭커 교체 검증<\/td><\/tr><\/tbody><\/table><\/div>", "rv": "<div class=\"q\"><b>두음: 비·크 / 회·정<\/b> — Bi-Encoder·Cross-Encoder / Recall·Precision<\/div>\n<div class=\"q\"><b>\"1단계는 넓게(Bi-Encoder·Recall), 2단계는 정확하게(Cross-Encoder·Precision)\"<\/b><\/div>", "img": "itpe-diagrams/118-rag-reranker.webp", "txt": null, "search": "rag 리랭커 (re-ranker) · 2-stage retrieval rag 리랭커 2-stage retrieval · bi vs cross ai·데이터 llm·rag·에이전트 ⭐⭐ 기출빈출 기출 빈출 중요 리랭커(re-ranker) 는 rag 파이프라인에서 1차 벡터 검색( bi-encoder , 재현율)이 추출한 후보 문서를 질의-문서 쌍(pair) 단위로 재평가 ( cross-encoder , 정밀도)하여 최종 순위를 정밀화하는 2단계 검색(2-stage retrieval) 핵심 모듈 bi-encoder (1단계) : 질의·문서를 각각 독립 인코딩해 벡터 유사도(ann)로 검색 — 문서 벡터 사전 계산 가능, 속도 우선, recall 담당 cross-encoder (2단계) : 질의와 문서를 하나의 입력으로 넣고 cross-attention 으로 상호작용을 계산 — 정확도 우선, precision 담당, 전체 문서 대상 실시간 적용 불가 2-stage retrieval : ① 후보 수집 top-k(100~1,000건) → ② 리랭킹 top-n(3~10건) → ③ 프롬프트 컨텍스트 주입 rrf (reciprocal rank fusion) : bm25·벡터 등 여러 검색기의 순위를 1/(k+rank) 로 합산해 단일 순위로 융합 (하이브리드 검색) mmr (maximal marginal relevance) : 관련성과 후보 간 다양성 을 함께 고려해 중복 문서를 제거 llm reranker · colbert(late interaction) : llm 점수화·토큰 단위 상호작용으로 품질과 비용을 절충 1) bi-encoder vs cross-encoder 비교 구분 bi-encoder (1단계) cross-encoder (2단계) 구조 질의·문서 독립 인코딩(이중 타워) 질의·문서 동시 입력(단일 트랜스포머) 유사도 산출 벡터 내적·코사인 유사도(ann) 문장 쌍 분류 점수(relevance score) 속도 문서 사전 인덱싱, 밀리초·대량 처리 쌍마다 추론, 후보 수에 비례(수십~수백 ms) 정확도 의미 유사도 중심, 어휘 불일치에 강함 질의-문서 상호작용 반영, 정밀 판단 우수 역할 후보 폭 확보(recall 극대화) 최종 순위 확정(precision 극대화) 제약 문맥 상호작용 미반영 전체 문서 대상 재계산 불가 2) 설계·운영 고려사항 구분 키워드 설명 후보 폭 top-k 튜닝 k가 작으면 정답 누락(recall↓), 크면 리랭킹 지연·비용 증가 — 평가로 최적 k 결정 지연 캐시·배치·경량화 p95 지연 예산 안에서 배치 추론·onnx·양자화·gpu 사용, 리랭킹 구간 분리 측정 비용 모델 계층화 llm 리랭커는 품질↑ 비용↑ → 경량 cross-encoder 1차 + llm 2차의 계층 결합 평가 recall@k·ndcg·mrr 검색 단계와 리랭킹 단계를 분리 측정해 병목 지점 판별 품질 중복·다양성 mmr·중복 제거로 같은 출처 문서가 컨텍스트를 잠식하지 않게 관리 운영 모델 드리프트 도메인 변화 시 재학습·프롬프트 버전 관리, a/b로 리랭커 교체 검증 두음: 비·크 / 회·정 — bi-encoder·cross-encoder / recall·precision \"1단계는 넓게(bi-encoder·recall), 2단계는 정확하게(cross-encoder·precision)\""}, {"id": "self-corrective-rag", "cat": "ai", "sub": "ai-llm", "parent": "rag", "t": "자기교정 RAG", "s": "Self-RAG·CRAG·Adaptive", "stars": 1, "redStar": false, "full": "자기교정 RAG (Self-RAG · CRAG · Adaptive RAG)", "catLabel": "AI·데이터", "st": "📌 복습 필요", "d": "2026-11-25", "def": "<p><b>자기교정 RAG(Self-Corrective RAG)<\/b>는 검색·생성 결과를 모델 스스로 <b>평가(Reflect)<\/b>해 <b>재검색·재생성<\/b>하는 RAG 계열. <b>Self-RAG<\/b>는 반성 토큰으로 검색 필요성·관련성·지지성을 판단하고, <b>CRAG<\/b>는 검색 결과를 <b>Correct/Incorrect/Ambiguous<\/b>로 평가해 틀리면 웹 검색으로 교정하며, <b>Adaptive RAG<\/b>는 질의 난이도를 먼저 분류해 검색 자체를 생략하는 <b>자기교정 검색증강생성 기법<\/b>.<\/p>", "kw": "<ul class=\"kw\"><li><b>Self-RAG<\/b>: <b>Reflection Token<\/b> — Retrieve(검색 필요) · ISREL(관련성) · ISSUP(지지성) · ISUSE(유용성)를 학습해 생성 중 스스로 제어<\/li><li><b>CRAG (Corrective RAG)<\/b>: 경량 <b>Retrieval Evaluator<\/b>가 문서를 Correct/Incorrect/Ambiguous로 분류 → <b>Decompose-Then-Recompose<\/b> 지식 정제, 부족분은 웹 검색 보강<\/li><li><b>Adaptive RAG<\/b>: 질의 복잡도 분류기(Simple·Moderate·Complex) → <b>No Retrieval / Single-step / Multi-step<\/b> 라우팅<\/li><li><b>공통 루프<\/b>: Retrieve → Evaluate → Correct(재검색) → Generate → Verify(재생성)<\/li><li><b>평가 지표<\/b>: Faithfulness(근거 충실성)·Answer Relevance·Context Precision/Recall (RAGAS)<\/li><li><b>비용·지연<\/b>: 평가·재검색마다 LLM 호출 증가 → 소형 크리틱·캐시·최대 반복 횟수로 상한 설정<\/li><li><b>종료 조건<\/b>: 최대 반복·신뢰도 임계값 필수 — 없으면 <b>무한 교정 루프<\/b>에 빠진다<\/li><\/ul>", "pp": "<h4>1) Self-RAG vs CRAG vs Adaptive RAG (비교모듈: 목·데·비·최·보·환)<\/h4>\n<div class=\"tblwrap\"><table class=\"cmp\"><thead><tr><th>구분<\/th><th>Self-RAG<\/th><th>CRAG<\/th><th>Adaptive RAG<\/th><\/tr><\/thead><tbody><tr><td class=\"k\">목적<\/td><td>생성 중 성찰로 불필요 검색·무근거 생성 억제<\/td><td>검색 결과가 틀렸을 때 교정<\/td><td>질의 난이도별 검색 전략 선택<\/td><\/tr><tr><td class=\"k\">데이터 요구<\/td><td>반성 토큰으로 학습된 LM + 내부 인덱스<\/td><td>내부 인덱스 + 웹 검색(보강)<\/td><td>내부 인덱스 + 난이도 라벨(분류기 학습)<\/td><\/tr><tr><td class=\"k\">비용<\/td><td>생성 시 반성 토큰 추론(추가 호출 없음)<\/td><td>평가 모델 1회 + 필요 시 웹 호출<\/td><td>분류기 1회 — 평균 비용 최소<\/td><\/tr><tr><td class=\"k\">최신성<\/td><td>인덱스 갱신 주기에 종속<\/td><td>웹 검색으로 최신성 보완<\/td><td>질의 유형에 따라 선택적 반영<\/td><\/tr><tr><td class=\"k\">보안·프라이버시<\/td><td>내부 문서만 사용, 통제 용이<\/td><td>외부 웹 전송 시 정보 유출 주의<\/td><td>정책상 외부 호출 최소화 가능<\/td><\/tr><tr><td class=\"k\">신뢰성(환각)<\/td><td>ISSUP 검증으로 인용 근거 확보<\/td><td>오검색·구식 문서 교정에 강함<\/td><td>단순 질의 과잉 검색·환각 동시 억제<\/td><\/tr><\/tbody><\/table><\/div>\n<h4>2) 구성요소와 동작 흐름<\/h4>\n<div class=\"tblwrap\"><table class=\"cmp\"><colgroup><col style=\"width:24%\"><col style=\"width:28%\"><col style=\"width:48%\"><\/colgroup><thead><tr><th>구분<\/th><th>구성요소<\/th><th>역할<\/th><\/tr><\/thead><tbody><tr><td class=\"k\">판단<\/td><td>Reflection Token / Evaluator / Router<\/td><td>검색 필요성·문서 관련성·질의 난이도 판정<\/td><\/tr><tr><td class=\"k\">교정<\/td><td>재검색·웹 검색·지식 정제<\/td><td>부족·오류 컨텍스트를 보완하거나 폐기<\/td><\/tr><tr><td class=\"k\">생성<\/td><td>Generator<\/td><td>검증된 컨텍스트로 답변·인용 생성<\/td><\/tr><tr><td class=\"k\">검증<\/td><td>Faithfulness·ISSUP<\/td><td>근거 없는 문장 차단, 재생성 트리거<\/td><\/tr><tr><td class=\"k\">관측<\/td><td>Trace·토큰·지연 로그<\/td><td>교정 횟수·비용·품질을 함께 모니터링<\/td><\/tr><\/tbody><\/table><\/div>\n<h4>3) 도입 고려사항<\/h4>\n<div class=\"tblwrap\"><table class=\"cmp\"><colgroup><col style=\"width:24%\"><col style=\"width:28%\"><col style=\"width:48%\"><\/colgroup><thead><tr><th>구분<\/th><th>키워드<\/th><th>설명<\/th><\/tr><\/thead><tbody><tr><td class=\"k\">지연<\/td><td>평가 단계 분리<\/td><td>평가는 소형 모델·비동기로, 사용자 응답 경로에서 분리<\/td><\/tr><tr><td class=\"k\">비용<\/td><td>라우팅 우선<\/td><td>Adaptive로 불필요 검색을 먼저 제거하고 교정은 예외적으로<\/td><\/tr><tr><td class=\"k\">품질<\/td><td>평가셋 구축<\/td><td>교정이 실제로 정답률을 올리는지 A/B로 검증(교정 전후 비교)<\/td><\/tr><tr><td class=\"k\">안전<\/td><td>외부 검색 통제<\/td><td>웹 검색 허용 도메인·민감정보 마스킹, 프롬프트 인젝션 필터<\/td><\/tr><tr><td class=\"k\">운영<\/td><td>루프 상한·폴백<\/td><td>최대 2~3회 교정 후 \"확인 불가\"로 정직하게 응답<\/td><\/tr><\/tbody><\/table><\/div>", "rv": "<div class=\"q\"><b>두음: 자·씨·어<\/b> — Self-RAG·CRAG·Adaptive RAG / <b>검·평·교·생<\/b> — 검색·평가·교정·생성<\/div>\n<div class=\"q\"><b>\"검색 전은 라우팅(Adaptive), 검색 후는 교정(CRAG), 생성 중은 성찰(Self-RAG)\"<\/b><\/div>", "img": "itpe-diagrams/131-self-corrective-rag.webp", "txt": null, "search": "자기교정 rag (self-rag · crag · adaptive rag) 자기교정 rag self-rag·crag·adaptive ai·데이터 llm·rag·에이전트 ⭐ 기출빈출 기출 빈출 중요 자기교정 rag(self-corrective rag) 는 검색·생성 결과를 모델 스스로 평가(reflect) 해 재검색·재생성 하는 rag 계열. self-rag 는 반성 토큰으로 검색 필요성·관련성·지지성을 판단하고, crag 는 검색 결과를 correct/incorrect/ambiguous 로 평가해 틀리면 웹 검색으로 교정하며, adaptive rag 는 질의 난이도를 먼저 분류해 검색 자체를 생략하는 자기교정 검색증강생성 기법 . self-rag : reflection token — retrieve(검색 필요) · isrel(관련성) · issup(지지성) · isuse(유용성)를 학습해 생성 중 스스로 제어 crag (corrective rag) : 경량 retrieval evaluator 가 문서를 correct/incorrect/ambiguous로 분류 → decompose-then-recompose 지식 정제, 부족분은 웹 검색 보강 adaptive rag : 질의 복잡도 분류기(simple·moderate·complex) → no retrieval / single-step / multi-step 라우팅 공통 루프 : retrieve → evaluate → correct(재검색) → generate → verify(재생성) 평가 지표 : faithfulness(근거 충실성)·answer relevance·context precision/recall (ragas) 비용·지연 : 평가·재검색마다 llm 호출 증가 → 소형 크리틱·캐시·최대 반복 횟수로 상한 설정 종료 조건 : 최대 반복·신뢰도 임계값 필수 — 없으면 무한 교정 루프 에 빠진다 1) self-rag vs crag vs adaptive rag (비교모듈: 목·데·비·최·보·환) 구분 self-rag crag adaptive rag 목적 생성 중 성찰로 불필요 검색·무근거 생성 억제 검색 결과가 틀렸을 때 교정 질의 난이도별 검색 전략 선택 데이터 요구 반성 토큰으로 학습된 lm + 내부 인덱스 내부 인덱스 + 웹 검색(보강) 내부 인덱스 + 난이도 라벨(분류기 학습) 비용 생성 시 반성 토큰 추론(추가 호출 없음) 평가 모델 1회 + 필요 시 웹 호출 분류기 1회 — 평균 비용 최소 최신성 인덱스 갱신 주기에 종속 웹 검색으로 최신성 보완 질의 유형에 따라 선택적 반영 보안·프라이버시 내부 문서만 사용, 통제 용이 외부 웹 전송 시 정보 유출 주의 정책상 외부 호출 최소화 가능 신뢰성(환각) issup 검증으로 인용 근거 확보 오검색·구식 문서 교정에 강함 단순 질의 과잉 검색·환각 동시 억제 2) 구성요소와 동작 흐름 구분 구성요소 역할 판단 reflection token / evaluator / router 검색 필요성·문서 관련성·질의 난이도 판정 교정 재검색·웹 검색·지식 정제 부족·오류 컨텍스트를 보완하거나 폐기 생성 generator 검증된 컨텍스트로 답변·인용 생성 검증 faithfulness·issup 근거 없는 문장 차단, 재생성 트리거 관측 trace·토큰·지연 로그 교정 횟수·비용·품질을 함께 모니터링 3) 도입 고려사항 구분 키워드 설명 지연 평가 단계 분리 평가는 소형 모델·비동기로, 사용자 응답 경로에서 분리 비용 라우팅 우선 adaptive로 불필요 검색을 먼저 제거하고 교정은 예외적으로 품질 평가셋 구축 교정이 실제로 정답률을 올리는지 a/b로 검증(교정 전후 비교) 안전 외부 검색 통제 웹 검색 허용 도메인·민감정보 마스킹, 프롬프트 인젝션 필터 운영 루프 상한·폴백 최대 2~3회 교정 후 \"확인 불가\"로 정직하게 응답 두음: 자·씨·어 — self-rag·crag·adaptive rag / 검·평·교·생 — 검색·평가·교정·생성 \"검색 전은 라우팅(adaptive), 검색 후는 교정(crag), 생성 중은 성찰(self-rag)\""}, {"id": "graphrag", "cat": "ai", "sub": "ai-llm", "parent": "rag", "t": "GraphRAG", "s": "지식 그래프·커뮤니티 요약 RAG", "stars": 1, "redStar": false, "full": "GraphRAG (지식 그래프 기반 RAG)", "catLabel": "AI·데이터", "st": "📌 복습 필요", "d": "2026-11-20", "def": "<p>문서 청크를 단순 벡터 유사도로만 검색하는 기존 RAG의 한계(전역 요약·다중 홉 관계 추론 취약)를 보완하기 위해, <b>엔티티·관계 기반 지식 그래프(Knowledge Graph)와 커뮤니티 요약<\/b>을 결합한 차세대 RAG 기법<\/p>", "kw": "<ul class=\"kw\"><li><b>기존 Vector RAG 한계<\/b>: 문서 조각(Chunk) 단위 검색 → 전체 데이터셋을 아우르는 <b>전역(Global) 질문<\/b>과 여러 문서를 건너뛰는 <b>다중 홉(Multi-hop) 추론<\/b>에 취약<\/li><li><b>동작 구조<\/b>:<ul class=\"kw\"><li><b>Knowledge Graph 구축<\/b>: LLM으로 텍스트에서 엔티티(노드)와 관계(엣지) 추출<\/li><li><b>Community Detection &amp; Summarization<\/b>: Leiden 알고리즘 등으로 밀접한 노드 군집화 및 계층별 사전 요약<\/li><li><b>이중 검색<\/b>: 세부 사실은 <b>Local Search<\/b>(엔티티 주변 탐색), 전체 맥락은 <b>Global Search<\/b>(커뮤니티 요약 종합)<\/li><\/ul><\/li><li><b>트레이드오프<\/b>: 추론 정확도·전역 요약은 크게 향상되나, 그래프 구축 시 LLM 토큰 비용과 색인 시간이 증가<\/li><\/ul>", "pp": "<div class=\"tblwrap\"><table class=\"cmp\"><colgroup><col style=\"width:24%\"><col style=\"width:28%\"><col style=\"width:48%\"><\/colgroup><thead><tr><th>관점(측면)<\/th><th>특징<\/th><th>설명<\/th><\/tr><\/thead><tbody><tr><td class=\"k\">지식 구조<\/td><td>엔티티·관계 그래프<\/td><td>LLM으로 텍스트에서 엔티티(노드)와 관계(엣지)를 추출해 지식 그래프를 구축<\/td><\/tr><tr><td class=\"k\">요약<\/td><td>Community Summary<\/td><td>Leiden 등으로 군집을 나누고 계층별 사전 요약을 만들어 전역 맥락을 확보<\/td><\/tr><tr><td class=\"k\">검색<\/td><td>Local + Global<\/td><td>세부 사실은 엔티티 주변(Local), 전체 요약형 질문은 커뮤니티 요약(Global)으로 응답<\/td><\/tr><tr><td class=\"k\">비용<\/td><td>토큰·색인 시간<\/td><td>그래프 구축에 토큰·시간이 더 들지만 다중 홉·전역 추론 정확도가 향상<\/td><\/tr><\/tbody><\/table><\/div>", "rv": "<div class=\"q\"><b>두음: 추·군·요·검<\/b> — 추(엔티티·관계 추출)·군(커뮤니티 탐지)·요(계층 요약)·검(Local/Global Search)<\/div>\n<div class=\"q\">\"<b>Vector RAG(단순 유사도·전역/다중 홉 취약)<\/b> vs <b>GraphRAG(지식 그래프+커뮤니티 요약, Local/Global Search)<\/b>\" 대비로 쓰면 고득점!<\/div>", "img": "itpe-diagrams/27-graphrag.webp", "txt": null, "search": "graphrag (지식 그래프 기반 rag) graphrag 지식 그래프·커뮤니티 요약 rag ai·데이터 llm·rag·에이전트 ⭐ 기출빈출 기출 빈출 중요 문서 청크를 단순 벡터 유사도로만 검색하는 기존 rag의 한계(전역 요약·다중 홉 관계 추론 취약)를 보완하기 위해, 엔티티·관계 기반 지식 그래프(knowledge graph)와 커뮤니티 요약 을 결합한 차세대 rag 기법 기존 vector rag 한계 : 문서 조각(chunk) 단위 검색 → 전체 데이터셋을 아우르는 전역(global) 질문 과 여러 문서를 건너뛰는 다중 홉(multi-hop) 추론 에 취약 동작 구조 : knowledge graph 구축 : llm으로 텍스트에서 엔티티(노드)와 관계(엣지) 추출 community detection &amp; summarization : leiden 알고리즘 등으로 밀접한 노드 군집화 및 계층별 사전 요약 이중 검색 : 세부 사실은 local search (엔티티 주변 탐색), 전체 맥락은 global search (커뮤니티 요약 종합) 트레이드오프 : 추론 정확도·전역 요약은 크게 향상되나, 그래프 구축 시 llm 토큰 비용과 색인 시간이 증가 관점(측면) 특징 설명 지식 구조 엔티티·관계 그래프 llm으로 텍스트에서 엔티티(노드)와 관계(엣지)를 추출해 지식 그래프를 구축 요약 community summary leiden 등으로 군집을 나누고 계층별 사전 요약을 만들어 전역 맥락을 확보 검색 local + global 세부 사실은 엔티티 주변(local), 전체 요약형 질문은 커뮤니티 요약(global)으로 응답 비용 토큰·색인 시간 그래프 구축에 토큰·시간이 더 들지만 다중 홉·전역 추론 정확도가 향상 두음: 추·군·요·검 — 추(엔티티·관계 추출)·군(커뮤니티 탐지)·요(계층 요약)·검(local/global search) \" vector rag(단순 유사도·전역/다중 홉 취약) vs graphrag(지식 그래프+커뮤니티 요약, local/global search) \" 대비로 쓰면 고득점!"}, {"id": "knowledge-graph", "cat": "ai", "sub": "ai-llm", "parent": null, "t": "지식 그래프", "s": "Knowledge Graph", "stars": 2, "redStar": false, "full": "지식 그래프 (Knowledge Graph)", "catLabel": "AI·데이터", "st": "📌 복습 필요", "d": "2026-11-25", "def": "<p><b>지식 그래프(Knowledge Graph)<\/b>는 현실 세계의 <b>개체(Entity)·관계(Relation)·속성(Attribute)<\/b>을 그래프 구조와 온톨로지로 표현하여 기계의 의미 추론과 <b>GraphRAG<\/b> 기반 근거 검색을 지원하는 <b>시맨틱 지식 표현 체계<\/b><\/p>", "kw": "<ul class=\"kw\"><li><b>Triple (S-P-O)<\/b>: 주어-서술어-목적어의 사실 단위 — 노드(개체)·엣지(관계)·속성으로 표현<\/li><li><b>온톨로지(Ontology)<\/b>: 클래스·관계·제약·추론 규칙의 형식적 정의 — 스키마와 의미 일관성 담당<\/li><li><b>RDF · OWL · SPARQL<\/b>: W3C 표준 트리플 모델·온톨로지 언어·질의 언어 — 상호운용·추론에 강함<\/li><li><b>Property Graph · Cypher(GQL)<\/b>: 노드·관계에 속성 부여, 질의 성능·개발 편의성 우수 (ISO GQL 표준화)<\/li><li><b>다중 홉 추론(Multi-hop)<\/b>: 경로 탐색·연쇄 관계 추론 — 벡터 유사도 검색이 못 하는 관계 질의 수행<\/li><li><b>GraphRAG<\/b>: 커뮤니티 탐지·요약으로 전역 질문에 답하는 RAG 확장 — 청크 검색의 문맥 단절 보완<\/li><li><b>구축<\/b>: 개체·관계 추출(NER·RE), 엔티티 해소(ER), 스키마 정렬, 품질·최신성 관리<\/li><\/ul>", "pp": "<h4>1) RDF/OWL vs Property Graph<\/h4>\n<div class=\"tblwrap\"><table class=\"cmp\"><colgroup><col style=\"width:24%\"><col style=\"width:28%\"><col style=\"width:48%\"><\/colgroup><thead><tr><th>구분<\/th><th>RDF · OWL · SPARQL<\/th><th>Property Graph · Cypher(GQL)<\/th><\/tr><\/thead><tbody><tr><td class=\"k\">데이터 모델<\/td><td>트리플(주어-서술어-목적어)<\/td><td>노드·관계에 속성 부여<\/td><\/tr><tr><td class=\"k\">스키마<\/td><td>온톨로지(OWL)로 형식 정의<\/td><td>선택적 스키마·유연 구조<\/td><\/tr><tr><td class=\"k\">질의<\/td><td>SPARQL(표준), 연합 질의<\/td><td>Cypher·GQL, 경로 질의 직관적<\/td><\/tr><tr><td class=\"k\">강점<\/td><td>표준 상호운용·추론·데이터 교환<\/td><td>질의 성능·개발 생산성·대규모 탐색<\/td><\/tr><tr><td class=\"k\">약점<\/td><td>대규모 질의 성능·구현 복잡도<\/td><td>표준 추론·온톨로지 표현력 제한<\/td><\/tr><tr><td class=\"k\">활용<\/td><td>공공·의료·학술 표준 데이터<\/td><td>추천·사기탐지·GraphRAG 백엔드<\/td><\/tr><\/tbody><\/table><\/div>\n<h4>2) 지식 그래프 vs 벡터 검색(RAG)<\/h4>\n<div class=\"tblwrap\"><table class=\"cmp\"><colgroup><col style=\"width:24%\"><col style=\"width:28%\"><col style=\"width:48%\"><\/colgroup><thead><tr><th>구분<\/th><th>키워드<\/th><th>설명<\/th><\/tr><\/thead><tbody><tr><td class=\"k\">검색 단위<\/td><td>개체·관계<\/td><td>문서 청크가 아닌 개체 간 관계로 근거 구성<\/td><\/tr><tr><td class=\"k\">장점<\/td><td>다중 홉·설명<\/td><td>경로 근거를 제시해 설명 가능성·정확도 향상<\/td><\/tr><tr><td class=\"k\">한계<\/td><td>구축 비용<\/td><td>스키마 설계·엔티티 해소·최신성 유지에 지속 비용<\/td><\/tr><tr><td class=\"k\">결합<\/td><td>GraphRAG<\/td><td>벡터 검색(지역) + 커뮤니티 요약(전역) 하이브리드<\/td><\/tr><tr><td class=\"k\">품질<\/td><td>엔티티 해소<\/td><td>동일 개체 중복·오결합이 오답의 주원인<\/td><\/tr><\/tbody><\/table><\/div>\n<h4>3) 도입 고려사항<\/h4>\n<div class=\"tblwrap\"><table class=\"cmp\"><colgroup><col style=\"width:24%\"><col style=\"width:28%\"><col style=\"width:48%\"><\/colgroup><thead><tr><th>구분<\/th><th>키워드<\/th><th>설명<\/th><\/tr><\/thead><tbody><tr><td class=\"k\">목적<\/td><td>질의 유형<\/td><td>다중 홉·관계 질의가 핵심일 때 도입, 단순 유사도는 벡터 DB로 충분<\/td><\/tr><tr><td class=\"k\">구축<\/td><td>스키마 우선<\/td><td>질문 유형에서 역산해 온톨로지·관계 유형 정의<\/td><\/tr><tr><td class=\"k\">운영<\/td><td>최신성<\/td><td>원천 데이터 변경 반영(증분 갱신), 품질 지표 모니터링<\/td><\/tr><tr><td class=\"k\">거버넌스<\/td><td>출처·리니지<\/td><td>개체·관계의 출처 추적, 오류 정정 절차 마련<\/td><\/tr><\/tbody><\/table><\/div>", "rv": "<div class=\"q\"><b>두음: 개·관·속 / 알·오·스<\/b> — 개체·관계·속성 / RDF·OWL·SPARQL<\/div>\n<div class=\"q\"><b>\"개체와 관계로 지식을 연결하면, 검색이 아니라 추론이 가능해진다\"<\/b><\/div>", "img": "itpe-diagrams/126-knowledge-graph.webp", "txt": null, "search": "지식 그래프 (knowledge graph) 지식 그래프 knowledge graph ai·데이터 llm·rag·에이전트 ⭐⭐ 기출빈출 기출 빈출 중요 지식 그래프(knowledge graph) 는 현실 세계의 개체(entity)·관계(relation)·속성(attribute) 을 그래프 구조와 온톨로지로 표현하여 기계의 의미 추론과 graphrag 기반 근거 검색을 지원하는 시맨틱 지식 표현 체계 triple (s-p-o) : 주어-서술어-목적어의 사실 단위 — 노드(개체)·엣지(관계)·속성으로 표현 온톨로지(ontology) : 클래스·관계·제약·추론 규칙의 형식적 정의 — 스키마와 의미 일관성 담당 rdf · owl · sparql : w3c 표준 트리플 모델·온톨로지 언어·질의 언어 — 상호운용·추론에 강함 property graph · cypher(gql) : 노드·관계에 속성 부여, 질의 성능·개발 편의성 우수 (iso gql 표준화) 다중 홉 추론(multi-hop) : 경로 탐색·연쇄 관계 추론 — 벡터 유사도 검색이 못 하는 관계 질의 수행 graphrag : 커뮤니티 탐지·요약으로 전역 질문에 답하는 rag 확장 — 청크 검색의 문맥 단절 보완 구축 : 개체·관계 추출(ner·re), 엔티티 해소(er), 스키마 정렬, 품질·최신성 관리 1) rdf/owl vs property graph 구분 rdf · owl · sparql property graph · cypher(gql) 데이터 모델 트리플(주어-서술어-목적어) 노드·관계에 속성 부여 스키마 온톨로지(owl)로 형식 정의 선택적 스키마·유연 구조 질의 sparql(표준), 연합 질의 cypher·gql, 경로 질의 직관적 강점 표준 상호운용·추론·데이터 교환 질의 성능·개발 생산성·대규모 탐색 약점 대규모 질의 성능·구현 복잡도 표준 추론·온톨로지 표현력 제한 활용 공공·의료·학술 표준 데이터 추천·사기탐지·graphrag 백엔드 2) 지식 그래프 vs 벡터 검색(rag) 구분 키워드 설명 검색 단위 개체·관계 문서 청크가 아닌 개체 간 관계로 근거 구성 장점 다중 홉·설명 경로 근거를 제시해 설명 가능성·정확도 향상 한계 구축 비용 스키마 설계·엔티티 해소·최신성 유지에 지속 비용 결합 graphrag 벡터 검색(지역) + 커뮤니티 요약(전역) 하이브리드 품질 엔티티 해소 동일 개체 중복·오결합이 오답의 주원인 3) 도입 고려사항 구분 키워드 설명 목적 질의 유형 다중 홉·관계 질의가 핵심일 때 도입, 단순 유사도는 벡터 db로 충분 구축 스키마 우선 질문 유형에서 역산해 온톨로지·관계 유형 정의 운영 최신성 원천 데이터 변경 반영(증분 갱신), 품질 지표 모니터링 거버넌스 출처·리니지 개체·관계의 출처 추적, 오류 정정 절차 마련 두음: 개·관·속 / 알·오·스 — 개체·관계·속성 / rdf·owl·sparql \"개체와 관계로 지식을 연결하면, 검색이 아니라 추론이 가능해진다\""}, {"id": "rig", "cat": "ai", "sub": "ai-llm", "parent": null, "t": "RIG", "s": "생성 중 교차 검색", "stars": 0, "redStar": false, "full": "RIG (Retrieval-Interleaved Generation)", "catLabel": "AI·데이터", "st": "📌 복습 필요", "d": "2026-11-20", "def": "<p>답변 생성 전에 한 번만 검색하는 기존 RAG와 달리, LLM이 <b>텍스트를 생성하는 도중(Interleaved)<\/b> 추가 팩트·수치가 필요한 시점마다 <b>실시간으로 외부 검색·도구 호출을 교차 수행<\/b>해 정확도를 높이는 기법 (Google DataGemma 등)<\/p>", "kw": "<ul class=\"kw\"><li><b>RAG vs RIG<\/b>:<ul class=\"kw\"><li><b>기존 RAG<\/b>: 질의 → <b>생성 전 1회 검색<\/b> → 일괄 생성 (생성 중간에 새 정보가 필요해도 재검색 불가)<\/li><li><b>RIG<\/b>: 생성 중 불확실한 부분이나 통계·수치 질의가 나오면 <b>질의 생성 → 검색/검증 → 이어서 생성<\/b>을 반복<\/li><\/ul><\/li><li><b>핵심 메커니즘<\/b>: 자연어 생성 중 특정 시점에 구조화된 질의(Query)를 끼워 넣어 신뢰 가능한 데이터 소스(Data Commons 등)로 팩트 체크<\/li><li><b>트레이드오프<\/b>: 수치·사실 환각(Hallucination)과 다단계 추론 오류가 크게 줄어드나, 생성 중 검색 대기로 <b>응답 지연(Latency)<\/b> 증가<\/li><\/ul>", "pp": "<div class=\"tblwrap\"><table class=\"cmp\"><colgroup><col style=\"width:24%\"><col style=\"width:28%\"><col style=\"width:48%\"><\/colgroup><thead><tr><th>관점(측면)<\/th><th>특징<\/th><th>설명<\/th><\/tr><\/thead><tbody><tr><td class=\"k\">검색 시점<\/td><td>생성 중 교차 검색<\/td><td>생성 전 1회 검색이 아니라 문장을 만들어 가는 도중 필요한 시점마다 검색<\/td><\/tr><tr><td class=\"k\">발동 조건<\/td><td>수치·불확실 구간<\/td><td>통계·수치·팩트 질의가 나오면 구조화 질의를 끼워 넣어 검증<\/td><\/tr><tr><td class=\"k\">정확도<\/td><td>환각 감소<\/td><td>신뢰 가능한 데이터 소스로 팩트 체크해 수치 오류와 다단계 추론 오류를 줄임<\/td><\/tr><tr><td class=\"k\">비용<\/td><td>응답 지연 증가<\/td><td>검색 대기가 누적되므로 캐싱·선별 검색·병렬 호출로 지연을 상쇄<\/td><\/tr><\/tbody><\/table><\/div>", "rv": "<div class=\"q\"><b>두음: 전·중·교<\/b> — 전(RAG=생성 전 검색)·중(RIG=생성 중 검색)·교(교차 검증)<\/div>\n<div class=\"q\">\"<b>RAG(생성 전 사전 검색)<\/b> vs <b>RIG(생성 중 실시간 교차 검색)<\/b>\" 시점 차이를 핵심으로 쓰기!<\/div>", "img": "itpe-diagrams/30-rig.webp", "txt": null, "search": "rig (retrieval-interleaved generation) rig 생성 중 교차 검색 ai·데이터 llm·rag·에이전트 답변 생성 전에 한 번만 검색하는 기존 rag와 달리, llm이 텍스트를 생성하는 도중(interleaved) 추가 팩트·수치가 필요한 시점마다 실시간으로 외부 검색·도구 호출을 교차 수행 해 정확도를 높이는 기법 (google datagemma 등) rag vs rig : 기존 rag : 질의 → 생성 전 1회 검색 → 일괄 생성 (생성 중간에 새 정보가 필요해도 재검색 불가) rig : 생성 중 불확실한 부분이나 통계·수치 질의가 나오면 질의 생성 → 검색/검증 → 이어서 생성 을 반복 핵심 메커니즘 : 자연어 생성 중 특정 시점에 구조화된 질의(query)를 끼워 넣어 신뢰 가능한 데이터 소스(data commons 등)로 팩트 체크 트레이드오프 : 수치·사실 환각(hallucination)과 다단계 추론 오류가 크게 줄어드나, 생성 중 검색 대기로 응답 지연(latency) 증가 관점(측면) 특징 설명 검색 시점 생성 중 교차 검색 생성 전 1회 검색이 아니라 문장을 만들어 가는 도중 필요한 시점마다 검색 발동 조건 수치·불확실 구간 통계·수치·팩트 질의가 나오면 구조화 질의를 끼워 넣어 검증 정확도 환각 감소 신뢰 가능한 데이터 소스로 팩트 체크해 수치 오류와 다단계 추론 오류를 줄임 비용 응답 지연 증가 검색 대기가 누적되므로 캐싱·선별 검색·병렬 호출로 지연을 상쇄 두음: 전·중·교 — 전(rag=생성 전 검색)·중(rig=생성 중 검색)·교(교차 검증) \" rag(생성 전 사전 검색) vs rig(생성 중 실시간 교차 검색) \" 시점 차이를 핵심으로 쓰기!"}, {"id": "agentic-ai", "cat": "ai", "sub": "ai-llm", "parent": null, "t": "에이전틱 AI", "s": "Planning·Memory·Tool·협업", "stars": 2, "redStar": false, "full": "에이전틱 AI (Agentic AI)", "catLabel": "AI·데이터", "st": "📌 복습 필요", "d": "2026-11-21", "def": "<p>단순 질의응답에 그치는 기존 생성형 AI를 넘어, 주어진 목표를 달성하기 위해 <b>스스로 계획을 세우고(Planning) 외부 도구를 호출하며(Tool Use) 결과를 성찰·보완(Reflection)해 자율적으로 과업을 완수<\/b>하는 AI 시스템<\/p>", "kw": "<ul class=\"kw\"><li><b>4대 핵심 구성요소<\/b>:<ul class=\"kw\"><li><b>Planning<\/b>: 목표를 세부 하위 작업으로 분해·추론 (CoT, ReAct)<\/li><li><b>Memory<\/b>: 단기 컨텍스트 윈도우 + 장기 기억(RAG·벡터 DB)<\/li><li><b>Tool Use<\/b>: <b>MCP<\/b>를 통한 외부 API·DB·파일 시스템 제어<\/li><li><b>Reflection &amp; Multi-Agent<\/b>: 결과 자기 검증 및 <b>A2A<\/b> 프로토콜 기반 에이전트 간 협업<\/li><\/ul><\/li><li><b>Generative AI vs Agentic AI<\/b>: 수동·단발성 텍스트 생성 → 능동·다단계 자율 실행 루프<\/li><\/ul>", "pp": "<div class=\"tblwrap\"><table class=\"cmp\"><colgroup><col style=\"width:24%\"><col style=\"width:28%\"><col style=\"width:48%\"><\/colgroup><thead><tr><th>관점(측면)<\/th><th>특징<\/th><th>설명<\/th><\/tr><\/thead><tbody><tr><td class=\"k\">추론·계획 관점<\/td><td>Planning · Reflection<\/td><td>CoT·ReAct로 작업 분해 후 Self-Correction으로 오류 자가 수정<\/td><\/tr><tr><td class=\"k\">연동·확장 관점<\/td><td>MCP · A2A (자식)<\/td><td>MCP로 도구·데이터 연동, A2A로 이기종 에이전트 간 협업 수행<\/td><\/tr><tr><td class=\"k\">기억·지식 관점<\/td><td>단기·장기 Memory<\/td><td>컨텍스트 유지와 RAG 기반 장기 기억으로 연속적 상태 관리<\/td><\/tr><tr><td class=\"k\">통제·보안 관점<\/td><td>Human-in-the-Loop<\/td><td>자율 실행에 따른 오작동·권한 남용 방지를 위해 승인·가드레일 필수<\/td><\/tr><\/tbody><\/table><\/div>", "rv": "<div class=\"q\"><b>두음: 플·메·툴·리<\/b> — 플(Planning)·메(Memory)·툴(Tool Use·MCP)·리(Reflection·A2A)<\/div>\n<div class=\"q\"><b>Planning + Memory + Tool Use(MCP) + Reflection/협업(A2A)<\/b> 4박자 + <b>통제(가드레일)<\/b>!<\/div>", "img": "itpe-diagrams/40-agentic-ai.webp", "txt": null, "search": "에이전틱 ai (agentic ai) 에이전틱 ai planning·memory·tool·협업 ai·데이터 llm·rag·에이전트 ⭐⭐ 기출빈출 기출 빈출 중요 단순 질의응답에 그치는 기존 생성형 ai를 넘어, 주어진 목표를 달성하기 위해 스스로 계획을 세우고(planning) 외부 도구를 호출하며(tool use) 결과를 성찰·보완(reflection)해 자율적으로 과업을 완수 하는 ai 시스템 4대 핵심 구성요소 : planning : 목표를 세부 하위 작업으로 분해·추론 (cot, react) memory : 단기 컨텍스트 윈도우 + 장기 기억(rag·벡터 db) tool use : mcp 를 통한 외부 api·db·파일 시스템 제어 reflection &amp; multi-agent : 결과 자기 검증 및 a2a 프로토콜 기반 에이전트 간 협업 generative ai vs agentic ai : 수동·단발성 텍스트 생성 → 능동·다단계 자율 실행 루프 관점(측면) 특징 설명 추론·계획 관점 planning · reflection cot·react로 작업 분해 후 self-correction으로 오류 자가 수정 연동·확장 관점 mcp · a2a (자식) mcp로 도구·데이터 연동, a2a로 이기종 에이전트 간 협업 수행 기억·지식 관점 단기·장기 memory 컨텍스트 유지와 rag 기반 장기 기억으로 연속적 상태 관리 통제·보안 관점 human-in-the-loop 자율 실행에 따른 오작동·권한 남용 방지를 위해 승인·가드레일 필수 두음: 플·메·툴·리 — 플(planning)·메(memory)·툴(tool use·mcp)·리(reflection·a2a) planning + memory + tool use(mcp) + reflection/협업(a2a) 4박자 + 통제(가드레일) !"}, {"id": "agentic-browser", "cat": "ai", "sub": "ai-llm", "parent": "agentic-ai", "t": "에이전틱 브라우저", "s": "VLM 인식 · 자율 행동", "stars": 2, "redStar": false, "full": "에이전틱 브라우저 (Agentic Browser)", "catLabel": "AI·데이터", "st": "📌 복습 필요", "d": "2026-11-25", "def": "<p><b>에이전틱 브라우저(Agentic Browser)<\/b>는 LLM·<b>VLM<\/b> 기반으로 웹 페이지의 <b>DOM·화면(Screenshot)을 인지<\/b>하고 탐색·클릭·입력 등 브라우저 작업을 자율 수행하는 <b>자율 웹 실행 에이전트<\/b><\/p>", "kw": "<ul class=\"kw\"><li><b>인식(Perception)<\/b>: DOM·접근성 트리·스크린샷을 VLM으로 해석해 화면 상태와 조작 대상을 파악 (Computer Use·Operator 방식)<\/li><li><b>계획(Planning)<\/b>: 목표를 하위 Task로 분해, ReAct·Plan-and-Execute 루프로 다음 행동 결정<\/li><li><b>실행(Action)<\/b>: 클릭·스크롤·폼 입력·탭 전환 — CDP·Playwright 등 브라우저 자동화 인터페이스 사용<\/li><li><b>프롬프트 인젝션<\/b>: 웹 페이지 속 악성 문구가 에이전트 지시를 덮어쓰는 <b>간접 인젝션<\/b> — 신뢰 경계 분리·페이지 내용 불신 원칙<\/li><li><b>권한 위임<\/b>: 대리 로그인·결제 권한의 범위·만료, <b>Human-in-the-Loop<\/b> 승인 게이트<\/li><li><b>샌드박스·감사<\/b>: 격리 브라우저·전용 프로필·일회성 세션, 전 행동 로그·재현, 민감 행동 차단<\/li><\/ul>", "pp": "<h4>1) 전통 자동화 vs 에이전틱 브라우저<\/h4>\n<div class=\"tblwrap\"><table class=\"cmp\"><colgroup><col style=\"width:24%\"><col style=\"width:28%\"><col style=\"width:48%\"><\/colgroup><thead><tr><th>구분<\/th><th>RPA·스크립트 자동화<\/th><th>에이전틱 브라우저<\/th><\/tr><\/thead><tbody><tr><td class=\"k\">인식<\/td><td>고정 선택자(XPath·좌표)<\/td><td>DOM·스크린샷 의미 해석(VLM)<\/td><\/tr><tr><td class=\"k\">대응력<\/td><td>화면 변경 시 중단<\/td><td>레이아웃 변화에 유연 대응<\/td><\/tr><tr><td class=\"k\">범위<\/td><td>정의된 시나리오<\/td><td>열린 목표(탐색·비교·구매)<\/td><\/tr><tr><td class=\"k\">신뢰성<\/td><td>결정적·재현 쉬움<\/td><td>비결정적·환각·오작동 가능<\/td><\/tr><tr><td class=\"k\">보안<\/td><td>계정·권한 고정<\/td><td>위임 권한·인젝션 위험 확대<\/td><\/tr><tr><td class=\"k\">적합성<\/td><td>반복 정형 업무<\/td><td>비정형·장기 실행 업무<\/td><\/tr><\/tbody><\/table><\/div>\n<h4>2) 위협과 통제<\/h4>\n<div class=\"tblwrap\"><table class=\"cmp\"><colgroup><col style=\"width:24%\"><col style=\"width:28%\"><col style=\"width:48%\"><\/colgroup><thead><tr><th>구분<\/th><th>위협<\/th><th>통제<\/th><\/tr><\/thead><tbody><tr><td class=\"k\">입력<\/td><td>간접 프롬프트 인젝션(악성 페이지 문구)<\/td><td>신뢰 경계 분리, 지시·데이터 구분, 인젝션 탐지 필터<\/td><\/tr><tr><td class=\"k\">권한<\/td><td>과도한 위임·결제 남용<\/td><td>최소 권한·행위별 승인, 금액·대상 화이트리스트<\/td><\/tr><tr><td class=\"k\">세션<\/td><td>세션 고정·쿠키 탈취<\/td><td>전용 프로필·일회 세션, 자격증명 격리(비밀 금고 연동)<\/td><\/tr><tr><td class=\"k\">실행<\/td><td>위험 행동(삭제·송금·설정 변경)<\/td><td>고위험 행동 차단·확인 요구, 샌드박스 격리<\/td><\/tr><tr><td class=\"k\">감사<\/td><td>행위 추적 불가<\/td><td>단계별 스크린샷·액션 로그, 재현 가능한 감사 기록<\/td><\/tr><\/tbody><\/table><\/div>\n<h4>3) 도입 고려사항<\/h4>\n<div class=\"tblwrap\"><table class=\"cmp\"><colgroup><col style=\"width:24%\"><col style=\"width:28%\"><col style=\"width:48%\"><\/colgroup><thead><tr><th>구분<\/th><th>키워드<\/th><th>설명<\/th><\/tr><\/thead><tbody><tr><td class=\"k\">신뢰<\/td><td>완전 자율 vs 보조<\/td><td>초기에는 제안·확인 모드로 운영하고 신뢰 축적 후 자율 범위 확대<\/td><\/tr><tr><td class=\"k\">비용<\/td><td>토큰·지연<\/td><td>스크린샷·DOM 반복 전송으로 토큰 소모 큼 → 캐싱·요약·소형 모델 활용<\/td><\/tr><tr><td class=\"k\">법·약관<\/td><td>자동화 제한<\/td><td>대상 사이트 이용약관·봇 차단 정책 준수, 대리 행위의 법적 책임 검토<\/td><\/tr><tr><td class=\"k\">표준<\/td><td>에이전트 신원<\/td><td>사용자 대신 행동함을 증명하는 위임 토큰·에이전트 인증 체계 필요<\/td><\/tr><\/tbody><\/table><\/div>", "rv": "<div class=\"q\"><b>두음: 인·계·실·통 / 인·권·샌<\/b> — 인식·계획·실행·통제 / 인젝션·권한·샌드박스<\/div>\n<div class=\"q\"><b>\"화면을 읽고 스스로 누른다 — 편의만큼 권한과 주입을 통제해야 한다\"<\/b><\/div>", "img": "itpe-diagrams/123-agentic-browser.webp", "txt": null, "search": "에이전틱 브라우저 (agentic browser) 에이전틱 브라우저 vlm 인식 · 자율 행동 ai·데이터 llm·rag·에이전트 ⭐⭐ 기출빈출 기출 빈출 중요 에이전틱 브라우저(agentic browser) 는 llm· vlm 기반으로 웹 페이지의 dom·화면(screenshot)을 인지 하고 탐색·클릭·입력 등 브라우저 작업을 자율 수행하는 자율 웹 실행 에이전트 인식(perception) : dom·접근성 트리·스크린샷을 vlm으로 해석해 화면 상태와 조작 대상을 파악 (computer use·operator 방식) 계획(planning) : 목표를 하위 task로 분해, react·plan-and-execute 루프로 다음 행동 결정 실행(action) : 클릭·스크롤·폼 입력·탭 전환 — cdp·playwright 등 브라우저 자동화 인터페이스 사용 프롬프트 인젝션 : 웹 페이지 속 악성 문구가 에이전트 지시를 덮어쓰는 간접 인젝션 — 신뢰 경계 분리·페이지 내용 불신 원칙 권한 위임 : 대리 로그인·결제 권한의 범위·만료, human-in-the-loop 승인 게이트 샌드박스·감사 : 격리 브라우저·전용 프로필·일회성 세션, 전 행동 로그·재현, 민감 행동 차단 1) 전통 자동화 vs 에이전틱 브라우저 구분 rpa·스크립트 자동화 에이전틱 브라우저 인식 고정 선택자(xpath·좌표) dom·스크린샷 의미 해석(vlm) 대응력 화면 변경 시 중단 레이아웃 변화에 유연 대응 범위 정의된 시나리오 열린 목표(탐색·비교·구매) 신뢰성 결정적·재현 쉬움 비결정적·환각·오작동 가능 보안 계정·권한 고정 위임 권한·인젝션 위험 확대 적합성 반복 정형 업무 비정형·장기 실행 업무 2) 위협과 통제 구분 위협 통제 입력 간접 프롬프트 인젝션(악성 페이지 문구) 신뢰 경계 분리, 지시·데이터 구분, 인젝션 탐지 필터 권한 과도한 위임·결제 남용 최소 권한·행위별 승인, 금액·대상 화이트리스트 세션 세션 고정·쿠키 탈취 전용 프로필·일회 세션, 자격증명 격리(비밀 금고 연동) 실행 위험 행동(삭제·송금·설정 변경) 고위험 행동 차단·확인 요구, 샌드박스 격리 감사 행위 추적 불가 단계별 스크린샷·액션 로그, 재현 가능한 감사 기록 3) 도입 고려사항 구분 키워드 설명 신뢰 완전 자율 vs 보조 초기에는 제안·확인 모드로 운영하고 신뢰 축적 후 자율 범위 확대 비용 토큰·지연 스크린샷·dom 반복 전송으로 토큰 소모 큼 → 캐싱·요약·소형 모델 활용 법·약관 자동화 제한 대상 사이트 이용약관·봇 차단 정책 준수, 대리 행위의 법적 책임 검토 표준 에이전트 신원 사용자 대신 행동함을 증명하는 위임 토큰·에이전트 인증 체계 필요 두음: 인·계·실·통 / 인·권·샌 — 인식·계획·실행·통제 / 인젝션·권한·샌드박스 \"화면을 읽고 스스로 누른다 — 편의만큼 권한과 주입을 통제해야 한다\""}, {"id": "mcp", "cat": "ai", "sub": "ai-llm", "parent": "agentic-ai", "t": "MCP", "s": "Model Context Protocol", "stars": 0, "redStar": false, "full": "MCP (Model Context Protocol)", "catLabel": "AI·데이터", "st": "📌 복습 필요", "d": "2026-11-19", "def": "<p>LLM(AI 애플리케이션)이 외부 데이터 소스·도구·API와 <b>단일 표준 방식으로 안전하게 연결<\/b>되도록 Anthropic이 제안한 개방형 프로토콜 (일명 <b>AI의 USB-C<\/b>)<\/p>", "kw": "<ul class=\"kw\"><li><b>등장 배경<\/b>: M개 AI 모델 × N개 외부 도구의 <b>M×N 개별 연동 복잡도를 M+N으로 단순화<\/b><\/li><li><b>3대 구성요소<\/b>: <code>Host<\/code>(Claude·IDE 등 AI 앱) - <code>Client<\/code>(1:1 세션 관리) - <code>Server<\/code>(외부 도구·DB 어댑터, <code>JSON-RPC 2.0<\/code> 통신)<\/li><li><b>3대 제공 기능(Primitives)<\/b>: <code>Resources<\/code>(읽기용 데이터), <code>Tools<\/code>(함수·API 실행), <code>Prompts<\/code>(재사용 템플릿)<\/li><li><b>A2A와 구분<\/b>: MCP는 <b>AI ↔ 도구·데이터<\/b> 연동, <b>A2A(Agent2Agent)<\/b> 는 <b>AI 에이전트 ↔ AI 에이전트<\/b> 협업 표준<\/li><\/ul>", "pp": "<div class=\"tblwrap\"><table class=\"cmp\"><colgroup><col style=\"width:24%\"><col style=\"width:28%\"><col style=\"width:48%\"><\/colgroup><thead><tr><th>관점(측면)<\/th><th>특징<\/th><th>설명<\/th><\/tr><\/thead><tbody><tr><td class=\"k\">연동 구조<\/td><td>Host·Client·Server<\/td><td>AI 앱(Host)이 Client를 통해 도구·DB 어댑터(Server)와 JSON-RPC 2.0으로 통신<\/td><\/tr><tr><td class=\"k\">제공 기능<\/td><td>Resources·Tools·Prompts<\/td><td>읽기용 데이터, 함수·API 실행, 재사용 프롬프트 템플릿을 표준 프리미티브로 제공<\/td><\/tr><tr><td class=\"k\">복잡도 해소<\/td><td>M×N → M+N<\/td><td>모델·도구별 개별 연동 코드를 단일 표준 인터페이스로 통합해 확장 비용 절감<\/td><\/tr><tr><td class=\"k\">역할 구분<\/td><td>MCP vs A2A<\/td><td>MCP는 AI와 도구·데이터의 수직 연결, A2A는 에이전트 간 수평 협업으로 분담<\/td><\/tr><\/tbody><\/table><\/div>", "rv": "<div class=\"q\"><b>두음: 호·클·서 / 자·툴·프<\/b> — 호(Host)·클(Client)·서(Server) / 자(Resources)·툴(Tools)·프(Prompts)<\/div>\n<div class=\"q\">\"AI끼리 연동\"은 <b>A2A<\/b>, <b>MCP는 AI ↔ 외부 도구·데이터(M×N → M+N 해소)<\/b> 라는 점과 <b>Host·Client·Server / Resources·Tools·Prompts<\/b>를 꼭 분리해 쓰기!<\/div>", "img": "itpe-diagrams/10-mcp.webp", "txt": null, "search": "mcp (model context protocol) mcp model context protocol ai·데이터 llm·rag·에이전트 llm(ai 애플리케이션)이 외부 데이터 소스·도구·api와 단일 표준 방식으로 안전하게 연결 되도록 anthropic이 제안한 개방형 프로토콜 (일명 ai의 usb-c ) 등장 배경 : m개 ai 모델 × n개 외부 도구의 m×n 개별 연동 복잡도를 m+n으로 단순화 3대 구성요소 : host (claude·ide 등 ai 앱) - client (1:1 세션 관리) - server (외부 도구·db 어댑터, json-rpc 2.0 통신) 3대 제공 기능(primitives) : resources (읽기용 데이터), tools (함수·api 실행), prompts (재사용 템플릿) a2a와 구분 : mcp는 ai ↔ 도구·데이터 연동, a2a(agent2agent) 는 ai 에이전트 ↔ ai 에이전트 협업 표준 관점(측면) 특징 설명 연동 구조 host·client·server ai 앱(host)이 client를 통해 도구·db 어댑터(server)와 json-rpc 2.0으로 통신 제공 기능 resources·tools·prompts 읽기용 데이터, 함수·api 실행, 재사용 프롬프트 템플릿을 표준 프리미티브로 제공 복잡도 해소 m×n → m+n 모델·도구별 개별 연동 코드를 단일 표준 인터페이스로 통합해 확장 비용 절감 역할 구분 mcp vs a2a mcp는 ai와 도구·데이터의 수직 연결, a2a는 에이전트 간 수평 협업으로 분담 두음: 호·클·서 / 자·툴·프 — 호(host)·클(client)·서(server) / 자(resources)·툴(tools)·프(prompts) \"ai끼리 연동\"은 a2a , mcp는 ai ↔ 외부 도구·데이터(m×n → m+n 해소) 라는 점과 host·client·server / resources·tools·prompts 를 꼭 분리해 쓰기!"}, {"id": "a2a", "cat": "ai", "sub": "ai-llm", "parent": "agentic-ai", "t": "A2A", "s": "Agent-to-Agent 협업", "stars": 0, "redStar": false, "full": "A2A (Agent-to-Agent Protocol)", "catLabel": "AI·데이터", "st": "📌 복습 필요", "d": "2026-11-19", "def": "<p>서로 다른 벤더·프레임워크로 개발된 <b>이기종 AI 에이전트 간에 능력을 탐색하고 작업을 위임·협업<\/b>하기 위한 개방형 표준 통신 프로토콜<\/p>", "kw": "<ul class=\"kw\"><li><b>등장 배경<\/b>: 에이전트 프레임워크 다변화로 인한 <b>사일로(Silo) 해소<\/b> 및 멀티 에이전트 자율 협업 필요<\/li><li><b>핵심 구성요소<\/b>:<ul class=\"kw\"><li><b>Agent Card<\/b> (<code>/.well-known/agent.json<\/code>): 에이전트 기능·인증·엔드포인트를 명세한 JSON 메타데이터(Discovery)<\/li><li><b>Client Agent ↔ Remote Agent<\/b>: 작업 요청 주체와 수행 주체 간 HTTP·JSON-RPC 2.0·SSE 기반 통신<\/li><li><b>Task &amp; Artifact<\/b>: 작업 상태(<code>submitted<\/code>→<code>working<\/code>→<code>completed<\/code>) 생명주기 관리 및 결과물(<code>Artifact<\/code>) 교환<\/li><\/ul><\/li><li><b>MCP와의 역할 분담<\/b>: <b>MCP<\/b>는 에이전트 ↔ <b>외부 도구·데이터(수직 연결)<\/b>, <b>A2A<\/b>는 에이전트 ↔ <b>에이전트(수평 협업)<\/b><\/li><\/ul>", "pp": "<div class=\"tblwrap\"><table class=\"cmp\"><colgroup><col style=\"width:24%\"><col style=\"width:28%\"><col style=\"width:48%\"><\/colgroup><thead><tr><th>관점(측면)<\/th><th>특징<\/th><th>설명<\/th><\/tr><\/thead><tbody><tr><td class=\"k\">탐색<\/td><td>Agent Card<\/td><td><code>/.well-known/agent.json<\/code>으로 기능·인증·엔드포인트를 공개해 상호 발견<\/td><\/tr><tr><td class=\"k\">통신<\/td><td>JSON-RPC 2.0·SSE<\/td><td>HTTP 기반 요청·응답에 SSE 스트림을 더해 진행 상황을 실시간 전달<\/td><\/tr><tr><td class=\"k\">작업 관리<\/td><td>Task·Artifact<\/td><td>submitted→working→completed 생명주기로 상태를 관리하고 결과물(Artifact)을 교환<\/td><\/tr><tr><td class=\"k\">역할 구분<\/td><td>수평 협업<\/td><td>MCP의 도구·데이터 수직 연결과 달리 이기종 에이전트 간 위임·협업을 담당<\/td><\/tr><\/tbody><\/table><\/div>", "rv": "<div class=\"q\"><b>두음: 카·타·아<\/b> — 카(Agent Card 탐색)·타(Task &amp; Artifact 생명주기)·아(A2A 에이전트↔에이전트)<\/div>\n<div class=\"q\">\"<b>Agent Card(탐색)<\/b> + <b>Task/Artifact(비동기 협업)<\/b> + <b>MCP(도구) vs A2A(에이전트)<\/b>\" 3가지를 꼭 묶어서 쓰기!<\/div>", "img": "itpe-diagrams/22-a2a.webp", "txt": null, "search": "a2a (agent-to-agent protocol) a2a agent-to-agent 협업 ai·데이터 llm·rag·에이전트 서로 다른 벤더·프레임워크로 개발된 이기종 ai 에이전트 간에 능력을 탐색하고 작업을 위임·협업 하기 위한 개방형 표준 통신 프로토콜 등장 배경 : 에이전트 프레임워크 다변화로 인한 사일로(silo) 해소 및 멀티 에이전트 자율 협업 필요 핵심 구성요소 : agent card ( /.well-known/agent.json ): 에이전트 기능·인증·엔드포인트를 명세한 json 메타데이터(discovery) client agent ↔ remote agent : 작업 요청 주체와 수행 주체 간 http·json-rpc 2.0·sse 기반 통신 task &amp; artifact : 작업 상태( submitted → working → completed ) 생명주기 관리 및 결과물( artifact ) 교환 mcp와의 역할 분담 : mcp 는 에이전트 ↔ 외부 도구·데이터(수직 연결) , a2a 는 에이전트 ↔ 에이전트(수평 협업) 관점(측면) 특징 설명 탐색 agent card /.well-known/agent.json 으로 기능·인증·엔드포인트를 공개해 상호 발견 통신 json-rpc 2.0·sse http 기반 요청·응답에 sse 스트림을 더해 진행 상황을 실시간 전달 작업 관리 task·artifact submitted→working→completed 생명주기로 상태를 관리하고 결과물(artifact)을 교환 역할 구분 수평 협업 mcp의 도구·데이터 수직 연결과 달리 이기종 에이전트 간 위임·협업을 담당 두음: 카·타·아 — 카(agent card 탐색)·타(task &amp; artifact 생명주기)·아(a2a 에이전트↔에이전트) \" agent card(탐색) + task/artifact(비동기 협업) + mcp(도구) vs a2a(에이전트) \" 3가지를 꼭 묶어서 쓰기!"}, {"id": "sllm", "cat": "ai", "sub": "ai-model", "parent": null, "t": "sLLM (소형 언어모델)", "s": "저비용·폐쇄망 · 경량화 허브", "stars": 3, "redStar": false, "full": "sLLM (소형 거대언어모델)", "catLabel": "AI·데이터", "st": "📌 복습 필요", "d": "2026-11-21", "def": "<p>수십~수백억 파라미터의 거대언어모델(LLM) 대비 <b>1B~13B 규모로 경량화<\/b>하여, 온프레미스·모바일·엣지 환경에서 <b>저비용·고보안·실시간 추론<\/b>을 수행하는 도메인 특화 언어모델<\/p>", "kw": "<ul class=\"kw\"><li><b>등장 배경 (Why sLLM?)<\/b>:<ul class=\"kw\"><li><b>비용·지연<\/b>: 초거대 LLM의 막대한 GPU·API 비용과 추론 지연 해소<\/li><li><b>보안·주권<\/b>: 외부 클라우드 전송 없이 사내 폐쇄망(On-Premise)·온디바이스 구동으로 데이터 유출 방지<\/li><\/ul><\/li><li><b>sLLM 구현 4대 핵심 기술 (자식 토픽)<\/b>:<ul class=\"kw\"><li><b>양자화 &amp; 지식 증류<\/b>: 가중치 정밀도 축소(FP16→INT4) 및 Teacher→Student 전이 학습<\/li><li><b>파인튜닝 (Fine-Tuning)<\/b>: 도메인 특화 데이터로 목적·형식·추론 패턴 내재화<\/li><li><b>PEFT (LoRA·QLoRA)<\/b>: 기존 모델 동결 + 저랭크 어댑터 학습으로 소형 GPU에서도 미세조정<\/li><li><b>MoE (Mixture of Experts)<\/b>: Router가 일부 전문가만 선택 활성화(Sparse)해 효율 극대화<\/li><\/ul><\/li><\/ul>", "pp": "<div class=\"tblwrap\"><table class=\"cmp\"><colgroup><col style=\"width:24%\"><col style=\"width:28%\"><col style=\"width:48%\"><\/colgroup><thead><tr><th>관점(측면)<\/th><th>특징<\/th><th>설명<\/th><\/tr><\/thead><tbody><tr><td class=\"k\">경제·인프라 관점<\/td><td>저비용·온디바이스<\/td><td>단일 GPU·엣지 단말에서도 구동 가능해 TCO(총소유비용) 대폭 절감<\/td><\/tr><tr><td class=\"k\">보안·규제 관점<\/td><td>폐쇄망·데이터 주권<\/td><td>민감 데이터 외부 유출 원천 차단, 망분리·N2SF 환경 적합<\/td><\/tr><tr><td class=\"k\">모델·성능 관점<\/td><td>경량화 + 도메인 특화<\/td><td>양자화·지식증류·LoRA로 크기 줄이되 특정 업무 정확도는 LLM급 유지<\/td><\/tr><tr><td class=\"k\">운영·확장 관점<\/td><td>RAG·LLMOps 결합<\/td><td>부족한 최신 지식은 RAG로 보완하고 LLMOps로 버전·품질 관리<\/td><\/tr><\/tbody><\/table><\/div>", "rv": "<div class=\"q\"><b>두음: 양·증·파·모<\/b> — 양(양자화)·증(증류)·파(파인튜닝/PEFT)·모(MoE) — 왜: 비용·보안·지연<\/div>\n<div class=\"q\"><b>왜 쓰나(비용·보안·지연) + 4대 기술(양자화·증류·파인튜닝/LoRA·MoE)<\/b> 구조로 답안 뼈대 잡기!<\/div>", "img": "itpe-diagrams/39-sllm.webp", "txt": null, "search": "sllm (소형 거대언어모델) sllm (소형 언어모델) 저비용·폐쇄망 · 경량화 허브 ai·데이터 모델 경량화·추론 ⭐⭐⭐ 기출빈출 기출 빈출 중요 수십~수백억 파라미터의 거대언어모델(llm) 대비 1b~13b 규모로 경량화 하여, 온프레미스·모바일·엣지 환경에서 저비용·고보안·실시간 추론 을 수행하는 도메인 특화 언어모델 등장 배경 (why sllm?) : 비용·지연 : 초거대 llm의 막대한 gpu·api 비용과 추론 지연 해소 보안·주권 : 외부 클라우드 전송 없이 사내 폐쇄망(on-premise)·온디바이스 구동으로 데이터 유출 방지 sllm 구현 4대 핵심 기술 (자식 토픽) : 양자화 &amp; 지식 증류 : 가중치 정밀도 축소(fp16→int4) 및 teacher→student 전이 학습 파인튜닝 (fine-tuning) : 도메인 특화 데이터로 목적·형식·추론 패턴 내재화 peft (lora·qlora) : 기존 모델 동결 + 저랭크 어댑터 학습으로 소형 gpu에서도 미세조정 moe (mixture of experts) : router가 일부 전문가만 선택 활성화(sparse)해 효율 극대화 관점(측면) 특징 설명 경제·인프라 관점 저비용·온디바이스 단일 gpu·엣지 단말에서도 구동 가능해 tco(총소유비용) 대폭 절감 보안·규제 관점 폐쇄망·데이터 주권 민감 데이터 외부 유출 원천 차단, 망분리·n2sf 환경 적합 모델·성능 관점 경량화 + 도메인 특화 양자화·지식증류·lora로 크기 줄이되 특정 업무 정확도는 llm급 유지 운영·확장 관점 rag·llmops 결합 부족한 최신 지식은 rag로 보완하고 llmops로 버전·품질 관리 두음: 양·증·파·모 — 양(양자화)·증(증류)·파(파인튜닝/peft)·모(moe) — 왜: 비용·보안·지연 왜 쓰나(비용·보안·지연) + 4대 기술(양자화·증류·파인튜닝/lora·moe) 구조로 답안 뼈대 잡기!"}, {"id": "moe", "cat": "ai", "sub": "ai-model", "parent": "sllm", "t": "MoE", "s": "전문가 혼합 · Sparse 활성화", "stars": 1, "redStar": false, "full": "MoE (Mixture of Experts, 전문가 혼합 모델)", "catLabel": "AI·데이터", "st": "📌 복습 필요", "d": "2026-11-20", "def": "<p>하나의 거대한 밀집(Dense) 신경망 대신 여러 개의 특화된 <b>전문가 서브네트워크(Expert)<\/b>를 두고, <b>라우터(Router/Gating Network)<\/b>가 입력 토큰마다 <b>일부(Top-K)만 선택 활성화<\/b>하는 희소(Sparse) 아키텍처<\/p>", "kw": "<ul class=\"kw\"><li><b>핵심 구성요소<\/b>:<ul class=\"kw\"><li><b>Router (Gating Network)<\/b>: 입력 토큰의 특성을 보고 가장 적합한 상위 <b>Top-K<\/b>개 Expert를 동적 선택 및 가중치 부여<\/li><li><b>Sparse Experts<\/b>: FFN(Feed-Forward Network) 등을 여러 전문가 블록으로 분할, 선택된 일부만 연산 수행<\/li><\/ul><\/li><li><b>장점<\/b>: 전체 파라미터 규모(지식 용량)를 크게 키우면서도 토큰당 <b>활성 파라미터·연산량(FLOPs)<\/b>은 적게 유지해 학습·추론 속도 향상<\/li><li><b>단점 및 과제<\/b>:<ul class=\"kw\"><li>추론 시 연산은 일부만 해도 <b>전체 Expert를 메모리에 적재<\/b>해야 해 VRAM 부담 큼<\/li><li>특정 Expert에만 토큰이 몰리는 현상 방지를 위한 <b>Load Balancing Loss<\/b> 설계 필수<\/li><\/ul><\/li><\/ul>", "pp": "<div class=\"tblwrap\"><table class=\"cmp\"><colgroup><col style=\"width:24%\"><col style=\"width:28%\"><col style=\"width:48%\"><\/colgroup><thead><tr><th>관점(측면)<\/th><th>특징<\/th><th>설명<\/th><\/tr><\/thead><tbody><tr><td class=\"k\">구성 요소<\/td><td>Router + Experts<\/td><td>게이트 네트워크가 토큰마다 적합한 Top-K 전문가를 선택하고 가중치를 부여<\/td><\/tr><tr><td class=\"k\">연산 방식<\/td><td>Sparse Activation<\/td><td>선택된 일부 FFN만 계산해 전체 파라미터 대비 토큰당 FLOPs를 크게 절감<\/td><\/tr><tr><td class=\"k\">자원 특성<\/td><td>지식 용량 vs VRAM<\/td><td>파라미터 규모는 키우면서 연산은 줄지만, 추론 시 전체 Expert 적재로 메모리 부담<\/td><\/tr><tr><td class=\"k\">학습 안정화<\/td><td>Load Balancing<\/td><td>특정 전문가 쏠림을 막는 보조 손실과 통신·병렬화 전략이 필수<\/td><\/tr><\/tbody><\/table><\/div>", "rv": "<div class=\"q\"><b>두음: 라·스·밸<\/b> — 라(Router Top-K)·스(Sparse 활성)·밸(Load Balancing)<\/div>\n<div class=\"q\"><b>Router(Top-K 선택) + Sparse Activation(연산 효율 ↑) + 단점(VRAM 부담·Load Balancing)<\/b> 세트!<\/div>", "img": "itpe-diagrams/31-moe.webp", "txt": null, "search": "moe (mixture of experts, 전문가 혼합 모델) moe 전문가 혼합 · sparse 활성화 ai·데이터 모델 경량화·추론 ⭐ 기출빈출 기출 빈출 중요 하나의 거대한 밀집(dense) 신경망 대신 여러 개의 특화된 전문가 서브네트워크(expert) 를 두고, 라우터(router/gating network) 가 입력 토큰마다 일부(top-k)만 선택 활성화 하는 희소(sparse) 아키텍처 핵심 구성요소 : router (gating network) : 입력 토큰의 특성을 보고 가장 적합한 상위 top-k 개 expert를 동적 선택 및 가중치 부여 sparse experts : ffn(feed-forward network) 등을 여러 전문가 블록으로 분할, 선택된 일부만 연산 수행 장점 : 전체 파라미터 규모(지식 용량)를 크게 키우면서도 토큰당 활성 파라미터·연산량(flops) 은 적게 유지해 학습·추론 속도 향상 단점 및 과제 : 추론 시 연산은 일부만 해도 전체 expert를 메모리에 적재 해야 해 vram 부담 큼 특정 expert에만 토큰이 몰리는 현상 방지를 위한 load balancing loss 설계 필수 관점(측면) 특징 설명 구성 요소 router + experts 게이트 네트워크가 토큰마다 적합한 top-k 전문가를 선택하고 가중치를 부여 연산 방식 sparse activation 선택된 일부 ffn만 계산해 전체 파라미터 대비 토큰당 flops를 크게 절감 자원 특성 지식 용량 vs vram 파라미터 규모는 키우면서 연산은 줄지만, 추론 시 전체 expert 적재로 메모리 부담 학습 안정화 load balancing 특정 전문가 쏠림을 막는 보조 손실과 통신·병렬화 전략이 필수 두음: 라·스·밸 — 라(router top-k)·스(sparse 활성)·밸(load balancing) router(top-k 선택) + sparse activation(연산 효율 ↑) + 단점(vram 부담·load balancing) 세트!"}, {"id": "quant", "cat": "ai", "sub": "ai-model", "parent": "sllm", "t": "양자화 vs 지식 증류", "s": "모델 경량화 3종", "stars": 1, "redStar": false, "full": "모델 경량화: 양자화 vs 지식 증류", "catLabel": "AI·데이터", "st": "📌 복습 필요", "d": "2026-11-19", "def": "<p>온디바이스 AI·sLM 환경을 위해 거대 AI 모델의 크기와 연산량을 줄이는 대표 경량화 기법으로, <b>양자화는 수치 정밀도 축소<\/b>, <b>지식 증류는 모델 간 지식 전이<\/b> 방식.<\/p>", "kw": "<ul class=\"kw\"><li><b>양자화 (Quantization)<\/b>: 가중치(Weight)·활성화 값의 비트 정밀도를 <b>FP32(32비트) → INT8/INT4(8·4비트)<\/b> 등으로 낮춰 메모리·연산량 절감 (<code>PTQ<\/code> 사후 양자화 / <code>QAT<\/code> 학습 중 양자화)<\/li><li><b>지식 증류 (Knowledge Distillation)<\/b>: 거대 모델(<b>Teacher<\/b>)의 출력 확률 분포(<b>Soft Label<\/b>)를 소형 모델(<b>Student<\/b>)이 모방 학습<\/li><li><b>3대 경량화 세트<\/b>: <b>양자화<\/b>(비트 축소) · <b>지식 증류<\/b>(Teacher-Student) · <b>가지치기(Pruning)<\/b>(불필요 가중치/연결 제거)<\/li><\/ul>", "pp": "<div class=\"tblwrap\"><table class=\"cmp\"><colgroup><col style=\"width:24%\"><col style=\"width:28%\"><col style=\"width:48%\"><\/colgroup><thead><tr><th>관점(측면)<\/th><th>특징<\/th><th>설명<\/th><\/tr><\/thead><tbody><tr><td class=\"k\">압축 대상<\/td><td>비트 vs 지식<\/td><td>양자화는 가중치·활성화의 수치 정밀도를 낮추고, 지식 증류는 Teacher의 출력 분포를 Student로 전이<\/td><\/tr><tr><td class=\"k\">적용 시점<\/td><td>PTQ vs QAT<\/td><td>학습 후 사후 양자화(PTQ)는 즉시 적용, 학습 중 양자화(QAT)는 정확도 손실을 보정<\/td><\/tr><tr><td class=\"k\">비용·효과<\/td><td>메모리·연산 절감<\/td><td>양자화는 저장·연산량을 직접 줄이고, 증류는 라벨 없는 데이터를 활용해 소형 모델 정확도를 끌어올림<\/td><\/tr><tr><td class=\"k\">조합 설계<\/td><td>양자화+증류+Pruning<\/td><td>3대 경량화 세트를 조합해 온디바이스·sLM의 지연·비용·정확도 목표를 동시에 맞춤<\/td><\/tr><\/tbody><\/table><\/div>", "rv": "<div class=\"q\"><b>두음: 양·증·프<\/b> — 양(FP32→INT8/INT4)·증(Teacher→Student 증류)·프(Pruning 가지치기)<\/div>\n<div class=\"q\">\"양자화 = <b>FP32→INT8 비트 정밀도 축소<\/b>, 지식 증류 = <b>Teacher→Student Soft Label 전이<\/b>\" 두 축에 <b>Pruning(가지치기)<\/b>까지 엮어 쓰기!<\/div>", "img": "itpe-diagrams/17-%EC%96%91%EC%9E%90%ED%99%94-%EC%A7%80%EC%8B%9D%EC%A6%9D%EB%A5%98.webp", "txt": null, "search": "모델 경량화: 양자화 vs 지식 증류 양자화 vs 지식 증류 모델 경량화 3종 ai·데이터 모델 경량화·추론 ⭐ 기출빈출 기출 빈출 중요 온디바이스 ai·slm 환경을 위해 거대 ai 모델의 크기와 연산량을 줄이는 대표 경량화 기법으로, 양자화는 수치 정밀도 축소 , 지식 증류는 모델 간 지식 전이 방식. 양자화 (quantization) : 가중치(weight)·활성화 값의 비트 정밀도를 fp32(32비트) → int8/int4(8·4비트) 등으로 낮춰 메모리·연산량 절감 ( ptq 사후 양자화 / qat 학습 중 양자화) 지식 증류 (knowledge distillation) : 거대 모델( teacher )의 출력 확률 분포( soft label )를 소형 모델( student )이 모방 학습 3대 경량화 세트 : 양자화 (비트 축소) · 지식 증류 (teacher-student) · 가지치기(pruning) (불필요 가중치/연결 제거) 관점(측면) 특징 설명 압축 대상 비트 vs 지식 양자화는 가중치·활성화의 수치 정밀도를 낮추고, 지식 증류는 teacher의 출력 분포를 student로 전이 적용 시점 ptq vs qat 학습 후 사후 양자화(ptq)는 즉시 적용, 학습 중 양자화(qat)는 정확도 손실을 보정 비용·효과 메모리·연산 절감 양자화는 저장·연산량을 직접 줄이고, 증류는 라벨 없는 데이터를 활용해 소형 모델 정확도를 끌어올림 조합 설계 양자화+증류+pruning 3대 경량화 세트를 조합해 온디바이스·slm의 지연·비용·정확도 목표를 동시에 맞춤 두음: 양·증·프 — 양(fp32→int8/int4)·증(teacher→student 증류)·프(pruning 가지치기) \"양자화 = fp32→int8 비트 정밀도 축소 , 지식 증류 = teacher→student soft label 전이 \" 두 축에 pruning(가지치기) 까지 엮어 쓰기!"}, {"id": "finetuning", "cat": "ai", "sub": "ai-model", "parent": "sllm", "t": "LLM 파인튜닝", "s": "Full·PEFT(LoRA)·RLHF/DPO", "stars": 3, "redStar": false, "full": "LLM 파인튜닝 (Fine-Tuning)", "catLabel": "AI·데이터", "st": "📌 복습 필요", "d": "2026-11-21", "def": "<p>사전학습(Pre-trained)된 거대언어모델에 <b>특정 도메인 데이터나 지시-응답(Instruction) 데이터<\/b>를 추가 학습시켜 모델의 가중치를 목적에 맞게 최적화하는 기법<\/p>", "kw": "<ul class=\"kw\"><li><b>주요 유형 3단계<\/b>:<ul class=\"kw\"><li><b>Full Fine-Tuning<\/b>: 전체 파라미터 재학습 — 성능 최상, GPU·메모리 비용 막대, Catastrophic Forgetting 위험<\/li><li><b>PEFT (LoRA · QLoRA)<\/b>: 기존 가중치는 동결(Freeze)하고 소형 어댑터만 학습 — 비용·메모리 획기적 절감<\/li><li><b>Alignment (SFT · RLHF · DPO)<\/b>: 지시 따르기(Instruction Tuning) 및 인간 선호도(유해성 배제·정확성) 정렬<\/li><\/ul><\/li><li><b>RAG vs Fine-Tuning<\/b>:<ul class=\"kw\"><li><b>RAG<\/b>: 최신·빈번히 변하는 외부 사실 지식 주입(근거 제시)<\/li><li><b>Fine-Tuning<\/b>: 도메인 특화 문체·출력 형식·추론 방식 내재화 (실무는 RAG+PEFT 병행)<\/li><\/ul><\/li><\/ul>", "pp": "<div class=\"tblwrap\"><table class=\"cmp\"><colgroup><col style=\"width:24%\"><col style=\"width:28%\"><col style=\"width:48%\"><\/colgroup><thead><tr><th>관점(측면)<\/th><th>특징<\/th><th>설명<\/th><\/tr><\/thead><tbody><tr><td class=\"k\">학습 범위 관점<\/td><td>Full vs PEFT(LoRA)<\/td><td>전체 가중치 갱신 vs 동결 후 저랭크 어댑터만 학습해 자원 절감<\/td><\/tr><tr><td class=\"k\">정렬(Alignment)<\/td><td>SFT · RLHF · DPO<\/td><td>지시-응답 쌍 학습 후 보상모델·선호 데이터로 안전성·유용성 정렬<\/td><\/tr><tr><td class=\"k\">지식·비용 관점<\/td><td>RAG와 상호보완<\/td><td>실시간 사실은 RAG, 문체·형식·전문 패턴은 Fine-Tuning으로 역할 분담<\/td><\/tr><tr><td class=\"k\">리스크·운영<\/td><td>망각·오버피팅<\/td><td>Catastrophic Forgetting(기존 능력 상실) 방지 위해 학습률·데이터 균형 필수<\/td><\/tr><\/tbody><\/table><\/div>", "rv": "<div class=\"q\"><b>두음: 풀·페·정<\/b> — 풀(Full Fine-Tuning)·페(PEFT·LoRA)·정(Alignment SFT·RLHF·DPO)<\/div>\n<div class=\"q\"><b>Full vs PEFT(LoRA) + Alignment(SFT·RLHF·DPO) + RAG와 역할 분담<\/b> 3축으로 정리!<\/div>", "img": "itpe-diagrams/38-finetuning.webp", "txt": null, "search": "llm 파인튜닝 (fine-tuning) llm 파인튜닝 full·peft(lora)·rlhf/dpo ai·데이터 모델 경량화·추론 ⭐⭐⭐ 기출빈출 기출 빈출 중요 사전학습(pre-trained)된 거대언어모델에 특정 도메인 데이터나 지시-응답(instruction) 데이터 를 추가 학습시켜 모델의 가중치를 목적에 맞게 최적화하는 기법 주요 유형 3단계 : full fine-tuning : 전체 파라미터 재학습 — 성능 최상, gpu·메모리 비용 막대, catastrophic forgetting 위험 peft (lora · qlora) : 기존 가중치는 동결(freeze)하고 소형 어댑터만 학습 — 비용·메모리 획기적 절감 alignment (sft · rlhf · dpo) : 지시 따르기(instruction tuning) 및 인간 선호도(유해성 배제·정확성) 정렬 rag vs fine-tuning : rag : 최신·빈번히 변하는 외부 사실 지식 주입(근거 제시) fine-tuning : 도메인 특화 문체·출력 형식·추론 방식 내재화 (실무는 rag+peft 병행) 관점(측면) 특징 설명 학습 범위 관점 full vs peft(lora) 전체 가중치 갱신 vs 동결 후 저랭크 어댑터만 학습해 자원 절감 정렬(alignment) sft · rlhf · dpo 지시-응답 쌍 학습 후 보상모델·선호 데이터로 안전성·유용성 정렬 지식·비용 관점 rag와 상호보완 실시간 사실은 rag, 문체·형식·전문 패턴은 fine-tuning으로 역할 분담 리스크·운영 망각·오버피팅 catastrophic forgetting(기존 능력 상실) 방지 위해 학습률·데이터 균형 필수 두음: 풀·페·정 — 풀(full fine-tuning)·페(peft·lora)·정(alignment sft·rlhf·dpo) full vs peft(lora) + alignment(sft·rlhf·dpo) + rag와 역할 분담 3축으로 정리!"}, {"id": "lora", "cat": "ai", "sub": "ai-model", "parent": "sllm", "t": "LoRA · QLoRA (PEFT)", "s": "Freeze · 저랭크 어댑터 · 4-bit", "stars": 2, "redStar": false, "full": "sLLM & LoRA / QLoRA", "catLabel": "AI·데이터", "st": "📌 복습 필요", "d": "2026-11-20", "def": "<ul class=\"kw\"><li><b>sLLM (Small LLM)<\/b>: 특정 도메인·온프레미스 환경에 최적화해 파라미터 수를 줄인 경량 거대언어모델 (비용·추론 지연 감소, 내부 보안 유지)<\/li><li><b>LoRA (Low-Rank Adaptation)<\/b>: 사전학습 모델의 기존 가중치(W)는 <b>동결(Freeze)<\/b>하고, 옆에 <b>저차원 분해 행렬(A·B)<\/b>만 붙여 학습하는 <b>PEFT<\/b> 대표 기법<\/li><li><b>QLoRA<\/b>: 기존 가중치(W)를 <b>4-bit(NF4)로 양자화<\/b>하여 VRAM을 극적으로 줄인 상태에서 LoRA 어댑터만 16-bit로 학습하는 기법<\/li><\/ul>", "kw": "<ul class=\"kw\"><li><b>PEFT (Parameter-Efficient Fine-Tuning)<\/b>: 전체 파라미터 재학습(Full Fine-Tuning) 대비 소수 파라미터(1% 미만)만 학습<\/li><li><b>LoRA 원리<\/b>: W + ΔW 에서 ΔW를 저차원 행렬 A×B로 근사 → 추론 시 병합 가능(추가 지연 없음)<\/li><li><b>QLoRA 핵심 3요소<\/b>: 4-bit NormalFloat(NF4) 양자화 + Double Quantization + Paged Optimizers<\/li><\/ul>", "pp": "<div class=\"tblwrap\"><table class=\"cmp\"><colgroup><col style=\"width:24%\"><col style=\"width:28%\"><col style=\"width:48%\"><\/colgroup><thead><tr><th>관점(측면)<\/th><th>특징<\/th><th>설명<\/th><\/tr><\/thead><tbody><tr><td class=\"k\">모델 규모<\/td><td>sLLM<\/td><td>도메인·온프레미스에 특화해 파라미터를 줄이고 비용·지연·내부 보안을 확보<\/td><\/tr><tr><td class=\"k\">학습 방식<\/td><td>PEFT·Freeze<\/td><td>사전학습 가중치를 동결하고 1% 미만 파라미터만 학습해 자원을 절감<\/td><\/tr><tr><td class=\"k\">어댑터 구조<\/td><td>저차원 A·B<\/td><td>ΔW를 저차원 행렬 곱으로 근사해 학습하고 추론 시 병합해 추가 지연을 없앰<\/td><\/tr><tr><td class=\"k\">자원 절감<\/td><td>QLoRA 4-bit NF4<\/td><td>4비트 NF4 양자화 + Double Quantization + Paged Optimizer로 VRAM을 대폭 축소<\/td><\/tr><\/tbody><\/table><\/div>", "rv": "<div class=\"q\"><b>두음: 동·저·병 / 포·더·페<\/b> — 동(가중치 Freeze)·저(저랭크 A×B)·병(추론 시 병합) / 포(NF4 4-bit)·더(Double Quant)·페(Paged Optimizer)<\/div>\n<div class=\"q\"><b>PEFT + 기존 가중치 Freeze + 저차원 행렬(A·B) + QLoRA(4-bit NF4 양자화)<\/b>!<\/div>", "img": "itpe-diagrams/34-sllm-lora-qlora.webp", "txt": null, "search": "sllm & lora / qlora lora · qlora (peft) freeze · 저랭크 어댑터 · 4-bit ai·데이터 모델 경량화·추론 ⭐⭐ 기출빈출 기출 빈출 중요 sllm (small llm) : 특정 도메인·온프레미스 환경에 최적화해 파라미터 수를 줄인 경량 거대언어모델 (비용·추론 지연 감소, 내부 보안 유지) lora (low-rank adaptation) : 사전학습 모델의 기존 가중치(w)는 동결(freeze) 하고, 옆에 저차원 분해 행렬(a·b) 만 붙여 학습하는 peft 대표 기법 qlora : 기존 가중치(w)를 4-bit(nf4)로 양자화 하여 vram을 극적으로 줄인 상태에서 lora 어댑터만 16-bit로 학습하는 기법 peft (parameter-efficient fine-tuning) : 전체 파라미터 재학습(full fine-tuning) 대비 소수 파라미터(1% 미만)만 학습 lora 원리 : w + δw 에서 δw를 저차원 행렬 a×b로 근사 → 추론 시 병합 가능(추가 지연 없음) qlora 핵심 3요소 : 4-bit normalfloat(nf4) 양자화 + double quantization + paged optimizers 관점(측면) 특징 설명 모델 규모 sllm 도메인·온프레미스에 특화해 파라미터를 줄이고 비용·지연·내부 보안을 확보 학습 방식 peft·freeze 사전학습 가중치를 동결하고 1% 미만 파라미터만 학습해 자원을 절감 어댑터 구조 저차원 a·b δw를 저차원 행렬 곱으로 근사해 학습하고 추론 시 병합해 추가 지연을 없앰 자원 절감 qlora 4-bit nf4 4비트 nf4 양자화 + double quantization + paged optimizer로 vram을 대폭 축소 두음: 동·저·병 / 포·더·페 — 동(가중치 freeze)·저(저랭크 a×b)·병(추론 시 병합) / 포(nf4 4-bit)·더(double quant)·페(paged optimizer) peft + 기존 가중치 freeze + 저차원 행렬(a·b) + qlora(4-bit nf4 양자화) !"}, {"id": "model-merging", "cat": "ai", "sub": "ai-model", "parent": null, "t": "모델 병합", "s": "Task Arithmetic·SLERP·TIES·DARE", "stars": 1, "redStar": false, "full": "모델 병합 기술 (Task Arithmetic · SLERP · TIES · DARE)", "catLabel": "AI·데이터", "st": "📌 복습 필요", "d": "2026-11-25", "def": "<p><b>모델 병합(Model Merging)<\/b>은 같은 베이스 모델에서 파인튜닝된 여러 체크포인트의 <b>가중치를 학습 없이 결합<\/b>해 다능한 단일 모델을 만드는 기법. <b>Task Arithmetic<\/b>은 태스크 벡터를 더하고 빼서 능력을 조합·제거하고, <b>SLERP<\/b>는 두 가중치 사이를 구면 보간하며, <b>TIES-Merging·DARE<\/b>는 파라미터 간 <b>충돌·중복(간섭)<\/b>을 정리해 다중 태스크 병합의 성능 붕괴를 막는 <b>학습 없는 모델 결합 기법<\/b>.<\/p>", "kw": "<ul class=\"kw\"><li><b>Task Vector<\/b>: τ = θft − θbase — 태스크 벡터의 가산·감산으로 능력 추가·망각 제거<\/li><li><b>SLERP<\/b>: 구면 선형 보간(Spherical Linear Interpolation) — 방향 유지·크기 보존, <b>2개 모델<\/b> 사이에만 적용<\/li><li><b>TIES-Merging<\/b>: ① Trim(작은 델타 제거) ② Elect Sign(부호 충돌 해소) ③ Disjoint Merge(평균) 3단계<\/li><li><b>DARE<\/b>: 델타를 확률 p로 무작위 드롭 후 <b>1/(1−p) 재스케일<\/b> — 중복 파라미터 제거, TIES와 조합(DARE-TIES)<\/li><li><b>Model Soups<\/b>: 동일 설정·다른 시드/하이퍼파라미터 체크포인트의 가중 평균(Uniform·Greedy Soup)<\/li><li><b>도구<\/b>: MergeKit(YAML 설정), 자체 스크립트 — 병합 후 MT-Bench·도메인 벤치로 검증<\/li><li><b>전제조건<\/b>: 동일 베이스 모델 계열·아키텍처·토크나이저여야 병합 가능(다른 계열은 불가)<\/li><\/ul>", "pp": "<h4>1) Task Arithmetic vs TIES-Merging (비교모듈: 목·데·비·최·보·환)<\/h4>\n<div class=\"tblwrap\"><table class=\"cmp\"><colgroup><col style=\"width:24%\"><col style=\"width:28%\"><col style=\"width:48%\"><\/colgroup><thead><tr><th>구분<\/th><th>Task Arithmetic<\/th><th>TIES-Merging<\/th><\/tr><\/thead><tbody><tr><td class=\"k\">목적<\/td><td>태스크 벡터 가·감산으로 능력 조합·제거<\/td><td>파라미터 충돌·간섭을 정리해 다중 태스크 병합<\/td><\/tr><tr><td class=\"k\">데이터 요구<\/td><td>동일 베이스에서 파인튜닝한 체크포인트 세트<\/td><td>동일 + 태스크별 검증셋(스케일 계수 조정)<\/td><\/tr><tr><td class=\"k\">비용<\/td><td>병합 연산만(수 분), GPU 학습 불필요<\/td><td>Trim·부호 선택 추가 연산, 여전히 학습 불필요<\/td><\/tr><tr><td class=\"k\">최신성(모델 호환)<\/td><td>베이스 모델 버전·토크나이저 일치 필수<\/td><td>동일 — 베이스가 바뀌면 재병합<\/td><\/tr><tr><td class=\"k\">보안<\/td><td>공개 가중치 병합 시 백도어·악성 델타 혼입 검증<\/td><td>동일 + 출처·서명·스캔 강화<\/td><\/tr><tr><td class=\"k\">신뢰성(성능 보존)<\/td><td>태스크 수가 늘면 간섭으로 성능 저하<\/td><td>충돌 해소로 다중 태스크 성능 보존 우수<\/td><\/tr><\/tbody><\/table><\/div>\n<h4>2) 병합 기법 5종 비교<\/h4>\n<div class=\"tblwrap\"><table class=\"cmp\"><colgroup><col style=\"width:24%\"><col style=\"width:28%\"><col style=\"width:48%\"><\/colgroup><thead><tr><th>기법<\/th><th>핵심 원리<\/th><th>적용 조건·특징<\/th><\/tr><\/thead><tbody><tr><td class=\"k\">Task Arithmetic<\/td><td>태스크 벡터 가산·감산(λ 스케일)<\/td><td>동일 베이스, 다수 태스크 조합·능력 제거<\/td><\/tr><tr><td class=\"k\">SLERP<\/td><td>두 가중치 구면 보간(t 값)<\/td><td>2개 모델 한정, 방향·크기 보존<\/td><\/tr><tr><td class=\"k\">TIES-Merging<\/td><td>Trim → Elect Sign → Disjoint Merge<\/td><td>다수 태스크, 부호 충돌이 큰 경우<\/td><\/tr><tr><td class=\"k\">DARE<\/td><td>델타 무작위 드롭 + 재스케일<\/td><td>파라미터 중복이 많은 모델, TIES와 결합<\/td><\/tr><tr><td class=\"k\">Model Soups<\/td><td>체크포인트 가중 평균(Uniform·Greedy)<\/td><td>동일 학습 설정·다른 시드, 일반화 향상<\/td><\/tr><\/tbody><\/table><\/div>\n<h4>3) 실무 절차·고려사항<\/h4>\n<div class=\"tblwrap\"><table class=\"cmp\"><colgroup><col style=\"width:24%\"><col style=\"width:28%\"><col style=\"width:48%\"><\/colgroup><thead><tr><th>구분<\/th><th>키워드<\/th><th>설명<\/th><\/tr><\/thead><tbody><tr><td class=\"k\">준비<\/td><td>베이스 고정<\/td><td>동일 revision·토크나이저 확인, 병합 계보(Lineage) 기록<\/td><\/tr><tr><td class=\"k\">설계<\/td><td>병합 조합 선택<\/td><td>태스크 수·충돌 정도로 기법 선택, λ·드롭률은 검증셋으로 탐색<\/td><\/tr><tr><td class=\"k\">검증<\/td><td>망각·간섭 측정<\/td><td>병합 전후 태스크별 성능표, 일반 능력(MT-Bench) 하락 확인<\/td><\/tr><tr><td class=\"k\">배포<\/td><td>양자화·서빙<\/td><td>병합 후 양자화 적용 가능하나 정밀도 손실 재검증<\/td><\/tr><tr><td class=\"k\">거버넌스<\/td><td>라이선스·출처<\/td><td>병합 결과의 라이선스 상속·모델 카드 갱신<\/td><\/tr><\/tbody><\/table><\/div>", "rv": "<div class=\"q\"><b>두음: 타·슬·타·데·수<\/b> — Task Arithmetic·SLERP·TIES·DARE·Soups / <b>트·전·병<\/b> — Trim·Elect Sign·Disjoint Merge<\/div>\n<div class=\"q\"><b>\"학습 없이 가중치만 합쳐 다능 모델 — 충돌은 TIES, 중복은 DARE로 정리\"<\/b><\/div>", "img": "itpe-diagrams/132-model-merging.webp", "txt": null, "search": "모델 병합 기술 (task arithmetic · slerp · ties · dare) 모델 병합 task arithmetic·slerp·ties·dare ai·데이터 모델 경량화·추론 ⭐ 기출빈출 기출 빈출 중요 모델 병합(model merging) 은 같은 베이스 모델에서 파인튜닝된 여러 체크포인트의 가중치를 학습 없이 결합 해 다능한 단일 모델을 만드는 기법. task arithmetic 은 태스크 벡터를 더하고 빼서 능력을 조합·제거하고, slerp 는 두 가중치 사이를 구면 보간하며, ties-merging·dare 는 파라미터 간 충돌·중복(간섭) 을 정리해 다중 태스크 병합의 성능 붕괴를 막는 학습 없는 모델 결합 기법 . task vector : τ = θft − θbase — 태스크 벡터의 가산·감산으로 능력 추가·망각 제거 slerp : 구면 선형 보간(spherical linear interpolation) — 방향 유지·크기 보존, 2개 모델 사이에만 적용 ties-merging : ① trim(작은 델타 제거) ② elect sign(부호 충돌 해소) ③ disjoint merge(평균) 3단계 dare : 델타를 확률 p로 무작위 드롭 후 1/(1−p) 재스케일 — 중복 파라미터 제거, ties와 조합(dare-ties) model soups : 동일 설정·다른 시드/하이퍼파라미터 체크포인트의 가중 평균(uniform·greedy soup) 도구 : mergekit(yaml 설정), 자체 스크립트 — 병합 후 mt-bench·도메인 벤치로 검증 전제조건 : 동일 베이스 모델 계열·아키텍처·토크나이저여야 병합 가능(다른 계열은 불가) 1) task arithmetic vs ties-merging (비교모듈: 목·데·비·최·보·환) 구분 task arithmetic ties-merging 목적 태스크 벡터 가·감산으로 능력 조합·제거 파라미터 충돌·간섭을 정리해 다중 태스크 병합 데이터 요구 동일 베이스에서 파인튜닝한 체크포인트 세트 동일 + 태스크별 검증셋(스케일 계수 조정) 비용 병합 연산만(수 분), gpu 학습 불필요 trim·부호 선택 추가 연산, 여전히 학습 불필요 최신성(모델 호환) 베이스 모델 버전·토크나이저 일치 필수 동일 — 베이스가 바뀌면 재병합 보안 공개 가중치 병합 시 백도어·악성 델타 혼입 검증 동일 + 출처·서명·스캔 강화 신뢰성(성능 보존) 태스크 수가 늘면 간섭으로 성능 저하 충돌 해소로 다중 태스크 성능 보존 우수 2) 병합 기법 5종 비교 기법 핵심 원리 적용 조건·특징 task arithmetic 태스크 벡터 가산·감산(λ 스케일) 동일 베이스, 다수 태스크 조합·능력 제거 slerp 두 가중치 구면 보간(t 값) 2개 모델 한정, 방향·크기 보존 ties-merging trim → elect sign → disjoint merge 다수 태스크, 부호 충돌이 큰 경우 dare 델타 무작위 드롭 + 재스케일 파라미터 중복이 많은 모델, ties와 결합 model soups 체크포인트 가중 평균(uniform·greedy) 동일 학습 설정·다른 시드, 일반화 향상 3) 실무 절차·고려사항 구분 키워드 설명 준비 베이스 고정 동일 revision·토크나이저 확인, 병합 계보(lineage) 기록 설계 병합 조합 선택 태스크 수·충돌 정도로 기법 선택, λ·드롭률은 검증셋으로 탐색 검증 망각·간섭 측정 병합 전후 태스크별 성능표, 일반 능력(mt-bench) 하락 확인 배포 양자화·서빙 병합 후 양자화 적용 가능하나 정밀도 손실 재검증 거버넌스 라이선스·출처 병합 결과의 라이선스 상속·모델 카드 갱신 두음: 타·슬·타·데·수 — task arithmetic·slerp·ties·dare·soups / 트·전·병 — trim·elect sign·disjoint merge \"학습 없이 가중치만 합쳐 다능 모델 — 충돌은 ties, 중복은 dare로 정리\""}, {"id": "ondevice", "cat": "ai", "sub": "ai-model", "parent": null, "t": "온디바이스 AI · NPU", "s": "저·프·비·오 / sLLM·양자화·NPU", "stars": 2, "redStar": false, "full": "온디바이스 AI(On-Device AI)와 NPU", "catLabel": "AI·데이터", "st": "📌 복습 필요", "d": "2026-11-21", "def": "<p>클라우드 서버와의 네트워크 통신 없이 <b>스마트폰·PC·자동차 등 사용자 단말기 자체의 NPU와 경량 모델(sLLM)<\/b>로 AI 추론을 직접 수행하는 기술<\/p>", "kw": "<ul class=\"kw\"><li><b>4대 핵심 장점 (저·프·비·오)<\/b>: <b>저지연<\/b>(실시간 응답) · <b>프라이버시<\/b>(민감 데이터 단말 내 보존) · <b>비용 절감<\/b>(클라우드 GPU/API 트래픽 감소) · <b>오프라인<\/b>(네트워크 단절 시에도 동작)<\/li><li><b>핵심 구현 기술<\/b>: <b>sLLM<\/b>(1B~7B 경량 모델) + <b>양자화/지식증류<\/b>(INT4/INT8 압축) + <b>NPU<\/b>(행렬·텐서 연산 전용 저전력 AI 반도체)<\/li><li><b>발전 방향 (Hybrid AI)<\/b>: 민감·단순 작업은 On-Device, 초거대·복잡 추론은 Cloud로 분산 처리<\/li><\/ul>", "pp": "<p><b>1) 개념 비교 (클라우드 AI vs 온디바이스 AI)<\/b><\/p>\n<div class=\"tblwrap\"><table class=\"cmp\"><colgroup><col style=\"width:24%\"><col style=\"width:28%\"><col style=\"width:48%\"><\/colgroup><thead><tr><th>구분<\/th><th>클라우드 AI<\/th><th>온디바이스 AI<\/th><\/tr><\/thead><tbody><tr><td class=\"k\">연산 위치<\/td><td>원격 클라우드 GPU 데이터센터<\/td><td>사용자 단말 내장 NPU · 모바일 SoC<\/td><\/tr><tr><td class=\"k\">지연·네트워크<\/td><td>네트워크 왕복 지연 · 인터넷 필수<\/td><td>초저지연(ms) · 오프라인 독립 실행<\/td><\/tr><tr><td class=\"k\">보안·비용<\/td><td>데이터 외부 전송 위험 · 지속 과금<\/td><td>단말 내 완결(고보안) · 서버 운영비 절감<\/td><\/tr><tr><td class=\"k\">모델 한계<\/td><td>초거대 모델(수백B+) 무제한 구동<\/td><td>메모리·배터리 제약으로 경량화 필수<\/td><\/tr><\/tbody><\/table><\/div>\n<p><b>2) 기술·운영 관점 구성표<\/b><\/p>\n<div class=\"tblwrap\"><table class=\"cmp\"><colgroup><col style=\"width:24%\"><col style=\"width:28%\"><col style=\"width:48%\"><\/colgroup><thead><tr><th>관점(측면)<\/th><th>특징<\/th><th>설명<\/th><\/tr><\/thead><tbody><tr><td class=\"k\">하드웨어 관점<\/td><td>NPU (전용 가속기)<\/td><td>CPU·GPU 대비 AI 행렬 곱셈을 저전력·고효율로 처리<\/td><\/tr><tr><td class=\"k\">모델·경량화 관점<\/td><td>sLLM · 양자화(INT4)<\/td><td>메모리 대역폭 한계를 극복하기 위해 비트 축소 및 KV-Cache 최적화<\/td><\/tr><tr><td class=\"k\">아키텍처 관점<\/td><td>Hybrid AI 분산<\/td><td>작업 난이도·보안 등급에 따라 단말과 클라우드를 동적 라우팅<\/td><\/tr><\/tbody><\/table><\/div>", "rv": "<div class=\"q\"><b>두음: 저·프·비·오 / 에·양·엔<\/b> — 저(저지연)·프(프라이버시)·비(비용절감)·오(오프라인) / 에(sLLM)·양(양자화)·엔(NPU)<\/div>\n<div class=\"q\"><b>클라우드 대비 4대 장점 + 3대 기술(sLLM·양자화·NPU) + Hybrid AI<\/b>!<\/div>", "img": "itpe-diagrams/56-ondevice-ai.webp", "txt": null, "search": "온디바이스 ai(on-device ai)와 npu 온디바이스 ai · npu 저·프·비·오 / sllm·양자화·npu ai·데이터 모델 경량화·추론 ⭐⭐ 기출빈출 기출 빈출 중요 클라우드 서버와의 네트워크 통신 없이 스마트폰·pc·자동차 등 사용자 단말기 자체의 npu와 경량 모델(sllm) 로 ai 추론을 직접 수행하는 기술 4대 핵심 장점 (저·프·비·오) : 저지연 (실시간 응답) · 프라이버시 (민감 데이터 단말 내 보존) · 비용 절감 (클라우드 gpu/api 트래픽 감소) · 오프라인 (네트워크 단절 시에도 동작) 핵심 구현 기술 : sllm (1b~7b 경량 모델) + 양자화/지식증류 (int4/int8 압축) + npu (행렬·텐서 연산 전용 저전력 ai 반도체) 발전 방향 (hybrid ai) : 민감·단순 작업은 on-device, 초거대·복잡 추론은 cloud로 분산 처리 1) 개념 비교 (클라우드 ai vs 온디바이스 ai) 구분 클라우드 ai 온디바이스 ai 연산 위치 원격 클라우드 gpu 데이터센터 사용자 단말 내장 npu · 모바일 soc 지연·네트워크 네트워크 왕복 지연 · 인터넷 필수 초저지연(ms) · 오프라인 독립 실행 보안·비용 데이터 외부 전송 위험 · 지속 과금 단말 내 완결(고보안) · 서버 운영비 절감 모델 한계 초거대 모델(수백b+) 무제한 구동 메모리·배터리 제약으로 경량화 필수 2) 기술·운영 관점 구성표 관점(측면) 특징 설명 하드웨어 관점 npu (전용 가속기) cpu·gpu 대비 ai 행렬 곱셈을 저전력·고효율로 처리 모델·경량화 관점 sllm · 양자화(int4) 메모리 대역폭 한계를 극복하기 위해 비트 축소 및 kv-cache 최적화 아키텍처 관점 hybrid ai 분산 작업 난이도·보안 등급에 따라 단말과 클라우드를 동적 라우팅 두음: 저·프·비·오 / 에·양·엔 — 저(저지연)·프(프라이버시)·비(비용절감)·오(오프라인) / 에(sllm)·양(양자화)·엔(npu) 클라우드 대비 4대 장점 + 3대 기술(sllm·양자화·npu) + hybrid ai !"}, {"id": "multimodal", "cat": "ai", "sub": "ai-fusion", "parent": null, "t": "멀티모달 AI · VLM", "s": "인·정·융 / CLIP·Cross-Attn", "stars": 2, "redStar": false, "full": "멀티모달 AI(Multimodal AI)와 VLM", "catLabel": "AI·데이터", "st": "📌 복습 필요", "d": "2026-11-21", "def": "<p>텍스트·이미지·영상·오디오 등 <b>서로 다른 모달리티(Modality) 데이터를 단일 통합 표현 공간에 정렬·융합<\/b>해 복합적인 이해·추론·생성을 수행하는 AI 모델<\/p>", "kw": "<ul class=\"kw\"><li><b>대표 멀티모달 모델<\/b>:<ul class=\"kw\"><li><b>VLM (Vision-Language Model, 시각-언어 모델)<\/b>: 이미지·영상(Vision)과 텍스트(Language)를 함께 보고 이해·추론 (예: GPT-4o, Gemini, Claude, LLaVA)<\/li><li><b>VLA (Vision-Language-Action)<\/b>: 시각·언어 이해에 물리적 행동(Action) 제어까지 결합 (로보틱스·자율주행)<\/li><\/ul><\/li><li><b>3대 핵심 파이프라인 (인·정·융)<\/b>:<ul class=\"kw\"><li><b>인코딩 (Encoding)<\/b>: 텍스트(Transformer) · 이미지(<b>ViT<\/b>) · 오디오 각 전용 인코더로 특징 벡터 추출<\/li><li><b>정렬 (Alignment)<\/b>: 서로 다른 모달리티를 동일 벡터 공간에 매핑 (<b>CLIP<\/b> 대조학습·Contrastive Learning)<\/li><li><b>융합 (Fusion)<\/b>: <b>Cross-Attention<\/b> · Adapter(Q-Former/MLP)로 LLM 백본에 시각 토큰 결합<\/li><\/ul><\/li><li><b>주요 활용·과제<\/b>: VQA(시각 질의응답), 문서 OCR·차트 해석, 멀티모달 RAG / 환각·연산 비용·모달리티 편향<\/li><\/ul>", "pp": "<div class=\"tblwrap\"><table class=\"cmp\"><colgroup><col style=\"width:24%\"><col style=\"width:28%\"><col style=\"width:48%\"><\/colgroup><thead><tr><th>관점(측면)<\/th><th>특징<\/th><th>설명<\/th><\/tr><\/thead><tbody><tr><td class=\"k\">아키텍처 관점<\/td><td>Encoder + Align + LLM<\/td><td>Early/Late Fusion 및 Cross-Attention을 통한 모달리티 간 의미 연결<\/td><\/tr><tr><td class=\"k\">학습·정렬 관점<\/td><td>CLIP 대조학습 · SFT<\/td><td>이미지-텍스트 쌍의 코사인 유사도를 극대화하는 사전학습 후 지시 미세조정<\/td><\/tr><tr><td class=\"k\">서비스·활용 관점<\/td><td>VLM · 멀티모달 RAG<\/td><td>PDF 도표·스캔 문서 직접 이해, 자율주행·의료 영상·로보틱스(VLA) 확장<\/td><\/tr><tr><td class=\"k\">한계·거버넌스 관점<\/td><td>환각 · 경량화 · 저작권<\/td><td>시각 정보 없는 추측(환각) 억제 및 NPU 온디바이스 양자화·학습 데이터 출처 관리<\/td><\/tr><\/tbody><\/table><\/div>", "rv": "<div class=\"q\"><b>두음: 인·정·융<\/b> — 인(모달리티 인코딩)·정(임베딩 정렬·CLIP)·융(Cross-Attention 융합)<\/div>\n<div class=\"q\"><b>CLIP(정렬) + ViT(시각 인코더) + Cross-Attention(LLM 융합)<\/b> 3종 키워드 필수!<\/div>", "img": "itpe-diagrams/66-multimodal-ai-vlm.webp", "txt": null, "search": "멀티모달 ai(multimodal ai)와 vlm 멀티모달 ai · vlm 인·정·융 / clip·cross-attn ai·데이터 융합·산업 ai ⭐⭐ 기출빈출 기출 빈출 중요 텍스트·이미지·영상·오디오 등 서로 다른 모달리티(modality) 데이터를 단일 통합 표현 공간에 정렬·융합 해 복합적인 이해·추론·생성을 수행하는 ai 모델 대표 멀티모달 모델 : vlm (vision-language model, 시각-언어 모델) : 이미지·영상(vision)과 텍스트(language)를 함께 보고 이해·추론 (예: gpt-4o, gemini, claude, llava) vla (vision-language-action) : 시각·언어 이해에 물리적 행동(action) 제어까지 결합 (로보틱스·자율주행) 3대 핵심 파이프라인 (인·정·융) : 인코딩 (encoding) : 텍스트(transformer) · 이미지( vit ) · 오디오 각 전용 인코더로 특징 벡터 추출 정렬 (alignment) : 서로 다른 모달리티를 동일 벡터 공간에 매핑 ( clip 대조학습·contrastive learning) 융합 (fusion) : cross-attention · adapter(q-former/mlp)로 llm 백본에 시각 토큰 결합 주요 활용·과제 : vqa(시각 질의응답), 문서 ocr·차트 해석, 멀티모달 rag / 환각·연산 비용·모달리티 편향 관점(측면) 특징 설명 아키텍처 관점 encoder + align + llm early/late fusion 및 cross-attention을 통한 모달리티 간 의미 연결 학습·정렬 관점 clip 대조학습 · sft 이미지-텍스트 쌍의 코사인 유사도를 극대화하는 사전학습 후 지시 미세조정 서비스·활용 관점 vlm · 멀티모달 rag pdf 도표·스캔 문서 직접 이해, 자율주행·의료 영상·로보틱스(vla) 확장 한계·거버넌스 관점 환각 · 경량화 · 저작권 시각 정보 없는 추측(환각) 억제 및 npu 온디바이스 양자화·학습 데이터 출처 관리 두음: 인·정·융 — 인(모달리티 인코딩)·정(임베딩 정렬·clip)·융(cross-attention 융합) clip(정렬) + vit(시각 인코더) + cross-attention(llm 융합) 3종 키워드 필수!"}, {"id": "fed-learn", "cat": "ai", "sub": "ai-trust", "parent": null, "t": "연합학습 · 차분 프라이버시", "s": "로·업·집·배 / 모델역전·ε-DP", "stars": 2, "redStar": false, "full": "연합학습(Federated Learning)과 차분 프라이버시", "catLabel": "AI·데이터", "st": "📌 복습 필요", "d": "2026-11-22", "def": "<ul class=\"kw\"><li><b>연합학습 (Federated Learning, FL)<\/b>: 민감한 원본 데이터를 중앙 서버로 모으지 않고 각 단말·기관에서 로컬 학습한 뒤 <b>모델 파라미터(가중치·Gradient)만 중앙에서 집계(FedAvg)<\/b>하는 분산 AI 학습 기법<\/li><li><b>차분 프라이버시 (Differential Privacy, DP)<\/b>: 집계·학습 과정에 수학적 노이즈(Laplace/Gaussian)를 주입해 <b>특정 개인 데이터의 포함 여부를 역추적할 수 없도록 보장<\/b>하는 프라이버시 보호 기술<\/li><\/ul>", "kw": "<ul class=\"kw\"><li><b>연합학습 4단계 (로·업·집·배)<\/b>: 로컬 학습 → 파라미터 업로드(원본 반출 X) → <b>FedAvg<\/b> 글로벌 집계 → 모델 배포<\/li><li><b>잔여 위협과 보완<\/b>: 가중치만 모아도 <b>모델 역전 공격(Model Inversion)<\/b>·멤버십 추론 위험 존재 → <b>차분 프라이버시(ε 예산) · 동형암호(FHE) · TEE<\/b> 결합<\/li><\/ul>", "pp": "<div class=\"tblwrap\"><table class=\"cmp\"><col
