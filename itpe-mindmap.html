group><col style=\"width:24%\"><col style=\"width:28%\"><col style=\"width:48%\"><\/colgroup><thead><tr><th>관점(측면)<\/th><th>특징<\/th><th>설명<\/th><\/tr><\/thead><tbody><tr><td class=\"k\">프라이버시·규제 관점<\/td><td>원본 비반출 + ε-DP<\/td><td>개인정보보호법·의료법 등 데이터 반출 금지 규제 준수(개인정보 역추적 차단)<\/td><\/tr><tr><td class=\"k\">기술·보안 결합 관점<\/td><td>FL + DP + FHE/TEE<\/td><td>Gradient 암호화(동형암호)·신뢰실행환경(TEE)으로 중앙 서버 공격까지 방어<\/td><\/tr><tr><td class=\"k\">성능·트레이드오프 관점<\/td><td>Non-IID · 노이즈 균형<\/td><td>단말별 데이터 편향(Non-IID)으로 수렴 저하 및 DP 노이즈 과다 시 모델 정확도 하락<\/td><\/tr><tr><td class=\"k\">도메인 활용<\/td><td>의료 · 금융 · 온디바이스<\/td><td>다기관 병원 암 진단 모델 공동 학습, 스마트폰 키보드 다음 단어 예측<\/td><\/tr><\/tbody><\/table><\/div>", "rv": "<div class=\"q\"><b>두음: 로·업·집·배 / 역·노·입<\/b> — 로컬학습·업로드·집계(FedAvg)·배포 / 역전공격·노이즈주입·입실론(ε)<\/div>\n<div class=\"q\"><b>연합학습(데이터 격리) + 차분 프라이버시(가중치 역추적 방어)<\/b> 결합이 핵심!<\/div>", "img": "itpe-diagrams/74-federated-learning-dp.webp", "txt": null, "search": "연합학습(federated learning)과 차분 프라이버시 연합학습 · 차분 프라이버시 로·업·집·배 / 모델역전·ε-dp ai·데이터 ai 신뢰성·거버넌스 ⭐⭐ 기출빈출 기출 빈출 중요 연합학습 (federated learning, fl) : 민감한 원본 데이터를 중앙 서버로 모으지 않고 각 단말·기관에서 로컬 학습한 뒤 모델 파라미터(가중치·gradient)만 중앙에서 집계(fedavg) 하는 분산 ai 학습 기법 차분 프라이버시 (differential privacy, dp) : 집계·학습 과정에 수학적 노이즈(laplace/gaussian)를 주입해 특정 개인 데이터의 포함 여부를 역추적할 수 없도록 보장 하는 프라이버시 보호 기술 연합학습 4단계 (로·업·집·배) : 로컬 학습 → 파라미터 업로드(원본 반출 x) → fedavg 글로벌 집계 → 모델 배포 잔여 위협과 보완 : 가중치만 모아도 모델 역전 공격(model inversion) ·멤버십 추론 위험 존재 → 차분 프라이버시(ε 예산) · 동형암호(fhe) · tee 결합 관점(측면) 특징 설명 프라이버시·규제 관점 원본 비반출 + ε-dp 개인정보보호법·의료법 등 데이터 반출 금지 규제 준수(개인정보 역추적 차단) 기술·보안 결합 관점 fl + dp + fhe/tee gradient 암호화(동형암호)·신뢰실행환경(tee)으로 중앙 서버 공격까지 방어 성능·트레이드오프 관점 non-iid · 노이즈 균형 단말별 데이터 편향(non-iid)으로 수렴 저하 및 dp 노이즈 과다 시 모델 정확도 하락 도메인 활용 의료 · 금융 · 온디바이스 다기관 병원 암 진단 모델 공동 학습, 스마트폰 키보드 다음 단어 예측 두음: 로·업·집·배 / 역·노·입 — 로컬학습·업로드·집계(fedavg)·배포 / 역전공격·노이즈주입·입실론(ε) 연합학습(데이터 격리) + 차분 프라이버시(가중치 역추적 방어) 결합이 핵심!"}, {"id": "synthetic", "cat": "ai", "sub": "ai-data", "parent": null, "t": "합성 데이터 · 모델 붕괴", "s": "개·희·고 / 원·필·다", "stars": 2, "redStar": false, "full": "합성 데이터와 모델 붕괴(Model Collapse)", "catLabel": "AI·데이터", "st": "📌 복습 필요", "d": "2026-11-22", "def": "<ul class=\"kw\"><li><b>합성 데이터 (Synthetic Data)<\/b>: 실제 데이터를 통계·생성형 AI(GAN·Diffusion·LLM)로 모방해 인위적으로 생성한 <b>개인정보 비식별·확장 학습 데이터<\/b><\/li><li><b>모델 붕괴 (Model Collapse)<\/b>: AI가 생성한 합성 데이터를 차세대 모델이 <b>반복 재학습(자가 소비)<\/b>하면서 데이터 분포의 꼬리(희귀 정보)가 소실되고 품질·다양성이 퇴화하는 현상<\/li><\/ul>", "kw": "<ul class=\"kw\"><li><b>합성 데이터 활용 가치 (개·희·고)<\/b>: <b>개인정보 규제<\/b> 회피(의료·금융), <b>희귀 케이스(Edge Case)<\/b> 보강, 고품질 실제 데이터 <b>고갈<\/b> 해소<\/li><li><b>모델 붕괴 원인 (표·근)<\/b>: 유한 샘플링에 따른 <b>통계적 근사 오차<\/b> 누적 + 생성 모델이 <b>분포의 꼬리(Tail)를 버리고 평균만 학습<\/b><\/li><li><b>완화 방안 (원·필·다)<\/b>: <b>실제 원본 데이터 혼합(Real Data Anchor)<\/b> · <b>품질 필터링/검증<\/b>(중복·오류 제거) · <b>다양성 유지<\/b>(이종 모델·디코딩 다양화)<\/li><\/ul>", "pp": "<div class=\"tblwrap\"><table class=\"cmp\"><colgroup><col style=\"width:24%\"><col style=\"width:28%\"><col style=\"width:48%\"><\/colgroup><thead><tr><th>관점(측면)<\/th><th>특징<\/th><th>설명<\/th><\/tr><\/thead><tbody><tr><td class=\"k\">데이터 확보 관점<\/td><td>생성형 AI 기반 확장<\/td><td>GAN·Diffusion(이미지)·LLM(텍스트/추론)으로 비용·개인정보 제약 없이 대규모 데이터 확보<\/td><\/tr><tr><td class=\"k\">품질·열화 관점<\/td><td>Tail 소실 → 분산 축소<\/td><td>세대가 거듭될수록 소수·희귀 패턴(Long-tail)이 사라지고 단조로운 평균 출력으로 수렴<\/td><\/tr><tr><td class=\"k\">완화·거버넌스 관점<\/td><td>Real Anchor + 워터마킹<\/td><td>실제 인간 데이터 일정 비율 고정 혼합, AI 생성물 출처 추적(Data Lineage·워터마크)으로 오염 방지<\/td><\/tr><\/tbody><\/table><\/div>", "rv": "<div class=\"q\"><b>두음: 개·희·고 / 원·필·다<\/b> — 개인정보·희귀케이스·고갈 / 원본혼합·필터링·다양성<\/div>\n<div class=\"q\"><b>합성 데이터(장점) ↔ 모델 붕괴(역설·부작용) ↔ Real Data Anchor(해결책)<\/b> 흐름으로 서술!<\/div>", "img": "itpe-diagrams/79-synthetic-data-model-collapse.webp", "txt": null, "search": "합성 데이터와 모델 붕괴(model collapse) 합성 데이터 · 모델 붕괴 개·희·고 / 원·필·다 ai·데이터 데이터 엔지니어링·운영 ⭐⭐ 기출빈출 기출 빈출 중요 합성 데이터 (synthetic data) : 실제 데이터를 통계·생성형 ai(gan·diffusion·llm)로 모방해 인위적으로 생성한 개인정보 비식별·확장 학습 데이터 모델 붕괴 (model collapse) : ai가 생성한 합성 데이터를 차세대 모델이 반복 재학습(자가 소비) 하면서 데이터 분포의 꼬리(희귀 정보)가 소실되고 품질·다양성이 퇴화하는 현상 합성 데이터 활용 가치 (개·희·고) : 개인정보 규제 회피(의료·금융), 희귀 케이스(edge case) 보강, 고품질 실제 데이터 고갈 해소 모델 붕괴 원인 (표·근) : 유한 샘플링에 따른 통계적 근사 오차 누적 + 생성 모델이 분포의 꼬리(tail)를 버리고 평균만 학습 완화 방안 (원·필·다) : 실제 원본 데이터 혼합(real data anchor) · 품질 필터링/검증 (중복·오류 제거) · 다양성 유지 (이종 모델·디코딩 다양화) 관점(측면) 특징 설명 데이터 확보 관점 생성형 ai 기반 확장 gan·diffusion(이미지)·llm(텍스트/추론)으로 비용·개인정보 제약 없이 대규모 데이터 확보 품질·열화 관점 tail 소실 → 분산 축소 세대가 거듭될수록 소수·희귀 패턴(long-tail)이 사라지고 단조로운 평균 출력으로 수렴 완화·거버넌스 관점 real anchor + 워터마킹 실제 인간 데이터 일정 비율 고정 혼합, ai 생성물 출처 추적(data lineage·워터마크)으로 오염 방지 두음: 개·희·고 / 원·필·다 — 개인정보·희귀케이스·고갈 / 원본혼합·필터링·다양성 합성 데이터(장점) ↔ 모델 붕괴(역설·부작용) ↔ real data anchor(해결책) 흐름으로 서술!"}, {"id": "synthetic-consumers", "cat": "ai", "sub": "ai-trust", "parent": null, "t": "합성 소비자", "s": "Synthetic Consumers", "stars": 1, "redStar": false, "full": "합성 소비자 (Synthetic Consumers)", "catLabel": "AI·데이터", "st": "📌 복습 필요", "d": "2026-11-25", "def": "<p><b>합성 소비자(Synthetic Consumers)<\/b>는 인구·가치관·행동 속성을 부여한 <b>LLM 페르소나<\/b>로 실제 소비자 반응을 대체·보완해 설문·가격 탄력성·구매 의도를 예측하는 <b>가상 소비자 시뮬레이션 기법<\/b><\/p>", "kw": "<ul class=\"kw\"><li><b>페르소나 설계<\/b>: 연령·소득·지역·직업·가치관·구매 이력 등 인구통계·심리 변수를 부여<\/li><li><b>알고리즘적 충실성(Algorithmic Fidelity)<\/b>: LLM이 실제 집단의 응답 분포를 얼마나 재현하는지의 정도 — 유효성의 핵심 척도<\/li><li><b>시뮬레이션<\/b>: 설문·컨조인트·가격 탄력성·구매의도 응답 생성, 에이전트 간 상호작용으로 여론 형성 재현<\/li><li><b>활용<\/b>: 가설 검증, 메시지·패키지 테스트, A/B 후보 선별, 세그먼트 탐색, 실조사 전 사전 스크리닝<\/li><li><b>한계<\/b>: 훈련 데이터 편향, 동조 편향(Sycophancy), 실제 인간 분포와의 괴리, 표본오차 개념 부재<\/li><li><b>신뢰 확보<\/b>: 실제 설문·판매 데이터로 <b>보정(Calibration)<\/b>, 프롬프트·모델 버전 관리로 재현성 확보<\/li><\/ul>", "pp": "<h4>1) 전통 시장조사 vs 합성 소비자<\/h4>\n<div class=\"tblwrap\"><table class=\"cmp\"><colgroup><col style=\"width:24%\"><col style=\"width:28%\"><col style=\"width:48%\"><\/colgroup><thead><tr><th>구분<\/th><th>전통 시장조사<\/th><th>합성 소비자<\/th><\/tr><\/thead><tbody><tr><td class=\"k\">응답 주체<\/td><td>실제 소비자 표본<\/td><td>LLM 페르소나(가상)<\/td><\/tr><tr><td class=\"k\">기간·비용<\/td><td>수주·고비용<\/td><td>수시간·저비용<\/td><\/tr><tr><td class=\"k\">규모<\/td><td>표본 설계 한계<\/td><td>수천 명 즉시 생성·반복 실험<\/td><\/tr><tr><td class=\"k\">대표성<\/td><td>확률표본·가중치로 확보<\/td><td>설계 파라미터에 의존(검증 필요)<\/td><\/tr><tr><td class=\"k\">윤리·법<\/td><td>개인정보 동의 필요<\/td><td>가상 응답 오인 표시 금지<\/td><\/tr><tr><td class=\"k\">용도<\/td><td>최종 의사결정 근거<\/td><td>가설 탐색·사전 검증<\/td><\/tr><\/tbody><\/table><\/div>\n<h4>2) 활용과 한계<\/h4>\n<div class=\"tblwrap\"><table class=\"cmp\"><colgroup><col style=\"width:24%\"><col style=\"width:28%\"><col style=\"width:48%\"><\/colgroup><thead><tr><th>구분<\/th><th>키워드<\/th><th>설명<\/th><\/tr><\/thead><tbody><tr><td class=\"k\">탐색<\/td><td>가설 발산<\/td><td>초기 아이디어·메시지 후보를 빠르게 넓혀 실조사 대상 축소<\/td><\/tr><tr><td class=\"k\">검증<\/td><td>실데이터 보정<\/td><td>실제 조사·판매 데이터로 페르소나 응답을 보정해 편향 완화<\/td><\/tr><tr><td class=\"k\">신뢰<\/td><td>재현성<\/td><td>동일 프롬프트·시드·모델 버전 고정, 응답 분포 리포트<\/td><\/tr><tr><td class=\"k\">한계<\/td><td>대표성<\/td><td>훈련 데이터에 없는 집단·신규 시장은 재현 불가<\/td><\/tr><tr><td class=\"k\">윤리<\/td><td>표시·투명성<\/td><td>합성 결과임을 명시, 실제 소비자 조사로 오인되지 않게 관리<\/td><\/tr><\/tbody><\/table><\/div>\n<h4>3) 도입 고려사항<\/h4>\n<div class=\"tblwrap\"><table class=\"cmp\"><colgroup><col style=\"width:24%\"><col style=\"width:28%\"><col style=\"width:48%\"><\/colgroup><thead><tr><th>구분<\/th><th>키워드<\/th><th>설명<\/th><\/tr><\/thead><tbody><tr><td class=\"k\">설계<\/td><td>세그먼트 정의<\/td><td>실제 시장 구조를 반영한 페르소나 분포·가중치 설계<\/td><\/tr><tr><td class=\"k\">방법<\/td><td>다중 에이전트<\/td><td>개인 응답 + 집단 상호작용(여론·입소문) 시뮬레이션 구분<\/td><\/tr><tr><td class=\"k\">평가<\/td><td>일치도 측정<\/td><td>파일럿에서 실제 조사 결과와 상관·분포 일치도 검증<\/td><\/tr><tr><td class=\"k\">거버넌스<\/td><td>사용 범위<\/td><td>의사결정 단독 근거로 쓰지 않고 보조 수단으로 규정<\/td><\/tr><\/tbody><\/table><\/div>", "rv": "<div class=\"q\"><b>두음: 페·시·분 / 대·편·교<\/b> — 페르소나·시뮬레이션·분석 / 대표성·편향·교차검증<\/div>\n<div class=\"q\"><b>\"가상의 소비자로 빠르게 실험하되, 결정은 실제 데이터로 확인한다\"<\/b><\/div>", "img": "itpe-diagrams/124-synthetic-consumers.webp", "txt": null, "search": "합성 소비자 (synthetic consumers) 합성 소비자 synthetic consumers ai·데이터 ai 신뢰성·거버넌스 ⭐ 기출빈출 기출 빈출 중요 합성 소비자(synthetic consumers) 는 인구·가치관·행동 속성을 부여한 llm 페르소나 로 실제 소비자 반응을 대체·보완해 설문·가격 탄력성·구매 의도를 예측하는 가상 소비자 시뮬레이션 기법 페르소나 설계 : 연령·소득·지역·직업·가치관·구매 이력 등 인구통계·심리 변수를 부여 알고리즘적 충실성(algorithmic fidelity) : llm이 실제 집단의 응답 분포를 얼마나 재현하는지의 정도 — 유효성의 핵심 척도 시뮬레이션 : 설문·컨조인트·가격 탄력성·구매의도 응답 생성, 에이전트 간 상호작용으로 여론 형성 재현 활용 : 가설 검증, 메시지·패키지 테스트, a/b 후보 선별, 세그먼트 탐색, 실조사 전 사전 스크리닝 한계 : 훈련 데이터 편향, 동조 편향(sycophancy), 실제 인간 분포와의 괴리, 표본오차 개념 부재 신뢰 확보 : 실제 설문·판매 데이터로 보정(calibration) , 프롬프트·모델 버전 관리로 재현성 확보 1) 전통 시장조사 vs 합성 소비자 구분 전통 시장조사 합성 소비자 응답 주체 실제 소비자 표본 llm 페르소나(가상) 기간·비용 수주·고비용 수시간·저비용 규모 표본 설계 한계 수천 명 즉시 생성·반복 실험 대표성 확률표본·가중치로 확보 설계 파라미터에 의존(검증 필요) 윤리·법 개인정보 동의 필요 가상 응답 오인 표시 금지 용도 최종 의사결정 근거 가설 탐색·사전 검증 2) 활용과 한계 구분 키워드 설명 탐색 가설 발산 초기 아이디어·메시지 후보를 빠르게 넓혀 실조사 대상 축소 검증 실데이터 보정 실제 조사·판매 데이터로 페르소나 응답을 보정해 편향 완화 신뢰 재현성 동일 프롬프트·시드·모델 버전 고정, 응답 분포 리포트 한계 대표성 훈련 데이터에 없는 집단·신규 시장은 재현 불가 윤리 표시·투명성 합성 결과임을 명시, 실제 소비자 조사로 오인되지 않게 관리 3) 도입 고려사항 구분 키워드 설명 설계 세그먼트 정의 실제 시장 구조를 반영한 페르소나 분포·가중치 설계 방법 다중 에이전트 개인 응답 + 집단 상호작용(여론·입소문) 시뮬레이션 구분 평가 일치도 측정 파일럿에서 실제 조사 결과와 상관·분포 일치도 검증 거버넌스 사용 범위 의사결정 단독 근거로 쓰지 않고 보조 수단으로 규정 두음: 페·시·분 / 대·편·교 — 페르소나·시뮬레이션·분석 / 대표성·편향·교차검증 \"가상의 소비자로 빠르게 실험하되, 결정은 실제 데이터로 확인한다\""}, {"id": "test-time", "cat": "ai", "sub": "ai-model", "parent": null, "t": "테스트 타임 컴퓨트 · 추론형 LLM", "s": "사·추 / 코·피·트·셀 (System 2)", "stars": 3, "redStar": false, "full": "테스트 타임 컴퓨트와 추론형 LLM", "catLabel": "AI·데이터", "st": "📌 복습 필요", "d": "2026-11-23", "def": "<p>사전학습(Pre-training) 모델 크기·데이터 확장 중심의 한계를 넘어, <b>추론 시점(Test-Time)에 추가 연산과 탐색 시간을 투입<\/b>하여 단계적 사고·검증(System 2)을 수행함으로써 고난도 논리·수학·코딩 성능을 극대화하는 AI 패러다임<\/p>", "kw": "<ul class=\"kw\"><li><b>스케일링 법칙 전환<\/b>: <b>Pre-training Scaling<\/b>(학습 시점 파라미터·데이터 확대) → <b>Test-Time Compute Scaling<\/b>(추론 시점 사고 토큰·탐색 깊이 확대)<\/li><li><b>추론형 LLM 메커니즘 (코·피·트·셀)<\/b>:<ul class=\"kw\"><li><b>CoT (Chain of Thought)<\/b>: 문제 해결 과정을 중간 단계별 추론 토큰으로 분해<\/li><li><b>PRM (Process Reward Model)<\/b>: 최종 결과가 아닌 중간 추론 단계별 정확도를 채점<\/li><li><b>Tree Search / MCTS<\/b>: 다중 추론 경로를 탐색·가지치기하여 최적 경로 선택<\/li><li><b>Self-Verification<\/b>: 강화학습(RL) 기반 자기 오류 검출·수정 후 최종 답변 출력<\/li><\/ul><\/li><\/ul>", "pp": "<h4>1) 개념 비교<\/h4>\n<div class=\"tblwrap\"><table class=\"cmp\"><colgroup><col style=\"width:24%\"><col style=\"width:28%\"><col style=\"width:48%\"><\/colgroup><thead><tr><th>비교<\/th><th>기존 LLM (System 1)<\/th><th>추론형 LLM (System 2)<\/th><\/tr><\/thead><tbody><tr><td class=\"k\">사고 방식<\/td><td>직관적·단일 패스 즉각 응답<\/td><td>단계적 숙고·탐색·검증 후 응답<\/td><\/tr><tr><td class=\"k\">연산 투입<\/td><td>사전학습(Pre-training) 집중<\/td><td>추론 시점(Test-Time) 연산 동적 할당<\/td><\/tr><tr><td class=\"k\">강점·한계<\/td><td>응답 속도 빠름 · 복합 추론 취약<\/td><td>수학/코딩/설계 고성능 · 지연/토큰 비용↑<\/td><\/tr><\/tbody><\/table><\/div>\n<h4>2) 상세 비교 (기술 · 운영 관점)<\/h4>\n<div class=\"tblwrap\"><table class=\"cmp\"><colgroup><col style=\"width:24%\"><col style=\"width:28%\"><col style=\"width:48%\"><\/colgroup><thead><tr><th>구분<\/th><th>특징<\/th><th>설명<\/th><\/tr><\/thead><tbody><tr><td class=\"k\">보상 설계<\/td><td>ORM vs PRM<\/td><td>결과만 평가하는 ORM 대신 과정 단계를 평가하는 PRM과 RL로 추론 안정성 확보<\/td><\/tr><tr><td class=\"k\">운영 최적화<\/td><td>난이도별 라우팅<\/td><td>단순 질의는 일반 LLM, 고난도 추론만 Reasoning 모델로 라우팅해 지연·비용 최적화<\/td><\/tr><\/tbody><\/table><\/div>", "rv": "<div class=\"q\"><b>두음: 사·추 / 코·피·트·셀<\/b> — 사전학습→추론시점 / CoT·PRM·Tree Search·Self-Verification<\/div>\n<div class=\"q\"><b>System 1(직관) vs System 2(숙고)<\/b> 대비표로 서술하면 답안 가독성이 급상승!<\/div>", "img": "itpe-diagrams/83-test-time-compute.webp", "txt": null, "search": "테스트 타임 컴퓨트와 추론형 llm 테스트 타임 컴퓨트 · 추론형 llm 사·추 / 코·피·트·셀 (system 2) ai·데이터 모델 경량화·추론 ⭐⭐⭐ 기출빈출 기출 빈출 중요 사전학습(pre-training) 모델 크기·데이터 확장 중심의 한계를 넘어, 추론 시점(test-time)에 추가 연산과 탐색 시간을 투입 하여 단계적 사고·검증(system 2)을 수행함으로써 고난도 논리·수학·코딩 성능을 극대화하는 ai 패러다임 스케일링 법칙 전환 : pre-training scaling (학습 시점 파라미터·데이터 확대) → test-time compute scaling (추론 시점 사고 토큰·탐색 깊이 확대) 추론형 llm 메커니즘 (코·피·트·셀) : cot (chain of thought) : 문제 해결 과정을 중간 단계별 추론 토큰으로 분해 prm (process reward model) : 최종 결과가 아닌 중간 추론 단계별 정확도를 채점 tree search / mcts : 다중 추론 경로를 탐색·가지치기하여 최적 경로 선택 self-verification : 강화학습(rl) 기반 자기 오류 검출·수정 후 최종 답변 출력 1) 개념 비교 비교 기존 llm (system 1) 추론형 llm (system 2) 사고 방식 직관적·단일 패스 즉각 응답 단계적 숙고·탐색·검증 후 응답 연산 투입 사전학습(pre-training) 집중 추론 시점(test-time) 연산 동적 할당 강점·한계 응답 속도 빠름 · 복합 추론 취약 수학/코딩/설계 고성능 · 지연/토큰 비용↑ 2) 상세 비교 (기술 · 운영 관점) 구분 특징 설명 보상 설계 orm vs prm 결과만 평가하는 orm 대신 과정 단계를 평가하는 prm과 rl로 추론 안정성 확보 운영 최적화 난이도별 라우팅 단순 질의는 일반 llm, 고난도 추론만 reasoning 모델로 라우팅해 지연·비용 최적화 두음: 사·추 / 코·피·트·셀 — 사전학습→추론시점 / cot·prm·tree search·self-verification system 1(직관) vs system 2(숙고) 대비표로 서술하면 답안 가독성이 급상승!"}, {"id": "speculative-decoding", "cat": "ai", "sub": "ai-model", "parent": null, "t": "투기적 디코딩", "s": "Draft·Target·무손실 가속", "stars": 2, "redStar": false, "full": "투기적 디코딩 (Speculative Decoding)", "catLabel": "AI·데이터", "st": "📌 복습 필요", "d": "2026-11-25", "def": "<p><b>투기적 디코딩(Speculative Decoding)<\/b>은 경량 <b>Draft 모델<\/b>이 생성한 다수 토큰 후보를 대형 <b>Target 모델<\/b>이 한 번의 병렬 순전파로 검증·보정하여 출력 분포 손실 없이(Lossless) 속도를 높이는 <b>LLM 추론 가속 기법<\/b><\/p>", "kw": "<ul class=\"kw\"><li><b>Draft Model<\/b>: Target보다 5~10배 작은 모델로 k개 토큰 초안 생성 — 검증 비용보다 절감 이득이 커야 함(같은 토크나이저 필수)<\/li><li><b>Target Model<\/b>: k개 후보를 <b>병렬 검증<\/b>해 수락·거절 판정, 거절 지점 이후는 재계산<\/li><li><b>Acceptance Rate (수락률 α)<\/b>: 초안이 수락되는 비율 — α가 높고 k가 클수록 가속 효과 증가<\/li><li><b>무손실 보장<\/b>: 거절 시 잔차 분포(Residual)에서 재샘플링 → Target 단독 디코딩과 <b>동일한 분포<\/b> 유지<\/li><li><b>KV Cache<\/b>: 검증 시 초안 토큰의 KV를 재사용해 중복 연산 제거, 배치·시퀀스 길이가 처리량 결정<\/li><li><b>변형 기법<\/b>: Medusa(다중 예측 헤드), EAGLE(특징 재사용), Lookahead Decoding, Self-Speculative(레이어 조기 종료)<\/li><\/ul>", "pp": "<h4>1) 일반 디코딩 vs 투기적 디코딩<\/h4>\n<div class=\"tblwrap\"><table class=\"cmp\"><colgroup><col style=\"width:24%\"><col style=\"width:28%\"><col style=\"width:48%\"><\/colgroup><thead><tr><th>구분<\/th><th>일반 자기회귀 디코딩<\/th><th>투기적 디코딩<\/th><\/tr><\/thead><tbody><tr><td class=\"k\">생성 방식<\/td><td>토큰 1개씩 순차 생성<\/td><td>k개 초안 생성 후 병렬 검증<\/td><\/tr><tr><td class=\"k\">병목<\/td><td>메모리 대역폭(가중치 재로딩)<\/td><td>GPU 연산 활용률(배치 검증으로 개선)<\/td><\/tr><tr><td class=\"k\">출력 품질<\/td><td>기준 분포<\/td><td>동일 분포(무손실)<\/td><\/tr><tr><td class=\"k\">지연<\/td><td>토큰 수에 선형 비례<\/td><td>수락률 α에 따라 2~3배 단축<\/td><\/tr><tr><td class=\"k\">추가 비용<\/td><td>없음<\/td><td>Draft 모델 메모리·검증 연산<\/td><\/tr><tr><td class=\"k\">적용 조건<\/td><td>범용<\/td><td>대형 모델·저배치·지연 민감 서비스<\/td><\/tr><\/tbody><\/table><\/div>\n<h4>2) 설계 고려사항<\/h4>\n<div class=\"tblwrap\"><table class=\"cmp\"><colgroup><col style=\"width:24%\"><col style=\"width:28%\"><col style=\"width:48%\"><\/colgroup><thead><tr><th>구분<\/th><th>키워드<\/th><th>설명<\/th><\/tr><\/thead><tbody><tr><td class=\"k\">모델 선택<\/td><td>Draft-Target 정합성<\/td><td>도메인·토크나이저가 같고 α가 충분히 높은 소형 모델 선택(증류 모델 활용)<\/td><\/tr><tr><td class=\"k\">초안 길이<\/td><td>k 튜닝<\/td><td>k가 크면 수락률 하락·낭비 증가 → 워크로드별 최적 k 측정<\/td><\/tr><tr><td class=\"k\">인프라<\/td><td>GPU 메모리·배치<\/td><td>Draft 모델 상주 메모리 확보, 배치가 크면 일반 디코딩이 유리할 수 있음<\/td><\/tr><tr><td class=\"k\">적용 범위<\/td><td>greedy vs sampling<\/td><td>결정적(greedy) 생성에서 효과가 크고, 고온 샘플링은 수락률 저하<\/td><\/tr><tr><td class=\"k\">대안<\/td><td>서빙 최적화<\/td><td>연속 배치(Continuous Batching)·PagedAttention·양자화와 함께 적용<\/td><\/tr><\/tbody><\/table><\/div>", "rv": "<div class=\"q\"><b>두음: 드·타·수·캐<\/b> — Draft·Target·Acceptance Rate·KV Cache<\/div>\n<div class=\"q\"><b>\"작은 모델이 초안을 쓰고, 큰 모델이 검증만 한다 — 품질 그대로, 지연은 절반\"<\/b><\/div>", "img": "itpe-diagrams/120-speculative-decoding.webp", "txt": null, "search": "투기적 디코딩 (speculative decoding) 투기적 디코딩 draft·target·무손실 가속 ai·데이터 모델 경량화·추론 ⭐⭐ 기출빈출 기출 빈출 중요 투기적 디코딩(speculative decoding) 은 경량 draft 모델 이 생성한 다수 토큰 후보를 대형 target 모델 이 한 번의 병렬 순전파로 검증·보정하여 출력 분포 손실 없이(lossless) 속도를 높이는 llm 추론 가속 기법 draft model : target보다 5~10배 작은 모델로 k개 토큰 초안 생성 — 검증 비용보다 절감 이득이 커야 함(같은 토크나이저 필수) target model : k개 후보를 병렬 검증 해 수락·거절 판정, 거절 지점 이후는 재계산 acceptance rate (수락률 α) : 초안이 수락되는 비율 — α가 높고 k가 클수록 가속 효과 증가 무손실 보장 : 거절 시 잔차 분포(residual)에서 재샘플링 → target 단독 디코딩과 동일한 분포 유지 kv cache : 검증 시 초안 토큰의 kv를 재사용해 중복 연산 제거, 배치·시퀀스 길이가 처리량 결정 변형 기법 : medusa(다중 예측 헤드), eagle(특징 재사용), lookahead decoding, self-speculative(레이어 조기 종료) 1) 일반 디코딩 vs 투기적 디코딩 구분 일반 자기회귀 디코딩 투기적 디코딩 생성 방식 토큰 1개씩 순차 생성 k개 초안 생성 후 병렬 검증 병목 메모리 대역폭(가중치 재로딩) gpu 연산 활용률(배치 검증으로 개선) 출력 품질 기준 분포 동일 분포(무손실) 지연 토큰 수에 선형 비례 수락률 α에 따라 2~3배 단축 추가 비용 없음 draft 모델 메모리·검증 연산 적용 조건 범용 대형 모델·저배치·지연 민감 서비스 2) 설계 고려사항 구분 키워드 설명 모델 선택 draft-target 정합성 도메인·토크나이저가 같고 α가 충분히 높은 소형 모델 선택(증류 모델 활용) 초안 길이 k 튜닝 k가 크면 수락률 하락·낭비 증가 → 워크로드별 최적 k 측정 인프라 gpu 메모리·배치 draft 모델 상주 메모리 확보, 배치가 크면 일반 디코딩이 유리할 수 있음 적용 범위 greedy vs sampling 결정적(greedy) 생성에서 효과가 크고, 고온 샘플링은 수락률 저하 대안 서빙 최적화 연속 배치(continuous batching)·pagedattention·양자화와 함께 적용 두음: 드·타·수·캐 — draft·target·acceptance rate·kv cache \"작은 모델이 초안을 쓰고, 큰 모델이 검증만 한다 — 품질 그대로, 지연은 절반\""}, {"id": "llmops", "cat": "ai", "sub": "ai-data", "parent": null, "t": "LLMOps", "s": "프롬프트·RAG·가드레일·비용", "stars": 2, "redStar": false, "full": "LLMOps (대규모 언어모델 운영)", "catLabel": "AI·데이터", "st": "📌 복습 필요", "d": "2026-11-21", "def": "<p>거대언어모델(LLM)의 <b>프롬프트 관리, 파인튜닝·RAG, 평가·가드레일, 서빙·모니터링<\/b>까지 전 생명주기를 자동화하고 안정적으로 운영하는 체계 (MLOps의 LLM 특화 확장)<\/p>", "kw": "<ul class=\"kw\"><li><b>MLOps vs LLMOps<\/b>:<ul class=\"kw\"><li><b>MLOps<\/b>: 정형 데이터 기반 모델 학습·하이퍼파라미터 튜닝·데이터 드리프트 감시 중심<\/li><li><b>LLMOps<\/b>: <b>프롬프트 버전 관리<\/b>, <b>RAG 파이프라인<\/b>, 비결정적 출력에 대한 <b>환각·유해성 평가 및 가드레일<\/b>, <b>토큰 비용·지연시간<\/b> 관리 중심<\/li><\/ul><\/li><li><b>핵심 4단계 구성요소<\/b>:<ul class=\"kw\"><li>1. <b>Prompt &amp; Data<\/b>: 프롬프트 엔지니어링·버전 관리, RAG 벡터 DB 관리<\/li><li>2. <b>Adaptation<\/b>: LoRA·QLoRA 파인튜닝, 모델 경량화·양자화<\/li><li>3. <b>Eval &amp; Guardrail<\/b>: LLM-as-a-Judge, Human Feedback(RLHF), 입출력 보안 가드레일<\/li><li>4. <b>Serving &amp; Monitoring<\/b>: vLLM 등 추론 최적화, 토큰 비용(FinOps) 및 지연시간 추적<\/li><\/ul><\/li><\/ul>", "pp": "<div class=\"tblwrap\"><table class=\"cmp\"><colgroup><col style=\"width:24%\"><col style=\"width:28%\"><col style=\"width:48%\"><\/colgroup><thead><tr><th>관점(측면)<\/th><th>특징<\/th><th>설명<\/th><\/tr><\/thead><tbody><tr><td class=\"k\">파이프라인<\/td><td>프롬프트·RAG<\/td><td>프롬프트 버전 관리와 벡터 DB·검색 파이프라인을 형상관리 체계로 운영<\/td><\/tr><tr><td class=\"k\">적응<\/td><td>LoRA·QLoRA<\/td><td>도메인 특화 파인튜닝과 경량화를 반복 가능한 실험으로 관리<\/td><\/tr><tr><td class=\"k\">평가·안전<\/td><td>Eval·Guardrail<\/td><td>LLM-as-a-Judge·인간 피드백으로 평가하고 입출력 가드레일로 유해·유출을 차단<\/td><\/tr><tr><td class=\"k\">서빙·비용<\/td><td>vLLM·토큰 비용<\/td><td>추론 최적화와 토큰 비용·지연 모니터링(FinOps)으로 품질과 원가를 함께 관리<\/td><\/tr><\/tbody><\/table><\/div>", "rv": "<div class=\"q\"><b>두음: 프·적·평·서<\/b> — 프(프롬프트·RAG)·적(Adaptation·LoRA)·평(Eval·가드레일)·서(Serving·비용)<\/div>\n<div class=\"q\"><b>프롬프트 관리 + RAG·LoRA + 환각 평가·가드레일 + 토큰 비용/지연 모니터링<\/b> 4박자!<\/div>", "img": "itpe-diagrams/37-llmops.webp", "txt": null, "search": "llmops (대규모 언어모델 운영) llmops 프롬프트·rag·가드레일·비용 ai·데이터 데이터 엔지니어링·운영 ⭐⭐ 기출빈출 기출 빈출 중요 거대언어모델(llm)의 프롬프트 관리, 파인튜닝·rag, 평가·가드레일, 서빙·모니터링 까지 전 생명주기를 자동화하고 안정적으로 운영하는 체계 (mlops의 llm 특화 확장) mlops vs llmops : mlops : 정형 데이터 기반 모델 학습·하이퍼파라미터 튜닝·데이터 드리프트 감시 중심 llmops : 프롬프트 버전 관리 , rag 파이프라인 , 비결정적 출력에 대한 환각·유해성 평가 및 가드레일 , 토큰 비용·지연시간 관리 중심 핵심 4단계 구성요소 : 1. prompt &amp; data : 프롬프트 엔지니어링·버전 관리, rag 벡터 db 관리 2. adaptation : lora·qlora 파인튜닝, 모델 경량화·양자화 3. eval &amp; guardrail : llm-as-a-judge, human feedback(rlhf), 입출력 보안 가드레일 4. serving &amp; monitoring : vllm 등 추론 최적화, 토큰 비용(finops) 및 지연시간 추적 관점(측면) 특징 설명 파이프라인 프롬프트·rag 프롬프트 버전 관리와 벡터 db·검색 파이프라인을 형상관리 체계로 운영 적응 lora·qlora 도메인 특화 파인튜닝과 경량화를 반복 가능한 실험으로 관리 평가·안전 eval·guardrail llm-as-a-judge·인간 피드백으로 평가하고 입출력 가드레일로 유해·유출을 차단 서빙·비용 vllm·토큰 비용 추론 최적화와 토큰 비용·지연 모니터링(finops)으로 품질과 원가를 함께 관리 두음: 프·적·평·서 — 프(프롬프트·rag)·적(adaptation·lora)·평(eval·가드레일)·서(serving·비용) 프롬프트 관리 + rag·lora + 환각 평가·가드레일 + 토큰 비용/지연 모니터링 4박자!"}, {"id": "hallucination", "cat": "ai", "sub": "ai-trust", "parent": null, "t": "AI 환각 · 완화 기법", "s": "학·추·검 / RAG·CoT·Guardrail", "stars": 3, "redStar": false, "full": "AI 환각(Hallucination) 원인과 완화 기법", "catLabel": "AI·데이터", "st": "📌 복습 필요", "d": "2026-11-21", "def": "<p>생성형 AI(LLM)가 입력 문맥이나 사실과 다르거나 <b>근거 없는 허위 정보를 마치 사실인 것처럼 그럴듯하게 생성<\/b>하는 현상<\/p>", "kw": "<ul class=\"kw\"><li><b>발생 원인<\/b>: 확률적 다음 토큰 예측(의미 이해 X), 학습 데이터 오류·편향·최신성 부족, 긴 문맥 손실(Lost in the Middle)<\/li><li><b>3단계 완화 기법 (학·추·검)<\/b>:<ul class=\"kw\"><li><b>학습 단계<\/b>: 고품질 정제 데이터 학습, RLHF·DPO로 사실성·거절 능력 정렬<\/li><li><b>추론 단계<\/b>: <b>RAG<\/b>(외부 신뢰 문서 근거 주입), <b>CoT<\/b>(단계적 추론), <b>Self-Consistency<\/b>(다수결 검증)<\/li><li><b>검증·운영 단계<\/b>: <b>Guardrail<\/b>(입출력 검증), Fact-Checking, 출처 표기(Citation) 강제<\/li><\/ul><\/li><\/ul>", "pp": "<div class=\"tblwrap\"><table class=\"cmp\"><colgroup><col style=\"width:24%\"><col style=\"width:28%\"><col style=\"width:48%\"><\/colgroup><thead><tr><th>관점(측면)<\/th><th>특징<\/th><th>설명<\/th><\/tr><\/thead><tbody><tr><td class=\"k\">원인·메커니즘 관점<\/td><td>확률적 토큰 예측<\/td><td>사실 검증기가 아닌 다음 단어 확률 분포에 기반해 유창한 문장 생성<\/td><\/tr><tr><td class=\"k\">검색·추론 관점<\/td><td>RAG · CoT · RIG<\/td><td>신뢰 가능한 외부 지식(RAG)과 단계적 추론(CoT)으로 근거 기반 답변 유도<\/td><\/tr><tr><td class=\"k\">정렬·통제 관점<\/td><td>DPO · Guardrail<\/td><td>모르는 것은 모른다고 답하도록 정렬하고 출력 전 사실성·유해성 필터링<\/td><\/tr><tr><td class=\"k\">거버넌스·신뢰<\/td><td>AI TRiSM · XAI<\/td><td>출처(Citation) 제공 및 인간 최종 검토(HITL)로 고위험 오판 방지<\/td><\/tr><\/tbody><\/table><\/div>", "rv": "<div class=\"q\"><b>두음: 학·추·검 / 래·코·가<\/b> — 학(학습 정렬)·추(추론 RAG/CoT)·검(검증 가드레일) / 래(RAG)·코(CoT)·가(Guardrail)<\/div>\n<div class=\"q\"><b>발생 원인(확률 예측·데이터 한계) + 3단계 대응(학습·추론·검증)<\/b>!<\/div>", "img": "itpe-diagrams/54-ai-hallucination.webp", "txt": null, "search": "ai 환각(hallucination) 원인과 완화 기법 ai 환각 · 완화 기법 학·추·검 / rag·cot·guardrail ai·데이터 ai 신뢰성·거버넌스 ⭐⭐⭐ 기출빈출 기출 빈출 중요 생성형 ai(llm)가 입력 문맥이나 사실과 다르거나 근거 없는 허위 정보를 마치 사실인 것처럼 그럴듯하게 생성 하는 현상 발생 원인 : 확률적 다음 토큰 예측(의미 이해 x), 학습 데이터 오류·편향·최신성 부족, 긴 문맥 손실(lost in the middle) 3단계 완화 기법 (학·추·검) : 학습 단계 : 고품질 정제 데이터 학습, rlhf·dpo로 사실성·거절 능력 정렬 추론 단계 : rag (외부 신뢰 문서 근거 주입), cot (단계적 추론), self-consistency (다수결 검증) 검증·운영 단계 : guardrail (입출력 검증), fact-checking, 출처 표기(citation) 강제 관점(측면) 특징 설명 원인·메커니즘 관점 확률적 토큰 예측 사실 검증기가 아닌 다음 단어 확률 분포에 기반해 유창한 문장 생성 검색·추론 관점 rag · cot · rig 신뢰 가능한 외부 지식(rag)과 단계적 추론(cot)으로 근거 기반 답변 유도 정렬·통제 관점 dpo · guardrail 모르는 것은 모른다고 답하도록 정렬하고 출력 전 사실성·유해성 필터링 거버넌스·신뢰 ai trism · xai 출처(citation) 제공 및 인간 최종 검토(hitl)로 고위험 오판 방지 두음: 학·추·검 / 래·코·가 — 학(학습 정렬)·추(추론 rag/cot)·검(검증 가드레일) / 래(rag)·코(cot)·가(guardrail) 발생 원인(확률 예측·데이터 한계) + 3단계 대응(학습·추론·검증) !"}, {"id": "trism", "cat": "ai", "sub": "ai-trust", "parent": null, "t": "AI TRiSM", "s": "AI 거버넌스 4영역", "stars": 0, "redStar": false, "full": "AI TRiSM (AI 신뢰·리스크·보안 관리)", "catLabel": "AI·데이터", "st": "📌 복습 필요", "d": "2026-11-19", "def": "<p>AI 모델의 <b>신뢰성(Trust), 리스크(Risk), 보안(Security)을 생애주기 전반에 걸쳐 통합 관리(Management)<\/b>하기 위해 Gartner가 제시한 AI 거버넌스 프레임워크.<\/p>", "kw": "<ul class=\"kw\"><li><b>등장 배경<\/b>: 생성형 AI 확산에 따른 <b>환각(Hallucination)<\/b>, <b>프롬프트 인젝션<\/b>, <b>학습·추론 데이터 유출<\/b>, <b>알고리즘 편향성<\/b> 증가<\/li><li><b>4대 핵심 영역<\/b><ul class=\"kw\"><li><b>Explainability (XAI·설명가능성)<\/b>: 모델 의사결정 근거 투명화, 편향·오류 탐지<\/li><li><b>ModelOps (모델 운영 관리)<\/b>: 모델 배포·성능·데이터 드리프트 상시 모니터링<\/li><li><b>AI Application Security (AI 보안)<\/b>: 프롬프트 인젝션·적대적 공격 방어, <b>가드레일(Guardrails)<\/b> 적용<\/li><li><b>Privacy &amp; Governance (프라이버시·거버넌스)<\/b>: 개인정보 비식별화·유출 차단, EU AI Act·국내 AI 기본법 등 규제 준수<\/li><\/ul><\/li><\/ul>", "pp": "<div class=\"tblwrap\"><table class=\"cmp\"><colgroup><col style=\"width:24%\"><col style=\"width:28%\"><col style=\"width:48%\"><\/colgroup><thead><tr><th>관점(측면)<\/th><th>특징<\/th><th>설명<\/th><\/tr><\/thead><tbody><tr><td class=\"k\">프로세스<\/td><td>생애주기 통합 관리<\/td><td>기획·개발·배포·운영 전 단계에 신뢰·리스크·보안 활동을 내재화<\/td><\/tr><tr><td class=\"k\">조직<\/td><td>역할·책임·위원회<\/td><td>AI 거버넌스 위원회·책임자 지정, 개발·보안·법무의 협업 체계 구축<\/td><\/tr><tr><td class=\"k\">리소스(기술·자원)<\/td><td>XAI·ModelOps·가드레일<\/td><td>설명가능성 도구, 드리프트 모니터링, 입출력 가드레일을 자원으로 갖춤<\/td><\/tr><tr><td class=\"k\">규제·프라이버시<\/td><td>비식별·컴플라이언스<\/td><td>개인정보 비식별화와 EU AI Act·AI 기본법 등 규제 준수<\/td><\/tr><\/tbody><\/table><\/div>", "rv": "<div class=\"q\"><b>두음: 설·모·보·프<\/b> — 설(XAI 설명가능성)·모(ModelOps)·보(AI 보안·가드레일)·프(Privacy &amp; Governance)<\/div>\n<div class=\"q\">\"Trust·Risk·Security 통합 관리\" 정의에 더해 <b>4대 영역(XAI·ModelOps·AI 보안/가드레일·Privacy)<\/b>을 반드시 구조화해서 쓰기!<\/div>", "img": "itpe-diagrams/15-ai-trism.webp", "txt": null, "search": "ai trism (ai 신뢰·리스크·보안 관리) ai trism ai 거버넌스 4영역 ai·데이터 ai 신뢰성·거버넌스 ai 모델의 신뢰성(trust), 리스크(risk), 보안(security)을 생애주기 전반에 걸쳐 통합 관리(management) 하기 위해 gartner가 제시한 ai 거버넌스 프레임워크. 등장 배경 : 생성형 ai 확산에 따른 환각(hallucination) , 프롬프트 인젝션 , 학습·추론 데이터 유출 , 알고리즘 편향성 증가 4대 핵심 영역 explainability (xai·설명가능성) : 모델 의사결정 근거 투명화, 편향·오류 탐지 modelops (모델 운영 관리) : 모델 배포·성능·데이터 드리프트 상시 모니터링 ai application security (ai 보안) : 프롬프트 인젝션·적대적 공격 방어, 가드레일(guardrails) 적용 privacy &amp; governance (프라이버시·거버넌스) : 개인정보 비식별화·유출 차단, eu ai act·국내 ai 기본법 등 규제 준수 관점(측면) 특징 설명 프로세스 생애주기 통합 관리 기획·개발·배포·운영 전 단계에 신뢰·리스크·보안 활동을 내재화 조직 역할·책임·위원회 ai 거버넌스 위원회·책임자 지정, 개발·보안·법무의 협업 체계 구축 리소스(기술·자원) xai·modelops·가드레일 설명가능성 도구, 드리프트 모니터링, 입출력 가드레일을 자원으로 갖춤 규제·프라이버시 비식별·컴플라이언스 개인정보 비식별화와 eu ai act·ai 기본법 등 규제 준수 두음: 설·모·보·프 — 설(xai 설명가능성)·모(modelops)·보(ai 보안·가드레일)·프(privacy &amp; governance) \"trust·risk·security 통합 관리\" 정의에 더해 4대 영역(xai·modelops·ai 보안/가드레일·privacy) 을 반드시 구조화해서 쓰기!"}, {"id": "xai", "cat": "ai", "sub": "ai-trust", "parent": null, "t": "XAI (LIME · SHAP)", "s": "블랙박스 해석 · 샤플리 값", "stars": 2, "redStar": false, "full": "XAI (설명 가능한 AI)와 LIME·SHAP", "catLabel": "AI·데이터", "st": "📌 복습 필요", "d": "2026-11-21", "def": "<p>딥러닝 등 블랙박스(Black-box) AI 모델의 내부 동작과 <b>예측 결과의 근거·원인을 인간이 이해하고 검증할 수 있는 형태<\/b>로 제시하는 인공지능 기술<\/p>", "kw": "<ul class=\"kw\"><li><b>LIME vs SHAP (사후·모델 불가지론적 설명 기법)<\/b>:<ul class=\"kw\"><li><b>LIME<\/b>: 특정 입력 주변 데이터를 교란(Perturbation)해 <b>국소(Local) 대리 선형 모델<\/b>로 근사 설명 (빠르지만 샘플링 변동성 존재)<\/li><li><b>SHAP<\/b>: 게임이론의 <b>Shapley Value<\/b>를 이용해 각 특성(Feature)의 기여도를 정량 산출 (<b>국소+전역<\/b> 모두 수학적 일관성 보장, 연산량 큼)<\/li><\/ul><\/li><li><b>설명 시점 분류<\/b>: 내재적 설명(선형회귀·의사결정나무) vs 사후 설명(Post-hoc: LIME·SHAP·Grad-CAM)<\/li><\/ul>", "pp": "<div class=\"tblwrap\"><table class=\"cmp\"><colgroup><col style=\"width:24%\"><col style=\"width:28%\"><col style=\"width:48%\"><\/colgroup><thead><tr><th>관점(측면)<\/th><th>특징<\/th><th>설명<\/th><\/tr><\/thead><tbody><tr><td class=\"k\">알고리즘 관점<\/td><td>LIME(교란) vs SHAP(게임이론)<\/td><td>국소 근사(LIME)와 샤플리 값 기반 공리적 기여도 분배(SHAP)로 구분<\/td><\/tr><tr><td class=\"k\">적용 범위 관점<\/td><td>Local vs Global<\/td><td>개별 예측 1건 설명(Local)과 전체 모델 특성 중요도(Global) 동시 지원<\/td><\/tr><tr><td class=\"k\">거버넌스·법제<\/td><td>AI 기본법 · ISO 42001<\/td><td>고영향 AI의 설명의무·투명성·인간 감독(HITL) 이행의 핵심 기술<\/td><\/tr><tr><td class=\"k\">트레이드오프<\/td><td>정확도 vs 설명력<\/td><td>복잡한 딥러닝일수록 성능↑·설명력↓ → 사후 XAI로 균형 확보<\/td><\/tr><\/tbody><\/table><\/div>", "rv": "<div class=\"q\"><b>두음: 라·샤 / 국·전<\/b> — 라(LIME 국소 교란 근사)·샤(SHAP 게임이론 샤플리) / 국(Local)·전(Global)<\/div>\n<div class=\"q\"><b>LIME(국소 근사·빠름) vs SHAP(Shapley Value·국소+전역 일관성)<\/b>!<\/div>", "img": "itpe-diagrams/51-xai-lime-shap.webp", "txt": null, "search": "xai (설명 가능한 ai)와 lime·shap xai (lime · shap) 블랙박스 해석 · 샤플리 값 ai·데이터 ai 신뢰성·거버넌스 ⭐⭐ 기출빈출 기출 빈출 중요 딥러닝 등 블랙박스(black-box) ai 모델의 내부 동작과 예측 결과의 근거·원인을 인간이 이해하고 검증할 수 있는 형태 로 제시하는 인공지능 기술 lime vs shap (사후·모델 불가지론적 설명 기법) : lime : 특정 입력 주변 데이터를 교란(perturbation)해 국소(local) 대리 선형 모델 로 근사 설명 (빠르지만 샘플링 변동성 존재) shap : 게임이론의 shapley value 를 이용해 각 특성(feature)의 기여도를 정량 산출 ( 국소+전역 모두 수학적 일관성 보장, 연산량 큼) 설명 시점 분류 : 내재적 설명(선형회귀·의사결정나무) vs 사후 설명(post-hoc: lime·shap·grad-cam) 관점(측면) 특징 설명 알고리즘 관점 lime(교란) vs shap(게임이론) 국소 근사(lime)와 샤플리 값 기반 공리적 기여도 분배(shap)로 구분 적용 범위 관점 local vs global 개별 예측 1건 설명(local)과 전체 모델 특성 중요도(global) 동시 지원 거버넌스·법제 ai 기본법 · iso 42001 고영향 ai의 설명의무·투명성·인간 감독(hitl) 이행의 핵심 기술 트레이드오프 정확도 vs 설명력 복잡한 딥러닝일수록 성능↑·설명력↓ → 사후 xai로 균형 확보 두음: 라·샤 / 국·전 — 라(lime 국소 교란 근사)·샤(shap 게임이론 샤플리) / 국(local)·전(global) lime(국소 근사·빠름) vs shap(shapley value·국소+전역 일관성) !"}, {"id": "fabric-mesh", "cat": "ai", "sub": "ai-data", "parent": null, "t": "데이터 패브릭 vs 메시", "s": "AI·메타데이터 vs 도·프·셀·연", "stars": 3, "redStar": false, "full": "데이터 패브릭 vs 데이터 메시", "catLabel": "AI·데이터", "st": "📌 복습 필요", "d": "2026-11-21", "def": "<p><b>데이터 패브릭<\/b>은 <b>능동적 메타데이터와 AI/ML<\/b>을 활용해 분산 데이터를 자동 연결·통합하는 기술 중심 아키텍처이며, <b>데이터 메시<\/b>는 데이터를 <b>도메인별 제품(Product)<\/b>으로 분산 소유·운영하는 조직·아키텍처 패러다임<\/p>", "kw": "<ul class=\"kw\"><li><b>Data Mesh 4대 핵심 원칙 (도·프·셀·연)<\/b>:<ul class=\"kw\"><li><b>Domain Ownership<\/b>: 중앙 데이터팀이 아닌 현업 도메인 팀이 데이터 직접 소유·책임<\/li><li><b>Data as a Product<\/b>: 데이터를 API·문서·SLA를 갖춘 '제품'으로 제공<\/li><li><b>Self-serve Data Platform<\/b>: 도메인 팀이 쉽게 쓸 수 있는 공용 플랫폼<\/li><li><b>Federated Computational Governance<\/b>: 보안·표준은 중앙 연합으로, 실행은 자동화<\/li><\/ul><\/li><li><b>Data Fabric 핵심<\/b>: Active Metadata + Knowledge Graph + AI 자동화(가상 통합 계층)<\/li><\/ul>", "pp": "<p><b>1) 개념 비교 (비교 · 데이터 패브릭 · 데이터 메시)<\/b><\/p>\n<div class=\"tblwrap\"><table class=\"cmp\"><colgroup><col style=\"width:24%\"><col style=\"width:28%\"><col style=\"width:48%\"><\/colgroup><thead><tr><th>구분<\/th><th>데이터 패브릭 (Data Fabric)<\/th><th>데이터 메시 (Data Mesh)<\/th><\/tr><\/thead><tbody><tr><td class=\"k\">중심 축<\/td><td>기술·자동화 중심 (AI + 메타데이터)<\/td><td>조직·도메인 중심 (분산 소유·책임)<\/td><\/tr><tr><td class=\"k\">구조 형태<\/td><td>기존 저장소 위 가상 통합 레이어<\/td><td>도메인별 분산 데이터 프로덕트<\/td><\/tr><tr><td class=\"k\">도입 난이도<\/td><td>기존 조직 유지하며 점진적 적용 가능<\/td><td>조직 문화·R&amp;R 개편 필요 (난이도 높음)<\/td><\/tr><tr><td class=\"k\">적합 환경<\/td><td>이기종 사일로 빠른 연결·통합 필요 시<\/td><td>대규모 도메인·민첩한 자체 분석 필요 시<\/td><\/tr><\/tbody><\/table><\/div>\n<p><b>2) 상세 비교 (관점 · 측면)<\/b><\/p>\n<div class=\"tblwrap\"><table class=\"cmp\"><colgroup><col style=\"width:24%\"><col style=\"width:28%\"><col style=\"width:48%\"><\/colgroup><thead><tr><th>관점(측면)<\/th><th>데이터 패브릭 (Data Fabric)<\/th><th>데이터 메시 (Data Mesh)<\/th><\/tr><\/thead><tbody><tr><td class=\"k\">거버넌스 관점<\/td><td>중앙 메타데이터 카탈로그 기반 일괄 통제<\/td><td>연합 거버넌스(표준은 공통, 운영은 도메인 자율)<\/td><\/tr><tr><td class=\"k\">데이터 연동 관점<\/td><td>AI가 스키마·계보(Lineage) 자동 추론·연결<\/td><td>도메인 간 표준화된 데이터 계약(Contract)·API 연동<\/td><\/tr><tr><td class=\"k\">상호보완 관점<\/td><td>메시 플랫폼의 자동화 엔진으로 패브릭 기술 활용 가능<\/td><td>패브릭의 메타데이터·검색을 도메인 제품 탐색에 결합<\/td><\/tr><\/tbody><\/table><\/div>", "rv": "<div class=\"q\"><b>두음: 도·프·셀·연<\/b> — 도(도메인 소유)·프(프로덕트화)·셀(셀프서브 플랫폼)·연(연합 거버넌스)<\/div>\n<div class=\"q\"><b>패브릭=기술/AI 자동 통합, 메시=조직/도메인 제품화(도·프·셀·연)<\/b>!<\/div>", "img": "itpe-diagrams/50-data-fabric-mesh.webp", "txt": null, "search": "데이터 패브릭 vs 데이터 메시 데이터 패브릭 vs 메시 ai·메타데이터 vs 도·프·셀·연 ai·데이터 데이터 엔지니어링·운영 ⭐⭐⭐ 기출빈출 기출 빈출 중요 데이터 패브릭 은 능동적 메타데이터와 ai/ml 을 활용해 분산 데이터를 자동 연결·통합하는 기술 중심 아키텍처이며, 데이터 메시 는 데이터를 도메인별 제품(product) 으로 분산 소유·운영하는 조직·아키텍처 패러다임 data mesh 4대 핵심 원칙 (도·프·셀·연) : domain ownership : 중앙 데이터팀이 아닌 현업 도메인 팀이 데이터 직접 소유·책임 data as a product : 데이터를 api·문서·sla를 갖춘 '제품'으로 제공 self-serve data platform : 도메인 팀이 쉽게 쓸 수 있는 공용 플랫폼 federated computational governance : 보안·표준은 중앙 연합으로, 실행은 자동화 data fabric 핵심 : active metadata + knowledge graph + ai 자동화(가상 통합 계층) 1) 개념 비교 (비교 · 데이터 패브릭 · 데이터 메시) 구분 데이터 패브릭 (data fabric) 데이터 메시 (data mesh) 중심 축 기술·자동화 중심 (ai + 메타데이터) 조직·도메인 중심 (분산 소유·책임) 구조 형태 기존 저장소 위 가상 통합 레이어 도메인별 분산 데이터 프로덕트 도입 난이도 기존 조직 유지하며 점진적 적용 가능 조직 문화·r&amp;r 개편 필요 (난이도 높음) 적합 환경 이기종 사일로 빠른 연결·통합 필요 시 대규모 도메인·민첩한 자체 분석 필요 시 2) 상세 비교 (관점 · 측면) 관점(측면) 데이터 패브릭 (data fabric) 데이터 메시 (data mesh) 거버넌스 관점 중앙 메타데이터 카탈로그 기반 일괄 통제 연합 거버넌스(표준은 공통, 운영은 도메인 자율) 데이터 연동 관점 ai가 스키마·계보(lineage) 자동 추론·연결 도메인 간 표준화된 데이터 계약(contract)·api 연동 상호보완 관점 메시 플랫폼의 자동화 엔진으로 패브릭 기술 활용 가능 패브릭의 메타데이터·검색을 도메인 제품 탐색에 결합 두음: 도·프·셀·연 — 도(도메인 소유)·프(프로덕트화)·셀(셀프서브 플랫폼)·연(연합 거버넌스) 패브릭=기술/ai 자동 통합, 메시=조직/도메인 제품화(도·프·셀·연) !"}, {"id": "dt", "cat": "ai", "sub": "ai-fusion", "parent": null, "t": "디지털 트윈 & CPS", "s": "실시간 양방향 동기화 · 5단계", "stars": 2, "redStar": false, "full": "디지털 트윈 (Digital Twin)과 CPS", "catLabel": "AI·데이터", "st": "📌 복습 필요", "d": "2026-11-21", "def": "<p>현실의 물리적 객체·시스템을 가상 공간에 동일하게 복제(<b>가상 쌍둥이<\/b>)하고, IoT 센서로 수집한 실시간 데이터를 기반으로 <b>시뮬레이션·예측·최적화 결과를 다시 현실에 양방향 피드백<\/b>하는 기술<\/p>", "kw": "<ul class=\"kw\"><li><b>5단계 성숙도 모델 (모·관·모·연·자)<\/b>: 모사(단순 3D 복제) → 관제(실시간 모니터링) → 모의(예측 시뮬레이션) → 연합(다중 트윈 연계) → 자율(AI 자율 제어)<\/li><li><b>Digital Twin vs CPS<\/b>:<ul class=\"kw\"><li><b>CPS (가상물리시스템)<\/b>: 물리-컴퓨팅 제어 루프(임베디드·실시간 제어) 중심<\/li><li><b>Digital Twin<\/b>: 물리 객체의 생애주기 전체를 가상 모델로 정밀 복제·시뮬레이션·예측하는 데 초점<\/li><\/ul><\/li><\/ul>", "pp": "<p><b>1) 개념 비교 (비교 · 디지털 트윈 · CPS)<\/b><\/p>\n<div class=\"tblwrap\"><table class=\"cmp\"><colgroup><col style=\"width:24%\"><col style=\"width:28%\"><col style=\"width:48%\"><\/colgroup><thead><tr><th>구분<\/th><th>디지털 트윈 (Digital Twin)<\/th><th>CPS (가상물리시스템)<\/th><\/tr><\/thead><tbody><tr><td class=\"k\">개념<\/td><td>물리 자산을 가상 공간에 정밀 복제해 모의·예측<\/td><td>물리 세계와 사이버 제어기를 실시간 폐루프로 통합<\/td><\/tr><tr><td class=\"k\">목적·초점<\/td><td>시뮬레이션(What-if)·예지보전·최적화<\/td><td>물리 시스템의 실시간 자동 제어·자율 동작<\/td><\/tr><tr><td class=\"k\">가시화<\/td><td>3D 정밀 모델·시각화 필수적<\/td><td>3D 가시화 불필요 (임베디드·제어 신호 중심)<\/td><\/tr><tr><td class=\"k\">대표 사례<\/td><td>스마트팩토리·도시 트윈·항공기 엔진 예측<\/td><td>자동차 ABS·드론 비행제어·스마트 그리드<\/td><\/tr><\/tbody><\/table><\/div>\n<p><b>2) 상세 비교 (관점 · 측면)<\/b><\/p>\n<div class=\"tblwrap\"><table class=\"cmp\"><colgroup><col style=\"width:24%\"><col style=\"width:28%\"><col style=\"width:48%\"><\/colgroup><thead><tr><th>관점(측면)<\/th><th>디지털 트윈 (Digital Twin)<\/th><th>CPS (가상물리시스템)<\/th><\/tr><\/thead><tbody><tr><td class=\"k\">데이터·모델 관점<\/td><td>생애주기 전체 데이터·3D 형상 모델링·AI 예측<\/td><td>센서 계측값·상태 추정 등 실시간 제어 연산 중심<\/td><\/tr><tr><td class=\"k\">제어·피드백 관점<\/td><td>분석·예측 결과를 운영자 의사결정·제어에 환류<\/td><td>밀리초 단위 실시간 폐루프(Closed-Loop) 직접 제어<\/td><\/tr><tr><td class=\"k\">범위·상호관계<\/td><td>상위 3~5단계 자율화 시 CPS 제어 루프와 결합<\/td><td>물리-사이버 실시간 제어의 기반 인프라 역할<\/td><\/tr><tr><td class=\"k\">거버넌스·보안<\/td><td>다중 트윈 연합 표준화·모델/데이터 접근 통제<\/td><td>안전성(Safety)·가용성·제어망 침해 차단 최우선<\/td><\/tr><\/tbody><\/table><\/div>", "rv": "<div class=\"q\"><b>두음: 모·관·모·연·자<\/b> — 모(모사 1단계)·관(관제 2단계)·모(모의/예측 3단계)·연(연합 4단계)·자(자율 5단계)<\/div>\n<div class=\"q\"><b>양방향 실시간 동기화 + 성숙도 5단계 + CPS 비교<\/b> 3종 세트!<\/div>", "img": "itpe-diagrams/43-digital-twin.webp", "txt": null, "search": "디지털 트윈 (digital twin)과 cps 디지털 트윈 & cps 실시간 양방향 동기화 · 5단계 ai·데이터 융합·산업 ai ⭐⭐ 기출빈출 기출 빈출 중요 현실의 물리적 객체·시스템을 가상 공간에 동일하게 복제( 가상 쌍둥이 )하고, iot 센서로 수집한 실시간 데이터를 기반으로 시뮬레이션·예측·최적화 결과를 다시 현실에 양방향 피드백 하는 기술 5단계 성숙도 모델 (모·관·모·연·자) : 모사(단순 3d 복제) → 관제(실시간 모니터링) → 모의(예측 시뮬레이션) → 연합(다중 트윈 연계) → 자율(ai 자율 제어) digital twin vs cps : cps (가상물리시스템) : 물리-컴퓨팅 제어 루프(임베디드·실시간 제어) 중심 digital twin : 물리 객체의 생애주기 전체를 가상 모델로 정밀 복제·시뮬레이션·예측하는 데 초점 1) 개념 비교 (비교 · 디지털 트윈 · cps) 구분 디지털 트윈 (digital twin) cps (가상물리시스템) 개념 물리 자산을 가상 공간에 정밀 복제해 모의·예측 물리 세계와 사이버 제어기를 실시간 폐루프로 통합 목적·초점 시뮬레이션(what-if)·예지보전·최적화 물리 시스템의 실시간 자동 제어·자율 동작 가시화 3d 정밀 모델·시각화 필수적 3d 가시화 불필요 (임베디드·제어 신호 중심) 대표 사례 스마트팩토리·도시 트윈·항공기 엔진 예측 자동차 abs·드론 비행제어·스마트 그리드 2) 상세 비교 (관점 · 측면) 관점(측면) 디지털 트윈 (digital twin) cps (가상물리시스템) 데이터·모델 관점 생애주기 전체 데이터·3d 형상 모델링·ai 예측 센서 계측값·상태 추정 등 실시간 제어 연산 중심 제어·피드백 관점 분석·예측 결과를 운영자 의사결정·제어에 환류 밀리초 단위 실시간 폐루프(closed-loop) 직접 제어 범위·상호관계 상위 3~5단계 자율화 시 cps 제어 루프와 결합 물리-사이버 실시간 제어의 기반 인프라 역할 거버넌스·보안 다중 트윈 연합 표준화·모델/데이터 접근 통제 안전성(safety)·가용성·제어망 침해 차단 최우선 두음: 모·관·모·연·자 — 모(모사 1단계)·관(관제 2단계)·모(모의/예측 3단계)·연(연합 4단계)·자(자율 5단계) 양방향 실시간 동기화 + 성숙도 5단계 + cps 비교 3종 세트!"}, {"id": "dark-factory", "cat": "ai", "sub": "ai-fusion", "parent": null, "t": "다크 팩토리", "s": "완전 무인화 스마트 제조", "stars": 0, "redStar": true, "full": "다크 팩토리 (Dark Factory)", "catLabel": "AI·데이터", "st": "📌 복습 필요", "d": "2026-11-23", "def": "<p>조명을 켜지 않고도(인간 개입 없이) <b>24시간 설계·생산·검사·물류를 자동 수행<\/b>하는 완전 무인화 스마트 제조 공장으로, 디지털 트윈·AI·로봇·CPS를 통합해 <b>자기적응·자율복구<\/b>가 가능한 제조 시스템<\/p>", "kw": "<ul class=\"kw\"><li><b>개념<\/b>: 라이트아웃(Lights-out) 제조의 진화형 — \"불을 끄고도 돌아가는 공장\", 무인화·자율화·연속 생산<\/li><li><b>핵심 기술 스택<\/b>: 디지털 트윈(가상 검증) → CPS·IoT 센서(실시간 수집) → AI 비전 검사(품질) → 산업용 로봇·AMR/AGV(자율 물류) → 엣지 제어(실시간 판단)<\/li><li><b>자기적응 생산<\/b>: 다품종 소량·주문형 생산에서 공정 파라미터를 AI가 자동 보정, 셀프 최적화<\/li><li><b>예지보전·이상감지<\/b>: 설비 진동·전류 데이터로 고장 예측, 자율복구·원격 관제<\/li><li><b>과제<\/b>: 대규모 초기 투자, 표준화(OPC UA·TSN), OT 사이버보안(IEC 62443), 돌발 고장 대응, 인력 재배치·전환<\/li><\/ul>", "pp": "<h4>1) 관점별 구성<\/h4>\n<div class=\"tblwrap\"><table class=\"cmp\"><colgroup><col style=\"width:24%\"><col style=\"width:28%\"><col style=\"width:48%\"><\/colgroup><thead><tr><th>관점(측면)<\/th><th>특징<\/th><th>설명<\/th><\/tr><\/thead><tbody><tr><td class=\"k\">제조 프로세스<\/td><td>무인·연속 ·전문성·병렬성)를 극복하기 위한 구조<\/p>", "kw": "<ul class=\"kw\"><li><b>단일 vs 다중<\/b>: 단일(범용 1개·단순·프롬프트 비대) <b>vs<\/b> 다중(전문화·역할 분리·병렬 처리, 조정 복잡도 증가)<\/li><li><b>협업 패턴<\/b>: 계층형(Supervisor·Orchestrator + Worker), 순차 파이프라인, 토론·협상(Debate), 병렬 실행 후 집계, 라우터<\/li><li><b>에이전트 간 통신<\/b>: <b>MCP<\/b>(도구·자원 표준 연결), <b>A2A<\/b>(Agent Card 기반 위임·발견), 블랙보드(공유 메모리)<\/li><li><b>기대 효과<\/b>: 정확도·전문성 향상, 병렬 처리로 지연 단축, 장애 격리·확장성<\/li><li><b>고려사항<\/b>: 무한 루프(Max-Turn/종료 조건 필수)·토큰 비용 폭증·<b>환각 전파(Hallucination Propagation)<\/b> 방지, 관측성(Observability)·가드레일·역할·권한 경계 명확화<\/li><\/ul>", "pp": "<h4>1) 개념 비교 (단일 vs 다중 에이전트 · AI 모듈: 환·요·비·목·보·성)<\/h4>\n<div class=\"tblwrap\"><table class=\"cmp\"><colgroup><col style=\"width:24%\"><col style=\"width:28%\"><col style=\"width:48%\"><\/colgroup><thead><tr><th>구분<\/th><th>단일 에이전트<\/th><th>다중 에이전트 시스템 (MAS)<\/th><\/tr><\/thead><tbody><tr><td class=\"k\">환각·신뢰성<\/td><td>자기 오류 검출 한계<\/td><td>에이전트 간 교차 검증·비평(Critic)으로 완화 (단, 환각 전파 주의)<\/td><\/tr><tr><td class=\"k\">요구데이터<\/td><td>단일 프롬프트·도구 명세<\/td><td>역할별 페르소나·공유 메모리·상태 스키마<\/td><\/tr><tr><td class=\"k\">학습·추론비용<\/td><td>1회성 호출로 토큰 비용 낮음<\/td><td>다중 왕복·병렬 호출로 토큰 비용 상승<\/td><\/tr><tr><td class=\"k\">적용목적<\/td><td>단순·단일 도메인 업무<\/td><td>복합·다단계·다도메인 협업 업무<\/td><\/tr><tr><td class=\"k\">보안·프라이버시<\/td><td>단일 권한 경계 통제 용이<\/td><td>에이전트 간 위임(A2A)·MCP 권한 경계 통제 필수<\/td><\/tr><tr><td class=\"k\">성능·정확도<\/td><td>순차 처리로 복합 작업 한계<\/td><td><b>태스크 분해(Task Decomposition)<\/b>·병렬 MCP 실행으로 처리량·정확도 향상<\/td><\/tr><\/tbody><\/table><\/div>\n<h4>2) 상세 비교 (효과·고려사항)<\/h4>\n<div class=\"tblwrap\"><table class=\"cmp\"><colgroup><col style=\"width:24%\"><col style=\"width:28%\"><col style=\"width:48%\"><\/colgroup><thead><tr><th>구분<\/th><th>특징<\/th><th>설명<\/th><\/tr><\/thead><tbody><tr><td class=\"k\">효과<\/td><td>정확도·확장성<\/td><td>전문 역할 분담으로 품질↑, 병렬 처리로 처리량↑<\/td><\/tr><tr><td class=\"k\">비용<\/td><td>토큰·지연 증가<\/td><td>에이전트 간 대화가 누적되어 비용·응답시간 상승<\/td><\/tr><tr><td class=\"k\">위험<\/td><td>무한 루프·환각 전파<\/td><td>잘못된 위임·환각이 하위 에이전트로 연쇄 확대 → 종료 조건(Max-Turn)·가드레일·관측성 필수<\/td><\/tr><\/tbody><\/table><\/div>", "rv": "<div class=\"q\"><b>두음: 전·역·협·관<\/b> — 전문화 · 역할 분담 · 협업 패턴 · 관측성(통제)<\/div>\n<div class=\"q\"><b>\"MAS는 팀 플레이\"<\/b> — Supervisor가 지시, Worker가 실행, A2A가 위임, MCP가 도구 연결! (고려사항: <b>무한 루프·토큰 비용 폭증·환각 전파 방지 → 종료 조건·가드레일·관측성<\/b>)<\/div>", "img": "itpe-diagrams/96-mas.webp", "txt": null, "search": "다중 에이전트 시스템 (mas) 다중 에이전트 (mas) 단일 vs 다중 · 협업 패턴 ai·데이터 llm·rag·에이전트 빨간별 빨간 별 빨간색 별 ★ 레드별 심화반 심화 선택 복잡한 업무를 역할이 분담된 여러 ai 에이전트 가 협업·조정·위임을 통해 나누어 해결하는 분산 지능 시스템으로, 단일 범용 에이전트의 한계(긴 컨텍스트·전문성·병렬성)를 극복하기 위한 구조 단일 vs 다중 : 단일(범용 1개·단순·프롬프트 비대) vs 다중(전문화·역할 분리·병렬 처리, 조정 복잡도 증가) 협업 패턴 : 계층형(supervisor·orchestrator + worker), 순차 파이프라인, 토론·협상(debate), 병렬 실행 후 집계, 라우터 에이전트 간 통신 : mcp (도구·자원 표준 연결), a2a (agent card 기반 위임·발견), 블랙보드(공유 메모리) 기대 효과 : 정확도·전문성 향상, 병렬 처리로 지연 단축, 장애 격리·확장성 고려사항 : 무한 루프(max-turn/종료 조건 필수)·토큰 비용 폭증· 환각 전파(hallucination propagation) 방지, 관측성(observability)·가드레일·역할·권한 경계 명확화 1) 개념 비교 (단일 vs 다중 에이전트 · ai 모듈: 환·요·비·목·보·성) 구분 단일 에이전트 다중 에이전트 시스템 (mas) 환각·신뢰성 자기 오류 검출 한계 에이전트 간 교차 검증·비평(critic)으로 완화 (단, 환각 전파 주의) 요구데이터 단일 프롬프트·도구 명세 역할별 페르소나·공유 메모리·상태 스키마 학습·추론비용 1회성 호출로 토큰 비용 낮음 다중 왕복·병렬 호출로 토큰 비용 상승 적용목적 단순·단일 도메인 업무 복합·다단계·다도메인 협업 업무 보안·프라이버시 단일 권한 경계 통제 용이 에이전트 간 위임(a2a)·mcp 권한 경계 통제 필수 성능·정확도 순차 처리로 복합 작업 한계 태스크 분해(task decomposition) ·병렬 mcp 실행으로 처리량·정확도 향상 2) 상세 비교 (효과·고려사항) 구분 특징 설명 효과 정확도·확장성 전문 역할 분담으로 품질↑, 병렬 처리로 처리량↑ 비용 토큰·지연 증가 에이전트 간 대화가 누적되어 비용·응답시간 상승 위험 무한 루프·환각 전파 잘못된 위임·환각이 하위 에이전트로 연쇄 확대 → 종료 조건(max-turn)·가드레일·관측성 필수 두음: 전·역·협·관 — 전문화 · 역할 분담 · 협업 패턴 · 관측성(통제) \"mas는 팀 플레이\" — supervisor가 지시, worker가 실행, a2a가 위임, mcp가 도구 연결! (고려사항: 무한 루프·토큰 비용 폭증·환각 전파 방지 → 종료 조건·가드레일·관측성 )"}, {"id": "ab-testing", "cat": "ai", "sub": "ai-trust", "parent": null, "t": "A/B 테스팅", "s": "무작위 배정 · 유의성 검정", "stars": 0, "redStar": true, "full": "A/B 테스팅 (A/B Testing)", "catLabel": "AI·데이터", "st": "📌 복습 필요", "d": "2026-11-23", "def": "<p>사용자를 <b>무작위로 대조군(A)과 실험군(B)으로 배정<\/b>해 서로 다른 버전을 노출하고, 성과 지표 차이가 <b>통계적으로 유의<\/b>한지 검증해 데이터 기반으로 의사결정하는 실험 기법<\/p>", "kw": "<ul class=\"kw\"><li><b>절차<\/b>: 가설 수립 → 핵심 지표(OEC) 정의 → <b>무작위 배정·표본 크기 산정<\/b> → 실험 수행 → 통계 검정 → 확대·중단 의사결정<\/li><li><b>통계 기반<\/b>: 귀무가설·유의수준(α=0.05)·p-value·신뢰구간, 검정력(1-β=0.8), <b>최소검출효과(MDE)<\/b>로 표본 크기 결정<\/li><li><b>오류 유형<\/b>: <b>1종 오류(α)<\/b> = 실제 차이 없는데 유의(거짓 양성), <b>2종 오류(β)<\/b> = 실제 차이를 놓침(거짓 음성)<\/li><li><b>편향·함정<\/b>: 다중 비교(Multiple Testing) 문제, P-hacking, 실험 기간·계절성 편향, 표본 오염(SUTVA)<\/li><li><b>변형<\/b>: 다변량 테스트(MVT), A/B/n, 순차 검정·베이지안, <b>멀티암드 밴딧<\/b><\/li><li><b>AI 적용<\/b>: 프롬프트·모델·추천 알고리즘 비교, 오프라인 벤치마크 대비 온라인 A/B, 품질·지연·비용 가드레일 지표 병행<\/li><\/ul>", "pp": "<h4>1) 관점별 구성<\/h4>\n<div class=\"tblwrap\"><table class=\"cmp\"><colgroup><col style=\"width:24%\"><col style=\"width:28%\"><col style=\"width:48%\"><\/colgroup><thead><tr><th>관점(측면)<\/th><th>특징<\/th><th>설명<\/th><\/tr><\/thead><tbody><tr><td class=\"k\">설계<\/td><td>가설·지표·표본<\/td><td>OEC 1개 중심, MDE 기반 표본 크기·검정력 확보<\/td><\/tr><tr><td class=\"k\">수행<\/td><td>무작위 배정<\/td><td>사용자 단위 랜덤화로 교란변수 통제, 동시·독립 실험<\/td><\/tr><tr><td class=\"k\">분석<\/td><td>통계적 유의성<\/td><td>p-value·신뢰구간, 다중 비교 보정<\/td><\/tr><tr><td class=\"k\">위험<\/td><td>오류·편향<\/td><td>1·2종 오류, 조기 중단·기간 편향 회피<\/td><\/tr><tr><td class=\"k\">AI 적용<\/td><td>온라인 평가<\/td><td>모델·프롬프트 비교 시 품질·환각·지연·비용 함께 측정<\/td><\/tr><\/tbody><\/table><\/div>", "rv": "<div class=\"q\"><b>두음: 가·지·무·검<\/b> — 가설 · 지표(OEC) · 무작위 배정 · 검정(유의성)<\/div>\n<div class=\"q\"><b>1종 = 거짓 양성(α), 2종 = 거짓 음성(β)<\/b> — 검정력 = 1-β, 표본이 작으면 2종 오류가 커진다!<\/div>", "img": "itpe-diagrams/103-ab-testing.webp", "txt": null, "search": "a/b 테스팅 (a/b testing) a/b 테스팅 무작위 배정 · 유의성 검정 ai·데이터 ai 신뢰성·거버넌스 빨간별 빨간 별 빨간색 별 ★ 레드별 심화반 심화 선택 사용자를 무작위로 대조군(a)과 실험군(b)으로 배정 해 서로 다른 버전을 노출하고, 성과 지표 차이가 통계적으로 유의 한지 검증해 데이터 기반으로 의사결정하는 실험 기법 절차 : 가설 수립 → 핵심 지표(oec) 정의 → 무작위 배정·표본 크기 산정 → 실험 수행 → 통계 검정 → 확대·중단 의사결정 통계 기반 : 귀무가설·유의수준(α=0.05)·p-value·신뢰구간, 검정력(1-β=0.8), 최소검출효과(mde) 로 표본 크기 결정 오류 유형 : 1종 오류(α) = 실제 차이 없는데 유의(거짓 양성), 2종 오류(β) = 실제 차이를 놓침(거짓 음성) 편향·함정 : 다중 비교(multiple testing) 문제, p-hacking, 실험 기간·계절성 편향, 표본 오염(sutva) 변형 : 다변량 테스트(mvt), a/b/n, 순차 검정·베이지안, 멀티암드 밴딧 ai 적용 : 프롬프트·모델·추천 알고리즘 비교, 오프라인 벤치마크 대비 온라인 a/b, 품질·지연·비용 가드레일 지표 병행 1) 관점별 구성 관점(측면) 특징 설명 설계 가설·지표·표본 oec 1개 중심, mde 기반 표본 크기·검정력 확보 수행 무작위 배정 사용자 단위 랜덤화로 교란변수 통제, 동시·독립 실험 분석 통계적 유의성 p-value·신뢰구간, 다중 비교 보정 위험 오류·편향 1·2종 오류, 조기 중단·기간 편향 회피 ai 적용 온라인 평가 모델·프롬프트 비교 시 품질·환각·지연·비용 함께 측정 두음: 가·지·무·검 — 가설 · 지표(oec) · 무작위 배정 · 검정(유의성) 1종 = 거짓 양성(α), 2종 = 거짓 음성(β) — 검정력 = 1-β, 표본이 작으면 2종 오류가 커진다!"}, {"id": "resampling-cv", "cat": "ai", "sub": "ai-trust", "parent": null, "t": "리샘플링 기법", "s": "Bootstrap·Jackknife·K-Fold·OOB", "stars": 2, "redStar": false, "full": "리샘플링 기법 · Bootstrap·Jackknife·K-Fold·OOB", "catLabel": "AI·데이터", "st": "📌 복습 필요", "d": "2026-11-25", "def": "<p><b>리샘플링(Resampling)<\/b>은 하나의 원 데이터에서 <b>복원·비복원 추출<\/b>로 여러 표본을 만들어 통계량의 <b>표집분포·분산·신뢰구간<\/b>을 추정하거나 모델의 <b>일반화 성능<\/b>을 평가하는 기법. <b>Bootstrap<\/b>은 복원 추출로 분산·신뢰구간을 추정하며 앙상블(Bagging)의 기반이 되고, <b>K-Fold 교차검증<\/b>은 홀드아웃 1회의 우연을 제거해 과적합을 진단하며, <b>OOB<\/b>는 추출되지 않은 표본(약 36.8%)을 검증셋으로 재활용하는 <b>모델 평가·불확실성 추정 기법<\/b>.<\/p>", "kw": "<ul class=\"kw\"><li><b>Bootstrap<\/b>: n개를 <b>복원 추출<\/b>해 B회 반복 → 통계량 분포 추정, 백분위·BCa 신뢰구간, Bagging·Random Forest의 모체<\/li><li><b>Jackknife<\/b>: <b>1개씩 제외<\/b>한 n개 표본으로 편향(Bias)·분산 추정 — 계산 n회로 적고 선형 통계량(평균·분산)에 적합<\/li><li><b>K-Fold CV<\/b>: 데이터를 K등분해 K-1 학습·1 검증을 K회 반복 → 일반화 성능 추정. K=5·10 관례, K=n이면 <b>LOOCV<\/b><\/li><li><b>OOB (Out-of-Bag)<\/b>: 복원 추출에서 한 번도 뽑히지 않은 표본(약 <b>36.8%<\/b> = 1−1/e)으로 검증 — 별도 검증셋 없이 성능 추정<\/li><li><b>Stratified / Group / TimeSeries K-Fold<\/b>: 클래스 비율 유지 · 동일 그룹 누출 방지 · 시계열은 <b>미래 정보 누출<\/b> 차단<\/li><li><b>Nested CV<\/b>: 하이퍼파라미터 선택(안쪽)과 성능 평가(바깥쪽)를 분리해 <b>선택 편향<\/b> 제거<\/li><li><b>데이터 누수(Leakage)<\/b>: 스케일링·인코딩의 fit은 반드시 학습 폴드 안에서만 수행<\/li><\/ul>", "pp": "<h4>1) Bootstrap vs K-Fold CV (비교모듈: 목·데·비·최·보·환)<\/h4>\n<div class=\"tblwrap\"><table class=\"cmp\"><colgroup><col style=\"width:24%\"><col style=\"width:28%\"><col style=\"width:48%\"><\/colgroup><thead><tr><th>구분<\/th><th>Bootstrap (복원 추출)<\/th><th>K-Fold CV (교차 검증)<\/th><\/tr><\/thead><tbody><tr><td class=\"k\">목적<\/td><td>통계량의 표집분포·신뢰구간 추정<\/td><td>모델의 일반화 성능·과적합 진단<\/td><\/tr><tr><td class=\"k\">데이터 요구<\/td><td>원 데이터 n개만 있으면 됨(모델 불필요)<\/td><td>모델 학습 필요, K개 폴드 분할·계층·그룹 고려<\/td><\/tr><tr><td class=\"k\">비용<\/td><td>B회 재추출·통계량 계산(저렴, 병렬화 쉬움)<\/td><td>K회 재학습 → 학습 비용 K배<\/td><\/tr><tr><td class=\"k\">최신성(시계열)<\/td><td>순서 무시 — 시계열에는 블록 Bootstrap 필요<\/td><td>순서 무시 — 시계열은 TimeSeriesSplit 필수<\/td><\/tr><tr><td class=\"k\">보안·재현성<\/td><td>난수 시드 고정 없으면 결과 재현 불가<\/td><td>폴드 고정·Stratified로 재현성 확보<\/td><\/tr><tr><td class=\"k\">신뢰성(편향)<\/td><td>분산·신뢰구간을 직접 제시<\/td><td>모델 선택 편향은 Nested CV로 보정<\/td><\/tr><\/tbody><\/table><\/div>\n<h4>2) 기법별 비교 (Bootstrap · Jackknife · K-Fold · OOB)<\/h4>\n<div class=\"tblwrap\"><table class=\"cmp\"><colgroup><col style=\"width:24%\"><col style=\"width:28%\"><col style=\"width:48%\"><\/colgroup><thead><tr><th>구분<\/th><th>재표본 방식<\/th><th>용도·특징<\/th><\/tr><\/thead><tbody><tr><td class=\"k\">Bootstrap<\/td><td>복원 추출 n개 × B회<\/td><td>분산·CI 추정, Bagging 기반, 계산량 B에 비례<\/td><\/tr><tr><td class=\"k\">Jackknife<\/td><td>1개 제외 × n회<\/td><td>편향·분산 추정, 계산 n회로 최소, 비선형 통계량엔 약함<\/td><\/tr><tr><td class=\"k\">K-Fold CV<\/td><td>K등분 비복원, K회 순환<\/td><td>일반화 성능 추정, K 선택이 편향·분산 트레이드오프<\/td><\/tr><tr><td class=\"k\">OOB<\/td><td>추출되지 않은 약 36.8%<\/td><td>앙상블 내장 검증, 검증셋 미분리 시 유용<\/td><\/tr><\/tbody><\/table><\/div>\n<h4>3) 평가 설계·운영 고려사항<\/h4>\n<div class=\"tblwrap\"><table class=\"cmp\"><colgroup><col style=\"width:24%\"><col style=\"width:28%\"><col style=\"width:48%\"><\/colgroup><thead><tr><th>구분<\/th><th>키워드<\/th><th>설명<\/th><\/tr><\/thead><tbody><tr><td class=\"k\">분할 전략<\/td><td>계층·그룹·시간<\/td><td>불균형은 Stratified, 동일 환자·고객은 Group, 시계열은 시간순 분할<\/td><\/tr><tr><td class=\"k\">누수 방지<\/td><td>Pipeline fit<\/td><td>전처리·결측 대체·특성 선택을 학습 폴드 내부에서만 적합<\/td><\/tr><tr><td class=\"k\">반복<\/td><td>Repeated CV<\/td><td>폴드 구성 운을 줄여 성능 추정의 분산 축소(5×2, 10×3)<\/td><\/tr><tr><td class=\"k\">불확실성<\/td><td>표준편차·CI<\/td><td>폴드별 점수의 평균±표준편차를 함께 보고, 단일 점수만 제시하지 않음<\/td><\/tr><tr><td class=\"k\">비용<\/td><td>K·B 튜닝<\/td><td>대용량·딥러닝은 K=3~5, 소규모는 LOOCV·Repeated로 보완<\/td><\/tr><\/tbody><\/table><\/div>", "rv": "<div class=\"q\"><b>두음: 부·잭·케·오<\/b> — Bootstrap·Jackknife·K-Fold·OOB / <b>계·그·시<\/b> — Stratified·Group·TimeSeries<\/div>\n<div class=\"q\"><b>\"복원 추출은 분산·신뢰구간, 비복원 분할은 일반화 성능 — 데이터 누수만 막으면 절반은 맞힌다\"<\/b><\/div>", "img": "itpe-diagrams/130-resampling-cv.webp", "txt": null, "search": "리샘플링 기법 · bootstrap·jackknife·k-fold·oob 리샘플링 기법 bootstrap·jackknife·k-fold·oob ai·데이터 ai 신뢰성·거버넌스 ⭐⭐ 기출빈출 기출 빈출 중요 리샘플링(resampling) 은 하나의 원 데이터에서 복원·비복원 추출 로 여러 표본을 만들어 통계량의 표집분포·분산·신뢰구간 을 추정하거나 모델의 일반화 성능 을 평가하는 기법. bootstrap 은 복원 추출로 분산·신뢰구간을 추정하며 앙상블(bagging)의 기반이 되고, k-fold 교차검증 은 홀드아웃 1회의 우연을 제거해 과적합을 진단하며, oob 는 추출되지 않은 표본(약 36.8%)을 검증셋으로 재활용하는 모델 평가·불확실성 추정 기법 . bootstrap : n개를 복원 추출 해 b회 반복 → 통계량 분포 추정, 백분위·bca 신뢰구간, bagging·random forest의 모체 jackknife : 1개씩 제외 한 n개 표본으로 편향(bias)·분산 추정 — 계산 n회로 적고 선형 통계량(평균·분산)에 적합 k-fold cv : 데이터를 k등분해 k-1 학습·1 검증을 k회 반복 → 일반화 성능 추정. k=5·10 관례, k=n이면 loocv oob (out-of-bag) : 복원 추출에서 한 번도 뽑히지 않은 표본(약 36.8% = 1−1/e)으로 검증 — 별도 검증셋 없이 성능 추정 stratified / group / timeseries k-fold : 클래스 비율 유지 · 동일 그룹 누출 방지 · 시계열은 미래 정보 누출 차단 nested cv : 하이퍼파라미터 선택(안쪽)과 성능 평가(바깥쪽)를 분리해 선택 편향 제거 데이터 누수(leakage) : 스케일링·인코딩의 fit은 반드시 학습 폴드 안에서만 수행 1) bootstrap vs k-fold cv (비교모듈: 목·데·비·최·보·환) 구분 bootstrap (복원 추출) k-fold cv (교차 검증) 목적 통계량의 표집분포·신뢰구간 추정 모델의 일반화 성능·과적합 진단 데이터 요구 원 데이터 n개만 있으면 됨(모델 불필요) 모델 학습 필요, k개 폴드 분할·계층·그룹 고려 비용 b회 재추출·통계량 계산(저렴, 병렬화 쉬움) k회 재학습 → 학습 비용 k배 최신성(시계열) 순서 무시 — 시계열에는 블록 bootstrap 필요 순서 무시 — 시계열은 timeseriessplit 필수 보안·재현성 난수 시드 고정 없으면 결과 재현 불가 폴드 고정·stratified로 재현성 확보 신뢰성(편향) 분산·신뢰구간을 직접 제시 모델 선택 편향은 nested cv로 보정 2) 기법별 비교 (bootstrap · jackknife · k-fold · oob) 구분 재표본 방식 용도·특징 bootstrap 복원 추출 n개 × b회 분산·ci 추정, bagging 기반, 계산량 b에 비례 jackknife 1개 제외 × n회 편향·분산 추정, 계산 n회로 최소, 비선형 통계량엔 약함 k-fold cv k등분 비복원, k회 순환 일반화 성능 추정, k 선택이 편향·분산 트레이드오프 oob 추출되지 않은 약 36.8% 앙상블 내장 검증, 검증셋 미분리 시 유용 3) 평가 설계·운영 고려사항 구분 키워드 설명 분할 전략 계층·그룹·시간 불균형은 stratified, 동일 환자·고객은 group, 시계열은 시간순 분할 누수 방지 pipeline fit 전처리·결측 대체·특성 선택을 학습 폴드 내부에서만 적합 반복 repeated cv 폴드 구성 운을 줄여 성능 추정의 분산 축소(5×2, 10×3) 불확실성 표준편차·ci 폴드별 점수의 평균±표준편차를 함께 보고, 단일 점수만 제시하지 않음 비용 k·b 튜닝 대용량·딥러닝은 k=3~5, 소규모는 loocv·repeated로 보완 두음: 부·잭·케·오 — bootstrap·jackknife·k-fold·oob / 계·그·시 — stratified·group·timeseries \"복원 추출은 분산·신뢰구간, 비복원 분할은 일반화 성능 — 데이터 누수만 막으면 절반은 맞힌다\""}, {"id": "causal-inference", "cat": "ai", "sub": "ai-trust", "parent": null, "t": "상관 vs 인과 · 인과추론", "s": "RCT·PSM·DID·IV·Do", "stars": 2, "redStar": false, "full": "상관관계 vs 인과관계 · 인과추론 기법", "catLabel": "AI·데이터", "st": "📌 복습 필요", "d": "2026-11-25", "def": "<p><b>인과추론(Causal Inference)<\/b>은 관측 데이터에서 <b>\"처치가 결과를 얼마나 바꿨는가\"<\/b>를 식별하는 방법론이다. <b>상관관계<\/b>는 두 변수가 함께 움직이는 것일 뿐이며, <b>교란변수(Confounder)<\/b>·선택 편향·역인과가 끼면 상관은 인과의 증거가 되지 못한다. <b>RCT<\/b>로 무작위 배정을 하거나, <b>PSM·DID·IV·RDD<\/b>로 관측 데이터의 편향을 통제하며, <b>Do-Calculus<\/b>로 인과 효과를 형식적으로 정의하는 <b>인과 효과 식별 방법론<\/b>.<\/p>", "kw": "<ul class=\"kw\"><li><b>교란변수<\/b>: 처치와 결과 모두에 영향을 주는 변수 — 통제하지 않으면 <b>가짜 상관(Spurious)<\/b><\/li><li><b>RCT<\/b>: 무작위 배정으로 교란을 통제 — 인과 추론의 <b>표준(Gold Standard)<\/b>, 윤리·비용 제약<\/li><li><b>PSM<\/b>: 성향점수(처치 확률)가 유사한 대조군을 매칭해 선택 편향 완화<\/li><li><b>DID<\/b>: (처리군 전후 차) − (대조군 전후 차) — 시간 불변 교란 통제, <b>평행추세 가정<\/b> 필요<\/li><li><b>IV(도구변수)<\/b>: 처치에는 영향, 결과에는 직접 영향이 없는 변수로 <b>내생성<\/b> 해결 — 배제 제약 필요<\/li><li><b>RDD<\/b>: 임계값(자격 기준) 전후 불연속을 이용, <b>Synthetic Control<\/b>은 합성 대조군 구성<\/li><li><b>Do-Calculus·DAG<\/b>: 인과 그래프로 <b>뒷문(Backdoor) 기준<\/b>을 판정, 개입 do(x)의 효과 P(Y|do(X)) 계산<\/li><li><b>잠재결과 프레임<\/b>: ATE·ATT — \"그 처치를 받지 않았더라면\"의 반사실을 정의<\/li><li><b>함정<\/b>: 심슨의 역설·생존자 편향·콜라이더(Collider) 통제로 인한 편향<\/li><\/ul>", "pp": "<h4>1) RCT vs 관측 데이터 기법(PSM·DID·IV) (비교모듈: 목·데·비·최·보·환)<\/h4>\n<div class=\"tblwrap\"><table class=\"cmp\"><colgroup><col style=\"width:24%\"><col style=\"width:28%\"><col style=\"width:48%\"><\/colgroup><thead><tr><th>구분<\/th><th>RCT (무작위 실험)<\/th><th>관측 데이터 인과추론<\/th><\/tr><\/thead><tbody><tr><td class=\"k\">목적<\/td><td>무작위 배정으로 평균 인과효과(ATE) 식별<\/td><td>교란 통제 후 관측 데이터에서 효과 추정<\/td><\/tr><tr><td class=\"k\">데이터 요구<\/td><td>무작위 배정된 실험·대조군 데이터<\/td><td>기존 데이터 + 공변량·시계열·임계값 정보<\/td><\/tr><tr><td class=\"k\">비용<\/td><td>실험 설계·운영 비용, 윤리 제약<\/td><td>추가 수집 없이 기존 데이터 활용(가정 검증 비용)<\/td><\/tr><tr><td class=\"k\">최신성·외적 타당성<\/td><td>실험 환경에 한정<\/td><td>실제 환경 데이터로 외적 타당성 높음<\/td><\/tr><tr><td class=\"k\">보안·프라이버시<\/td><td>실험군 차별·동의 이슈<\/td><td>개인정보·민감정보 결합 위험<\/td><\/tr><tr><td class=\"k\">신뢰성(식별 가정)<\/td><td>가정 최소, 내적 타당성 최고<\/td><td>무시가능성·평행추세·배제제약 위배 시 편향<\/td><\/tr><\/tbody><\/table><\/div>\n<h4>2) 관측 데이터 기법 비교<\/h4>\n<div class=\"tblwrap\"><table class=\"cmp\"><colgroup><col style=\"width:24%\"><col style=\"width:28%\"><col style=\"width:48%\"><\/colgroup><thead><tr><th>기법<\/th><th>핵심 아이디어<\/th><th>필요 가정·용도<\/th><\/tr><\/thead><tbody><tr><td class=\"k\">PSM<\/td><td>성향점수 유사 표본 매칭<\/td><td>무시가능성(관측 변수로 교란 통제)<\/td><\/tr><tr><td class=\"k\">DID<\/td><td>처리군·대조군 전후 차의 차이<\/td><td>평행추세, 정책·제도 도입 효과<\/td><\/tr><tr><td class=\"k\">IV<\/td><td>도구변수로 처치의 외생 변동 추출<\/td><td>배제제약·관련성, 내생성 해결<\/td><\/tr><tr><td class=\"k\">RDD<\/td><td>임계값 전후 불연속 비교<\/td><td>임계값 근접 표본, 자격·지원 정책<\/td><\/tr><tr><td class=\"k\">Synthetic Control<\/td><td>가중 합성 대조군 구성<\/td><td>단일 처리 단위·장기 시계열<\/td><\/tr><\/tbody><\/table><\/div>\n<h4>3) 분석 절차·고려사항<\/h4>\n<div class=\"tblwrap\"><table class=\"cmp\"><colgroup><col style=\"width:24%\"><col style=\"width:28%\"><col style=\"width:48%\"><\/colgroup><thead><tr><th>구분<\/th><th>키워드<\/th><th>설명<\/th><\/tr><\/thead><tbody><tr><td class=\"k\">1단계<\/td><td>인과 그래프<\/td><td>DAG로 교란·매개·콜라이더 구분, 뒷문 경로 확인<\/td><\/tr><tr><td class=\"k\">2단계<\/td><td>식별 전략<\/td><td>실험 가능하면 RCT, 불가하면 DID·IV·RDD 선택<\/td><\/tr><tr><td class=\"k\">3단계<\/td><td>가정 검증<\/td><td>평행추세 사전검정·성향점수 균형·도구변수 타당성<\/td><\/tr><tr><td class=\"k\">4단계<\/td><td>민감도 분석<\/td><td>미관측 교란에 대한 강건성(E-value), 대안 모형 비교<\/td><\/tr><tr><td class=\"k\">해석<\/td><td>상관≠인과<\/td><td>효과 크기·신뢰구간과 함께 \"어떤 가정에서 성립하는가\"를 명시<\/td><\/tr><\/tbody><\/table><\/div>", "rv": "<div class=\"q\"><b>두음: 알·피·디·아이·알 — RCT·PSM·DID·IV·RDD / 도·뒷 — Do-Calculus·뒷문 기준<\/b><\/div>\n<div class=\"q\"><b>\"무작위가 없으면 가정이 필요하다 — 가정을 세우고, 검증하고, 민감도를 밝혀라\"<\/b><\/div>", "img": "itpe-diagrams/143-causal-inference.webp", "txt": null, "search": "상관관계 vs 인과관계 · 인과추론 기법 상관 vs 인과 · 인과추론 rct·psm·did·iv·do ai·데이터 ai 신뢰성·거버넌스 ⭐⭐ 기출빈출 기출 빈출 중요 인과추론(causal inference) 은 관측 데이터에서 \"처치가 결과를 얼마나 바꿨는가\" 를 식별하는 방법론이다. 상관관계 는 두 변수가 함께 움직이는 것일 뿐이며, 교란변수(confounder) ·선택 편향·역인과가 끼면 상관은 인과의 증거가 되지 못한다. rct 로 무작위 배정을 하거나, psm·did·iv·rdd 로 관측 데이터의 편향을 통제하며, do-calculus 로 인과 효과를 형식적으로 정의하는 인과 효과 식별 방법론 . 교란변수 : 처치와 결과 모두에 영향을 주는 변수 — 통제하지 않으면 가짜 상관(spurious) rct : 무작위 배정으로 교란을 통제 — 인과 추론의 표준(gold standard) , 윤리·비용 제약 psm : 성향점수(처치 확률)가 유사한 대조군을 매칭해 선택 편향 완화 did : (처리군 전후 차) − (대조군 전후 차) — 시간 불변 교란 통제, 평행추세 가정 필요 iv(도구변수) : 처치에는 영향, 결과에는 직접 영향이 없는 변수로 내생성 해결 — 배제 제약 필요 rdd : 임계값(자격 기준) 전후 불연속을 이용, synthetic control 은 합성 대조군 구성 do-calculus·dag : 인과 그래프로 뒷문(backdoor) 기준 을 판정, 개입 do(x)의 효과 p(y|do(x)) 계산 잠재결과 프레임 : ate·att — \"그 처치를 받지 않았더라면\"의 반사실을 정의 함정 : 심슨의 역설·생존자 편향·콜라이더(collider) 통제로 인한 편향 1) rct vs 관측 데이터 기법(psm·did·iv) (비교모듈: 목·데·비·최·보·환) 구분 rct (무작위 실험) 관측 데이터 인과추론 목적 무작위 배정으로 평균 인과효과(ate) 식별 교란 통제 후 관측 데이터에서 효과 추정 데이터 요구 무작위 배정된 실험·대조군 데이터 기존 데이터 + 공변량·시계열·임계값 정보 비용 실험 설계·운영 비용, 윤리 제약 추가 수집 없이 기존 데이터 활용(가정 검증 비용) 최신성·외적 타당성 실험 환경에 한정 실제 환경 데이터로 외적 타당성 높음 보안·프라이버시 실험군 차별·동의 이슈 개인정보·민감정보 결합 위험 신뢰성(식별 가정) 가정 최소, 내적 타당성 최고 무시가능성·평행추세·배제제약 위배 시 편향 2) 관측 데이터 기법 비교 기법 핵심 아이디어 필요 가정·용도 psm 성향점수 유사 표본 매칭 무시가능성(관측 변수로 교란 통제) did 처리군·대조군 전후 차의 차이 평행추세, 정책·제도 도입 효과 iv 도구변수로 처치의 외생 변동 추출 배제제약·관련성, 내생성 해결 rdd 임계값 전후 불연속 비교 임계값 근접 표본, 자격·지원 정책 synthetic control 가중 합성 대조군 구성 단일 처리 단위·장기 시계열 3) 분석 절차·고려사항 구분 키워드 설명 1단계 인과 그래프 dag로 교란·매개·콜라이더 구분, 뒷문 경로 확인 2단계 식별 전략 실험 가능하면 rct, 불가하면 did·iv·rdd 선택 3단계 가정 검증 평행추세 사전검정·성향점수 균형·도구변수 타당성 4단계 민감도 분석 미관측 교란에 대한 강건성(e-value), 대안 모형 비교 해석 상관≠인과 효과 크기·신뢰구간과 함께 \"어떤 가정에서 성립하는가\"를 명시 두음: 알·피·디·아이·알 — rct·psm·did·iv·rdd / 도·뒷 — do-calculus·뒷문 기준 \"무작위가 없으면 가정이 필요하다 — 가정을 세우고, 검증하고, 민감도를 밝혀라\""}, {"id": "ai-data-quality-guide", "cat": "ai", "sub": "ai-data", "parent": null, "t": "신기술 AI 데이터 품질가이드", "s": "v1.0(2026.02) · 추론형 AI", "stars": 1, "redStar": false, "full": "신기술 AI 데이터 품질관리 가이드 v1.0 (2026.02)", "catLabel": "AI·데이터", "st": "📌 복습 필요", "d": "2026-11-25", "def": "<p><b>「신기술 AI 데이터 품질관리 가이드 v1.0」<\/b>은 과기정통부·한국지능정보사회진흥원(NIA)이 2026.02.27 공개한 <b>AI 데이터 품질관리 가이드라인 v4.0<\/b>의 <b>제4권<\/b>이다. 추론형 AI 데이터(<b>CoT·ToT<\/b> 등)처럼 기존 3권이 다루지 못한 <b>신기술 데이터의 품질관리 방법<\/b>을 처음으로 제시했고, 이후 등장할 신기술 데이터도 같은 프레임으로 확장할 수 있도록 설계된 <b>추론형 AI 데이터 품질관리 가이드<\/b>.<\/p>", "kw": "<ul class=\"kw\"><li><b>가이드라인 v4.0 (2026.02.27)<\/b>: 2025년 초거대AI 확산 생태계 조성사업 수행 내용 기반, 2026.04.15 일부 수정·배포용 교체<\/li><li><b>4권 구성<\/b>: ① AI 데이터 품질관리 가이드 v4.0(거버넌스·프레임워크·품질검증 지표) ② AI 데이터 구축 가이드 v4.0(유형별 사례·오류 유형) ③ 생성형AI 데이터 품질관리 가이드 v2.5 ④ <b>신기술 AI 데이터 품질관리 가이드 v1.0<\/b><\/li><li><b>대상<\/b>: <b>추론형 AI 데이터<\/b> — Chain-of-Thought·Tree-of-Thought 등 사고 과정(추론 경로) 데이터<\/li><li><b>품질 관점<\/b>: 추론 단계의 논리 일관성, 근거-결론 정합성, 단계 누락·비약, 난이도 분포<\/li><li><b>기존 체계 준용<\/b>: 계획→수집→정제→가공→검증→배포 공정과 품질 지표 프레임을 신기술 데이터에 적용<\/li><li><b>확장성<\/b>: 신기술 데이터 유형이 추가될 때 권(卷)을 확장하는 방식으로 지속 갱신<\/li><li><b>활용<\/b>: 사업 발주·검수 기준, 품질 자가점검 체크리스트, AI-Hub 배포<\/li><\/ul>", "pp": "<h4>1) 일반 AI 데이터(1~3권) vs 신기술·추론형 데이터(4권) (비교모듈: 목·데·비·최·보·환)<\/h4>\n<div class=\"tblwrap\"><table class=\"cmp\"><colgroup><col style=\"width:24%\"><col style=\"width:28%\"><col style=\"width:48%\"><\/colgroup><thead><tr><th>구분<\/th><th>일반 AI 데이터 (1~3권)<\/th><th>신기술 AI 데이터 (4권, 추론형)<\/th><\/tr><\/thead><tbody><tr><td class=\"k\">목적<\/td><td>과업 정답(라벨) 학습<\/td><td>사고 과정(추론 경로) 학습·평가<\/td><\/tr><tr><td class=\"k\">데이터 요구<\/td><td>입력-정답 쌍, 라벨 정확성<\/td><td>질문-추론단계-정답, 단계별 근거의 검증 가능성<\/td><\/tr><tr><td class=\"k\">비용<\/td><td>라벨링·검수 중심<\/td><td>단계 생성 + 단계별 검증(전문가·LLM 심판)으로 고비용<\/td><\/tr><tr><td class=\"k\">최신성<\/td><td>정적 데이터셋<\/td><td>모델·프롬프트 변경 시 추론 데이터 재생성 필요<\/td><\/tr><tr><td class=\"k\">보안·프라이버시<\/td><td>원천 데이터 비식별<\/td><td>추론 과정에 내부 정보·개인정보가 섞여 노출될 위험<\/td><\/tr><tr><td class=\"k\">신뢰성<\/td><td>정답 일치 중심<\/td><td>중간 추론의 논리 타당성·일관성 검증이 품질을 좌우<\/td><\/tr><\/tbody><\/table><\/div>\n<h4>2) 가이드라인 4권 구성<\/h4>\n<div class=\"tblwrap\"><table class=\"cmp\"><colgroup><col style=\"width:24%\"><col style=\"width:28%\"><col style=\"width:48%\"><\/colgroup><thead><tr><th>권<\/th><th>문서<\/th><th>주요 내용<\/th><\/tr><\/thead><tbody><tr><td class=\"k\">제1권<\/td><td>AI 데이터 품질관리 가이드 v4.0<\/td><td>품질관리 거버넌스·프레임워크, 품질검증 지표<\/td><\/tr><tr><td class=\"k\">제2권<\/td><td>AI 데이터 구축 가이드 v4.0<\/td><td>데이터 유형별 구축 사례, 오류 유형 분석<\/td><\/tr><tr><td class=\"k\">제3권<\/td><td>생성형AI 데이터 품질관리 가이드 v2.5<\/td><td>LLM·멀티모달·합성데이터 구축공정별 품질관리<\/td><\/tr><tr><td class=\"k\">제4권<\/td><td>신기술 AI 데이터 품질관리 가이드 v1.0<\/td><td>추론형 AI(CoT·ToT) 데이터 품질관리 방법<\/td><\/tr><\/tbody><\/table><\/div>\n<h4>3) 품질관리 절차·운영<\/h4>\n<div class=\"tblwrap\"><table class=\"cmp\"><colgroup><col style=\"width:24%\"><col style=\"width:28%\"><col style=\"width:48%\"><\/colgroup><thead><tr><th>구분<\/th><th>키워드<\/th><th>설명<\/th><\/tr><\/thead><tbody><tr><td class=\"k\">계획<\/td><td>요구 정의<\/td><td>용도·모델·난이도 범위를 먼저 정하고 품질 목표·지표 설정<\/td><\/tr><tr><td class=\"k\">구축<\/td><td>생성·수집<\/td><td>사람 작성·모델 생성·기존 데이터 변환 혼합, 생성 이력 기록<\/td><\/tr><tr><td class=\"k\">정제<\/td><td>단계 검증<\/td><td>추론 단계 누락·비약·근거 없는 결론 제거, 정답과의 정합 확인<\/td><\/tr><tr><td class=\"k\">검증<\/td><td>표본 검수<\/td><td>단계별 표본 검수 + 자동 일관성 검사, 오류 유형 분류<\/td><\/tr><tr><td class=\"k\">배포<\/td><td>버전 관리<\/td><td>데이터셋·프롬프트·생성 모델 버전을 함께 기록해 재현성 확보<\/td><\/tr><\/tbody><\/table><\/div>", "rv": "<div class=\"q\"><b>두음: 일·이·삼·사 — 1권 프레임워크·2권 구축·3권 생성형·4권 신기술(추론형)<\/b><\/div>\n<div class=\"q\"><b>\"2026.02 v4.0의 새 권은 추론형 AI 데이터 — 정답이 아니라 사고 과정의 품질을 본다\"<\/b><\/div>", "img": "itpe-diagrams/139-ai-data-quality-guide.webp", "txt": null, "search": "신기술 ai 데이터 품질관리 가이드 v1.0 (2026.02) 신기술 ai 데이터 품질가이드 v1.0(2026.02) · 추론형 ai ai·데이터 데이터 엔지니어링·운영 ⭐ 기출빈출 기출 빈출 중요 「신기술 ai 데이터 품질관리 가이드 v1.0」 은 과기정통부·한국지능정보사회진흥원(nia)이 2026.02.27 공개한 ai 데이터 품질관리 가이드라인 v4.0 의 제4권 이다. 추론형 ai 데이터( cot·tot 등)처럼 기존 3권이 다루지 못한 신기술 데이터의 품질관리 방법 을 처음으로 제시했고, 이후 등장할 신기술 데이터도 같은 프레임으로 확장할 수 있도록 설계된 추론형 ai 데이터 품질관리 가이드 . 가이드라인 v4.0 (2026.02.27) : 2025년 초거대ai 확산 생태계 조성사업 수행 내용 기반, 2026.04.15 일부 수정·배포용 교체 4권 구성 : ① ai 데이터 품질관리 가이드 v4.0(거버넌스·프레임워크·품질검증 지표) ② ai 데이터 구축 가이드 v4.0(유형별 사례·오류 유형) ③ 생성형ai 데이터 품질관리 가이드 v2.5 ④ 신기술 ai 데이터 품질관리 가이드 v1.0 대상 : 추론형 ai 데이터 — chain-of-thought·tree-of-thought 등 사고 과정(추론 경로) 데이터 품질 관점 : 추론 단계의 논리 일관성, 근거-결론 정합성, 단계 누락·비약, 난이도 분포 기존 체계 준용 : 계획→수집→정제→가공→검증→배포 공정과 품질 지표 프레임을 신기술 데이터에 적용 확장성 : 신기술 데이터 유형이 추가될 때 권(卷)을 확장하는 방식으로 지속 갱신 활용 : 사업 발주·검수 기준, 품질 자가점검 체크리스트, ai-hub 배포 1) 일반 ai 데이터(1~3권) vs 신기술·추론형 데이터(4권) (비교모듈: 목·데·비·최·보·환) 구분 일반 ai 데이터 (1~3권) 신기술 ai 데이터 (4권, 추론형) 목적 과업 정답(라벨) 학습 사고 과정(추론 경로) 학습·평가 데이터 요구 입력-정답 쌍, 라벨 정확성 질문-추론단계-정답, 단계별 근거의 검증 가능성 비용 라벨링·검수 중심 단계 생성 + 단계별 검증(전문가·llm 심판)으로 고비용 최신성 정적 데이터셋 모델·프롬프트 변경 시 추론 데이터 재생성 필요 보안·프라이버시 원천 데이터 비식별 추론 과정에 내부 정보·개인정보가 섞여 노출될 위험 신뢰성 정답 일치 중심 중간 추론의 논리 타당성·일관성 검증이 품질을 좌우 2) 가이드라인 4권 구성 권 문서 주요 내용 제1권 ai 데이터 품질관리 가이드 v4.0 품질관리 거버넌스·프레임워크, 품질검증 지표 제2권 ai 데이터 구축 가이드 v4.0 데이터 유형별 구축 사례, 오류 유형 분석 제3권 생성형ai 데이터 품질관리 가이드 v2.5 llm·멀티모달·합성데이터 구축공정별 품질관리 제4권 신기술 ai 데이터 품질관리 가이드 v1.0 추론형 ai(cot·tot) 데이터 품질관리 방법 3) 품질관리 절차·운영 구분 키워드 설명 계획 요구 정의 용도·모델·난이도 범위를 먼저 정하고 품질 목표·지표 설정 구축 생성·수집 사람 작성·모델 생성·기존 데이터 변환 혼합, 생성 이력 기록 정제 단계 검증 추론 단계 누락·비약·근거 없는 결론 제거, 정답과의 정합 확인 검증 표본 검수 단계별 표본 검수 + 자동 일관성 검사, 오류 유형 분류 배포 버전 관리 데이터셋·프롬프트·생성 모델 버전을 함께 기록해 재현성 확보 두음: 일·이·삼·사 — 1권 프레임워크·2권 구축·3권 생성형·4권 신기술(추론형) \"2026.02 v4.0의 새 권은 추론형 ai 데이터 — 정답이 아니라 사고 과정의 품질을 본다\""}, {"id": "adas-ads", "cat": "ai", "sub": "ai-fusion", "parent": null, "t": "ADAS vs ADS", "s": "L0~2 vs L3~5 · ODD·MRM", "stars": 0, "redStar": true, "full": "ADAS vs ADS (운전자 보조 vs 자율주행)", "catLabel": "AI·데이터", "st": "📌 복습 필요", "d": "2026-11-23", "def": "<p><b>ADAS(첨단 운전자 보조 시스템)<\/b>는 운전자를 보조하고 책임이 운전자에게 있는 반면, <b>ADS(자동주행 시스템)<\/b>는 시스템이 동적 운전 태스크(DDT)를 수행하고 <b>주행 책임을 부담<\/b>하는 자율주행 시스템<\/p>", "kw": "<ul class=\"kw\"><li><b>ADAS<\/b>: SAE <b>L0~L2<\/b>, 운전자 상시 감시·최종 책임, 경고·보조 기능 — ACC(적응형 순항), LKA(차선유지), AEB(자동긴급제동), DMS(운전자 모니터링)<\/li><li><b>ADS<\/b>: SAE <b>L3~L5<\/b>, <b>ODD(운행설계영역)<\/b> 내에서 시스템이 DDT 수행 — L3(비상시 개입요청·Fallback), L4(ODD 내 무인), L5(완전 자율)<\/li><li><b>책임 전환<\/b>: L3는 개입 요청 시 운전자 복귀, 미복귀 시 <b>최소위험상태(MRM)<\/b> 전환<\/li><li><b>핵심기술<\/b>: 센서퓨전(카메라·레이더·라이다)·인지·판단·제어, V2X, 고정밀 지도(HD Map)<\/li><li><b>검증·규제<\/b>: 시나리오 기반 검증, <b>SOTIF(ISO 21448)<\/b>·기능안전(ISO 26262)·사이버보안(ISO/SAE 21434), UN R157(ALKS)<\/li><\/ul>", "pp": "<h4>1) 개념 비교 (ADAS vs ADS)<\/h4>\n<div class=\"tblwrap\"><table class=\"cmp\"><colgroup><col style=\"width:24%\"><col style=\"width:28%\"><col style=\"width:48%\"><\/colgroup><thead><tr><th>비교<\/th><th>ADAS (운전자 보조)<\/th><th>ADS (자동주행 시스템)<\/th><\/tr><\/thead><tbody><tr><td class=\"k\">SAE 수준<\/td><td>L0 ~ L2<\/td><td>L3 ~ L5<\/td><\/tr><tr><td class=\"k\">주행 책임<\/td><td>운전자<\/td><td>시스템(ODD 내)<\/td><\/tr><tr><td class=\"k\">역할<\/td><td>경고·보조(제어 개입)<\/td><td>DDT 전 과정 수행·판단<\/td><\/tr><\/tbody><\/table><\/div>\n<h4>2) 상세 비교 (기능·검증 관점)<\/h4>\n<div class=\"tblwrap\"><table class=\"cmp\"><colgroup><col style=\"width:24%\"><col style=\"width:28%\"><col style=\"width:48%\"><\/colgroup><thead><tr><th>구분<\/th><th>ADAS<\/th><th>ADS<\/th><\/tr><\/thead><tbody><tr><td class=\"k\">감시 요건<\/td><td>운전자 상시 감시(DMS)<\/td><td>시스템 자체 감시·진단<\/td><\/tr><tr><td class=\"k\">실패 대응<\/td><td>즉시 운전자 인계<\/td><td>MRM(최소위험상태) 전환<\/td><\/tr><tr><td class=\"k\">검증 초점<\/td><td>기능안전(ISO 26262)<\/td><td>SOTIF·시나리오·ODD 검증<\/td><\/tr><\/tbody><\/table><\/div>", "rv": "<div class=\"q\"><b>두음: 보·운<\/b>(ADAS) — 보조 · 운전자 책임 &nbsp;|&nbsp; <b>자·시<\/b>(ADS) — 자율 · 시스템 책임<\/div>\n<div class=\"q\"><b>L2까지는 ADAS, L3부터는 ADS<\/b> — L3의 핵심은 \"개입 요청과 MRM(최소위험상태)\"!<\/div>", "img": "itpe-diagrams/105-adas-ads.webp", "txt": null, "search": "adas vs ads (운전자 보조 vs 자율주행) adas vs ads l0~2 vs l3~5 · odd·mrm ai·데이터 융합·산업 ai 빨간별 빨간 별 빨간색 별 ★ 레드별 심화반 심화 선택 adas(첨단 운전자 보조 시스템) 는 운전자를 보조하고 책임이 운전자에게 있는 반면, ads(자동주행 시스템) 는 시스템이 동적 운전 태스크(ddt)를 수행하고 주행 책임을 부담 하는 자율주행 시스템 adas : sae l0~l2 , 운전자 상시 감시·최종 책임, 경고·보조 기능 — acc(적응형 순항), lka(차선유지), aeb(자동긴급제동), dms(운전자 모니터링) ads : sae l3~l5 , odd(운행설계영역) 내에서 시스템이 ddt 수행 — l3(비상시 개입요청·fallback), l4(odd 내 무인), l5(완전 자율) 책임 전환 : l3는 개입 요청 시 운전자 복귀, 미복귀 시 최소위험상태(mrm) 전환 핵심기술 : 센서퓨전(카메라·레이더·라이다)·인지·판단·제어, v2x, 고정밀 지도(hd map) 검증·규제 : 시나리오 기반 검증, sotif(iso 21448) ·기능안전(iso 26262)·사이버보안(iso/sae 21434), un r157(alks) 1) 개념 비교 (adas vs ads) 비교 adas (운전자 보조) ads (자동주행 시스템) sae 수준 l0 ~ l2 l3 ~ l5 주행 책임 운전자 시스템(odd 내) 역할 경고·보조(제어 개입) ddt 전 과정 수행·판단 2) 상세 비교 (기능·검증 관점) 구분 adas ads 감시 요건 운전자 상시 감시(dms) 시스템 자체 감시·진단 실패 대응 즉시 운전자 인계 mrm(최소위험상태) 전환 검증 초점 기능안전(iso 26262) sotif·시나리오·odd 검증 두음: 보·운 (adas) — 보조 · 운전자 책임 &nbsp;|&nbsp; 자·시 (ads) — 자율 · 시스템 책임 l2까지는 adas, l3부터는 ads — l3의 핵심은 \"개입 요청과 mrm(최소위험상태)\"!"}, {"id": "physical-ai-vla", "cat": "ai", "sub": "ai-fusion", "parent": null, "t": "Physical AI · VLA", "s": "브·월·심·안 / Embodied AI", "stars": 2, "redStar": false, "full": "Physical AI(피지컬 AI) · VLA · 월드 모델", "catLabel": "AI·데이터", "st": "📌 복습 필요", "d": "2026-11-24", "def": "<p><b>Physical AI(피지컬 AI)<\/b>는 디지털 화면 속 텍스트·이미지 생성을 넘어, 로봇·자율주행차·드론 등 물리적 실체(<b>Embodied AI<\/b>)에 탑재되어 현실 공간을 인지·추론하고 <b>물리적 행동(Action)을 직접 제어<\/b>하는 차세대 AI 체계<\/p>", "kw": "<ul class=\"kw\"><li><b>VLA (Vision-Language-Action) 모델<\/b>: 시각(카메라·LiDAR) + 자연어 명령을 통합 이해하는 <b>VLM<\/b>에 <b>Action Head(제어 토큰·궤적 생성)<\/b>를 결합해 엔드투엔드(End-to-End) 로봇 제어 수행<\/li><li><b>월드 모델 (World Model)<\/b>: 중력·마찰·충돌 등 <b>물리 법칙과 인과관계<\/b>를 내재화해 행동 결과를 사전 시뮬레이션·예측<\/li><li><b>Sim-to-Real (시뮬레이션-현실 전이)<\/b>: 가상 물리 환경(Isaac Sim 등)에서 대규모 강화학습·합성 데이터로 학습 후 실제 하드웨어에 전이(<b>Domain Randomization<\/b>으로 갭 축소)<\/li><li><b>실시간 제어 루프<\/b>: 클라우드 VLM(고수준 추론, 저빈도) + 온디바이스 제어기(<b>저지연·고빈도<\/b>, 수백 Hz) 계층 분리(<b>System 1/2<\/b> 구조)<\/li><li><b>안전·신뢰 과제<\/b>: 물리적 충돌 방지 <b>안전 가드레일(Safety Guardrail)<\/b>, 고장 안전(Fail-Safe), 배터리·온디바이스 NPU 연산 제약<\/li><\/ul>", "pp": "<h4>1) 개념 비교 (기존 AI vs Physical AI)<\/h4>\n<div class=\"tblwrap\"><table class=\"cmp\"><colgroup><col style=\"width:24%\"><col style=\"width:28%\"><col style=\"width:48%\"><\/colgroup><thead><tr><th>비교<\/th><th>기존 생성형 AI<\/th><th>Physical AI (피지컬 AI)<\/th><\/tr><\/thead><tbody><tr><td class=\"k\">작동 공간<\/td><td>디지털 공간(텍스트·영상)<\/td><td>물리 공간(로봇·차량·드론)<\/td><\/tr><tr><td class=\"k\">핵심 모델<\/td><td>LLM · VLM<\/td><td>VLA + World Model<\/td><\/tr><tr><td class=\"k\">오류 영향<\/td><td>환각·정보 오류<\/td><td>물리적 파손·인명 사고(안전 필수)<\/td><\/tr><\/tbody><\/table><\/div>\n<h4>2) 상세 비교 (핵심 구성 요소)<\/h4>\n<div class=\"tblwrap\"><table class=\"cmp\"><colgroup><col style=\"width:24%\"><col style=\"width:28%\"><col style=\"width:48%\"><\/colgroup><thead><tr><th>구분<\/th><th>특징<\/th><th>설명<\/th><\/tr><\/thead><tbody><tr><td class=\"k\">인지·행동<\/td><td>VLA 모델<\/td><td>시각·언어 입력을 관절 각도·이동 궤적 같은 행동(Action) 토큰으로 직접 출력<\/td><\/tr><tr><td class=\"k\">학습 환경<\/td><td>Sim-to-Real<\/td><td>현실 데이터 부족을 가상 물리 시뮬레이터와 Domain Randomization으로 극복<\/td><\/tr><tr><td class=\"k\">제어 구조<\/td><td>온디바이스 저지연<\/td><td>실시간 센서 피드백과 충돌 방지를 위해 엣지 NPU 기반 저지연 루프 필수<\/td><\/tr><\/tbody><\/table><\/div>", "rv": "<div class=\"q\"><b>두음: 브·월·심·안<\/b> — <b>V<\/b>LA(인지→행동) · <b>월<\/b>드 모델(물리 법칙) · <b>심<\/b>투리얼(Sim-to-Real) · <b>안<\/b>전 가드레일(Fail-Safe)<\/div>\n<div class=\"q\"><b>\"LLM이 말로 답할 때, Physical AI(VLA)는 몸으로 움직인다!\"<\/b><\/div>", "img": "itpe-diagrams/114-physical-ai-vla.webp", "txt": null, "search": "physical ai(피지컬 ai) · vla · 월드 모델 physical ai · vla 브·월·심·안 / embodied ai ai·데이터 융합·산업 ai ⭐⭐ 기출빈출 기출 빈출 중요 physical ai(피지컬 ai) 는 디지털 화면 속 텍스트·이미지 생성을 넘어, 로봇·자율주행차·드론 등 물리적 실체( embodied ai )에 탑재되어 현실 공간을 인지·추론하고 물리적 행동(action)을 직접 제어 하는 차세대 ai 체계 vla (vision-language-action) 모델 : 시각(카메라·lidar) + 자연어 명령을 통합 이해하는 vlm 에 action head(제어 토큰·궤적 생성) 를 결합해 엔드투엔드(end-to-end) 로봇 제어 수행 월드 모델 (world model) : 중력·마찰·충돌 등 물리 법칙과 인과관계 를 내재화해 행동 결과를 사전 시뮬레이션·예측 sim-to-real (시뮬레이션-현실 전이) : 가상 물리 환경(isaac sim 등)에서 대규모 강화학습·합성 데이터로 학습 후 실제 하드웨어에 전이( domain randomization 으로 갭 축소) 실시간 제어 루프 : 클라우드 vlm(고수준 추론, 저빈도) + 온디바이스 제어기( 저지연·고빈도 , 수백 hz) 계층 분리( system 1/2 구조) 안전·신뢰 과제 : 물리적 충돌 방지 안전 가드레일(safety guardrail) , 고장 안전(fail-safe), 배터리·온디바이스 npu 연산 제약 1) 개념 비교 (기존 ai vs physical ai) 비교 기존 생성형 ai physical ai (피지컬 ai) 작동 공간 디지털 공간(텍스트·영상) 물리 공간(로봇·차량·드론) 핵심 모델 llm · vlm vla + world model 오류 영향 환각·정보 오류 물리적 파손·인명 사고(안전 필수) 2) 상세 비교 (핵심 구성 요소) 구분 특징 설명 인지·행동 vla 모델 시각·언어 입력을 관절 각도·이동 궤적 같은 행동(action) 토큰으로 직접 출력 학습 환경 sim-to-real 현실 데이터 부족을 가상 물리 시뮬레이터와 domain randomization으로 극복 제어 구조 온디바이스 저지연 실시간 센서 피드백과 충돌 방지를 위해 엣지 npu 기반 저지연 루프 필수 두음: 브·월·심·안 — v la(인지→행동) · 월 드 모델(물리 법칙) · 심 투리얼(sim-to-real) · 안 전 가드레일(fail-safe) \"llm이 말로 답할 때, physical ai(vla)는 몸으로 움직인다!\""}, {"id": "ea", "cat": "gov", "sub": "gov-strategy", "parent": null, "t": "EA (전사적 아키텍처)", "s": "비·아·데·티 / ISP vs EA", "stars": 3, "redStar": false, "full": "EA(전사적 아키텍처) 4대 뷰", "catLabel": "정보전략·거버넌스", "st": "📌 복습 필요", "d": "2026-11-21", "def": "<p>조직의 비즈니스 전략과 목표를 달성하기 위해 전사 업무·응용·데이터·기술 자원을 <b>일관된 기준과 청사진(Blueprint)으로 통합·정렬·관리하는 전사적 IT 거버넌스 프레임워크<\/b><\/p>", "kw": "<ul class=\"kw\"><li><b>EA 4대 아키텍처 뷰 (비·아·데·티)<\/b>:<ul class=\"kw\"><li><b>BA (Business Architecture)<\/b>: 업무 기능·프로세스·조직 구조 정의<\/li><li><b>AA (Application Architecture)<\/b>: 애플리케이션 기능·인터페이스·연계 정의<\/li><li><b>DA (Data Architecture)<\/b>: 전사 데이터 표준·모델·흐름 정의<\/li><li><b>TA (Technical Architecture)<\/b>: 인프라·네트워크·보안 플랫폼 정의<\/li><\/ul><\/li><li><b>핵심 산출물·참조모델<\/b>: <b>As-Is<\/b>(현행) → <b>To-Be<\/b>(목표) → <b>이행계획<\/b> / 참조모델(BRM·ARM·DRM·TRM·SRM)<\/li><\/ul>", "pp": "<p><b>1) 개념 비교 (ISP vs EA)<\/b><\/p>\n<div class=\"tblwrap\"><table class=\"cmp\"><colgroup><col style=\"width:24%\"><col style=\"width:28%\"><col style=\"width:48%\"><\/colgroup><thead><tr><th>구분<\/th><th>ISP (정보화전략계획)<\/th><th>EA (전사적 아키텍처)<\/th><\/tr><\/thead><tbody><tr><td class=\"k\">목적 · 성격<\/td><td>중장기 정보화 마스터플랜 수립 (일회성/주기적)<\/td><td>전사 IT 자산 청사진 유지·통제 (지속적 관리)<\/td><\/tr><tr><td class=\"k\">핵심 산출물<\/td><td>To-Be 모델 · 과제 포트폴리오 · 투자계획<\/td><td>4대 아키텍처(BA·AA·DA·TA) · 참조모델(TRM/SRM)<\/td><\/tr><\/tbody><\/table><\/div>\n<p><b>2) 거버넌스·운영 관점 구성표<\/b><\/p>\n<div class=\"tblwrap\"><table class=\"cmp\"><colgroup><col style=\"width:24%\"><col style=\"width:28%\"><col style=\"width:48%\"><\/colgroup><thead><tr><th>관점(측면)<\/th><th>특징<\/th><th>설명<\/th><\/tr><\/thead><tbody><tr><td class=\"k\">프로세스·투자 관점<\/td><td>IT 중복 투자 방지<\/td><td>신규 시스템 도입 전 EA 저장소(메타시스템) 조회로 기존 자원 재활용<\/td><\/tr><tr><td class=\"k\">프레임워크 관점<\/td><td>Zachman · TOGAF · 범정부 EA<\/td><td>6W×6관점 매트릭스(Zachman), ADM 순환 개발 방법론(TOGAF)<\/td><\/tr><tr><td class=\"k\">클라우드·MSA 연계<\/td><td>경량 EA · 거버넌스 정렬<\/td><td>마이크로서비스·AI 도입 시에도 전사 DA/표준 API 거버넌스 기준 제공<\/td><\/tr><\/tbody><\/table><\/div>", "rv": "<div class=\"q\"><b>두음: 비·아·데·티 (BA·AA·DA·TA)<\/b> — 비즈니스·응용·데이터·기술 4대 뷰!<\/div>\n<div class=\"q\"><b>ISP(전략 수립) vs EA(지속적 아키텍처 관리) + As-Is/To-Be/이행계획<\/b>!<\/div>", "img": "itpe-diagrams/70-enterprise-architecture.webp", "txt": null, "search": "ea(전사적 아키텍처) 4대 뷰 ea (전사적 아키텍처) 비·아·데·티 / isp vs ea 정보전략·거버넌스 전략·ea ⭐⭐⭐ 기출빈출 기출 빈출 중요 조직의 비즈니스 전략과 목표를 달성하기 위해 전사 업무·응용·데이터·기술 자원을 일관된 기준과 청사진(blueprint)으로 통합·정렬·관리하는 전사적 it 거버넌스 프레임워크 ea 4대 아키텍처 뷰 (비·아·데·티) : ba (business architecture) : 업무 기능·프로세스·조직 구조 정의 aa (application architecture) : 애플리케이션 기능·인터페이스·연계 정의 da (data architecture) : 전사 데이터 표준·모델·흐름 정의 ta (technical architecture) : 인프라·네트워크·보안 플랫폼 정의 핵심 산출물·참조모델 : as-is (현행) → to-be (목표) → 이행계획 / 참조모델(brm·arm·drm·trm·srm) 1) 개념 비교 (isp vs ea) 구분 isp (정보화전략계획) ea (전사적 아키텍처) 목적 · 성격 중장기 정보화 마스터플랜 수립 (일회성/주기적) 전사 it 자산 청사진 유지·통제 (지속적 관리) 핵심 산출물 to-be 모델 · 과제 포트폴리오 · 투자계획 4대 아키텍처(ba·aa·da·ta) · 참조모델(trm/srm) 2) 거버넌스·운영 관점 구성표 관점(측면) 특징 설명 프로세스·투자 관점 it 중복 투자 방지 신규 시스템 도입 전 ea 저장소(메타시스템) 조회로 기존 자원 재활용 프레임워크 관점 zachman · togaf · 범정부 ea 6w×6관점 매트릭스(zachman), adm 순환 개발 방법론(togaf) 클라우드·msa 연계 경량 ea · 거버넌스 정렬 마이크로서비스·ai 도입 시에도 전사 da/표준 api 거버넌스 기준 제공 두음: 비·아·데·티 (ba·aa·da·ta) — 비즈니스·응용·데이터·기술 4대 뷰! isp(전략 수립) vs ea(지속적 아키텍처 관리) + as-is/to-be/이행계획 !"}, {"id": "isp-vs-ismp", "cat": "gov", "sub": "gov-strategy", "parent": null, "t": "ISP vs ISMP", "s": "이·현·목·이 / 업·아·예·제", "stars": 3, "redStar": false, "full": "ISP vs ISMP (정보화전략계획 · 마스터플랜)", "catLabel": "정보전략·거버넌스", "st": "📌 복습 필요", "d": "2026-11-24", "def": "<p><b>ISP(정보화전략계획)<\/b>는 조직의 중장기 비전·업무를 달성하기 위한 <b>전사 정보화 청사진<\/b>을 수립하는 활동이며, <b>ISMP(정보시스템 마스터플랜)<\/b>는 ISP 등에서 도출된 <b>특정 목표 시스템 구축 사업의 발주·RFP 작성을 위해<\/b> 요구사항·아키텍처·예산을 상세화하는 사전 기획<\/p>", "kw": "<ul class=\"kw\"><li><b>ISP (Information Strategy Planning)<\/b>: 전사 관점, <b>환경 분석 → 현황(As-Is) → 목표(To-Be) → 이행계획(과제·예산·일정)<\/b> 도출, BPR(업무재설계)·EA와 연계<\/li><li><b>ISMP (Information System Master Plan)<\/b>: 특정 SW 구축 사업 관점, <b>업무·기능 요구사항 상세화 + 목표 시스템 아키텍처 + 기능점수(FP) 기반 적정 예산·기간 산정 → RFP(제안요청서)<\/b> 직결<\/li><li><b>도입 배경<\/b>: ISP만으로는 발주 시 요구사항이 모호해 잦은 <b>과업 변경(Scope Creep)<\/b>·저가 수주·분쟁 발생 → 공공SW사업 제안요청서 상세화 제도화<\/li><li><b>연계 흐름<\/b>: <b>ISP<\/b>(전사 과제 도출) → <b>ISMP<\/b>(개별 사업 상세 설계·FP 예산 산정) → <b>RFP 발주·구축<\/b> → 감리·EA 현행화<\/li><li><b>주의점<\/b>: ISMP 수행 사업자의 본사업 참여 제한 여부(공정성·이해충돌 관리) 및 현업 요구사항 추적성 확보<\/li><\/ul>", "pp": "<h4>1) 개념 비교 (ISP vs ISMP)<\/h4>\n<div class=\"tblwrap\"><table class=\"cmp\"><colgroup><col style=\"width:24%\"><col style=\"width:28%\"><col style=\"width:48%\"><\/colgroup><thead><tr><th>비교<\/th><th>ISP (정보화전략계획)<\/th><th>ISMP (정보시스템 마스터플랜)<\/th><\/tr><\/thead><tbody><tr><td class=\"k\">대상 범위<\/td><td>전사·부처 전체 (중장기 3~5년)<\/td><td>특정 단위 정보시스템 구축 사업<\/td><\/tr><tr><td class=\"k\">주요 목적<\/td><td>정보화 전략·투자 우선순위·로드맵<\/td><td>명확한 요구사항·적정 예산(FP)·RFP<\/td><\/tr><tr><td class=\"k\">핵심 산출물<\/td><td>As-Is/To-Be 모델·이행계획<\/td><td>상세 요구사항 정의서·목표 아키텍처·RFP<\/td><\/tr><\/tbody><\/table><\/div>\n<h4>2) 상세 비교 (수립 절차·활용 관점)<\/h4>\n<div class=\"tblwrap\"><table class=\"cmp\"><colgroup><col style=\"width:24%\"><col style=\"width:28%\"><col style=\"width:48%\"><\/colgroup><thead><tr><th>구분<\/th><th>특징<\/th><th>설명<\/th><\/tr><\/thead><tbody><tr><td class=\"k\">연계성<\/td><td>전략 → 발주 가교<\/td><td>ISP에서 도출한 중점 과제를 ISMP로 구체화해 발주 리스크 최소화<\/td><\/tr><tr><td class=\"k\">예산 산정<\/td><td>FP 기반 정밀 산정<\/td><td>ISMP 단계에서 단위 프로세스(ILF·EIF·EI·EO·EQ) 식별해 기능점수(FP) 산출<\/td><\/tr><tr><td class=\"k\">기대 효과<\/td><td>과업 분쟁 예방<\/td><td>모호한 RFP로 인한 잦은 과업 변경·일정 지연 방지 및 SW 제값 받기 구현<\/td><\/tr><\/tbody><\/table><\/div>", "rv": "<div class=\"q\"><b>두음: 이·현·목·이 (ISP) / 업·아·예·제 (ISMP)<\/b> — ISP(환경·현황·목표·이행) / ISMP(업무상세·아키텍처·FP예산·제안요청서)<\/div>\n<div class=\"q\"><b>\"ISP는 전사 지도(What/Why), ISMP는 특정 사업 발주 설계도(How/RFP)!\"<\/b><\/div>", "img": "itpe-diagrams/115-isp-vs-ismp.webp", "txt": null, "search": "isp vs ismp (정보화전략계획 · 마스터플랜) isp vs ismp 이·현·목·이 / 업·아·예·제 정보전략·거버넌스 전략·ea ⭐⭐⭐ 기출빈출 기출 빈출 중요 isp(정보화전략계획) 는 조직의 중장기 비전·업무를 달성하기 위한 전사 정보화 청사진 을 수립하는 활동이며, ismp(정보시스템 마스터플랜) 는 isp 등에서 도출된 특정 목표 시스템 구축 사업의 발주·rfp 작성을 위해 요구사항·아키텍처·예산을 상세화하는 사전 기획 isp (information strategy planning) : 전사 관점, 환경 분석 → 현황(as-is) → 목표(to-be) → 이행계획(과제·예산·일정) 도출, bpr(업무재설계)·ea와 연계 ismp (information system master plan) : 특정 sw 구축 사업 관점, 업무·기능 요구사항 상세화 + 목표 시스템 아키텍처 + 기능점수(fp) 기반 적정 예산·기간 산정 → rfp(제안요청서) 직결 도입 배경 : isp만으로는 발주 시 요구사항이 모호해 잦은 과업 변경(scope creep) ·저가 수주·분쟁 발생 → 공공sw사업 제안요청서 상세화 제도화 연계 흐름 : isp (전사 과제 도출) → ismp (개별 사업 상세 설계·fp 예산 산정) → rfp 발주·구축 → 감리·ea 현행화 주의점 : ismp 수행 사업자의 본사업 참여 제한 여부(공정성·이해충돌 관리) 및 현업 요구사항 추적성 확보 1) 개념 비교 (isp vs ismp) 비교 isp (정보화전략계획) ismp (정보시스템 마스터플랜) 대상 범위 전사·부처 전체 (중장기 3~5년) 특정 단위 정보시스템 구축 사업 주요 목적 정보화 전략·투자 우선순위·로드맵 명확한 요구사항·적정 예산(fp)·rfp 핵심 산출물 as-is/to-be 모델·이행계획 상세 요구사항 정의서·목표 아키텍처·rfp 2) 상세 비교 (수립 절차·활용 관점) 구분 특징 설명 연계성 전략 → 발주 가교 isp에서 도출한 중점 과제를 ismp로 구체화해 발주 리스크 최소화 예산 산정 fp 기반 정밀 산정 ismp 단계에서 단위 프로세스(ilf·eif·ei·eo·eq) 식별해 기능점수(fp) 산출 기대 효과 과업 분쟁 예방 모호한 rfp로 인한 잦은 과업 변경·일정 지연 방지 및 sw 제값 받기 구현 두음: 이·현·목·이 (isp) / 업·아·예·제 (ismp) — isp(환경·현황·목표·이행) / ismp(업무상세·아키텍처·fp예산·제안요청서) \"isp는 전사 지도(what/why), ismp는 특정 사업 발주 설계도(how/rfp)!\""}, {"id": "ai-basic-act", "cat": "gov", "sub": "gov-ai", "parent": null, "t": "AI 기본법 · 고영향 AI", "s": "AI 진흥·신뢰 기 성<\/td><td>3대 기본원칙 + 10대 핵심요건<\/td><td>3대 가치 + 7대 원칙<\/td><\/tr><tr><td class=\"k\">특징<\/td><td>개발~활용 전 단계의 포괄적 요건<\/td><td>가치-원칙-주체별 역할 구조, 지속가능성 반영<\/td><\/tr><tr><td class=\"k\">성격<\/td><td>자율규범<\/td><td>자율규범(분야별 기준의 토대)<\/td><\/tr><\/tbody><\/table><\/div>\n<h4>2) 3대 관점으로 본 이행 체계<\/h4>\n<div class=\"tblwrap\"><table class=\"cmp\"><colgroup><col style=\"width:24%\"><col style=\"width:28%\"><col style=\"width:48%\"><\/colgroup><thead><tr><th>관점<\/th><th>특징<\/th><th>설명<\/th><\/tr><\/thead><tbody><tr><td class=\"k\">가치<\/td><td>존엄성·공공선·지속가능성<\/td><td>AI가 지향해야 할 근본 방향 — 2026 원칙은 인류의 지속가능성을 추가<\/td><\/tr><tr><td class=\"k\">원칙<\/td><td>7대 원칙<\/td><td>가치를 생애주기 전반에서 구현하기 위한 공통 실천 기준<\/td><\/tr><tr><td class=\"k\">주체<\/td><td>공급자·이용자·정부·사회<\/td><td>역할별 실천 사항 제시 — 영향력이 큰 주체에 상응하는 책임<\/td><\/tr><tr><td class=\"k\">이행<\/td><td>자율점검·정책 연계<\/td><td>윤리 자율점검표, AI 기본법·고영향 AI 의무와 연계<\/td><\/tr><\/tbody><\/table><\/div>\n<h4>3) 7대 원칙 실천 포인트<\/h4>\n<div class=\"tblwrap\"><table class=\"cmp\"><colgroup><col style=\"width:24%\"><col style=\"width:28%\"><col style=\"width:48%\"><\/colgroup><thead><tr><th>구분<\/th><th>키워드<\/th><th>설명<\/th><\/tr><\/thead><tbody><tr><td class=\"k\">인간중심성<\/td><td>지원·개입·의존 경계<\/td><td>AI는 판단을 지원하고, 필요 시 사람이 개입, 과도한 의존 경계<\/td><\/tr><tr><td class=\"k\">프라이버시 보호<\/td><td>목적 범위·자기결정권<\/td><td>목적에 한해 필요한 범위 처리, 감시 활용 금지, 정보주체 권리 보장<\/td><\/tr><tr><td class=\"k\">공정성·포용성<\/td><td>차별 방지·접근성<\/td><td>편향에 따른 부당 차별 방지, 취약계층 접근성·혜택 공유<\/td><\/tr><tr><td class=\"k\">책임성·안전성<\/td><td>책임 소재·위험 조치<\/td><td>역할·책임 명확화, 피해 구제, 위험 수준별 안전조치·오남용 대비<\/td><\/tr><tr><td class=\"k\">신뢰성·투명성<\/td><td>성능 기준·고지<\/td><td>최소 성능 기준 설정·점검, AI 활용 사실·수준·한계 고지<\/td><\/tr><\/tbody><\/table><\/div>", "rv": "<div class=\"q\"><b>두음(2020): 존·공·합 / 인·프·다·침·공·연·데·책·안·투<\/b> — 3대 기본원칙 / 10대 핵심요건<\/div>\n<div class=\"q\"><b>두음(2026): 존·공·지 / 인·프·공·책·안·신·투<\/b> — 3대 가치 / 7대 원칙<\/div>\n<div class=\"q\"><b>\"2020은 3원칙·10요건, 2026은 3가치·7원칙 — 둘 다 자율규범\"<\/b><\/div>", "img": "itpe-diagrams/128-kr-ai-ethic
