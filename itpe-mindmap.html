width:28%\"><col style=\"width:48%\"><\/colgroup><thead><tr><th>구분<\/th><th>가명정보 (Pseudonymized)<\/th><th>익명정보 (Anonymized)<\/th><\/tr><\/thead><tbody><tr><td class=\"k\">식별 가능성<\/td><td>추가 정보와 결합 시 개인 식별 가능<\/td><td>어떠한 수단으로도 개인 식별 불가능<\/td><\/tr><tr><td class=\"k\">법적 지위<\/td><td>개인정보보호법 적용 대상<\/td><td>개인정보 아님 (법 적용 제외)<\/td><\/tr><tr><td class=\"k\">활용·결합<\/td><td>통계·연구·공익 목적 동의 없이 활용(안전조치 필수)<\/td><td>목적 제한 없이 자유롭게 활용·제공 가능<\/td><\/tr><\/tbody><\/table><\/div>\n<p><b>2) 거버넌스 관점 구성표 (PIA)<\/b><\/p>\n<div class=\"tblwrap\"><table class=\"cmp\"><colgroup><col style=\"width:24%\"><col style=\"width:28%\"><col style=\"width:48%\"><\/colgroup><thead><tr><th>관점(측면)<\/th><th>특징<\/th><th>설명<\/th><\/tr><\/thead><tbody><tr><td class=\"k\">프로세스 관점<\/td><td>대·분·평·개 (사전 예방)<\/td><td>시스템 도입·변경 전(설계 단계)에 위험을 분석해 개선계획 반영<\/td><\/tr><tr><td class=\"k\">조직·책임 관점<\/td><td>CPO · 외부 평가기관<\/td><td>개인정보보호책임자(CPO) 주도 및 지정 평가기관의 객관적 검증<\/td><\/tr><tr><td class=\"k\">기술·보안 관점<\/td><td>비식별화 + 안전조치<\/td><td>k-익명성·l-다양성·t-근접성 적용, 추가정보 분리 보관 및 접근통제<\/td><\/tr><\/tbody><\/table><\/div>", "rv": "<div class=\"q\"><b>두음: 대·분·평·개 / 가(결합식별)·익(식별불가)<\/b> — 대(대상)·분(흐름분석)·평(위험평가)·개(개선계획)<\/div>\n<div class=\"q\"><b>PIA 사전 위험관리 + 가명(추가결합 가능·법적용) vs 익명(식별불가·법제외)<\/b>!<\/div>", "img": "itpe-diagrams/57-pia-pseudonym.webp", "txt": null, "search": "개인정보 영향평가(pia)와 가명·익명정보 pia · 가명/익명정보 대·분·평·개 / 결합식별 vs 불가 보안 보안 거버넌스·대응 ⭐⭐⭐ 기출빈출 기출 빈출 중요 개인정보 영향평가(pia) 는 개인정보를 활용하는 신규 시스템 구축·변경 전 침해 위험 요인을 사전 분석·개선하는 제도이며, 가명정보·익명정보 는 비식별 처리 수준에 따라 법적 규율과 활용 범위를 구분한 데이터 유형 pia 수행 4단계 (대·분·평·개) : 대상 확인(공공기관 의무·민간 권장) → 자료수집·흐름도 분석 → 침해위험도 평가 → 개선계획 수립·이행 가명정보 vs 익명정보 : 가명정보 : 추가 정보 결합 없이는 특정 개인 식별 불가 → 개인정보에 해당 (통계·과학적 연구·공익 목적 시 동의 없이 활용 가능, 결합전문기관 통해 결합) 익명정보 : 시간·비용·기술을 합리적으로 고려해도 더 이상 식별 불가 → 개인정보보호법 적용 제외 1) 개념 비교 (가명정보 vs 익명정보) 구분 가명정보 (pseudonymized) 익명정보 (anonymized) 식별 가능성 추가 정보와 결합 시 개인 식별 가능 어떠한 수단으로도 개인 식별 불가능 법적 지위 개인정보보호법 적용 대상 개인정보 아님 (법 적용 제외) 활용·결합 통계·연구·공익 목적 동의 없이 활용(안전조치 필수) 목적 제한 없이 자유롭게 활용·제공 가능 2) 거버넌스 관점 구성표 (pia) 관점(측면) 특징 설명 프로세스 관점 대·분·평·개 (사전 예방) 시스템 도입·변경 전(설계 단계)에 위험을 분석해 개선계획 반영 조직·책임 관점 cpo · 외부 평가기관 개인정보보호책임자(cpo) 주도 및 지정 평가기관의 객관적 검증 기술·보안 관점 비식별화 + 안전조치 k-익명성·l-다양성·t-근접성 적용, 추가정보 분리 보관 및 접근통제 두음: 대·분·평·개 / 가(결합식별)·익(식별불가) — 대(대상)·분(흐름분석)·평(위험평가)·개(개선계획) pia 사전 위험관리 + 가명(추가결합 가능·법적용) vs 익명(식별불가·법제외) !"}, {"id": "forensics", "cat": "sec", "sub": "sec-gov", "parent": null, "t": "디지털 포렌식 5원칙", "s": "정·재·신·연·무 / Hash·WriteBlocker", "stars": 3, "redStar": false, "full": "디지털 포렌식 5대 원칙과 연계보관성", "catLabel": "보안", "st": "📌 복습 필요", "d": "2026-11-21", "def": "<p>디지털 기기에 저장·전송되는 전자적 데이터를 과학적·법적 절차에 따라 수집·보존·분석해 <b>법정에서 증거 능력(Admissibility)을 인정받도록 하는 수사·감사 기법<\/b><\/p>", "kw": "<ul class=\"kw\"><li><b>디지털 포렌식 5대 원칙 (정·재·신·연·무)<\/b>:<ul class=\"kw\"><li><b>정당성<\/b>: 영장·동의 등 적법 절차 준수(위법수집증거 배제)<\/li><li><b>재현성<\/b>: 같은 조건·도구로 재분석 시 항상 동일 결과 도출<\/li><li><b>신속성<\/b>: 휘발성 높은 데이터(메모리·네트워크 세션) 우선 수집 (Order of Volatility)<\/li><li><b>연계보관성 (Chain of Custody)<\/b>: 수집→이송→분석→보관 전 과정의 담당자·일시·장소 기록<\/li><li><b>무결성<\/b>: 원본 훼손 방지(<b>Write Blocker<\/b>) + 사본 이미징 후 <b>해시(SHA-256)<\/b> 비교 검증<\/li><\/ul><\/li><\/ul>", "pp": "<div class=\"tblwrap\"><table class=\"cmp\"><colgroup><col style=\"width:24%\"><col style=\"width:28%\"><col style=\"width:48%\"><\/colgroup><thead><tr><th>관점(측면)<\/th><th>특징<\/th><th>설명<\/th><\/tr><\/thead><tbody><tr><td class=\"k\">법적·절차 관점<\/td><td>정당성 · 연계보관성<\/td><td>적법한 압수수색과 Chain of Custody 문서화로 법적 증거능력 확보<\/td><\/tr><tr><td class=\"k\">기술·무결성 관점<\/td><td>Write Blocker · Hash<\/td><td>물리/SW 쓰기 방지 장치로 원본 보호 및 SHA-256 해시값 일치 검증<\/td><\/tr><tr><td class=\"k\">수집 우선순위 관점<\/td><td>신속성 (휘발성 순서)<\/td><td>레지스트리·RAM·네트워크 → 디스크 → 백업 순으로 휘발성 높은 것부터 수집<\/td><\/tr><tr><td class=\"k\">클라우드·대응<\/td><td>SOAR · 라이브 포렌식<\/td><td>클라우드 휘발성 컨테이너 대응 및 SOAR와 연계한 자동 증거 보전<\/td><\/tr><\/tbody><\/table><\/div>", "rv": "<div class=\"q\"><b>두음: 정·재·신·연·무<\/b> — 정(정당성)·재(재현성)·신(신속성)·연(연계보관성)·무(무결성)<\/div>\n<div class=\"q\"><b>5대 원칙 + Write Blocker/SHA-256(무결성) + Chain of Custody(연계보관성)<\/b>!<\/div>", "img": "itpe-diagrams/59-digital-forensics.webp", "txt": null, "search": "디지털 포렌식 5대 원칙과 연계보관성 디지털 포렌식 5원칙 정·재·신·연·무 / hash·writeblocker 보안 보안 거버넌스·대응 ⭐⭐⭐ 기출빈출 기출 빈출 중요 디지털 기기에 저장·전송되는 전자적 데이터를 과학적·법적 절차에 따라 수집·보존·분석해 법정에서 증거 능력(admissibility)을 인정받도록 하는 수사·감사 기법 디지털 포렌식 5대 원칙 (정·재·신·연·무) : 정당성 : 영장·동의 등 적법 절차 준수(위법수집증거 배제) 재현성 : 같은 조건·도구로 재분석 시 항상 동일 결과 도출 신속성 : 휘발성 높은 데이터(메모리·네트워크 세션) 우선 수집 (order of volatility) 연계보관성 (chain of custody) : 수집→이송→분석→보관 전 과정의 담당자·일시·장소 기록 무결성 : 원본 훼손 방지( write blocker ) + 사본 이미징 후 해시(sha-256) 비교 검증 관점(측면) 특징 설명 법적·절차 관점 정당성 · 연계보관성 적법한 압수수색과 chain of custody 문서화로 법적 증거능력 확보 기술·무결성 관점 write blocker · hash 물리/sw 쓰기 방지 장치로 원본 보호 및 sha-256 해시값 일치 검증 수집 우선순위 관점 신속성 (휘발성 순서) 레지스트리·ram·네트워크 → 디스크 → 백업 순으로 휘발성 높은 것부터 수집 클라우드·대응 soar · 라이브 포렌식 클라우드 휘발성 컨테이너 대응 및 soar와 연계한 자동 증거 보전 두음: 정·재·신·연·무 — 정(정당성)·재(재현성)·신(신속성)·연(연계보관성)·무(무결성) 5대 원칙 + write blocker/sha-256(무결성) + chain of custody(연계보관성) !"}, {"id": "soar", "cat": "sec", "sub": "sec-gov", "parent": null, "t": "SOAR", "s": "Playbook 기반 보안 자동 대응", "stars": 2, "redStar": false, "full": "SOAR (보안 오케스트레이션·자동화 및 대응)", "catLabel": "보안", "st": "📌 복습 필요", "d": "2026-11-21", "def": "<p>다양한 보안 솔루션의 위협 정보를 통합 연동(<b>Orchestration<\/b>)하고, 사전 정의된 대응 시나리오(<b>Playbook<\/b>)에 따라 위협 분석과 차단 조치를 <b>자동화(Automation &amp; Response)<\/b>하는 차세대 보안 관제 플랫폼<\/p>", "kw": "<ul class=\"kw\"><li><b>등장 배경<\/b>: 기존 SIEM의 로그 수집·탐지 중심 구조로 인한 <b>경보 피로(Alert Fatigue)<\/b>와 보안 인력의 수동 대응 한계(MTTR 증가) 해결<\/li><li><b>3대 핵심 기능<\/b>:<ul class=\"kw\"><li><b>Orchestration<\/b>: SIEM·방화벽·EDR·TI·티켓 시스템을 API로 통합 연결<\/li><li><b>Automation<\/b>: Playbook 기반 반복 분석·평판 조회·오탐 판별 자동 실행<\/li><li><b>Response<\/b>: 악성 IP 차단·단말 격리·사고 티켓 발행 및 사후 보고<\/li><\/ul><\/li><\/ul>", "pp": "<div class=\"tblwrap\"><table class=\"cmp\"><colgroup><col style=\"width:24%\"><col style=\"width:28%\"><col style=\"width:48%\"><\/colgroup><thead><tr><th>관점(측면)<\/th><th>특징<\/th><th>설명<\/th><\/tr><\/thead><tbody><tr><td class=\"k\">프로세스 관점<\/td><td>Playbook 표준화<\/td><td>탐지→분석→판단→대응 절차를 코드화된 워크플로로 정형화<\/td><\/tr><tr><td class=\"k\">기술·연동 관점<\/td><td>API 오케스트레이션<\/td><td>SIEM·EDR·방화벽·위협인텔리전스(TI) 등 이기종 보안 장비 통합 제어<\/td><\/tr><tr><td class=\"k\">운영·조직 관점<\/td><td>MTTR 단축 · 관제 고도화<\/td><td>단순·반복 경보는 자동 처리하고 관제 인력은 고위험 위협 분석에 집중<\/td><\/tr><tr><td class=\"k\">도입·주의 관점<\/td><td>오탐 자동 차단 리스크<\/td><td>잘못된 Playbook 자동 실행 시 정상 서비스 차단 위험 → 단계적 자동화 필요<\/td><\/tr><\/tbody><\/table><\/div>", "rv": "<div class=\"q\"><b>두음: 오·자·대<\/b> — 오(Orchestration)·자(Automation)·대(Response) — Playbook·MTTR 단축<\/div>\n<div class=\"q\"><b>SIEM 경보 피로 한계 → Playbook 기반 O·A·R 자동화 → MTTR 단축<\/b>!<\/div>", "img": "itpe-diagrams/41-soar.webp", "txt": null, "search": "soar (보안 오케스트레이션·자동화 및 대응) soar playbook 기반 보안 자동 대응 보안 보안 거버넌스·대응 ⭐⭐ 기출빈출 기출 빈출 중요 다양한 보안 솔루션의 위협 정보를 통합 연동( orchestration )하고, 사전 정의된 대응 시나리오( playbook )에 따라 위협 분석과 차단 조치를 자동화(automation &amp; response) 하는 차세대 보안 관제 플랫폼 등장 배경 : 기존 siem의 로그 수집·탐지 중심 구조로 인한 경보 피로(alert fatigue) 와 보안 인력의 수동 대응 한계(mttr 증가) 해결 3대 핵심 기능 : orchestration : siem·방화벽·edr·ti·티켓 시스템을 api로 통합 연결 automation : playbook 기반 반복 분석·평판 조회·오탐 판별 자동 실행 response : 악성 ip 차단·단말 격리·사고 티켓 발행 및 사후 보고 관점(측면) 특징 설명 프로세스 관점 playbook 표준화 탐지→분석→판단→대응 절차를 코드화된 워크플로로 정형화 기술·연동 관점 api 오케스트레이션 siem·edr·방화벽·위협인텔리전스(ti) 등 이기종 보안 장비 통합 제어 운영·조직 관점 mttr 단축 · 관제 고도화 단순·반복 경보는 자동 처리하고 관제 인력은 고위험 위협 분석에 집중 도입·주의 관점 오탐 자동 차단 리스크 잘못된 playbook 자동 실행 시 정상 서비스 차단 위험 → 단계적 자동화 필요 두음: 오·자·대 — 오(orchestration)·자(automation)·대(response) — playbook·mttr 단축 siem 경보 피로 한계 → playbook 기반 o·a·r 자동화 → mttr 단축 !"}, {"id": "xdr-siem-soar", "cat": "sec", "sub": "sec-gov", "parent": null, "t": "XDR · SIEM · SOAR", "s": "엔·네·클·아 / 시·소·엑", "stars": 3, "redStar": false, "full": "XDR(확장 탐지 및 대응) · SIEM · SOAR", "catLabel": "보안", "st": "📌 복습 필요", "d": "2026-11-24", "def": "<p><b>XDR(Extended Detection and Response)<\/b>은 엔드포인트(EDR)·네트워크(NDR)·클라우드·아이덴티티 등 다중 보안 계층의 <b>텔레메트리를 단일 플랫폼으로 통합<\/b>해 상관분석·탐지하고, <b>자동 격리·대응까지 수행<\/b>하는 통합 보안 운영 체계<\/p>", "kw": "<ul class=\"kw\"><li><b>등장 배경<\/b>: 개별 솔루션(EDR·NDR·방화벽) 사일로로 인한 <b>경보 피로(Alert Fatigue)<\/b>와 <b>공격 연쇄 추적 한계<\/b> 극복<\/li><li><b>SIEM (Security Information &amp; Event Management)<\/b>: 이기종 <b>로그 수집·정규화·룰 기반 상관분석<\/b> 및 장기 보관(컴플라이언스 감사 중심)<\/li><li><b>SOAR (Security Orchestration, Automation &amp; Response)<\/b>: <b>Playbook<\/b> 기반 워크플로우 자동화·외부 보안 도구 연동 오케스트레이션<\/li><li><b>XDR 핵심 기능<\/b>: 네이티브 <b>멀티 도메인 텔레메트리 통합<\/b>(프로세스·패킷·API·계정), AI 기반 <b>킬체인 컨텍스트화<\/b>, 엔드포인트 격리·계정 차단 등 <b>즉시 자동 대응<\/b><\/li><li><b>연계 방안<\/b>: <b>Open XDR<\/b>(기존 SIEM·SOAR·타사 EDR 연동) vs <b>Native XDR<\/b>(단일 벤더) — SIEM이 감사·아카이브, XDR이 정밀 탐지, SOAR가 전사 프로세스 자동화를 분담<\/li><\/ul>", "pp": "<h4>1) 개념 비교 (SIEM vs SOAR vs XDR)<\/h4>\n<div class=\"tblwrap\"><table class=\"cmp\"><thead><tr><th>비교<\/th><th>SIEM<\/th><th>SOAR<\/th><th>XDR<\/th><\/tr><\/thead><tbody><tr><td class=\"k\">핵심 역할<\/td><td>로그 수집·상관분석·감사<\/td><td>Playbook 기반 대응 자동화<\/td><td>다계층 텔레메트리 탐지·자동 격리<\/td><\/tr><tr><td class=\"k\">주요 입력<\/td><td>이기종 시스템·보안 로그<\/td><td>SIEM/XDR 경보·TI 피드<\/td><td>EDR·NDR·클라우드·ID 텔레메트리<\/td><\/tr><tr><td class=\"k\">한계·보완<\/td><td>오탐·수동 대응 부담<\/td><td>탐지 엔진 부재(연동 의존)<\/td><td>벤더 종속성(Open XDR로 보완)<\/td><\/tr><\/tbody><\/table><\/div>\n<h4>2) 상세 비교 (아키텍처·운영 관점)<\/h4>\n<div class=\"tblwrap\"><table class=\"cmp\"><colgroup><col style=\"width:24%\"><col style=\"width:28%\"><col style=\"width:48%\"><\/colgroup><thead><tr><th>구분<\/th><th>특징<\/th><th>설명<\/th><\/tr><\/thead><tbody><tr><td class=\"k\">데이터<\/td><td>로그 vs 텔레메트리<\/td><td>SIEM은 텍스트 로그 중심, XDR은 프로세스·네트워크·행위 텔레메트리 직접 수집<\/td><\/tr><tr><td class=\"k\">대응 속도<\/td><td>MTTR 단축<\/td><td>XDR 내장 격리 + SOAR 전사 워크플로우 연계로 평균 대응 시간(MTTR) 최소화<\/td><\/tr><tr><td class=\"k\">도입 전략<\/td><td>Open vs Native XDR<\/td><td>다기종 레거시 환경은 Open XDR로 기존 SIEM·SOAR와 통합 연계<\/td><\/tr><\/tbody><\/table><\/div>", "rv": "<div class=\"q\"><b>두음: 엔·네·클·아 / 시·소·엑<\/b> — 엔드포인트(EDR)·네트워크(NDR)·클라우드·아이덴티티 / SIEM(로그)·SOAR(자동화)·XDR(통합 탐지·격리)<\/div>\n<div class=\"q\"><b>\"SIEM은 모으고, SOAR는 엮고, XDR은 꿰뚫어 바로 막는다!\"<\/b><\/div>", "img": "itpe-diagrams/113-xdr-siem-soar.webp", "txt": null, "search": "xdr(확장 탐지 및 대응) · siem · soar xdr · siem · soar 엔·네·클·아 / 시·소·엑 보안 보안 거버넌스·대응 ⭐⭐⭐ 기출빈출 기출 빈출 중요 xdr(extended detection and response) 은 엔드포인트(edr)·네트워크(ndr)·클라우드·아이덴티티 등 다중 보안 계층의 텔레메트리를 단일 플랫폼으로 통합 해 상관분석·탐지하고, 자동 격리·대응까지 수행 하는 통합 보안 운영 체계 등장 배경 : 개별 솔루션(edr·ndr·방화벽) 사일로로 인한 경보 피로(alert fatigue) 와 공격 연쇄 추적 한계 극복 siem (security information &amp; event management) : 이기종 로그 수집·정규화·룰 기반 상관분석 및 장기 보관(컴플라이언스 감사 중심) soar (security orchestration, automation &amp; response) : playbook 기반 워크플로우 자동화·외부 보안 도구 연동 오케스트레이션 xdr 핵심 기능 : 네이티브 멀티 도메인 텔레메트리 통합 (프로세스·패킷·api·계정), ai 기반 킬체인 컨텍스트화 , 엔드포인트 격리·계정 차단 등 즉시 자동 대응 연계 방안 : open xdr (기존 siem·soar·타사 edr 연동) vs native xdr (단일 벤더) — siem이 감사·아카이브, xdr이 정밀 탐지, soar가 전사 프로세스 자동화를 분담 1) 개념 비교 (siem vs soar vs xdr) 비교 siem soar xdr 핵심 역할 로그 수집·상관분석·감사 playbook 기반 대응 자동화 다계층 텔레메트리 탐지·자동 격리 주요 입력 이기종 시스템·보안 로그 siem/xdr 경보·ti 피드 edr·ndr·클라우드·id 텔레메트리 한계·보완 오탐·수동 대응 부담 탐지 엔진 부재(연동 의존) 벤더 종속성(open xdr로 보완) 2) 상세 비교 (아키텍처·운영 관점) 구분 특징 설명 데이터 로그 vs 텔레메트리 siem은 텍스트 로그 중심, xdr은 프로세스·네트워크·행위 텔레메트리 직접 수집 대응 속도 mttr 단축 xdr 내장 격리 + soar 전사 워크플로우 연계로 평균 대응 시간(mttr) 최소화 도입 전략 open vs native xdr 다기종 레거시 환경은 open xdr로 기존 siem·soar와 통합 연계 두음: 엔·네·클·아 / 시·소·엑 — 엔드포인트(edr)·네트워크(ndr)·클라우드·아이덴티티 / siem(로그)·soar(자동화)·xdr(통합 탐지·격리) \"siem은 모으고, soar는 엮고, xdr은 꿰뚫어 바로 막는다!\""}, {"id": "ctem-asm", "cat": "sec", "sub": "sec-gov", "parent": null, "t": "CTEM · ASM", "s": "범·발·우·검·동 / EASM·CAASM·BAS", "stars": 3, "redStar": false, "full": "CTEM(지속적 위협 노출 관리) · ASM(공격표면관리)", "catLabel": "보안", "st": "📌 복습 필요", "d": "2026-11-25", "def": "<p><b>CTEM(Continuous Threat Exposure Management)<\/b>은 조직의 디지털 자산에 대한 위협 노출을 <b>지속적으로 식별·우선순위화·검증·대응<\/b>하는 순환형 보안 거버넌스 프레임워크이며, <b>ASM(Attack Surface Management)<\/b>은 공격자 관점에서 외부(<b>EASM<\/b>)·내부/클라우드(<b>CAASM<\/b>) 자산을 상시 탐지해 비인가·방치(<b>Shadow IT<\/b>) 공격 표면을 가시화하는 핵심 기술<\/p>", "kw": "<ul class=\"kw\"><li><b>CTEM 5단계 순환<\/b>: <b>Scoping(범위 식별)<\/b> → <b>Discovery(노출 발견)<\/b> → <b>Prioritization(우선순위화)<\/b> → <b>Validation(검증)<\/b> → <b>Mobilization(대응·동원)<\/b><\/li><li><b>ASM 2대 축<\/b>: <b>EASM<\/b>(External ASM, 인터넷 노출 도메인·IP·인증서·API 탐지) + <b>CAASM<\/b>(Cyber Asset ASM, 내부·클라우드·사내 API 통합 자산 가시화)<\/li><li><b>RBVM · EPSS<\/b>: 단순 CVSS 점수 나열이 아니라 공격 경로(Attack Path)·자산 중요도·실제 악용 확률(EPSS) 기반 우선순위화<\/li><li><b>BAS (Breach &amp; Attack Simulation)<\/b>: 검증(Validation) 단계에서 자동 침해 시뮬레이션으로 실제 방어 우회 여부 검증 및 오탐 제거<\/li><li><b>Mobilization 연계<\/b>: SOAR·티켓 시스템(Jira)·패치 자동화 워크플로우 연계로 보안팀–인프라팀 협업 대응<\/li><\/ul>", "pp": "<h4>1) CTEM 5단계 프로세스<\/h4>\n<div class=\"tblwrap\"><table class=\"cmp\"><colgroup><col style=\"width:24%\"><col style=\"width:28%\"><col style=\"width:48%\"><\/colgroup><thead><tr><th>구분<\/th><th>키워드<\/th><th>설명<\/th><\/tr><\/thead><tbody><tr><td class=\"k\">1. 범위 식별 (Scoping)<\/td><td>중요 자산 · 공격 대상<\/td><td>비즈니스 핵심 자산·클라우드·외부 접점 등 보호 범위 정의<\/td><\/tr><tr><td class=\"k\">2. 노출 발견 (Discovery)<\/td><td>ASM(EASM·CAASM) · Shadow IT<\/td><td>공격자 시각으로 미관리 자산·오픈 포트·취약점 상시 탐지<\/td><\/tr><tr><td class=\"k\">3. 우선순위화 (Prioritization)<\/td><td>RBVM · 공격 경로 · EPSS<\/td><td>단순 CVSS 점수가 아닌 실제 악용 가능성·자산 중요도 기준 선별<\/td><\/tr><tr><td class=\"k\">4. 검증 (Validation)<\/td><td>BAS · 모의침투 · 공격 시뮬레이션<\/td><td>실제 침투 경로가 통하는지 자동 검증해 오탐 제거<\/td><\/tr><tr><td class=\"k\">5. 대응·동원 (Mobilization)<\/td><td>패치 · SOAR · 티켓 자동화<\/td><td>보안팀·IT운영팀 간 워크플로우 연계로 신속한 조치 및 환류<\/td><\/tr><\/tbody><\/table><\/div>\n<h4>2) 도입·운영 시 고려사항<\/h4>\n<div class=\"tblwrap\"><table class=\"cmp\"><colgroup><col style=\"width:24%\"><col style=\"width:28%\"><col style=\"width:48%\"><\/colgroup><thead><tr><th>구분<\/th><th>키워드<\/th><th>설명<\/th><\/tr><\/thead><tbody><tr><td class=\"k\">조직·거버넌스<\/td><td>협업 체계 · R&amp;R 명확화<\/td><td>보안팀(발견·검증)과 인프라·개발팀(패치·조치) 간 SLA 기반 대응<\/td><\/tr><tr><td class=\"k\">도구·연계<\/td><td>SIEM·SOAR·티켓 연동<\/td><td>EASM·CAASM·BAS 결과를 단일 대시보드로 통합해 피로도 완화<\/td><\/tr><tr><td class=\"k\">지속성·성숙도<\/td><td>반복 순환 · 제로 트러스트<\/td><td>1회성 점검이 아닌 상시 순환 체계로 운영하며 미시적 경계 강화<\/td><\/tr><\/tbody><\/table><\/div>", "rv": "<div class=\"q\"><b>두음: 범·발·우·검·동<\/b> — Scoping(범위) · Discovery(발견) · Prioritization(우선순위) · Validation(검증) · Mobilization(대응)<\/div>\n<div class=\"q\"><b>\"ASM으로 찾고(Discovery), BAS로 뚫어보고(Validation), SOAR로 막는다(Mobilization)!\"<\/b><\/div>", "img": "itpe-diagrams/116-ctem-asm.webp", "txt": null, "search": "ctem(지속적 위협 노출 관리) · asm(공격표면관리) ctem · asm 범·발·우·검·동 / easm·caasm·bas 보안 보안 거버넌스·대응 ⭐⭐⭐ 기출빈출 기출 빈출 중요 ctem(continuous threat exposure management) 은 조직의 디지털 자산에 대한 위협 노출을 지속적으로 식별·우선순위화·검증·대응 하는 순환형 보안 거버넌스 프레임워크이며, asm(attack surface management) 은 공격자 관점에서 외부( easm )·내부/클라우드( caasm ) 자산을 상시 탐지해 비인가·방치( shadow it ) 공격 표면을 가시화하는 핵심 기술 ctem 5단계 순환 : scoping(범위 식별) → discovery(노출 발견) → prioritization(우선순위화) → validation(검증) → mobilization(대응·동원) asm 2대 축 : easm (external asm, 인터넷 노출 도메인·ip·인증서·api 탐지) + caasm (cyber asset asm, 내부·클라우드·사내 api 통합 자산 가시화) rbvm · epss : 단순 cvss 점수 나열이 아니라 공격 경로(attack path)·자산 중요도·실제 악용 확률(epss) 기반 우선순위화 bas (breach &amp; attack simulation) : 검증(validation) 단계에서 자동 침해 시뮬레이션으로 실제 방어 우회 여부 검증 및 오탐 제거 mobilization 연계 : soar·티켓 시스템(jira)·패치 자동화 워크플로우 연계로 보안팀–인프라팀 협업 대응 1) ctem 5단계 프로세스 구분 키워드 설명 1. 범위 식별 (scoping) 중요 자산 · 공격 대상 비즈니스 핵심 자산·클라우드·외부 접점 등 보호 범위 정의 2. 노출 발견 (discovery) asm(easm·caasm) · shadow it 공격자 시각으로 미관리 자산·오픈 포트·취약점 상시 탐지 3. 우선순위화 (prioritization) rbvm · 공격 경로 · epss 단순 cvss 점수가 아닌 실제 악용 가능성·자산 중요도 기준 선별 4. 검증 (validation) bas · 모의침투 · 공격 시뮬레이션 실제 침투 경로가 통하는지 자동 검증해 오탐 제거 5. 대응·동원 (mobilization) 패치 · soar · 티켓 자동화 보안팀·it운영팀 간 워크플로우 연계로 신속한 조치 및 환류 2) 도입·운영 시 고려사항 구분 키워드 설명 조직·거버넌스 협업 체계 · r&amp;r 명확화 보안팀(발견·검증)과 인프라·개발팀(패치·조치) 간 sla 기반 대응 도구·연계 siem·soar·티켓 연동 easm·caasm·bas 결과를 단일 대시보드로 통합해 피로도 완화 지속성·성숙도 반복 순환 · 제로 트러스트 1회성 점검이 아닌 상시 순환 체계로 운영하며 미시적 경계 강화 두음: 범·발·우·검·동 — scoping(범위) · discovery(발견) · prioritization(우선순위) · validation(검증) · mobilization(대응) \"asm으로 찾고(discovery), bas로 뚫어보고(validation), soar로 막는다(mobilization)!\""}, {"id": "autonomous-pentest", "cat": "sec", "sub": "sec-gov", "parent": null, "t": "AI 자율 침투테스트", "s": "정찰·익스플로잇·CTEM", "stars": 1, "redStar": false, "full": "AI 자율 기반 침투테스트 (Autonomous AI Penetration Testing)", "catLabel": "보안", "st": "📌 복습 필요", "d": "2026-11-25", "def": "<p><b>AI 자율 기반 침투테스트<\/b>는 LLM·에이전트가 <b>정찰 → 취약점 탐색 → 익스플로잇 → 보고<\/b>의 침투테스트 과정을 스스로 계획·수행하는 보안 검증 방식이다. 스캐너·Metasploit·Burp 같은 <b>도구를 호출<\/b>하고 결과를 해석해 공격 경로를 이어가며, <b>BAS(Breach and Attack Simulation)<\/b>·<b>CTEM<\/b>과 연계해 상시·반복 검증하는 <b>자동화된 보안 검증 방식<\/b>.<\/p>", "kw": "<ul class=\"kw\"><li><b>자율 에이전트<\/b>: 정찰(OSINT·자산 스캔) → 취약점 탐색 → <b>익스플로잇 체이닝<\/b> → 보고서 작성<\/li><li><b>도구 사용(Tool Use)<\/b>: Nmap·Nuclei·Metasploit·Burp API를 에이전트가 선택·실행, <b>MCP<\/b>로 도구 결합<\/li><li><b>BAS<\/b>: 실제 피해 없이 공격 시나리오를 시뮬레이션해 탐지·대응 체계를 검증<\/li><li><b>CTEM<\/b>: 범위 설정 → 발견 → 우선순위 → <b>검증<\/b> → 동원 — 자율 침투테스트가 \"검증\" 단계를 자동화<\/li><li><b>안전 통제<\/b>: 권한 범위(Scope)·화이트리스트·<b>샌드박스<\/b>·승인 게이트·<b>킬 스위치<\/b>·전체 감사 로그<\/li><li><b>위험<\/b>: 오폭(운영 시스템 영향)·법적 책임·프롬프트 인젝션으로 <b>통제 우회<\/b>·모델 오판(환각)<\/li><li><b>산출물<\/b>: 검증된 취약점·재현 절차·PoC·패치 우선순위·경영진 요약<\/li><li><b>역할<\/b>: 반복 검증은 자동화, 창의적 공격 시나리오·최종 판단은 인간 전문가<\/li><\/ul>", "pp": "<h4>1) 수동 침투테스트 vs AI 자율 침투테스트 (비교모듈: 목·대·방·키·성·위)<\/h4>\n<div class=\"tblwrap\"><table class=\"cmp\"><colgroup><col style=\"width:24%\"><col style=\"width:28%\"><col style=\"width:48%\"><\/colgroup><thead><tr><th>구분<\/th><th>수동(전문가) 침투테스트<\/th><th>AI 자율 침투테스트<\/th><\/tr><\/thead><tbody><tr><td class=\"k\">보안목적<\/td><td>고난도 창의적 공격·규제 증적 확보<\/td><td>상시·대량 반복 검증<\/td><\/tr><tr><td class=\"k\">보호대상<\/td><td>핵심 자산·신규 시스템<\/td><td>광범위 자산·클라우드·API<\/td><\/tr><tr><td class=\"k\">인증·공격방식<\/td><td>전문가 경험 기반 수동 체이닝<\/td><td>LLM 계획 + 도구 호출 + 자동 체이닝<\/td><\/tr><tr><td class=\"k\">키·권한관리<\/td><td>계약 범위·일정, 인간 판단<\/td><td>에이전트 권한 범위·승인 게이트 필수<\/td><\/tr><tr><td class=\"k\">성능·부하<\/td><td>고비용·저빈도(연 1~2회)<\/td><td>저비용·고빈도(지속)<\/td><\/tr><tr><td class=\"k\">위협·대응(리스크)<\/td><td>인력 의존·일정 지연<\/td><td>오폭·통제 우회·법적 책임 → 샌드박스·감사·킬 스위치<\/td><\/tr><\/tbody><\/table><\/div>\n<h4>2) 자율 침투테스트 4단계<\/h4>\n<div class=\"tblwrap\"><table class=\"cmp\"><colgroup><col style=\"width:24%\"><col style=\"width:28%\"><col style=\"width:48%\"><\/colgroup><thead><tr><th>단계<\/th><th>에이전트 활동<\/th><th>대표 도구·산출물<\/th><\/tr><\/thead><tbody><tr><td class=\"k\">정찰<\/td><td>자산·서브도메인·기술 스택 수집<\/td><td>OSINT·Nmap·Shodan → 자산 목록<\/td><\/tr><tr><td class=\"k\">탐색<\/td><td>취약점 스캔·설정 오류 확인<\/td><td>Nuclei·OpenVAS·Burp → 후보 취약점<\/td><\/tr><tr><td class=\"k\">익스플로잇<\/td><td>공격 경로 연결·권한 상승 시도<\/td><td>Metasploit·커스텀 PoC → 검증된 취약점<\/td><\/tr><tr><td class=\"k\">보고<\/td><td>재현 절차·영향·패치 우선순위 정리<\/td><td>리포트·티켓 연동(Jira)<\/td><\/tr><\/tbody><\/table><\/div>\n<h4>3) 안전 통제·거버넌스<\/h4>\n<div class=\"tblwrap\"><table class=\"cmp\"><colgroup><col style=\"width:24%\"><col style=\"width:28%\"><col style=\"width:48%\"><\/colgroup><thead><tr><th>구분<\/th><th>키워드<\/th><th>설명<\/th><\/tr><\/thead><tbody><tr><td class=\"k\">범위<\/td><td>Scope 정의<\/td><td>도메인·IP·시간·제외 대상 화이트리스트, 계약서에 명시<\/td><\/tr><tr><td class=\"k\">격리<\/td><td>샌드박스<\/td><td>운영망과 분리된 복제 환경에서 먼저 검증<\/td><\/tr><tr><td class=\"k\">승인<\/td><td>Human-in-the-Loop<\/td><td>파괴적 단계(쓰기·익스플로잇) 전 승인 게이트<\/td><\/tr><tr><td class=\"k\">중단<\/td><td>킬 스위치<\/td><td>이상 징후·서비스 영향 감지 시 즉시 중단<\/td><\/tr><tr><td class=\"k\">기록<\/td><td>감사·법적<\/td><td>모든 명령·결과 로그 보존, 권한 남용·오폭 대비<\/td><\/tr><tr><td class=\"k\">신뢰<\/td><td>프롬프트 보안<\/td><td>대상 시스템의 인젝션으로 에이전트 탈취 방지(도구 권한 최소화)<\/td><\/tr><\/tbody><\/table><\/div>", "rv": "<div class=\"q\"><b>두음: 정·탐·익·보 — 정찰·탐색·익스플로잇·보고 / 범·샌·승·킬 — 범위·샌드박스·승인·킬 스위치<\/b><\/div>\n<div class=\"q\"><b>\"자동화가 빨라질수록 통제가 먼저 — 범위·샌드박스·승인·로그 없이는 자율 침투테스트가 사고가 된다\"<\/b><\/div>", "img": "itpe-diagrams/146-autonomous-pentest.webp", "txt": null, "search": "ai 자율 기반 침투테스트 (autonomous ai penetration testing) ai 자율 침투테스트 정찰·익스플로잇·ctem 보안 보안 거버넌스·대응 ⭐ 기출빈출 기출 빈출 중요 ai 자율 기반 침투테스트 는 llm·에이전트가 정찰 → 취약점 탐색 → 익스플로잇 → 보고 의 침투테스트 과정을 스스로 계획·수행하는 보안 검증 방식이다. 스캐너·metasploit·burp 같은 도구를 호출 하고 결과를 해석해 공격 경로를 이어가며, bas(breach and attack simulation) · ctem 과 연계해 상시·반복 검증하는 자동화된 보안 검증 방식 . 자율 에이전트 : 정찰(osint·자산 스캔) → 취약점 탐색 → 익스플로잇 체이닝 → 보고서 작성 도구 사용(tool use) : nmap·nuclei·metasploit·burp api를 에이전트가 선택·실행, mcp 로 도구 결합 bas : 실제 피해 없이 공격 시나리오를 시뮬레이션해 탐지·대응 체계를 검증 ctem : 범위 설정 → 발견 → 우선순위 → 검증 → 동원 — 자율 침투테스트가 \"검증\" 단계를 자동화 안전 통제 : 권한 범위(scope)·화이트리스트· 샌드박스 ·승인 게이트· 킬 스위치 ·전체 감사 로그 위험 : 오폭(운영 시스템 영향)·법적 책임·프롬프트 인젝션으로 통제 우회 ·모델 오판(환각) 산출물 : 검증된 취약점·재현 절차·poc·패치 우선순위·경영진 요약 역할 : 반복 검증은 자동화, 창의적 공격 시나리오·최종 판단은 인간 전문가 1) 수동 침투테스트 vs ai 자율 침투테스트 (비교모듈: 목·대·방·키·성·위) 구분 수동(전문가) 침투테스트 ai 자율 침투테스트 보안목적 고난도 창의적 공격·규제 증적 확보 상시·대량 반복 검증 보호대상 핵심 자산·신규 시스템 광범위 자산·클라우드·api 인증·공격방식 전문가 경험 기반 수동 체이닝 llm 계획 + 도구 호출 + 자동 체이닝 키·권한관리 계약 범위·일정, 인간 판단 에이전트 권한 범위·승인 게이트 필수 성능·부하 고비용·저빈도(연 1~2회) 저비용·고빈도(지속) 위협·대응(리스크) 인력 의존·일정 지연 오폭·통제 우회·법적 책임 → 샌드박스·감사·킬 스위치 2) 자율 침투테스트 4단계 단계 에이전트 활동 대표 도구·산출물 정찰 자산·서브도메인·기술 스택 수집 osint·nmap·shodan → 자산 목록 탐색 취약점 스캔·설정 오류 확인 nuclei·openvas·burp → 후보 취약점 익스플로잇 공격 경로 연결·권한 상승 시도 metasploit·커스텀 poc → 검증된 취약점 보고 재현 절차·영향·패치 우선순위 정리 리포트·티켓 연동(jira) 3) 안전 통제·거버넌스 구분 키워드 설명 범위 scope 정의 도메인·ip·시간·제외 대상 화이트리스트, 계약서에 명시 격리 샌드박스 운영망과 분리된 복제 환경에서 먼저 검증 승인 human-in-the-loop 파괴적 단계(쓰기·익스플로잇) 전 승인 게이트 중단 킬 스위치 이상 징후·서비스 영향 감지 시 즉시 중단 기록 감사·법적 모든 명령·결과 로그 보존, 권한 남용·오폭 대비 신뢰 프롬프트 보안 대상 시스템의 인젝션으로 에이전트 탈취 방지(도구 권한 최소화) 두음: 정·탐·익·보 — 정찰·탐색·익스플로잇·보고 / 범·샌·승·킬 — 범위·샌드박스·승인·킬 스위치 \"자동화가 빨라질수록 통제가 먼저 — 범위·샌드박스·승인·로그 없이는 자율 침투테스트가 사고가 된다\""}, {"id": "itdr", "cat": "sec", "sub": "sec-gov", "parent": "xdr-siem-soar", "t": "ITDR", "s": "신원 위협 탐지·대응", "stars": 2, "redStar": false, "full": "ITDR (Identity Threat Detection and Response)", "catLabel": "보안", "st": "📌 복습 필요", "d": "2026-11-25", "def": "<p><b>ITDR(Identity Threat Detection and Response)<\/b>은 신원(Identity)을 보안 경계로 삼아 IAM·PAM·토큰·세션의 이상행위를 실시간 상관분석하고 <b>크리덴셜 탈취·권한 상승을 조기 차단<\/b>하는 <b>신원 중심 위협 탐지·대응 체계<\/b><\/p>", "kw": "<ul class=\"kw\"><li><b>탐지 대상<\/b>: 크리덴셜 탈취(피싱·인포스틸러), 권한 상승, 토큰·세션 재사용(Pass-the-Cookie), MFA 우회, 비인간 신원(NHI) 오용<\/li><li><b>ITDR vs IAM·PAM<\/b>: IAM은 인증·인가(예방), PAM은 특권계정 관리, ITDR은 침해 가정 후 <b>탐지·대응<\/b><\/li><li><b>분석<\/b>: UEBA·행위 기준선(Baseline), 지리·시간·디바이스 이상, 권한 그래프·접근 경로 분석<\/li><li><b>대응<\/b>: 세션 강제 종료, 권한 회수·계정 잠금, MFA 재등록, 자격증명 재발급, 격리·포렌식<\/li><li><b>NHI 보호<\/b>: 서비스 계정·API 키·AI 에이전트 신원의 권한 최소화·수명 관리·소유자 지정<\/li><li><b>연계<\/b>: SIEM·SOAR·XDR·CIEM과 결합해 자동 대응 플레이북 실행<\/li><\/ul>", "pp": "<h4>1) ITDR vs IAM · PAM · XDR<\/h4>\n<div class=\"tblwrap\"><table class=\"cmp\"><colgroup><col style=\"width:24%\"><col style=\"width:28%\"><col style=\"width:48%\"><\/colgroup><thead><tr><th>구분<\/th><th>목적<\/th><th>설명<\/th><\/tr><\/thead><tbody><tr><td class=\"k\">IAM<\/td><td>인증·인가 (예방)<\/td><td>사용자 신원·권한 부여, SSO·MFA — 사후 침해 탐지 기능은 제한적<\/td><\/tr><tr><td class=\"k\">PAM<\/td><td>특권계정 보호<\/td><td>관리자 계정 금고·세션 기록·승인 워크플로<\/td><\/tr><tr><td class=\"k\">ITDR<\/td><td>신원 위협 탐지·대응<\/td><td>계정·토큰·세션 행위 분석으로 탈취·상승·우회를 실시간 차단<\/td><\/tr><tr><td class=\"k\">XDR<\/td><td>엔드포인트·네트워크·클라우드 통합 대응<\/td><td>텔레메트리 통합 분석 — ITDR은 그중 신원 축을 심화<\/td><\/tr><tr><td class=\"k\">CIEM<\/td><td>클라우드 권한 최소화<\/td><td>IAM 정책·권한 남용 분석으로 과다 권한 제거<\/td><\/tr><\/tbody><\/table><\/div>\n<h4>2) 대응 4단계<\/h4>\n<div class=\"tblwrap\"><table class=\"cmp\"><colgroup><col style=\"width:24%\"><col style=\"width:28%\"><col style=\"width:48%\"><\/colgroup><thead><tr><th>구분<\/th><th>특징<\/th><th>설명<\/th><\/tr><\/thead><tbody><tr><td class=\"k\">탐지<\/td><td>로그·행위 수집<\/td><td>IAM·PAM·IdP·클라우드 감사 로그, 인증 실패·토큰 재사용 탐지<\/td><\/tr><tr><td class=\"k\">분석<\/td><td>상관분석·위험 점수<\/td><td>UEBA 기준선 대비 이상, 권한 그래프로 영향 범위 산정<\/td><\/tr><tr><td class=\"k\">대응<\/td><td>세션·권한 통제<\/td><td>세션 무효화, 권한 회수, 계정 잠금, SOAR 플레이북 자동 실행<\/td><\/tr><tr><td class=\"k\">복구<\/td><td>재발방지<\/td><td>자격증명 재발급·MFA 재등록, 정책·권한 조정, 사후 점검<\/td><\/tr><\/tbody><\/table><\/div>\n<h4>3) 도입 고려사항<\/h4>\n<div class=\"tblwrap\"><table class=\"cmp\"><colgroup><col style=\"width:24%\"><col style=\"width:28%\"><col style=\"width:48%\"><\/colgroup><thead><tr><th>구분<\/th><th>키워드<\/th><th>설명<\/th><\/tr><\/thead><tbody><tr><td class=\"k\">가시성<\/td><td>로그 통합<\/td><td>IdP·PAM·클라우드·SaaS 인증 로그를 단일 파이프라인으로 수집<\/td><\/tr><tr><td class=\"k\">오탐<\/td><td>기준선 학습<\/td><td>업무 패턴 학습 기간 필요, 예외 화이트리스트·위험 점수 임계치 튜닝<\/td><\/tr><tr><td class=\"k\">자동화<\/td><td>차단 vs 승인<\/td><td>고위험(권한 상승·대량 접근)은 자동 차단, 저위험은 승인 후 처리<\/td><\/tr><tr><td class=\"k\">확장<\/td><td>NHI·AI 에이전트<\/td><td>서비스 계정·에이전트 권한을 인벤토리화하고 회전·만료 자동화<\/td><\/tr><\/tbody><\/table><\/div>", "rv": "<div class=\"q\"><b>두음: 탈·상·토·엠 / 탐·분·대·복<\/b> — 탈취·상승·토큰·MFA / 탐지·분석·대응·복구<\/div>\n<div class=\"q\"><b>\"경계는 더 이상 방화벽이 아니라 신원이다 — ITDR은 신원 XDR\"<\/b><\/div>", "img": "itpe-diagrams/122-itdr.webp", "txt": null, "search": "itdr (identity threat detection and response) itdr 신원 위협 탐지·대응 보안 보안 거버넌스·대응 ⭐⭐ 기출빈출 기출 빈출 중요 itdr(identity threat detection and response) 은 신원(identity)을 보안 경계로 삼아 iam·pam·토큰·세션의 이상행위를 실시간 상관분석하고 크리덴셜 탈취·권한 상승을 조기 차단 하는 신원 중심 위협 탐지·대응 체계 탐지 대상 : 크리덴셜 탈취(피싱·인포스틸러), 권한 상승, 토큰·세션 재사용(pass-the-cookie), mfa 우회, 비인간 신원(nhi) 오용 itdr vs iam·pam : iam은 인증·인가(예방), pam은 특권계정 관리, itdr은 침해 가정 후 탐지·대응 분석 : ueba·행위 기준선(baseline), 지리·시간·디바이스 이상, 권한 그래프·접근 경로 분석 대응 : 세션 강제 종료, 권한 회수·계정 잠금, mfa 재등록, 자격증명 재발급, 격리·포렌식 nhi 보호 : 서비스 계정·api 키·ai 에이전트 신원의 권한 최소화·수명 관리·소유자 지정 연계 : siem·soar·xdr·ciem과 결합해 자동 대응 플레이북 실행 1) itdr vs iam · pam · xdr 구분 목적 설명 iam 인증·인가 (예방) 사용자 신원·권한 부여, sso·mfa — 사후 침해 탐지 기능은 제한적 pam 특권계정 보호 관리자 계정 금고·세션 기록·승인 워크플로 itdr 신원 위협 탐지·대응 계정·토큰·세션 행위 분석으로 탈취·상승·우회를 실시간 차단 xdr 엔드포인트·네트워크·클라우드 통합 대응 텔레메트리 통합 분석 — itdr은 그중 신원 축을 심화 ciem 클라우드 권한 최소화 iam 정책·권한 남용 분석으로 과다 권한 제거 2) 대응 4단계 구분 특징 설명 탐지 로그·행위 수집 iam·pam·idp·클라우드 감사 로그, 인증 실패·토큰 재사용 탐지 분석 상관분석·위험 점수 ueba 기준선 대비 이상, 권한 그래프로 영향 범위 산정 대응 세션·권한 통제 세션 무효화, 권한 회수, 계정 잠금, soar 플레이북 자동 실행 복구 재발방지 자격증명 재발급·mfa 재등록, 정책·권한 조정, 사후 점검 3) 도입 고려사항 구분 키워드 설명 가시성 로그 통합 idp·pam·클라우드·saas 인증 로그를 단일 파이프라인으로 수집 오탐 기준선 학습 업무 패턴 학습 기간 필요, 예외 화이트리스트·위험 점수 임계치 튜닝 자동화 차단 vs 승인 고위험(권한 상승·대량 접근)은 자동 차단, 저위험은 승인 후 처리 확장 nhi·ai 에이전트 서비스 계정·에이전트 권한을 인벤토리화하고 회전·만료 자동화 두음: 탈·상·토·엠 / 탐·분·대·복 — 탈취·상승·토큰·mfa / 탐지·분석·대응·복구 \"경계는 더 이상 방화벽이 아니라 신원이다 — itdr은 신원 xdr\""}, {"id": "cnapp", "cat": "sec", "sub": "sec-cloud", "parent": null, "t": "CNAPP · CSPM", "s": "피·워·아·시 / Code to Cloud", "stars": 2, "redStar": false, "full": "CNAPP과 CSPM (클라우드 네이티브 보안)", "catLabel": "보안", "st": "📌 복습 필요", "d": "2026-11-21", "def": "<p><b>CSPM<\/b>은 클라우드의 잘못된 설정(Misconfiguration)과 컴플라이언스 위반을 상시 점검하는 보안 태세 관리 기술이며, <b>CNAPP<\/b>는 CSPM·CWPP·CIEM 등을 <b>코드(Build)부터 런타임(Run)까지 단일 플랫폼으로 통합<\/b>한 클라우드 네이티브 보안 플랫폼<\/p>", "kw": "<ul class=\"kw\"><li><b>CNAPP 4대 핵심 구성 (피·워·아·시)<\/b>:<ul class=\"kw\"><li><b>CSPM (태세 관리)<\/b>: 클라우드 리소스 설정 오류·규정 준수 자동 탐지<\/li><li><b>CWPP (워크로드 보호)<\/b>: 컨테이너·VM·서버리스 런타임 악성 행위 탐지·차단<\/li><li><b>CIEM (권한 관리)<\/b>: 멀티클라우드 환경의 과도한 IAM 권한 축소(최소 권한)<\/li><li><b>IaC 스캐닝 &amp; CDR<\/b>: 배포 전 코드(Terraform 등) 취약점 제거 + 실시간 탐지·대응<\/li><\/ul><\/li><\/ul>", "pp": "<div class=\"tblwrap\"><table class=\"cmp\"><colgroup><col style=\"width:24%\"><col style=\"width:28%\"><col style=\"width:48%\"><\/colgroup><thead><tr><th>관점(측면)<\/th><th>특징<\/th><th>설명<\/th><\/tr><\/thead><tbody><tr><td class=\"k\">통합·아키텍처 관점<\/td><td>사일로 해소 (단일 플랫폼)<\/td><td>개별 솔루션(CSPM·CWPP·CIEM)을 통합해 공격 경로(Attack Path) 연계 분석<\/td><\/tr><tr><td class=\"k\">생애주기 관점<\/td><td>Code to Cloud (Shift-Left)<\/td><td>개발 단계 IaC 스캐닝부터 운영 단계 런타임(CDR) 방어까지 전 주기 보호<\/td><\/tr><tr><td class=\"k\">권한·컴플라이언스<\/td><td>CIEM + CSPM<\/td><td>최소 권한 원칙 적용 및 ISMS-P·NIST 등 보안 기준 자동 감사<\/td><\/tr><tr><td class=\"k\">운영·SOAR 연계<\/td><td>알림 피로 감소<\/td><td>우선순위 높은 실제 공격 경로만 선별해 SOAR·티켓으로 자동 대응<\/td><\/tr><\/tbody><\/table><\/div>", "rv": "<div class=\"q\"><b>두음: 피·워·아·시<\/b> — 피(CSPM 태세)·워(CWPP 워크로드)·아(CIEM 권한)·시(IaC·CDR 코드~런타임)<\/div>\n<div class=\"q\"><b>개별 보안 도구 파편화 → CNAPP 통합(Code to Cloud)<\/b> 흐름!<\/div>", "img": "itpe-diagrams/53-cnapp-cspm.webp", "txt": null, "search": "cnapp과 cspm (클라우드 네이티브 보안) cnapp · cspm 피·워·아·시 / code to cloud 보안 클라우드·네트워크 보안 ⭐⭐ 기출빈출 기출 빈출 중요 cspm 은 클라우드의 잘못된 설정(misconfiguration)과 컴플라이언스 위반을 상시 점검하는 보안 태세 관리 기술이며, cnapp 는 cspm·cwpp·ciem 등을 코드(build)부터 런타임(run)까지 단일 플랫폼으로 통합 한 클라우드 네이티브 보안 플랫폼 cnapp 4대 핵심 구성 (피·워·아·시) : cspm (태세 관리) : 클라우드 리소스 설정 오류·규정 준수 자동 탐지 cwpp (워크로드 보호) : 컨테이너·vm·서버리스 런타임 악성 행위 탐지·차단 ciem (권한 관리) : 멀티클라우드 환경의 과도한 iam 권한 축소(최소 권한) iac 스캐닝 &amp; cdr : 배포 전 코드(terraform 등) 취약점 제거 + 실시간 탐지·대응 관점(측면) 특징 설명 통합·아키텍처 관점 사일로 해소 (단일 플랫폼) 개별 솔루션(cspm·cwpp·ciem)을 통합해 공격 경로(attack path) 연계 분석 생애주기 관점 code to cloud (shift-left) 개발 단계 iac 스캐닝부터 운영 단계 런타임(cdr) 방어까지 전 주기 보호 권한·컴플라이언스 ciem + cspm 최소 권한 원칙 적용 및 isms-p·nist 등 보안 기준 자동 감사 운영·soar 연계 알림 피로 감소 우선순위 높은 실제 공격 경로만 선별해 soar·티켓으로 자동 대응 두음: 피·워·아·시 — 피(cspm 태세)·워(cwpp 워크로드)·아(ciem 권한)·시(iac·cdr 코드~런타임) 개별 보안 도구 파편화 → cnapp 통합(code to cloud) 흐름!"}, {"id": "devsecops", "cat": "sec", "sub": "sec-supply", "parent": null, "t": "DevSecOps · Shift-Left", "s": "공급망 보안 자동화", "stars": 2, "redStar": false, "full": "DevSecOps & Shift-Left 보안", "catLabel": "보안·네트워크", "st": "📌 복습 필요", "d": "2026-11-19", "def": "<p>DevOps(개발·운영) 파이프라인 전 주기에 보안(Security)을 내재화·자동화하는 문화이며, <b>Shift-Left<\/b>는 테스트·운영 단계에서 뒤늦게 하던 보안 점검을 <b>설계·코딩 초기(왼쪽)로 앞당겨<\/b> 수정 비용을 줄이는 전략.<\/p>", "kw": "<ul class=\"kw\"><li><b>Shift-Left 효과<\/b>: 배포 직전 발견 대비 초기 단계 취약점 수정 비용·시간 대폭 절감<\/li><li><b>단계별 자동화 도구<\/b>: 코딩/빌드(<b>SAST<\/b> 정적 분석, <b>SCA<\/b> 오픈소스/SBOM, <b>Secret Scan<\/b>) → 테스트/스테이징(<b>DAST<\/b> 동적 분석, <b>IAST<\/b>) → 배포/운영(<b>IaC Scan<\/b>, 컨테이너 보안, RASP)<\/li><li><b>핵심 원칙<\/b>: Security as Code(보안 정책의 코드화), CI/CD 파이프라인 내 자동 게이트(Gate) 적용<\/li><\/ul>", "pp": "<div class=\"tblwrap\"><table class=\"cmp\"><colgroup><col style=\"width:24%\"><col style=\"width:28%\"><col style=\"width:48%\"><\/colgroup><thead><tr><th>관점(측면)<\/th><th>특징<\/th><th>설명<\/th><\/tr><\/thead><tbody><tr><td class=\"k\">문화·조직<\/td><td>보안 내재화<\/td><td>개발·운영 전 주기에 보안 책임을 공유하고 보안 담당자를 파이프라인에 참여시킴<\/td><\/tr><tr><td class=\"k\">공정·자동화<\/td><td>Shift-Left<\/td><td>설계·코딩 초기로 점검을 앞당겨 수정 비용을 줄이고 CI/CD에 자동 게이트를 둠<\/td><\/tr><tr><td class=\"k\">도구·기술<\/td><td>SAST·DAST·SCA<\/td><td>단계별로 정적·동적 분석, 오픈소스 구성요소(SCA)·Secret·IaC 스캔을 배치<\/td><\/tr><tr><td class=\"k\">운영·거버넌스<\/td><td>Security as Code<\/td><td>보안 정책을 코드로 정의하고 취약점 추적·지표 관리로 지속 개선<\/td><\/tr><\/tbody><\/table><\/div>", "rv": "<div class=\"q\"><b>두음: 빌·테·배<\/b> — 빌(SAST·SCA·Secret Scan)·테(DAST·IAST)·배(IaC Scan·RASP)<\/div>\n<div class=\"q\">\"개발·운영에 보안 통합\"만 쓰지 말고, <b>Shift-Left(초기 단계로 앞당김)<\/b>와 <b>SAST·DAST·SCA<\/b> 자동화 도구를 반드시 함께 쓰기!<\/div>", "img": "itpe-diagrams/12-devsecops-shiftleft.webp", "txt": null, "search": "devsecops & shift-left 보안 devsecops · shift-left 공급망 보안 자동화 보안·네트워크 공급망·devsecops ⭐⭐ 기출빈출 기출 빈출 중요 devops(개발·운영) 파이프라인 전 주기에 보안(security)을 내재화·자동화하는 문화이며, shift-left 는 테스트·운영 단계에서 뒤늦게 하던 보안 점검을 설계·코딩 초기(왼쪽)로 앞당겨 수정 비용을 줄이는 전략. shift-left 효과 : 배포 직전 발견 대비 초기 단계 취약점 수정 비용·시간 대폭 절감 단계별 자동화 도구 : 코딩/빌드( sast 정적 분석, sca 오픈소스/sbom, secret scan ) → 테스트/스테이징( dast 동적 분석, iast ) → 배포/운영( iac scan , 컨테이너 보안, rasp) 핵심 원칙 : security as code(보안 정책의 코드화), ci/cd 파이프라인 내 자동 게이트(gate) 적용 관점(측면) 특징 설명 문화·조직 보안 내재화 개발·운영 전 주기에 보안 책임을 공유하고 보안 담당자를 파이프라인에 참여시킴 공정·자동화 shift-left 설계·코딩 초기로 점검을 앞당겨 수정 비용을 줄이고 ci/cd에 자동 게이트를 둠 도구·기술 sast·dast·sca 단계별로 정적·동적 분석, 오픈소스 구성요소(sca)·secret·iac 스캔을 배치 운영·거버넌스 security as code 보안 정책을 코드로 정의하고 취약점 추적·지표 관리로 지속 개선 두음: 빌·테·배 — 빌(sast·sca·secret scan)·테(dast·iast)·배(iac scan·rasp) \"개발·운영에 보안 통합\"만 쓰지 말고, shift-left(초기 단계로 앞당김) 와 sast·dast·sca 자동화 도구를 반드시 함께 쓰기!"}, {"id": "sbom", "cat": "sec", "sub": "sec-supply", "parent": "devsecops", "t": "SBOM", "s": "소프트웨어 자재명세서", "stars": 2, "redStar": false, "full": "SBOM (Software Bill of Materials)", "catLabel": "보안·네트워크", "st": "📌 복습 필요", "d": "2026-11-19", "def": "<ul class=\"kw\"><li>소프트웨어를 구성하는 <b>오픈소스, 서드파티 라이브러리, 컴포넌트와 그 의존성 관계<\/b>를 목록화한 명세서<\/li><li>비유: <b>'소프트웨어의 영양성분표(자재명세서)'<\/b> — 이 소프트웨어가 무엇으로 만들어졌는지 투명하게 공개<\/li><\/ul>", "kw": "<ul class=\"kw\"><li><b>도입 배경<\/b><ul class=\"kw\"><li>Log4j·SolarWinds 등 <b>소프트웨어 공급망(Supply Chain) 보안 위협<\/b> 증가<\/li><li>미국 행정명령 <b>EO 14028<\/b> 등 공급망 보안 규제 강화<\/li><\/ul><\/li><li><b>3대 표준 포맷<\/b><ul class=\"kw\"><li><code>SPDX<\/code> — Linux Foundation 주도<\/li><li><code>CycloneDX<\/code> — OWASP 주도 (경량·보안 특화)<\/li><li><code>SWID<\/code> — ISO/IEC 19770-2, 태그 기반 소프트웨어 식별<\/li><\/ul><\/li><li><b>주요 활용<\/b><ul class=\"kw\"><li>취약점(<b>CVE<\/b>) 영향 범위 신속 식별<\/li><li>오픈소스 <b>라이선스(GPL 등) 컴플라이언스<\/b> 검증<\/li><li><b>CI/CD<\/b> 파이프라인 자동화 연계<\/li><\/ul><\/li><li><b>최신 확장<\/b><ul class=\"kw\"><li>AI 모델·학습 데이터 투명성 관리 → <b>AI-BOM(ML-BOM)<\/b><\/li><\/ul><\/li><\/ul>", "pp": "<div class=\"tblwrap\"><table class=\"cmp\"><colgroup><col style=\"width:24%\"><col style=\"width:28%\"><col style=\"width:48%\"><\/colgroup><thead><tr><th>관점(측면)<\/th><th>특징<\/th><th>설명<\/th><\/tr><\/thead><tbody><tr><td class=\"k\">대상·범위<\/td><td>컴포넌트·의존성<\/td><td>오픈소스·서드파티 라이브러리와 전이 의존 관계까지 목록화한 자재명세서<\/td><\/tr><tr><td class=\"k\">표준 포맷<\/td><td>SPDX·CycloneDX·SWID<\/td><td>Linux Foundation·OWASP·ISO 표준을 사용해 도구·기관 간 상호운용성 확보<\/td><\/tr><tr><td class=\"k\">활용<\/td><td>CVE·라이선스<\/td><td>취약점 영향 범위를 신속히 식별하고 GPL 등 라이선스 컴플라이언스를 검증<\/td><\/tr><tr><td class=\"k\">운영·확장<\/td><td>CI/CD 연계·AI-BOM<\/td><td>빌드 시 자동 생성·서명하고, AI 모델·학습 데이터까지 AI-BOM으로 확장<\/td><\/tr><\/tbody><\/table><\/div>", "rv": "<div class=\"q\"><b>두음: 스·싸·위<\/b> — 스(SPDX)·싸(CycloneDX)·위(SWID)<\/div>\n<div class=\"q\">\"도메인 내 사용 서비스 목록\"이 아니라 <b>SW 내부 컴포넌트·오픈소스 의존성 명세서<\/b>라는 점, 그리고 <b>SPDX · CycloneDX · SWID<\/b> 3대 표준 포맷을 꼭 함께 외우기!<\/div>", "img": "itpe-diagrams/05-sbom.webp", "txt": null, "search": "sbom (software bill of materials) sbom 소프트웨어 자재명세서 보안·네트워크 공급망·devsecops ⭐⭐ 기출빈출 기출 빈출 중요 소프트웨어를 구성하는 오픈소스, 서드파티 라이브러리, 컴포넌트와 그 의존성 관계 를 목록화한 명세서 비유: '소프트웨어의 영양성분표(자재명세서)' — 이 소프트웨어가 무엇으로 만들어졌는지 투명하게 공개 도입 배경 log4j·solarwinds 등 소프트웨어 공급망(supply chain) 보안 위협 증가 미국 행정명령 eo 14028 등 공급망 보안 규제 강화 3대 표준 포맷 spdx — linux foundation 주도 cyclonedx — owasp 주도 (경량·보안 특화) swid — iso/iec 19770-2, 태그 기반 소프트웨어 식별 주요 활용 취약점( cve ) 영향 범위 신속 식별 오픈소스 라이선스(gpl 등) 컴플라이언스 검증 ci/cd 파이프라인 자동화 연계 최신 확장 ai 모델·학습 데이터 투명성 관리 → ai-bom(ml-bom) 관점(측면) 특징 설명 대상·범위 컴포넌트·의존성 오픈소스·서드파티 라이브러리와 전이 의존 관계까지 목록화한 자재명세서 표준 포맷 spdx·cyclonedx·swid linux foundation·owasp·iso 표준을 사용해 도구·기관 간 상호운용성 확보 활용 cve·라이선스 취약점 영향 범위를 신속히 식별하고 gpl 등 라이선스 컴플라이언스를 검증 운영·확장 ci/cd 연계·ai-bom 빌드 시 자동 생성·서명하고, ai 모델·학습 데이터까지 ai-bom으로 확장 두음: 스·싸·위 — 스(spdx)·싸(cyclonedx)·위(swid) \"도메인 내 사용 서비스 목록\"이 아니라 sw 내부 컴포넌트·오픈소스 의존성 명세서 라는 점, 그리고 spdx · cyclonedx · swid 3대 표준 포맷을 꼭 함께 외우기!"}, {"id": "slsa", "cat": "sec", "sub": "sec-supply", "parent": "devsecops", "t": "소프트웨어 공급망 보안 · SLSA", "s": "소·빌·아·배 / 출·호·격 (SBOM+SLSA)", "stars": 3, "redStar": false, "full": "소프트웨어 공급망 보안 & SLSA", "catLabel": "보안", "st": "📌 복습 필요", "d": "2026-11-23", "def": "<p>오픈소스 의존성뿐 아니라 <b>소스 → 빌드(CI/CD) → 아티팩트 → 배포/운영<\/b>에 이르는 소프트웨어 공급망 전 과정의 변조·위협을 막기 위한 <b>구글·OpenSSF 주도 공급망 무결성 보증 프레임워크(SLSA, Supply-chain Levels for Software Artifacts)<\/b><\/p>", "kw": "<ul class=\"kw\"><li><b>소프트웨어 공급망 4단계 (소·빌·아·배)<\/b>: ① <b>소스/의존성<\/b>(오픈소스·서드파티 라이브러리) → ② <b>빌드(CI/CD)<\/b>(빌드 서버·스크립트, SolarWinds형 공격 표적) → ③ <b>아티팩트<\/b>(컨테이너 이미지·패키지) → ④ <b>배포/운영<\/b><\/li><li><b>SBOM vs SLSA 역할 구분<\/b>: <b>SBOM<\/b>은 \"무엇이 들었나(재료 목록)\"를 식별하고, <b>SLSA<\/b>는 \"만드는 과정(빌드·출처)이 변조되지 않았는가(공정 무결성)\"를 증명<\/li><li><b>SLSA v1.0 Build Track 3단계 (출·호·격)<\/b>:<ul class=\"kw\"><li><b>Level 1<\/b>: 빌드 과정 문서화 및 <b>출처(Provenance)<\/b> 생성<\/li><li><b>Level 2<\/b>: 신뢰할 수 있는 <b>호스팅 빌드 서비스<\/b> 사용 + 서명된 출처(Signed Provenance)<\/li><li><b>Level 3<\/b>: <b>격리된 일회성 빌드 환경<\/b>으로 타 빌드 간 침투·위변조 원천 차단<\/li><\/ul><\/li><\/ul>", "pp": "<h4>1) 개념 비교 (SBOM vs SLSA)<\/h4>\n<div class=\"tblwrap\"><table class=\"cmp\"><colgroup><col style=\"width:24%\"><col style=\"width:28%\"><col style=\"width:48%\"><\/colgroup><thead><tr><th>비교<\/th><th>SBOM (소프트웨어 자재명세서)<\/th><th>SLSA (공급망 보안 프레임워크)<\/th><\/tr><\/thead><tbody><tr><td class=\"k\">핵심 질문<\/td><td>소프트웨어 안에 무엇이 들었는가?<\/td><td>빌드·배포 과정이 안전하고 변조되지 않았는가?<\/td><\/tr><tr><td class=\"k\">주요 대상<\/td><td>오픈소스·서드파티 컴포넌트·라이선스<\/td><td>CI/CD 빌드 파이프라인 · 출처 증명(Provenance)<\/td><\/tr><tr><td class=\"k\">상호 연계<\/td><td>취약 컴포넌트(Log4j 등) 신속 식별<\/td><td>검증된 아티팩트만 배포(Zero Trust Supply Chain)<\/td><\/tr><\/tbody><\/table><\/div>\n<h4>2) 상세 비교 (공급망 단계별 위협·대응)<\/h4>\n<div class=\"tblwrap\"><table class=\"cmp\"><colgroup><col style=\"width:24%\"><col style=\"width:28%\"><col style=\"width:48%\"><\/colgroup><thead><tr><th>구분<\/th><th>특징<\/th><th>설명<\/th><\/tr><\/thead><tbody><tr><td class=\"k\">소스·빌드 관점<\/td><td>의존성·빌드 서버 보호<\/td><td>2FA·코드 리뷰·서명 커밋 및 격리된 CI/CD 빌드 환경(Level 3) 적용<\/td><\/tr><tr><td class=\"k\">아티팩트·배포 관점<\/td><td>전자서명·무결성 검증<\/td><td>Sigstore·컨테이너 이미지 서명과 SBOM+SLSA Provenance 동시 검증 후 배포<\/td><\/tr><\/tbody><\/table><\/div>", "rv": "<div class=\"q\"><b>두음: 소·빌·아·배 / 출·호·격<\/b> — 소스·빌드·아티팩트·배포 / 출처(L1)·호스팅서명(L2)·격리빌드(L3)<\/div>\n<div class=\"q\"><b>SBOM(재료 목록) + SLSA(공정 무결성)<\/b>를 짝으로 서술하면 공급망 보안 완벽 정리!<\/div>", "img": "itpe-diagrams/86-slsa-supply-chain.webp", "txt": null, "search": "소프트웨어 공급망 보안 & slsa 소프트웨어 공급망 보안 · slsa 소·빌·아·배 / 출·호·격 (sbom+slsa) 보안 공급망·devsecops ⭐⭐⭐ 기출빈출 기출 빈출 중요 오픈소스 의존성뿐 아니라 소스 → 빌드(ci/cd) → 아티팩트 → 배포/운영 에 이르는 소프트웨어 공급망 전 과정의 변조·위협을 막기 위한 구글·openssf 주도 공급망 무결성 보증 프레임워크(slsa, supply-chain levels for software artifacts) 소프트웨어 공급망 4단계 (소·빌·아·배) : ① 소스/의존성 (오픈소스·서드파티 라이브러리) → ② 빌드(ci/cd) (빌드 서버·스크립트, solarwinds형 공격 표적) → ③ 아티팩트 (컨테이너 이미지·패키지) → ④ 배포/운영 sbom vs slsa 역할 구분 : sbom 은 \"무엇이 들었나(재료 목록)\"를 식별하고, slsa 는 \"만드는 과정(빌드·출처)이 변조되지 않았는가(공정 무결성)\"를 증명 slsa v1.0 build track 3단계 (출·호·격) : level 1 : 빌드 과정 문서화 및 출처(provenance) 생성 level 2 : 신뢰할 수 있는 호스팅 빌드 서비스 사용 + 서명된 출처(signed provenance) level 3 : 격리된 일회성 빌드 환경 으로 타 빌드 간 침투·위변조 원천 차단 1) 개념 비교 (sbom vs slsa) 비교 sbom (소프트웨어 자재명세서) slsa (공급망 보안 프레임워크) 핵심 질문 소프트웨어 안에 무엇이 들었는가? 빌드·배포 과정이 안전하고 변조되지 않았는가? 주요 대상 오픈소스·서드파티 컴포넌트·라이선스 ci/cd 빌드 파이프라인 · 출처 증명(provenance) 상호 연계 취약 컴포넌트(log4j 등) 신속 식별 검증된 아티팩트만 배포(zero trust supply chain) 2) 상세 비교 (공급망 단계별 위협·대응) 구분 특징 설명 소스·빌드 관점 의존성·빌드 서버 보호 2fa·코드 리뷰·서명 커밋 및 격리된 ci/cd 빌드 환경(level 3) 적용 아티팩트·배포 관점 전자서명·무결성 검증 sigstore·컨테이너 이미지 서명과 sbom+slsa provenance 동시 검증 후 배포 두음: 소·빌·아·배 / 출·호·격 — 소스·빌드·아티팩트·배포 / 출처(l1)·호스팅서명(l2)·격리빌드(l3) sbom(재료 목록) + slsa(공정 무결성) 를 짝으로 서술하면 공급망 보안 완벽 정리!"}, {"id": "php2shell-cve", "cat": "sec", "sub": "sec-supply", "parent": null, "t": "PHP2Shell 취약점", "s": "CVE-2026-109618·109619", "stars": 1, "redStar": false, "full": "PHP2Shell 취약점 (CVE-2026-109618 · CVE-2026-109619)", "catLabel": "보안", "st": "📌 복습 필요", "d": "2026-11-25", "def": "<p><b>PHP2Shell<\/b>은 2026년 10월 공개된 PHP의 <b>비인증 원격 코드 실행(RCE)<\/b> 취약점 쌍. <b>CVE-2026-109618<\/b>(메모리 부족 처리 중 데이터 손상)과 <b>CVE-2026-109619<\/b>(해제된 메모리·전역 상태 재사용)으로 구성되며, 조작된 <b>multipart 업로드 요청<\/b>으로 OOM을 유발해 워커에 손상 상태를 남긴 뒤 코드 실행으로 발전시키는 <b>CVSS v4.0 9.2 등급의 원격 코드 실행 취약점 쌍<\/b>.<\/p>", "kw": "<ul class=\"kw\"><li><b>CVE-2026-109618<\/b>: OOM 시 <b>longjmp<\/b>로 요청 처리가 정리 없이 중단 → Apache <b>mod_php<\/b>가 요청 시작 실패 후에도 종료 절차를 실행해 미초기화 상태를 읽음(단일 요청으로 성립)<\/li><li><b>CVE-2026-109619<\/b>: 중단된 요청이 남긴 전역 역직렬화 상태(BG(unserialize))를 <b>같은 워커의 다음 요청<\/b>이 재사용 → <b>Use-After-Free<\/b>(session.upload_progress 경로)<\/li><li><b>공격 전제<\/b>: 인증 불필요, <b>multipart/form-data<\/b> 한 건 — PHP가 애플리케이션 코드 실행 전에 요청 본문을 파싱하는 지점 악용<\/li><li><b>영향 버전<\/b>: PHP 8.5.0~8.5.11 · 8.4.0~8.4.26 · 8.3.0~8.3.35 · 8.2.0~8.2.34, 8.1 이하 전 버전<\/li><li><b>패치 버전<\/b>: <b>8.5.12 · 8.4.27 · 8.3.36 · 8.2.35<\/b> — 패치 후 <b>모든 워커 재시작<\/b>까지 해야 완전 해소<\/li><li><b>패치 내용<\/b>: OOM 경로에서 longjmp 제거(소프트 OOM 정리 / 하드 OOM은 _exit) + 업로드 진행률 역직렬화를 <b>__PHP_Incomplete_Class<\/b>로 제한<\/li><li><b>공격 체인<\/b>: OOM 유발 → 손상 상태 잔존 → 힙 재사용(ASLR 우회) → 리버스 셸<\/li><\/ul>", "pp": "<h4>1) CVE-2026-109618 vs CVE-2026-109619 (비교모듈: 목·대·방·키·성·위)<\/h4>\n<div class=\"tblwrap\"><table class=\"cmp\"><colgroup><col style=\"width:24%\"><col style=\"width:28%\"><col style=\"width:48%\"><\/colgroup><thead><tr><th>구분<\/th><th>CVE-2026-109618<\/th><th>CVE-2026-109619<\/th><\/tr><\/thead><tbody><tr><td class=\"k\">보안목적(영향)<\/td><td>비인증 원격 코드 실행(CVSS 9.2)<\/td><td>비인증 원격 코드 실행(CVSS 9.2)<\/td><\/tr><tr><td class=\"k\">보호대상(취약 지점)<\/td><td>OOM 처리·요청 종료 절차(미초기화 상태)<\/td><td>해제된 전역 역직렬화 상태 재사용<\/td><\/tr><tr><td class=\"k\">인증·공격방식<\/td><td>조작 multipart로 OOM → longjmp → 종료 절차가 손상 상태 참조<\/td><td>OOM 후 같은 워커의 다음 요청이 session.upload_progress로 잔존 상태 접근<\/td><\/tr><tr><td class=\"k\">키·토큰관리(성립 조건)<\/td><td>mod_php처럼 요청 시작 실패에도 종료 절차를 실행하는 환경<\/td><td>워커 재사용 + session.upload_progress(기본 활성) 필요<\/td><\/tr><tr><td class=\"k\">성능·부하(악용 난이도)<\/td><td>요청 1건으로 성립, 확률적·반복 시도<\/td><td>같은 워커에 두 요청 도달 필요 → 시도 횟수 증가<\/td><\/tr><tr><td class=\"k\">위협·대응<\/td><td>패치(8.5.12/8.4.27/8.3.36/8.2.35) + 워커 재시작, WAF<\/td><td>동일(공통 패치·공통 완화)<\/td><\/tr><\/tbody><\/table><\/div>\n<h4>2) 공격 체인 3단계<\/h4>\n<div class=\"tblwrap\"><table class=\"cmp\"><colgroup><col style=\"width:24%\"><col style=\"width:28%\"><col style=\"width:48%\"><\/colgroup><thead><tr><th>단계<\/th><th>동작<\/th><th>핵심 포인트<\/th><\/tr><\/thead><tbody><tr><td class=\"k\">① OOM 유발<\/td><td>요청 크기 검사는 통과, 메모리 한계는 초과하는 multipart 전송<\/td><td>Content-Length 미선언·긴 헤더·중첩 빈 파일 필드<\/td><\/tr><tr><td class=\"k\">② 손상 상태 잔존<\/td><td>longjmp가 스택을 건너뛰어 정리 코드 미실행<\/td><td>전역 상태·세션 역직렬화 상태가 해제된 메모리를 가리킴<\/td><\/tr><tr><td class=\"k\">③ 코드 실행<\/td><td>같은 크기 요청으로 힙 재사용, 허상 포인터로 임의 읽기·쓰기<\/td><td>ASLR 우회 후 리버스 셸 획득(확률적, 반복 필요)<\/td><\/tr><\/tbody><\/table><\/div>\n<h4>3) 대응·점검 체크리스트<\/h4>\n<div class=\"tblwrap\"><table class=\"cmp\"><colgroup><col style=\"width:24%\"><col style=\"width:28%\"><col style=\"width:48%\"><\/colgroup><thead><tr><th>구분<\/th><th>조치<\/th><th>설명<\/th><\/tr><\/thead><tbody><tr><td class=\"k\">즉시<\/td><td>패치·워커 재시작<\/td><td>8.5.12/8.4.27/8.3.36/8.2.35 적용 후 PHP-FPM·Apache 재시작<\/td><\/tr><tr><td class=\"k\">대체<\/td><td>8.1 이하 격리<\/td><td>지원 종료 버전은 패치 불가 → 업그레이드 전까지 서비스 오프라인<\/td><\/tr><tr><td class=\"k\">완화<\/td><td>WAF·요청 제한<\/td><td>multipart 크기·헤더 길이·중첩 필드 제한, 업로드 경로 차단<\/td><\/tr><tr><td class=\"k\">탐지<\/td><td>행위 모니터링<\/td><td>PHP 워커가 셸 실행·도구 다운로드·역방향 연결 시도 여부<\/td><\/tr><tr><td class=\"k\">관리<\/td><td>자산 식별<\/td><td>CMS·플러그인에 내장된 PHP 포함 인벤토리 점검, KEV 등재 확인<\/td><\/tr><\/tbody><\/table><\/div>", "rv": "<div class=\"q\"><b>두음: 오·유 — OOM 손상(109618)·Use-After-Free(109619) / 패·재 — 패치·워커 재시작<\/b><\/div>\n<div class=\"q\"><b>\"longjmp가 정리를 건너뛰어 남긴 상태가 다음 요청에서 코드 실행이 된다 — 패치 후 재시작까지가 조치\"<\/b><\/div>", "img": "itpe-diagrams/135-php2shell-cve.webp", "txt": null, "search": "php2shell 취약점 (cve-2026-109618 · cve-2026-109619) php2shell 취약점 cve-2026-109618·109619 보안 공급망·devsecops ⭐ 기출빈출 기출 빈출 중요 php2shell 은 2026년 10월 공개된 php의 비인증 원격 코드 실행(rce) 취약점 쌍. cve-2026-109618 (메모리 부족 처리 중 데이터 손상)과 cve-2026-109619 (해제된 메모리·전역 상태 재사용)으로 구성되며, 조작된 multipart 업로드 요청 으로 oom을 유발해 워커에 손상 상태를 남긴 뒤 코드 실행으로 발전시키는 cvss v4.0 9.2 등급의 원격 코드 실행 취약점 쌍 . cve-2026-109618 : oom 시 longjmp 로 요청 처리가 정리 없이 중단 → apache mod_php 가 요청 시작 실패 후에도 종료 절차를 실행해 미초기화 상태를 읽음(단일 요청으로 성립) cve-2026-109619 : 중단된 요청이 남긴 전역 역직렬화 상태(bg(unserialize))를 같은 워커의 다음 요청 이 재사용 → use-after-free (session.upload_progress 경로) 공격 전제 : 인증 불필요, multipart/form-data 한 건 — php가 애플리케이션 코드 실행 전에 요청 본문을 파싱하는 지점 악용 영향 버전 : php 8.5.0~8.5.11 · 8.4.0~8.4.26 · 8.3.0~8.3.35 · 8.2.0~8.2.34, 8.1 이하 전 버전 패치 버전 : 8.5.12 · 8.4.27 · 8.3.36 · 8.2.35 — 패치 후 모든 워커 재시작 까지 해야 완전 해소 패치 내용 : oom 경로에서 longjmp 제거(소프트 oom 정리 / 하드 oom은 _exit) + 업로드 진행률 역직렬화를 __php_incomplete_class 로 제한 공격 체인 : oom 유발 → 손상 상태 잔존 → 힙 재사용(aslr 우회) → 리버스 셸 1) cve-2026-109618 vs cve-2026-109619 (비교모듈: 목·대·방·키·성·위) 구분 cve-2026-109618 cve-2026-109619 보안목적(영향) 비인증 원격 코드 실행(cvss 9.2) 비인증 원격 코드 실행(cvss 9.2) 보호대상(취약 지점) oom 처리·요청 종료 절차(미초기화 상태) 해제된 전역 역직렬화 상태 재사용 인증·공격방식 조작 multipart로 oom → longjmp → 종료 절차가 손상 상태 참조 oom 후 같은 워커의 다음 요청이 session.upload_progress로 잔존 상태 접근 키·토큰관리(성립 조건) mod_php처럼 요청 시작 실패에도 종료 절차를 실행하는 환경 워커 재사용 + session.upload_progress(기본 활성) 필요 성능·부하(악용 난이도) 요청 1건으로 성립, 확률적·반복 시도 같은 워커에 두 요청 도달 필요 → 시도 횟수 증가 위협·대응 패치(8.5.12/8.4.27/8.3.36/8.2.35) + 워커 재시작, waf 동일(공통 패치·공통 완화) 2) 공격 체인 3단계 단계 동작 핵심 포인트 ① oom 유발 요청 크기 검사는 통과, 메모리 한계는 초과하는 multipart 전송 content-length 미선언·긴 헤더·중첩 빈 파일 필드 ② 손상 상태 잔존 longjmp가 스택을 건너뛰어 정리 코드 미실행 전역 상태·세션 역직렬화 상태가 해제된 메모리를 가리킴 ③ 코드 실행 같은 크기 요청으로 힙 재사용, 허상 포인터로 임의 읽기·쓰기 aslr 우회 후 리버스 셸 획득(확률적, 반복 필요) 3) 대응·점검 체크리스트 구분 조치 설명 즉시 패치·워커 재시작 8.5.12/8.4.27/8.3.36/8.2.35 적용 후 php-fpm·apache 재시작 대체 8.1 이하 격리 지원 종료 버전은 패치 불가 → 업그레이드 전까지 서비스 오프라인 완화 waf·요청 제한 multipart 크기·헤더 길이·중첩 필드 제한, 업로드 경로 차단 탐지 행위 모니터링 php 워커가 셸 실행·도구 다운로드·역방향 연결 시도 여부 관리 자산 식별 cms·플러그인에 내장된 php 포함 인벤토리 점검, kev 등재 확인 두음: 오·유 — oom 손상(109618)·use-after-free(109619) / 패·재 — 패치·워커 재시작 \"longjmp가 정리를 건너뛰어 남긴 상태가 다음 요청에서 코드 실행이 된다 — 패치 후 재시작까지가 조치\""}, {"id": "ai-supply-chain", "cat": "sec", "sub": "sec-supply", "parent": null, "t": "AI 공급망 공격", "s": "AI-BOM · 모델 서명", "stars": 2, "redStar": false, "full": "AI 공급망 공격 (AI Supply Chain Attack)", "catLabel": "보안", "st": "📌 복습 필요", "d": "2026-11-25", "def": "<p><b>AI 공급망 공격<\/b>은 학습 데이터·사전학습 모델(Pickle 역직렬화 등)·프레임워크·플러그인(MCP) 등 AI 생명주기의 외부 의존 요소에 악성 코드·백도어·편향을 삽입해 판단을 왜곡하거나 권한을 탈취하는 <b>AI 생명주기 표적 위협<\/b><\/p>", "kw": "<ul class=\"kw\"><li><b>데이터 공급망<\/b>: 학습 데이터 오염(Poisoning), 백도어 트리거 삽입, 라벨 조작, 크롤링 데이터 오염·저작권 문제<\/li><li><b>모델 공급망<\/b>: 공개 모델(Hugging Face 등) 변조, <b>Pickle(.pkl) 역직렬화 RCE<\/b>, 가중치 백도어 — <b>Safetensors<\/b> 사용이 대응<\/li><li><b>SW·도구 공급망<\/b>: 프레임워크·라이브러리 취약점, 악성 <b>MCP 서버·플러그인(Tool Poisoning)<\/b>, 의존성 혼동<\/li><li><b>AI-BOM<\/b>: 모델·데이터셋·학습 파이프라인·라이선스 구성 명세 — SBOM의 AI 확장(CycloneDX ML-BOM·SPDX AI)<\/li><li><b>검증<\/b>: 해시·서명(Sigstore·모델 서명), 출처 증명(Provenance), 가중치 스캔·안전 포맷<\/li><li><b>런타임 통제<\/b>: 샌드박스 실행, 최소 권한, MCP 도구 화이트리스트, 입출력 가드레일<\/li><\/ul>", "pp": "<h4>1) 단계별 위협과 대응<\/h4>\n<div class=\"tblwrap\"><table class=\"cmp\"><colgroup><col style=\"width:24%\"><col style=\"width:28%\"><col style=\"width:48%\"><\/colgroup><thead><tr><th>구분<\/th><th>위협<\/th><th>대응<\/th><\/tr><\/thead><tbody><tr><td class=\"k\">데이터<\/td><td>학습 데이터 오염·백도어 트리거<\/td><td>출처 검증·데이터 리니지, 이상 샘플 탐지, 학습 데이터 해시 관리<\/td><\/tr><tr><td class=\"k\">모델<\/td><td>사전학습 모델 변조·Pickle 역직렬화 RCE<\/td><td>Safetensors 등 안전 포맷, 모델 서명·해시 검증, 신뢰 저장소만 사용<\/td><\/tr><tr><td class=\"k\">도구·연동<\/td><td>악성 MCP 서버·플러그인, 의존성 혼동<\/td><td>도구 화이트리스트·권한 최소화, 의존성 잠금·서명 검증<\/td><\/tr><tr><td class=\"k\">배포·운영<\/td><td>API·에이전트 경유 데이터 유출<\/td><td>샌드박스·네트워크 이그레스 통제, 입출력 가드레일·감사 로그<\/td><\/tr><\/tbody><\/table><\/div>\n<h4>2) SBOM vs AI-BOM<\/h4>\n<div class=\"tblwrap\"><table class=\"cmp\"><colgroup><col style=\"width:24%\"><col style=\"width:28%\"><col style=\"width:48%\"><\/colgroup><thead><tr><th>구분<\/th><th>SBOM<\/th><th>AI-BOM (ML-BOM)<\/th><\/tr><\/thead><tbody><tr><td class=\"k\">대상<\/td><td>SW 구성요소·의존성<\/td><td>모델·데이터셋·파이프라인·라이선스<\/td><\/tr><tr><td class=\"k\">표준<\/td><td>SPDX·CycloneDX<\/td><td>CycloneDX ML-BOM·SPDX 3.0 AI<\/td><\/tr><tr><td class=\"k\">목적<\/td><td>취약점 추적·구성 파악<\/td><td>모델 출처·학습 데이터·편향 추적<\/td><\/tr><tr><td class=\"k\">과제<\/td><td>자동 생성·유지<\/td><td>표준 미성숙·도구 부재·데이터 명세 곤란<\/td><\/tr><\/tbody><\/table><\/div>\n<h4>3) 도입 고려사항<\/h4>\n<div class=\"tblwrap\"><table class=\"cmp\"><colgroup><col style=\"width:24%\"><col style=\"width:28%\"><col style=\"width:48%\"><\/colgroup><thead><tr><th>구분<\/th><th>키워드<\/th><th>설명<\/th><\/tr><\/thead><tbody><tr><td class=\"k\">정책<\/td><td>신뢰 소스<\/td><td>승인된 모델 저장소·레지스트리만 허용, 반입 시 서명 검증 게이트<\/td><\/tr><tr><td class=\"k\">개발<\/td><td>안전 기본값<\/td><td>모델 로딩 시 안전 포맷 강제, pickle 로딩 차단, 샌드박스 실행<\/td><\/tr><tr><td class=\"k\">운영<\/td><td>에이전트 권한<\/td><td>MCP 도구별 최소 권한·승인, 외부 호출 이그레스 통제<\/td><\/tr><tr><td class=\"k\">탐지<\/td><td>모델 이상행위<\/td><td>특정 입력에서만 오작동하는 백도어 탐지(Red Teaming·트리거 스캔)<\/td><\/tr><tr><td class=\"k\">거버넌스<\/td><td>계약·책임<\/td><td>공급자 보안 요구사항·SBOM 제출 의무를 계약에 반영<\/td><\/tr><\/tbody><\/table><\/div>", "rv": "<div class=\"q\"><b>두음: 데·모·도 / 명·서·샌<\/b> — 데이터·모델·도구 / AI-BOM 명세·서명 검증·샌드박스<\/div>\n<div class=\"q\"><b>\"모델도 소프트웨어다 — 출처를 명세하고, 서명을 검증하고, 격리해서 실행하라\"<\/b><\/div>", "img": "itpe-diagrams/127-ai-supply-chain.webp", "txt": null, "search": "ai 공급망 공격 (ai supply chain attack) ai 공급망 공격 ai-bom · 모델 서명 보안 공급망·devsecops ⭐⭐ 기출빈출 기출 빈출 중요 ai 공급망 공격 은 학습 데이터·사전학습 모델(pickle 역직렬화 등)·프레임워크·플러그인(mcp) 등 ai 생명주기의 외부 의존 요소에 악성 코드·백도어·편향을 삽입해 판단을 왜곡하거나 권한을 탈취하는 ai 생명주기 표적 위협 데이터 공급망 : 학습 데이터 오염(poisoning), 백도어 트리거 삽입, 라벨 조작, 크롤링 데이터 오염·저작권 문제 모델 공급망 : 공개 모델(hugging face 등) 변조, pickle(.pkl) 역직렬화 rce , 가중치 백도어 — safetensors 사용이 대응 sw·도구 공급망 : 프레임워크·라이브러리 취약점, 악성 mcp 서버·플러그인(tool poisoning) , 의존성 혼동 ai-bom : 모델·데이터셋·학습 파이프라인·라이선스 구성 명세 — sbom의 ai 확장(cyclonedx ml-bom·spdx ai) 검증 : 해시·서명(sigstore·모델 서명), 출처 증명(provenance), 가중치 스캔·안전 포맷 런타임 통제 : 샌드박스 실행, 최소 권한, mcp 도구 화이트리스트, 입출력 가드레일 1) 단계별 위협과 대응 구분 위협 대응 데이터 학습 데이터 오염·백도어 트리거 출처 검증·데이터 리니지, 이상 샘플 탐지, 학습 데이터 해시 관리 모델 사전학습 모델 변조·pickle 역직렬화 rce safetensors 등 안전 포맷, 모델 서명·해시 검증, 신뢰 저장소만 사용 도구·연동 악성 mcp 서버·플러그인, 의존성 혼동 도구 화이트리스트·권한 최소화, 의존성 잠금·서명 검증 배포·운영 api·에이전트 경유 데이터 유출 샌드박스·네트워크 이그레스 통제, 입출력 가드레일·감사 로그 2) sbom vs ai-bom 구분 sbom ai-bom (ml-bom) 대상 sw 구성요소·의존성 모델·데이터셋·파이프라인·라이선스 표준 spdx·cyclonedx cyclonedx ml-bom·spdx 3.0 ai 목적 취약점 추적·구성 파악 모델 출처·학습 데이터·편향 추적 과제 자동 생성·유지 표준 미성숙·도구 부재·데이터 명세 곤란 3) 도입 고려사항 구분 키워드 설명 정책 신뢰 소스 승인된 모델 저장소·레지스트리만 허용, 반입 시 서명 검증 게이트 개발 안전 기본값 모델 로딩 시 안전 포맷 강제, pickle 로딩 차단, 샌드박스 실행 운영 에이전트 권한 mcp 도구별 최소 권한·승인, 외부 호출 이그레스 통제 탐지 모델 이상행위 특정 입력에서만 오작동하는 백도어 탐지(red teaming·트리거 스캔) 거버넌스 계약·책임 공급자 보안 요구사항·sbom 제출 의무를 계약에 반영 두음: 데·모·도 / 명·서·샌 — 데이터·모델·도구 / ai-bom 명세·서명 검증·샌드박스 \"모델도 소프트웨어다 — 출처를 명세하고, 서명을 검증하고, 격리해서 실행하라\""}, {"id": "prompt-inj", "cat": "sec", "sub": "sec-industry", "parent": null, "t": "프롬프트 인젝션 · 가드레일", "s": "직·간 / 입·권·출", "stars": 3, "redStar": false, "full": "프롬프트 인젝션과 가드레일(Guardrails)", "catLabel": "보안", "st": "📌 복습 필요", "d": "2026-11-22", "def": "<ul class=\"kw\"><li><b>프롬프트 인젝션 (Prompt Injection)<\/b>: 공격자가 악의적 지시문을 주입해 LLM의 <b>원래 시스템 프롬프트·보안 정책을 우회<\/b>하고 비인가 동작·정보 유출을 유발하는 공격 (OWASP LLM Top 10 1위)<\/li><li><b>가드레일 (Guardrails)<\/b>: LLM 입출력 전후 단계에서 <b>인젝션·유해 콘텐츠·개인정보 유출·환각<\/b>을 실시간 탐지·차단하는 다계층 방어 체계<\/li><\/ul>", "kw": "<ul class=\"kw\"><li><b>공격 유형 (직·간)<\/b>:<ul class=\"kw\"><li><b>Direct Injection<\/b>: 사용자 입력창에 탈옥(Jailbreak)·역할극으로 직접 지침 무력화<\/li><li><b>Indirect Injection<\/b>: 외부 웹·문서·RAG·MCP 도구 응답에 악성 명령을 숨겨 에이전트가 간접 실행<\/li><\/ul><\/li><li><b>가드레일 다계층 방어 (입·권·출)<\/b>: <b>Input Guardrail<\/b>(분류기·PII 마스킹) → <b>권한·경계 분리<\/b>(System/Data 구분·도구 실행 승인·샌드박싱) → <b>Output Guardrail<\/b>(유해성·비밀정보 유출·환각 검증)<\/li><\/ul>", "pp": "<div class=\"tblwrap\"><table class=\"cmp\"><colgroup><col style=\"width:24%\"><col style=\"width:28%\"><col style=\"width:48%\"><\/colgroup><thead><tr><th>관점(측면)<\/th><th>특징<\/th><th>설명<\/th><\/tr><\/thead><tbody><tr><td class=\"k\">공격 경로 관점<\/td><td>Direct vs Indirect<\/td><td>직접 입력 탈옥뿐 아니라 RAG 문서·이메일·MCP를 통한 간접 공격(에이전트 탈취) 위험 확대<\/td><\/tr><tr><td class=\"k\">입력 통제 관점<\/td><td>Input Guardrail<\/td><td>인젝션 탐지 모델, 정규식·키워드 필터, 개인정보(PII) 비식별화로 악성 프롬프트 사전 차단<\/td><\/tr><tr><td class=\"k\">실행·권한 관점<\/td><td>Sandboxing · HITL<\/td><td>시스템 지침과 외부 데이터 격리, 민감 API/도구 호출 시 최소 권한 및 사용자 승인(Human-in-the-Loop)<\/td><\/tr><tr><td class=\"k\">출력 통제 관점<\/td><td>Output Guardrail<\/td><td>시스템 프롬프트·API 키 유출 차단, 사실성(Grounding)·유해성 검증 후 응답 전달<\/td><\/tr><\/tbody><\/table><\/div>", "rv": "<div class=\"q\"><b>두음: 직·간 / 입·권·출<\/b> — 직접·간접 인젝션 / 입력가드레일·권한분리(샌드박스)·출력가드레일<\/div>\n<div class=\"q\"><b>OWASP LLM Top 10 1순위<\/b>이며 <b>에이전틱 AI·RAG·MCP<\/b>와 연계 출제 1순위!<\/div>", "img": "itpe-diagrams/78-prompt-injection-guardrails.webp", "txt": null, "search": "프롬프트 인젝션과 가드레일(guardrails) 프롬프트 인젝션 · 가드레일 직·간 / 입·권·출 보안 ai·산업 보안 ⭐⭐⭐ 기출빈출 기출 빈출 중요 프롬프트 인젝션 (prompt injection) : 공격자가 악의적 지시문을 주입해 llm의 원래 시스템 프롬프트·보안 정책을 우회 하고 비인가 동작·정보 유출을 유발하는 공격 (owasp llm top 10 1위) 가드레일 (guardrails) : llm 입출력 전후 단계에서 인젝션·유해 콘텐츠·개인정보 유출·환각 을 실시간 탐지·차단하는 다계층 방어 체계 공격 유형 (직·간) : direct injection : 사용자 입력창에 탈옥(jailbreak)·역할극으로 직접 지침 무력화 indirect injection : 외부 웹·문서·rag·mcp 도구 응답에 악성 명령을 숨겨 에이전트가 간접 실행 가드레일 다계층 방어 (입·권·출) : input guardrail (분류기·pii 마스킹) → 권한·경계 분리 (system/data 구분·도구 실행 승인·샌드박싱) → output guardrail (유해성·비밀정보 유출·환각 검증) 관점(측면) 특징 설명 공격 경로 관점 direct vs indirect 직접 입력 탈옥뿐 아니라 rag 문서·이메일·mcp를 통한 간접 공격(에이전트 탈취) 위험 확대 입력 통제 관점 input guardrail 인젝션 탐지 모델, 정규식·키워드 필터, 개인정보(pii) 비식별화로 악성 프롬프트 사전 차단 실행·권한 관점 sandboxing · hitl 시스템 지침과 외부 데이터 격리, 민감 api/도구 호출 시 최소 권한 및 사용자 승인(human-in-the-loop) 출력 통제 관점 output guardrail 시스템 프롬프트·api 키 유출 차단, 사실성(grounding)·유해성 검증 후 응답 전달 두음: 직·간 / 입·권·출 — 직접·간접 인젝션 / 입력가드레일·권한분리(샌드박스)·출력가드레일 owasp llm top 10 1순위 이며 에이전틱 ai·rag·mcp 와 연계 출제 1순위!"}, {"id": "public-saas-sec", "cat": "sec", "sub": "sec-cloud", "parent": null, "t": "공공 SaaS 보안", "s": "CSAP·책임공유·SLA", "stars": 0, "redStar": true, "full": "공공 클라우드(SaaS) 보안 가이드라인 · 안전성 검토", "catLabel": "보안", "st": "📌 복습 필요", "d": "2026-11-23", "def": "<p>국가·지방자치단체·공공기관이 <b>SaaS를 안전하고 효율적으로 도입·이용<\/b>하기 위해 <b>보안 인증(CSAP)·보안대책 수립·보안성 검토·서비스 수준 협약(SLA)<\/b>으로 위험을 통제하는 공공 SaaS 보안 체계<\/p>", "kw": "<ul class=\"kw\"><li><b>클라우드 서비스 보안 관리·인증<\/b>: <b>CSAP<\/b>(클라우드 보안인증, SaaS 표준등급제) — 상·중·하 등급, 국정원·과기정통부 고시 기준<\/li><li><b>보안대책 수립<\/b>: 데이터 분류·위험평가, <b>책임공유모델(Shared Responsibility)<\/b>로 사업자·이용기관 책임 경계 명확화<\/li><li><b>보안성 검토<\/b>: 정보시스템 보안성 검토, 개인정보 영향평가(PIA), 망 보안체계(N2SF) 적용, 국외 이전 제한(국내 리전)<\/li><li><b>서비스 수준 협약(SLA)<\/b>: 가용성·복구목표(RTO/RPO)·<b>데이터 반출(Exit) 절차<\/b>·감사권·위약금·서비스 종료 시 데이터 파기<\/li><li><b>추가 통제<\/b>: SSO·MFA·최소권한, 감사로그 보존·모니터링, 공급망 보안(SBOM), 장애·침해 대응 절차<\/li><\/ul>", "pp": "<h4>1) 관점별 구성 (가이드라인 3축)<\/h4>\n<div class=\"tblwrap\"><table class=\"cmp\"><colgroup><col style=\"width:24%\"><col style=\"width:28%\"><col style=\"width:48%\"><\/colgroup><thead><tr><th>관점(측면)<\/th><th>특징<\/th><th>설명<\/th><\/tr><\/thead><tbody><tr><td class=\"k\">관리·인증<\/td><td>CSAP·등급제<\/td><td>보안인증 취득·등급 확인으로 사업자 신뢰성 검증<\/td><\/tr><tr><td class=\"k\">보안대책<\/td><td>책임공유모델<\/td><td>데이터 분류·위험평가 후 사업자/이용기관 통제항목 배분<\/td><\/tr><tr><td class=\"k\">보안성 검토<\/td><td>사전 위험 검증<\/td><td>보안성 검토·PIA·N2SF로 도입 전 위험 식별<\/td><\/tr><tr><td class=\"k\">계약·SLA<\/td><td>반출·종료 보장<\/td><td>RTO/RPO·Exit·데이터 파기·감사권을 계약에 명문화<\/td><\/tr><tr><td class=\"k\">운영<\/td><td>모니터링·대응<\/td><td>계정·권한·로그 관리, 침해사고 공동 대응 체계<\/td><\/tr><\/tbody><\/table><\/div>", "rv": "<div class=\"q\"><b>두음: 인·책·검·협<\/b> — 보안인증(CSAP) · 책임공유 · 보안성검토 · SLA 협약<\/div>\n<div class=\"q\"><b>\"공공 SaaS 3대 확인\"<\/b> — ① CSAP 등급 ② 책임공유모델 ③ Exit(데이터 반출·파기) 조항!<\/div>", "img": "itpe-diagrams/101-public-saas-sec.webp", "txt": null, "search": "공공 클라우드(saas) 보안 가이드라인 · 안전성 검토 공공 saas 보안 csap·책임공유·sla 보안 클라우드·네트워크 보안 빨간별 빨간 별 빨간색 별 ★ 레드별 심화반 심화 선택 국가·지방자치단체·공공기관이 saas를 안전하고 효율적으로 도입·이용 하기 위해 보안 인증(csap)·보안대책 수립·보안성 검토·서비스 수준 협약(sla) 으로 위험을 통제하는 공공 saas 보안 체계 클라우드 서비스 보안 관리·인증 : csap (클라우드 보안인증, saas 표준등급제) — 상·중·하 등급, 국정원·과기정통부 고시 기준 보안대책 수립 : 데이터 분류·위험평가, 책임공유모델(shared responsibility) 로 사업자·이용기관 책임 경계 명확화 보안성 검토 : 정보시스템 보안성 검토, 개인정보 영향평가(pia), 망 보안체계(n2sf) 적용, 국외 이전 제한(국내 리전) 서비스 수준 협약(sla) : 가용성·복구목표(rto/rpo)· 데이터 반출(exit) 절차 ·감사권·위약금·서비스 종료 시 데이터 파기 추가 통제 : sso·mfa·최소권한, 감사로그 보존·모니터링, 공급망 보안(sbom), 장애·침해 대응 절차 1) 관점별 구성 (가이드라인 3축) 관점(측면) 특징 설명 관리·인증 csap·등급제 보안인증 취득·등급 확인으로 사업자 신뢰성 검증 보안대책 책임공유모델 데이터 분류·위험평가 후 사업자/이용기관 통제항목 배분 보안성 검토 사전 위험 검증 보안성 검토·pia·n2sf로 도입 전 위험 식별 계약·sla 반출·종료 보장 rto/rpo·exit·데이터 파기·감사권을 계약에 명문화 운영 모니터링·대응 계정·권한·로그 관리, 침해사고 공동 대응 체계 두음: 인·책·검·협 — 보안인증(csap) · 책임공유 · 보안성검토 · sla 협약 \"공공 saas 3대 확인\" — ① csap 등급 ② 책임공유모델 ③ exit(데이터 반출·파기) 조항!"}, {"id": "autonomous-ship", "cat": "sec", "sub": "sec-industry", "parent": null, "t": "자율운항선박 (MASS)", "s": "IMO 등급 · SAN·INS · E26/E27", "stars": 0, "redStar": true, "full": "자율운항선박 (MASS)", "catLabel": "보안", "st": "📌 복습 필요", "d": "2026-11-23", "def": "<p><b>IMO 자율화 등급<\/b>에 따라 선박이 사람의 개입 없이 항해·조타·기관제어를 수행하고, 육상 원격관제와 연계해 안전·효율을 높이는 지능형 선박(MASS, Maritime Autonomous Surface Ship)<\/p>", "kw": "<ul class=\"kw\"><li><b>IMO 자율화 등급<\/b>: 1등급(의사결정 지원·선원 승선) → 2등급(원격제어·선원 부분 승선) → 3등급(완전 무인 원격제어) → 4등급(완전 자율) — <b>MASS Code<\/b> 논의(2028 발효 목표)<\/li><li><b>SAN (Ship Area Network)<\/b>: 선내 항해·기관·화물 제어망을 통합·분리한 <b>선내 통합 네트워크<\/b> — OT/IT 융합, 망 분할·구간 격리<\/li><li><b>INS (Integrated Navigation System)<\/b>: 레이더·AIS·GPS·ECDIS 등 항해센서를 통합해 <b>항로·충돌회피 정보<\/b>를 제공하는 통합 항해시스템<\/li><li><b>7대 사이버보안<\/b>: IACS UR <b>E26(선박)·E27(장비)<\/b>, IMO MSC-FAL.1/Circ.3 기반 — 위험평가·네트워크 분할·원격접속 통제·SW 무결성·모니터링·복구·교육<\/li><li><b>핵심기술<\/b>: 센서 융합·상황인식·충돌회피(CAS)·원격관제·디지털 트윈<\/li><\/ul>", "pp": "<h4>1) 관점별 구성<\/h4>\n<div class=\"tblwrap\"><table class=\"cmp\"><colgroup><col style=\"width:24%\"><col style=\"width:28%\"><col style=\"width:48%\"><\/colgroup><thead><tr><th>관점(측면)<\/th><th>특징<\/th><th>설명<\/th><\/tr><\/thead><tbody><tr><td class=\"k\">자율화 등급<\/td><td>1~4등급<\/td><td>지원→원격제어→무인원격→완전자율, 등급별 승선·책임 범위 결정<\/td><\/tr><tr><td class=\"k\">선내 네트워크<\/td><td>SAN<\/td><td>항해·기관·화물망 통합·분리, OT/IT 융합 보안 경계<\/td><\/tr><tr><td class=\"k\">항해 통합<\/td><td>INS·센서융합<\/td><td>레이더·AIS·GPS·ECDIS 통합으로 충돌회피·항로 최적화<\/td><\/tr><tr><td class=\"k\">사이버보안<\/td><td>E26·E27<\/td><td>위험평가·분할·원격통제·무결성·모니터링·복구·교육 7대 항목<\/td><\/tr><tr><td class=\"k\">과제<\/td><td>규제·검증<\/td><td>MASS Code, 원격조종자 책임·법적 지위, 시험운항 근거<\/td><\/tr><\/tbody><\/table><\/div>", "rv": "<div class=\"q\"><b>두음: 1지·2원·3무·4자<\/b> — 1등급 지원 · 2등급 원격(승선) · 3등급 무인원격 · 4등급 완전자율<\/div>\n<div class=\"q\"><b>SAN = 선내망, INS = 항해통합<\/b>, 보안은 <b>E26(선박)·E27(장비)<\/b>로 확인!<\/div>", "img": "itpe-diagrams/104-autonomous-ship.webp", "txt": null, "search": "자율운항선박 (mass) 자율운항선박 (mass) imo 등급 · san·ins · e26/e27 보안 ai·산업 보안 빨간별 빨간 별 빨간색 별 ★ 레드별 심화반 심화 선택 imo 자율화 등급 에 따라 선박이 사람의 개입 없이 항해·조타·기관제어를 수행하고, 육상 원격관제와 연계해 안전·효율을 높이는 지능형 선박(mass, maritime autonomous surface ship) imo 자율화 등급 : 1등급(의사결정 지원·선원 승선) → 2등급(원격제어·선원 부분 승선) → 3등급(완전 무인 원격제어) → 4등급(완전 자율) — mass code 논의(2028 발효 목표) san (ship area network) : 선내 항해·기관·화물 제어망을 통합·분리한 선내 통합 네트워크 — ot/it 융합, 망 분할·구간 격리 ins (integrated navigation system) : 레이더·ais·gps·ecdis 등 항해센서를 통합해 항로·충돌회피 정보 를 제공하는 통합 항해시스템 7대 사이버보안 : iacs ur e26(선박)·e27(장비) , imo msc-fal.1/circ.3 기반 — 위험평가·네트워크 분할·원격접속 통제·sw 무결성·모니터링·복구·교육 핵심기술 : 센서 융합·상황인식·충돌회피(cas)·원격관제·디지털 트윈 1) 관점별 구성 관점(측면) 특징 설명 자율화 등급 1~4등급 지원→원격제어→무인원격→완전자율, 등급별 승선·책임 범위 결정 선내 네트워크 san 항해·기관·화물망 통합·분리, ot/it 융합 보안 경계 항해 통합 ins·센서융합 레이더·ais·gps·ecdis 통합으로 충돌회피·항로 최적화 사이버보안 e26·e27 위험평가·분할·원격통제·무결성·모니터링·복구·교육 7대 항목 과제 규제·검증 mass code, 원격조종자 책임·법적 지위, 시험운항 근거 두음: 1지·2원·3무·4자 — 1등급 지원 · 2등급 원격(승선) · 3등급 무인원격 · 4등급 완전자율 san = 선내망, ins = 항해통합 , 보안은 e26(선박)·e27(장비) 로 확인!"}, {"id": "blockchain-cbdc", "cat": "sec", "sub": "sec-industry", "parent": null, "t": "블록체인 유형 · CBDC", "s": "퍼·프·컨 / 2계층 구조", "stars": 0, "redStar": true, "full": "블록체인 네트워크 유형 · CBDC", "catLabel": "보안", "st": "📌 복습 필요", "d": "2026-11-23", "def": "<p>블록체인 네트워크를 <b>참여 권한<\/b>에 따라 <b>퍼블릭(무허가)·프라이빗(허가)·컨소시엄<\/b>으로 구분하고, 중앙은행이 발행하는 디지털 법화인 <b>CBDC(중앙은행 디지털화폐)<\/b>의 설계·보안 체계<\/p>", "kw": "<ul class=\"kw\"><li><b>퍼블릭(Permissionless)<\/b>: 누구나 참여·검증, 익명성·탈중앙성 — 느린 처리·높은 수수료 (Bitcoin·Ethereum)<\/li><li><b>프라이빗(Permissioned)<\/b>: 단일 기관이 통제, 고성능·프라이버시 — 신뢰 분산 한계 (Hyperledger Fabric 채널)<\/li><li><b>컨소시엄(Consortium)<\/b>: 다수 기관이 합의 운영 — 반중앙 구조로 처리성능·거버넌스 균형 (금융권 연합)<\/li><li><b>CBDC 설계<\/b>: 중앙은행 발행 디지털 법화, <b>2계층 구조<\/b>(중앙은행-중개기관), <b>계정기반 vs 토큰기반<\/b>, 오프라인 결제·프로그래머블 머니<\/li><li><b>고려사항<\/b>: 프라이버시 vs AML/CFT, 이중지급 방지, 예금 이탈(Disintermediation), 국경 간 결제(mBridge·Agora)<\/li><\/ul>", "pp": "<h4>1) 개념 비교 (네트워크 3유형)<\/h4>\n<div class=\"tblwrap\"><table class=\"cmp\"><thead><tr><th>비교<\/th><th>퍼블릭<\/th><th>프라이빗<\/th><th>컨소시엄<\/th><\/tr><\/thead><tbody><tr><td class=\"k\">참여 권한<\/td><td>무허가(누구나)<\/td><td>허가(단일 기관)<\/td><td>허가(다수 기관)<\/td><\/tr><tr><td class=\"k\">신뢰 구조<\/td><td>완전 탈중앙<\/td><td>중앙 통제<\/td><td>부분 탈중앙·합의<\/td><\/tr><tr><td class=\"k\">성능·특성<\/td><td>느림·투명<\/td><td>빠름·폐쇄<\/td><td>균형·거버넌스<\/td><\/tr><\/tbody><\/table><\/div>\n<h4>2) 상세 비교 (적용·보안 관점)<\/h4>\n<div class=\"tblwrap\"><table class=\"cmp\"><colgroup><col style=\"width:24%\"><col style=\"width:28%\"><col style=\"width:48%\"><\/colgroup><thead><tr><th>구분<\/th><th>특징<\/th><th>설명<\/th><\/tr><\/thead><tbody><tr><td class=\"k\">합의 방식<\/td><td>PoW·PoS vs PBFT·Raft<\/td><td>퍼블릭은 확률적 합의, 허가는 비잔틴·투표형 합의<\/td><\/tr><tr><td class=\"k\">프라이버시<\/td><td>익명 vs 기관 통제<\/td><td>퍼블릭은 추적 어려움, 허가는 접근제어로 통제<\/td><\/tr><tr><td class=\"k\">CBDC 접목<\/td><td>컨소시엄·프라이빗<\/td><td>중개기관 연합 구조, 감독·통제 가능성 확보<\/td><\/tr><\/tbody><\/table><\/div>", "rv": "<div class=\"q\"><b>두음: 퍼·프·컨<\/b> — 퍼블릭(무허가·투명) · 프라이빗(단일·폐쇄) · 컨소시엄(다자·합의)<\/div>\n<div class=\"q\"><b>CBDC = \"디지털 법화 + 2계층 구조\"<\/b>, 프라이버시와 AML/CFT의 균형이 핵심 쟁점!<\/div>", "img": "itpe-diagrams/106-blockchain-cbdc.webp", "txt": null, "search": "블록체인 네트워크 유형 · cbdc 블록체인 유형 · cbdc 퍼·프·컨 / 2계층 구조 보안 ai·산업 보안 빨간별 빨간 별 빨간색 별 ★ 레드별 심화반 심화 선택 블록체인 네트워크를 참여 권한 에 따라 퍼블릭(무허가)·프라이빗(허가)·컨소시엄 으로 구분하고, 중앙은행이 발행하는 디지털 법화인 cbdc(중앙은행 디지털화폐) 의 설계·보안 체계 퍼블릭(permissionless) : 누구나 참여·검증, 익명성·탈중앙성 — 느린 처리·높은 수수료 (bitcoin·ethereum) 프라이빗(permissioned) : 단일 기관이 통제, 고성능·프라이버시 — 신뢰 분산 한계 (hyperledger fabric 채널) 컨소시엄(consortium) : 다수 기관이 합의 운영 — 반중앙 구조로 처리성능·거버넌스 균형 (금융권 연합) cbdc 설계 : 중앙은행 발행 디지털 법화, 2계층 구조 (중앙은행-중개기관), 계정기반 vs 토큰기반 , 오프라인 결제·프로그래머블 머니 고려사항 : 프라이버시 vs aml/cft, 이중지급 방지, 예금 이탈(disintermediation), 국경 간 결제(mbridge·agora) 1) 개념 비교 (네트워크 3유형) 비교 퍼블릭 프라이빗 컨소시엄 참여 권한 무허가(누구나) 허가(단일 기관) 허가(다수 기관) 신뢰 구조 완전 탈중앙 중앙 통제 부분 탈중앙·합의 성능·특성 느림·투명 빠름·폐쇄 균형·거버넌스 2) 상세 비교 (적용·보안 관점) 구분 특징 설명 합의 방식 pow·pos vs pbft·raft 퍼블릭은 확률적 합의, 허가는 비잔틴·투표형 합의 프라이버시 익명 vs 기관 통제 퍼블릭은 추적 어려움, 허가는 접근제어로 통제 cbdc 접목 컨소시엄·프라이빗 중개기관 연합 구조, 감독·통제 가능성 확보 두음: 퍼·프·컨 — 퍼블릭(무허가·투명) · 프라이빗(단일·폐쇄) · 컨소시엄(다자·합의) cbdc = \"디지털 법화 + 2계층 구조\" , 프라이버시와 aml/cft의 균형이 핵심 쟁점!"}, {"id": "http3", "cat": "net", "sub": "net-proto", "parent": null, "t": "HTTP/3 & QUIC", "s": "UDP 기반 차세대 HTTP", "stars": 0, "redStar": false, "full": "HTTP/3 & QUIC 프로토콜", "catLabel": "보안·네트워크", "st": "📌 복습 필요", "d": "2026-11-19", "def": "<p>기존 TCP의 지연과 병목 한계를 극복하기 위해 <b>UDP 기반의 QUIC(Quick UDP Internet Connections) 프로토콜<\/b> 위에서 동작하도록 설계된 차세대 HTTP 표준<\/p>", "kw": "<ul class=\"kw\"><li><b>TCP HOL Blocking 해소<\/b><ul class=\"kw\"><li>HTTP/2는 다중 스트림을 써도 하위 TCP에서 패킷 1개 유실 시 전체 스트림이 대기<\/li><li>QUIC은 <b>스트림별 독립 처리<\/b>로 병목 제거<\/li><\/ul><\/li><li><b>연결 지연 단축 (0-RTT / 1-RTT)<\/b><ul class=\"kw\"><li>TCP 3-way handshake + TLS 과정을 통합해 초기 <b>1-RTT<\/b><\/li><li>재연결 시 <b>0-RTT<\/b>로 즉시 전송<\/li><\/ul><\/li><li><b>보안 내장<\/b><ul class=\"kw\"><li><b>TLS 1.3<\/b>이 프로토콜 계층에 기본 통합<\/li><li>전송 구간 암호화 강제<\/li><\/ul><\/li><li><b>Connection Migration<\/b><ul class=\"kw\"><li>IP가 바뀌어도(Wi-Fi ↔ 5G 전환 등) <b>Connection ID<\/b> 기반으로 세션 끊김 없이 연결 유지<\/li><\/ul><\/li><\/ul>", "pp": "<div class=\"tblwrap\"><table class=\"cmp\"><colgroup><col style=\"width:24%\"><col style=\"width:28%\"><col style=\"width:48%\"><\/colgroup><thead><tr><th>관점(측면)<\/th><th>특징<\/th><th>설명<\/th><\/tr><\/thead><tbody><tr><td class=\"k\">전송 계층<\/td><td>UDP 위의 QUIC<\/td><td>TCP를 대체해 UDP 위에 신뢰성·혼잡제어를 구현한 QUIC을 전송 계층으로 사용<\/td><\/tr><tr><td class=\"k\">다중화<\/td><td>스트림 독립 처리<\/td><td>스트림별 독립 손실 복구로 HTTP/2의 TCP HOL Blocking을 해소<\/td><\/tr><tr><td class=\"k\">연결 수립<\/td><td>1-RTT / 0-RTT<\/td><td>전송·TLS 1.3 핸드셰이크를 통합해 초기 1-RTT, 재연결 0-RTT로 지연을 단축<\/td><\/tr><tr><td class=\"k\">이동성·보안<\/td><td>Connection ID·TLS 내장<\/td><td>IP가 바뀌어도 Connection ID로 세션 유지, 전 구간 암호화가 기본 적용<\/td><\/tr><\/tbody><\/table><\/div>", "rv": "<div class=\"q\"><b>두음: 홀·제·커<\/b> — 홀(HOL Blocking 해소)·제(1-RTT/0-RTT)·커(Connection ID 이전)<\/div>\n<div class=\"q\">\"TCP/IP에서 사용\"이 아니라 <b>TCP를 대체해 UDP 위에서 동작(QUIC)<\/b>한다는 점과 <b>HOL Blocking 해소 · 0-RTT · Connection ID<\/b> 3대 키워드를 꼭 함께 쓰기!<\/div>", "img": "itpe-diagrams/08-http3-quic.webp", "txt": null, "search": "http/3 & quic 프로토콜 http/3 & quic udp 기반 차세대 http 보안·네트워크 차세대 프로토콜 기존 tcp의 지연과 병목 한계를 극복하기 위해 udp 기반의 quic(quick udp internet connections) 프로토콜 위에서 동작하도록 설계된 차세대 http 표준 tcp hol blocking 해소 http/2는 다중 스트림을 써도 하위 tcp에서 패킷 1개 유실 시 전체 스트림이 대기 quic은 스트림별 독립 처리 로 병목 제거 연결 지연 단축 (0-rtt / 1-rtt) tcp 3-way handshake + tls 과정을 통합해 초기 1-rtt 재연결 시 0-rtt 로 즉시 전송 보안 내장 tls 1.3 이 프로토콜 계층에 기본 통합 전송 구간 암호화 강제 connection migration ip가 바뀌어도(wi-fi ↔ 5g 전환 등) connection id 기반으로 세션 끊김 없이 연결 유지 관점(측면) 특징 설명 전송 계층 udp 위의 quic tcp를 대체해 udp 위에 신뢰성·혼잡제어를 구현한 quic을 전송 계층으로 사용 다중화 스트림 독립 처리 스트림별 독립 손실 복구로 http/2의 tcp hol blocking을 해소 연결 수립 1-rtt / 0-rtt 전송·tls 1.3 핸드셰이크를 통합해 초기 1-rtt, 재연결 0-rtt로 지연을 단축 이동성·보안 connection id·tls 내장 ip가 바뀌어도 connection id로 세션 유지, 전 구간 암호화가 기본 적용 두음: 홀·제·커 — 홀(hol blocking 해소)·제(1-rtt/0-rtt)·커(connection id 이전) \"tcp/ip에서 사용\"이 아니라 tcp를 대체해 udp 위에서 동작(quic) 한다는 점과 hol blocking 해소 · 0-rtt · connection id 3대 키워드를 꼭 함께 쓰기!"}, {"id": "tcp-ctrl", "cat": "net", "sub": "net-proto", "parent": null, "t": "TCP 흐름·혼잡 제어", "s": "rwnd·cwnd / 슬·스·에·패", "stars": 3, "redStar": false, "full": "TCP 흐름 제어와 혼잡 제어", "catLabel": "네트워크", "st": "📌 복습 필요", "d": "2026-11-21", "def": "<p>신뢰성 있는 전송(TCP)을 위해 <b>흐름 제어<\/b>는 송·수신측 간 속도 차이로 인한 수신 버퍼 오버플로우를 방지하고, <b>혼잡 제어<\/b>는 네트워크 전체의 패킷 손실·라우터 폭주를 방지하는 전송 제어 메커니즘<\/p>", "kw": "<ul class=\"kw\"><li><b>흐름 제어 (Flow Control)<\/b>: Stop-and-Wait → <b>Sliding Window<\/b> (수신측 <code>rwnd<\/code> 크기에 맞춰 전송량 조절)<\/li><li><b>혼잡 제어 (Congestion Control)<\/b>:<ul class=\"kw\"><li><b>Slow Start<\/b>: 혼잡 윈도우(<code>cwnd<\/code>)를 1 MSS부터 <b>지수적(×2)<\/b> 증가, 임계값(ssthresh) 도달 시 회피 전환<\/li><li><b>Congestion Avoidance (AIMD)<\/b>: 가산 증가(+1 MSS)·승수 감소(×1/2)<\/li><li><b>Fast Retransmit &amp; Fast Recovery<\/b>: 3번 중복 ACK(3-Dup ACK) 수신 시 타임아웃 전 즉시 재전송 후 <code>cwnd<\/code>를 절반으로 줄여 빠른 회복<\/li><\/ul><\/li><\/ul>", "pp": "<p><b>1) 개념 비교 (비교 · 흐름 제어 · 혼잡 제어)<\/b><\/p>\n<div class=\"tblwrap\"><table class=\"cmp\"><colgroup><col style=\"width:24%\"><col style=\"width:28%\"><col style=\"width:48%\"><\/colgroup><thead><tr><th>구분<\/th><th>흐름 제어 (Flow Control)<\/th><th>혼잡 제어 (Congestion Control)<\/th><\/tr><\/thead><tbody><tr><td class=\"k\">보호 대상<\/td><td>수신 호스트의 수신 버퍼 (1:1 종단간)<\/td><td>중간 라우터·네트워크 전체 (다수 공유망)<\/td><\/tr><tr><td class=\"k\">핵심 지표<\/td><td>수신 윈도우 (rwnd, Receiver Window)<\/td><td>혼잡 윈도우 (cwnd, Congestion Window)<\/td><\/tr><tr><td class=\"k\">대표 기법<\/td><td>Stop-and-Wait · Sliding Window<\/td><td>Slow Start · AIMD · Fast Retransmit/Recovery<\/td><\/tr><tr><td class=\"k\">결정 공식<\/td><td>실제 송신량 = min(rwnd, cwnd)<\/td><td>두 제어 중 더 작은 윈도우 값으로 최종 전송량 결정<\/td><\/tr><\/tbody><\/table><\/div>\n<p><b>2) 상세 비교 (관점 · 측면)<\/b><\/p>\n<div class=\"tblwrap\"><table class=\"cmp\"><colgroup><col style=\"width:24%\"><col style=\"width:28%\"><col style=\"width:48%\"><\/colgroup><thead><tr><th>관점(측면)<\/th><th>흐름 제어 (Flow Control)<\/th><th>혼잡 제어 (Congestion Control)<\/th><\/tr><\/thead><tbody><tr><td class=\"k\">제어 시점·신호<\/td><td>매 ACK 헤더의 Window Size 필드로 수신측이 직접 통보<\/td><td>패킷 손실(Timeout) 또는 3-Dup ACK로 송신측이 간접 추정<\/td><\/tr><tr><td class=\"k\">성능·안정성<\/td><td>수신 버퍼 초과 드롭 방지 및 파이프라이닝 효율화<\/td><td>네트워크 전체 처리율(Throughput) 유지 및 붕괴 방지<\/td><\/tr><tr><td class=\"k\">발전·차세대<\/td><td>HTTP/3(QUIC)에서는 스트림별 독립 흐름 제어로 HOL 해소<\/td><td>BBR(대역폭·RTT 기반) 등 손실 기반(CUBIC) 한계 보완 알고리즘 등장<\/td><\/tr><\/tbody><\/table><\/div>", "rv": "<div class=\"q\"><b>두음: 슬·스·에·패<\/b> — 슬(Sliding Window)·스(Slow Start)·에(AIMD)·패(Fast Retransmit/Recovery)<\/div>\n<div class=\"q\"><b>수신(rwnd) vs 망(cwnd) + min(rwnd, cwnd) + 3-Dup ACK(Fast Retransmit)<\/b>!<\/div>", "img": "itpe-diagrams/48-tcp-control.webp", "txt": null, "search": "tcp 흐름 제어와 혼잡 제어 tcp 흐름·혼잡 제어 rwnd·cwnd / 슬·스·에·패 네트워크 차세대 프로토콜 ⭐⭐⭐ 기출빈출 기출 빈출 중요 신뢰성 있는 전송(tcp)을 위해 흐름 제어 는 송·수신측 간 속도 차이로 인한 수신 버퍼 오버플로우를 방지하고, 혼잡 제어 는 네트워크 전체의 패킷 손실·라우터 폭주를 방지하는 전송 제어 메커니즘 흐름 제어 (flow control) : stop-and-wait → sliding window (수신측 rwnd 크기에 맞춰 전송량 조절) 혼잡 제어 (congestion control) : slow start : 혼잡 윈도우( cwnd )를 1 mss부터 지수적(×2) 증가, 임계값(ssthresh) 도달 시 회피 전환 congestion avoidance (aimd) : 가산 증가(+1 mss)·승수 감소(×1/2) fast retransmit &amp; fast recovery : 3번 중복 ack(3-dup ack) 수신 시 타임아웃 전 즉시 재전송 후 cwnd 를 절반으로 줄여 빠른 회복 1) 개념 비교 (비교 · 흐름 제어 · 혼잡 제어) 구분 흐름 제어 (flow control) 혼잡 제어 (congestion control) 보호 대상 수신 호스트의 수신 버퍼 (1:1 종단간) 중간 라우터·네트워크 전체 (다수 공유망) 핵심 지표 수신 윈도우 (rwnd, receiver window) 혼잡 윈도우 (cwnd, congestion window) 대표 기법 stop-and-wait · sliding window slow start · aimd · fast retransmit/recovery 결정 공식 실제 송신량 = min(rwnd, cwnd) 두 제어 중 더 작은 윈도우 값으로 최종 전송량 결정 2) 상세 비교 (관점 · 측면) 관점(측면) 흐름 제어 (flow control) 혼잡 제어 (congestion control) 제어 시점·신호 매 ack 헤더의 window size 필드로 수신측이 직접 통보 패킷 손실(timeout) 또는 3-dup ack로 송신측이 간접 추정 성능·안정성 수신 버퍼 초과 드롭 방지 및 파이프라이닝 효율화 네트워크 전체 처리율(throughput) 유지 및 붕괴 방지 발전·차세대 http/3(quic)에서는 스트림별 독립 흐름 제어로 hol 해소 bbr(대역폭·rtt 기반) 등 손실 기반(cubic) 한계 보완 알고리즘 등장 두음: 슬·스·에·패 — 슬(sliding window)·스(slow start)·에(aimd)·패(fast retransmit/recovery) 수신(rwnd) vs 망(cwnd) + min(rwnd, cwnd) + 3-dup ack(fast retransmit) !"}, {"id": "tls13", "cat": "net", "sub": "net-proto", "parent": null, "t": "TLS 1.3 · mTLS", "s": "1-RTT·0-RTT·PFS / 양방향인증", "stars": 3, "redStar": false, "full": "TLS 1.3 (1-RTT·0-RTT)과 mTLS", "catLabel": "네트워크", "st": "📌 복습 필요", "d": "2026-11-21", "def": "<ul class=\"kw\"><li><b>TLS 1.3 (RFC 8446)<\/b>: 기존 TLS 1.2의 2-RTT 핸드셰이크를 <b>1-RTT(재접속 시 0-RTT)<\/b>로 단축하고, 취약 암호 알고리즘을 제거해 <b>PFS(완전 순방향 비밀성)를 강제<\/b>한 최신 전송 계층 보안 프로토콜<\/li><li><b>mTLS (Mutual TLS)<\/b>: 서버만 인증하는 단방향 TLS와 달리, <b>클라이언트와 서버가 서로의 X.509 인증서를 상호 검증<\/b>하는 양방향 인증 기법<\/li><\/ul>", "kw": "<ul class=\"kw\"><li><b>TLS 1.3 4대 개선 (일·영·피·취)<\/b>:<ul class=\"kw\"><li><b>1-RTT Handshake<\/b>: ClientHello에 Key Share를 실어 보내 1왕복 만에 키 합의 완료<\/li><li><b>0-RTT Resumption<\/b>: 이전 세션 PSK로 재접속 시 핸드셰이크 없이 즉시 암호화 데이터 전송(단, Replay Attack 주의)<\/li><li><b>PFS (완전 순방향 비밀성) 강제<\/b>: ECDHE 키 교환 필수화(장기 개인키 유출돼도 과거 세션 복호화 불가)<\/li><li><b>취약 암호 제거<\/b>: RSA 키교환·SHA-1·CBC·RC4 등 레거시 알고리즘 전면 폐기<\/li><\/ul><\/li><\/ul>", "pp": "<p><b>1) 개념 비교 (TLS 1.2 vs TLS 1.3)<\/b><\/p>\n<div class=\"tblwrap\"><table class=\"cmp\"><colgroup><col style=\"width:24%\"><col style=\"width:28%\"><col style=\"width:48%\"><\/colgroup><thead><tr><th>구분<\/th><th>TLS 1.2<\/th><th>TLS 1.3<\/th><\/tr><\/thead><tbody><tr><td class=\"k\">핸드셰이크 지연<\/td><td>2-RTT (재접속 1-RTT)<\/td><td>1-RTT (재접속 0-RTT)<\/td><\/tr><tr><td class=\"k\">암호화·PFS<\/td><td>RSA 키교환 허용(PFS 선택)<\/td><td>ECDHE 기반 PFS 강제 · 취약 암호 제거<\/td><\/tr><\/tbody><\/table><\/div>\n<p><b>2) 보안·아키텍처 관점 구성표<\/b><\/p>\n<div class=\"tblwrap\"><table class=\"cmp\"><colgroup><col style=\"width:24%\"><col style=\"width:28%\"><col style=\"width:48%\"><\/colgroup><thead><tr><th>관점(측면)<\/th><th>특징<\/th><th>설명<\/th><\/tr><\/thead><tbody><tr><td class=\"k\">상호 인증 관점<\/td><td>mTLS (양방향 검증)<\/td><td>Zero Trust · Service Mesh(Envoy Sidecar) 간 서비스 신원 검증 표준<\/td><\/tr><tr><td class=\"k\">성능·프로토콜 관점<\/td><td>HTTP/3 (QUIC) 결합<\/td><td>QUIC 내부에 TLS 1.3이 내장되어 전송+보안 1-RTT 통합 수행<\/td><\/tr><tr><td class=\"k\">보안 위협·대응<\/td><td>0-RTT Replay Attack<\/td><td>멱등성(GET) 요청에만 0-RTT 허용하거나 일회용 토큰으로 재전송 공격 차단<\/td><\/tr><\/tbody><\/table><\/div>", "rv": "<div class=\"q\"><b>두음: 일·영·피·취<\/b> — 1-RTT · 0-RTT · PFS 강제 · 취약암호 제거<\/div>\n<div class=\"q\"><b>TLS 1.3(1-RTT+PFS) + mTLS(양방향 인증서 검증, Service Mesh/Zero Trust)<\/b>!<\/div>", "img": "itpe-diagrams/71-tls13-mtls.webp", "txt": null, "search": "tls 1.3 (1-rtt·0-rtt)과 mtls tls 1.3 · mtls 1-rtt·0-rtt·pfs / 양방향인증 네트워크 차세대 프로토콜 ⭐⭐⭐ 기출빈출 기출 빈출 중요 tls 1.3 (rfc 8446) : 기존 tls 1.2의 2-rtt 핸드셰이크를 1-rtt(재접속 시 0-rtt) 로 단축하고, 취약 암호 알고리즘을 제거해 pfs(완전 순방향 비밀성)를 강제 한 최신 전송 계층 보안 프로토콜 mtls (mutual tls) : 서버만 인증하는 단방향 tls와 달리, 클라이언트와 서버가 서로의 x.509 인증서를 상호 검증 하는 양방향 인증 기법 tls 1.3 4대 개선 (일·영·피·취) : 1-rtt handshake : clienthello에 key share를 실어 보내 1왕복 만에 키 합의 완료 0-rtt resumption : 이전 세션 psk로 재접속 시 핸드셰이크 없이 즉시 암호화 데이터 전송(단, replay attack 주의) pfs (완전 순방향 비밀성) 강제 : ecdhe 키 교환 필수화(장기 개인키 유출돼도 과거 세션 복호화 불가) 취약 암호 제거 : rsa 키교환·sha-1·cbc·rc4 등 레거시 알고리즘 전면 폐기 1) 개념 비교 (tls 1.2 vs tls 1.3) 구분 tls 1.2 tls 1.3 핸드셰이크 지연 2-rtt (재접속 1-rtt) 1-rtt (재접속 0-rtt) 암호화·pfs rsa 키교환 허용(pfs 선택) ecdhe 기반 pfs 강제 · 취약 암호 제거 2) 보안·아키텍처 관점 구성표 관점(측면) 특징 설명 상호 인증 관점 mtls (양방향 검증) zero trust · service mesh(envoy sidecar) 간 서비스 신원 검증 표준 성능·프로토콜 관점 http/3 (quic) 결합 quic 내부에 tls 1.3이 내장되어 전송+보안 1-rtt 통합 수행 보안 위협·대응 0-rtt replay attack 멱등성(get) 요청에만 0-rtt 허용하거나 일회용 토큰으로 재전송 공격 차단 두음: 일·영·피·취 — 1-rtt · 0-rtt · pfs 강제 · 취약암호 제거 tls 1.3(1-rtt+pfs) + mtls(양방향 인증서 검증, service mesh/zero trust) !"}, {"id": "dnssec", "cat": "net", "sub": "net-proto", "parent": null, "t": "DNSSEC · DoT · DoH", "s": "섹(무인서명) / 티(853)·에이치(443)", "stars": 3, "redStar": false, "full": "DNSSEC과 DoH · DoT", "catLabel": "네트워크", "st": "📌 복습 필요", "d": "2026-11-23", "def": "<p>평문·무인증(UDP 53)으로 동작하는 기존 DNS의 <b>응답 변조(스푸핑·캐시 포이즈닝)<\/b>와 <b>질의 도청(스니핑)<\/b> 취약점을 해결하기 위해, <b>전자서명 기반 무결성·인증(DNSSEC)<\/b>과 <b>전송 구간 암호화(DoT·DoH)<\/b>를 제공하는 DNS 보안 체계<\/p>", "kw": "<ul class=\"kw\"><li><b>DNSSEC (DNS Security Extensions)<\/b>: 공개키 전자서명(<code>RRSIG<\/code>·<code>DNSKEY<\/code>·<code>DS<\/code>)으로 DNS 응답의 <b>무결성과 출처 인증<\/b> 보장 (단, 질의 내용 자체는 평문)<\/li><li><b>DoT (DNS over TLS)<\/b>: 전용 포트 <b>TCP 853<\/b>을 통해 TLS 암호화 터널로 DNS 질의/응답 전송 (네트워크 관리·차단 용이)<\/li><li><b>DoH (DNS over HTTPS)<\/b>: 표준 웹 포트 <b>TCP 443<\/b>(HTTPS)으로 DNS 패킷 캡슐화 (일반 웹 트래픽과 구분 어려워 검열 우회 가능, 기업 보안 가시성 저하 우려)<\/li><\/ul>", "pp": "<h4>1) 개념 비교 (DNSSEC vs DoT vs DoH)<\/h4>\n<div class=\"tblwrap\"><table class=\"cmp\"><thead><tr><th>비교<\/th><th>DNSSEC<\/th><th>DoT (DNS over TLS)<\/th><th>DoH (DNS over HTTPS)<\/th><\/tr><\/thead><tbody><tr><td class=\"k\">보안 목표<\/td><td>무결성 · 출처 인증<\/td><td>기밀성 (도청 방지)<\/td><td>기밀성 (도청·검열 방지)<\/td><\/tr><tr><td class=\"k\">핵심 메커니즘<\/td><td>공개키 전자서명 체인<\/td><td>TLS 암호화 터널<\/td><td>HTTPS 캡슐화<\/td><\/tr><tr><td class=\"k\">사용 포트<\/td><td>UDP/TCP 53<\/td><td>TCP 853 (전용)<\/td><td>TCP 443 (웹 공용)<\/td><\/tr><\/tbody><\/table><\/div>\n<h4>2) 상세 비교 (운영 · 보안 관점)<\/h4>\n<div class=\"tblwrap\"><table class=\"cmp\"><colgroup><col style=\"width:24%\"><col style=\"width:28%\"><col style=\"width:48%\"><\/colgroup><thead><tr><th>구분<\/th><th>특징<\/th><th>설명<\/th><\/tr><\/thead><tbody><tr><td class=\"k\">상호 보완성<\/td><td>DNSSEC + DoT/DoH<\/td><td>DoT/DoH로 전송 구간을 암호화하고, DNSSEC으로 응답 레코드 위변조를 검증해야 완전 보안<\/td><\/tr><tr><td class=\"k\">기업 보안 관점<\/td><td>DoT vs DoH 통제<\/td><td>기업 방화벽은 853 포트(DoT)로 DNS 제어 가능하나, 443(DoH)은 우회 트래픽 탐지 난이도 상승<\/td><\/tr><\/tbody><\/table><\/div>", "rv": "<div class=\"q\"><b>두음: 섹(무·인·서명) / 티(853·전용)·에이치(443·우회)<\/b><\/div>\n<div class=\"q\"><b>\"DNSSEC = 위변조 방지(평문), DoT/DoH = 도청 방지(암호화)\"<\/b> 구분이 1교시 핵심!<\/div>", "img": "itpe-diagrams/89-dnssec-doh-dot.webp", "txt": null, "search": "dnssec과 doh · dot dnssec · dot · doh 섹(무인서명) / 티(853)·에이치(443) 네트워크 차세대 프로토콜 ⭐⭐⭐ 기출빈출 기출 빈출 중요 평문·무인증(udp 53)으로 동작하는 기존 dns의 응답 변조(스푸핑·캐시 포이즈닝) 와 질의 도청(스니핑) 취약점을 해결하기 위해, 전자서명 기반 무결성·인증(dnssec) 과 전송 구간 암호화(dot·doh) 를 제공하는 dns 보안 체계 dnssec (dns security extensions) : 공개키 전자서명( rrsig · dnskey · ds )으로 dns 응답의 무결성과 출처 인증 보장 (단, 질의 내용 자체는 평문) dot (dns over tls) : 전용 포트 tcp 853 을 통해 tls 암호화 터널로 dns 질의/응답 전송 (네트워크 관리·차단 용이) doh (dns over https) : 표준 웹 포트 tcp 443 (https)으로 dns 패킷 캡슐화 (일반 웹 트래픽과 구분 어려워 검열 우회 가능, 기업 보안 가시성 저하 우려) 1) 개념 비교 (dnssec vs dot vs doh) 비교 dnssec dot (dns over tls) doh (dns over https) 보안 목표 무결성 · 출처 인증 기밀성 (도청 방지) 기밀성 (도청·검열 방지) 핵심 메커니즘 공개키 전자서명 체인 tls 암호화 터널 https 캡슐화 사용 포트 udp/tcp 53 tcp 853 (전용) tcp 443 (웹 공용) 2) 상세 비교 (운영 · 보안 관점) 구분 특징 설명 상호 보완성 dnssec + dot/doh dot/doh로 전송 구간을 암호화하고, dnssec으로 응답 레코드 위변조를 검증해야 완전 보안 기업 보안 관점 dot vs doh 통제 기업 방화벽은 853 포트(dot)로 dns 제어 가능하나, 443(doh)은 우회 트래픽 탐지 난이도 상승 두음: 섹(무·인·서명) / 티(853·전용)·에이치(443·우회) \"dnssec = 위변조 방지(평문), dot/doh = 도청 방지(암호화)\" 구분이 1교시 핵심!"}, {"id": "sdn-nfv", "cat": "net", "sub": "net-arch", "parent": null, "t": "SDN vs NFV", "s": "제·데·오 / VNF·MANO·NFVI", "stars": 3, "redStar": false, "full": "SDN과 NFV (소프트웨어 정의 네트워크 · 기능 가상화)", "catLabel": "네트워크", "st": "📌 복습 필요", "d": "2026-11-21", "def": "<ul class=\"kw\"><li><b>SDN (Software-Defined Networking)<\/b>: 네트워크 장비의 <b>제어 평면(Control Plane)과 데이터 평면(Data Plane)을 분리<\/b>해 중앙 컨트롤러에서 소프트웨어로 트래픽을 제어하는 기술<\/li><li><b>NFV (Network Functions Virtualization)<\/b>: 방화벽·로드밸런서·라우터 등 전용 하드웨어 네트워크 기능을 <b>범용 서버 위 가상화(VNF/CNF)<\/b>로 구현하는 기술<\/li><\/ul>", "kw": "<ul class=\"kw\"><li><b>SDN 핵심 (제·데·오)<\/b>: Control Plane(중앙 컨트롤러) ↔ Data Plane(스위치 전달) 분리 + <b>OpenFlow<\/b> 사우스바운드 프로토콜<\/li><li><b>NFV 3대 구성 (브·엔·마)<\/b>: <b>VNF<\/b>(가상 네트워크 기능) · <b>NFVI<\/b>(범용 서버·가상화 인프라) · <b>MANO<\/b>(통합 관리·오케스트레이션)<\/li><\/ul>", "pp": "<p><b>1) 개념 비교 (SDN vs NFV)<\/b><\/p>\n<div class=\"tblwrap\"><table class=\"cmp\"><colgroup><col style=\"width:24%\"><col style=\"width:28%\"><col style=\"width:48%\"><\/colgroup><thead><tr><th>구분<\/th><th>SDN<\/th><th>NFV<\/th><\/tr><\/thead><tbody><tr><td class=\"k\">핵심 목표<\/td><td>제어·전달 평면 분리 및 중앙 제어<\/td><td>전용 H/W 장비의 S/W 가상화 (탈종속)<\/td><\/tr><tr><td class=\"k\">주요 구성<\/td><td>SDN Controller · OpenFlow Switch<\/td><td>VNF/CNF · NFVI · NFV MANO<\/td><\/tr><tr><td class=\"k\">주 도입 효과<\/td><td>네트워크 민첩성 · 동적 경로 최적화<\/td><td>CAPEX/OPEX 절감 · 서비스 신속 배포<\/td><\/tr><\/tbody><\/table><\/div>\n<p><b>2) 운영·보안 관점 구성표<\/b><\/p>\n<div class=\"tblwrap\"><table class=\"cmp\"><colgroup><col style=\"width:24%\"><col style=\"width:28%\"><col style=\"width:48%\"><\/colgroup><thead><tr><th>관점(측면)<\/th><th>특징<\/th><th>설명<\/th><\/tr><\/thead><tbody><tr><td class=\"k\">상보적 연계 관점<\/td><td>SDN + NFV 결합<\/td><td>NFV가 가상 방화벽(VNF)을 띄우면 SDN이 트래픽 경로를 해당 VNF로 동적 유도<\/td><\/tr><tr><td class=\"k\">보안·제로트러스트<\/td><td>마이크로 세그멘테이션<\/td><td>SDN 중앙 제어로 동적 격리·정책 적용(Zero Trust 네트워크 구현 핵심)<\/td><\/tr><tr><td class=\"k\">클라우드 네이티브<\/td><td>VNF → CNF (컨테이너)<\/td><td>5G 코어·K8s 환경에서 경량 컨테이너 기반 CNF(Cloud-native NF)로 진화<\/td><\/tr><\/tbody><\/table><\/div>", "rv": "<div class=\"q\"><b>두음: 제·데·오 / 브·엔·마<\/b> — 제어·데이터·OpenFlow / VNF·NFVI·MANO<\/div>\n<div class=\"q\"><b>독립 기술이지만 상호 보완(SDN=트래픽 길 안내, NFV=가상 장비 생성)<\/b>!<\/div>", "img": "itpe-diagrams/68-sdn-nfv.webp", "txt": null, "search": "sdn과 nfv (소프트웨어 정의 네트워크 · 기능 가상화) sdn vs nfv 제·데·오 / vnf·mano·nfvi 네트워크 네트워크 아키텍처 ⭐⭐⭐ 기출빈출 기출 빈출 중요 sdn (software-defined networking) : 네트워크 장비의 제어 평면(control plane)과 데이터 평면(data plane)을 분리 해 중앙 컨트롤러에서 소프트웨어로 트래픽을 제어하는 기술 nfv (network functions virtualization) : 방화벽·로드밸런서·라우터 등 전용 하드웨어 네트워크 기능을 범용 서버 위 가상화(vnf/cnf) 로 구현하는 기술 sdn 핵심 (제·데·오) : control plane(중앙 컨트롤러) ↔ data plane(스위치 전달) 분리 + openflow 사우스바운드 프로토콜 nfv 3대 구성 (브·엔·마) : vnf (가상 네트워크 기능) · nfvi (범용 서버·가상화 인프라) · mano (통합 관리·오케스트레이션) 1) 개념 비교 (sdn vs nfv) 구분 sdn nfv 핵심 목표 제어·전달 평면 분리 및 중앙 제어 전용 h/w 장비의 s/w 가상화 (탈종속) 주요 구성 sdn controller · openflow switch vnf/cnf · nfvi · nfv mano 주 도입 효과 네트워크 민첩성 · 동적 경로 최적화 capex/opex 절감 · 서비스 신속 배포 2) 운영·보안 관점 구성표 관점(측면) 특징 설명 상보적 연계 관점 sdn + nfv 결합 nfv가 가상 방화벽(vnf)을 띄우면 sdn이 트래픽 경로를 해당 vnf로 동적 유도 보안·제로트러스트 마이크로 세그멘테이션 sdn 중앙 제어로 동적 격리·정책 적용(zero trust 네트워크 구현 핵심) 클라우드 네이티브 vnf → cnf (컨테이너) 5g 코어·k8s 환경에서 경량 컨테이너 기반 cnf(cloud-native nf)로 진화 두음: 제·데·오 / 브·엔·마 — 제어·데이터·openflow / vnf·nfvi·mano 독립 기술이지만 상호 보완(sdn=트래픽 길 안내, nfv=가상 장비 생성) !"}, {"id": "edge-computing", "cat": "net", "sub": "net-arch", "parent": null, "t": "엣지 컴퓨팅", "s": "Cloud vs Edge · MEC", "stars": 0, "redStar": true, "full": "엣지 컴퓨팅 · 지능형 엣지", "catLabel": "네트워크", "st": "📌 복습 필요", "d": "2026-11-23", "def": "<p>데이터 발생 지점(단말·기지국·공장)에 가까운 곳에서 연산·저장을 수행해 <b>지연·백홀 대역폭·전송 비용을 줄이고 실시간성<\/b>을 확보하는 분산 컴퓨팅 구조로, 클라우드의 중앙 집중 모델을 보완함<\/p>", "kw": "<ul class=\"kw\"><li><b>클라우드 vs 엣지<\/b>: 중앙 집중·대용량·비실시간 <b>vs<\/b> 분산·저지연·실시간·데이터 국지 처리<\/li><li><b>MEC (Multi-access Edge Computing)<\/b>: 통신사 기지국·교환국에 컴퓨팅을 배치, 5G UPF 로컬 분기로 초저지연 서비스 제공<\/li><li><b>지능형 엣지(Intelligent Edge)<\/b>: 엣지에 경량 AI 추론을 탑재(TinyML·NPU) — 클라우드에서 학습, 엣지에서 추론<\/li><li><b>엣지 오케스트레이션<\/b>: K8s 경량화(K3s·KubeEdge)로 대량 노드의 배포·업데이트·정책 일괄 관리<\/li><li><b>한계<\/b>: 노드별 자원 제약·이기종 환경, 대량 노드 관리·패치, 보안 경계 확대, 분산 데이터 일관성<\/li><\/ul>", "pp": "<h4>1) 개념 비교 (클라우드 vs 엣지)<\/h4>\n<div class=\"tblwrap\"><table class=\"cmp\"><colgroup><col style=\"width:24%\"><col style=\"width:28%\"><col style=\"width:48%\"><\/colgroup><thead><tr><th>비교<\/th><th>클라우드 컴퓨팅<\/th><th>엣지 컴퓨팅<\/th><\/tr><\/thead><tbody><tr><td class=\"k\">연산 위치<\/td><td>중앙 데이터센터<\/td><td>데이터 발생 지점 인근<\/td><\/tr><tr><td class=\"k\">지연<\/td><td>수십~수백 ms<\/td><td>수 ms 이하 (초저지연)<\/td><\/tr><tr><td class=\"k\">처리 대상<\/td><td>대용량·비실시간 배치<\/td><td>실시간 스트림·국지 데이터<\/td><\/tr><\/tbody><\/table><\/div>\n<h4>2) 상세 비교 (적용·운영 관점)<\/h4>\n<div class=\"tblwrap\"><table class=\"cmp\"><colgroup><col style=\"width:24%\"><col style=\"width:28%\"><col style=\"width:48%\"><\/colgroup><thead><tr><th>구분<\/th><th>클라우드 컴퓨팅<\/th><th>엣지 컴퓨팅<\/th><\/tr><\/thead><tbody><tr><td class=\"k\">자원·확장<\/td><td>무제한에 가까운 탄력성<\/td><td>노드당 제한, 수평 확장<\/td><\/tr><tr><td class=\"k\">데이터·보안<\/td><td>데이터 외부 반출<\/td><td>국지 처리로 반출 최소화<\/td><\/tr><tr><td class=\"k\">대표 활용<\/t
