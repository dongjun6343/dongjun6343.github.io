<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#f2f5fa">
<title>ITPE 마인드맵</title>
<style>
:root{
  --bg:#f2f5fa; --ink:#0f172a; --muted:#64748b; --line:#e4e9f2; --accent:#2563eb;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  --mono:"D2Coding","Nanum Gothic Coding","Noto Sans Mono CJK KR",ui-monospace,SFMono-Regular,Menlo,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR","Segoe UI",system-ui,sans-serif;
  background:var(--bg);color:var(--ink);overflow:hidden;overscroll-behavior:none;
  display:flex;flex-direction:column;height:100vh;height:100dvh;
}
button{font-family:inherit;cursor:pointer}
[hidden]{display:none !important}

/* ---------- header ---------- */
#top{position:relative;z-index:30;flex:0 0 auto;background:linear-gradient(180deg,#fff,#fafbfe);
  border-bottom:1px solid var(--line);padding:calc(7px + var(--safe-t)) 12px 6px;
  box-shadow:0 2px 12px rgba(15,23,42,.05)}
.brand{display:flex;align-items:center;gap:9px;margin-bottom:6px}
.logo{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,#1e3a8a,#2563eb);
  display:flex;align-items:center;justify-content:center;font-size:16px;flex:0 0 auto;
  box-shadow:0 2px 8px rgba(37,99,235,.28)}
.brand h1{font-size:15px;margin:0;font-weight:800;letter-spacing:-.5px;line-height:1.25}
.brand p{margin:1px 0 0;font-size:11px;color:var(--muted);letter-spacing:-.2px}
.brand p b{color:#2563eb;font-weight:700}
.gbtns{margin-left:auto;display:flex;align-items:center;gap:5px;flex:0 0 auto}
.gbtn{flex:0 0 auto;height:28px;padding:0 8px;border-radius:14px;
  border:1px solid #cfe0ff;background:#f2f7ff;color:#1d4ed8;font-size:11px;font-weight:800;
  letter-spacing:-.4px;white-space:nowrap;display:inline-flex;align-items:center;gap:3px}
.gbtn:active{background:#e3eeff}
.gbtn.gb{border-color:#bae6fd;background:#f0f9ff;color:#0369a1}
.gbtn.gb:active{background:#e0f2fe}
.gbtn.p3{border-color:#ddd6fe;background:#f5f3ff;color:#6d28d9}
.gbtn.p3:active{background:#ede9fe}

.toolbar{display:flex;align-items:center;gap:8px;margin:0 0 7px}
.seg{display:flex;background:#eef2f9;border:1px solid var(--line);border-radius:11px;padding:2px;flex:0 0 auto}
.seg button{border:0;background:none;border-radius:9px;height:27px;padding:0 9px;font-size:12px;
  font-weight:800;color:#5a6a84;letter-spacing:-.4px;white-space:nowrap;transition:background .15s,color .15s}
.seg button.on{background:#fff;color:#1d4ed8;box-shadow:0 1px 4px rgba(15,23,42,.14)}
.mapbar{display:flex;gap:5px;margin-left:auto}
.mapbar button{height:27px;border-radius:9px;border:1px solid var(--line);background:#fff;color:#3b4a63;
  font-size:11.5px;font-weight:700;padding:0 8px;letter-spacing:-.3px;white-space:nowrap}
.mapbar button:active{background:#eef4ff}

.searchwrap{position:relative}
#q{width:100%;height:38px;border-radius:11px;border:1px solid var(--line);background:#f6f8fc;
  padding:0 36px 0 34px;font-size:14px;color:var(--ink);font-family:inherit;
  -webkit-appearance:none;appearance:none}
#q::-webkit-search-cancel-button{display:none}
#q:focus{outline:none;border-color:#9dbcfb;background:#fff;box-shadow:0 0 0 3px rgba(37,99,235,.12)}
.sicon{position:absolute;left:11px;top:11px;width:16px;height:16px;color:#94a3b8;pointer-events:none}
#qclear{position:absolute;right:5px;top:5px;width:28px;height:28px;border:0;border-radius:50%;
  background:#e6ecf6;color:#5b6b84;font-size:13px;line-height:1;display:flex;align-items:center;justify-content:center}
.results{position:absolute;left:0;right:0;top:42px;background:#fff;border:1px solid var(--line);
  border-radius:12px;box-shadow:0 14px 34px rgba(15,23,42,.16);overflow-y:auto;max-height:270px;z-index:40}
.results button{display:flex;align-items:center;gap:8px;width:100%;border:0;background:#fff;
  padding:10px 12px;text-align:left;font-size:13.5px;color:#1e293b;border-bottom:1px solid #f1f4f9}
.results button:last-child{border-bottom:0}
.results button:active{background:#f3f7ff}
.results .dot{width:7px;height:7px;border-radius:50%;flex:0 0 auto}
.results .rsub{margin-left:auto;font-size:11px;color:var(--muted);flex:0 0 auto}
.results .empty{padding:12px;font-size:13px;color:var(--muted);text-align:center}

.chips{display:flex;gap:6px;overflow-x:auto;padding:7px 0 1px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;display:inline-flex;align-items:center;gap:5px;height:28px;padding:0 11px;
  border-radius:15px;border:1px solid var(--line);background:#fff;color:#3b4a63;font-size:12.5px;
  font-weight:700;white-space:nowrap;letter-spacing:-.3px;transition:background .15s,color .15s,border-color .15s}
.chip i{width:7px;height:7px;border-radius:50%;background:var(--c);display:block}
.chip.on{background:var(--c);border-color:var(--c);color:#fff;box-shadow:0 2px 8px rgba(15,23,42,.14)}
.chip.on i{background:#fff}

/* ---------- stage ---------- */
#stage{position:relative;flex:1 1 auto;overflow:hidden;touch-action:none;
  background-image:radial-gradient(circle at 1px 1px,rgba(148,163,184,.32) 1px,transparent 0);
  background-size:22px 22px;background-color:var(--bg)}
#world{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform;opacity:0}
#world.ready{opacity:1;transition:opacity .4s ease}
#world.anim{transition:transform .34s cubic-bezier(.2,.8,.2,1)}
#edges{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
#edges path{fill:none;stroke-linecap:round}
#edges .edge{stroke-width:1.7}
#edges .edge.root{stroke-width:2.2}
#edges .aedge{stroke:#9aabc4;stroke-width:1.5;stroke-dasharray:5 6;opacity:.5}
#edges .aedge.hide{opacity:0}
body.has-sel #edges .aedge:not(.on){opacity:.1}
#edges .aedge.on{stroke:#e11d48;stroke-width:2.3;stroke-dasharray:7 5;opacity:.95;
  animation:flow 1.1s linear infinite}
@keyframes flow{to{stroke-dashoffset:-24}}

.node{position:absolute;display:flex;flex-direction:column;justify-content:center;gap:2px;
  border-radius:12px;background:#fff;border:1.5px solid var(--line);padding:5px 10px;
  box-shadow:0 2px 7px rgba(15,23,42,.06);user-select:none;
  transition:left .26s cubic-bezier(.2,.8,.2,1),top .26s cubic-bezier(.2,.8,.2,1),
             opacity .18s,box-shadow .18s,border-color .18s}
.node.nnew{animation:nin .26s ease both}
@keyframes nin{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:none}}
.node .n-title{font-size:13px;font-weight:800;line-height:1.24;letter-spacing:-.45px;color:#101c31;word-break:keep-all;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.node .n-sub{font-size:10.5px;line-height:1.2;color:var(--muted);letter-spacing:-.3px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.node .st.red{color:#ef4444}
.node .st.gold{color:#d97706}

.leaf{border:1.5px solid var(--cbd);border-left:4px solid var(--c);background:var(--cbg)}
.leaf.left{text-align:right;border:1.5px solid var(--cbd);border-right:4px solid var(--c)}

.node.cat{flex-direction:row;align-items:center;gap:6px;border-radius:14px;
  background:var(--cbg);border:2px solid var(--c);box-shadow:0 3px 11px rgba(15,23,42,.09);padding:0 8px}
.node.cat .nm{flex:1;min-width:0;font-size:12px;font-weight:800;color:var(--c);letter-spacing:-.5px;line-height:1.2;
  max-height:2.4em;overflow:hidden;word-break:keep-all;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.node.cat .n-n{flex:0 0 auto;font-size:10.5px;font-weight:800;color:#fff;background:var(--c);border-radius:9px;
  min-width:19px;height:17px;padding:0 5px;display:flex;align-items:center;justify-content:center}
.node.cat .tg{flex:0 0 auto;width:11px;text-align:center;font-size:12px;font-weight:900;color:var(--c);opacity:.75}

.node.sub{flex-direction:row;align-items:center;gap:5px;border-radius:12px;background:#fff;
  border:1.5px solid var(--cbd);padding:0 7px;box-shadow:0 2px 7px rgba(15,23,42,.05)}
.node.sub.open{border-color:var(--c);background:var(--cbg)}
.node.sub .nm{flex:1;min-width:0;font-size:11.5px;font-weight:800;color:#26334a;letter-spacing:-.4px;line-height:1.22;
  max-height:2.44em;overflow:hidden;word-break:keep-all;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.node.sub .n-n{flex:0 0 auto;font-size:9.5px;font-weight:800;color:var(--c);background:var(--cbg);
  border:1px solid var(--cbd);border-radius:8px;min-width:16px;height:15px;padding:0 4px;
  display:flex;align-items:center;justify-content:center}
.node.sub .tg{flex:0 0 auto;width:10px;text-align:center;font-size:11.5px;font-weight:900;color:var(--c);opacity:.7}
.node.dim{opacity:.26;pointer-events:none}

.root{background:linear-gradient(135deg,#111c33,#27406b);border:0;border-radius:18px;
  align-items:center;text-align:center;padding:6px 10px;box-shadow:0 9px 26px rgba(15,23,42,.3)}
.root .n-title{font-size:16.5px;color:#fff;letter-spacing:-.6px}
.root .n-sub{font-size:11px;color:#b7c7e3;letter-spacing:-.1px}

body.has-sel .node:not(.sel):not(.rel){opacity:.33}
.node.sel{border-color:var(--c);box-shadow:0 0 0 3px var(--cbd),0 8px 20px rgba(15,23,42,.18);z-index:6}
.node.rel{border-color:var(--c);box-shadow:0 0 0 2px var(--cbd),0 4px 12px rgba(15,23,42,.12);z-index:4}

.ctrls{position:absolute;right:9px;bottom:calc(14px + var(--safe-b));display:flex;flex-direction:column;
  gap:7px;z-index:15}
.ctrls button{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);
  background:rgba(255,255,255,.95);color:#33455f;font-size:17px;font-weight:700;line-height:1;
  box-shadow:0 4px 13px rgba(15,23,42,.11);display:flex;align-items:center;justify-content:center;
  transition:transform .1s}
.ctrls button:active{transform:scale(.93)}
.ctrls .sm{font-size:15px}

.hint{position:absolute;left:11px;bottom:calc(16px + var(--safe-b));max-width:60%;
  font-size:11.5px;line-height:1.45;color:#5b6b84;background:rgba(255,255,255,.93);
  border:1px solid var(--line);padding:8px 10px;border-radius:11px;
  box-shadow:0 4px 13px rgba(15,23,42,.08);transition:opacity .45s;z-index:14}
.hint.hide{opacity:0;pointer-events:none}

/* ---------- tree view ---------- */
#tree{flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;
  background:#fbfcfe;padding:8px 10px calc(28px + var(--safe-b))}
.tnode{}
.trow{display:flex;align-items:center;gap:7px;width:100%;border:0;background:none;text-align:left;
  padding:8px 8px;border-radius:10px;font-size:14px;color:#1b2942;font-weight:700;letter-spacing:-.3px}
.trow:active{background:#eef4ff}
.trow .chev{flex:0 0 auto;width:13px;color:#8fa0b8;font-size:11px;transition:transform .16s}
.tnode.open>.trow .chev{transform:rotate(90deg)}
.trow .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trow .cnt{flex:0 0 auto;font-size:10.5px;font-weight:800;color:#6b7c95;background:#f0f4fa;
  border-radius:8px;padding:2px 7px}
.trow .dot{flex:0 0 auto;width:8px;height:8px;border-radius:50%}
.kids{display:none;margin-left:13px;padding-left:5px;border-left:1px dashed #e2e8f2}
.tnode.open>.kids{display:block}
.catrow{font-size:15px;font-weight:800;letter-spacing:-.5px;background:#f4f7fc;margin:6px 0 2px}
.catrow:active{background:#e8f0ff}
.subrow{font-size:13.5px;color:#33445f}
.leafrow{font-weight:600;padding-left:6px}
.leafrow .nm{font-size:13.5px;color:#1f2c43}
.leafrow .ts{flex:0 0 auto;max-width:46%;font-size:11px;font-weight:500;color:#8494ad;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.2px}
.leafrow .st{flex:0 0 auto;font-size:11px;line-height:1}
.leafrow .st.red{color:#ef4444}
.leafrow .st.gold{color:#d97706}
.leafrow.on{background:#eaf2ff}
.tnode.hide,.trow.hide{display:none}

/* ---------- sheet ---------- */
.sheet{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;justify-content:flex-end}
.sheet[hidden]{display:none}
.sheet-bg{position:absolute;inset:0;background:rgba(8,13,24,.45);opacity:0;transition:opacity .24s}
.sheet-panel{position:relative;background:#fff;border-radius:20px 20px 0 0;display:flex;flex-direction:column;
  max-height:92vh;max-height:92dvh;transform:translateY(102%);
  transition:transform .3s cubic-bezier(.2,.85,.2,1);box-shadow:0 -10px 40px rgba(8,13,24,.26)}
#sheet.open .sheet-bg,#guide.open .sheet-bg{opacity:1}
#sheet.open .sheet-panel,#guide.open .sheet-panel{transform:translateY(0)}
.grab{width:38px;height:4px;border-radius:3px;background:#dbe3ef;margin:8px auto 0;flex:0 0 auto}
.sheet-head{position:relative;padding:8px 54px 12px 16px;border-bottom:1px solid var(--line);flex:0 0 auto}
.badges{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:6px;padding-right:104px}
.badge{font-size:11px;font-weight:800;border-radius:7px;padding:3px 8px;letter-spacing:-.2px}
.badge.status{background:#f1f5f9;color:#52627b;border:1px solid #e6ebf3}
#mTitle{margin:0;font-size:19px;line-height:1.32;letter-spacing:-.7px;font-weight:800}
.sheet-head .x{position:absolute;right:12px;top:8px;width:32px;height:32px;border-radius:50%;border:0;
  background:#f0f4fa;color:#54637b;font-size:14px;display:flex;align-items:center;justify-content:center}
.sheet-head .mapbtn{position:absolute;right:50px;top:8px;height:32px;border-radius:16px;border:1px solid var(--line);
  background:#fff;color:#43536c;font-size:11.5px;font-weight:700;padding:0 10px;white-space:nowrap}
.sheet-head .mapbtn:active{background:#f1f5fb}
.sheet-body{overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;
  padding:2px 16px calc(22px + var(--safe-b));word-break:keep-all;overflow-wrap:break-word}
.sheet-body section{padding:13px 0;border-bottom:1px solid #eff3f9}
.sheet-body section:last-child{border-bottom:0}
.sheet-body h3{display:flex;align-items:center;gap:6px;margin:0 0 9px;font-size:12px;font-weight:800;
  color:#5a6a84;letter-spacing:.1px}
.sheet-body h3::before{content:"";width:3px;height:12px;border-radius:2px;background:var(--c)}

.prose p{margin:0 0 8px;font-size:14.5px;line-height:1.74;color:#1d2a42;letter-spacing:-.25px}
.prose p:last-child{margin-bottom:0}
.prose b{color:#08152b;font-weight:800}

ul.kw{list-style:none;margin:0;padding:0}
ul.kw li{position:relative;padding-left:15px;margin:0 0 8px;font-size:14px;line-height:1.68;
  color:#26334a;letter-spacing:-.25px}
ul.kw li:last-child{margin-bottom:0}
ul.kw li::before{content:"";position:absolute;left:2px;top:9px;width:5px;height:5px;border-radius:50%;
  background:var(--c);opacity:.8}
ul.kw ul.kw{margin:7px 0 2px}
ul.kw ul.kw li{font-size:13.5px;color:#3d4c65;padding-left:14px;margin-bottom:5px}
ul.kw ul.kw li::before{background:none;border:1.5px solid var(--c);opacity:.6;width:0;height:0;top:10px}
ul.kw b{color:#0d1b33;font-weight:800}
ul.kw>li>b:first-child{color:#12233d}
ul.kw li.raw{padding-left:0;margin:2px 0 10px}
ul.kw li.raw::before{display:none}

/* ---------- 관점별 구성표 표 ---------- */
.tblwrap{margin:2px 0;border:1px solid #e2e8f5;border-radius:12px;overflow:hidden;background:#fff}
table.cmp{width:100%;border-collapse:collapse;table-layout:fixed;
  font-size:12.5px;line-height:1.55;letter-spacing:-.25px;word-break:keep-all;overflow-wrap:break-word}
table.cmp th{background:#eef3fb;color:#33445f;font-size:11.5px;font-weight:800;text-align:left;
  padding:7px 8px;border-bottom:1px solid #dde5f2;white-space:nowrap}
table.cmp td{padding:8px;border-bottom:1px solid #eef2f8;vertical-align:top;color:#26334a}
table.cmp tbody tr:last-child td{border-bottom:0}
table.cmp tbody tr:nth-child(even) td{background:#fafcff}
table.cmp td.k{font-weight:800;color:#13253f}
table.cmp td code{font-size:.85em;padding:1px 4px}
@media (max-width:400px){
  table.cmp{font-size:11.5px;line-height:1.5}
  table.cmp th{font-size:10.5px;padding:6px}
  table.cmp td{padding:7px 6px}
}
.mod-acc{margin:8px 0;border:1px solid #dbe4f2;border-radius:12px;background:#fff;overflow:hidden}
.mod-acc summary{list-style:none;cursor:pointer;padding:10px 12px;display:flex;align-items:center;justify-content:space-between;gap:8px;
  font-size:13px;font-weight:800;color:#12233d;background:#f7faff;user-select:none}
.mod-acc summary::-webkit-details-marker{display:none}
.mod-acc summary .m-left{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.mod-acc summary .m-duum{font-size:11.5px;font-weight:800;color:#0369a1;background:#e0f2fe;padding:2px 7px;border-radius:999px}
.mod-acc summary .m-arr{font-size:12px;color:#64748b;transition:transform .16s}
.mod-acc[open] summary{border-bottom:1px solid #dbe4f2}
.mod-acc[open] summary .m-arr{transform:rotate(90deg)}
.mod-acc .mod-body{padding:8px}
.mod-acc .tblwrap{margin:0}

code{font-family:var(--mono);font-size:.87em;background:#eef3fa;color:#0b4a8f;padding:1.5px 5px;
  border-radius:5px;border:1px solid #e0e9f6;word-break:keep-all}

pre.code{background:#0f172a;color:#dbe6f5;border-radius:11px;padding:11px 12px;margin:7px 0 9px;
  overflow-x:auto;font-family:var(--mono);font-size:11px;line-height:1.45;white-space:pre;
  -webkit-overflow-scrolling:touch}

.figure{margin:0}
.fig{margin:0}
.fig img{display:block;width:100%;height:auto;min-height:70px;border-radius:12px;border:1px solid var(--line);
  background:#f7f9fd url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='40' height='40'><circle cx='20' cy='20' r='3' fill='%23c9d6ea'/></svg>") no-repeat center;
  cursor:zoom-in}
.fig figcaption{margin-top:6px;text-align:center;font-size:11px;color:var(--muted)}
pre.ascii{margin:0;padding:12px;background:#f8fafd;border:1px solid var(--line);border-radius:12px;
  overflow-x:auto;font-family:var(--mono);font-size:11px;line-height:1.4;color:#22304a;
  white-space:pre;letter-spacing:-.2px;-webkit-overflow-scrolling:touch}
.cap{margin-top:6px;text-align:center;font-size:11px;color:var(--muted)}

.sheet-body section.rv{background:#fffdf3;border:1px solid #f7e2ab;border-radius:14px;
  padding:12px 13px;margin:12px 0}
.sheet-body section.rv h3{color:#8a6512}
.sheet-body section.rv h3::before{background:#e0a92a}
.q{font-size:14px;line-height:1.72;color:#4c3b0d;font-weight:600;letter-spacing:-.25px}
.q b{color:#7a4c00;font-weight:800}
.q+.q{margin-top:8px;padding-top:8px;border-top:1px dashed rgba(224,169,42,.45)}

.rel{display:flex;flex-wrap:wrap;gap:7px}
.relbtn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;
  border-radius:20px;padding:7px 12px;font-size:13px;font-weight:700;color:#1c2a42;letter-spacing:-.3px;
  box-shadow:0 1px 4px rgba(15,23,42,.05)}
.relbtn:active{background:#f1f5fb}
.relbtn .dot{width:7px;height:7px;border-radius:50%;display:block}
.relbtn .arw{color:#98a6bb;font-size:11px}

/* ---------- lightbox ---------- */
#lightbox{position:fixed;inset:0;z-index:90;background:#080d18;touch-action:none;user-select:none}
#lightbox[hidden]{display:none}
#lightbox .box{position:absolute;inset:0;overflow:hidden;touch-action:none;
  display:flex;align-items:center;justify-content:center}
#lightbox img{max-width:96vw;max-height:84vh;width:auto;height:auto;display:block;border-radius:8px;
  transform-origin:center center;will-change:transform;touch-action:none;pointer-events:auto;
  box-shadow:0 8px 32px rgba(0,0,0,.45)}

td>워크로드 단위로 세분화해 횡적 이동(Lateral Movement) 경로를 차단<\/td><\/tr><tr><td class=\"k\">운영<\/td><td>지속적 인증·모니터링<\/td><td>세션 중에도 재검증하고 로그·행위 분석으로 이상 징후에 즉시 대응<\/td><\/tr><\/tbody><\/table><\/div>", "rv": "<div class=\"q\"><b>두음: 검·최·침 / 피·피·피<\/b> — 검(명시적 검증)·최(최소 권한 JIT)·침(침해 가정) / 피(PE)·피(PA)·피(PEP)<\/div>\n<div class=\"q\">\"무조건 믿지 않고 매번 체크한다\"는 핵심에 더해 <b>PE / PA / PEP<\/b>와 <b>3대 원칙<\/b> 키워드를 얹어서 답안 구성.<\/div>", "img": "itpe-diagrams/19-%EC%A0%9C%EB%A1%9C-%ED%8A%B8%EB%9F%AC%EC%8A%A4%ED%8A%B8.webp", "txt": null, "search": "제로 트러스트 (zero trust) 제로 트러스트 zero trust 보안·네트워크 암호·인증 ⭐⭐⭐ 기출빈출 기출 빈출 중요 내·외부 네트워크를 구분하지 않고 모든 접근 요청을 매번 검증 하는 보안 모델 — never trust, always verify 3대 원칙 명시적 검증(verify explicitly) — 사용자·기기·위치·행위 등 모든 데이터로 매번 인증·인가 최소 권한 부여(jit / jea) — just-in-time, just-enough-access로 필요한 만큼만 일시 부여 침해 가정(assume breach) — 이미 침해되었다고 가정하고 마이크로 세그멘테이션·모니터링 적용 nist sp 800-207 구성요소 제어 영역: pe (정책 엔진) + pa (정책 관리자) 데이터 영역: pep (정책 시행 지점) 핵심 기술 : 마이크로 세그멘테이션(micro-segmentation) , 횡적 이동(lateral movement) 차단 , 지속적 인증 관점(측면) 특징 설명 원칙 검증·최소권한·침해가정 명시적 검증, jit 최소 권한, 침해 가정 3원칙으로 내·외부 구분 없이 매번 확인 아키텍처 pe·pa·pep nist sp 800-207의 정책 엔진·정책 관리자와 정책 시행 지점을 분리한 구조 네트워크 마이크로 세그멘테이션 워크로드 단위로 세분화해 횡적 이동(lateral movement) 경로를 차단 운영 지속적 인증·모니터링 세션 중에도 재검증하고 로그·행위 분석으로 이상 징후에 즉시 대응 두음: 검·최·침 / 피·피·피 — 검(명시적 검증)·최(최소 권한 jit)·침(침해 가정) / 피(pe)·피(pa)·피(pep) \"무조건 믿지 않고 매번 체크한다\"는 핵심에 더해 pe / pa / pep 와 3대 원칙 키워드를 얹어서 답안 구성."}, {"id": "fido2", "cat": "sec", "sub": "sec-crypto", "parent": "zt", "t": "FIDO2 · Passkey", "s": "공개키 패스워드리스", "stars": 0, "redStar": false, "full": "FIDO2 (Passkey) 인증", "catLabel": "보안·네트워크", "st": "📌 복습 필요", "d": "2026-11-19", "def": "<p><b>FIDO (Fast IDentity Online)<\/b> 표준을 발전시킨 차세대 <b>패스워드리스(Passwordless)<\/b> 국제 표준 인증 체계로, 비밀번호 대신 <b>공개키(비대칭키) 암호<\/b>와 기기 내 생체·PIN 인증을 결합해 피싱·유출 위험을 원천 차단함.<\/p>", "kw": "<ul class=\"kw\"><li><b>동작 원리<\/b>: <b>개인키(Private Key)<\/b>는 단말 보안영역(<code>TPM<\/code>/<code>Secure Enclave<\/code>)에 보관·외부 유출 불가, <b>공개키(Public Key)<\/b>만 서버에 등록해 챌린지-응답 전자서명으로 검증<\/li><li><b>FIDO2 양대 프로토콜<\/b>: <b>WebAuthn<\/b>(브라우저·OS ↔ 서비스 서버 간 W3C 표준 API), <b>CTAP<\/b>(클라이언트 ↔ 외부/내장 인증장치 간 통신 프로토콜)<\/li><li><b>Passkey(패스키)<\/b>: FIDO2 기반 자격증명을 클라우드 키체인 등으로 <b>멀티 디바이스 동기화<\/b>해 기기 교체 시에도 사용 가능하게 확장한 형태<\/li><li><b>보안 효과<\/b>: 도메인 바인딩으로 <b>피싱 방어<\/b>, 서버에 비밀번호 미저장으로 <b>크리덴셜 스터핑 차단<\/b><\/li><\/ul>", "pp": "<div class=\"tblwrap\"><table class=\"cmp\"><colgroup><col style=\"width:24%\"><col style=\"width:28%\"><col style=\"width:48%\"><\/colgroup><thead><tr><th>관점(측면)<\/th><th>특징<\/th><th>설명<\/th><\/tr><\/thead><tbody><tr><td class=\"k\">표준·프로토콜<\/td><td>WebAuthn + CTAP<\/td><td>브라우저·서버 간은 W3C WebAuthn, 클라이언트·인증장치 간은 CTAP으로 계층을 분리해 표준화<\/td><\/tr><tr><td class=\"k\">키 관리<\/td><td>개인키 단말 보관<\/td><td>개인키는 <code>TPM<\/code>·<code>Secure Enclave<\/code>에 두고 공개키만 서버에 등록해 챌린지-서명으로 검증<\/td><\/tr><tr><td class=\"k\">사용자 경험<\/td><td>패스키 동기화<\/td><td>클라우드 키체인으로 자격증명을 동기화해 기기 교체·멀티 디바이스에서도 생체·PIN으로 로그인<\/td><\/tr><tr><td class=\"k\">위협 대응<\/td><td>피싱·재사용 차단<\/td><td>도메인 바인딩으로 피싱 사이트를 막고, 서버에 비밀번호를 저장하지 않아 크리덴셜 스터핑을 원천 차단<\/td><\/tr><\/tbody><\/table><\/div>", "rv": "<div class=\"q\"><b>두음: 단·서·웹·탭·패<\/b> — 단(단말 개인키 보관)·서(서버 공개키 등록)·웹(WebAuthn)·탭(CTAP)·패(Passkey 동기화)<\/div>\n<div class=\"q\">\"단말(개인키)·서버(공개키) 비대칭키 + <b>WebAuthn(서버-클라)<\/b> + <b>CTAP(클라-인증장치)<\/b>\" 3요소를 반드시 그림과 함께 쓰기!<\/div>", "img": "itpe-diagrams/18-fido2-passkey.webp", "txt": null, "search": "fido2 (passkey) 인증 fido2 · passkey 공개키 패스워드리스 보안·네트워크 암호·인증 fido (fast identity online) 표준을 발전시킨 차세대 패스워드리스(passwordless) 국제 표준 인증 체계로, 비밀번호 대신 공개키(비대칭키) 암호 와 기기 내 생체·pin 인증을 결합해 피싱·유출 위험을 원천 차단함. 동작 원리 : 개인키(private key) 는 단말 보안영역( tpm / secure enclave )에 보관·외부 유출 불가, 공개키(public key) 만 서버에 등록해 챌린지-응답 전자서명으로 검증 fido2 양대 프로토콜 : webauthn (브라우저·os ↔ 서비스 서버 간 w3c 표준 api), ctap (클라이언트 ↔ 외부/내장 인증장치 간 통신 프로토콜) passkey(패스키) : fido2 기반 자격증명을 클라우드 키체인 등으로 멀티 디바이스 동기화 해 기기 교체 시에도 사용 가능하게 확장한 형태 보안 효과 : 도메인 바인딩으로 피싱 방어 , 서버에 비밀번호 미저장으로 크리덴셜 스터핑 차단 관점(측면) 특징 설명 표준·프로토콜 webauthn + ctap 브라우저·서버 간은 w3c webauthn, 클라이언트·인증장치 간은 ctap으로 계층을 분리해 표준화 키 관리 개인키 단말 보관 개인키는 tpm · secure enclave 에 두고 공개키만 서버에 등록해 챌린지-서명으로 검증 사용자 경험 패스키 동기화 클라우드 키체인으로 자격증명을 동기화해 기기 교체·멀티 디바이스에서도 생체·pin으로 로그인 위협 대응 피싱·재사용 차단 도메인 바인딩으로 피싱 사이트를 막고, 서버에 비밀번호를 저장하지 않아 크리덴셜 스터핑을 원천 차단 두음: 단·서·웹·탭·패 — 단(단말 개인키 보관)·서(서버 공개키 등록)·웹(webauthn)·탭(ctap)·패(passkey 동기화) \"단말(개인키)·서버(공개키) 비대칭키 + webauthn(서버-클라) + ctap(클라-인증장치) \" 3요소를 반드시 그림과 함께 쓰기!"}, {"id": "oauth", "cat": "sec", "sub": "sec-crypto", "parent": null, "t": "OAuth 2.0 & OIDC", "s": "인증 vs 인가", "stars": 2, "redStar": false, "full": "OAuth 2.0 & OIDC (OpenID Connect)", "catLabel": "보안·네트워크", "st": "📌 복습 필요", "d": "2026-11-19", "def": "<ul class=\"kw\"><li><b>OAuth 2.0<\/b>: 제3자 앱에 사용자 자원 접근 권한을 위임하는 <b>인가(Authorization)<\/b> 프레임워크<\/li><li><b>OIDC (OpenID Connect)<\/b>: OAuth 2.0 위에 <b>인증(Authentication)<\/b> 계층을 얹은 신원 확인 표준 프로토콜<\/li><\/ul>", "kw": "<ul class=\"kw\"><li><b>4대 역할<\/b><ul class=\"kw\"><li><code>Resource Owner<\/code> — 사용자(자원 소유자)<\/li><li><code>Client<\/code> — 사용자 대신 접근하는 앱<\/li><li><code>Authorization Server<\/code> — 인증 후 토큰 발급<\/li><li><code>Resource Server<\/code> — 보호된 자원(API 서버)<\/li><\/ul><\/li><li><b>토큰 구분<\/b><ul class=\"kw\"><li>OAuth 2.0 → <code>Access Token<\/code> (권한 위임), <code>Refresh Token<\/code><\/li><li>OIDC → <code>ID Token<\/code>(JWT 형태의 신원 정보) 추가 발급<\/li><\/ul><\/li><li><b>보안 이슈 대응<\/b><ul class=\"kw\"><li><code>Authorization Code Grant + PKCE<\/code> — <code>code_challenge<\/code> / <code>code_verifier<\/code><\/li><li><code>state<\/code> 파라미터 — CSRF 방지<\/li><li><code>Redirect URI<\/code> 사전 등록·검증, 토큰 탈취 대비 짧은 만료시간<\/li><\/ul><\/li><\/ul>", "pp": "<div class=\"tblwrap\"><table class=\"cmp\"><colgroup><col style=\"width:24%\"><col style=\"width:28%\"><col style=\"width:48%\"><\/colgroup><thead><tr><th>관점(측면)<\/th><th>특징<\/th><th>설명<\/th><\/tr><\/thead><tbody><tr><td class=\"k\">목적<\/td><td>인가 vs 인증<\/td><td>OAuth 2.0은 자원 접근 권한 위임, OIDC는 그 위에 신원 인증 계층을 얹은 표준<\/td><\/tr><tr><td class=\"k\">역할<\/td><td>4대 역할<\/td><td>Resource Owner·Client·Authorization Server·Resource Server로 책임을 분리<\/td><\/tr><tr><td class=\"k\">토큰<\/td><td>Access·Refresh·ID<\/td><td>Access/Refresh 토큰으로 권한을 위임하고 OIDC는 ID Token(JWT)으로 신원을 전달<\/td><\/tr><tr><td class=\"k\">보안<\/td><td>PKCE·state·Redirect URI<\/td><td>코드 가로채기·CSRF를 막고 Redirect URI 사전 등록·검증과 짧은 만료로 탈취에 대비<\/td><\/tr><\/tbody><\/table><\/div>", "rv": "<div class=\"q\"><b>두음: 소·클·인·자 / 액·리·아<\/b> — 소(Resource Owner)·클(Client)·인(Authorization Server)·자(Resource Server) / 액(Access)·리(Refresh)·아(ID Token)<\/div>\n<div class=\"q\"><b>OAuth 2.0 = 인가<\/b>, <b>OIDC = 인증(소셜 로그인 표준)<\/b> 구분 확실히 외우기! \"OAuth는 권한을 주는 것, OIDC는 누구인지 확인하는 것.\"<\/div>", "img": "itpe-diagrams/03-oauth-oidc.webp", "txt": null, "search": "oauth 2.0 & oidc (openid connect) oauth 2.0 & oidc 인증 vs 인가 보안·네트워크 암호·인증 ⭐⭐ 기출빈출 기출 빈출 중요 oauth 2.0 : 제3자 앱에 사용자 자원 접근 권한을 위임하는 인가(authorization) 프레임워크 oidc (openid connect) : oauth 2.0 위에 인증(authentication) 계층을 얹은 신원 확인 표준 프로토콜 4대 역할 resource owner — 사용자(자원 소유자) client — 사용자 대신 접근하는 앱 authorization server — 인증 후 토큰 발급 resource server — 보호된 자원(api 서버) 토큰 구분 oauth 2.0 → access token (권한 위임), refresh token oidc → id token (jwt 형태의 신원 정보) 추가 발급 보안 이슈 대응 authorization code grant + pkce — code_challenge / code_verifier state 파라미터 — csrf 방지 redirect uri 사전 등록·검증, 토큰 탈취 대비 짧은 만료시간 관점(측면) 특징 설명 목적 인가 vs 인증 oauth 2.0은 자원 접근 권한 위임, oidc는 그 위에 신원 인증 계층을 얹은 표준 역할 4대 역할 resource owner·client·authorization server·resource server로 책임을 분리 토큰 access·refresh·id access/refresh 토큰으로 권한을 위임하고 oidc는 id token(jwt)으로 신원을 전달 보안 pkce·state·redirect uri 코드 가로채기·csrf를 막고 redirect uri 사전 등록·검증과 짧은 만료로 탈취에 대비 두음: 소·클·인·자 / 액·리·아 — 소(resource owner)·클(client)·인(authorization server)·자(resource server) / 액(access)·리(refresh)·아(id token) oauth 2.0 = 인가 , oidc = 인증(소셜 로그인 표준) 구분 확실히 외우기! \"oauth는 권한을 주는 것, oidc는 누구인지 확인하는 것.\""}, {"id": "ai-agent-identity", "cat": "sec", "sub": "sec-crypto", "parent": null, "t": "AI 에이전트 신원", "s": "NHI·SPIFFE·OBO 위임", "stars": 1, "redStar": false, "full": "AI 에이전트 신원 (AI Agent Identity · NHI)", "catLabel": "보안", "st": "📌 복습 필요", "d": "2026-11-25", "def": "<p><b>AI 에이전트 신원(AI Agent Identity)<\/b>은 사람이 아닌 <b>비인간 주체(NHI, Non-Human Identity)<\/b>인 에이전트·워크로드에 고유 신원과 최소 권한, 수명이 짧은 자격증명, 감사 가능한 위임 체계를 부여하는 보안 모델. <b>SPIFFE/SPIRE<\/b>의 워크로드 신원(SVID) 자동 발급·회전과 <b>OAuth 2.0 Token Exchange·On-Behalf-Of<\/b>의 <b>축소 권한 위임<\/b>을 결합한 <b>비인간 주체 신원 관리 기법<\/b>.<\/p>", "kw": "<ul class=\"kw\"><li><b>NHI (Non-Human Identity)<\/b>: 서비스 계정·API 키·토큰·인증서·에이전트 신원 — 사람 계정보다 수 배 많고 <b>회전·폐기<\/b>가 핵심<\/li><li><b>SPIFFE ID<\/b>: <b>spiffe://trust-domain/path<\/b> 형식의 URI 신원 — 위치·이름이 아닌 워크로드 자체를 식별<\/li><li><b>SVID<\/b>: X.509-SVID(상호 TLS용)·JWT-SVID(API 호출용) — SPIRE가 <b>Attestation<\/b> 후 단기 인증서 발급<\/li><li><b>OAuth 2.0 Token Exchange(RFC 8693)<\/b>: 사용자 토큰 → 에이전트용 <b>Scope 축소 토큰<\/b> 교환, <b>On-Behalf-Of<\/b>로 위임 체인 유지<\/li><li><b>동적 권한 위임<\/b>: 작업 단위 <b>최소권한(Least Privilege)<\/b>·TTL·조건부 정책, 필요 시 승인 기반 <b>JIT 권한 상승<\/b><\/li><li><b>감사·추적<\/b>: 에이전트ID·위임자·도구 호출·데이터 접근 이력 — OpenTelemetry·SIEM 연계<\/li><li><b>위협<\/b>: 장기 API 키 유출·권한 남용(Confused Deputy)·에이전트 사칭·프롬프트 인젝션을 통한 권한 탈취<\/li><\/ul>", "pp": "<h4>1) 정적 API 키 vs SPIFFE/SPIRE 워크로드 신원 (비교모듈: 목·대·방·키·성·위)<\/h4>\n<div class=\"tblwrap\"><table class=\"cmp\"><colgroup><col style=\"width:24%\"><col style=\"width:28%\"><col style=\"width:48%\"><\/colgroup><thead><tr><th>구분<\/th><th>정적 API 키·서비스 계정<\/th><th>SPIFFE/SPIRE 워크로드 신원<\/th><\/tr><\/thead><tbody><tr><td class=\"k\">보안목적<\/td><td>간단한 서비스 간 인증<\/td><td>워크로드·에이전트 신원의 자동 증명·회전<\/td><\/tr><tr><td class=\"k\">보호대상<\/td><td>코드·설정에 내장된 공유 비밀<\/td><td>워크로드 프로세스 자체(증명 기반)<\/td><\/tr><tr><td class=\"k\">인증·암호방식<\/td><td>공유 비밀(대칭) 비교<\/td><td>X.509-SVID·JWT-SVID, mTLS<\/td><\/tr><tr><td class=\"k\">키·토큰관리<\/td><td>수동 발급·수동 회전(장기 유효)<\/td><td>Attestation 후 자동 발급·단기(분~시간) 회전<\/td><\/tr><tr><td class=\"k\">성능·부하<\/td><td>검증 단순·저지연<\/td><td>mTLS 핸드셰이크·attestation 오버헤드(캐시로 완화)<\/td><\/tr><tr><td class=\"k\">위협·대응<\/td><td>유출 시 장기간 악용, 폐기 누락<\/td><td>유출돼도 단기 만료, 자동 회전·감사 로그<\/td><\/tr><\/tbody><\/table><\/div>\n<h4>2) 에이전트 신원 구성요소·위임 흐름<\/h4>\n<div class=\"tblwrap\"><table class=\"cmp\"><colgroup><col style=\"width:24%\"><col style=\"width:28%\"><col style=\"width:48%\"><\/colgroup><thead><tr><th>구분<\/th><th>구성요소<\/th><th>역할<\/th><\/tr><\/thead><tbody><tr><td class=\"k\">신원 발급<\/td><td>SPIRE Server·Agent·Attestor<\/td><td>노드·워크로드 증명 후 SVID 발급<\/td><\/tr><tr><td class=\"k\">위임<\/td><td>OAuth Token Exchange(OBO)<\/td><td>사용자 권한을 축소 Scope로 에이전트에 위임<\/td><\/tr><tr><td class=\"k\">정책<\/td><td>권한 정책 엔진(Policy as Code)<\/td><td>도구·데이터별 최소권한, TTL·조건부 승인<\/td><\/tr><tr><td class=\"k\">실행<\/td><td>에이전트 런타임<\/td><td>도구 호출마다 단기 토큰 사용, 호출 범위 제한<\/td><\/tr><tr><td class=\"k\">감사<\/td><td>로그·SIEM·OTel<\/td><td>위임자·에이전트·도구·결과 추적, 이상행위 탐지<\/td><\/tr><\/tbody><\/table><\/div>\n<h4>3) 도입 고려사항<\/h4>\n<div class=\"tblwrap\"><table class=\"cmp\"><colgroup><col style=\"width:24%\"><col style=\"width:28%\"><col style=\"width:48%\"><\/colgroup><thead><tr><th>구분<\/th><th>키워드<\/th><th>설명<\/th><\/tr><\/thead><tbody><tr><td class=\"k\">자산 파악<\/td><td>NHI 인벤토리<\/td><td>서비스 계정·키·토큰 목록화, 소유자 없는 자격증명 우선 폐기<\/td><\/tr><tr><td class=\"k\">권한 설계<\/td><td>최소권한·분리<\/td><td>에이전트별 역할 분리, 사람 권한의 그대로 복제 금지<\/td><\/tr><tr><td class=\"k\">수명<\/td><td>단기·자동 회전<\/td><td>정적 키 제거, TTL·회전 자동화, 비상 폐기 절차<\/td><\/tr><tr><td class=\"k\">위임 추적<\/td><td>위임 체인<\/td><td>\"누가 시켜서 무엇을 했나\"를 남겨 책임 소재 확보<\/td><\/tr><tr><td class=\"k\">거버넌스<\/td><td>표준 정렬<\/td><td>NIST 800-207(제로 트러스트)·ISO/IEC 42001과 연계<\/td><\/tr><\/tbody><\/table><\/div>", "rv": "<div class=\"q\"><b>두음: 스·에스·오 — SPIFFE·SVID·OAuth OBO / 엔·아·감 — NHI·Attestation·감사<\/b><\/div>\n<div class=\"q\"><b>\"에이전트도 사람처럼 신원을 갖고, 단기 자격증명과 최소권한으로 움직이게 하라\"<\/b><\/div>", "img": "itpe-diagrams/136-ai-agent-identity.webp", "txt": null, "search": "ai 에이전트 신원 (ai agent identity · nhi) ai 에이전트 신원 nhi·spiffe·obo 위임 보안 암호·인증 ⭐ 기출빈출 기출 빈출 중요 ai 에이전트 신원(ai agent identity) 은 사람이 아닌 비인간 주체(nhi, non-human identity) 인 에이전트·워크로드에 고유 신원과 최소 권한, 수명이 짧은 자격증명, 감사 가능한 위임 체계를 부여하는 보안 모델. spiffe/spire 의 워크로드 신원(svid) 자동 발급·회전과 oauth 2.0 token exchange·on-behalf-of 의 축소 권한 위임 을 결합한 비인간 주체 신원 관리 기법 . nhi (non-human identity) : 서비스 계정·api 키·토큰·인증서·에이전트 신원 — 사람 계정보다 수 배 많고 회전·폐기 가 핵심 spiffe id : spiffe://trust-domain/path 형식의 uri 신원 — 위치·이름이 아닌 워크로드 자체를 식별 svid : x.509-svid(상호 tls용)·jwt-svid(api 호출용) — spire가 attestation 후 단기 인증서 발급 oauth 2.0 token exchange(rfc 8693) : 사용자 토큰 → 에이전트용 scope 축소 토큰 교환, on-behalf-of 로 위임 체인 유지 동적 권한 위임 : 작업 단위 최소권한(least privilege) ·ttl·조건부 정책, 필요 시 승인 기반 jit 권한 상승 감사·추적 : 에이전트id·위임자·도구 호출·데이터 접근 이력 — opentelemetry·siem 연계 위협 : 장기 api 키 유출·권한 남용(confused deputy)·에이전트 사칭·프롬프트 인젝션을 통한 권한 탈취 1) 정적 api 키 vs spiffe/spire 워크로드 신원 (비교모듈: 목·대·방·키·성·위) 구분 정적 api 키·서비스 계정 spiffe/spire 워크로드 신원 보안목적 간단한 서비스 간 인증 워크로드·에이전트 신원의 자동 증명·회전 보호대상 코드·설정에 내장된 공유 비밀 워크로드 프로세스 자체(증명 기반) 인증·암호방식 공유 비밀(대칭) 비교 x.509-svid·jwt-svid, mtls 키·토큰관리 수동 발급·수동 회전(장기 유효) attestation 후 자동 발급·단기(분~시간) 회전 성능·부하 검증 단순·저지연 mtls 핸드셰이크·attestation 오버헤드(캐시로 완화) 위협·대응 유출 시 장기간 악용, 폐기 누락 유출돼도 단기 만료, 자동 회전·감사 로그 2) 에이전트 신원 구성요소·위임 흐름 구분 구성요소 역할 신원 발급 spire server·agent·attestor 노드·워크로드 증명 후 svid 발급 위임 oauth token exchange(obo) 사용자 권한을 축소 scope로 에이전트에 위임 정책 권한 정책 엔진(policy as code) 도구·데이터별 최소권한, ttl·조건부 승인 실행 에이전트 런타임 도구 호출마다 단기 토큰 사용, 호출 범위 제한 감사 로그·siem·otel 위임자·에이전트·도구·결과 추적, 이상행위 탐지 3) 도입 고려사항 구분 키워드 설명 자산 파악 nhi 인벤토리 서비스 계정·키·토큰 목록화, 소유자 없는 자격증명 우선 폐기 권한 설계 최소권한·분리 에이전트별 역할 분리, 사람 권한의 그대로 복제 금지 수명 단기·자동 회전 정적 키 제거, ttl·회전 자동화, 비상 폐기 절차 위임 추적 위임 체인 \"누가 시켜서 무엇을 했나\"를 남겨 책임 소재 확보 거버넌스 표준 정렬 nist 800-207(제로 트러스트)·iso/iec 42001과 연계 두음: 스·에스·오 — spiffe·svid·oauth obo / 엔·아·감 — nhi·attestation·감사 \"에이전트도 사람처럼 신원을 갖고, 단기 자격증명과 최소권한으로 움직이게 하라\""}, {"id": "pqc", "cat": "sec", "sub": "sec-crypto", "parent": null, "t": "PQC", "s": "양자내성암호", "stars": 1, "redStar": false, "full": "PQC (양자내성암호)", "catLabel": "보안·네트워크", "st": "📌 복습 필요", "d": "2026-11-19", "def": "<p>양자컴퓨터의 연산 능력으로도 해독이 어려운 <b>수학적 난제<\/b>를 기반으로 설계되어, 기존 통신망·소프트웨어 환경에서 그대로 적용 가능한 차세대 공개키 암호체계.<\/p>", "kw": "<ul class=\"kw\"><li><b>등장 배경(위협)<\/b>: <b>Shor 알고리즘<\/b>(소인수분해·이산대수 기반 RSA/ECC 해독), <b>HNDL<\/b>(Harvest Now, Decrypt Later — 지금 수집해 두고 양자컴퓨터 상용화 후 복호화)<\/li><li><b>주요 알고리즘 계열 &amp; NIST 표준<\/b>: <b>격자 기반(Lattice)<\/b>(<code>ML-KEM<\/code>/구 Kyber, <code>ML-DSA<\/code>/구 Dilithium — 주력), <b>해시 기반(Hash)<\/b>(<code>SLH-DSA<\/code>/구 SPHINCS+), <b>부호 기반(Code)<\/b>, <b>다변수 다항식 기반(Multivariate)<\/b><\/li><li><b>QKD와 구분<\/b>: <b>PQC<\/b>는 수학적 난제 기반 SW 암호(기존 인터넷 적용 용이), <b>QKD(양자키분배)<\/b>는 양자역학 물리 법칙 기반(전용 광채널 필요)<\/li><\/ul>", "pp": "<div class=\"tblwrap\"><table class=\"cmp\"><colgroup><col style=\"width:24%\"><col style=\"width:28%\"><col style=\"width:48%\"><\/colgroup><thead><tr><th>관점(측면)<\/th><th>특징<\/th><th>설명<\/th><\/tr><\/thead><tbody><tr><td class=\"k\">수학적 기반<\/td><td>격자·해시·부호<\/td><td>격자 기반(ML-KEM·ML-DSA)이 주력, 해시 기반(SLH-DSA)·부호·다변수 계열로 난제를 교체<\/td><\/tr><tr><td class=\"k\">위협 시나리오<\/td><td>Shor 알고리즘·HNDL<\/td><td>Shor 알고리즘이 RSA·ECC를 해독하고, 지금 수집해 나중에 복호화하는 HNDL 위협에 선제 대응<\/td><\/tr><tr><td class=\"k\">전환 방식<\/td><td>하이브리드·민첩성<\/td><td>기존 TLS에 PQC를 병행 적용하고 암호 민첩성(Crypto Agility)을 확보해 교체 비용을 낮춤<\/td><\/tr><tr><td class=\"k\">대안 비교<\/td><td>QKD와 구분<\/td><td>PQC는 수학 난제 기반 SW 암호로 기존 인터넷에 적용, QKD는 양자역학 기반 전용 광채널 필요<\/td><\/tr><\/tbody><\/table><\/div>", "rv": "<div class=\"q\"><b>두음: 격·해·부·다<\/b> — 격(ML-KEM·ML-DSA)·해(SLH-DSA)·부(부호 기반)·다(다변수) — 위협은 Shor·HNDL<\/div>\n<div class=\"q\">\"양자 위협 = <b>Shor 알고리즘·HNDL<\/b>, 대안 = <b>격자 기반(ML-KEM/ML-DSA)·해시 기반(SLH-DSA)<\/b> + <b>QKD와 구분<\/b>\"까지 꼭 적기!<\/div>", "img": "itpe-diagrams/14-pqc.webp", "txt": null, "search": "pqc (양자내성암호) pqc 양자내성암호 보안·네트워크 암호·인증 ⭐ 기출빈출 기출 빈출 중요 양자컴퓨터의 연산 능력으로도 해독이 어려운 수학적 난제 를 기반으로 설계되어, 기존 통신망·소프트웨어 환경에서 그대로 적용 가능한 차세대 공개키 암호체계. 등장 배경(위협) : shor 알고리즘 (소인수분해·이산대수 기반 rsa/ecc 해독), hndl (harvest now, decrypt later — 지금 수집해 두고 양자컴퓨터 상용화 후 복호화) 주요 알고리즘 계열 &amp; nist 표준 : 격자 기반(lattice) ( ml-kem /구 kyber, ml-dsa /구 dilithium — 주력), 해시 기반(hash) ( slh-dsa /구 sphincs+), 부호 기반(code) , 다변수 다항식 기반(multivariate) qkd와 구분 : pqc 는 수학적 난제 기반 sw 암호(기존 인터넷 적용 용이), qkd(양자키분배) 는 양자역학 물리 법칙 기반(전용 광채널 필요) 관점(측면) 특징 설명 수학적 기반 격자·해시·부호 격자 기반(ml-kem·ml-dsa)이 주력, 해시 기반(slh-dsa)·부호·다변수 계열로 난제를 교체 위협 시나리오 shor 알고리즘·hndl shor 알고리즘이 rsa·ecc를 해독하고, 지금 수집해 나중에 복호화하는 hndl 위협에 선제 대응 전환 방식 하이브리드·민첩성 기존 tls에 pqc를 병행 적용하고 암호 민첩성(crypto agility)을 확보해 교체 비용을 낮춤 대안 비교 qkd와 구분 pqc는 수학 난제 기반 sw 암호로 기존 인터넷에 적용, qkd는 양자역학 기반 전용 광채널 필요 두음: 격·해·부·다 — 격(ml-kem·ml-dsa)·해(slh-dsa)·부(부호 기반)·다(다변수) — 위협은 shor·hndl \"양자 위협 = shor 알고리즘·hndl , 대안 = 격자 기반(ml-kem/ml-dsa)·해시 기반(slh-dsa) + qkd와 구분 \"까지 꼭 적기!"}, {"id": "qkd-pqc", "cat": "sec", "sub": "sec-crypto", "parent": null, "t": "QKD vs PQC (양자보안)", "s": "물·광·망(QKD) vs 수·격·범(PQC)", "stars": 3, "redStar": false, "full": "QKD(양자키분배) vs PQC(양자내성암호)", "catLabel": "보안", "st": "📌 복습 필요", "d": "2026-11-23", "def": "<p>양자컴퓨터의 쇼어(Shor) 알고리즘에 의한 기존 공개키 암호(RSA·ECC) 해독 위협에 대응하는 양대 기술로, <b>양자역학 물리 법칙 기반 키 분배(QKD)<\/b>와 <b>양자컴퓨터도 풀기 어려운 수학 난제 기반 암호(PQC)<\/b>로 구분됨<\/p>", "kw": "<ul class=\"kw\"><li><b>QKD (Quantum Key Distribution)<\/b>: 광자의 양자 상태(중첩·복제 불가 원리)를 이용해 대칭키를 분배하며, 도청 시 상태 교란으로 <b>도청 즉시 탐지<\/b> (단, 전용 광케이블·장비 필요, 거리 제한)<\/li><li><b>PQC (Post-Quantum Cryptography)<\/b>: 격자(Lattice)·해시·부호 기반 수학적 난제 활용(NIST 표준 ML-KEM·ML-DSA). <b>SW 교체만으로 기존망·단말·인증에 즉시 적용<\/b> 가능<\/li><li><b>하이브리드 양자보안<\/b>: 백본/기간망은 QKD로 물리적 키 분배, 액세스망·단말·전자서명은 PQC를 적용해 상호 보완<\/li><\/ul>", "pp": "<h4>1) 개념 비교<\/h4>\n<div class=\"tblwrap\"><table class=\"cmp\"><colgroup><col style=\"width:24%\"><col style=\"width:28%\"><col style=\"width:48%\"><\/colgroup><thead><tr><th>비교<\/th><th>QKD (양자키분배)<\/th><th>PQC (양자내성암호)<\/th><\/tr><\/thead><tbody><tr><td class=\"k\">보안 기반<\/td><td>양자역학 물리 법칙 (불확정성·복제 불가)<\/td><td>수학적 난제 (격자·해시·다변수 등)<\/td><\/tr><tr><td class=\"k\">구현 방식<\/td><td>하드웨어(전용 광통신망·양자 송수신기)<\/td><td>소프트웨어(기존 네트워크·단말 패치)<\/td><\/tr><tr><td class=\"k\">주요 기능<\/td><td>대칭키 안전 분배 · 도청 즉시 탐지<\/td><td>암호화 + 전자서명/인증 (범용성)<\/td><\/tr><\/tbody><\/table><\/div>\n<h4>2) 상세 비교 (확장성 · 적용 관점)<\/h4>\n<div class=\"tblwrap\"><table class=\"cmp\"><colgroup><col style=\"width:24%\"><col style=\"width:28%\"><col style=\"width:48%\"><\/colgroup><thead><tr><th>구분<\/th><th>QKD (양자키분배)<\/th><th>PQC (양자내성암호)<\/th><\/tr><\/thead><tbody><tr><td class=\"k\">비용·거리<\/td><td>구축 비용 높음 · 중계기 없이 거리 제한<\/td><td>추가 장비 불필요 · 거리 제한 없음<\/td><\/tr><tr><td class=\"k\">적용 영역<\/td><td>국가 기간망 · 국방·금융 백본망<\/td><td>웹(TLS 1.3)·IoT·모바일·클라우드 전반<\/td><\/tr><\/tbody><\/table><\/div>", "rv": "<div class=\"q\"><b>두음: 물·광·망(QKD) vs 수·격·범(PQC)<\/b> — 물리·광자·기간망 vs 수학·격자·범용적용<\/div>\n<div class=\"q\"><b>\"QKD는 키 분배 전용(인증 불가), PQC는 서명·암호 범용\"<\/b> → 그래서 실무는 <b>하이브리드<\/b>!<\/div>", "img": "itpe-diagrams/88-qkd-vs-pqc.webp", "txt": null, "search": "qkd(양자키분배) vs pqc(양자내성암호) qkd vs pqc (양자보안) 물·광·망(qkd) vs 수·격·범(pqc) 보안 암호·인증 ⭐⭐⭐ 기출빈출 기출 빈출 중요 양자컴퓨터의 쇼어(shor) 알고리즘에 의한 기존 공개키 암호(rsa·ecc) 해독 위협에 대응하는 양대 기술로, 양자역학 물리 법칙 기반 키 분배(qkd) 와 양자컴퓨터도 풀기 어려운 수학 난제 기반 암호(pqc) 로 구분됨 qkd (quantum key distribution) : 광자의 양자 상태(중첩·복제 불가 원리)를 이용해 대칭키를 분배하며, 도청 시 상태 교란으로 도청 즉시 탐지 (단, 전용 광케이블·장비 필요, 거리 제한) pqc (post-quantum cryptography) : 격자(lattice)·해시·부호 기반 수학적 난제 활용(nist 표준 ml-kem·ml-dsa). sw 교체만으로 기존망·단말·인증에 즉시 적용 가능 하이브리드 양자보안 : 백본/기간망은 qkd로 물리적 키 분배, 액세스망·단말·전자서명은 pqc를 적용해 상호 보완 1) 개념 비교 비교 qkd (양자키분배) pqc (양자내성암호) 보안 기반 양자역학 물리 법칙 (불확정성·복제 불가) 수학적 난제 (격자·해시·다변수 등) 구현 방식 하드웨어(전용 광통신망·양자 송수신기) 소프트웨어(기존 네트워크·단말 패치) 주요 기능 대칭키 안전 분배 · 도청 즉시 탐지 암호화 + 전자서명/인증 (범용성) 2) 상세 비교 (확장성 · 적용 관점) 구분 qkd (양자키분배) pqc (양자내성암호) 비용·거리 구축 비용 높음 · 중계기 없이 거리 제한 추가 장비 불필요 · 거리 제한 없음 적용 영역 국가 기간망 · 국방·금융 백본망 웹(tls 1.3)·iot·모바일·클라우드 전반 두음: 물·광·망(qkd) vs 수·격·범(pqc) — 물리·광자·기간망 vs 수학·격자·범용적용 \"qkd는 키 분배 전용(인증 불가), pqc는 서명·암호 범용\" → 그래서 실무는 하이브리드 !"}, {"id": "cc-tee", "cat": "sec", "sub": "sec-cloud", "parent": null, "t": "Confidential Computing", "s": "TEE(Trusted Execution Env.)", "stars": 0, "redStar": false, "full": "Confidential Computing과 TEE", "catLabel": "보안·네트워크", "st": "📌 복습 필요", "d": "2026-11-20", "def": "<p>데이터의 3대 상태(저장·전송·사용) 중 <b>사용·연산 중인 데이터(Data in Use)<\/b>를 하드웨어 기반 격리 환경에서 암호화·보호하여 호스트 OS·클라우드 관리자(CSP)로부터도 기밀성을 보장하는 컴퓨팅 기술<\/p>", "kw": "<ul class=\"kw\"><li><b>보호 대상<\/b>: <b>Data at Rest<\/b>(저장·AES), <b>Data in Transit<\/b>(전송·TLS)의 빈틈이었던 <b>Data in Use(메모리 연산 중)<\/b> 보호<\/li><li><b>TEE (Trusted Execution Environment · 신뢰 실행 환경)<\/b>: CPU 하드웨어 수준에서 일반 OS·하이퍼바이저와 격리된 보안 실행 영역(<b>Enclave<\/b>)<ul class=\"kw\"><li><b>메모리 암호화<\/b>: CPU 외부 메모리 접근 시 평문 노출 차단<\/li><li><b>원격 증명 (Remote Attestation)<\/b>: 외부 클라이언트가 정상 TEE 환경·코드 무결성을 암호학적으로 검증<\/li><\/ul><\/li><li><b>대표 구현 기술<\/b>: Intel SGX / TDX, AMD SEV-SNP, ARM TrustZone / CCA, NVIDIA Confidential GPU<\/li><li><b>활용 사례<\/b>: 클라우드 환경 LLM/AI 학습·추론 데이터 보호, 금융·의료 멀티파티 데이터 분석<\/li><\/ul>", "pp": "<div class=\"tblwrap\"><table class=\"cmp\"><colgroup><col style=\"width:24%\"><col style=\"width:28%\"><col style=\"width:48%\"><\/colgroup><thead><tr><th>관점(측면)<\/th><th>특징<\/th><th>설명<\/th><\/tr><\/thead><tbody><tr><td class=\"k\">보호 대상<\/td><td>Data in Use<\/td><td>저장(AES)·전송(TLS)에 이어 연산 중 메모리의 데이터까지 보호 범위를 확장<\/td><\/tr><tr><td class=\"k\">격리 기술<\/td><td>TEE Enclave<\/td><td>CPU 하드웨어 수준에서 격리해 호스트 OS·하이퍼바이저·CSP의 접근을 차단<\/td><\/tr><tr><td class=\"k\">신뢰 검증<\/td><td>Remote Attestation<\/td><td>외부에서 코드 무결성과 실행 환경을 암호학적으로 검증해 신뢰를 확보<\/td><\/tr><tr><td class=\"k\">적용·한계<\/td><td>클라우드 AI·멀티파티<\/td><td>LLM 학습·추론, 금융·의료 공동 분석에 적용하며 성능 오버헤드와 개발 제약을 고려<\/td><\/tr><\/tbody><\/table><\/div>", "rv": "<div class=\"q\"><b>두음: 사·격·증<\/b> — 사(Data in Use)·격(Enclave 격리)·증(원격 증명)<\/div>\n<div class=\"q\">\"<b>Data in Use(사용 중 데이터) 보호<\/b> + <b>TEE(하드웨어 Enclave 격리·원격 증명)<\/b> + <b>CSP/Host OS 접근 차단<\/b>\" 3박자로 쓰기!<\/div>", "img": "itpe-diagrams/25-confidential-computing.webp", "txt": null, "search": "confidential computing과 tee confidential computing tee(trusted execution env.) 보안·네트워크 클라우드·네트워크 보안 데이터의 3대 상태(저장·전송·사용) 중 사용·연산 중인 데이터(data in use) 를 하드웨어 기반 격리 환경에서 암호화·보호하여 호스트 os·클라우드 관리자(csp)로부터도 기밀성을 보장하는 컴퓨팅 기술 보호 대상 : data at rest (저장·aes), data in transit (전송·tls)의 빈틈이었던 data in use(메모리 연산 중) 보호 tee (trusted execution environment · 신뢰 실행 환경) : cpu 하드웨어 수준에서 일반 os·하이퍼바이저와 격리된 보안 실행 영역( enclave ) 메모리 암호화 : cpu 외부 메모리 접근 시 평문 노출 차단 원격 증명 (remote attestation) : 외부 클라이언트가 정상 tee 환경·코드 무결성을 암호학적으로 검증 대표 구현 기술 : intel sgx / tdx, amd sev-snp, arm trustzone / cca, nvidia confidential gpu 활용 사례 : 클라우드 환경 llm/ai 학습·추론 데이터 보호, 금융·의료 멀티파티 데이터 분석 관점(측면) 특징 설명 보호 대상 data in use 저장(aes)·전송(tls)에 이어 연산 중 메모리의 데이터까지 보호 범위를 확장 격리 기술 tee enclave cpu 하드웨어 수준에서 격리해 호스트 os·하이퍼바이저·csp의 접근을 차단 신뢰 검증 remote attestation 외부에서 코드 무결성과 실행 환경을 암호학적으로 검증해 신뢰를 확보 적용·한계 클라우드 ai·멀티파티 llm 학습·추론, 금융·의료 공동 분석에 적용하며 성능 오버헤드와 개발 제약을 고려 두음: 사·격·증 — 사(data in use)·격(enclave 격리)·증(원격 증명) \" data in use(사용 중 데이터) 보호 + tee(하드웨어 enclave 격리·원격 증명) + csp/host os 접근 차단 \" 3박자로 쓰기!"}, {"id": "zkp", "cat": "sec", "sub": "sec-crypto", "parent": null, "t": "영지식 증명 (ZKP)", "s": "완전·건전·영지식성 / SNARK·STARK", "stars": 2, "redStar": false, "full": "영지식 증명 (ZKP, Zero-Knowledge Proof)", "catLabel": "보안", "st": "📌 복습 필요", "d": "2026-11-20", "def": "<p>증명자(Prover)가 검증자(Verifier)에게 자신이 어떤 비밀 정보를 알고 있다는 <b>사실(참)만 증명<\/b>하고, 그 <b>비밀 정보 자체는 일체 공개하지 않는<\/b> 암호학적 증명 기법<\/p>", "kw": "<ul class=\"kw\"><li><b>3대 성질<\/b>:<ul class=\"kw\"><li><b>완전성(Completeness)<\/b>: 명제가 참이면 정직한 증명자는 검증자를 반드시 납득시킴<\/li><li><b>건전성(Soundness)<\/b>: 명제가 거짓이면 부정 증명자가 검증자를 속일 확률은 극히 낮음<\/li><li><b>영지식성(Zero-Knowledge)<\/b>: 검증자는 참이라는 사실 외에 어떠한 추가 비밀 정보도 얻지 못함<\/li><\/ul><\/li><li><b>구현 유형<\/b>:<ul class=\"kw\"><li><b>대화형(Interactive)<\/b>: 질의-응답을 여러 라운드 반복<\/li><li><b>비대화형(Non-Interactive, NIZK)<\/b>: 한 번의 증명으로 검증 — <b>zk-SNARK<\/b>(증명 크기 작고 빠름, 신뢰 설정 필요), <b>zk-STARK<\/b>(신뢰 설정 불필요, 양자 내성)<\/li><\/ul><\/li><li><b>활용<\/b>: 분산신원증명(DID · 선택적 정보 공개), 블록체인 프라이버시(zk-Rollup), 개인정보 비노출 인증<\/li><\/ul>", "pp": "<div class=\"tblwrap\"><table class=\"cmp\"><colgroup><col style=\"width:24%\"><col style=\"width:28%\"><col style=\"width:48%\"><\/colgroup><thead><tr><th>관점(측면)<\/th><th>특징<\/th><th>설명<\/th><\/tr><\/thead><tbody><tr><td class=\"k\">3대 성질<\/td><td>완전성·건전성·영지식성<\/td><td>참이면 납득되고, 거짓은 통과하지 못하며, 비밀 정보는 노출되지 않음<\/td><\/tr><tr><td class=\"k\">증명 유형<\/td><td>대화형 vs 비대화형<\/td><td>라운드 반복 질의응답과 1회 증명(NIZK)으로 나뉘며 블록체인은 NIZK를 주로 사용<\/td><\/tr><tr><td class=\"k\">구현 비교<\/td><td>zk-SNARK vs zk-STARK<\/td><td>SNARK는 증명이 작고 검증이 빠르나 신뢰 설정이 필요, STARK는 신뢰 설정 불필요·양자 내성<\/td><\/tr><tr><td class=\"k\">활용<\/td><td>DID·zk-Rollup<\/td><td>선택적 정보 공개 기반 신원 증명과 블록체인 프라이버시 확장에 적용<\/td><\/tr><\/tbody><\/table><\/div>", "rv": "<div class=\"q\"><b>두음: 완·건·영 / 스낵·스탁<\/b> — 완(완전성)·건(건전성)·영(영지식성) / 스낵(SNARK)·스탁(STARK)<\/div>\n<div class=\"q\"><b>3대 성질(완전성·건전성·영지식성)<\/b>과 비대화형 대표 2종(<b>zk-SNARK · zk-STARK<\/b>)을 반드시 키워드로 적기!<\/div>", "img": "itpe-diagrams/28-zkp.webp", "txt": null, "search": "영지식 증명 (zkp, zero-knowledge proof) 영지식 증명 (zkp) 완전·건전·영지식성 / snark·stark 보안 암호·인증 ⭐⭐ 기출빈출 기출 빈출 중요 증명자(prover)가 검증자(verifier)에게 자신이 어떤 비밀 정보를 알고 있다는 사실(참)만 증명 하고, 그 비밀 정보 자체는 일체 공개하지 않는 암호학적 증명 기법 3대 성질 : 완전성(completeness) : 명제가 참이면 정직한 증명자는 검증자를 반드시 납득시킴 건전성(soundness) : 명제가 거짓이면 부정 증명자가 검증자를 속일 확률은 극히 낮음 영지식성(zero-knowledge) : 검증자는 참이라는 사실 외에 어떠한 추가 비밀 정보도 얻지 못함 구현 유형 : 대화형(interactive) : 질의-응답을 여러 라운드 반복 비대화형(non-interactive, nizk) : 한 번의 증명으로 검증 — zk-snark (증명 크기 작고 빠름, 신뢰 설정 필요), zk-stark (신뢰 설정 불필요, 양자 내성) 활용 : 분산신원증명(did · 선택적 정보 공개), 블록체인 프라이버시(zk-rollup), 개인정보 비노출 인증 관점(측면) 특징 설명 3대 성질 완전성·건전성·영지식성 참이면 납득되고, 거짓은 통과하지 못하며, 비밀 정보는 노출되지 않음 증명 유형 대화형 vs 비대화형 라운드 반복 질의응답과 1회 증명(nizk)으로 나뉘며 블록체인은 nizk를 주로 사용 구현 비교 zk-snark vs zk-stark snark는 증명이 작고 검증이 빠르나 신뢰 설정이 필요, stark는 신뢰 설정 불필요·양자 내성 활용 did·zk-rollup 선택적 정보 공개 기반 신원 증명과 블록체인 프라이버시 확장에 적용 두음: 완·건·영 / 스낵·스탁 — 완(완전성)·건(건전성)·영(영지식성) / 스낵(snark)·스탁(stark) 3대 성질(완전성·건전성·영지식성) 과 비대화형 대표 2종( zk-snark · zk-stark )을 반드시 키워드로 적기!"}, {"id": "fhe", "cat": "sec", "sub": "sec-crypto", "parent": null, "t": "동형암호 (FHE)", "s": "복호화 없는 연산 · 부·준·완", "stars": 2, "redStar": false, "full": "동형암호 (Homomorphic Encryption, FHE)", "catLabel": "보안", "st": "📌 복습 필요", "d": "2026-11-21", "def": "<p>데이터를 <b>복호화하지 않고 암호문 상태 그대로 덧셈·곱셈 등의 연산<\/b>을 수행해, 복호화 시 평문 연산과 동일한 결과를 얻는 차세대 프라이버시 보존 암호 기술<\/p>", "kw": "<ul class=\"kw\"><li><b>발전 단계 3유형 (부·준·완)<\/b>:<ul class=\"kw\"><li><b>PHE (부분 동형암호)<\/b>: 덧셈 또는 곱셈 중 <b>1종 연산만<\/b> 무한 지원 (예: RSA, Paillier)<\/li><li><b>SHE (준 동형암호)<\/b>: 덧셈·곱셈 모두 가능하나 잡음(Noise) 누적으로 <b>연산 횟수 제한<\/b><\/li><li><b>FHE (완전 동형암호)<\/b>: 부트스트래핑(Bootstrapping)으로 잡음을 제거해 <b>덧셈·곱셈 무한 지원<\/b> (격자 기반)<\/li><\/ul><\/li><li><b>특징<\/b>: 데이터 활용 중 유출 원천 차단(Data in Use 보호), 단 <b>연산 속도·암호문 크기 오버헤드<\/b>가 큼<\/li><\/ul>", "pp": "<div class=\"tblwrap\"><table class=\"cmp\"><colgroup><col style=\"width:24%\"><col style=\"width:28%\"><col style=\"width:48%\"><\/colgroup><thead><tr><th>관점(측면)<\/th><th>특징<\/th><th>설명<\/th><\/tr><\/thead><tbody><tr><td class=\"k\">수학적 기반 관점<\/td><td>격자(Lattice) · 부트스트래핑<\/td><td>양자컴퓨터 내성(PQC)을 갖춘 격자 기반 + 잡음 초기화로 무한 연산<\/td><\/tr><tr><td class=\"k\">보안·프라이버시<\/td><td>Data in Use 보호<\/td><td>클라우드·AI 학습 위탁 시 서버 관리자조차 원본 평문 열람 불가<\/td><\/tr><tr><td class=\"k\">성능·한계 관점<\/td><td>연산·용량 오버헤드<\/td><td>평문 연산 대비 수천 배 느리고 암호문 크기 비대 → GPU/ASIC 가속 연구<\/td><\/tr><tr><td class=\"k\">활용·비교 관점<\/td><td>AI·의료·금융 결합<\/td><td>개인정보 복호화 없이 이종 데이터 결합·동형 추론 (TEE는 하드웨어 격리 기반)<\/td><\/tr><\/tbody><\/table><\/div>", "rv": "<div class=\"q\"><b>두음: 부·준·완 / 격·부<\/b> — 부(부분 PHE)·준(준 SHE)·완(완전 FHE) / 격(격자 기반)·부(부트스트래핑 잡음 제거)<\/div>\n<div class=\"q\"><b>복호화 없는 암호문 연산 + 부·준·완 + TEE/ZKP와 비교<\/b>!<\/div>", "img": "itpe-diagrams/47-fhe.webp", "txt": null, "search": "동형암호 (homomorphic encryption, fhe) 동형암호 (fhe) 복호화 없는 연산 · 부·준·완 보안 암호·인증 ⭐⭐ 기출빈출 기출 빈출 중요 데이터를 복호화하지 않고 암호문 상태 그대로 덧셈·곱셈 등의 연산 을 수행해, 복호화 시 평문 연산과 동일한 결과를 얻는 차세대 프라이버시 보존 암호 기술 발전 단계 3유형 (부·준·완) : phe (부분 동형암호) : 덧셈 또는 곱셈 중 1종 연산만 무한 지원 (예: rsa, paillier) she (준 동형암호) : 덧셈·곱셈 모두 가능하나 잡음(noise) 누적으로 연산 횟수 제한 fhe (완전 동형암호) : 부트스트래핑(bootstrapping)으로 잡음을 제거해 덧셈·곱셈 무한 지원 (격자 기반) 특징 : 데이터 활용 중 유출 원천 차단(data in use 보호), 단 연산 속도·암호문 크기 오버헤드 가 큼 관점(측면) 특징 설명 수학적 기반 관점 격자(lattice) · 부트스트래핑 양자컴퓨터 내성(pqc)을 갖춘 격자 기반 + 잡음 초기화로 무한 연산 보안·프라이버시 data in use 보호 클라우드·ai 학습 위탁 시 서버 관리자조차 원본 평문 열람 불가 성능·한계 관점 연산·용량 오버헤드 평문 연산 대비 수천 배 느리고 암호문 크기 비대 → gpu/asic 가속 연구 활용·비교 관점 ai·의료·금융 결합 개인정보 복호화 없이 이종 데이터 결합·동형 추론 (tee는 하드웨어 격리 기반) 두음: 부·준·완 / 격·부 — 부(부분 phe)·준(준 she)·완(완전 fhe) / 격(격자 기반)·부(부트스트래핑 잡음 제거) 복호화 없는 암호문 연산 + 부·준·완 + tee/zkp와 비교 !"}, {"id": "n2sf", "cat": "sec", "sub": "sec-cloud", "parent": null, "t": "N2SF (국가 망 보안체계)", "s": "망분리 개선 · C·S·O 3등급", "stars": 2, "redStar": false, "full": "N2SF (국가 망 보안체계)", "catLabel": "보안", "st": "📌 복습 필요", "d": "2026-11-20", "def": "<p>기존 공공·금융 분야의 <b>일률적 물리적 망분리<\/b> 규제를 개선하여, 업무·데이터의 중요도에 따라 <b>3단계(C·S·O)<\/b>로 등급을 나누고 <b>위험도 기반 차등 보안 통제<\/b>를 적용하는 국가 망 보안체계 (국정원, 2024~)<\/p>", "kw": "<ul class=\"kw\"><li><b>도입 배경<\/b>: 물리적 망분리로 인한 생성형 AI·클라우드(SaaS)·데이터 활용 제약 해소<\/li><li><b>3단계 보안 등급 (C·S·O)<\/b>:<ul class=\"kw\"><li><b>C (Classified, 기밀)<\/b>: 국가기밀·핵심 안보 → 최고 수준 격리·내부 통제<\/li><li><b>S (Sensitive, 민감)<\/b>: 개인정보·주요 행정 → 조건부 외부 연계·강화 인증<\/li><li><b>O (Open, 공개)<\/b>: 대민 공개·일반 업무 → 생성형 AI·클라우드 자유 활용<\/li><\/ul><\/li><li><b>6대 통제 영역<\/b>: 권한 · 인증 · 격리 · 통제 · 데이터 · 정보자산 (Zero Trust 원칙 접목)<\/li><\/ul>", "pp": "<div class=\"tblwrap\"><table class=\"cmp\"><colgroup><col style=\"width:24%\"><col style=\"width:28%\"><col style=\"width:48%\"><\/colgroup><thead><tr><th>관점(측면)<\/th><th>특징<\/th><th>설명<\/th><\/tr><\/thead><tbody><tr><td class=\"k\">프로세스<\/td><td>등급 분류→통제→점검<\/td><td>위험도 기반 등급 분류 후 차등 통제 적용, 이행 점검과 개선(환류)<\/td><\/tr><tr><td class=\"k\">조직<\/td><td>거버넌스·책임 체계<\/td><td>보안 책임자·심의 조직과 C·S·O 등급 관리 주체 지정<\/td><\/tr><tr><td class=\"k\">리소스(기술·자원)<\/td><td>6대 통제 영역<\/td><td>권한·인증·격리·통제·데이터·정보자산을 기술·자원 통제로 구체화<\/td><\/tr><tr><td class=\"k\">등급 체계<\/td><td>C·S·O 3등급<\/td><td>기밀·민감·공개 중요도에 따라 격리·연계 수준을 차등 적용<\/td><\/tr><\/tbody><\/table><\/div>", "rv": "<div class=\"q\"><b>두음: 기·민·공(C·S·O) / 권·인·격·통·데·정<\/b> — 기(C·기밀)·민(S·민감)·공(O·공개) / 6대 통제(권한·인증·격리·통제·데이터·정보자산)<\/div>\n<div class=\"q\"><b>물리적 망분리 한계(AI·클라우드 불가) → C·S·O 3등급 차등 통제 + 6대 보안 통제 영역<\/b>!<\/div>", "img": "itpe-diagrams/35-n2sf.webp", "txt": null, "search": "n2sf (국가 망 보안체계) n2sf (국가 망 보안체계) 망분리 개선 · c·s·o 3등급 보안 클라우드·네트워크 보안 ⭐⭐ 기출빈출 기출 빈출 중요 기존 공공·금융 분야의 일률적 물리적 망분리 규제를 개선하여, 업무·데이터의 중요도에 따라 3단계(c·s·o) 로 등급을 나누고 위험도 기반 차등 보안 통제 를 적용하는 국가 망 보안체계 (국정원, 2024~) 도입 배경 : 물리적 망분리로 인한 생성형 ai·클라우드(saas)·데이터 활용 제약 해소 3단계 보안 등급 (c·s·o) : c (classified, 기밀) : 국가기밀·핵심 안보 → 최고 수준 격리·내부 통제 s (sensitive, 민감) : 개인정보·주요 행정 → 조건부 외부 연계·강화 인증 o (open, 공개) : 대민 공개·일반 업무 → 생성형 ai·클라우드 자유 활용 6대 통제 영역 : 권한 · 인증 · 격리 · 통제 · 데이터 · 정보자산 (zero trust 원칙 접목) 관점(측면) 특징 설명 프로세스 등급 분류→통제→점검 위험도 기반 등급 분류 후 차등 통제 적용, 이행 점검과 개선(환류) 조직 거버넌스·책임 체계 보안 책임자·심의 조직과 c·s·o 등급 관리 주체 지정 리소스(기술·자원) 6대 통제 영역 권한·인증·격리·통제·데이터·정보자산을 기술·자원 통제로 구체화 등급 체계 c·s·o 3등급 기밀·민감·공개 중요도에 따라 격리·연계 수준을 차등 적용 두음: 기·민·공(c·s·o) / 권·인·격·통·데·정 — 기(c·기밀)·민(s·민감)·공(o·공개) / 6대 통제(권한·인증·격리·통제·데이터·정보자산) 물리적 망분리 한계(ai·클라우드 불가) → c·s·o 3등급 차등 통제 + 6대 보안 통제 영역 !"}, {"id": "k-rmf", "cat": "sec", "sub": "sec-gov", "parent": null, "t": "K-RMF (위험관리프레임워크)", "s": "분·선·구·평·승·모 / ATO", "stars": 3, "redStar": false, "full": "K-RMF (한국형 위험관리프레임워크)", "catLabel": "보안", "st": "📌 복습 필요", "d": "2026-11-23", "def": "<p>미국 NIST RMF(SP 800-37)를 국내 국방·공공 환경에 맞게 정립한 제도로, <b>정보체계의 설계부터 폐기까지 전 수명주기에 걸쳐 위험 기반으로 보안통제항목을 맞춤형 적용·평가·승인·지속 모니터링<\/b>하는 위험관리 프레임워크<\/p>", "kw": "<ul class=\"kw\"><li><b>도입 배경<\/b>: 기존 획일적·일회성 사전 보안성 검토의 한계 극복, 무기·정보체계 첨단화에 따른 상시 사이버 위험 대응<\/li><li><b>6단계 수행 절차 (분·선·구·평·승·모)<\/b> *(7단계 확장 시 준비(Prepare) 선행)*:<ul class=\"kw\"><li>1. <b>분류(Categorize)<\/b>: 시스템·정보 중요도 및 침해 영향도 등급 분류<\/li><li>2. <b>선정(Select)<\/b>: 등급별 기본 보안통제항목 선정 및 환경 맞춤 조정(Tailoring)<\/li><li>3. <b>구현(Implement)<\/b>: 시스템 아키텍처에 보안통제항목 설계·적용 및 문서화<\/li><li>4. <b>평가(Assess)<\/b>: 독립 평가자에 의한 보안통제항목 구현·효과성 검증<\/li><li>5. <b>승인(Authorize)<\/b>: 잔여위험 평가 후 인가권자의 운용승인(ATO, Authority to Operate)<\/li><li>6. <b>모니터링(Monitor)<\/b>: 운용 중 보안상태·위협 변화 추적 및 재승인 유지<\/li><\/ul><\/li><\/ul>", "pp": "<h4>1) 개념 비교<\/h4>\n<div class=\"tblwrap\"><table class=\"cmp\"><colgroup><col style=\"width:24%\"><col style=\"width:28%\"><col style=\"width:48%\"><\/colgroup><thead><tr><th>비교<\/th><th>기존 보안성 검토<\/th><th>K-RMF (위험관리프레임워크)<\/th><\/tr><\/thead><tbody><tr><td class=\"k\">수행 시점<\/td><td>개발 완료 전 일회성·사후 점검<\/td><td>기획~폐기 전 수명주기 지속 관리<\/td><\/tr><tr><td class=\"k\">통제 기준<\/td><td>획일적 체크리스트 일괄 적용<\/td><td>체계 중요도 기반 맞춤형(Tailoring) 통제<\/td><\/tr><tr><td class=\"k\">책임 구조<\/td><td>보안 부서 위주 형식적 검토<\/td><td>운용승인권자(AO)의 잔여위험 수용·책임<\/td><\/tr><\/tbody><\/table><\/div>\n<h4>2) 상세 비교 (거버넌스 · 기대효과 관점)<\/h4>\n<div class=\"tblwrap\"><table class=\"cmp\"><colgroup><col style=\"width:24%\"><col style=\"width:28%\"><col style=\"width:48%\"><\/colgroup><thead><tr><th>구분<\/th><th>특징<\/th><th>설명<\/th><\/tr><\/thead><tbody><tr><td class=\"k\">프로세스 관점<\/td><td>6단계 폐루프(ATO)<\/td><td>분·선·구·평·승·모 순환 구조로 운용승인(ATO) 이후에도 지속적 모니터링 수행<\/td><\/tr><tr><td class=\"k\">연계·확장성<\/td><td>DevSecOps·N2SF 연계<\/td><td>설계 단계 보안 내재화(Shift-Left) 및 국가 망 보안체계(N2SF) 등급별 통제와 시너지<\/td><\/tr><\/tbody><\/table><\/div>", "rv": "<div class=\"q\"><b>두음: 분·선·구·평·승·모 (준비 포함 시 준·분·선·구·평·승·모)<\/b> — 분류·선정·구현·평가·승인·모니터링<\/div>\n<div class=\"q\">핵심 키워드: <b>Tailoring(맞춤형 조정)<\/b>, <b>ATO(운용승인)<\/b>, <b>잔여위험 수용<\/b>!<\/div>", "img": "itpe-diagrams/84-k-rmf.webp", "txt": null, "search": "k-rmf (한국형 위험관리프레임워크) k-rmf (위험관리프레임워크) 분·선·구·평·승·모 / ato 보안 보안 거버넌스·대응 ⭐⭐⭐ 기출빈출 기출 빈출 중요 미국 nist rmf(sp 800-37)를 국내 국방·공공 환경에 맞게 정립한 제도로, 정보체계의 설계부터 폐기까지 전 수명주기에 걸쳐 위험 기반으로 보안통제항목을 맞춤형 적용·평가·승인·지속 모니터링 하는 위험관리 프레임워크 도입 배경 : 기존 획일적·일회성 사전 보안성 검토의 한계 극복, 무기·정보체계 첨단화에 따른 상시 사이버 위험 대응 6단계 수행 절차 (분·선·구·평·승·모) *(7단계 확장 시 준비(prepare) 선행)*: 1. 분류(categorize) : 시스템·정보 중요도 및 침해 영향도 등급 분류 2. 선정(select) : 등급별 기본 보안통제항목 선정 및 환경 맞춤 조정(tailoring) 3. 구현(implement) : 시스템 아키텍처에 보안통제항목 설계·적용 및 문서화 4. 평가(assess) : 독립 평가자에 의한 보안통제항목 구현·효과성 검증 5. 승인(authorize) : 잔여위험 평가 후 인가권자의 운용승인(ato, authority to operate) 6. 모니터링(monitor) : 운용 중 보안상태·위협 변화 추적 및 재승인 유지 1) 개념 비교 비교 기존 보안성 검토 k-rmf (위험관리프레임워크) 수행 시점 개발 완료 전 일회성·사후 점검 기획~
