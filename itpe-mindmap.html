16bit R<\/li><li><b>함수 코드<\/b>: 01·02(비트 읽기), 03·04(레지스터 읽기), 05·06(단일 쓰기), 15·16(다중 쓰기)<\/li><li><b>보안 취약<\/b>: 인증·암호화 없는 <b>평문<\/b> → 스푸핑·재전송·무단 제어 위험, <b>Modbus/TCP Security(TLS 1.3)<\/b>·네트워크 분할·게이트웨이로 보완<\/li><\/ul>", "pp": "<h4>1) 관점별 구성<\/h4>\n<div class=\"tblwrap\"><table class=\"cmp\"><colgroup><col style=\"width:24%\"><col style=\"width:28%\"><col style=\"width:48%\"><\/colgroup><thead><tr><th>관점(측면)<\/th><th>특징<\/th><th>설명<\/th><\/tr><\/thead><tbody><tr><td class=\"k\">통신 구조<\/td><td>마스터-슬레이브<\/td><td>마스터 요청·슬레이브 응답, 폴링 방식·결정적 지연<\/td><\/tr><tr><td class=\"k\">전송 계층<\/td><td>RTU·ASCII·TCP<\/td><td>직렬(RS-485)과 이더넷(TCP 502) 모두 지원<\/td><\/tr><tr><td class=\"k\">데이터 모델<\/td><td>4개 테이블<\/td><td>Coil·Discrete Input·Holding/Input Register로 구분<\/td><\/tr><tr><td class=\"k\">보안<\/td><td>평문·무인증<\/td><td>구간 분할·TLS 게이트웨이·화이트리스트로 통제<\/td><\/tr><tr><td class=\"k\">적용<\/td><td>산업 자동화<\/td><td>PLC·HMI·SCADA·센서 계측 연동, 단순·경량·광범위 채택<\/td><\/tr><\/tbody><\/table><\/div>", "rv": "<div class=\"q\"><b>두음: 마·슬·레<\/b> — 마스터 · 슬레이브 · 레지스터(4개 데이터 테이블)<\/div>\n<div class=\"q\"><b>\"4x는 Holding(쓰기 가능), 3x는 Input(읽기 전용)\"<\/b> / TCP 포트는 <b>502<\/b>, 보안은 TLS 1.3으로!<\/div>", "img": "itpe-diagrams/109-modbus.webp", "txt": null, "search": "modbus 산업용 프로토콜 modbus 마스터-슬레이브 · 4개 레지스터 네트워크 산업·미디어 네트워크 빨간별 빨간 별 빨간색 별 ★ 레드별 심화반 심화 선택 1979년 modicon이 제정한 산업용 필드버스 통신 프로토콜 로, 마스터-슬레이브(클라이언트-서버) 방식으로 plc·센서·계측기의 레지스터를 읽고 쓰는 산업 자동화 사실상 표준 구조 : 요청-응답(request/response), 마스터 1 : 슬레이브 최대 247, unit id 로 대상 지정 전송 방식 : modbus rtu (직렬 rs-485·바이너리·crc) · modbus ascii (직렬·텍스트·lrc) · modbus tcp (tcp 502·mbap 헤더) 데이터 모델 : coil(0x) 1bit r/w · discrete input(1x) 1bit r · holding register(4x) 16bit r/w · input register(3x) 16bit r 함수 코드 : 01·02(비트 읽기), 03·04(레지스터 읽기), 05·06(단일 쓰기), 15·16(다중 쓰기) 보안 취약 : 인증·암호화 없는 평문 → 스푸핑·재전송·무단 제어 위험, modbus/tcp security(tls 1.3) ·네트워크 분할·게이트웨이로 보완 1) 관점별 구성 관점(측면) 특징 설명 통신 구조 마스터-슬레이브 마스터 요청·슬레이브 응답, 폴링 방식·결정적 지연 전송 계층 rtu·ascii·tcp 직렬(rs-485)과 이더넷(tcp 502) 모두 지원 데이터 모델 4개 테이블 coil·discrete input·holding/input register로 구분 보안 평문·무인증 구간 분할·tls 게이트웨이·화이트리스트로 통제 적용 산업 자동화 plc·hmi·scada·센서 계측 연동, 단순·경량·광범위 채택 두음: 마·슬·레 — 마스터 · 슬레이브 · 레지스터(4개 데이터 테이블) \"4x는 holding(쓰기 가능), 3x는 input(읽기 전용)\" / tcp 포트는 502 , 보안은 tls 1.3으로!"}, {"id": "media-streaming", "cat": "net", "sub": "net-industry", "parent": null, "t": "스트리밍 프로토콜 · 영상압축", "s": "HLS·DASH / 무·손·혼", "stars": 0, "redStar": true, "full": "멀티미디어 스트리밍 프로토콜 · 영상 압축", "catLabel": "네트워크", "st": "📌 복습 필요", "d": "2026-11-23", "def": "<p>오디오·비디오 데이터를 <b>다운로드 완료 전에 재생<\/b>하는 스트리밍 전송 기술과, 대역폭·저장공간을 줄이기 위해 <b>공간·시간·시각적 중복을 제거<\/b>하는 영상 압축 기법<\/p>", "kw": "<ul class=\"kw\"><li><b>RTSP·RTP/RTCP<\/b>: 세션 제어(RTSP) + 실시간 전송(RTP)·QoS 피드백(RTCP), UDP 기반 저지연 — CCTV·화상<\/li><li><b>RTMP<\/b>: TCP 기반 송출(업로드) 프로토콜, 지연 낮음 — 라이브 방송 인제스트<\/li><li><b>HLS<\/b>: HTTP 기반 <b>세그먼트(m3u8 + ts)<\/b> 전송, 적응형·방화벽 친화, 지연 상대적 큼 — LL-HLS로 저지연<\/li><li><b>MPEG-DASH<\/b>: HTTP 기반 <b>적응형 스트리밍 국제표준(MPD)<\/b>, 코덱·DRM 독립적<\/li><li><b>WebRTC<\/b>: UDP 기반 초저지연 P2P 실시간 통신(SRTP·ICE)<\/li><li><b>영상 압축<\/b>: <b>무손실<\/b>(RLE·Huffman·LZW, PNG·FLAC) / <b>손실<\/b>(DCT·양자화 + 심리시각 모델, JPEG·H.264·H.265·AV1) / <b>혼합<\/b>(하이브리드 — 예측·변환 후 엔트로피 코딩, HEVC)<\/li><\/ul>", "pp": "<h4>1) 스트리밍 프로토콜 비교<\/h4>\n<div class=\"tblwrap\"><table class=\"cmp\"><thead><tr><th>비교<\/th><th>RTSP/RTP<\/th><th>HLS<\/th><th>MPEG-DASH<\/th><\/tr><\/thead><tbody><tr><td class=\"k\">전송 기반<\/td><td>UDP(실시간)<\/td><td>HTTP(세그먼트)<\/td><td>HTTP(세그먼트)<\/td><\/tr><tr><td class=\"k\">지연<\/td><td>매우 낮음<\/td><td>높음(LL-HLS로 개선)<\/td><td>중간<\/td><\/tr><tr><td class=\"k\">적합 용도<\/td><td>CCTV·화상·제어<\/td><td>범용 OTT·모바일<\/td><td>표준 기반 OTT·멀티 DRM<\/td><\/tr><\/tbody><\/table><\/div>\n<h4>2) 영상 압축 기법 비교<\/h4>\n<div class=\"tblwrap\"><table class=\"cmp\"><thead><tr><th>구분<\/th><th>무손실 압축<\/th><th>손실 압축<\/th><th>혼합(하이브리드)<\/th><\/tr><\/thead><tbody><tr><td class=\"k\">원리<\/td><td>중복 제거(RLE·Huffman)<\/td><td>DCT·양자화·심리시각<\/td><td>예측·변환 + 엔트로피 코딩<\/td><\/tr><tr><td class=\"k\">화질<\/td><td>원본 완전 복원<\/td><td>열화 발생·비가역<\/td><td>화질-용량 최적 절충<\/td><\/tr><tr><td class=\"k\">예시<\/td><td>PNG·FLAC·ZIP<\/td><td>JPEG·MP3<\/td><td>H.264·H.265·AV1<\/td><\/tr><\/tbody><\/table><\/div>", "rv": "<div class=\"q\"><b>두음: 알·에이치·디<\/b> — RTSP(제어·UDP) · HLS(HTTP·m3u8) · DASH(MPD 표준)<\/div>\n<div class=\"q\"><b>압축 두음: 무·손·혼<\/b> — 무손실(복원) · 손실(비가역) · 혼합(부호화 표준)<\/div>\n<div class=\"q\"><b>\"전송은 HTTP로, 지연은 WebRTC로\"<\/b> — OTT는 HLS/DASH, 실시간 제어는 RTP/WebRTC!<\/div>", "img": "itpe-diagrams/110-media-streaming.webp", "txt": null, "search": "멀티미디어 스트리밍 프로토콜 · 영상 압축 스트리밍 프로토콜 · 영상압축 hls·dash / 무·손·혼 네트워크 산업·미디어 네트워크 빨간별 빨간 별 빨간색 별 ★ 레드별 심화반 심화 선택 오디오·비디오 데이터를 다운로드 완료 전에 재생 하는 스트리밍 전송 기술과, 대역폭·저장공간을 줄이기 위해 공간·시간·시각적 중복을 제거 하는 영상 압축 기법 rtsp·rtp/rtcp : 세션 제어(rtsp) + 실시간 전송(rtp)·qos 피드백(rtcp), udp 기반 저지연 — cctv·화상 rtmp : tcp 기반 송출(업로드) 프로토콜, 지연 낮음 — 라이브 방송 인제스트 hls : http 기반 세그먼트(m3u8 + ts) 전송, 적응형·방화벽 친화, 지연 상대적 큼 — ll-hls로 저지연 mpeg-dash : http 기반 적응형 스트리밍 국제표준(mpd) , 코덱·drm 독립적 webrtc : udp 기반 초저지연 p2p 실시간 통신(srtp·ice) 영상 압축 : 무손실 (rle·huffman·lzw, png·flac) / 손실 (dct·양자화 + 심리시각 모델, jpeg·h.264·h.265·av1) / 혼합 (하이브리드 — 예측·변환 후 엔트로피 코딩, hevc) 1) 스트리밍 프로토콜 비교 비교 rtsp/rtp hls mpeg-dash 전송 기반 udp(실시간) http(세그먼트) http(세그먼트) 지연 매우 낮음 높음(ll-hls로 개선) 중간 적합 용도 cctv·화상·제어 범용 ott·모바일 표준 기반 ott·멀티 drm 2) 영상 압축 기법 비교 구분 무손실 압축 손실 압축 혼합(하이브리드) 원리 중복 제거(rle·huffman) dct·양자화·심리시각 예측·변환 + 엔트로피 코딩 화질 원본 완전 복원 열화 발생·비가역 화질-용량 최적 절충 예시 png·flac·zip jpeg·mp3 h.264·h.265·av1 두음: 알·에이치·디 — rtsp(제어·udp) · hls(http·m3u8) · dash(mpd 표준) 압축 두음: 무·손·혼 — 무손실(복원) · 손실(비가역) · 혼합(부호화 표준) \"전송은 http로, 지연은 webrtc로\" — ott는 hls/dash, 실시간 제어는 rtp/webrtc!"}, {"id": "future-net-tech", "cat": "net", "sub": "net-industry", "parent": null, "t": "신기술 융합 (차세대 네트워크)", "s": "인터미턴트·촉각·안티드론", "stars": 0, "redStar": true, "full": "신기술 융합 (인터미턴트 컴퓨팅 · 촉각인터넷 · 안티드론)", "catLabel": "네트워크", "st": "📌 복습 필요", "d": "2026-11-23", "def": "<p><b>에너지 수확 기반의 단속적 연산(인터미턴트 컴퓨팅)<\/b>, <b>1ms급 실시간 촉각 전송(촉각인터넷)<\/b>, <b>무인기 위협 대응 체계(안티드론)<\/b>를 아우르는 차세대 컴퓨팅·네트워크 융합 기술<\/p>", "kw": "<ul class=\"kw\"><li><b>인터미턴트 컴퓨팅(Intermittent Computing)<\/b>: 배터리 없이 <b>에너지 하베스팅<\/b>으로 단속적 실행 — 전원 단절 대비 <b>체크포인트·비휘발성 메모리(NVM)·정전 원자성(Failure-atomic)<\/b>, 재개(Resume)로 진행 보존<\/li><li><b>촉각인터넷(Tactile Internet)<\/b>: <b>1ms 이하 지연·초저 지터·99.999% 신뢰성<\/b>의 실시간 촉각·운동 전송 — 5G URLLC·MEC·엣지 기반, 원격 수술·산업 제어·원격 조작<\/li><li><b>안티드론(TTAK.KO-10.1460)<\/b>: 위협 <b>탐지(레이더·RF·음향·비전) → 식별·분류 → 무력화(재밍·스푸핑·포획)<\/b>의 다중 센서 융합 대응 체계, 기술적·비기술적 대응 및 법·규제(전파법)<\/li><li><b>공통 기반<\/b>: 초저지연·초신뢰 네트워크(URLLC), 엣지 지능, 에너지 자율 동작<\/li><\/ul>", "pp": "<h4>1) 기술별 비교<\/h4>\n<div class=\"tblwrap\"><table class=\"cmp\"><colgroup><col style=\"width:24%\"><col style=\"width:28%\"><col style=\"width:48%\"><\/colgroup><thead><tr><th>기술<\/th><th>정의·특징<\/th><th>핵심 요소 · 활용<\/th><\/tr><\/thead><tbody><tr><td class=\"k\">인터미턴트 컴퓨팅<\/td><td>에너지 하베스팅 기반 단속 실행<\/td><td>체크포인트·NVM·Failure-atomic / 배터리리스 IoT·웨어러블<\/td><\/tr><tr><td class=\"k\">촉각인터넷<\/td><td>1ms 지연의 실시간 촉각 전송<\/td><td>URLLC·MEC·지터 최소화 / 원격수술·원격조작·산업제어<\/td><\/tr><tr><td class=\"k\">안티드론<\/td><td>무인기 위협 탐지·무력화<\/td><td>레이더·RF·음향·비전 융합 / 공항·군사·주요 시설 방호<\/td><\/tr><\/tbody><\/table><\/div>\n<h4>2) 관점별 구성<\/h4>\n<div class=\"tblwrap\"><table class=\"cmp\"><colgroup><col style=\"width:24%\"><col style=\"width:28%\"><col style=\"width:48%\"><\/colgroup><thead><tr><th>관점(측면)<\/th><th>특징<\/th><th>설명<\/th><\/tr><\/thead><tbody><tr><td class=\"k\">성능 요건<\/td><td>초저지연·초신뢰<\/td><td>촉각인터넷은 1ms·99.999%, 안티드론은 실시간 탐지·대응<\/td><\/tr><tr><td class=\"k\">자원<\/td><td>에너지·연산 제약<\/td><td>인터미턴트는 전력 자율, 촉각은 엣지 연산 필수<\/td><\/tr><tr><td class=\"k\">보안·규제<\/td><td>물리·전파 통제<\/td><td>안티드론은 재밍·스푸핑의 법적 근거·오탐 관리 필요<\/td><\/tr><\/tbody><\/table><\/div>", "rv": "<div class=\"q\"><b>두음: 인·촉·안<\/b> — 인터미턴트(체크포인트) · 촉각(1ms) · 안티드론(재밍·스푸핑)<\/div>\n<div class=\"q\"><b>\"인터미턴트 = 끊겨도 이어서, 촉각 = 1ms, 안티드론 = 탐지→식별→무력화\"<\/b> 3단 구조로 기억!<\/div>", "img": "itpe-diagrams/111-future-net-tech.webp", "txt": null, "search": "신기술 융합 (인터미턴트 컴퓨팅 · 촉각인터넷 · 안티드론) 신기술 융합 (차세대 네트워크) 인터미턴트·촉각·안티드론 네트워크 산업·미디어 네트워크 빨간별 빨간 별 빨간색 별 ★ 레드별 심화반 심화 선택 에너지 수확 기반의 단속적 연산(인터미턴트 컴퓨팅) , 1ms급 실시간 촉각 전송(촉각인터넷) , 무인기 위협 대응 체계(안티드론) 를 아우르는 차세대 컴퓨팅·네트워크 융합 기술 인터미턴트 컴퓨팅(intermittent computing) : 배터리 없이 에너지 하베스팅 으로 단속적 실행 — 전원 단절 대비 체크포인트·비휘발성 메모리(nvm)·정전 원자성(failure-atomic) , 재개(resume)로 진행 보존 촉각인터넷(tactile internet) : 1ms 이하 지연·초저 지터·99.999% 신뢰성 의 실시간 촉각·운동 전송 — 5g urllc·mec·엣지 기반, 원격 수술·산업 제어·원격 조작 안티드론(ttak.ko-10.1460) : 위협 탐지(레이더·rf·음향·비전) → 식별·분류 → 무력화(재밍·스푸핑·포획) 의 다중 센서 융합 대응 체계, 기술적·비기술적 대응 및 법·규제(전파법) 공통 기반 : 초저지연·초신뢰 네트워크(urllc), 엣지 지능, 에너지 자율 동작 1) 기술별 비교 기술 정의·특징 핵심 요소 · 활용 인터미턴트 컴퓨팅 에너지 하베스팅 기반 단속 실행 체크포인트·nvm·failure-atomic / 배터리리스 iot·웨어러블 촉각인터넷 1ms 지연의 실시간 촉각 전송 urllc·mec·지터 최소화 / 원격수술·원격조작·산업제어 안티드론 무인기 위협 탐지·무력화 레이더·rf·음향·비전 융합 / 공항·군사·주요 시설 방호 2) 관점별 구성 관점(측면) 특징 설명 성능 요건 초저지연·초신뢰 촉각인터넷은 1ms·99.999%, 안티드론은 실시간 탐지·대응 자원 에너지·연산 제약 인터미턴트는 전력 자율, 촉각은 엣지 연산 필수 보안·규제 물리·전파 통제 안티드론은 재밍·스푸핑의 법적 근거·오탐 관리 필요 두음: 인·촉·안 — 인터미턴트(체크포인트) · 촉각(1ms) · 안티드론(재밍·스푸핑) \"인터미턴트 = 끊겨도 이어서, 촉각 = 1ms, 안티드론 = 탐지→식별→무력화\" 3단 구조로 기억!"}, {"id": "leo-satellite", "cat": "net", "sub": "net-arch", "parent": null, "t": "저궤도 위성통신", "s": "LEO · 3GPP NTN", "stars": 2, "redStar": false, "full": "저궤도 위성통신 (LEO Satellite) · 3GPP NTN", "catLabel": "네트워크", "st": "📌 복습 필요", "d": "2026-11-25", "def": "<p><b>저궤도 위성통신(LEO Satellite)<\/b>은 고도 300~2,000km 위성 군집(Constellation)과 위성 간 레이저 통신(<b>ISL<\/b>)을 활용해 초저지연·광대역 커버리지와 3GPP <b>NTN(비지상망)<\/b> 연동을 제공하는 <b>차세대 위성 통신 체계<\/b><\/p>", "kw": "<ul class=\"kw\"><li><b>궤도<\/b>: GEO(35,786km, 정지, 왕복 지연 500ms+) · MEO(2,000~20,000km, GPS) · LEO(300~2,000km, 왕복 20~40ms)<\/li><li><b>Constellation<\/b>: 수백~수천 기 위성을 다중 궤도면(Shell)으로 배치 — Starlink·OneWeb·Kuiper<\/li><li><b>ISL (Inter-Satellite Link)<\/b>: 위성 간 레이저 광통신으로 지상국 경유 없이 메시(Mesh) 구성, 지연·회선 의존 감소<\/li><li><b>3GPP NTN<\/b>: Rel-17에서 5G NR NTN 표준화(위성-단말 직접 연결), Rel-18에서 커버리지·이동성 개선<\/li><li><b>도플러 효과<\/b>: 고속 이동에 따른 주파수 편이 — 사전 보정·타이밍 어드밴스(TA)로 보상<\/li><li><b>핸드오버<\/b>: 위성 가시 시간이 수 분에 불과 → 위성 간·빔 간 핸드오버로 세션 연속성 유지<\/li><li><b>지상 연계<\/b>: Gateway·사용자 단말·코어망 연동 — 오지·해상·항공·재난 통신 보완<\/li><\/ul>", "pp": "<h4>1) GEO vs MEO vs LEO<\/h4>\n<div class=\"tblwrap\"><table class=\"cmp\"><colgroup><col style=\"width:24%\"><col style=\"width:28%\"><col style=\"width:48%\"><\/colgroup><thead><tr><th>구분<\/th><th>키워드<\/th><th>설명<\/th><\/tr><\/thead><tbody><tr><td class=\"k\">GEO<\/td><td>35,786km · 정지궤도<\/td><td>3기로 전 지구 커버, 지연 500ms+ — 방송·기상·고정 위성통신<\/td><\/tr><tr><td class=\"k\">MEO<\/td><td>2,000~20,000km · 중궤도<\/td><td>지연 수십~100ms, 10~30기 운용 — GPS·항법<\/td><\/tr><tr><td class=\"k\">LEO<\/td><td>300~2,000km · 저궤도<\/td><td>지연 20~40ms, 수백~수천 기 군집 필요 — 초고속 인터넷·D2D<\/td><\/tr><\/tbody><\/table><\/div>\n<h4>2) LEO 시스템 구성과 핵심 기술<\/h4>\n<div class=\"tblwrap\"><table class=\"cmp\"><colgroup><col style=\"width:24%\"><col style=\"width:28%\"><col style=\"width:48%\"><\/colgroup><thead><tr><th>구분<\/th><th>키워드<\/th><th>설명<\/th><\/tr><\/thead><tbody><tr><td class=\"k\">우주부<\/td><td>Constellation·Shell<\/td><td>다중 궤도면·경사각 설계로 위도별 용량·커버리지 확보<\/td><\/tr><tr><td class=\"k\">링크<\/td><td>ISL·Feeder Link<\/td><td>위성 간 레이저 링크, 위성-지상국 피더 링크로 백홀 구성<\/td><\/tr><tr><td class=\"k\">이동성<\/td><td>도플러·핸드오버<\/td><td>도플러 편이 보상, 위성·빔 간 핸드오버로 세션 유지<\/td><\/tr><tr><td class=\"k\">표준<\/td><td>3GPP NTN<\/td><td>Rel-17 NR NTN, 지연·도플러 대응 파라미터, 재난·비상 통신<\/td><\/tr><tr><td class=\"k\">지상부<\/td><td>Gateway·단말<\/td><td>게이트웨이국·사용자 단말 안테나, 코어망 연동<\/td><\/tr><\/tbody><\/table><\/div>\n<h4>3) 도입·운영 고려사항<\/h4>\n<div class=\"tblwrap\"><table class=\"cmp\"><colgroup><col style=\"width:24%\"><col style=\"width:28%\"><col style=\"width:48%\"><\/colgroup><thead><tr><th>구분<\/th><th>키워드<\/th><th>설명<\/th><\/tr><\/thead><tbody><tr><td class=\"k\">용량<\/td><td>주파수·빔 재사용<\/td><td>Ka·Ku 대역, 다중 빔·주파수 재사용으로 지역 용량 확보<\/td><\/tr><tr><td class=\"k\">지연<\/td><td>궤도·라우팅<\/td><td>LEO도 지상 광망보다 지연이 큼 — ISL 라우팅·엣지 캐시로 완화<\/td><\/tr><tr><td class=\"k\">비용<\/td><td>발사·단말<\/td><td>대량 발사·재사용 로켓으로 위성 원가 절감, 단말 안테나 비용이 관건<\/td><\/tr><tr><td class=\"k\">규제<\/td> b": "db-model", "parent": null, "t": "정규화(1NF~BCNF)·반정규화", "s": "도·부·이·결 / Join 성능 최적화", "stars": 3, "redStar": false, "full": "정규화(1NF~BCNF)와 반정규화", "catLabel": "데이터베이스", "st": "📌 복습 필요", "d": "2026-11-21", "def": "<p><b>정규화<\/b>는 릴레이션의 데이터 중복과 <b>이상 현상(삽입·삭제·갱신 이상)<\/b>을 제거하기 위해 함수적 종속성에 따라 테이블을 분해하는 과정이며, <b>반정규화<\/b>는 조회(Join) 성능 향상을 위해 의도적으로 중복·통합을 허용하는 기법<\/p>", "kw": "<ul class=\"kw\"><li><b>정규화 단계 (두음: 도·부·이·결·다·조)<\/b>:<ul class=\"kw\"><li><b>1NF<\/b>: 모든 속성의 도메인이 <b>원자값(Atomic Value)<\/b>을 가짐<\/li><li><b>2NF<\/b>: 1NF 만족 + <b>부분 함수 종속 제거<\/b> (기본키 전체에 완전 함수 종속)<\/li><li><b>3NF<\/b>: 2NF 만족 + <b>이행적 함수 종속 제거<\/b> (X→Y, Y→Z 일 때 X→Z 제거)<\/li><li><b>BCNF<\/b>: 3NF 만족 + <b>모든 결정자(Determinant)가 후보키<\/b><\/li><\/ul><\/li><li><b>반정규화<\/b>: 과도한 Join으로 인한 Read 성능 저하 시 테이블 통합·분할, 중복·파생 컬럼 추가 (정합성 관리 비용 trade-off)<\/li><\/ul>", "pp": "<div class=\"tblwrap\"><table class=\"cmp\"><colgroup><col style=\"width:24%\"><col style=\"width:28%\"><col style=\"width:48%\"><\/colgroup><thead><tr><th>관점(측면)<\/th><th>특징<\/th><th>설명<\/th><\/tr><\/thead><tbody><tr><td class=\"k\">무결성·이상 관점<\/td><td>삽입·삭제·갱신 이상 제거<\/td><td>정규화를 통해 중복 데이터를 없애고 데이터 일관성·무결성 확보<\/td><\/tr><tr><td class=\"k\">종속성 단계 관점<\/td><td>도·부·이·결 (1NF~BCNF)<\/td><td>도메인 원자값(1) → 부분종속(2) → 이행종속(3) → 결정자=후보키(BCNF) 순 분해<\/td><\/tr><tr><td class=\"k\">성능·조회 관점<\/td><td>반정규화 (Join 축소)<\/td><td>대량 조회·집계 시 Join 병목을 줄이기 위해 중복·파생 컬럼 등 의도적 허용<\/td><\/tr><tr><td class=\"k\">운영·트레이드오프<\/td><td>정합성 vs 성능 균형<\/td><td>쓰기 중심(OLTP)은 정규화 우선, 읽기 집중 구간만 제한적 반정규화 적용<\/td><\/tr><\/tbody><\/table><\/div>", "rv": "<div class=\"q\"><b>두음: 도·부·이·결·다·조<\/b> — 도(도메인 원자값·1NF)·부(부분 종속·2NF)·이(이행 종속·3NF)·결(결정자=후보키·BCNF)·다(다치 종속·4NF)·조(조인 종속·5NF)<\/div>\n<div class=\"q\"><b>도·부·이·결(1NF~BCNF) + 이상현상 3종 + 반정규화(정합성 vs 성능)<\/b> 세트 암기!<\/div>", "img": "itpe-diagrams/42-normalization.webp", "txt": null, "search": "정규화(1nf~bcnf)와 반정규화 정규화(1nf~bcnf)·반정규화 도·부·이·결 / join 성능 최적화 데이터베이스 모델링·인덱스 ⭐⭐⭐ 기출빈출 기출 빈출 중요 정규화 는 릴레이션의 데이터 중복과 이상 현상(삽입·삭제·갱신 이상) 을 제거하기 위해 함수적 종속성에 따라 테이블을 분해하는 과정이며, 반정규화 는 조회(join) 성능 향상을 위해 의도적으로 중복·통합을 허용하는 기법 정규화 단계 (두음: 도·부·이·결·다·조) : 1nf : 모든 속성의 도메인이 원자값(atomic value) 을 가짐 2nf : 1nf 만족 + 부분 함수 종속 제거 (기본키 전체에 완전 함수 종속) 3nf : 2nf 만족 + 이행적 함수 종속 제거 (x→y, y→z 일 때 x→z 제거) bcnf : 3nf 만족 + 모든 결정자(determinant)가 후보키 반정규화 : 과도한 join으로 인한 read 성능 저하 시 테이블 통합·분할, 중복·파생 컬럼 추가 (정합성 관리 비용 trade-off) 관점(측면) 특징 설명 무결성·이상 관점 삽입·삭제·갱신 이상 제거 정규화를 통해 중복 데이터를 없애고 데이터 일관성·무결성 확보 종속성 단계 관점 도·부·이·결 (1nf~bcnf) 도메인 원자값(1) → 부분종속(2) → 이행종속(3) → 결정자=후보키(bcnf) 순 분해 성능·조회 관점 반정규화 (join 축소) 대량 조회·집계 시 join 병목을 줄이기 위해 중복·파생 컬럼 등 의도적 허용 운영·트레이드오프 정합성 vs 성능 균형 쓰기 중심(oltp)은 정규화 우선, 읽기 집중 구간만 제한적 반정규화 적용 두음: 도·부·이·결·다·조 — 도(도메인 원자값·1nf)·부(부분 종속·2nf)·이(이행 종속·3nf)·결(결정자=후보키·bcnf)·다(다치 종속·4nf)·조(조인 종속·5nf) 도·부·이·결(1nf~bcnf) + 이상현상 3종 + 반정규화(정합성 vs 성능) 세트 암기!"}, {"id": "isolation", "cat": "db", "sub": "db-tx", "parent": null, "t": "트랜잭션 격리 수준", "s": "Isolation Level", "stars": 3, "redStar": false, "full": "트랜잭션 격리 수준 (Isolation Level)", "catLabel": "데이터베이스", "st": "📌 복습 필요", "d": "2026-11-19", "def": "<p>여러 트랜잭션이 동시에 수행될 때 <b>다른 트랜잭션의 연산 작업이 끼어들지 못하도록 격리하는 정도<\/b>를 규정한 ANSI SQL 표준 단계(동시성 ↔ 일관성 트레이드오프)<\/p>", "kw": "<ul class=\"kw\"><li><b>4단계<\/b> (아래로 갈수록 격리 수준 ↑ · 동시성 ↓)<ul class=\"kw\"><li><code>Read Uncommitted<\/code> — 커밋되지 않은 데이터도 읽기 허용<\/li><li><code>Read Committed<\/code> — 커밋된 데이터만 읽기 (<b>Oracle·PostgreSQL 기본<\/b>)<\/li><li><code>Repeatable Read<\/code> — 트랜잭션 내 같은 행을 다시 조회해도 값 고정 (<b>MySQL InnoDB 기본<\/b>)<\/li><li><code>Serializable<\/code> — 트랜잭션을 순차 실행한 것처럼 완전 격리<\/li><\/ul><\/li><li><b>3대 읽기 이상 현상<\/b><ul class=\"kw\"><li><code>Dirty Read<\/code> — 커밋 안 된 데이터 읽기<\/li><li><code>Non-Repeatable Read<\/code> — 한 트랜잭션 내 같은 행 조회 값이 달라짐<\/li><li><code>Phantom Read<\/code> — 조건 조회 시 없던 행이 새로 나타남/사라짐<\/li><\/ul><\/li><li><b>구분 주의<\/b>: <b>삽입·삭제·수정 이상<\/b>은 <b>정규화(반정규화)의 갱신 이상<\/b>, 격리 수준은 <b>Dirty·Non-Repeatable·Phantom Read<\/b>!<\/li><\/ul>", "pp": "<div class=\"tblwrap\"><table class=\"cmp\"><colgroup><col style=\"width:24%\"><col style=\"width:28%\"><col style=\"width:48%\"><\/colgroup><thead><tr><th>관점(측면)<\/th><th>특징<\/th><th>설명<\/th><\/tr><\/thead><tbody><tr><td class=\"k\">단계 구조<\/td><td>4단계 상향<\/td><td>Read Uncommitted → Read Committed → Repeatable Read → Serializable 순으로 격리 강도 상승<\/td><\/tr><tr><td class=\"k\">이상 현상<\/td><td>Dirty·Non-Repeatable·Phantom<\/td><td>단계가 올라갈수록 차단되는 현상이 달라지며 Serializable은 세 현상을 모두 방지<\/td><\/tr><tr><td class=\"k\">제품 기본값<\/td><td>Oracle·PG vs MySQL<\/td><td>Oracle·PostgreSQL은 Read Committed, MySQL InnoDB는 Repeatable Read를 기본으로 사용<\/td><\/tr><tr><td class=\"k\">설계 트레이드오프<\/td><td>동시성 ↔ 일관성<\/td><td>격리를 높이면 락·대기로 동시성이 떨어지고, 낮추면 정합성 위험이 커짐<\/td><\/tr><\/tbody><\/table><\/div>", "rv": "<div class=\"q\"><b>두음: 언·커·리·시 / 더·반·팬<\/b> — 언(Uncommitted)·커(Committed)·리(Repeatable)·시(Serializable) / 더(Dirty)·반(Non-Repeatable)·팬(Phantom)<\/div>\n<div class=\"q\">\"Read Uncommitted → Committed → Repeatable → Serializable\" 4단계와 <b>Dirty / Non-Repeatable / Phantom<\/b> 3대 현상 매핑표를 그대로 그려내기!<\/div>", "img": "itpe-diagrams/13-%ED%8A%B8%EB%9E%9C%EC%9E%AD%EC%85%98-%EA%B2%A9%EB%A6%AC%EC%88%98%EC%A4%80.webp", "txt": null, "search": "트랜잭션 격리 수준 (isolation level) 트랜잭션 격리 수준 isolation level 데이터베이스 트랜잭션·동시성 ⭐⭐⭐ 기출빈출 기출 빈출 중요 여러 트랜잭션이 동시에 수행될 때 다른 트랜잭션의 연산 작업이 끼어들지 못하도록 격리하는 정도 를 규정한 ansi sql 표준 단계(동시성 ↔ 일관성 트레이드오프) 4단계 (아래로 갈수록 격리 수준 ↑ · 동시성 ↓) read uncommitted — 커밋되지 않은 데이터도 읽기 허용 read committed — 커밋된 데이터만 읽기 ( oracle·postgresql 기본 ) repeatable read — 트랜잭션 내 같은 행을 다시 조회해도 값 고정 ( mysql innodb 기본 ) serializable — 트랜잭션을 순차 실행한 것처럼 완전 격리 3대 읽기 이상 현상 dirty read — 커밋 안 된 데이터 읽기 non-repeatable read — 한 트랜잭션 내 같은 행 조회 값이 달라짐 phantom read — 조건 조회 시 없던 행이 새로 나타남/사라짐 구분 주의 : 삽입·삭제·수정 이상 은 정규화(반정규화)의 갱신 이상 , 격리 수준은 dirty·non-repeatable·phantom read ! 관점(측면) 특징 설명 단계 구조 4단계 상향 read uncommitted → read committed → repeatable read → serializable 순으로 격리 강도 상승 이상 현상 dirty·non-repeatable·phantom 단계가 올라갈수록 차단되는 현상이 달라지며 serializable은 세 현상을 모두 방지 제품 기본값 oracle·pg vs mysql oracle·postgresql은 read committed, mysql innodb는 repeatable read를 기본으로 사용 설계 트레이드오프 동시성 ↔ 일관성 격리를 높이면 락·대기로 동시성이 떨어지고, 낮추면 정합성 위험이 커짐 두음: 언·커·리·시 / 더·반·팬 — 언(uncommitted)·커(committed)·리(repeatable)·시(serializable) / 더(dirty)·반(non-repeatable)·팬(phantom) \"read uncommitted → committed → repeatable → serializable\" 4단계와 dirty / non-repeatable / phantom 3대 현상 매핑표를 그대로 그려내기!"}, {"id": "mvcc", "cat": "db", "sub": "db-tx", "parent": null, "t": "MVCC", "s": "다중 버전 동시성 제어", "stars": 2, "redStar": false, "full": "MVCC (Multi-Version Concurrency Control)", "catLabel": "데이터베이스", "st": "📌 복습 필요", "d": "2026-11-19", "def": "<p>데이터의 <b>다중 버전(Multi-Version)<\/b> 을 유지하여 읽기·쓰기 작업 간 <b>잠금(Lock) 경합 없이<\/b> 일관성 있는 스냅샷을 제공하는 <b>단일 RDBMS 내부<\/b> 동시성 제어 기법<\/p>", "kw": "<ul class=\"kw\"><li><code>Non-blocking Read/Write<\/code> — 읽기와 쓰기가 서로를 차단하지 않음<\/li><li><code>Snapshot Isolation<\/code> — 트랜잭션 시작 시점(또는 문장 시점)의 일관된 스냅샷 읽기<\/li><li><b>구현 방식<\/b><ul class=\"kw\"><li><code>Undo 로그<\/code> — Oracle, MySQL(InnoDB)<\/li><li><code>Tuple 버전 + Vacuum<\/code> — PostgreSQL<\/li><\/ul><\/li><li><b>단점<\/b>: 버전 증가에 따른 저장공간 소모, 주기적 <code>가비지 컬렉션(GC / Vacuum)<\/code> 필요, <code>Write Skew<\/code> 같은 이상 현상 주의<\/li><\/ul>", "pp": "<div class=\"tblwrap\"><table class=\"cmp\"><colgroup><col style=\"width:24%\"><col style=\"width:28%\"><col style=\"width:48%\"><\/colgroup><thead><tr><th>관점(측면)<\/th><th>특징<\/th><th>설명<\/th><\/tr><\/thead><tbody><tr><td class=\"k\">동시성<\/td><td>Non-blocking Read/Write<\/td><td>읽기와 쓰기가 서로를 차단하지 않아 락 대기 없이 동시 처리량을 확보<\/td><\/tr><tr><td class=\"k\">일관성<\/td><td>Snapshot Isolation<\/td><td>트랜잭션 시작 시점의 스냅샷을 읽어 반복 조회에도 같은 값을 보장<\/td><\/tr><tr><td class=\"k\">구현 방식<\/td><td>Undo 로그 vs Tuple 버전<\/td><td>Oracle·InnoDB는 Undo 로그로 이전 버전을 재구성, PostgreSQL은 튜플 버전을 유지하고 Vacuum<\/td><\/tr><tr><td class=\"k\">부하·이상<\/td><td>GC·Write Skew<\/td><td>버전 누적으로 저장공간·GC 부하가 커지고, 쓰기 편향(Write Skew)은 별도 격리 수준으로 대응<\/td><\/tr><\/tbody><\/table><\/div>", "rv": "<div class=\"q\"><b>두음: 논·스·언·백<\/b> — 논(Non-blocking)·스(Snapshot)·언(Undo 로그)·백(Vacuum·GC)<\/div>\n<div class=\"q\">MSA 서비스 간 기술이 아니라 <b>단일 DB 엔진 내부<\/b> 기법이라는 점 헷갈리지 않기! \"읽기는 막지 않고, 버전으로 일관성을 준다.\"<\/div>", "img": "itpe-diagrams/21-mvcc.webp", "txt": null, "search": "mvcc (multi-version concurrency control) mvcc 다중 버전 동시성 제어 데이터베이스 트랜잭션·동시성 ⭐⭐ 기출빈출 기출 빈출 중요 데이터의 다중 버전(multi-version) 을 유지하여 읽기·쓰기 작업 간 잠금(lock) 경합 없이 일관성 있는 스냅샷을 제공하는 단일 rdbms 내부 동시성 제어 기법 non-blocking read/write — 읽기와 쓰기가 서로를 차단하지 않음 snapshot isolation — 트랜잭션 시작 시점(또는 문장 시점)의 일관된 스냅샷 읽기 구현 방식 undo 로그 — oracle, mysql(innodb) tuple 버전 + vacuum — postgresql 단점 : 버전 증가에 따른 저장공간 소모, 주기적 가비지 컬렉션(gc / vacuum) 필요, write skew 같은 이상 현상 주의 관점(측면) 특징 설명 동시성 non-blocking read/write 읽기와 쓰기가 서로를 차단하지 않아 락 대기 없이 동시 처리량을 확보 일관성 snapshot isolation 트랜잭션 시작 시점의 스냅샷을 읽어 반복 조회에도 같은 값을 보장 구현 방식 undo 로그 vs tuple 버전 oracle·innodb는 undo 로그로 이전 버전을 재구성, postgresql은 튜플 버전을 유지하고 vacuum 부하·이상 gc·write skew 버전 누적으로 저장공간·gc 부하가 커지고, 쓰기 편향(write skew)은 별도 격리 수준으로 대응 두음: 논·스·언·백 — 논(non-blocking)·스(snapshot)·언(undo 로그)·백(vacuum·gc) msa 서비스 간 기술이 아니라 단일 db 엔진 내부 기법이라는 점 헷갈리지 않기! \"읽기는 막지 않고, 버전으로 일관성을 준다.\""}, {"id": "deadlock", "cat": "db", "sub": "db-tx", "parent": null, "t": "교착상태 (Deadlock)", "s": "상·점·비·환 / 예·회·탐·복", "stars": 3, "redStar": false, "full": "교착상태(Deadlock) 4대 조건과 해결 기법", "catLabel": "데이터베이스", "st": "📌 복습 필요", "d": "2026-11-21", "def": "<p>두 개 이상의 트랜잭션(또는 프로세스)이 <b>서로가 점유한 락(자원)이 해제되기를 기다리며 무한 대기<\/b>에 빠지는 상태<\/p>", "kw": "<ul class=\"kw\"><li><b>4대 필요충분 조건 (상·점·비·환)<\/b>: <b>상호배제<\/b>(독점 사용) · <b>점유와 대기<\/b>(쥔 채 추가 대기) · <b>비선점<\/b>(강제 탈취 불가) · <b>환형대기<\/b>(순환 대기 사이클)<\/li><li><b>4대 해결 기법 (예·회·탐·복)<\/b>:<ul class=\"kw\"><li><b>예방 (Prevention)<\/b>: 4대 조건 중 1개 이상 원천 제거 (타임스탬프 기반 <b>Wait-Die · Wound-Wait<\/b>)<\/li><li><b>회피 (Avoidance)<\/b>: 안전 상태(Safe State)만 할당 허용 (<b>은행원 알고리즘<\/b>)<\/li><li><b>탐지 (Detection)<\/b>: <b>Wait-For Graph(대기 그래프)<\/b> 사이클 주기적 검사<\/li><li><b>복구 (Recovery)<\/b>: 비용이 적은 <b>희생자(Victim)<\/b> 선정 후 Rollback(선점·종료)<\/li><\/ul><\/li><\/ul>", "pp": "<div class=\"tblwrap\"><table class=\"cmp\"><colgroup><col style=\"width:24%\"><col style=\"width:28%\"><col style=\"width:48%\"><\/colgroup><thead><tr><th>관점(측면)<\/th><th>특징<\/th><th>설명<\/th><\/tr><\/thead><tbody><tr><td class=\"k\">발생 조건 관점<\/td><td>상·점·비·환 (모두 충족)<\/td><td>4가지 조건이 동시에 성립해야 교착 발생 — 1개만 깨도 교착 방지<\/td><\/tr><tr><td class=\"k\">사전 대응 관점<\/td><td>예방 · 회피<\/td><td>타임스탬프 기반 선점/포기(Wait-Die/Wound-Wait) 또는 안전 상태 유지<\/td><\/tr><tr><td class=\"k\">사후 대응 관점<\/td><td>탐지 · 복구 (실무 RDBMS)<\/td><td>RDBMS는 오버헤드 줄이려 대기 그래프(WFG) 탐지 후 Victim 롤백 채택<\/td><\/tr><tr><td class=\"k\">설계·튜닝 관점<\/td><td>락 순서 통일 · 트랜잭션 단축<\/td><td>모든 트랜잭션이 동일 순서로 자원 획득, 락 점유 시간 최소화<\/td><\/tr><\/tbody><\/table><\/div>", "rv": "<div class=\"q\"><b>두음: 상·점·비·환 / 예·회·탐·복<\/b> — 상(상호배제)·점(점유대기)·비(비선점)·환(환형대기) / 예(예방)·회(회피)·탐(탐지)·복(복구)<\/div>\n<div class=\"q\"><b>4조건 + 4해결 + 실무 RDBMS는 탐지/복구(Wait-For Graph + Victim 롤백)<\/b>!<\/div>", "img": "itpe-diagrams/55-deadlock.webp", "txt": null, "search": "교착상태(deadlock) 4대 조건과 해결 기법 교착상태 (deadlock) 상·점·비·환 / 예·회·탐·복 데이터베이스 트랜잭션·동시성 ⭐⭐⭐ 기출빈출 기출 빈출 중요 두 개 이상의 트랜잭션(또는 프로세스)이 서로가 점유한 락(자원)이 해제되기를 기다리며 무한 대기 에 빠지는 상태 4대 필요충분 조건 (상·점·비·환) : 상호배제 (독점 사용) · 점유와 대기 (쥔 채 추가 대기) · 비선점 (강제 탈취 불가) · 환형대기 (순환 대기 사이클) 4대 해결 기법 (예·회·탐·복) : 예방 (prevention) : 4대 조건 중 1개 이상 원천 제거 (타임스탬프 기반 wait-die · wound-wait ) 회피 (avoidance) : 안전 상태(safe state)만 할당 허용 ( 은행원 알고리즘 ) 탐지 (detection) : wait-for graph(대기 그래프) 사이클 주기적 검사 복구 (recovery) : 비용이 적은 희생자(victim) 선정 후 rollback(선점·종료) 관점(측면) 특징 설명 발생 조건 관점 상·점·비·환 (모두 충족) 4가지 조건이 동시에 성립해야 교착 발생 — 1개만 깨도 교착 방지 사전 대응 관점 예방 · 회피 타임스탬프 기반 선점/포기(wait-die/wound-wait) 또는 안전 상태 유지 사후 대응 관점 탐지 · 복구 (실무 rdbms) rdbms는 오버헤드 줄이려 대기 그래프(wfg) 탐지 후 victim 롤백 채택 설계·튜닝 관점 락 순서 통일 · 트랜잭션 단축 모든 트랜잭션이 동일 순서로 자원 획득, 락 점유 시간 최소화 두음: 상·점·비·환 / 예·회·탐·복 — 상(상호배제)·점(점유대기)·비(비선점)·환(환형대기) / 예(예방)·회(회피)·탐(탐지)·복(복구) 4조건 + 4해결 + 실무 rdbms는 탐지/복구(wait-for graph + victim 롤백) !"}, {"id": "cap", "cat": "db", "sub": "db-dist", "parent": null, "t": "CAP & PACELC", "s": "분산 트레이드오프", "stars": 2, "redStar": false, "full": "CAP 정리 & PACELC 이론", "catLabel": "데이터베이스", "st": "📌 복습 필요", "d": "2026-11-19", "def": "<p>분산 데이터베이스 시스템에서 네트워크 단절(Partition) 발생 시 일관성(C)·가용성(A) 간 트레이드오프를 설명하는 <b>CAP 정리<\/b>와, 이를 확장해 장애가 없는 평상시(Else)의 지연시간(L)·일관성(C) 트레이드오프까지 함께 설명하는 <b>PACELC 이론<\/b><\/p>", "kw": "<ul class=\"kw\"><li><b>CAP 3요소<\/b><ul class=\"kw\"><li><code>Consistency<\/code> (일관성) — 모든 노드가 최신 데이터 조회<\/li><li><code>Availability<\/code> (가용성) — 비장애 노드는 항상 응답<\/li><li><code>Partition Tolerance<\/code> (분할 내성) — 네트워크 단절에도 동작<\/li><\/ul><\/li><li><b>CAP 한계<\/b>: 분산 환경에서 <code>P<\/code>는 필수 → 장애 시 <code>CP<\/code>(일관성 우선, HBase·MongoDB) 또는 <code>AP<\/code>(가용성 우선, Cassandra·Dynamo) 중 하나만 선택 가능<\/li><li><b>PACELC 확장<\/b><ul class=\"kw\"><li><code>If P -> A vs C<\/code> — 장애 시 가용성 vs 일관성<\/li><li><code>Else(E) -> L vs C<\/code> — 평상시 지연시간(Latency) vs 일관성(Consistency)<\/li><\/ul><\/li><li><b>대표 유형<\/b>: <code>PA/EL<\/code> (Cassandra, DynamoDB), <code>PC/EC<\/code> (HBase, Spanner, RDBMS), <code>PA/EC<\/code> (MongoDB 기본 설정 등)<\/li><\/ul>", "pp": "<div class=\"tblwrap\"><table class=\"cmp\"><colgroup><col style=\"width:24%\"><col style=\"width:28%\"><col style=\"width:48%\"><\/colgroup><thead><tr><th>관점(측면)<\/th><th>특징<\/th><th>설명<\/th><\/tr><\/thead><tbody><tr><td class=\"k\">장애 상황<\/td><td>CP vs AP<\/td><td>분할(P)은 분산 환경에서 불가피하므로 장애 시 일관성(CP) 또는 가용성(AP)을 선택<\/td><\/tr><tr><td class=\"k\">평상 상황<\/td><td>Latency vs Consistency<\/td><td>PACELC의 Else 구간에서 평상시 지연시간과 일관성의 트레이드오프를 추가로 설명<\/td><\/tr><tr><td class=\"k\">유형 분류<\/td><td>PA/EL·PC/EC·PA/EC<\/td><td>Cassandra는 PA/EL, Spanner·RDBMS는 PC/EC, MongoDB 기본은 PA/EC로 분류<\/td><\/tr><tr><td class=\"k\">설계 판단<\/td><td>업무 요구 우선<\/td><td>금융 정합성은 CP, 대규모 읽기·무중단 가용성은 AP로 업무 특성에 맞춰 선택<\/td><\/tr><\/tbody><\/table><\/div>", "rv": "<div class=\"q\"><b>두음: 일·가·분 / 피·엘<\/b> — 일(C·일관성)·가(A·가용성)·분(P·분할내성) / 피(장애 시 A vs C)·엘(평시 L vs C)<\/div>\n<div class=\"q\">CAP은 \"네트워크 장애(P) 상황\"만 다루는 반면, PACELC은 \"평상시(E) 성능(Latency) vs 일관성(Consistency)\"까지 짚는다는 차이점을 반드시 분리해서 쓰기!<\/div>", "img": "itpe-diagrams/04-cap-pacelc.webp", "txt": null, "search": "cap 정리 & pacelc 이론 cap & pacelc 분산 트레이드오프 데이터베이스 분산·벡터 db ⭐⭐ 기출빈출 기출 빈출 중요 분산 데이터베이스 시스템에서 네트워크 단절(partition) 발생 시 일관성(c)·가용성(a) 간 트레이드오프를 설명하는 cap 정리 와, 이를 확장해 장애가 없는 평상시(else)의 지연시간(l)·일관성(c) 트레이드오프까지 함께 설명하는 pacelc 이론 cap 3요소 consistency (일관성) — 모든 노드가 최신 데이터 조회 availability (가용성) — 비장애 노드는 항상 응답 partition tolerance (분할 내성) — 네트워크 단절에도 동작 cap 한계 : 분산 환경에서 p 는 필수 → 장애 시 cp (일관성 우선, hbase·mongodb) 또는 ap (가용성 우선, cassandra·dynamo) 중 하나만 선택 가능 pacelc 확장 if p -> a vs c — 장애 시 가용성 vs 일관성 else(e) -> l vs c — 평상시 지연시간(latency) vs 일관성(consistency) 대표 유형 : pa/el (cassandra, dynamodb), pc/ec (hbase, spanner, rdbms), pa/ec (mongodb 기본 설정 등) 관점(측면) 특징 설명 장애 상황 cp vs ap 분할(p)은 분산 환경에서 불가피하므로 장애 시 일관성(cp) 또는 가용성(ap)을 선택 평상 상황 latency vs consistency pacelc의 else 구간에서 평상시 지연시간과 일관성의 트레이드오프를 추가로 설명 유형 분류 pa/el·pc/ec·pa/ec cassandra는 pa/el, spanner·rdbms는 pc/ec, mongodb 기본은 pa/ec로 분류 설계 판단 업무 요구 우선 금융 정합성은 cp, 대규모 읽기·무중단 가용성은 ap로 업무 특성에 맞춰 선택 두음: 일·가·분 / 피·엘 — 일(c·일관성)·가(a·가용성)·분(p·분할내성) / 피(장애 시 a vs c)·엘(평시 l vs c) cap은 \"네트워크 장애(p) 상황\"만 다루는 반면, pacelc은 \"평상시(e) 성능(latency) vs 일관성(consistency)\"까지 짚는다는 차이점을 반드시 분리해서 쓰기!"}, {"id": "consistent-hashing", "cat": "db", "sub": "db-dist", "parent": null, "t": "일관된 해싱", "s": "모듈러 vs 링 vs 가상노드", "stars": 2, "redStar": false, "full": "해싱 기법 비교 · 일관된 해싱(Consistent Hashing)", "catLabel": "데이터베이스", "st": "📌 복습 필요", "d": "2026-11-25", "def": "<p><b>일관된 해싱(Consistent Hashing)<\/b>은 노드가 추가·삭제될 때 <b>재배치되는 키를 최소화<\/b>하는 분산 해싱 기법. 해시 공간을 <b>링(Ring)<\/b>으로 두고 키와 노드를 같은 공간에 매핑한 뒤, 키를 <b>시계방향 첫 노드<\/b>에 할당한다. 모듈러 해싱(<b>hash(key) mod N<\/b>)이 노드 수 변경 시 거의 모든 키를 재배치하는 문제를 해결하며, <b>가상 노드(Virtual Node)<\/b>로 부하 불균등을 보정하는 <b>탈중앙 분산 해싱 기법<\/b>.<\/p>", "kw": "<ul class=\"kw\"><li><b>모듈러 해싱<\/b>: hash(key) mod N — 단순·조회 O(1)이지만 N이 바뀌면 <b>약 (N−1)/N 키 재배치<\/b><\/li><li><b>해시 링<\/b>: 0~2³²−1 공간에 노드를 배치, 키는 시계방향 첫 노드 소유 — 노드 추가 시 <b>인접 구간만 이동<\/b><\/li><li><b>가상 노드<\/b>: 물리 노드당 수백 개 vnode를 링에 분산 배치 — 부하 균등화, 이기종 노드 <b>가중치<\/b> 부여, 장애 시 부하 분산<\/li><li><b>재배치율<\/b>: 노드 1대 추가 시 평균 <b>1/(N+1)<\/b> 키만 이동(모듈러는 거의 전부)<\/li><li><b>리밸런싱<\/b>: 신규 노드가 인접 구간을 인수, 데이터 마이그레이션은 백그라운드·점진 수행<\/li><li><b>한계<\/b>: vnode 수에 따른 균등도 의존, 링 메타데이터 합의 필요, 인기 키 <b>핫스팟<\/b><\/li><li><b>활용<\/b>: DynamoDB·Cassandra·Riak, Redis Cluster(<b>16,384 해시 슬롯<\/b>), CDN·L4 로드밸런서, 분산 캐시<\/li><\/ul>", "pp": "<h4>1) 모듈러 해싱 vs 일관된 해싱 (비교모듈: 구·정·동·확·용·성)<\/h4>\n<div class=\"tblwrap\"><table class=\"cmp\"><colgroup><col style=\"width:24%\"><col style=\"width:28%\"><col style=\"width:48%\"><\/colgroup><thead><tr><th>구분<\/th><th>모듈러 해싱 (hash mod N)<\/th><th>일관된 해싱 (Consistent Hashing)<\/th><\/tr><\/thead><tbody><tr><td class=\"k\">저장구조<\/td><td>키 해시를 N으로 나눈 나머지가 노드<\/td><td>해시 링 + 시계방향 첫 노드<\/td><\/tr><tr><td class=\"k\">정합성(키 소유권)<\/td><td>노드 변경 시 소유권 전면 변경<\/td><td>인접 구간만 이동, 나머지 키 소유권 유지<\/td><\/tr><tr><td class=\"k\">동시성(재배치)<\/td><td>N→N+1 시 약 (N−1)/N 재배치<\/td><td>평균 1/(N+1)만 재배치<\/td><\/tr><tr><td class=\"k\">확장방식<\/td><td>샤드 수 고정 전제(수평 확장 곤란)<\/td><td>노드 증설·감축에 탄력적<\/td><\/tr><tr><td class=\"k\">적합용도<\/td><td>고정 샤드·단순·소규모<\/td><td>분산 캐시·분산 DB·CDN 등 탄력 확장<\/td><\/tr><tr><td class=\"k\">읽기/쓰기성능<\/td><td>조회 O(1)<\/td><td>링 이진 탐색 O(log N)(vnode 정렬)<\/td><\/tr><\/tbody><\/table><\/div>\n<h4>2) 가상 노드 적용 효과<\/h4>\n<div class=\"tblwrap\"><table class=\"cmp\"><colgroup><col style=\"width:24%\"><col style=\"width:28%\"><col style=\"width:48%\"><\/colgroup><thead><tr><th>구분<\/th><th>물리 노드만 사용<\/th><th>가상 노드 적용<\/th><\/tr><\/thead><tbody><tr><td class=\"k\">부하 균등도<\/td><td>링 배치 편차로 불균등(수 배 차이 가능)<\/td><td>vnode 수에 비례해 균등(편차 급감)<\/td><\/tr><tr><td class=\"k\">이기종 노드<\/td><td>동일 비중으로 배치 불가<\/td><td>vnode 수로 용량 비례 가중<\/td><\/tr><tr><td class=\"k\">장애 영향<\/td><td>노드 1대 부하가 인접 1대에 집중<\/td><td>다수 노드에 분산 승계<\/td><\/tr><tr><td class=\"k\">관리 비용<\/td><td>메타데이터 적음<\/td><td>vnode 수만큼 링 엔트리·탐색 비용 증가<\/td><\/tr><\/tbody><\/table><\/div>\n<h4>3) 운영 고려사항<\/h4>\n<div class=\"tblwrap\"><table class=\"cmp\"><colgroup><col style=\"width:24%\"><col style=\"width:28%\"><col style=\"width:48%\"><\/colgroup><thead><tr><th>구분<\/th><th>키워드<\/th><th>설명<\/th><\/tr><\/thead><tbody><tr><td class=\"k\">균등<\/td><td>vnode 수<\/td><td>물리 노드당 100~500개 관례, 키 분포·부하 히스토그램으로 검증<\/td><\/tr><tr><td class=\"k\">핫스팟<\/td><td>키 설계<\/td><td>인기 키는 샤드 키 접미사·캐시 계층으로 분산<\/td><\/tr><tr><td class=\"k\">이동<\/td><td>점진 리밸런싱<\/td><td>마이그레이션 대역폭 제한, 이중 읽기·쓰기로 무중단<\/td><\/tr><tr><td class=\"k\">합의<\/td><td>메타데이터<\/td><td>링 버전을 합의(Raft·Gossip)로 전파, 클라이언트 캐시 무효화<\/td><\/tr><tr><td class=\"k\">복제<\/td><td>가상 노드+RF<\/td><td>시계방향 다음 vnode N개에 복제(RF=3), 랙·AZ 분산<\/td><\/tr><\/tbody><\/table><\/div>", "rv": "<div class=\"q\"><b>두음: 모·일·가 — 모듈러·일관된·가상노드 / 링·시·부 — 링·시계방향·부하균등<\/b><\/div>\n<div class=\"q\"><b>\"나머지 연산은 노드가 바뀌면 전부 다시, 링은 이웃 구간만 옮긴다 — 균등은 가상 노드가 책임\"<\/b><\/div>", "img": "itpe-diagrams/137-consistent-hashing.webp", "txt": null, "search": "해싱 기법 비교 · 일관된 해싱(consistent hashing) 일관된 해싱 모듈러 vs 링 vs 가상노드 데이터베이스 분산·벡터 db ⭐⭐ 기출빈출 기출 빈출 중요 일관된 해싱(consistent hashing) 은 노드가 추가·삭제될 때 재배치되는 키를 최소화 하는 분산 해싱 기법. 해시 공간을 링(ring) 으로 두고 키와 노드를 같은 공간에 매핑한 뒤, 키를 시계방향 첫 노드 에 할당한다. 모듈러 해싱( hash(key) mod n )이 노드 수 변경 시 거의 모든 키를 재배치하는 문제를 해결하며, 가상 노드(virtual node) 로 부하 불균등을 보정하는 탈중앙 분산 해싱 기법 . 모듈러 해싱 : hash(key) mod n — 단순·조회 o(1)이지만 n이 바뀌면 약 (n−1)/n 키 재배치 해시 링 : 0~2³²−1 공간에 노드를 배치, 키는 시계방향 첫 노드 소유 — 노드 추가 시 인접 구간만 이동 가상 노드 : 물리 노드당 수백 개 vnode를 링에 분산 배치 — 부하 균등화, 이기종 노드 가중치 부여, 장애 시 부하 분산 재배치율 : 노드 1대 추가 시 평균 1/(n+1) 키만 이동(모듈러는 거의 전부) 리밸런싱 : 신규 노드가 인접 구간을 인수, 데이터 마이그레이션은 백그라운드·점진 수행 한계 : vnode 수에 따른 균등도 의존, 링 메타데이터 합의 필요, 인기 키 핫스팟 활용 : dynamodb·cassandra·riak, redis cluster( 16,384 해시 슬롯 ), cdn·l4 로드밸런서, 분산 캐시 1) 모듈러 해싱 vs 일관된 해싱 (비교모듈: 구·정·동·확·용·성) 구분 모듈러 해싱 (hash mod n) 일관된 해싱 (consistent hashing) 저장구조 키 해시를 n으로 나눈 나머지가 노드 해시 링 + 시계방향 첫 노드 정합성(키 소유권) 노드 변경 시 소유권 전면 변경 인접 구간만 이동, 나머지 키 소유권 유지 동시성(재배치) n→n+1 시 약 (n−1)/n 재배치 평균 1/(n+1)만 재배치 확장방식 샤드 수 고정 전제(수평 확장 곤란) 노드 증설·감축에 탄력적 적합용도 고정 샤드·단순·소규모 분산 캐시·분산 db·cdn 등 탄력 확장 읽기/쓰기성능 조회 o(1) 링 이진 탐색 o(log n)(vnode 정렬) 2) 가상 노드 적용 효과 구분 물리 노드만 사용 가상 노드 적용 부하 균등도 링 배치 편차로 불균등(수 배 차이 가능) vnode 수에 비례해 균등(편차 급감) 이기종 노드 동일 비중으로 배치 불가 vnode 수로 용량 비례 가중 장애 영향 노드 1대 부하가 인접 1대에 집중 다수 노드에 분산 승계 관리 비용 메타데이터 적음 vnode 수만큼 링 엔트리·탐색 비용 증가 3) 운영 고려사항 구분 키워드 설명 균등 vnode 수 물리 노드당 100~500개 관례, 키 분포·부하 히스토그램으로 검증 핫스팟 키 설계 인기 키는 샤드 키 접미사·캐시 계층으로 분산 이동 점진 리밸런싱 마이그레이션 대역폭 제한, 이중 읽기·쓰기로 무중단 합의 메타데이터 링 버전을 합의(raft·gossip)로 전파, 클라이언트 캐시 무효화 복제 가상 노드+rf 시계방향 다음 vnode n개에 복제(rf=3), 랙·az 분산 두음: 모·일·가 — 모듈러·일관된·가상노드 / 링·시·부 — 링·시계방향·부하균등 \"나머지 연산은 노드가 바뀌면 전부 다시, 링은 이웃 구간만 옮긴다 — 균등은 가상 노드가 책임\""}, {"id": "crdt", "cat": "db", "sub": "db-dist", "parent": null, "t": "CRDT", "s": "CvRDT vs CmRDT", "stars": 1, "redStar": false, "full": "CRDT (Conflict-free Replicated Data Type)", "catLabel": "데이터베이스", "st": "📌 복습 필요", "d": "2026-11-25", "def": "<p><b>CRDT(Conflict-free Replicated Data Type)<\/b>는 복제본이 서로 다른 순서로 갱신되어도 <b>조정자(Coordinator) 없이<\/b> 동일한 상태로 수렴하는 자료구조. 병합 연산이 <b>교환·결합·멱등<\/b> 법칙을 만족하도록 설계해 <b>강한 최종 일관성(SEC, Strong Eventual Consistency)<\/b>을 보장하며, <b>상태 기반(CvRDT)<\/b>과 <b>연산 기반(CmRDT)<\/b>으로 구분되는 <b>분산 복제 데이터 타입<\/b>.<\/p>", "kw": "<ul class=\"kw\"><li><b>CvRDT (State-based)<\/b>: 복제본 전체 상태를 전송하고 <b>merge = join<\/b>으로 합침 — 반격자(Semilattice) 구조, 결합·교환·멱등 필요<\/li><li><b>CmRDT (Op-based)<\/b>: 갱신 <b>연산(Operation)<\/b>을 브로드캐스트 — <b>인과 전달(Causal Delivery)<\/b> 보장 필요, 델타만 전송해 트래픽 효율적<\/li><li><b>수렴 조건<\/b>: 교환성(Commutativity)·결합성(Associativity)·멱등성(Idempotence) → 중복·순서 뒤바뀜에도 동일 결과<\/li><li><b>대표 타입<\/b>: G-Counter·PN-Counter, G-Set·2P-Set·OR-Set, LWW-Register·MV-Register, RGA·Logoot(텍스트)<\/li><li><b>Δ-state CRDT<\/b>: 상태 전체 대신 <b>델타<\/b>만 전송해 CvRDT의 트래픽 부담 완화<\/li><li><b>활용<\/b>: 협업 편집(Automerge·Yjs·Figma), 오프라인 우선 앱, 분산 DB(Riak·Redis CRDT)·모바일 동기화<\/li><li><b>한계<\/b>: 메타데이터·tombstone 증가, 강한 일관성 아님(읽기 시점 불일치), 인과 관계 GC 필요<\/li><\/ul>", "pp": "<h4>1) CvRDT vs CmRDT (비교모듈: 구·정·동·확·용·성)<\/h4>\n<div class=\"tblwrap\"><table class=\"cmp\"><colgroup><col style=\"width:24%\"><col style=\"width:28%\"><col style=\"width:48%\"><\/colgroup><thead><tr><th>구분<\/th><th>CvRDT (State-based)<\/th><th>CmRDT (Op-based)<\/th><\/tr><\/thead><tbody><tr><td class=\"k\">저장구조<\/td><td>복제본 전체 상태 + 버전 벡터<\/td><td>연산 로그·인과 버퍼<\/td><\/tr><tr><td class=\"k\">정합성(ACID)<\/td><td>join 병합으로 수렴(SEC)<\/td><td>인과 전달 보장 시 수렴(SEC)<\/td><\/tr><tr><td class=\"k\">동시성제어<\/td><td>상태 병합(merge)으로 충돌 해소<\/td><td>연산 교환(commute)으로 충돌 해소<\/td><\/tr><tr><td class=\"k\">확장방식<\/td><td>상태 크기에 비례한 트래픽(Δ-state로 완화)<\/td><td>델타 전송으로 효율적, 피어 수 증가에 유리<\/td><\/tr><tr><td class=\"k\">적합용도<\/td><td>저빈도 갱신·상태가 작은 카운터·설정<\/td><td>고빈도 편집·다수 피어(P2P·협업 편집)<\/td><\/tr><tr><td class=\"k\">읽기/쓰기성능<\/td><td>병합 비용 = 상태 크기<\/td><td>즉시 적용, 로그·인과 메타데이터 관리 비용<\/td><\/tr><\/tbody><\/table><\/div>\n<h4>2) 대표 CRDT 타입<\/h4>\n<div class=\"tblwrap\"><table class=\"cmp\"><colgroup><col style=\"width:24%\"><col style=\"width:28%\"><col style=\"width:48%\"><\/colgroup><thead><tr><th>구분<\/th><th>타입<\/th><th>동작·용도<\/th><\/tr><\/thead><tbody><tr><td class=\"k\">카운터<\/td><td>G-Counter / PN-Counter<\/td><td>증가만·증감 모두, 노드별 카운터 합산<\/td><\/tr><tr><td class=\"k\">집합<\/td><td>G-Set / 2P-Set / OR-Set<\/td><td>추가만·삭제 1회·추가/삭제 반복(OR-Set 실무)<\/td><\/tr><tr><td class=\"k\">레지스터<\/td><td>LWW / MV-Register<\/td><td>타임스탬프 최신값 / 동시 값을 모두 보존<\/td><\/tr><tr><td class=\"k\">텍스트<\/td><td>RGA · Logoot · Yjs<\/td><td>문자 간 상대 순서 ID로 삽입 위치 결정<\/td><\/tr><\/tbody><\/table><\/div>\n<h4>3) 설계·운영 고려사항<\/h4>\n<div class=\"tblwrap\"><table class=\"cmp\"><colgroup><col style=\"width:24%\"><col style=\"width:28%\"><col style=\"width:48%\"><\/colgroup><thead><tr><th>구분<\/th><th>키워드<\/th><th>설명<\/th><\/tr><\/thead><tbody><tr><td class=\"k\">수렴 검증<\/td><td>속성 테스트<\/td><td>순서 뒤바꿈·중복 전달 시뮬레이션으로 수렴성 검증<\/td><\/tr><tr><td class=\"k\">메타데이터<\/td><td>tombstone GC<\/td><td>삭제 표식 무한 증가 방지 — 안정 시점 이후 압축<\/td><\/tr><tr><td class=\"k\">일관성<\/td><td>읽기 보정<\/td><td>최종 일관성 전제 — UI에서 낙관 반영·재조회 정책 필요<\/td><\/tr><tr><td class=\"k\">보안<\/td><td>접근통제<\/td><td>복제본마다 권한 검증, 악의적 연산 주입 방지(서명·검증)<\/td><\/tr><tr><td class=\"k\">적용 판단<\/td><td>OT vs CRDT<\/td><td>중앙 서버 조정 가능하면 OT, 오프라인·P2P·다중 서버면 CRDT<\/td><\/tr><\/tbody><\/table><\/div>", "rv": "<div class=\"q\"><b>두음: 씨·씨 — CvRDT·CmRDT / 교·결·멱 — 교환·결합·멱등<\/b><\/div>\n<div class=\"q\"><b>\"순서가 뒤바뀌어도 같은 결과 — 조정자 없이 수렴하는 자료구조\"<\/b><\/div>", "img": "itpe-diagrams/133-crdt.webp", "txt": null, "search": "crdt (conflict-free replicated data type) crdt cvrdt vs cmrdt 데이터베이스 분산·벡터 db ⭐ 기출빈출 기출 빈출 중요 crdt(conflict-free replicated data type) 는 복제본이 서로 다른 순서로 갱신되어도 조정자(coordinator) 없이 동일한 상태로 수렴하는 자료구조. 병합 연산이 교환·결합·멱등 법칙을 만족하도록 설계해 강한 최종 일관성(sec, strong eventual consistency) 을 보장하며, 상태 기반(cvrdt) 과 연산 기반(cmrdt) 으로 구분되는 분산 복제 데이터 타입 . cvrdt (state-based) : 복제본 전체 상태를 전송하고 merge = join 으로 합침 — 반격자(semilattice) 구조, 결합·교환·멱등 필요 cmrdt (op-based) : 갱신 연산(operation) 을 브로드캐스트 — 인과 전달(causal delivery) 보장 필요, 델타만 전송해 트래픽 효율적 수렴 조건 : 교환성(commutativity)·결합성(associativity)·멱등성(idempotence) → 중복·순서 뒤바뀜에도 동일 결과 대표 타입 : g-counter·pn-counter, g-set·2p-set·or-set, lww-register·mv-register, rga·logoot(텍스트) δ-state crdt : 상태 전체 대신 델타 만 전송해 cvrdt의 트래픽 부담 완화 활용 : 협업 편집(automerge·yjs·figma), 오프라인 우선 앱, 분산 db(riak·redis crdt)·모바일 동기화 한계 : 메타데이터·tombstone 증가, 강한 일관성 아님(읽기 시점 불일치), 인과 관계 gc 필요 1) cvrdt vs cmrdt (비교모듈: 구·정·동·확·용·성) 구분 cvrdt (state-based) cmrdt (op-based) 저장구조 복제본 전체 상태 + 버전 벡터 연산 로그·인과 버퍼 정합성(acid) join 병합으로 수렴(sec) 인과 전달 보장 시 수렴(sec) 동시성제어 상태 병합(merge)으로 충돌 해소 연산 교환(commute)으로 충돌 해소 확장방식 상태 크기에 비례한 트래픽(δ-state로 완화) 델타 전송으로 효율적, 피어 수 증가에 유리 적합용도 저빈도 갱신·상태가 작은 카운터·설정 고빈도 편집·다수 피어(p2p·협업 편집) 읽기/쓰기성능 병합 비용 = 상태 크기 즉시 적용, 로그·인과 메타데이터 관리 비용 2) 대표 crdt 타입 구분 타입 동작·용도 카운터 g-counter / pn-counter 증가만·증감 모두, 노드별 카운터 합산 집합 g-set / 2p-set / or-set 추가만·삭제 1회·추가/삭제 반복(or-set 실무) 레지스터 lww / mv-register 타임스탬프 최신값 / 동시 값을 모두 보존 텍스트 rga · logoot · yjs 문자 간 상대 순서 id로 삽입 위치 결정 3) 설계·운영 고려사항 구분 키워드 설명 수렴 검증 속성 테스트 순서 뒤바꿈·중복 전달 시뮬레이션으로 수렴성 검증 메타데이터 tombstone gc 삭제 표식 무한 증가 방지 — 안정 시점 이후 압축 일관성 읽기 보정 최종 일관성 전제 — ui에서 낙관 반영·재조회 정책 필요 보안 접근통제 복제본마다 권한 검증, 악의적 연산 주입 방지(서명·검증) 적용 판단 ot vs crdt 중앙 서버 조정 가능하면 ot, 오프라인·p2p·다중 서버면 crdt 두음: 씨·씨 — cvrdt·cmrdt / 교·결·멱 — 교환·결합·멱등 \"순서가 뒤바뀌어도 같은 결과 — 조정자 없이 수렴하는 자료구조\""}, {"id": "btree", "cat": "db", "sub": "db-model", "parent": null, "t": "B-Tree vs LSM-Tree", "s": "인덱스 저장 구조", "stars": 0, "redStar": false, "full": "B-Tree vs LSM-Tree", "catLabel": "데이터베이스", "st": "📌 복습 필요", "d": "2026-11-19", "def": "<p><b>B-Tree<\/b>는 디스크 페이지 단위로 제자리 갱신(In-place Update)해 <b>읽기(Read)에 최적화<\/b>된 균형 트리 구조이고, <b>LSM-Tree(Log-Structured Merge-Tree)<\/b>는 메모리(MemTable)와 디스크 순차 쓰기(SSTable)를 활용해 <b>대용량 쓰기(Write)에 최적화<\/b>된 저장 구조.<\/p>", "kw": "<ul class=\"kw\"><li><b>B-Tree<\/b>: 균형 이진/다진 트리, <b>In-place Update(랜덤 I/O 발생)<\/b>, MySQL InnoDB·PostgreSQL 등 RDBMS 기본 인덱스<\/li><li><b>LSM-Tree<\/b>: <b>WAL + MemTable(메모리)<\/b> → Flush → <b>SSTable(디스크 순차 쓰기, 불변)<\/b> → <b>Compaction(백그라운드 병합)<\/b><\/li><li>트레이드오프: B-Tree는 쓰기 증폭/랜덤 I/O 부담, LSM-Tree는 여러 SSTable 조회로 읽기 지연 가능(<b>Bloom Filter<\/b>로 보완)<\/li><\/ul>", "pp": "<div class=\"tblwrap\"><table class=\"cmp\"><colgroup><col style=\"width:24%\"><col style=\"width:28%\"><col style=\"width:48%\"><\/colgroup><thead><tr><th>관점(측면)<\/th><th>특징<\/th><th>설명<\/th><\/tr><\/thead><tbody><tr><td class=\"k\">저장 구조<\/td><td>제자리 갱신 vs 순차 쓰기<\/td><td>B-Tree는 페이지 제자리 갱신, LSM-Tree는 MemTable → SSTable 순차 쓰기 후 병합<\/td><\/tr><tr><td class=\"k\">쓰기 경로<\/td><td>WAL·Flush·Compaction<\/td><td>WAL로 내구성을 확보하고 Flush·Compaction으로 정리하되 쓰기 증폭이 발생<\/td><\/tr><tr><td class=\"k\">읽기 성능<\/td><td>랜덤 I/O vs 다중 조회<\/td><td>B-Tree는 O(log N) 랜덤 I/O, LSM은 레벨 탐색·Bloom Filter로 없는 키를 걸러냄<\/td><\/tr><tr><td class=\"k\">적용 판단<\/td><td>RDBMS vs NoSQL<\/td><td>읽기·갱신 중심은 B-Tree(RDBMS 인덱스), 쓰기 폭주·대용량 KV는 LSM(NoSQL)<\/td><\/tr><\/tbody><\/table><\/div>", "rv": "<div class=\"q\"><b>두음: 월·멤·에·컴<\/b> — 월(WAL)·멤(MemTable)·에(SSTable)·컴(Compaction) — B-Tree는 In-place 랜덤 I/O<\/div>\n<div class=\"q\">\"B-Tree = 랜덤 I/O·읽기 강점(RDBMS), LSM-Tree = <b>MemTable·SSTable·Compaction<\/b> 기반 순차 I/O·쓰기 강점(NoSQL)\"으로 딱 비교해 쓰기!<\/div>", "img": "itpe-diagrams/11-btree-lsm.webp", "txt": null, "search": "b-tree vs lsm-tree b-tree vs lsm-tree 인덱스 저장 구조 데이터베이스 모델링·인덱스 b-tree 는 디스크 페이지 단위로 제자리 갱신(in-place update)해 읽기(read)에 최적화 된 균형 트리 구조이고, lsm-tree(log-structured merge-tree) 는 메모리(memtable)와 디스크 순차 쓰기(sstable)를 활용해 대용량 쓰기(write)에 최적화 된 저장 구조. b-tree : 균형 이진/다진 트리, in-place update(랜덤 i/o 발생) , mysql innodb·postgresql 등 rdbms 기본 인덱스 lsm-tree : wal + memtable(메모리) → flush → sstable(디스크 순차 쓰기, 불변) → compaction(백그라운드 병합) 트레이드오프: b-tree는 쓰기 증폭/랜덤 i/o 부담, lsm-tree는 여러 sstable 조회로 읽기 지연 가능( bloom filter 로 보완) 관점(측면) 특징 설명 저장 구조 제자리 갱신 vs 순차 쓰기 b-tree는 페이지 제자리 갱신, lsm-tree는 memtable → sstable 순차 쓰기 후 병합 쓰기 경로 wal·flush·compaction wal로 내구성을 확보하고 flush·compaction으로 정리하되 쓰기 증폭이 발생 읽기 성능 랜덤 i/o vs 다중 조회 b-tree는 o(log n) 랜덤 i/o, lsm은 레벨 탐색·bloom filter로 없는 키를 걸러냄 적용 판단 rdbms vs nosql 읽기·갱신 중심은 b-tree(rdbms 인덱스), 쓰기 폭주·대용량 kv는 lsm(nosql) 두음: 월·멤·에·컴 — 월(wal)·멤(memtable)·에(sstable)·컴(compaction) — b-tree는 in-place 랜덤 i/o \"b-tree = 랜덤 i/o·읽기 강점(rdbms), lsm-tree = memtable·sstable·compaction 기반 순차 i/o·쓰기 강점(nosql)\"으로 딱 비교해 쓰기!"}, {"id": "covering", "cat": "db", "sub": "db-model", "parent": null, "t": "커버링 인덱스 & 분기점", "s": "Index Only Scan · 10~15%", "stars": 2, "redStar": false, "full": "커버링 인덱스 & 인덱스 손익분기점", "catLabel": "데이터베이스", "st": "📌 복습 필요", "d": "2026-11-20", "def": "<ul class=\"kw\"><li><b>커버링 인덱스 (Covering Index)<\/b>: 쿼리에 필요한 모든 컬럼(SELECT·WHERE·GROUP BY·ORDER BY)을 인덱스가 포함하여, <b>테이블 본문 접근(Random I/O) 없이 인덱스만으로<\/b> 결과를 반환하는 기법 (<b>Index Only Scan<\/b>)<\/li><li><b>인덱스 손익분기점<\/b>: 인덱스 스캔 비용이 <b>Full Table Scan<\/b> 비용을 역전하는 조회 건수 비율 기준 (일반적으로 전체 데이터의 <b>약 10~15%<\/b> 내외)<\/li><\/ul>", "kw": "<ul class=\"kw\"><li><b>커버링 인덱스 동작 및 효과<\/b>:<ul class=\"kw\"><li>일반 인덱스는 인덱스 탐색 후 Row ID/PK로 테이블 본문을 재조회(Random I/O)하지만, 커버링 인덱스는 <b>테이블 접근 자체를 생략<\/b><\/li><li>주의: 인덱스 컬럼이 너무 많아지면 인덱스 크기 증가로 쓰기(INSERT/UPDATE/DELETE) 부하·메모리 낭비 발생<\/li><\/ul><\/li><li><b>인덱스 손익분기점 원리<\/b>:<ul class=\"kw\"><li>인덱스 스캔은 랜덤 I/O(건당 1페이지), Full Table Scan은 순차 I/O(Multi-Block Read)<\/li><li>선택도(Selectivity)가 낮아 조회 비중이 약 <b>10~15%<\/b>를 넘으면 Full Table Scan이 유리<\/li><\/ul><\/li><\/ul>", "pp": "<div class=\"tblwrap\"><table class=\"cmp\"><colgroup><col style=\"width:24%\"><col style=\"width:28%\"><col style=\"width:48%\"><\/colgroup><thead><tr><th>관점(측면)<\/th><th>특징<\/th><th>설명<\/th><\/tr><\/thead><tbody><tr><td class=\"k\">동작<\/td><td>Index Only Scan<\/td><td>SELECT·WHERE·ORDER BY 컬럼을 모두 인덱스에 담아 테이블 본문 접근을 생략<\/td><\/tr><tr><td class=\"k\">I/O 특성<\/td><td>랜덤 vs 순차<\/td><td>인덱스 스캔은 건당 랜덤 I/O, Full Table Scan은 Multi-Block 순차 I/O로 비용 구조가 다름<\/td><\/tr><tr><td class=\"k\">손익분기점<\/td><td>약 10~15%<\/td><td>조회 비중이 이 비율을 넘으면 Full Table Scan이 유리해 옵티마이저가 전환<\/td><\/tr><tr><td class=\"k\">설계 유의<\/td><td>컬럼 수·쓰기 부하<\/td><td>인덱스 컬럼이 늘면 크기·쓰기 부하가 커지므로 선택도와 조회 패턴을 함께 고려<\/td><\/tr><\/tbody><\/table><\/div>", "rv": "<div class=\"q\"><b>두음: 온·십오<\/b> — 온(Index Only Scan)·십오(손익분기 약 10~15%)<\/div>\n<div class=\"q\"><b>커버링 = Index Only Scan(랜덤 I/O 제거)<\/b>, <b>손익분기점 = 약 10~15% (랜덤 I/O vs 순차 I/O)<\/b>!<\/div>", "img": "itpe-diagrams/33-covering-index.webp", "txt": null, "search": "커버링 인덱스 & 인덱스 손익분기점 커버링 인덱스 & 분기점 index only scan · 10~15% 데이터베이스 모델링·인덱스 ⭐⭐ 기출빈출 기출 빈출 중요 커버링 인덱스 (covering index) : 쿼리에 필요한 모든 컬럼(select·where·group by·order by)을 인덱스가 포함하여, 테이블 본문 접근(random i/o) 없이 인덱스만으로 결과를 반환하는 기법 ( index only scan ) 인덱스 손익분기점 : 인덱스 스캔 비용이 full table scan 비용을 역전하는 조회 건수 비율 기준 (일반적으로 전체 데이터의 약 10~15% 내외) 커버링 인덱스 동작 및 효과 : 일반 인덱스는 인덱스 탐색 후 row id/pk로 테이블 본문을 재조회(random i/o)하지만, 커버링 인덱스는 테이블 접근 자체를 생략 주의: 인덱스 컬럼이 너무 많아지면 인덱스 크기 증가로 쓰기(insert/update/delete) 부하·메모리 낭비 발생 인덱스 손익분기점 원리 : 인덱스 스캔은 랜덤 i/o(건당 1페이지), full table scan은 순차 i/o(multi-block read) 선택도(selectivity)가 낮아 조회 비중이 약 10~15% 를 넘으면 full table scan이 유리 관점(측면) 특징 설명 동작 index only scan select·where·order by 컬럼을 모두 인덱스에 담아 테이블 본문 접근을 생략 i/o 특성 랜덤 vs 순차 인덱스 스캔은 건당 랜덤 i/o, full table scan은 multi-block 순차 i/o로 비용 구조가 다름 손익분기점 약 10~15% 조회 비중이 이 비율을 넘으면 full table scan이 유리해 옵티마이저가 전환 설계 유의 컬럼 수·쓰기 부하 인덱스 컬럼이 늘면 크기·쓰기 부하가 커지므로 선택도와 조회 패턴을 함께 고려 두음: 온·십오 — 온(index only scan)·십오(손익분기 약 10~15%) 커버링 = index only scan(랜덤 i/o 제거) , 손익분기점 = 약 10~15% (랜덤 i/o vs 순차 i/o) !"}, {"id": "vectordb", "cat": "db", "sub": "db-dist", "parent": null, "t": "Vector DB · ANN", "s": "HNSW·IVF·PQ / 코·유·내", "stars": 3, "redStar": false, "full": "벡터 DB(Vector DB)와 ANN(HNSW·IVF)", "catLabel": "데이터베이스", "st": "📌 복습 필요", "d": "2026-11-21", "def": "<p>텍스트·이미지 등 비정형 데이터를 <b>고차원 임베딩 벡터<\/b>로 변환해 저장하고, <b>의미적 유사도(Semantic Similarity)<\/b> 기반으로 고속 근사 탐색(ANN)을 수행하는 데이터베이스 (RAG의 핵심 저장소)<\/p>", "kw": "<ul class=\"kw\"><li><b>유사도 측정 3대 척도 (코·유·내)<\/b>: <b>코사인 유사도<\/b>(방향/각도) · <b>유클리드 거리<\/b>(L2 직선거리) · <b>내적<\/b>(Inner Product)<\/li><li><b>ANN (Approximate Nearest Neighbor) 핵심 인덱스 (흐·아·피)<\/b>:<ul class=\"kw\"><li><b>HNSW<\/b>: 계층적 소세계 그래프 점프 — 검색 속도·재현율 최상(메모리 사용량 큼)<\/li><li><b>IVF<\/b>: 클러스터링(Voronoi)으로 탐색 영역을 일부 군집으로 축소<\/li><li><b>PQ (Product Quantization)<\/b>: 고차원 벡터를 양자화 압축해 메모리 대폭 절감 (IVF+PQ 조합 다수)<\/li><\/ul><\/li><\/ul>", "pp": "<p><b>1) 개념 비교 (RDBMS vs Vector DB)<\/b><\/p>\n<div class=\"tblwrap\"><table class=\"cmp\"><colgroup><col style=\"width:24%\"><col style=\"width:28%\"><col style=\"width:48%\"><\/colgroup><thead><tr><th>구분<\/th><th>RDBMS<\/th><th>Vector DB<\/th><\/tr><\/thead><tbody><tr><td class=\"k\">데이터·검색 방식<\/td><td>정형 테이블 · 정확 일치(Exact Match, B-Tree)<\/td><td>고차원 임베딩 벡터 · 의미 유사도(ANN)<\/td><\/tr><tr><td class=\"k\">인덱스 구조<\/td><td>B-Tree · Hash · Bitmap<\/td><td>HNSW · IVF · PQ<\/td><\/tr><tr><td class=\"k\">주요 활용<\/td><td>트랜잭션(OLTP) · 정형 조회<\/td><td>RAG · 추천 시스템 · 이미지/멀티모달 검색<\/td><\/tr><\/tbody><\/table><\/div>\n<p><b>2) 성능·운영 관점 구성표<\/b><\/p>\n<div class=\"tblwrap\"><table class=\"cmp\"><colgroup><col style=\"width:24%\"><col style=\"width:28%\"><col style=\"width:48%\"><\/colgroup><thead><tr><th>관점(측면)<\/th><th>특징<\/th><th>설명<\/th><\/tr><\/thead><tbody><tr><td class=\"k\">정확도·속도 관점<\/td><td>Exact KNN vs ANN<\/td><td>전수 비교(KNN)는 O(N) 지연 → 약간의 정확도를 양보해 ms급 검색(ANN)<\/td><\/tr><tr><td class=\"k\">메모리·압축 관점<\/td><td>HNSW vs IVF+PQ<\/td><td>그래프 기반 HNSW는 빠르지만 RAM 소모↑, PQ 압축으로 비용 최적화<\/td><\/tr><tr><td class=\"k\">하이브리드 검색<\/td><td>키워드(BM25) + 벡터<\/td><td>고유명사·정확 일치는 BM25, 문맥 의미는 벡터로 결합(Hybrid Search)<\/td><\/tr><\/tbody><\/table><\/div>", "rv": "<div class=\"q\"><b>두음: 코·유·내 / 흐·아·피<\/b> — 코(코사인)·유(유클리드)·내(내적) / 흐(HNSW)·아(IVF)·피(PQ)<\/div>\n<div class=\"q\"><b>RAG 핵심 인프라 + Exact KNN 한계 → ANN(HNSW·IVF·PQ) + 하이브리드 검색<\/b>!<\/div>", "img": "itpe-diagrams/60-vector-db-ann.webp", "txt": null, "search": "벡터 db(vector db)와 ann(hnsw·ivf) vector db · ann hnsw·ivf·pq / 코·유·내 데이터베이스 분산·벡터 db ⭐⭐⭐ 기출빈출 기출 빈출 중요 텍스트·이미지 등 비정형 데이터를 고차원 임베딩 벡터 로 변환해 저장하고, 의미적 유사도(semantic similarity) 기반으로 고속 근사 탐색(ann)을 수행하는 데이터베이스 (rag의 핵심 저장소) 유사도 측정 3대 척도 (코·유·내) : 코사인 유사도 (방향/각도) · 유클리드 거리 (l2 직선거리) · 내적 (inner product) ann (approximate nearest neighbor) 핵심 인덱스 (흐·아·피) : hnsw : 계층적 소세계 그래프 점프 — 검색 속도·재현율 최상(메모리 사용량 큼) ivf : 클러스터링(voronoi)으로 탐색 영역을 일부 군집으로 축소 pq (product quantization) : 고차원 벡터를 양자화 압축해 메모리 대폭 절감 (ivf+pq 조합 다수) 1) 개념 비교 (rdbms vs vector db) 구분 rdbms vector db 데이터·검색 방식 정형 테이블 · 정확 일치(exact match, b-tree) 고차원 임베딩 벡터 · 의미 유사도(ann) 인덱스 구조 b-tree · hash · bitmap hnsw · ivf · pq 주요 활용 트랜잭션(oltp) · 정형 조회 rag · 추천 시스템 · 이미지/멀티모달 검색 2) 성능·운영 관점 구성표 관점(측면) 특징 설명 정확도·속도 관점 exact knn vs ann 전수 비교(knn)는 o(n) 지연 → 약간의 정확도를 양보해 ms급 검색(ann) 메모리·압축 관점 hnsw vs ivf+pq 그래프 기반 hnsw는 빠르지만 ram 소모↑, pq 압축으로 비용 최적화 하이브리드 검색 키워드(bm25) + 벡터 고유명사·정확 일치는 bm25, 문맥 의미는 벡터로 결합(hybrid search) 두음: 코·유·내 / 흐·아·피 — 코(코사인)·유(유클리드)·내(내적) / 흐(hnsw)·아(ivf)·피(pq) rag 핵심 인프라 + exact knn 한계 → ann(hnsw·ivf·pq) + 하이브리드 검색 !"}, {"id": "cdc-event-sourcing", "cat": "db", "sub": "db-dist", "parent": null, "t": "CDC · 이벤트 소싱", "s": "로·폴·트 / 커·애·스·프·쿼", "stars": 2, "redStar": false, "full": "CDC · 이벤트 소싱 (Event Sourcing)", "catLabel": "데이터베이스", "st": "📌 복습 필요", "d": "2026-11-25", "def": "<p><b>CDC(Change Data Capture)<\/b>는 원천 DB의 데이터 변경분(Insert·Update·Delete)을 실시간 캡처해 스트림으로 전파하는 기술이며, <b>이벤트 소싱(Event Sourcing)<\/b>은 상태 변경 이력을 불변 이벤트 로그로 저장·재생(Replay)하여 상태를 재구성하는 <b>분산 데이터 아키텍처 패턴<\/b><\/p>", "kw": "<ul class=\"kw\"><li><b>Log-based CDC<\/b>: DB 로그(WAL·redo·binlog)를 읽어 변경 캡처 — 원천 부하 최소·순서 보장, <b>Debezium<\/b>이 대표 구현<\/li><li><b>Query-based CDC (Polling)<\/b>: 타임스탬프·시퀀스 기준 주기 조회 — 구현 단순, 지연·누락·원천 부하 위험<\/li><li><b>Trigger-based CDC<\/b>: 트리거로 감사 테이블에 기록 — 즉시성 확보, 원천 트랜잭션 부하·스키마 결합<\/li><li><b>Event Store<\/b>: 이벤트를 추가만 허용하는 불변 저장소, <b>Expected Version<\/b>으로 낙관적 동시성 제어<\/li><li><b>Snapshot<\/b>: 전체 이벤트 재생 비용을 줄이기 위한 주기적 상태 저장 지점<\/li><li><b>Outbox 패턴<\/b>: 업무 트랜잭션과 <b>같은 트랜잭션<\/b>으로 Outbox 테이블에 이벤트를 기록하고 릴레이(CDC)가 발행 — 유실 없는 최소 1회 전달<\/li><li><b>Replay · Projection<\/b>: 이벤트 재생으로 읽기 모델을 재구축, 신규 뷰를 언제든 파생 생성<\/li><\/ul>", "pp": "<h4>1) CDC 구현 방식 비교<\/h4>\n<div class=\"tblwrap\"><table class=\"cmp\"><colgroup><col style=\"width:24%\"><col style=\"width:28%\"><col style=\"width:48%\"><\/colgroup><thead><tr><th>구분<\/th><th>특징<\/th><th>설명<\/th><\/tr><\/thead><tbody><tr><td class=\"k\">Log-based<\/td><td>WAL·binlog·redo 로그 파싱<\/td><td>커밋 로그를 읽어 순서·완전성 보장, 원천 부하 최소 — Debezium·Kafka Connect<\/td><\/tr><tr><td class=\"k\">Query-based<\/td><td>주기적 조회·타임스탬프 비교<\/td><td>구현·권한 요건이 단순하나 폴링 지연·대량 조회 부하·삭제 감지 취약<\/td><\/tr><tr><td class=\"k\">Trigger-based<\/td><td>트리거·감사 테이블 기록<\/td><td>변경 즉시 캡처되지만 원천 트랜잭션 지연과 스키마 결합도가 증가<\/td><\/tr><\/tbody><\/table><\/div>\n<h4>2) 상태 저장(CRUD) vs 이벤트 소싱<\/h4>\n<div class=\"tblwrap\"><table class=\"cmp\"><colgroup><col style=\"width:24%\"><col style=\"width:28%\"><col style=\"width:48%\"><\/colgroup><thead><tr><th>구분<\/th><th>상태 저장 (CRUD)<\/th><th>이벤트 소싱 (Event Sourcing)<\/th><\/tr><\/thead><tbody><tr><td class=\"k\">저장 단위<\/td><td>최신 상태(행) 덮어쓰기<\/td><td>변경 이벤트의 불변 로그<\/td><\/tr><tr><td class=\"k\">이력·감사<\/td><td>별도 이력 테이블·CDC 필요<\/td><td>이벤트 자체가 완전한 이력(시간여행 가능)<\/td><\/tr><tr><td class=\"k\">조회<\/td><td>현재 상태 직접 조회<\/td><td>Projection(읽기 모델) 재구성 후 조회<\/td><\/tr><tr><td class=\"k\">일관성<\/td><td>즉시 일관성 확보 용이<\/td><td>결과적 일관성(Eventually Consistent)<\/td><\/tr><tr><td class=\"k\">복잡도<\/td><td>낮음<\/td><td>높음 — 스키마 진화·스냅샷·멱등성 필요<\/td><\/tr><tr><td class=\"k\">적합성<\/td><td>단순 CRUD·강한 정합성<\/td><td>감사·재현·도메인 이벤트 중심 업무<\/td><\/tr><\/tbody><\/table><\/div>\n<h4>3) 도입 고려사항<\/h4>\n<div class=\"tblwrap\"><table class=\"cmp\"><colgroup><col style=\"width:24%\"><col style=\"width:28%\"><col style=\"width:48%\"><\/colgroup><thead><tr><th>구분<\/th><th>키워드<\/th><th>설명<\/th><\/tr><\/thead><tbody><tr><td class=\"k\">일관성<\/td><td>Outbox·Saga<\/td><td>DB 트랜잭션과 메시지 발행을 분리하지 않고 Outbox·Saga로 정합성 확보<\/td><\/tr><tr><td class=\"k\">멱등성<\/td><td>중복 소비 방지<\/td><td>최소 1회 전달 전제 → 이벤트 ID 기반 멱등 처리·순서 보장(파티션 키)<\/td><\/tr><tr><td class=\"k\">저장량<\/td><td>보존·압축·스냅샷<\/td><td>로그 무한 증가 → 보존 정책·압축·스냅샷 주기 설계<\/td><\/tr><tr><td class=\"k\">진화<\/td><td>스키마 버전<\/td><td>이벤트 스키마 변경·업캐스팅 전략, 과거 이벤트 호환성 유지<\/td><\/tr><tr><td class=\"k\">운영<\/td><td>재생 비용<\/td><td>대규모 Replay는 읽기 모델 부하·지연 유발 → 별도 클러스터·점진 재생<\/td><\/tr><\/tbody><\/table><\/div>", "rv": "<div class=\"q\"><b>두음: 로·폴·트 / 커·애·스·프·쿼<\/b> — Log·Polling·Trigger / Command·Aggregate·Event Store·Projection·Query<\/div>\n<div class=\"q\"><b>\"상태를 지우지 말고 이벤트를 쌓아라 — Replay가 곧 시간여행\"<\/b><\/div>", "img": "itpe-diagrams/119-cdc-event-sourcing.webp", "txt": null, "search": "cdc · 이벤트 소싱 (event sourcing) cdc · 이벤트 소싱 로·폴·트 / 커·애·스·프·쿼 데이터베이스 분산·벡터 db ⭐⭐ 기출빈출 기출 빈출 중요 cdc(change data capture) 는 원천 db의 데이터 변경분(insert·update·delete)을 실시간 캡처해 스트림으로 전파하는 기술이며, 이벤트 소싱(event sourcing) 은 상태 변경 이력을 불변 이벤트 로그로 저장·재생(replay)하여 상태를 재구성하는 분산 데이터 아키텍처 패턴 log-based cdc : db 로그(wal·redo·binlog)를 읽어 변경 캡처 — 원천 부하 최소·순서 보장, debezium 이 대표 구현 query-based cdc (polling) : 타임스탬프·시퀀스 기준 주기 조회 — 구현 단순, 지연·누락·원천 부하 위험 trigger-based cdc : 트리거로 감사 테이블에 기록 — 즉시성 확보, 원천 트랜잭션 부하·스키마 결합 event store : 이벤트를 추가만 허용하는 불변 저장소, expected version 으로 낙관적 동시성 제어 snapshot : 전체 이벤트 재생 비용을 줄이기 위한 주기적 상태 저장 지점 outbox 패턴 : 업무 트랜잭션과 같은 트랜잭션 으로 outbox 테이블에 이벤트를 기록하고 릴레이(cdc)가 발행 — 유실 없는 최소 1회 전달 replay · projection : 이벤트 재생으로 읽기 모델을 재구축, 신규 뷰를 언제든 파생 생성 1) cdc 구현 방식 비교 구분 특징 설명 log-based wal·binlog·redo 로그 파싱 커밋 로그를 읽어 순서·완전성 보장, 원천 부하 최소 — debezium·kafka connect query-based 주기적 조회·타임스탬프 비교 구현·권한 요건이 단순하나 폴링 지연·대량 조회 부하·삭제 감지 취약 trigger-based 트리거·감사 테이블 기록 변경 즉시 캡처되지만 원천 트랜잭션 지연과 스키마 결합도가 증가 2) 상태 저장(crud) vs 이벤트 소싱 구분 상태 저장 (crud) 이벤트 소싱 (event sourcing) 저장 단위 최신 상태(행) 덮어쓰기 변경 이벤트의 불변 로그 이력·감사 별도 이력 테이블·cdc 필요 이벤트 자체가 완전한 이력(시간여행 가능) 조회 현재 상태 직접 조회 projection(읽기 모델) 재구성 후 조회 일관성 즉시 일관성 확보 용이 결과적 일관성(eventually consistent) 복잡도 낮음 높음 — 스키마 진화·스냅샷·멱등성 필요 적합성 단순 crud·강한 정합성 감사·재현·도메인 이벤트 중심 업무 3) 도입 고려사항 구분 키워드 설명 일관성 outbox·saga db 트랜잭션과 메시지 발행을 분리하지 않고 outbox·saga로 정합성 확보 멱등성 중복 소비 방지 최소 1회 전달 전제 → 이벤트 id 기반 멱등 처리·순서 보장(파티션 키) 저장량 보존·압축·스냅샷 로그 무한 증가 → 보존 정책·압축·스냅샷 주기 설계 진화 스키마 버전 이벤트 스키마 변경·업캐스팅 전략, 과거 이벤트 호환성 유지 운영 재생 비용 대규모 replay는 읽기 모델 부하·지연 유발 → 별도 클러스터·점진 재생 두음: 로·폴·트 / 커·애·스·프·쿼 — log·polling·trigger / command·aggregate·event store·projection·query \"상태를 지우지 말고 이벤트를 쌓아라 — replay가 곧 시간여행\""}, {"id": "wasm", "cat": "caos", "sub": "caos-os", "parent": null, "t": "WebAssembly · WASI", "s": "고·이·샌·와 / 엣지·서버리스", "stars": 2, "redStar": false, "full": "웹어셈블리(WebAssembly, Wasm)와 WASI", "catLabel": "CA/OS", "st": "📌 복습 필요", "d": "2026-11-21", "def": "<p>C/C++·Rust·Go 등 다양한 언어를 컴파일해 브라우저 및 서버리스 환경에서 <b>네이티브에 가까운 속도로 안전하게 실행하는 이식 가능한 이진(Binary) 명령어 포맷<\/b>이며, <b>WASI<\/b>는 이를 OS·클라우드 밖에서 구동하게 하는 표준 시스템 인터페이스<\/p>", "kw": "<ul class=\"kw\"><li><b>4대 핵심 특징 (고·이·샌·와)<\/b>:<ul class=\"kw\"><li><b>고성능 (Near-Native)<\/b>: JS 파싱·인터프리팅 병목 없이 스택 기반 가상머신 바이너리로 초고속 실행 (ms급 콜드스타트)<\/li><li><b>이식성·언어 독립<\/b>: OS·CPU 아키텍처 무관 Write Once, Run Anywhere<\/li><li><b>샌드박스 보안<\/b>: 메모리 격리 및 Capability-based(명시적 권한 부여) 보안 모델<\/li><li><b>WASI (WebAssembly System Interface)<\/b>: 브라우저 밖에서 파일·네트워크 등 OS 자원 접근 표준 → <b>경량 컨테이너/서버리스<\/b>로 확장<\/li><\/ul><\/li><\/ul>", "pp": "<div class=\"tblwrap\"><table class=\"cmp\"><colgroup><col style=\"width:24%\"><col style=\"width:28%\"><col style=\"width:48%\"><\/colgroup><thead><tr><th>관점(측면)<\/th><th>특징<\/th><th>설명<\/th><\/tr><\/thead><tbody><tr><td class=\"k\">실행·성능 관점<\/td><td>ms 콜드스타트 · 소형 바이너리<\/td><td>Docker 컨테이너(수백MB·초 단위) 대비 KB~MB 크기·밀리초 기동<\/td><\/tr><tr><td class=\"k\">보안·격리 관점<\/td><td>샌드박스 + Capability<\/td><td>기본 권한 0 상태에서 허용된 파일·네트워크만 접근(Zero-Trust 친화)<\/td><\/tr><tr><td class=\"k\">클라우드·엣지 관점<\/td><td>WASI · CNCF 연계<\/td><td>엣지 컴퓨팅·서버리스 FaaS·Service Mesh(Envoy 플러그인) 확장 엔진<\/td><\/tr><tr><td class=\"k\">공존·비교 관점<\/td><td>JS 보완 · 컨테이너 보완<\/td><td>웹에서는 JS와 공존(고연산 오프로드), 클라우드에서는 경량 워크로드 담당<\/td><\/tr><\/tbody><\/table><\/div>", "rv": "<div class=\"q\"><b>두음: 고·이·샌·와<\/b> — 고(고성능)·이(이식성)·샌(샌드박스 보안)·와(WASI 서버리스 확장)<\/div>\n<div class=\"q\"><b>브라우저 고성능 → WASI로 클라우드/엣지 서버리스 확장<\/b> 흐름!<\/div>", "img": "itpe-diagrams/63-webassembly-wasi.webp", "txt": null, "search": "웹어셈블리(webassembly, wasm)와 wasi webassembly · wasi 고·이·샌·와 / 엣지·서버리스 ca/os os·가상화 ⭐⭐ 기출빈출 기출 빈출 중요 c/c++·rust·go 등 다양한 언어를 컴파일해 브라우저 및 서버리스 환경에서 네이티브에 가까운 속도로 안전하게 실행하는 이식 가능한 이진(binary) 명령어 포맷 이며, wasi 는 이를 os·클라우드 밖에서 구동하게 하는 표준 시스템 인터페이스 4대 핵심 특징 (고·이·샌·와) : 고성능 (near-native) : js 파싱·인터프리팅 병목 없이 스택 기반 가상머신 바이너리로 초고속 실행 (ms급 콜드스타트) 이식성·언어 독립 : os·cpu 아키텍처 무관 write once, run anywhere 샌드박스 보안 : 메모리 격리 및 capability-based(명시적 권한 부여) 보안 모델 wasi (webassembly system interface) : 브라우저 밖에서 파일·네트워크 등 os 자원 접근 표준 → 경량 컨테이너/서버리스 로 확장 관점(측면) 특징 설명 실행·성능 관점 ms 콜드스타트 · 소형 바이너리 docker 컨테이너(수백mb·초 단위) 대비 kb~mb 크기·밀리초 기동 보안·격리 관점 샌드박스 + capability 기본 권한 0 상태에서 허용된 파일·네트워크만 접근(zero-trust 친화) 클라우드·엣지 관점 wasi · cncf 연계 엣지 컴퓨팅·서버리스 faas·service mesh(envoy 플러그인) 확장 엔진 공존·비교 관점 js 보완 · 컨테이너 보완 웹에서는 js와 공존(고연산 오프로드), 클라우드에서는 경량 워크로드 담당 두음: 고·이·샌·와 — 고(고성능)·이(이식성)·샌(샌드박스 보안)·와(wasi 서버리스 확장) 브라우저 고성능 → wasi로 클라우드/엣지 서버리스 확장 흐름!"}, {"id": "vmem", "cat": "caos", "sub": "caos-os", "parent": null, "t": "가상 메모리 · 스래싱", "s": "피오루엘클 / Working Set·PFF", "stars": 3, "redStar": false, "full": "가상 메모리 · 페이지 교체 · 스래싱(Thrashing)", "catLabel": "CA/OS", "st": "📌 복습 필요", "d": "2026-11-21", "def": "<p>물리 메모리(RAM) 크기 한계를 극복하기 위해 보조기억장치 일부를 RAM처럼 추상화하고, <b>요구 페이징(Demand Paging)<\/b>으로 필요한 페이지만 적재·실행하는 OS 메모리 관리 기법<\/p>", "kw": "<ul class=\"kw\"><li><b>주소 변환<\/b>: 가상 주소 → <b>MMU + Page Table (TLB 캐시)<\/b> → 물리 주소 (미적재 시 <b>Page Fault<\/b> 발생)<\/li><li><b>페이지 교체 알고리즘 (피·오·루·엘·클)<\/b>: <b>FIFO<\/b>(선입선출·Belady 이상) · <b>OPT<\/b>(이론 최적) · <b>LRU<\/b>(최근 미사용·시간 지역성) · <b>LFU<\/b>(최소 빈도) · <b>Clock<\/b>(참조비트 2차 기회)<\/li><li><b>스래싱 (Thrashing) &amp; 해결책 (워·피)<\/b>: 과도한 다중 프로그래밍으로 Page Fault 폭증·CPU 이용률 급락 → <b>Working Set<\/b>(지역성 프레임 보장) · <b>PFF<\/b>(Page Fault 빈도 상/하한 제어)<\/li><\/ul>", "pp": "<div class=\"tblwrap\"><table class=\"cmp\"><colgroup><col style=\"width:24%\"><col style=\"width:28%\"><col style=\"width:48%\"><\/colgroup><thead><tr><th>관점(측면)<\/th><th>특징<\/th><th>설명<\/th><\/tr><\/thead><tbody><tr><td class=\"k\">하드웨어·성능 관점<\/td><td>MMU · TLB 캐시<\/td><td>페이지 테이블 조회 오버헤드를 줄이기 위한 고속 연관 캐시(TLB Hit)<\/td><\/tr><tr><td class=\"k\">교체 전략 관점<\/td><td>FIFO vs LRU vs Clock<\/td><td>FIFO는 구현 단순하나 Belady 이상 발생, 실무 OS는 LRU 근사인 Clock 채택<\/td><\/tr><tr><td class=\"k\">시스템 안정성 관점<\/td><td>스래싱 → Working Set · PFF<\/td><td>프로세스별 최소 필요 프레임(Working Set) 미확보 시 디스크 I/O만 반복<\/td><\/tr><tr><td class=\"k\">컨테이너·가상화 연계<\/td><td>메모리 오버커밋 · OOM<\/td><td>클라우드/K8s 환경에서 cgroup 메모리 제한 초과 시 스왑/OOM Killer 작동<\/td><\/tr><\/tbody><\/table><\/div>", "rv": "<div class=\"q\"><b>두음: 피·오·루·엘·클 / 워·피<\/b> — FIFO·OPT·LRU·LFU·Clock / Working Set·PFF<\/div>\n<div class=\"q\"><b>요구 페이징 → Page Fault → 교체(LRU/Clock) → 스래싱 원인·해결(Working Set·PFF)<\/b>!<\/div>", "img": "itpe-diagrams/65-virtual-memory-thrashing.webp", "txt": null, "search": "가상 메모리 · 페이지 교체 · 스래싱(thrashing) 가상 메모리 · 스래싱 피오루엘클 / working set·pff ca/os os·가상화 ⭐⭐⭐ 기출빈출 기출 빈출 중요 물리 메모리(ram) 크기 한계를 극복하기 위해 보조기억장치 일부를 ram처럼 추상화하고, 요구 페이징(demand paging) 으로 필요한 페이지만 적재·실행하는 os 메모리 관리 기법 주소 변환 : 가상 주소 → mmu + page table (tlb 캐시) → 물리 주소 (미적재 시 page fault 발생) 페이지 교체 알고리즘 (피·오·루·엘·클) : fifo (선입선출·belady 이상) · opt (이론 최적) · lru (최근 미사용·시간 지역성) · lfu (최소 빈도) · clock (참조비트 2차 기회) 스래싱 (thrashing) &amp; 해결책 (워·피) : 과도한 다중 프로그래밍으로 page fault 폭증·cpu 이용률 급락 → working set (지역성 프레임 보장) · pff (page fault 빈도 상/하한 제어) 관점(측면) 특징 설명 하드웨어·성능 관점 mmu · tlb 캐시 페이지 테이블 조회 오버헤드를 줄이기 위한 고속 연관 캐시(tlb hit) 교체 전략 관점 fifo vs lru vs clock fifo는 구현 단순하나 belady 이상 발생, 실무 os는 lru 근사인 clock 채택 시스템 안정성 관점 스래싱 → working set · pff 프로세스별 최소 필요 프레임(working set) 미확보 시 디스크 i/o만 반복 컨테이너·가상화 연계 메모리 오버커밋 · oom 클라우드/k8s 환경에서 cgroup 메모리 제한 초과 시 스왑/oom killer 작동 두음: 피·오·루·엘·클 / 워·피 — fifo·opt·lru·lfu·clock / working set·pff 요구 페이징 → page fault → 교체(lru/clock) → 스래싱 원인·해결(working set·pff) !"}, {"id": "cpu-cache", "cat": "caos", "sub": "caos-arch", "parent": null, "t": "CPU 캐시 · MESI", "s": "직·연·집 / Write-Back·MESI", "stars": 3, "redStar": false, "full": "CPU 캐시 메모리 · 캐시 일관성(MESI)", "catLabel": "CA/OS", "st": "📌 복습 필요", "d": "2026-11-21", "def": "<p>고속 CPU와 저속 주기억장치(DRAM) 간의 <b>속도 격차(Memory Wall)<\/b>를 해소하기 위해 <b>참조 지역성(Locality)<\/b>을 활용해 CPU 내부에 두는 초고속 SRAM 계층 메모리<\/p>", "kw": "<ul class=\"kw\"><li><b>참조 지역성<\/b>: <b>시간 지역성<\/b>(방금 쓴 데이터 재사용, 반복문) · <b>공간 지역성<\/b>(인접 주소 연속 접근, 배열)<\/li><li><b>사상 방식 (직·연·집)<\/b>: <b>직접 사상<\/b>(충돌↑·단순) · <b>완전 연관<\/b>(충돌↓·하드웨어 비용↑) · <b>집합 연관(Set-Associative)<\/b>(절충·실무 표준)<\/li><li><b>쓰기 정책<\/b>: <b>Write-Through<\/b>(캐시+RAM 동시 기록·일관성↑) vs <b>Write-Back<\/b>(Dirty 비트 표시 후 교체 시 기록·성능↑)<\/li><li><b>캐시 일관성 (MESI)<\/b>: 멀티코어 환경에서 코어별 L1/L2 캐시 불일치 방지 — <b>M<\/b>(Modified) · <b>E<\/b>(Exclusive) · <b>S<\/b>(Shared) · <b>I<\/b>(Invalid)<\/li><\/ul>", "pp": "<div class=\"tblwrap\"><table class=\"cmp\"><colgroup><col style=\"width:24%\"><col style=\"width:28%\"><col style=\"width:48%\"><\/colgroup><thead><tr><th>관점(측면)<\/th><th>특징<\/th><th>설명<\/th><\/tr><\/thead><tbody><tr><td class=\"k\">하드웨어·사상 관점<\/td><td>직·연·집 (Set-Associative)<\/td><td>K-way 집합 연관 사상으로 충돌 미스(Conflict Miss)와 회로 복잡도 균형<\/td><\/tr><tr><td class=\"k\">성능·일관성 트레이드오프<\/td><td>Write-Through vs Back<\/td><td>다중 쓰기 많을 땐 Write-Back이 유리하나 장애·멀티코어 시 일관성 관리 필수<\/td><\/tr><tr><td class=\"k\">멀티코어 동기화 관점<\/td><td>Bus Snooping · MESI<\/td><td>다른 코어가 같은 캐시 라인을 수정하면 버스 감시로 기존 라인을 Invalid(I) 처리<\/td><\/tr><tr><td class=\"k\">SW 최적화 관점<\/td><td>False Sharing 방지<\/td><td>서로 다른 변수가 같은 캐시 라인(64B)에 묶여 무효화되는 거짓 공유 패딩 회피<\/td><\/tr><\/tbody><\/table><\/div>", "rv": "<div class=\"q\"><b>두음: 직·연·집 / 메·스·아(MESI)<\/b> — 직접·완전연관·집합연관 / Modified·Exclusive·Shared·Invalid<\/div>\n<div class=\"q\"><b>지역성(시간/공간) + 사상 3종 + 쓰기 2종 + MESI 4상태<\/b> 한 세트!<\/div>", "img": "itpe-diagrams/69-cpu-cache-mesi.webp", "txt": null, "search": "cpu 캐시 메모리 · 캐시 일관성(mesi) cpu 캐시 · mesi 직·연·집 / write-back·mesi ca/os 컴퓨터 구조 ⭐⭐⭐ 기출빈출 기출 빈출 중요 고속 cpu와 저속 주기억장치(dram) 간의 속도 격차(memory wall) 를 해소하기 위해 참조 지역성(locality) 을 활용해 cpu 내부에 두는 초고속 sram 계층 메모리 참조 지역성 : 시간 지역성 (방금 쓴 데이터 재사용, 반복문) · 공간 지역성 (인접 주소 연속 접근, 배열) 사상 방식 (직·연·집) : 직접 사상 (충돌↑·단순) · 완전 연관 (충돌↓·하드웨어 비용↑) · 집합 연관(set-associative) (절충·실무 표준) 쓰기 정책 : write-through (캐시+ram 동시 기록·일관성↑) vs write-back (dirty 비트 표시 후 교체 시 기록·성능↑) 캐시 일관성 (mesi) : 멀티코어 환경에서 코어별 l1/l2 캐시 불일치 방지 — m (modified) · e (exclusive) · s (shared) · i (invalid) 관점(측면) 특징 설명 하드웨어·사상 관점 직·연·집 (set-associative) k-way 집합 연관 사상으로 충돌 미스(conflict miss)와 회로 복잡도 균형 성능·일관성 트레이드오프 write-through vs back 다중 쓰기 많을 땐 write-back이 유리하나 장애·멀티코어 시 일관성 관리 필수 멀티코어 동기화 관점 bus snooping · mesi 다른 코어가 같은 캐시 라인을 수정하면 버스 감시로 기존 라인을 invalid(i) 처리 sw 최적화 관점 false sharing 방지 서로 다른 변수가 같은 캐시 라인(64b)에 묶여 무효화되는 거짓 공유 패딩 회피 두음: 직·연·집 / 메·스·아(mesi) — 직접·완전연관·집합연관 / modified·exclusive·shared·invalid 지역성(시간/공간) + 사상 3종 + 쓰기 2종 + mesi 4상태 한 세트!"}, {"id": "pipeline", "cat": "caos", "sub": "caos-arch", "parent": null, "t": "CPU 파이프라이닝 · 해저드", "s": "IF-ID-EX-MEM-WB / 구·데·제", "stars": 3, "redStar": false, "full": "CPU 파이프라이닝과 3대 해저드(Hazard)", "catLabel": "CA/OS", "st": "📌 복습 필요", "d": "2026-11-22", "def": "<p>하나의 명령어 처리 과정을 여러 단계(<b>IF·ID·EX·MEM·WB<\/b>)로 분할하고 각 단계를 중첩 실행함으로써, 단일 명령어 지연은 유지하되 <b>단위 시간당 처리량(Throughput)을 극대화<\/b>하는 CPU 명령어 병렬 처리 기법<\/p>", "kw": "<ul class=\"kw\"><li><b>5단계 파이프라인 (인·해·실·메·쓰)<\/b>: <b>IF<\/b>(Instruction Fetch) → <b>ID<\/b>(Decode) → <b>EX<\/b>(Execute) → <b>MEM<\/b>(Memory Access) → <b>WB<\/b>(Write Back)<\/li><li><b>3대 해저드와 해결책 (구·데·제)<\/b>:<ul class=\"kw\"><li><b>구조적 해저드<\/b>: 하드웨어 자원(메모리·ALU) 동시 충돌 → <b>하버드 구조(I/D 캐시 분리)<\/b> · 자원 복제<\/li><li><b>데이터 해저드<\/b>: 선행 명령어 결과 미완료(RAW·WAR·WAW) → <b>포워딩(Forwarding/Bypassing)<\/b> · Stall(Bubble)<\/li><li><b>제어 해저드<\/b>: 분기(Branch) 결과 확정 전 다음 명령어 인출 → <b>분기 예측(Branch Prediction)<\/b> · 지연 분기<\/li><\/ul><\/li><\/ul>", "pp": "<div class=\"tblwrap\"><table class=\"cmp\"><colgroup><col style=\"width:24%\"><col style=\"width:28%\"><col style=\"width:48%\"><\/colgroup><thead><tr><th>관점(측면)<\/th><th>특징<\/th><th>설명<\/th><\/tr><\/thead><tbody><tr><td class=\"k\">성능·처리량 관점<\/td><td>CPI → 1 근접<\/td><td>K단계 파이프라인 시 이상적 속도 향상(Speedup)은 K배(단, 파이프라인 레지스터 지연 존재)<\/td><\/tr><tr><td class=\"k\">해저드 해결 관점<\/td><td>하드웨어 vs 컴파일러<\/td><td>포워딩·분기예측(H/W)과 명령어 재배치(컴파일러)를 결합해 Stall 최소화<\/td><\/tr><tr><td class=\"k\">보안·취약점 연계<\/td><td>투기적 실행 → Spectre<\/td><td>분기 예측 기반 투기적 실행(Speculative Execution)이 캐시 부채널 공격(Spectre/Meltdown) 유발<\/td><\/tr><\/tbody><\/table><\/div>", "rv": "<div class=\"q\"><b>두음: 구(하버드)·데(포·스)·제(분·지)<\/b> — 구조적(하버드)·데이터(포워딩/Stall)·제어(분기예측/지연분기)<\/div>\n<div class=\"q\"><b>5단계(IF-ID-EX-MEM-WB) + 3대 해저드 원인·해결책 1:1 매칭<\/b>!<\/div>", "img": "itpe-diagrams/76-cpu-pipelining-hazards.webp", "txt": null, "search": "cpu 파이프라이닝과 3대 해저드(hazard) cpu 파이프라이닝 · 해저드 if-id-ex-mem-wb / 구·데·제 ca/os 컴퓨터 구조 ⭐⭐⭐ 기출빈출 기출 빈출 중요 하나의 명령어 처리 과정을 여러 단계( if·id·ex·mem·wb )로 분할하고 각 단계를 중첩 실행함으로써, 단일 명령어 지연은 유지하되 단위 시간당 처리량(throughput)을 극대화 하는 cpu 명령어 병렬 처리 기법 5단계 파이프라인 (인·해·실·메·쓰) : if (instruction fetch) → id (decode) → ex (execute) → mem (memory access) → wb (write back) 3대 해저드와 해결책 (구·데·제) : 구조적 해저드 : 하드웨어 자원(메모리·alu) 동시 충돌 → 하버드 구조(i/d 캐시 분리) · 자원 복제 데이터 해저드 : 선행 명령어 결과 미완료(raw·war·waw) → 포워딩(forwarding/bypassing) · stall(bubble) 제어 해저드 : 분기(branch) 결과 확정 전 다음 명령어 인출 → 분기 예측(branch prediction) · 지연 분기 관점(측면) 특징 설명 성능·처리량 관점 cpi → 1 근접 k단계 파이프라인 시 이상적 속도 향상(speedup)은 k배(단, 파이프라인 레지스터 지연 존재) 해저드 해결 관점 하드웨어 vs 컴파일러 포워딩·분기예측(h/w)과 명령어 재배치(컴파일러)를 결합해 stall 최소화 보안·취약점 연계 투기적 실행 → spectre 분기 예측 기반 투기적 실행(speculative execution)이 캐시 부채널 공격(spectre/meltdown) 유발 두음: 구(하버드)·데(포·스)·제(분·지) — 구조적(하버드)·데이터(포워딩/stall)·제어(분기예측/지연분기) 5단계(if-id-ex-mem-wb) + 3대 해저드 원인·해결책 1:1 매칭 !"}, {"id": "ai-semi-cxl", "cat": "caos", "sub": "caos-arch", "parent": null, "t": "AI 반도체 · CXL", "s": "지·엔·에이 / 에·피·씨", "stars": 3, "redStar": false, "full": "AI 반도체(GPU·NPU·PIM·HBM) · CXL", "catLabel": "CA/OS", "st": "📌 복습 필요", "d": "2026-11-25", "def": "<p><b>AI 반도체<\/b>는 인공지능의 대규모 행렬·텐서 연산을 고속·저전력으로 처리하는 전용 프로세서(<b>GPU·NPU·ASIC/TPU<\/b>)이며, <b>메모리 병목(Memory Wall) 극복 기술<\/b>은 연산 속도 대비 메모리 전송 지연 한계를 해결하기 위한 <b>HBM<\/b>(초고대역폭 적층), <b>PIM<\/b>(메모리 내 연산), <b>CXL<\/b>(PCIe 기반 메모리 풀링·일관성) 기술을 총칭<\/p>", "kw": "<ul class=\"kw\"><li><b>GPU<\/b>: <b>SIMT<\/b> 기반 수천 개 코어로 대규모 행렬 병렬 연산 수행 (범용성·CUDA 생태계 강점, 학습 중심)<\/li><li><b>NPU · ASIC<\/b>: 신경망 연산(MAC)에 특화된 전용 아키텍처로 전력 대비 성능(TOPS/W) 극대화 (추론 특화 · Google TPU)<\/li><li><b>HBM (High Bandwidth Memory)<\/b>: D램을 <b>3D TSV<\/b>로 수직 적층하고 실리콘 인터포저로 GPU 옆에 배치해 초고대역폭 확보<\/li><li><b>PIM (Processing-in-Memory)<\/b>: 데이터 이동 없이 메모리 내부에 연산기(ALU)를 통합해 직접 연산, 에너지·지연 최소화<\/li><li><b>CXL (Compute Express Link)<\/b>: <b>PCIe<\/b> 기반 고속 인터커넥트로 CPU–가속기–메모리 간 <b>캐시 일관성(Type 1·2·3)<\/b> 유지 및 메모리 풀링·공유<\/li><\/ul>", "pp": "<h4>1) AI 반도체 및 메모리 극복 기술 비교<\/h4>\n<div class=\"tblwrap\"><table class=\"cmp\"><colgroup><col style=\"width:24%\"><col style=\"width:28%\"><col style=\"width:48%\"><\/colgroup><thead><tr><th>구분<\/th><th>키워드<\/th><th>설명<\/th><\/tr><\/thead><tbody><tr><td class=\"k\">GPU<\/td><td>SIMT · 병렬 연산 · 학습 중심<\/td><td>수천 개 코어로 대규모 행렬 병렬 연산 수행 (범용성·생태계 강점)<\/td><\/tr><tr><td class=\"k\">NPU · ASIC<\/td><td>추론 특화 · 저전력 · 행렬/텐서<\/td><td>신경망 연산(MAC)에 특화된 전용 아키텍처로 전력 대비 성능 극대화<\/td><\/tr><tr><td class=\"k\">HBM<\/td><td>3D TSV 적층 · 초고대역폭<\/td><td>D램을 수직 적층하고 실리콘 인터포저로 GPU 옆에 배치해 대역폭 확대<\/td><\/tr><tr><td class=\"k\">PIM<\/td><td>메모리 내 연산기(ALU) 통합<\/td><td>데이터 이동 없이 메모리 내부에서 직접 연산해 에너지·지연 최소화<\/td><\/tr><tr><td class=\"k\">CXL<\/td><td>PCIe 기반 · 메모리 풀링 · Type 1·2·3<\/td><td>CPU–가속기–메모리 간 캐시 일관성 유지 및 대용량 메모리 유연 확장<\/td><\/tr><\/tbody><\/table><\/div>\n<h4>2) 도입·설계 시 고려사항<\/h4>\n<div class=\"tblwrap\"><table class=\"cmp\"><colgroup><col style=\"width:24%\"><col style=\"width:28%\"><col style=\"width:48%\"><\/colgroup><thead><tr><th>구분<\/th><th>키워드<\/th><th>설명<\/th><\/tr><\/thead><tbody><tr><td class=\"k\">전력·발열<\/td><td>TDP 급증 · 액침냉각(AIDC)<\/td><td>고집적 칩·HBM 적층 발열 해소를 위한 고효율 냉각·전력 인프라 필수<\/td><\/tr><tr><td class=\"k\">SW 생태계<\/td><td>CUDA 종속 · 컴파일러(MLIR)<\/td><td>특정 벤더 종속(Lock-in) 완화를 위한 개방형 SW 스택·프레임워크 호환<\/td><\/tr><tr><td class=\"k\">비용·효율<\/td><td>학습(GPU) + 추론(NPU) 조합<\/td><td>워크로드 특성에 맞는 이기종 가속기 배치 및 CXL 풀링으로 TCO 절감<\/td><\/tr><\/tbody><\/table><\/div>", "rv": "<div class=\"q\"><b>두음: 지·엔·에이 / 에·피·씨<\/b> — GPU·NPU·ASIC / HBM·PIM·CXL<\/div>\n<div class=\"q\"><b>\"연산은 GPU·NPU·ASIC, 메모리 병목은 HBM(적층)·PIM(내장)·CXL(풀링)로 뚫는다!\"<\/b><\/div>", "img": "itpe-diagrams/117-ai-semi-cxl.webp", "txt": null, "search": "ai 반도체(gpu·npu·pim·hbm) · cxl ai 반도체 · cxl 지·엔·에이 / 에·피·씨 ca/os 컴퓨터 구조 ⭐⭐⭐ 기출빈출 기출 빈출 중요 ai 반도체 는 인공지능의 대규모 행렬·텐서 연산을 고속·저전력으로 처리하는 전용 프로세서( gpu·npu·asic/tpu )이며, 메모리 병목(memory wall) 극복 기술 은 연산 속도 대비 메모리 전송 지연 한계를 해결하기 위한 hbm (초고대역폭 적층), pim (메모리 내 연산), cxl (pcie 기반 메모리 풀링·일관성) 기술을 총칭 gpu : simt 기반 수천 개 코어로 대규모 행렬 병렬 연산 수행 (범용성·cuda 생태계 강점, 학습 중심) npu · asic : 신경망 연산(mac)에 특화된 전용 아키텍처로 전력 대비 성능(tops/w) 극대화 (추론 특화 · google tpu) hbm (high bandwidth memory) : d램을 3d tsv 로 수직 적층하고 실리콘 인터포저로 gpu 옆에 배치해 초고대역폭 확보 pim (processing-in-memory) : 데이터 이동 없이 메모리 내부에 연산기(alu)를 통합해 직접 연산, 에너지·지연 최소화 cxl (compute express link) : pcie 기반 고속 인터커넥트로 cpu–가속기–메모리 간 캐시 일관성(type 1·2·3) 유지 및 메모리 풀링·공유 1) ai 반도체 및 메모리 극복 기술 비교 구분 키워드 설명 gpu simt · 병렬 연산 · 학습 중심 수천 개 코어로 대규모 행렬 병렬 연산 수행 (범용성·생태계 강점) npu · asic 추론 특화 · 저전력 · 행렬/텐서 신경망 연산(mac)에 특화된 전용 아키텍처로 전력 대비 성능 극대화 hbm 3d tsv 적층 · 초고대역폭 d램을 수직 적층하고 실리콘 인터포저로 gpu 옆에 배치해 대역폭 확대 pim 메모리 내 연산기(alu) 통합 데이터 이동 없이 메모리 내부에서 직접 연산해 에너지·지연 최소화 cxl pcie 기반 · 메모리 풀링 · type 1·2·3 cpu–가속기–메모리 간 캐시 일관성 유지 및 대용량 메모리 유연 확장 2) 도입·설계 시 고려사항 구분 키워드 설명 전력·발열 tdp 급증 · 액침냉각(aidc) 고집적 칩·hbm 적층 발열 해소를 위한 고효율 냉각·전력 인프라 필수 sw 생태계 cuda 종속 · 컴파일러(mlir) 특정 벤더 종속(lock-in) 완화를 위한 개방형 sw 스택·프레임워크 호환 비용·효율 학습(gpu) + 추론(npu) 조합 워크로드 특성에 맞는 이기종 가속기 배치 및 cxl 풀링으로 tco 절감 두음: 지·엔·에이 / 에·피·씨 — gpu·npu·asic / hbm·pim·cxl \"연산은 gpu·npu·asic, 메모리 병목은 hbm(적층)·pim(내장)·cxl(풀링)로 뚫는다!\""}, {"id": "proc-thread", "cat": "caos", "sub": "caos-os", "parent": null, "t": "프로세스 vs 스레드 · 동기화", "s": "코·데·힙 공유 / 뮤(소유1)·세(카운트N)", "stars": 3, "redStar": false, "full": "프로세스 vs 스레드 & 동기화", "catLabel": "CA/OS", "st": "📌 복습 필요", "d": "2026-11-23", "def": "<p>운영체제에서 실행 중인 프로그램의 독립 단위인 <b>프로세스(Process)<\/b>와 프로세스 내 자원을 공유하는 경량 실행 흐름인 <b>스레드(Thread)<\/b>, 그리고 공유 자원의 동시 접근으로 인한 경쟁 상태(Race Condition)를 막는 <b>동기화(Mutex·Semaphore)<\/b> 기법<\/p>", "kw": "<ul class=\"kw\"><li><b>메모리 구조<\/b>: 프로세스는 <code>Code·Data·Heap·Stack<\/code> 모두 독립(IPC 필요) / 스레드는 <b><code>Code·Data·Heap<\/code> 공유<\/b>, <b><code>Stack·Register(PC)<\/code>만 독립<\/b><\/li><li><b>문맥 교환(Context Switching)<\/b>: 스레드는 주소 공간(TLB/캐시) 전환이 불필요해 프로세스 대비 오버헤드가 매우 작음<\/li><li><b>동기화 (임계영역 상호배제 3대 조건)<\/b>: 상호배제(Mutual Exclusion)·진행(Progress)·한정대기(Bounded Waiting)<\/li><li><b>뮤텍스 vs 세마포어<\/b>: 뮤텍스(소유권 있음 · 이진 Lock) vs 세마포어(소유권 없음 · 카운팅 변수로 N개 동시 허용)<\/li><\/ul>", "pp": "<h4>1) 개념 비교 (프로세스 vs 스레드)<\/h4>\n<div class=\"tblwrap\"><table class=\"cmp\"><colgroup><col style=\"width:24%\"><col style=\"width:28%\"><col style=\"width:48%\"><\/colgroup><thead><tr><th>비교<\/th><th>프로세스 (Process)<\/th><th>스레드 (Thread)<\/th><\/tr><\/thead><tbody><tr><td class=\"k\">자원·메모리<\/td><td>독립 공간(Code·Data·Heap·Stack)<\/td><td>Code·Data·Heap 공유 / Stack·Register 독립<\/td><\/tr><tr><td class=\"k\">통신·교환<\/td><td>IPC(파이프·공유메모리) · 문맥교환 큼<\/td><td>공유 메모리 직접 접근 · 문맥교환 빠름<\/td><\/tr><tr><td class=\"k\">안정성<\/td><td>한 프로세스 장애가 타 프로세스 미영향<\/td><td>한 스레드 오류가 전체 프로세스 종료 유발<\/td><\/tr><\/tbody><\/table><\/div>\n<h4>2) 상세 비교 (뮤텍스 vs 세마포어)<\/h4>\n<div class=\"tblwrap\"><table class=\"cmp\"><colgroup><col style=\"width:24%\"><col style=\"width:28%\"><col style=\"width:48%\"><\/colgroup><thead><tr><th>비교<\/th><th>뮤텍스 (Mutex)<\/th><th>세마포어 (Semaphore)<\/th><\/tr><\/thead><tbody><tr><td class=\"k\">소유권·개수<\/td><td>소유권 있음 · 1개 스레드만 진입(이진)<\/td><td>소유권 없음 · 카운트(N)만큼 동시 진입<\/td><\/tr><tr><td class=\"k\">해제 주체<\/td><td>Lock을 건 스레드만 Unlock 가능<\/td><td>다른 스레드/프로세스도 Signal로 해제 가능<\/td><\/tr><\/tbody><\/table><\/div>", "rv": "<div class=\"q\"><b>두음: 코·데·힙 공유, 스·레 독립 / 뮤(소유1)·세(카운트N)<\/b><\/div>\n<div class=\"q\"><b>상호배제·진행·한정대기(상·진·한)<\/b> 3대 조건과 <b>우선순위 역전(Priority Inversion)<\/b>까지 짚으면 완벽!<\/div>", "img": "itpe-diagrams/85-process-thread-sync.webp", "txt": null, "search": "프로세스 vs 스레드 & 동기화 프로세스 vs 스레드 · 동기화 코·데·힙 공유 / 뮤(소유1)·세(카운트n) ca/os os·가상화 ⭐⭐⭐ 기출빈출 기출 빈출 중요 운영체제에서 실행 중인 프로그램의 독립 단위인 프로세스(process) 와 프로세스 내 자원을 공유하는 경량 실행 흐름인 스레드(thread) , 그리고 공유 자원의 동시 접근으로 인한 경쟁 상태(race condition)를 막는 동기화(mutex·semaphore) 기법 메모리 구조 : 프로세스는 code·data·heap·stack 모두 독립(ipc 필요) / 스레드는 code·data·heap 공유 , stack·register(pc) 만 독립 문맥 교환(context switching) : 스레드는 주소 공간(tlb/캐시) 전환이 불필요해 프로세스 대비 오버헤드가 매우 작음 동기화 (임계영역 상호배제 3대 조건) : 상호배제(mutual exclusion)·진행(progress)·한정대기(bounded waiting) 뮤텍스 vs 세마포어 : 뮤텍스(소유권 있음 · 이진 lock) vs 세마포어(소유권 없음 · 카운팅 변수로 n개 동시 허용) 1) 개념 비교 (프로세스 vs 스레드) 비교 프로세스 (process) 스레드 (thread) 자원·메모리 독립 공간(code·data·heap·stack) code·data·heap 공유 / stack·register 독립 통신·교환 ipc(파이프·공유메모리) · 문맥교환 큼 공유 메모리 직접 접근 · 문맥교환 빠름 안정성 한 프로세스 장애가 타 프로세스 미영향 한 스레드 오류가 전체 프로세스 종료 유발 2) 상세 비교 (뮤텍스 vs 세마포어) 비교 뮤텍스 (mutex) 세마포어 (semaphore) 소유권·개수 소유권 있음 · 1개 스레드만 진입(이진) 소유권 없음 · 카운트(n)만큼 동시 진입 해제 주체 lock을 건 스레드만 unlock 가능 다른 스레드/프로세스도 signal로 해제 가능 두음: 코·데·힙 공유, 스·레 독립 / 뮤(소유1)·세(카운트n) 상호배제·진행·한정대기(상·진·한) 3대 조건과 우선순위 역전(priority inversion) 까지 짚으면 완벽!"}, {"id": "aidc", "cat": "caos", "sub": "caos-infra", "parent": null, "t": "AI 데이터센터 (AIDC)", "s": "All-Reduce·액침냉각·DCI", "stars": 0, "redStar": true, "full": "AI 데이터센터(AIDC) · All-Reduce · DCI", "catLabel": "CA/OS", "st": "📌 복습 필요", "d": "2026-11-23", "def": "<p>대규모 GPU·NPU 클러스터를 고밀도로 수용해 LLM 학습·추론을 수행하도록 <b>전력·냉각·네트워크를 AI 워크로드에 최적화<\/b>한 데이터센터로, 기존 범용 데이터센터와 달리 <b>가속기 밀도·집합통신·초고전력<\/b>이 설계 기준이 됨<\/p>", "kw": "<ul class=\"kw\"><li><b>기존 DC vs AIDC<\/b>: 랙당 5~10kW·범용 CPU·저지연 요구 낮음 <b>vs<\/b> 랙당 40~130kW+·가속기(NPU/GPU) 중심·학습 클러스터 초저지연<\/li><li><b>All-Reduce (집합통신)<\/b>: 분산 학습 시 각 노드의 기울기(Gradient)를 전 노드에 <b>합산·평균<\/b>해 동일 모델로 동기화 — Ring/Tree 알고리즘, NVLink·InfiniBand·RoCE 기반, 통신 병목이 전체 학습시간을 지배<\/li><li><b>냉각<\/b>: 공랭 한계 극복을 위한 <b>액침냉각(Immersion)<\/b>·직접수랭(DLC), PUE 개선 및 폐열 재활용<\/li><li><b>DCI (Data Center Interconnect)<\/b>: 데이터센터 간 <b>대용량·저지연 광전송<\/b>(DWDM·OTN)으로 학습 데이터·모델·분산 클러스터를 연결<\/li><li><b>AIDC 산업 진흥 특별법<\/b>: 전력계통 영향평가·인허가 원스톱(패스트트랙)·입지·계통접속 절차 간소화로 민간 투자 촉진<\/li><\/ul>", "pp": "<h4>1) 기존 데이터센터 vs AI 데이터센터<\/h4>\n<div class=\"tblwrap\"><table class=\"cmp\"><colgroup><col style=\"width:24%\"><col style=\"width:28%\"><col style=\"width:48%\"><\/colgroup><thead><tr><th>비교<\/th><th>기존 데이터센터<\/th><th>AI 데이터센터 (AIDC)<\/th><\/tr><\/thead><tbody><tr><td class=\"k\">주 연산<\/td><td>범용 CPU · 가상화<\/td><td>GPU·NPU 가속기 · 대규모 병렬 연산<\/td><\/tr><tr><td class=\"k\">랙 전력밀도<\/td><td>5~10kW<\/td><td>40~130kW 이상 (초고밀도)<\/td><\/tr><tr><td class=\"k\">냉각 방식<\/td><td>공랭 중심<\/td><td>액침·직접수랭(DLC) 필수<\/td><\/tr><tr><td class=\"k\">네트워크<\/td><td>일반 이더넷·인터넷<\/td><td>InfiniBand·RoCE·NVLink (집합통신)<\/td><\/tr><\/tbody><\/table><\/div>\n<h4>2) 상세 비교 (구현 기술 관점)<\/h4>\n<div class=\"tblwrap\"><table class=\"cmp\"><colgroup><col style=\"width:24%\"><col style=\"width:28%\"><col style=\"width:48%\"><\/colgroup><thead><tr><th>구분<\/th><th>특징<\/th><th>설명<\/th><\/tr><\/thead><tbody><tr><td class=\"k\">전력·냉각<\/td><td>고밀도·액침냉각<\/td><td>전력계통 확보가 최대 병목, PUE 1.1대 목표<\/td><\/tr><tr><td class=\"k\">네트워크<\/td><td>All-Reduce 최적화<\/td><td>Ring/Tree 집합통신, 통신 오버헤드 최소화가 학습속도 결정<\/td><\/tr><tr><td cl
